name: Uprising review
on:
  pull_request:
    paths: ['.github/workflows/uprising-review.yml']
permissions:
  contents: write
concurrency:
  group: foc-uprising-legacy-publication
  cancel-in-progress: false
jobs:
  review:
    if: >-
      github.repository == 'szh112234-png/stellaris-starwars-' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/imperial-uprising-annexation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checksum-verified candidate to allowlisted source files
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          payload = ""
          raw = gzip.decompress(base64.b64decode(payload, validate=True))
          if hashlib.sha256(raw).hexdigest() != "d0fc80ec617067eba4672937d6fb052ddfa288d4b8aab15bbdaace8b43b24823":
              raise SystemExit("Transport checksum mismatch")
          data = json.loads(raw)
          allowed = {
              'common/scripted_triggers/foc_uprising_annexation_triggers.txt',
              'common/scripted_effects/foc_uprising_annexation_effects.txt',
              'common/on_actions/foc_uprising_annexation_on_actions.txt',
              'events/foc_uprising_annexation_events.txt',
              'docs/UPRISING_TEST_PLAN.md',
              'tools/test_uprising_annexation.py',
              'CHANGELOG.md',
          }
          if set(data['files']) != allowed:
              raise SystemExit('Unexpected transport paths')
          legacy = data['legacy']
          if legacy['path'] != 'common/scripted_effects/foc_republic_origin_effects.txt':
              raise SystemExit('Unexpected legacy path')
          path = Path(legacy['path'])
          before = path.read_bytes()
          if hashlib.sha256(before).hexdigest() != legacy['base_sha256']:
              raise SystemExit('Legacy source changed; refusing a stale patch')
          if hashlib.sha256(Path('CHANGELOG.md').read_bytes()).hexdigest() != data['changelog_sha256']:
              raise SystemExit('Changelog changed; refusing to overwrite')
          old, new = legacy['old'].encode(), legacy['new'].encode()
          if before.count(old) != 1:
              raise SystemExit('Legacy block is not unique')
          for name in allowed - {'CHANGELOG.md'}:
              if Path(name).exists():
                  raise SystemExit('Expected a new path: ' + name)
          for name, content in data['files'].items():
              dest = Path(name)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(content.encode('utf-8'))
          path.write_bytes(before.replace(old,new,1))
          for name in sorted(allowed | {legacy['path']}):
              print(name, hashlib.sha256(Path(name).read_bytes()).hexdigest())
          PY
      - name: Focused policy and structure tests
        run: python tools/test_uprising_annexation.py
      - name: Report inherited preflight findings
        run: python tools/preflight.py --report-only
      - name: Publish tested source only to the fix branch
        run: |
          set -eu
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0')
          new = subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')
          paths = {p for p in changed + new if p}
          expected = {
              'common/scripted_effects/foc_republic_origin_effects.txt',
              'common/scripted_triggers/foc_uprising_annexation_triggers.txt',
              'common/scripted_effects/foc_uprising_annexation_effects.txt',
              'common/on_actions/foc_uprising_annexation_on_actions.txt',
              'events/foc_uprising_annexation_events.txt',
              'docs/UPRISING_TEST_PLAN.md',
              'tools/test_uprising_annexation.py',
              'CHANGELOG.md',
          }
          if paths != expected:
              raise SystemExit('Unexpected publication paths: ' + repr(paths))
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          PY
          expected="$(git rev-parse HEAD)"
          remote="$(git ls-remote --heads origin refs/heads/fix/imperial-uprising-annexation | cut -f1)"
          test "$expected" = "$remote"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: safely absorb native Imperial uprising countries'
          git push origin HEAD:refs/heads/fix/imperial-uprising-annexation
