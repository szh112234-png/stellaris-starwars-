###MISC FACTIONS###

 #ORIGINS
 origin_coruscant: "Queen of the Core"
 origin_coruscant_desc: "Start on Coruscant; a ecumenopolis and center of galactic civilization."
 origin_tooltip_coruscant_effects: "- Start in the §YCoruscant System§! on §YCoruscant§!; a §Y$pc_city$§! as your homeworld."
 
 coruscant_origin_init_NAME: "Coruscant System (Generic)"
 coruscant_origin_init_DESC: "Start in the Coruscant system on Coruscant; the center of galactic civilization."
 START_SCREEN_PART_ONE_CORUSCANT: "The planet of Coruscant has long since been the center of trade, commerce, and political power for several galactic civilizations. Known as the 'Galactic City' which encompasses the entire planet in a worldwide ecumenopolis consisting of vast cities and industrial districts both above and below the surface of this world, Coruscant has either become a symbol of Democracy or center of Imperial authority. Regardless of whichever faction holds power over this planet, its cultural and political influence as the 'Queen of the Core' cannot be overstated." 
 
 #GALACTIC REPUBLIC
 origin_galactic_republic: "Galactic Republic"
 origin_galactic_republic_desc: "Start on Coruscant; a ecumenopolis and capital of a long-standing galactic democracy."
 origin_tooltip_galactic_republic_effects: "- Start in the §YCoruscant System§! on §YCoruscant§!; a §Y$pc_city$§! as your homeworld. This origin also offers several era initializers ranging from the old republic to the new republic era for this system start."
 
 #CONFEDERACY OF INDEPENDENT SYSTEMS
 origin_cis_separatists: "Separatist Alliance"
 origin_cis_separatists_desc: "Start on Raxus Secundus; the capital of the Confederacy of Independent Systems."
 origin_tooltip_cis_separatists_effects: "- Start in the §YRaxus System§! on §YRaxus Secundus§!. Includes other major separatist worlds such as Geonosis, Muunilist, Neimoidia, and Skako." 
 
 #GALACTIC EMPIRE
 origin_galactic_empire: "Galactic Empire"
 origin_galactic_empire_desc: "Start on Imperial Center; a ecumenopolis and capital of a galactic empire."
 origin_tooltip_galactic_empire_effects: "- Start in the §YCoruscant System§! on §YCoruscant§!; a §Y$pc_city$§! as your homeworld. This origin also offers several era initializers ranging from the rise of the empire to the legacy era for this system start."
 
 #SITH EMPIRE
 origin_sith_empire: "Sith Empire"
 origin_sith_empire_desc: "Start in either the Dromund, Beshqek, or Exegol Systems; the capitals of the Reconstituted Sith Empire, Dark Empire, and Sith Eternal respectively."
 origin_tooltip_sith_empire_effects: "- Start on §YDromund Kaas§!, §YByss§!, or §YExegol§! as your homeworld."
 
 #SITH TRIUMVIRATE
 origin_malachor: "The Call of Malachor"
 origin_malachor_desc: "There is a place in the galaxy where the dark side of the Force runs strong. It is something of the Sith, but it was fueled by war. It corrupts all that walks on its surface-drowns them in the power of the dark side. It corrupts all life, and it feeds on death."
 origin_tooltip_malachor_effects: "Start on Malachor V; the location of a long-forgotten Sith academy and the headquarters of the Sith Triumvirate."
 
 #SITH ETERNAL 
 origin_exegol: "Throne of the Sith"
 origin_exegol_desc: "Start on Exegol; an ancient Sith stronghold in the Unknown Regions and headquarters of the Sith Eternal cult."
 origin_tooltip_exegol_effects: "Start on Exegol; a tomb world with unique deposits and system modifiers."
 
 #ETERNAL THRONE
 origin_eternal_throne: "Eternal Throne"
 origin_eternal_throne_desc: "Start on Zakuul; the capital of the Eternal Empire."
 origin_tooltip_eternal_throne_effects: "- Start in the §YZakuul System§! on §YZakuul§!; a §Y$pc_tropical$§! as your homeworld. Your first ruler will be granted immortality."
 
 #CHISS ASCENDANCY
 origin_chiss_ascendancy: "Chiss Ascendancy"
 origin_chiss_ascendancy_desc: "Start on Csilla; the capital of the Chiss Ascendancy."
 origin_tooltip_chiss_ascendancy_effects: "- Start in the §YCsilla System§! on §YCsilla§!; a §Y$pc_arctic$§! as your homeworld along with the surrounding systems within chiss space. Your first ruler will be granted immortality."
 
 ###PERSONALITIES###
 personality_confederacy_ai: "Separatists"
 personality_confederacy_ai_desc: "Separatists value free trade and their independence and will fight for both."
 
 personality_galactic_republic_ai: "Republic Citizens"
 personality_galactic_republic_ai_desc: "Republic Citizens value democracy, peace, and trade. They are willing to interact with other like-minded empires to make new alliances."
 
 personality_galactic_empire_ai: "Galactic Imperialists"
 personality_galactic_empire_ai_desc: "Galactic Imperialists believe that it is their right to rule the galaxy and trades freedom for order and security. They tend to dominate weaker empires they encounter through force of arms."
 
 personality_fel_empire_ai: "Tempered Imperialists"
 personality_fel_empire_ai_desc: "Tempered Imperialists are imperials that have a lesser desire for military conquest, preferring to expand their empire through other means."
 
 personality_sith_empire_ai: "Sith Imperialists"
 personality_sith_empire_ai_desc: "Sith Imperialists are empires that are subservient to the Sith Order. They are highly aggressive towards other empires and have a innate desire for power and galactic domination."
  
 personality_first_order_ai: "Imperial Loyalists"
 personality_first_order_ai_desc: "Imperial Loyalists are imperials devoted to an authoritarian state or a single ruler. They will conquer, enslave, or purge anyone that resists their rightful rule over the galaxy."
 
 gov_final_order: "Final Order"
 gov_final_order_desc: "The fascist military junta of the First Order combined with elements of the Sith Eternal cult under the absolute control of the Sith."
 
 personality_ancient_sith_ai: "Sith Zealots"
 personality_ancient_sith_ai_desc: "Sith Zealots are subjects of a Sith Empire, a Magocracy ruled by a Dark Lord of the Sith." 
 
 personality_sith_eternal_ai: "Sith Loyalists"
 personality_sith_eternal_ai_desc: "Sith Loyalists are a cult following to a Sith ruler. They will never engage in peaceful relations with other empires as they find them only as potential targets for Sith dominion."
 
 personality_eternal_empire_ai: "Zakuulan Loyalists"
 personality_eternal_empire_ai_desc: "Zakuulan Loyalists have unwavering loyalty to the immortal emperor and the Eternal Throne. They are unable to form alliances and tend to look down upon other less advanced empires as backwater barbarians believing it is their burden to bring enlightenment through subjugation."
 
 personality_neocrusader_ai: "Mandalorian Warriors"
 personality_neocrusader_ai_desc: "Mandalorian Warriors are a loose collection of warrior clans that seek out strong opponents to test themselves against. They are unlikely to form alliances or engage in non-aggression pacts seeking to involve themselves in combat one form or another. They have a strong disdain for pacifists."

 #Star Wars Standalone Initializers ###

 axum_init_NAME: "Axum System"
 axum_init_DESC: "Start in the Axum system; the prominent military and industrial powerhouse of Axum and Anaxes."
 
 corellia_init_NAME: "Corellia System"
 corellia_init_DESC: "Start in the Corellia system; one of the core founders of the Republic and home to the Corellian Engineering Corporation, a powerful shipbuilding megacorporation."
 
 alsakan_init_NAME: "Alsakan System"
 alsakan_init_DESC: "Start in the Alsakan system in the Deep Core; A major ecumenopolis ruled by the powerful Alsakan Kingdom and old rival to Coruscant."
 
 tython_init_NAME: "Tython System"
 tython_init_DESC: "Start in the Tython system on the force nexus world of Tython."
 
 kashyyyk_init_NAME: "Kashyyyk System"
 kashyyyk_init_DESC: "Start in the Kashyyyk system; the homeworld of the Wookies and the Trandoshans of Trandosha."
 
 naboo_init_NAME: "Naboo System"
 naboo_init_DESC: "Start in the Naboo system on Naboo, a paradise world and homeworld of the Naboo settlers and Gungans."
 
 empress_teta_init_NAME: "Empress Teta System"
 empress_teta_init_DESC: "Start in the Empress Teta system; including the famous ecumenopolis world named after the legacy of Warrior Empress Teta." 
 
 tatooine_init_NAME: "Tatoo System"
 tatooine_init_DESC: "Start in the Tatoo system on the desert planet of Tatooine."
 
 alsakani_monarchy: "Alsakani Monarchy"
 alsakani_monarchy_desc: "Alsakan has a tense rivalry with its Coruscant rival throughout the millennia. Alsakans believed in local independence and limited government while Coruscanti wanted strong centralized government and trade. The two would eventually wage over seventeen wars over ideology known as the Alsakan Conflicts. Alsakans are a very proud aristocracy and are fiercely independent."
 
 xenvaer_city: "Xenvaer City"
 xenvaer_city_desc: "The largest city on Alsakan containing several tourist attractions and major trading centers."
 
 wookie_agriculture: "Agricultural Moon"
 wookie_agriculture_desc: "This moon of Kashyyyk is an agricultural hub for the Wookies."
 
 trandoshan_slavers: "Trandoshan Slavers"
 trandoshan_slavers_desc: "Trandoshans have always been a point of conflict with the indigenous Wookies of Kashyyyk. Many slavers hunt Wookies for either sport or for credits as a way to earn Jagannath points for the favor of their mythical Scorekeeper."
 
 hunting_grounds: "Hunting Grounds"
 hunting_grounds_desc: "The moon of Wasskah was made into a hunting ground for Trandoshan hunters performing their rites of becoming a hunter. They mostly use slaves transported from other worlds and let them loose on the world for the inevitable hunt."
 
 wookiee_slave_trade: "Wookiee Slave Trade"
 wookiee_slave_trade_desc: "Due to their strong physique, Wookiees are prized among many slavers that come to the world to capture them for hard labor on other worlds."
 
 wookiee_villages: "Wookiee Villages"
 wookiee_villages_desc: "The Wookies of Kashyyyk have built multiple treetop villages across the planet that serve as a natural hub for trade and commerce with the local Wookiees."
 
 shadowlands: "Shadowlands"
 shadowlands_desc: "Also known as the Shadow Forest is the dark ground level of the forests on Kashyyyk. The area was extremely dangerous as large savage beasts like the Katarns and vicious Terentateks would prowl in the dark corners of the Shadowlands. Wookies seldom make journeys to the Shadowlands unless they are performing the rites where a Wookiee would go to prove themselves against the forest's strong, natural obstacles. Wookies that have commited crimes were also exiled to the Shadowlands."
 
 cinnagar_city: "Cinnagar City"
 cinnagar_city_desc: "The capital city of Empress Teta is a major trade and commercial hub including the Great Library of Cinnagar, a massive library within the city that holds countless works of art, literature, and science."
 
 theed_city: "City of Theed"
 theed_city_desc: "A major settlement on Naboo, the city is also home to the Theed Royal Palace on Naboo."
 
 gungan_city: "Otoh Gunga"
 gungan_city_desc: "An underwater city built by the Gungans and the seat of their government."
  
 
 #TATOOINE
 
 mos_eisley: "Mos Eisley Spaceport"
 mos_eisley_desc: "A large spaceport on the planet Tatooine located on the Great Mesra Plateau, north of Anchorhead and southeast of the Jundland Wastes. The settlement attracts visitors from across the galaxy to mingle within the town's cantinas and markets. It was also well-known that you'll never find a more wretched hive of scum and villainy anywhere in the galaxy."   
 
 tusken_raiders: "Tusken Raiders"
 tusken_raiders_desc: "An indigenous race of nomadic primitive lifeforms on Tatooine. They were highly territorial, hostile, and violent towards any outsider who trespasses on their land. They also at times form raiding parties to pillage Tatooine's settlements of supplies and kidnapping settlers."

 sw_creature: "SW Aliens"
 sw_creature_desc: "Non-Sentient aliens from the Star Wars Universe."

 
 #DEPOSITS
 
 #CORUSCANT 
 d_senate_district: "Federal District"
 d_senate_district_desc: "Captial of the Galactic City on Coruscant, this district bordered the Financial and Sah'c Districts that houses many administrative buildings including the Senate Building."
 
 d_the_works: "The Works"
 d_the_works_desc: "Large industrial areas on Coruscant known as sector 943 that served as a major manufacturing center for many companies on Coruscant."
 
 #CITY WORLD DISTRICTS
 d_industrial_districts: "Industrial Districts"
 d_industrial_districts_desc: "Large industrial areas that serve as major manufacturing centers."
 
 d_galactic_city: "Ecumenopolis Cityscape"
 d_galactic_city_desc: "A planet-wide city filled with endless towering skyscrapers."
 
 d_coruscant_hydroponics: "Hydroponics Facilities"
 d_coruscant_hydroponics_desc: "Hydroponic plants used to produce water and grow food."
 
 #KORRIBAN
 d_valley_of_the_dark_lords: "Valley of the Dark Lords"
 d_valley_of_the_dark_lords_desc: "A burial ground for many Sith Kings and eventually Sith Lords. Many of the tombs still house forbidden artifacts and treasures that date back to the Golden Age of the Sith."
 
 d_sith_academy: "Sith Academy"
 d_sith_academy_desc: "A large pyramidal facility used to train force-sensitives in the ways of the Sith."
 
 d_dreshdae_settlement: "Dreshdae Settlement"
 d_dreshdae_settlement_desc: "The only habitable settlement on Korriban that serves as its capital and center of trade on this desolate world."
 
 #DROMUND KAAS
 d_kaas_city: "Kaas City"
 d_kaas_city_desc: "A massive metropolitan city and capital of the Sith Empire home to many important Sith Lords."
 
 d_dark_temple: "Dark Temple"
 d_dark_temple_desc: "An expansive Sith structure that contained several tombs of long-dead Sith Lords that still haunt the structure."
 
 d_lightning_spikes: "Lightning Spikes"
 d_lightning_spikes_desc: "A series of large towers with the purpose of absorbing energy passed from lightning strikes that are common on Dromund Kaas."
 
 #RAKATA PRIME
 d_temple_of_the_ancients: "Temple of the Ancients"
 d_temple_of_the_ancients_desc: "A large and ancient Rakatan structure that holds untold forbidden knowledge of the Builders."
 
 d_technological_graveyard: "Technological Graveyard"
 d_technological_graveyard_desc: "An active disruptor field on the surface of Lehon has forced many travelers to crash onto the planet with no way of escape from the barbaric rakatan tribes leaving their vast ship hulks to litter the surface of Rakata Prime."
 
 #SW ARMIES
 
 ####################################
 # SITH ARMIES
 ####################################

 sith_warriors: "Sith Warriors"
 sith_warriors_desc: "Sith combat specialists that serve as front-line units. Entrusted with the task of destroying their enemies and enforcing Sith domination across the galaxy."
 
 sith_juggernauts: "Sith Juggernauts"
 sith_juggernauts_desc: "An advanced class of sith warrior that specializes in combat endurance wearing enhanced armor that provided them special protection in battle."
 
 sith_marauders: "Sith Marauders"
 sith_marauders_desc: "An advanced class of sith warrior that specializes in dual lightsabers and dealing high amounts of carnage upon their enemies in melee combat. They are far more agile than their juggernaut counterparts, but less armored."
 
 sith_lord: "Sith Lord"
 sith_lord_desc: "A title conferred on members of the Sith Order who have considerable knowledge of and strength in the dark side of the Force. Typically armed with a crimson red lightsaber and several destructive force abilities, these Sith Lords are among the most powerful members of their order."
 
 sith_acolytes: "Sith Acolytes"
 sith_acolytes_desc: "Also known as Dark Jedi, Sith Acolytes serve as apprentices, trainees, and enforcers within the Sith Order. Although they lack the experience of a fully-trained Sith Lord, they are far more numerous and still trained in a number of various lightsaber forms and dark side powers in the service of their masters."
 
 sith_inquisitors: "Sith Inquisitors"
 sith_inquisitors_desc: "A class of powerful force users that focused on offensive force abilities as opposed to martial might."
 
 sith_sorcerers: "Sith Sorcerers"
 sith_sorcerers_desc: "An advanced class of sith inquisitors that were proficient in the arts of Sith magic, using powerful spells and rituals to create terrifying force abilities, usually in the form of force storms to devastate entire armies."
 
 sith_assassins: "Sith Assassins"
 sith_assassins_desc: "A sect of covert Force-sensitive killers from the Sith Order specializing in deception and assassination. They specialize in infiltrating and demoralizing enemy ranks through stealth, subterfuge, and misdirection. Usually armed with a double-bladed lightsaber used to channel their dark side abilities into the blade itself."
 
 sith_imperial_army_division: "Imperial Trooper Division"
 sith_imperial_army_division_desc: "Sith troopers of the imperial military equipped with black duraplast body armor and armed with an array of blasters. Each soldier is highly disciplined and conditioned for front-line combat."

 sith_mark_1_war_droids: "Mark I War Droids"
 sith_mark_1_war_droids_desc: "Four-legged sith war droids equipped with powerful energy shields and four mounted blaster cannons."
 
 sith_imperial_walker_division: "Imperial Walkers"
 sith_imperial_walker_division_desc: "Two-legged imperial walkers armed with an array of blaster cannons and missile launchers to offer fire support for ground units."
 
 sith_imperial_crawler_artillery_tank: "Imperial Crawler Tank"
 sith_imperial_crawler_artillery_tank_desc: "Large armored vehicles used as both transports and heavy artillery."
 
 sith_imperial_juggernaut_tank: "Imperial Juggernaut Tank"
 sith_imperial_juggernaut_tank_desc: "A massive wheeled armored tank used for heavy combat in hostile conditions armed with an array of heavy weapons and laser cannons." 
 
 sith_mark_vi_fighter_squadron: "Mark VI ISF Interceptor Squadron"
 sith_mark_vi_fighter_squadron_desc: "A squadron of space-superiority fighters that are fast, nimble, and armed with four laser cannons."
 
 sith_extinction_bomber_squadron: "B28 Extinction Bomber Sqaudron"
 sith_extinction_bomber_squadron_desc: "A squadron of sith bombers carrying proton bombs and torpedoes to destroy heavily fortified targets." 
 
 RT_DARK_LORD_OF_THE_SITH: "Dark Lord of the Sith"
 RT_DARK_LADY_OF_THE_SITH: "Dark Lady of the Sith"
 HT_SITH_APPRENTICE: "Sith Apprentice"
 HT_SITH_APPRENTICE_FEMALE: "Sith Apprentice"
 
 
 ####################################
 # JEDI ARMIES
 ####################################
 
 jedi_padawans: "Jedi Padawans"
 jedi_padawans_desc: "Initiates that serve as apprentices to a Jedi Knight or Master within the Jedi Order. Although they lack the experience of a fully-trained Jedi Knight, they are still adept in a number of basic force abilities and lightsaber combat forms."
 
 jedi_knights: "Jedi Knights"
 jedi_knights_desc: "Knights of the Jedi Order entrusted with the task of protecting the innocent and defending the galaxy armed with a jedi lightsaber and powerful force abilities."
 
 jedi_guardians: "Jedi Guardians"
 jedi_guardians_desc: "The stalwart defenders of the Jedi Order, these armored knights specialize in lightsaber combat, inspiring allies, and defensive force abilities."
 
 jedi_sentinels: "Jedi Sentinels"
 jedi_sentinels_desc: "Jedi knights that specialize in offensive close-quarters lightsaber combat using two lightsabers. They are highly skilled warriors, using speed and precision to strike enemies where they are weakest."
 
 jedi_master: "Jedi Master"
 jedi_master_desc: "The highest formal rank within the Jedi Order reserved for those who have shown exceptional devotion and skill in the Force. Typically armed with a lightsaber and an array of powerful advanced force abilities, Jedi Masters are among the most powerful members of their order."
 
 jedi_consulars: "Jedi Consulars"
 jedi_consulars_desc: "Jedi force-users that focus primarily in the ways of the Force capable of subduing their targets using telekinetic powers and lightsabers alike." 
 
 jedi_sages: "Jedi Sages"
 jedi_sages_desc: "Powerful Jedi force-users that specialize in telekinetic force abilities and healing. They are adept at ranged attacks with the Force."
 
 jedi_shadows: "Jedi Shadows"
 jedi_shadows_desc: "A sect of covert Force-sensitive hunters from the Jedi Order originally tasked with seeking out and destroying sith artifacts. They are trained for espionage and covert operations specializing in demoralizing the enemy through stealth, subterfuge, and misdirection. Although they are capable fighters, they not suited for direct combat."
 
 RT_GRAND_MASTER: "Grandmaster"
 RT_JEDI_COUNCILOR: "Jedi Councilor"
 HT_JEDI_APPRENTICE: "Jedi Padawan"
 HT_JEDI_APPRENTICE_FEMALE: "Jedi Padawan"
 
 
 
