l_english:
 FOC_SITH_WAYFINDER_GATE:0 "Sith Wayfinder Gate"
 FOC_SITH_WAYFINDER_PROJECT:0 "The Sith Wayfinder"
 FOC_SITH_WAYFINDER_PROJECT_DESC:0 "Destroy a Final Order ship, obtain Kylo Ren, or complete the Jakku excavation to recover a Wayfinder clue. The first empire to decode a clue receives the physical §YSith Wayfinder§! relic and immediate safe access to Exegol. Other empires may still decode their own coordinates, so an AI cannot permanently lock the player out by obtaining the artifact first. If the Final Order remains openly active for three years, the galaxy will eventually reconstruct an emergency assault route."
 foc_wayfinder.3.name:0 "The Route to the Unknown Regions"
 foc_wayfinder.3.desc:0 "We have decoded the Wayfinder data. The special gate at Jakku now locks onto a hidden route toward Exegol. If we were the first to complete the analysis, the physical Sith Wayfinder has also entered our relic vault; if another power already holds it, our independent coordinates are still sufficient for safe passage."
 foc_wayfinder.3.a:0 "Record the coordinates. Prepare for Exegol."
 foc_sith_wayfinder_gate:0 "Sith Wayfinder Gate"
 foc_sith_wayfinder_gate_DESC:0 "A special gateway leading to a star system somewhere in the Unknown Regions."
 NAME_FOC_SITH_WAYFINDER_JAKKU_GATE:0 "Unknown Regions Gateway"
 NAME_FOC_SITH_WAYFINDER_EXEGOL_GATE:0 "Exegol Sith Wayfinder Gate"

 foc_wayfinder.8.name:0 "Emergency Route to Exegol"
 foc_wayfinder.8.desc:0 "Years of open Final Order operations have left enough flight traces, gravitational disturbances and intercepted communications for our intelligence services to reconstruct a dangerous but usable assault route to Exegol, even without the physical Sith Wayfinder."
 foc_wayfinder.8.a:0 "No artifact will keep us out of this war forever."
