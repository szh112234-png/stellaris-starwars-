l_english:
 foc_v232j_fleet_capacity_99999:0 "Universal Naval Capacity"
 foc_v232j_fleet_capacity_99999_desc:0 "Every country receives 99999 naval capacity, with the engine naval-capacity ceiling set to 99999. Applies to players, AI and newly created countries regardless of faction or era. Fleet command limit, reinforcement waves, ship counts and combat bonuses are unchanged. Other capacity multipliers or external mod overrides can still affect the final result."
