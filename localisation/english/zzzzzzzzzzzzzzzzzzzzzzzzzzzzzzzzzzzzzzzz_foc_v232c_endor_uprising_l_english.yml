l_english:
 foc_luke.19.name:0 "The Final Redemption: The Chosen One's Destiny"
 foc_luke.19.desc:0 "Inside Death Star II's throne room, Luke Skywalker gives in to anger long enough to sever Darth Vader's mechanical right hand. Seeing his broken father brings him back to himself. Luke throws away his lightsaber and rejects the dark side: ‘I am a Jedi, like my father before me.’\n\nEnraged, Emperor Palpatine unleashes lethal §HForce lightning§! upon Luke. As the young Jedi collapses, he cries out to his father for help.\n\nVader struggles beneath the sound of his mechanical breathing. At last, love for his son overcomes the darkness. He seizes the Emperor, lifts him through the lightning, and hurls him into the reactor shaft. Palpatine is destroyed, but Vader's life-support armor is fatally disabled.\n\nWith the station collapsing, Luke drags his father toward a shuttle. Vader asks for his mask to be removed so that he can look upon his son with his own eyes. Beneath it is no monster, only the scarred face of Anakin Skywalker.\n\n‘You already have, Luke. You were right about me. Tell your sister... you were right.’ Anakin closes his eyes in peace.\n\nLater, a funeral pyre burns in the forests of Endor. Beside the Rebel celebration stand the Force spirits of Obi-Wan Kenobi, Yoda, and a restored young §HAnakin Skywalker§!. The Chosen One has returned to the light and brought balance to the Force.\n\n§YDarth Vader and Emperor Palpatine are both dead.§!"
 foc_luke.19.a:0 "The Chosen One has returned to the light."

 foc_republic_origin.176.desc:0 "§LWhen the second Death Star broke apart above Endor, the fear holding the Empire together broke with it.§!\n\nSystems that truly belong to the Inner Rim uprising rise almost at once. Coruscant and Kuat must still be taken by force.\n\n§HAl'doleem, Rendili, Christophsis, Utapau and Jedha§! are explicitly outside this Inner Rim uprising and therefore do not automatically join the Rebels when both Death Stars are lost. Their final post-Concordance ownership remains governed by the Treaty territory rules. Jakku remains outside as postwar Imperial Remnant territory.\n\n§YMechanic: the uprising transfers eligible New Republic Treaty systems while explicitly excluding Al'doleem, Rendili, Christophsis, Utapau, Jedha, Coruscant and Kuat.§!"
