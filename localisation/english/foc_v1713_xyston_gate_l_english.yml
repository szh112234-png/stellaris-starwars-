 XYSTONSD_GUN_desc:0 "Xyston exclusive T-slot superlaser. Fixed base damage per hit: 350,000. Hull damage x60 (+5900%), shield damage x40, armor damage x20. 100% shield and armor penetration; hardening still counters penetration. Nominal reload on the default design: about 30 days, excluding windup; fire-rate modifiers can change the interval. Single-hit damage order: Death Star I = Death Star II > Eclipse > Xyston. Not a DPS order. §REquipping reduces this ship's shield capacity by 100%. Construction is limited to the Final Order.§!"
 XYSTONSD_GUN_FOC_LOWEST_desc:0 "Xyston-exclusive axial superlaser. §REquipping it reduces this ship's shield capacity by 100%.§!"
 XYSTONSD_GUN_FOC_FIXED_LOWEST_desc:0 "Xyston-exclusive axial superlaser. §REquipping it reduces this ship's shield capacity by 100%.§!"
 FOC_KHAN_XYS_T_desc:0 "Xyston exclusive T-slot superlaser. Fixed base damage per hit: 350,000. Hull damage x60 (+5900%), shield damage x40, armor damage x20. 100% shield and armor penetration; hardening still counters penetration. Nominal reload on the default design: about 30 days, excluding windup; fire-rate modifiers can change the interval. Single-hit damage order: Death Star I = Death Star II > Eclipse > Xyston. Not a DPS order. §REquipping reduces this ship's shield capacity by 100%. Construction is limited to the Final Order.§!"