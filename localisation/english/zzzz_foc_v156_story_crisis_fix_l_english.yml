 foc_rey.1.name:0 "The Scavenger of Jakku"
 foc_rey.1.desc:0 "The First Order now controls Jakku. Among the wreckage of the old Galactic Civil War, a young scavenger named Rey has survived by pulling machinery from the bones of fallen warships. Leia Organa's network has made contact with her. What first appeared to be an ordinary survivor carries an extraordinary connection to the Force.\n\n§YRey joins Leia's Rebels/Resistance as a native Legendary leader.§!"
 foc_rey.1.a:0 "Bring her into the Resistance."
