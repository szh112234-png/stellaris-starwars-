 r_foc_ancient_jedi_lightsaber:0 "Ancient Jedi Lightsaber"
 r_foc_ancient_jedi_lightsaber_desc:0 "A Jedi lightsaber recovered from the buried archives of Ossus. No surviving inscription identifies its owner; it therefore represents not one famous legend, but the discipline, responsibility and legacy of countless ordinary Jedi of the late Republic."
 foc_phase1_lightsaber_relic_triumph:0 "Lightsaber Legacy Training"
 foc_phase1_lightsaber_relic_triumph_desc:0 "Study of the recovered weapon, old forms and Jedi training material is reshaping officer education and Force research."

 foc_phase1_arch.12.name:0 "The Last Training Room"
 foc_phase1_arch.12.desc:0 "Beside the core of the Ossus archive, the team opens a sealed training chamber and finds a Jedi lightsaber without an identifying inscription. Its power cell is dead, but the kyber crystal, emitter matrix and hilt remain intact.\n\nIt is not the relic of a famous Master. That is precisely why it feels like a surviving testimony of the old Jedi Order itself."
 foc_phase1_arch.12.a:0 "Preserve the nameless Jedi lightsaber."

