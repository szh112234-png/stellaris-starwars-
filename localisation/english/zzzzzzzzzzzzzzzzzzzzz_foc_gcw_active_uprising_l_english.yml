l_english:
 operation_foc_gcw_instigate_system_uprising:0 "Instigate System Uprising"
 operation_foc_gcw_instigate_system_uprising_desc:0 "§ROnly targets the Galactic Empire.§!\n\nChoose an Imperial colony system without a mobile Imperial combat fleet and outside its local suppression cooldown. Establish resistance cells, expand the underground network, arm it, and launch a local uprising. The revolt is resolved by the Empire's normal response event rather than directly handing over the system.\n\n§YThis operation is repeatable, not once per campaign.§! Each attempt still requires 10 spy-network power and 180 influence, with 12 monthly energy upkeep. Once the previous operation is completed or cancelled, another eligible target may be selected. The existing shared target-selection process reserves one such operation at a time.\n\nOnly mobile Imperial combat fleets block or interrupt it; starbases, platforms, science ships, constructors, colony ships and transports do not."
 foc_gcw_active.1.name:0 "Select Uprising Target"
 foc_gcw_active.1.desc:0 "Choose the Imperial system that our operatives will organize. Refresh the list if the desired system is not shown."
 foc_gcw_active.target.more:0 "More targets..."
 foc_gcw_active.target.cancel:0 "Cancel this operation."
 foc_gcw_active.10.name:0 "Establish Secret Contacts"
 foc_gcw_active.10.desc:0 "Our operatives are establishing clandestine contacts in the §Y[event_target:foc_gcw_active_uprising_target_system.GetName]§! system."
 foc_gcw_active.20.name:0 "Build the Underground Network"
 foc_gcw_active.20.desc:0 "The resistance in §Y[event_target:foc_gcw_active_uprising_target_system.GetName]§! is being organized into a resilient underground network."
 foc_gcw_active.30.name:0 "Arm the Partisans"
 foc_gcw_active.30.desc:0 "Weapons and advisers are being smuggled into the §Y[event_target:foc_gcw_active_uprising_target_system.GetName]§! system."
 foc_gcw_active.40.name:0 "Launch the Uprising"
 foc_gcw_active.40.desc:0 "Everything is ready in §Y[event_target:foc_gcw_active_uprising_target_system.GetName]§!. The local resistance awaits the final signal."
 foc_gcw_active.continue:0 "Continue the operation."
 foc_gcw_active.launch:0 "Transmit the uprising signal!"
 foc_gcw_active.abort:0 "The target is no longer valid. Abort."
