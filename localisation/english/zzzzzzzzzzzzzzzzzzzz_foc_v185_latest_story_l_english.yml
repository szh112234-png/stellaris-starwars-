l_english:
 FOC_KHAN_RESISTANCE:0 "Resistance"
 foc_v185_flow.2.name:0 "Starkiller Base Complete"
 foc_v185_flow.2.desc:0 "§LThe last focusing arrays beneath Ilum have locked into place. There is no ceremony—only a growing stream of allegiance signals across the fleet net.§!\n\n§HStarkiller Base§! is fully operational. With the weapon complete, any surviving §HImperial Remnant§! assets are absorbed into the First Order immediately.\n\nThe galactic war has not yet begun. §YThe first real firing of Starkiller Base will end the secret phase at once: the player First Order will become a crisis and enter total war with the galaxy.§!"
 foc_v185_flow.2.a:0 "Let them keep believing the peace will last."

 fop_origin.20.name:0 "The First Shot: A Galactic New Order"
 fop_origin.20.desc:0 "§LA beam has crossed the stars and completed Starkiller Base's first real combat firing. Secrecy is no longer possible.§!\n\nThe galaxy has seen what the First Order can do. The hidden buildup ends now. §YThe player immediately enters the crisis path and every independent galactic power—including dormant and awakened Fallen Empires—will be drawn into total war against the First Order.§!\n\nThe target does not matter: any confirmed real shot starts the war. If the target is the §HHosnian system§!, the collapse and liquidation of the New Republic is triggered in addition."
 fop_origin.20.a:0 "Declare war on the galaxy."


 foc_khan_rebel.3.name:0 "D'Qar: The Resistance Is Established"
 foc_khan_rebel.3.desc:0 "§LGuidance lights come alive beneath D'Qar's forest canopy. There is no Republic parade and no Senate authorization.§!\n\nLeia Organa has reorganized veterans, New Republic officers, local defenders, intelligence personnel and young pilots into an independent force. §HD'Qar's colony and starbase now formally belong to the Resistance.§!\n\nThe Resistance will continue through the D'Qar—Crait—Ajan Kloss story chain."
 foc_khan_rebel.3.a:0 "The war is not over."

 foc_republic_origin.165.desc:0 "§LThe routes into the Unknown Regions are complete, and a hidden plan has become a real strategic threat.§!\n\nThe Ilum—Jakku link is established and §HStarkiller Base, Supremacy and Resurgent§! technologies are unlocked. If the surviving state is the post-Treaty Imperial Remnant, it adopts the First Order identity and resumes secret rearmament.\n\nIf Leia's Resistance does not yet exist, completing the First Order Plan now triggers her move to §HD'Qar§!. The original timed foundation remains active as a fallback for routes that never complete the Plan.\n\n§YCompleting Starkiller Base does not by itself begin galactic total war. The first real shot makes the player First Order a crisis and starts the war with the galaxy.§!"
 foc_republic_origin.165.a:0 "The plan can no longer be reversed."


 foc_luke.21.desc:0 "Twenty-three years after the Galactic Treaty, the darkness around §HBen Solo§! erupts. Fire consumes the Jedi Temple on §HOssus§!, shattering Luke's rebuilt Order. Ben disappears into Snoke's shadow and will fully become Kylo Ren when the First Order enters open war.\n\nIn the same year, the political campaign against Leia Organa reaches its breaking point. If the §HD'Qar Resistance network§! is not already prepared, this historical point triggers Leia's departure from the New Republic political establishment and prepares the covert network on D'Qar; §Yit does not create a second country§!. The player remains the New Republic until Hosnian is destroyed or the Republic truly falls, when that same country object reorganizes as the Resistance."
 foc_luke.21.a:0 "The Jedi have suffered a devastating blow."
