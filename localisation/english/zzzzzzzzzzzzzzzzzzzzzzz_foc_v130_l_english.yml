l_english:
 r_foc_darksaber:0 "Darksaber"
 r_foc_darksaber_desc:0 "The black-bladed lightsaber forged by Tarre Vizsla, the first Mandalorian Jedi. For centuries it has been both a weapon and a political symbol of Mandalorian legitimacy—capable of uniting clans or dragging them into another succession war."
 foc_phase1_darksaber_relic_triumph:0 "Call of the Darksaber"
 foc_phase1_darksaber_relic_triumph_desc:0 "The Darksaber is being displayed as a symbol of war and clan unity, drawing warriors and local allies to the cause."

 r_foc_sith_wayfinder:0 "Sith Wayfinder"
 r_foc_sith_wayfinder_desc:0 "An ancient Sith navigation device able to plot a safe course through the extreme conditions of the Unknown Regions and lock onto the hidden route to Exegol. Possessing the physical Wayfinder grants earlier and safer access, but it is not an irreplaceable key capable of locking the galaxy out forever."
 foc_phase1_sith_wayfinder_relic_triumph:0 "Wayfinder Navigation Solution"
 foc_phase1_sith_wayfinder_relic_triumph_desc:0 "Wayfinder navigation algorithms are being distributed across the fleet, improving FTL preparation, long-range navigation and decryption."
