 foc_hero_rewards.1.name:0 "The Millennium Falcon"
 foc_hero_rewards.1.desc:0 "As Starkiller Base breaks apart in fire, a familiar YT-1300 freighter punches through the blast front. The §YMillennium Falcon§! delivers the last survivors to our capital. Her hull is scarred and her engines still roar with defiance—the ship that witnessed the fall of the Empire is ready to enter the war again."
 foc_hero_rewards.1.a:0 "She's ours."
 foc_hero_rewards.2.name:0 "The Death of Princess Leia and the Return of Ben Solo"
 foc_hero_rewards.2.desc:0 "After Luke Skywalker's passing, Princess Leia Organa spends the last of her life reaching through the Force to her son. Her death breaks Kylo Ren's final bond to darkness; he casts aside the path of the Sith and returns as §YBen Solo§!. To keep this established hero recognizable to the player, he remains listed as §YKylo Ren§! and is ready to lead our armies against Exegol."
 foc_hero_rewards.2.a:0 "Welcome back, Ben."
 foc_hero_rewards.4.name:0 "The Death of Ben Solo"
 foc_hero_rewards.4.desc:0 "Ben Solo has personally led our armies onto Exegol. Beneath the shadow of the Sith citadel, he gives his life to break the final defenses and becomes one with his family in the Force. The §YKylo Ren§! hero has died; his sacrifice places Exegol and its system starbase under our control."
 foc_hero_rewards.4.a:0 "May the Force be with you, Ben."
