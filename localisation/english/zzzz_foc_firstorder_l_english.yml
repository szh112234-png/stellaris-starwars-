 gov_first_order: "First Order"
 gov_first_order_desc: "An autocratic military junta formed from the remnant of the Galactic Empire. The First Order's government structure is entirely based on a military hierarchy, removing any distinction between military and state." 
 
 RT_SUPREME_LEADER: "Supreme Leader"
 RT_SUPREME_LEADER_FEMALE: "Supreme Leader"
 HT_ALLEGIANT_GENERAL: "Allegiant General"
 HT_ALLEGIANT_GENERAL_FEMALE: "Allegiant General"
 
 gov_sith_eternal: "Sith Cult"
 gov_sith_eternal_desc: "A secret fanatical cult created to serve and worship the Sith Order and the Dark Lord of the Sith." 
 
 RT_DARK_LORD_OF_THE_SITH: "Dark Lord of the Sith"
 RT_DARK_LADY_OF_THE_SITH: "Dark Lady of the Sith"
 HT_SITH_APPRENTICE: "Sith Apprentice"
 HT_SITH_APPRENTICE_FEMALE: "Sith Apprentice"
 
 gov_final_order: "Final Order"
 gov_final_order_desc: "The fascist military junta of the First Order combined with elements of the Sith Eternal cult under the absolute control of the Sith."
 
 civic_first_order_military: "Project Resurrection"
 civic_first_order_military_desc: "An operation supported by the First Order that focuses on strengthening both the military with new recruits and cutting-edge technology."
 
 civic_sith_cult: "Sith Cult"
 civic_sith_cult_desc: "There are many forms of Sith cults throughout the galaxy from the Cult of Exar Kun to the Disciples of Ragnos. However, all show an undying reverence to the Sith. Empires that have large organized Sith cults will often have a charismatic individual strong in the dark side of the Force to inspire faith. Palpatine's Sith Eternal was one such cult. Selecting this civic will add the §YChosen One§! trait to your starting ruler and unlock §YPsionic Theory§! technology."  
 
 #ORIGIN
 origin_fo_supremacy: "The Supremacy"
 origin_fo_supremacy_desc: "A Mega-class Super Star Destroyer that serves as the mobile headquarters of the First Order."
 origin_tooltip_origin_fo_supremacy_effects: "Start on the Supremacy; a Mega-class Super Star Dreadnought that serves as your mobile capital and production facility." 
 
 sm_supremacy_foundry: "Supremacy Foundry"
 sm_supremacy_foundry_desc: "Serving as the capital of the First Order, the Mega-class Star Dreadnought is a massive warship that has all the amenities necessary from being a fully self-sustaining deep space habitat to an advanced mobile shipyard that rivals most industrial worlds."
 
 trait_imperial: "Imperial"
 trait_imperial_desc: "Ambitious, arrogant, and ruthless, imperials are patriots that value order, security, and loyalty to the state."
 
 trait_sith_cultist: "Sith Cultist"
 trait_sith_cultist_desc: "Secretive, dangerous, and highly fanatical, Sith sects serve their masters with undying fanaticism and reverence to the dark side of the force."
 
 name_list_first: "First Order"
   
 FLAG_CATEGORY_first: "First Order"
 
 starkiller_system_NAME: "Starkiller System"
 starkiller_system_DESC: "Start on Starkiller Base, a superweapon of immense power built into the planet of the Jedi Order's sacred world of Ilum. The First Order's mobile star dreadnought is also nearby."
 
 exegol_init_NAME: "Exegol System"
 exegol_init_DESC: "Start on Exegol; a hidden ancient bastion of the Sith and headquarters of the Sith Eternal cult and Final Order."
 

 ################
 #EXEGOL
 ################.
 origin_sith_eternal: "Cult of the Sith"
 origin_sith_eternal_desc: "A secretive cult that worships the dark side of the Force and the ancient Sith as the true masters of this galaxy."
 origin_tooltip_sith_eternal_effects: "Start in the Exegol System on Exegol; a desolate planet and the location of long-forgotten sith fortress." 
 
 sith_fortress: "Sith Fortress World"
 sith_fortress_desc: "An ancient Sith temple located on the hidden Sith world of Exegol and headquarters of the Sith Eternal cult and the Throne of the Sith. The citadel itself was a massive underground fortress with a large, upside-down pyramid structure made of black stone located on the surface."
 
 building_sith_citadel: "Sith Citadel"
 building_sith_citadel_desc: "An ancient Sith fortress on the planet Exegol. It is the headquarters of the Sith Eternal Cult and contained the Throne of the Sith."
 
 d_sith_citadel: "Sith Citadel"
 d_sith_citadel_desc: "An ancient Sith fortress containing vast monuments to the Sith. Underneath the fortress lies an ancient shipyard and forge."
 
 ################
 #Starkiller Base
 ################
 thermal_oscillator: "Thermal Oscillator"
 thermal_oscillator_desc: "Located on the surface of Starkiller Base, this component stores and houses dark energy collected from the star it orbits. This provides sufficient energy to not only power the base itself, but provide a boost towards physics research."
 
 fortress_world: "Fortress World"
 fortress_world_desc: "Serving as a stronghold within First Order space, this converted mobile ice planet houses legions of soldiers, officers, and scientists that patrol and operate the machinery on the planet. It is also equipped with a planetary shield generator to defend against orbital bombardment." 
 
 ##########
 #Supremacy
 ##########
 
 supremacy_initializer_NAME: "The Supremacy"
 supremacy_initializer_DESC: "Start on the Supremacy; the First Order's mobile capital ship."
 
 weapon_testing_labs: "Weapon Testing Labs"
 weapon_testing_labs_desc: "On the edge of each wing houses a number of top-secret research and weapon facilities providing the latest in research technology."
 
 mobile_capital: "Mobile Capital"
 mobile_capital_desc: "Serving as a command center, shipyard, and training facility, the Supremacy is considered a mobile city with amenities that rival most capital worlds."

 mobile_training_facility: "On-board Training Facilities"
 mobile_training_facility_desc: "This massive ship offers fully operational training facilities and barracks for entire legions of soldiers."
 
 hyperspace_tracker: "Shipboard Tracking Control Complex"
 hyperspace_tracker_desc: "Recently developed by General Armitage Hux, this active tracker allowed the Supremacy to detect starships traveling through hyperspace. It used a static hyperspace field generator that accelerated computation speed and calculations to unimaginable levels." 
 
 pc_invisible_star: "Deep Space"
 pc_invisible_star_desc: "The deep expanse of space."
 
 district_supremacy_housing: "Crewmen Deck"
 district_supremacy_housing_plural: "Crewmen Decks"
 district_supremacy_housing_desc: "The Supremacy houses millions of crewmen throughout the ship providing basic amenities and on-board hydroponic facilities." 
 
 district_supremacy_energy: "Fusion Generator Facility"
 district_supremacy_energy_plural: "Fusion Generator Facilities"
 district_supremacy_energy_desc: "The Supremacy is powered by several large Fusion Generators that power the massive ship."
 
 district_supremacy_science: "Research Lab"
 district_supremacy_science_plural: "Research Labs"
 district_supremacy_science_desc: "The Supremacy houses cutting-edge research centers to provide technological advancements for the First Order."
 
 district_supremacy_mining: "Asteroid Collector Facility"
 district_supremacy_mining_plural: "Asteroid Mining Facilities"
 district_supremacy_mining_desc: "The Supremacy is a self-sustaining warship that can harvest resources through asteroid processing centers to fuel their industrial production facilities."
 
 district_supremacy_arms_industry: "Vehicle Operation Deck"
 district_supremacy_arms_industry_plural: "Operation Decks"
 district_supremacy_arms_industry_desc: "The Supremacy houses war production facilities that create war material for the First Order."
 
 district_supremacy_barracks: "Crew Barracks"
 district_supremacy_barracks_plural: "Crew Barracks"
 district_supremacy_barracks_desc: "This command ship also contains extensive training facilities for new recruits, crewmen, and legions of Stormtroopers."
 
 
 d_supremacy_weapon_testing_labs: "Ship Research Labs"
 d_supremacy_weapon_testing_labs_desc: "On the edge of each wing houses a number of top-secret research and weapon facilities providing the latest in research technology."
 
 d_supremacy_training_facilities: "Ship Training Barracks"
 d_supremacy_training_facilities_desc: "Fully equipped training barracks for an entire legion of stormtroopers onboard the Supremacy."
 
 d_supremacy_hyperspace_tracker: "Ship Hyperspace Tracker"
 d_supremacy_hyperspace_tracker_desc: "An active tracking system recently developed by General Armitage Hux allows the Supremacy to detect starships traveling through hyperspace. It uses a static hyperspace field generator that accelerated computation speed and calculations to unimaginable levels."
 
 d_supremacy_foundries: "Ship Foundries"
 d_supremacy_foundries_desc: "Facilities dedicated towards the construction of war materials and weapons."
 
 d_supremacy_hydroponics: "Ship Food Processor Facilities"
 d_supremacy_hydroponics_desc: "Facilities dedicated towards the production of foodstuffs."
 
 d_supremacy_throne_room: "Ship Throne Room"
 d_supremacy_throne_room_desc: "An large chamber equipped with a holographic projector used to relay orders from the Supremacy."
 
 pc_supremacy: "The Supremacy"
 pc_supremacy_desc: "The first of the Mega-class Star Dreadnought line and mobile capital of the First Order."
 
 #FIRST ORDER ARMIES 
 
 tech_first_order_army: "First Order Military"
 tech_first_order_army_desc: "The military of the First Order."
 
 tech_first_order_vehicles: "First Order War Machines"
 tech_first_order_vehicles_desc: "Vehicles of the First Order"
 
 tech_sith_eternal_army: "Sith Eternal Military"
 tech_sith_eternal_army_desc: "The military arm of the fanatical Sith Eternal cult."
 
 #INFANTRY
 
 first_order_stormtroopers: "Stormtrooper Division"
 first_order_stormtroopers_desc: "Fully covered in stark white armor, stormtroopers are the standard infantry of the First Order. They are fanatical, loyal, and obedient soldiers." 
 
 first_order_stormtrooper_garrison: "Stormtrooper Garrison"
 first_order_stormtrooper_garrison_desc: "A garrison of First Order stormtroopers." 
 
 first_order_flametroopers: "Flametrooper Division"
 first_order_flametroopers_desc: "A specialized variant of the Stormtrooper corps armed with flamethrowers to incinerate the enemies of the First Order."
 
 first_order_heavy_troopers: "Heavy Assault Trooper Division"
 first_order_heavy_troopers_desc: "A specialized heavy assault variant of the Stormtrooper corps that makes use of the FWMB-10 Megablaster to decimate hardened targets."
 
 first_order_jet_troopers: "Jetrooper Division"
 first_order_jet_troopers_desc: "A specialized aerial assault variant from the Stormtrooper corps that makes use of jetpacks for increased maneuverability and mobility."
 
 first_order_elite_stormtroopers: "Elite Stormtrooper Unit"
 first_order_elite_stormtroopers_desc: "First Order elite commando units tasked with subterfuge and special operations."
 
 sith_eternal_sithtroopers: "Sith Trooper Division"
 sith_eternal_sithtroopers_desc: "Elite soldiers of the Sith Eternal army clad in crimson red armor upgraded with a durable gammaplast composite and armed with a ST-W48 heavy blaster."
 
 sith_eternal_jettroopers: "Sith Jet Trooper Division"
 sith_eternal_jettroopers_desc: "Elite variant of the Sith Troopers used for aerial assault."
 
 sith_eternal_sovereign_protectors: "Sith Sovereign Protectors"
 sith_eternal_sovereign_protectors_desc: "Elite praetorian bodyguards of the Sith Eternal clad in red and black armor and armed with a vibroblade equipped SP-B50 blaster rifle for close quarters combat."
 
 #VEHICLES 
 first_order_125z_treadspeaders: "125-Z Treadspeeders"
 first_order_125z_treadspeaders_desc: "Armored speeder bikes used for reconnaissance and light hit-and-run assaults. Armed with two heavy laser cannons."
 
 first_order_uatt_walkers: "UA-TT Walkers"
 first_order_uatt_walkers_desc: "Urban Assault Walkers used for urban combat. Armed with an array of blaster cannons and light repeating blasters for anti-infantry duty and a grapple arm for riot control."
 
 first_order_atst_walkers: "AT-ST Walkers"
 first_order_atst_walkers: "The All Terrain Scout Transport is a armored scout walker used by the First Order for anti-infantry duty with improved armor."
 
 first_order_atat_walker: "AT-AT Walker"
 first_order_atat_walker_desc: "The All Terrain Armored Transport is a large walker updated from the designs of the Galactic Empire to have stronger armor and increased firepower."
 
 first_order_atm6_walker: "AT-M6 Walker"
 first_order_atm6_walker_desc: "The All Terrain MegaCaliber Six is a massive heavy artillery and assault walker that is used to utterly decimate ground based targets." 
 
 first_order_tie_fighters: "TIE/fo Fighter Squadron"
 first_order_tie_fighters_desc: "Space superiority fighters upgraded from the older TIE model equipped with shields and more powerful laser cannons."
 
 first_order_sf_tie_fighters: "TIE/sf Fighter Squadron"
 first_order_sf_tie_fighters_desc: "Elite space superiority fighters reserved for members of the First Order's elite Special Forces. Heavily shielded and armed with powerful laser cannons, missile launcher, and a heavy laser turret."
 
 first_order_tie_bombers: "TIE/se Bomber Squadron"
 first_order_tie_bombers_desc: "First Order bomber upgraded from the older TIE bombers with increased weaponry and shielding."
 
 first_order_atpd_walkers: "AT-PD Walkers"
 first_order_atpd_walkers_desc: "Automated defense walkers used to defend key locations. Armed with two heavy laser cannons for anti-infantry and light vehicle duties."
 
 first_order_atma_walkers: "AT-MA Walkers"
 first_order_atma_walkers_desc: "Automated artillery walkers used to defend key First Order installations. Armed with a powerful artillery cannon and two heavy laser cannons for light vehicle duty."
 
 ###SITH LEADER TRAITS####
 trait_sith: "Sith Acolytes"
 trait_sith_desc: "Many members of this species follow the teachings of the Sith Order and practice the dark side of the Force. Unlocks §YSith Leaders.§!"
 
 trait_sith_pureblood: "Sith Pureblood"
 trait_sith_pureblood_desc: "Either one of the original Sith species or a human hybrid, the red-skinned Sith purebloods inherit a legacy long intertwined with the dark side. They are warlike, competitive, and ambitious performing arcane rituals to strengthen their connection to the dark side. They are the progenitors of the Sith Order. Unlocks §YSith Leaders.§!"  
 
 leader_trait_sith_scientist: "Sith Scientist"
 leader_trait_sith_scientist_desc: "Maniacal and devious, Sith scientists are ruthless in their experiments and are obsessed with obtaining power by discovering artifacts of power."

 leader_trait_sith_governor: "Sith Governor"
 leader_trait_sith_governor_desc: "Stationed on occupied worlds, Sith governors are brutal and oppressive to maintain stability and order."
 
 leader_trait_sith_general: "Sith Warrior"
 leader_trait_sith_general_desc: "Described as 'an unstoppable force of darkness,'Sith Warriors are front-line lightsaber combatants from the Sith Order. Serving as champions of the battlefield, they rely on fear, anger, and hatred to improve their connection to the dark side of the Force and channel its malevolent power into themselves to use as a weapon. Sith Warriors rarely retreat from combat."
 
 leader_trait_sith_admiral: "Sith Admiral"
 leader_trait_sith_admiral_desc: "Sith in this position lead with fear and intimidation, using aggressive tactics to destroy their enemies. Their connection to the Force also allows them to sense enemies across great distances." 
 
 leader_trait_sith_ruler: "Dark Lord of the Sith"
 leader_trait_sith_ruler_desc: "A title granted among the Sith Order that represents the very embodiment of the strength and power of the dark side. If the leader grows weak, another must rise to seize the mantle." 
 
 
 
 ####################################
 # SITH ARMIES
 ####################################

 sith_warriors: "Sith Warriors"
 sith_warriors_desc: "Sith combat specialists that serve as front-line units. Entrusted with the task of destroying their enemies and enforcing Sith domination across the galaxy."
 
 sith_juggernauts: "Sith Juggernauts"
 sith_juggernauts_desc: "An advanced class of sith warrior that specializes in combat endurance wearing enhanced armor that provided them special protection in battle."
 
 sith_marauders: "Sith Marauders"
 sith_marauders_desc: "An advanced class of sith warrior that specializes in dual lightsabers and dealing high amounts of carnage upon their enemies in melee combat. They are far more agile than their juggernaut counterparts, but less armored."
 
 sith_lord: "Sith Lord"
 sith_lord_desc: "A title conferred on members of the Sith Order who have considerable knowledge of and strength in the dark side of the Force. Typically armed with a crimson red lightsaber and several destructive force abilities, these Sith Lords are among the most powerful members of their order."
 
 sith_acolytes: "Sith Acolytes"
 sith_acolytes_desc: "Also known as Dark Jedi, sith acolytes serve as apprentices, trainees, and enforcers within the Sith Order. Although they lack the experience of a fully-trained Sith Lord, they are far more numerous and still trained in a number of various lightsaber forms and dark side powers in the service of their masters."
 
 sith_inquisitors: "Sith Inquisitors"
 sith_inquisitors_desc: "A class of powerful force users that focused on offensive force abilities as opposed to martial might."
 
 sith_sorcerers: "Sith Sorcerers"
 sith_sorcerers_desc: "An advanced class of sith inquisitors that were proficient in the arts of Sith magic, using powerful spells and rituals to create terrifying force abilities, usually in the form of force storms to devastate entire armies."
 
 sith_assassins: "Sith Assassins"
 sith_assassins_desc: "A sect of covert Force-sensitive killers from the Sith Order specializing in deception and assassination. They specialize in infiltrating and demoralizing enemy ranks through stealth, subterfuge, and misdirection. Usually armed with a double-bladed lightsaber used to channel their dark side abilities into the blade itself."
 
 RT_DARK_LORD_OF_THE_SITH: "Dark Lord of the Sith"
 RT_DARK_LADY_OF_THE_SITH: "Dark Lady of the Sith"
 HT_SITH_APPRENTICE: "Sith Apprentice"
 HT_SITH_APPRENTICE_FEMALE: "Sith Apprentice"
 
 
