l_english:
 foc_lore_hosnian_senate_world:0 "Seat of the New Republic Senate"
 foc_lore_hosnian_senate_world_desc:0 "Hosnian Prime is the political heart of the restored Republic, drawing delegates, administrators, and commerce from across the galaxy."
 foc_lore_hosnian_cosmopolitan_system:0 "Hosnian Cosmopolitan Network"
 foc_lore_hosnian_cosmopolitan_system_desc:0 "The populated worlds of the Hosnian system support the capital with dense trade routes, civic infrastructure, and metropolitan services."
 foc_lore_coruscant_galactic_metropolis:0 "Galactic Metropolis"
 foc_lore_coruscant_galactic_metropolis_desc:0 "A planet-spanning city and historic galactic capital, Coruscant concentrates government, archives, universities, and trade on a staggering scale."
 foc_lore_core_world_support_network:0 "Core Worlds Support Network"
 foc_lore_core_world_support_network_desc:0 "These developed Core Worlds feed Coruscant's immense demand through mature logistics, manufacturing, and civil institutions."
 foc_lore_kuat_orbital_shipbuilding:0 "Kuat Orbital Shipbuilding"
 foc_lore_kuat_orbital_shipbuilding_desc:0 "The vast orbital yards of Kuat turn refined alloys and advanced engineering into capital ships at industrial scale."
 foc_lore_chandrila_republican_traditions:0 "Chandrilan Republican Traditions"
 foc_lore_chandrila_republican_traditions_desc:0 "Chandrila's civic culture, open landscapes, and long republican tradition sustain a stable and prosperous society."
 foc_lore_akiva_droid_foundries:0 "Akivan Droid Foundries"
 foc_lore_akiva_droid_foundries_desc:0 "Forgotten subterranean foundries and recovered Separatist machinery make Akiva an unlikely center of industrial archaeology."
 foc_lore_corellia_massive_shipyards:0 "Corellian Shipbuilding Complex"
 foc_lore_corellia_massive_shipyards_desc:0 "Corellia's immense shipyards and engineering corporations are famed for rugged hulls, rapid production, and daring design."
 foc_lore_naboo_harmonious_civilization:0 "Naboo-Gungan Symbiosis"
 foc_lore_naboo_harmonious_civilization_desc:0 "The pastoral Naboo and the underwater Gungan civilization share a fertile world rich in art, food, and civic tradition."
 foc_lore_kashyyyk_wroshyr_world:0 "Wroshyr Forest World"
 foc_lore_kashyyyk_wroshyr_world_desc:0 "Kashyyyk's immense wroshyr forests shelter resilient Wookiee communities whose knowledge of the canopy makes invasion exceptionally difficult."
 foc_lore_mon_cala_starship_craft:0 "Mon Calamari Starship Craft"
 foc_lore_mon_cala_starship_craft_desc:0 "Mon Calamari shipwrights transform the traditions of their ocean cities into elegant, powerful capital ships."
 foc_lore_endor_living_forest:0 "Living Forest of Endor"
 foc_lore_endor_living_forest_desc:0 "Dense forests, native wildlife, and Ewok settlements conceal defenders and make the moon far harder to subdue than its size suggests."
 foc_lore_hoth_echo_base:0 "Echo Base Iceworks"
 foc_lore_hoth_echo_base_desc:0 "Glacial tunnels and concealed shielded installations provide a defensible refuge beneath Hoth's lethal frozen surface."
 foc_lore_bespin_tibanna_industry:0 "Bespin Tibanna Industry"
 foc_lore_bespin_tibanna_industry_desc:0 "Cloud City prospers by harvesting and refining valuable tibanna gas from the upper atmosphere of Bespin."
 foc_lore_lothal_fields_and_temple:0 "Lothal Fields and Jedi Temple"
 foc_lore_lothal_fields_and_temple_desc:0 "Fertile plains, mineral wealth, and an ancient Jedi sanctuary give Lothal both material value and deep spiritual significance."
 foc_lore_bastion_imperial_fortress:0 "Imperial Fortress of Bastion"
 foc_lore_bastion_imperial_fortress_desc:0 "Bastion is a hardened command world built around layered defenses, disciplined administration, and the institutions of the Imperial Remnant."
 foc_lore_bilbringi_military_yards:0 "Bilbringi Military Shipyards"
 foc_lore_bilbringi_military_yards_desc:0 "Asteroid resources and fortified orbital works make Bilbringi a premier center for Imperial heavy warship production."
 foc_lore_yaga_minor_ubiqtorate:0 "Yaga Minor Ubiqtorate"
 foc_lore_yaga_minor_ubiqtorate_desc:0 "Military industry and the Imperial intelligence apparatus turn Yaga Minor into a tightly controlled strategic nerve center."
 foc_lore_rendili_stardrive:0 "Rendili StarDrive"
 foc_lore_rendili_stardrive_desc:0 "Centuries of naval construction give Rendili a deep labor pool and a mature engineering base for large warships."
 foc_lore_jakku_ship_graveyard:0 "Jakku Ship Graveyard"
 foc_lore_jakku_ship_graveyard_desc:0 "The wreckage of a decisive battle feeds scavengers and salvage engineers while lawlessness spreads among the dunes."
 foc_lore_geonosis_droid_foundries:0 "Geonosian Droid Foundries"
 foc_lore_geonosis_droid_foundries_desc:0 "Hive catacombs and buried assembly lines can produce weapons and battle droids in immense numbers."
 foc_lore_kamino_cloning_centers:0 "Kaminoan Cloning Centers"
 foc_lore_kamino_cloning_centers_desc:0 "Storm-lashed ocean platforms house unmatched genetic laboratories and military training facilities."
 foc_lore_mustafar_mineral_world:0 "Mustafarian Mineral Works"
 foc_lore_mustafar_mineral_world_desc:0 "Volcanic upheaval exposes valuable ores and geothermal energy, though only the most extreme industrial sites can survive the lava world."
 foc_lore_nur_inquisitor_fortress:0 "Fortress Inquisitorius"
 foc_lore_nur_inquisitor_fortress_desc:0 "Hidden beneath Nur's ocean, an armored Imperial citadel serves as a prison, archive, and headquarters for Force-sensitive hunters."
 foc_lore_mandalore_beskar_warrior_clans:0 "Beskar and the Warrior Clans"
 foc_lore_mandalore_beskar_warrior_clans_desc:0 "Beskar deposits, advanced armorers, and a martial clan tradition make Mandalore a formidable military world."
 foc_lore_scarif_imperial_archive:0 "Scarif Imperial Archive"
 foc_lore_scarif_imperial_archive_desc:0 "A fortified tropical complex stores the Empire's most sensitive weapons research behind planetary defenses."
 foc_lore_kessel_spice_coaxium_mines:0 "Kessel Spice and Coaxium Mines"
 foc_lore_kessel_spice_coaxium_mines_desc:0 "Rich spice and coaxium deposits drive a brutal extraction economy sustained by smugglers, forced labor, and organized crime."
 foc_lore_dathomir_nightsister_nexus:0 "Nightsister Magick Nexus"
 foc_lore_dathomir_nightsister_nexus_desc:0 "Ancient ruins, dangerous fauna, and the green magick of the Nightsisters saturate Dathomir with dark power."
 foc_lore_tatooine_hutt_spaceport:0 "Hutt Spaceports of Tatooine"
 foc_lore_tatooine_hutt_spaceport_desc:0 "Remote ports link moisture farms and mineral prospectors to a lucrative underworld of smugglers, bounty hunters, and Hutt cartels."
 foc_lore_exegol_sith_eternal_sanctuary:0 "Sith Eternal Sanctuary"
 foc_lore_exegol_sith_eternal_sanctuary_desc:0 "Hidden behind lethal hyperspace anomalies, Exegol's ancient citadel binds Sith cultists, forbidden laboratories, and immense subterranean defenses."
