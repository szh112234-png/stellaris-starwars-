l_english:
 foc_canon.45.name:0 "Battle of Yavin"
 foc_canon.45.desc:0 "§HDeath Star I has been destroyed.§! The battlestation's destruction is recorded as victory in the Battle of Yavin.\n\n§HGrand Moff Wilhuff Tarkin§! refuses evacuation and dies with the station. The Empire has lost its instrument of galactic terror, and the Rebellion has paid heavily for this victory."
 leader_trait_foc_force_sensitive:0 "Force Sensitive"
 leader_trait_foc_force_sensitive_desc:0 "This leader can sense and touch the Force. Instinct, precognition and heightened perception are no substitute for training, but they can change the outcome of exploration, command and moments of crisis."

 foc_republic_origin_jedi_guardians:0 "Jedi Guardians"
 foc_republic_origin_jedi_guardians_desc:0 "Front-line specialists drawn from the Order, trained around defense, close lightsaber combat and the protection of others. They are usually found at the most dangerous point in a clone battle line."
 foc_republic_origin_jedi_sentinels:0 "Jedi Sentinels"
 foc_republic_origin_jedi_sentinels_desc:0 "Jedi who emphasize speed, technical skill and precise offensive action. They excel at breaching droid lines and destroying command nodes before the enemy can reorganize."
 foc_republic_origin_jedi_consulars:0 "Jedi Consulars"
 foc_republic_origin_jedi_consulars_desc:0 "Jedi who focus more heavily on the Force, diplomacy and control than on pure swordsmanship. They are not the Order's fiercest fighters, but often end battles without widening them."
 foc_republic_origin_jedi_sages:0 "Jedi Sages"
 foc_republic_origin_jedi_sages_desc:0 "Jedi with a deep command of the Force, able to suppress formations with telekinesis and steady allies under fire. Their power is considerable, and must be used with restraint."
 foc_republic_origin_jedi_shadows:0 "Jedi Shadows"
 foc_republic_origin_jedi_shadows_desc:0 "One of the least public arms of the Order. Jedi Shadows hunt Sith relics, infiltrate hostile networks and sever the dark side's infrastructure; by the time open combat begins, the target may already have lost communications and morale."
