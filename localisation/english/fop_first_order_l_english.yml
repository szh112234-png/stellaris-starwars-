l_english:
 origin_fop_first_order:0 "First Order: Heirs of the Unknown Regions"
 origin_fop_first_order_desc:0 "After the Empire's defeat at Endor, surviving fleets and officer corps withdrew into the Unknown Regions and reorganized as the First Order. The Supreme Leader rules this hidden military state, whose fleets and superweapon programs serve the restoration of order across the galaxy."
 origin_fop_first_order_effects:0 "§YStarting Effects:§!\n- Capital is fixed to the habitable ice world §HIlum§!\n- Ilum has §HKyber Crystal Caves§! and an §HImperial Mining Trench§!\n- Starts with one §HTier I Supremacy Arkship§!\n- Starts with §HStarkiller Base§! technology and may construct it on any eligible owned colony\nStarts with basic turbolasers, mass drivers, concussion missiles and point defense. Advanced weapon technologies are not granted merely for choosing this origin."
 fop_tech_starkiller_base:0 "Starkiller Project"
 fop_tech_starkiller_base_desc:0 "Integrate planet-scale energy collectors, kyber focusing systems and an interstellar firing array into Starkiller Base. The First Order begins with this technology unlocked."
 fop_starkiller_base_site:0 "Starkiller Base Construction Site"
 fop_starkiller_base_site_DESC:0 "Planet-scale energy collection, storage and firing infrastructure constructed on an owned colony."
 fop_starkiller_base_final:0 "Starkiller Base"
 fop_starkiller_base_final_DESC:0 "A stellar-energy weapon formed from an entire planet. It drains a star and focuses the captured power through a kyber-based firing system."
 fop_starkiller_one_only:0 "§ROnly one Starkiller Base may be owned.§!"
 fop_starkiller_requires_owned_colony:0 "§RThis structure must be built on an owned and colonized planet.§!"
 fop_kyber_crystal_caves:0 "Kyber Crystal Caves"
 fop_kyber_crystal_caves_desc:0 "Ancient caves where Jedi younglings once undertook the Gathering and found crystals for their lightsabers."
 fop_imperial_mining_trench:0 "Imperial Mining Trench"
 fop_imperial_mining_trench_desc:0 "Imperial kyber extraction for the Death Star program left a vast scar around Ilum's equator."
 fop_airless_low_gravity_rock:0 "Airless Low-Gravity Black Rock"
 fop_airless_low_gravity_rock_desc:0 "A black outer-system body with almost no atmosphere or gravity."
 fop_starkiller_world:0 "Planetary Weapon Conversion"
 fop_starkiller_world_desc:0 "The planet's crust, energy network and focusing systems have been integrated into Starkiller Base."
