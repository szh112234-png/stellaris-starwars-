 fop_origin.10.name:0 "A New Order in the Unknown Regions"
 fop_origin.10.desc:0 "After the Empire's defeat at Endor, surviving officers, engineers and fleets followed contingency routes into the Unknown Regions. Decades of secret rearmament and military rule transformed the remnants into the First Order.\n\nThe weak light of Ilum Primary falls across the frozen capital. Jedi once sought lightsaber crystals in its caves; the Empire later carved a vast mining trench around its equator. The §HSupremacy§! now serves as a mobile command center, shipyard and fleet flagship.\n\nThe First Order has already mastered the core technology of Starkiller Base and may choose a suitable colony on which to construct the superweapon."
 fop_origin.10.a:0 "The new order will rise from the Unknown Regions."
 fop_origin.20.name:0 "Starkiller Base Complete"
 fop_origin.20.desc:0 "The planet-scale energy collectors, focusing systems and interstellar firing array are fully operational. This world has become §HStarkiller Base§!."
 fop_origin.20.a:0 "Bring the weapon online."
 FOP_FIRST_ORDER:0 "First Order"
 FOP_FIRST_ORDER_ADJ:0 "First Order"
 FOP_HUMAN:0 "Human"
 FOP_HUMANS:0 "Humans"
 FOP_HUMAN_ADJ:0 "Human"
 FOP_FIRST_ORDER_SPECIES_BIO:0 "The First Order is composed of Imperial remnants, officer corps, technocrats and populations raised under militarized indoctrination. It elevates order, obedience and military power above all else."
 FOP_SNOKE:0 "Snoke"
 FOP_SUPREME_LEADER:0 "Supreme Leader"
 gov_fop_first_order:0 "First Order Military State"
 gov_fop_first_order_desc:0 "An autocratic military state reorganized from Imperial remnants. Military, government and social mobilization are inseparable, and all authority ultimately rests with the Supreme Leader."

 FOP_FIRST_ORDER_PRESET:0 "First Order"
 trait_fop_preset_ethics:0 "Authoritarian / Fanatic Militarist"
 FOP_FIRST_ORDER_PRESET_DESC:0 "A militarized regime founded by Imperial remnants in the Unknown Regions. Ruled by Supreme Leader Snoke, the First Order uses Ilum as its hidden capital while preparing a new fleet to return to the galaxy."

 START_SCREEN_FOP_FIRST_ORDER:0 "After the Galactic Empire fell at Endor, its most committed officers, engineers and surviving fleets followed contingency routes into the Unknown Regions. Decades of secret rearmament, militarized education and rigid rule transformed those exiles into the §HFirst Order§!. Supreme Leader Snoke holds absolute authority, and the stormtrooper legions and new star fleet answer only to him.\n\nThe First Order's hidden capital is the frozen world of §HIlum§! beneath the weak light of Ilum Primary. The Empire once mined kyber crystals here, carving a vast trench around the planet's equator. Now the §HSupremacy§! roams the stars as a mobile command center and fleet flagship, and the First Order has already mastered the core technology required to construct Starkiller Base. The New Republic has grown complacent in peace; the galaxy will soon be reminded of order and power."
 fop_cradle_war_machine:0 "Cradled War Machine"
 fop_cradle_war_machine_desc:0 "From its birth, the First Order organizes population, education and industry around war. §YOrganic Pop Growth Speed: +25%§!. Other normal galactic empires distrust the First Order, except the Imperial Remnant."
 fop_opinion_cradle_war_machine:0 "Cradled War Machine"
