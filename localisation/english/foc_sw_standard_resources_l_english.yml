l_english:
 sr_tibanna_swgs:0 "Tibanna Gas"
 sr_tibanna_swgs_desc:0 "A high-energy gas widely used in blasters and turbolasers. The FOC standard equipment system treats it as the industrial foundation of conventional Star Wars naval weapons."
 sr_kyber_swgs:0 "Kyber Crystals"
 sr_kyber_swgs_desc:0 "Rare crystals capable of focusing and amplifying energy. The FOC standard equipment system reserves them for top-tier guns, spinal weapons and superweapons."
