 d_foc_kyber_crystal_veins_desc:0 "This world contains naturally occurring Kyber crystal veins that can be exploited."
 d_foc_kyber_crystals_orbital_1:0 "Kyber Crystal Deposit"
 d_foc_kyber_crystals_orbital_1_desc:0 "A small orbital-mining-grade Kyber deposit has been detected on this body."
