 ####################################
 # Events
 ####################################
 
 deathstarbattlestation.1.name: "The Ultimate Weapon"
 deathstarbattlestation.1.desc: "The construction of the Orbital Battle Station has been completed.\n\nThis mobile battle station changes the paradigm of offensive warfare entirely. \n\nOnly fools will oppose [Owner.GetName] now."
 deathstarbattlestation.1.a: "Impressive."
 deathstarbattlestation_build_modifier: "That's no Moon!"
 deathstarbattlestation_build_opinion: "Galactic Threat"
 deathstarbattlestation.2.name: "Ultima Ratio Regum"
 deathstarbattlestation.2.desc: "It has been verified that §H[From.Owner.GetName]§! has finished the construction of an Orbital Battle Station."
 deathstarbattlestation.2.a: "Bit of a game changer, that one."
 deathstarbattlestation.3.name: "De Casu Genetivo"
 deathstarbattlestation.3.desc: "Our Orbital Battle Station has been destroyed! \n\nWith the news of its destruction, the populace have lost trust of the capabilities of our government!"
 deathstarbattlestation.3.a: "Curses"
 deathstarbattlestation_destroyed_modifier: "Orbital Battle Station destroyed."
