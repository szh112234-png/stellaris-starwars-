l_english:
 foc_v1718_tech_reactor_1:0 "Venator Reactor — Generation 1"
 foc_v1718_tech_reactor_1_desc:0 "Automatically granted at the corresponding story milestone. Non-story eligible countries retain a normal research path."
 foc_v1718_tech_emp_reactor_2:0 "Imperial Reactor — Generation 2"
 foc_v1718_tech_emp_reactor_2_desc:0 "Granted on conversion to the Galactic Empire. For the First Order origin, Starkiller completion still grants tier II; unlocking the Resurgent earlier also backfills this prerequisite. Death Star systems remain independent."
 foc_v1718_tech_emp_reactor_3:0 "Resurgent Reactor — Generation 3"
 foc_v1718_tech_emp_reactor_3_desc:0 "The Imperial route grants this technology after the First Order Plan. A First Order origin instead receives it when all Resurgent hull research prerequisites are complete; neither Starkiller completion nor crisis activation is required. Each of the three core-system technologies is granted separately. Death Star systems remain independent."
 foc_v1718_tech_emp_reactor_4:0 "Executor Reactor — Generation 4"
 foc_v1718_tech_emp_reactor_4_desc:0 "Requires independent research after generation 3 of this branch. Never awarded by the milestone synchronizer."
