l_english:
 foc_v1716_final_order_accept_tt:0 "Become the playable §YFinal Order§!, move the capital to Exegol, and crown Palpatine. An existing Final Order joins our country with its fleets and colonies; otherwise Exegol and its initial support fleet are established. Advanced weapons still require research. Support ships retain their equipment."
 foc_v1716_final_order_resist_tt:0 "Fight the independent §YFinal Order§!, spawning it if necessary. A First Order civil war follows: some ordinary fleets, non-core colonies, and subjects defect. Ilum, Starkiller Base, and Supremacy are protected. Any already active crisis and apotheosis path continues."
