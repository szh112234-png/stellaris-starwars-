l_english:
 SSP_FIGHTER_GROUP_DESC:0 "§LThis is not a front-line order, but a supreme-level mobilization authority that determines the scale of the entire war.§!\n\nOnly the selected faction route can be researched. Previously completed faction technologies and aircraft remain available. Select All to open all three routes."
 SSP_IMPERIAL_TARGET_DESC:0 "§LThe holographic war table unfolds. Fleet composition, weapon strength, and strategic rules can all be recalibrated here.§!\n\nChoose a system one or two hyperlane jumps from the current fleet."
 SSP_REBEL_TARGET_DESC:0 "§LThe strategic simulation chamber is ready, and the staff is waiting for confirmation of the rules that will govern this campaign.§!\n\nChoose a system one or two hyperlane jumps from the current fleet."
 SSP_REPUBLIC_TARGET_DESC:0 "§LHigh Command has opened the tactical simulation terminal. Every parameter chosen here will shape the tempo of the coming war.§!\n\nChoose a system one or two hyperlane jumps from the current fleet."
 SSP_SETTINGS_ROOT_DESC:0 "§LThe holographic war table unfolds. Fleet composition, weapon strength, and strategic rules can all be recalibrated here.§!\n\nChoose strength, visual scale, or the currently available faction research route. Previously researched faction aircraft remain available after switching routes."
 SSP_SIZE_DESC:0 "§LThe strategic simulation chamber is ready, and the staff is waiting for confirmation of the rules that will govern this campaign.§!\n\nThis changes visual model size only. Re-save ship designs and upgrade ships; existing deployed strike groups do not change immediately."
 SSP_STRENGTH_EDICT_DESC:0 "§LThis is not a front-line order, but a supreme-level mobilization authority that determines the scale of the entire war.§!\n\nAll tiers preserve the cinematic relative roles of each fighter and only change the overall numeric scale. Re-save ship designs and upgrade existing ships after switching."
 foc_balance.10.desc:0 "§LThe figures from Imperial administration are more troubling than any front-line report: ruling the galaxy itself is becoming a war of attrition.§!\n\nThe Interior Ministry's quarterly report reaches one conclusion: the cost of holding the New Order together is getting away from us.\n\nFor twenty years a governor's office and a token garrison were enough in each Outer Rim sector. That worked not because of troop numbers but because nobody believed resistance meant anything.\n\nSomeone believes it now.\n\nStrikes, sabotage, graffiti on comm towers, convoys that do not arrive — no single incident justifies moving a fleet, and together they are dragging administrative capacity down across the Rim. And the pattern is unmistakable: §Hworlds with no Imperial fleet overhead are markedly worse.§!\n\nThe sector governors are asking for the same thing, in the same words: leave us ships.\n\n§YThe Empire enters a state of unrest that worsens with each Rebel success. In addition, any colony with no Imperial fleet in its system suffers a further stability and output penalty — it returns the month a fleet leaves, and lifts the moment one returns.§!"
 foc_canon.31.desc:0 "§LThe gears of the era engage once more. Another moment destined to be retold for generations has arrived.§!\n\nThe First Order seals Ilum and begins turning the entire kyber-rich world into a weapon capable of draining stellar energy. The project diverts alloy output and shipyard capacity away from the conventional fleet until construction is complete. The galaxy will later know the weapon as Starkiller Base."
 foc_canon.34.desc:0 "The plans from Scarif are still passing between couriers, and Leia is now in Imperial custody. Tarkin targets §HAlderaan§! with Death Star I, intending to trade her homeworld for the location of the Rebel base.\n\nAs long as the battlestation can still fire, the next order will destroy an entire world. The Rebels must rescue Leia and deliver the full intelligence before completing their attack solution."
 foc_canon.40.desc:0 "§LThe gears of the era engage once more. Another moment destined to be retold for generations has arrived.§!\n\n§HChristophsis§! has fully passed out of Confederate control. During the campaign, Ahsoka Tano is formally assigned to Anakin Skywalker as his Padawan.\n\n§YThe Battle of Christophsis is complete and records an independent battle anchor.§!"
 foc_canon.53.desc:0 "§LA chapter once known only through legend and archives is now happening on our own star charts.§!\n\nThe Rebel Alliance has grown from scattered cells into an open resistance to the Empire. A survivor who once walked away from the Jedi Order has reappeared on its clandestine communications network.\n\n§HAhsoka Tano§! joins the Rebellion under the codename Fulcrum. She no longer speaks for the Jedi Council; this war is her own choice.\n\n§YAhsoka joins the Rebel leader pool as a real commander.§!"
 foc_cis.10.desc:0 "Confederate fleets and war industries are dispersed across the theaters."
 foc_cis.11.desc:0 "§LIn the war’s most brutal phase, any single world can become the fulcrum on which the galaxy turns overnight.§!\n\nThe Confederacy has a new supreme commander.\n\nHe is not a politician or a corporate delegate but a rebuilt war machine: barely any organic parts remain, the rest is alloy frame and servomotors. He coughs, because the lungs were kept from the original body. He collects lightsabers, because he took each one off a Jedi himself.\n\nSince he took command, Confederate fleets have shown real tactical direction for the first time — raiders coordinate, line fleets anticipate Republic movements instead of waiting to be hit.\n\n§YSeparatist line fleets and raiding groups both receive reinforcement, and Confederate fleets gain a command bonus.§!"
 foc_cis.12.desc:0 "§LOuter Rim hyperspace lanes have been cut into isolated pockets by the war, and the Republic must reclaim them one by one.§!\n\nThe Trade Federation, the Banking Clan, the Techno Union and the Mining Guild signed a joint declaration on Akiva: every member corporation's \"escort forces\" pass into the Confederate order of battle with immediate effect.\n\nThose ships were meant to escort cargo, lean on local governments, and close a shipping lane or two when required. There are a startling number of them, because in twenty years the Senate never once actually counted them.\n\nThe Republic rejected a bill in the Senate chamber that would have recognised those escort forces as lawful. They no longer require the Senate's recognition.\n\n§YThe Confederacy gains substantial reinforcement fleets and a full mobilisation bonus.§!"
 foc_coldwar.2.desc:0 "§LThe guns have fallen quiet for now, but the galaxy has not found peace. Old enemies merely study one another again across new borders.§!\n\nThe old Galactic Civil War is over, but peace has never become secure. The §HNew Republic§! and the §HImperial Remnant§! now face each other as two powerful, inward-looking §HFallen Empires§!, separated by Jakku and the borders of the old war. Both possess fleets far beyond the reach of ordinary states, yet neither is willing to ignite another total war.\n\nBeyond the public hyperspace routes, the Unknown Regions still conceal the fate of many vanished Imperial formations. The galaxy appears peaceful; in reality, it has entered a long cold war."
 foc_cw.1.desc:0 "The Geonosis crisis forces the Republic to deploy its clone army. Closing this event establishes the Confederacy and begins the Clone Wars."
 foc_cw.2.desc:0 "§LThe military channels carry only coordinates, casualty figures, and orders. The true cost will not be visible until the fighting ends.§!\n\nThe front has reached the Outer Rim, and the Outer Rim has no front — only a string of unconnected systems, each of which has to be taken on its own.\n\nThe Confederacy builds its factories underground, hides its fleets in asteroid fields, and garrisons with machines that need no supply. The Republic sends Jedi out one at a time as generals: one man, one legion, one world, and then months of silence.\n\nThe staff has to choose a way to fight this.\n\n§YTwo doctrines: attrition buys durability and endurance; a Jedi spearhead buys damage and breakthroughs at higher leader upkeep.§!"
 foc_cw.3.desc:0 "§LThe military channels carry only coordinates, casualty figures, and orders. The true cost will not be visible until the fighting ends.§!\n\nCoruscant has held. Every Confederate assault fleet committed to the capital has been destroyed or driven out, and the Republic still controls the system.\n\nA Confederate fleet appeared over the Republic capital — not to hold it, but to take one man.\n\n§HThe Supreme Chancellor was carried onto the flagship.§! Two Jedi went in after him, and what they met on that bridge was §HCount Dooku§!.\n\nDooku put one of them down, fought the other, lost, and had both hands taken off. He knelt there waiting to be arrested and tried.\n\nThen the Chancellor spoke. He did not ask for a prisoner.\n\nThe young Jedi hesitated for two seconds and did it. Afterwards the Chancellor reassured him: I would have done the same.\n\nThe Sith never keep two apprentices. The old one is dead and the place is open — and the young man knows perfectly well who it is open for.\n\n§YPalpatine's conspiracy advances by 10.§!\n\n§YCoruscant is complete; the actual Dooku leader dies; this milestone counts +10 conspiracy points once.§!"
 foc_cw.4.desc:0 "§LThe Jedi once mediated wars. Now they stand on warship bridges and personally order clone legions into battle.§!\n\nThe Confederacy has completely lost control of §HUtapau§!. Its high command was finally located on the arid world of sinkholes with the droid legions housed in cities built into the shaft walls.\n\nThe Republic sent a single Jedi ahead to scout. He rode a local mount down the rim, and caught §HGeneral Grievous§! on the landing platform as he was boarding to escape.\n\nFour lightsabers against one. What ended it was not a lightsaber but a blaster picked up off a dead guard — two shots into the organic lungs.\n\nWhen the General went down, every battle droid in the galaxy was still working. But the head giving the orders was gone.\n\n§YGeneral Grievous is killed, the Confederacy loses its command bonus, and the Republic gains a period of battlefield advantage.§!\n\n§YUtapau is complete and Grievous is dead. This battle does not add extra conspiracy points.§!"
 foc_cw.5.desc:0 "§LThe Jedi once mediated wars. Now they stand on warship bridges and personally order clone legions into battle.§!\n\nThe Confederacy has completely lost control of §HKashyyyk§!. On its shallows, Master Yoda and the Wookiees held the beach. The Confederate landing was pushed back into the water and the report went to Coruscant: Outer Rim operations are nearly concluded.\n\nIt is the last battle the Republic wins.\n\nStanding in that surf, Yoda took an encrypted transmission from Coruscant. He listened to the end, said nothing, then turned and spoke to the clone commander beside him.\n\nThe commander came to attention, saluted, took the comm off his belt — and received an order on a different channel."
 foc_cw.6.desc:0 "A Confederate strike force of §H25 Lucrehulk-class battleships§! has arrived over Coruscant and abducted the Chancellor."
 foc_ethics.2.desc:0 "§LThe Empire may have changed its banners and institutions, but the old laws of the Republic still haunt every archive and decree.§!\n\nThe Empire changed its government, its civics and its flag, but one thing never caught up: on paper this state still runs on Republic values.\n\nThe open-borders clauses of the Senate era, the demilitarisation pledges, the species equality acts — all still in the legal code, simply no longer enforced. Governors work from the old text, the military works from the new orders, and the two collide daily.\n\nThe Chancellor's office abolished all of it today.\n\n§HThe three pillars of the New Order are written into the charter: human primacy, military priority, absolute authority.§!\n\n§YCountry ethics corrected to §HXenophobe + Militarist + Authoritarian§!, in line with the Imperial government.§!"
 foc_falcon_support.10.desc:0 "§LAn old freighter dives once more into the most dangerous route in the galaxy, and the war seems to awaken in its wake.§!\n\nThe §YMillennium Falcon§! has crossed the hidden route into the Unknown Regions. Its arrival is followed by thousands of independent signals: veterans, smugglers, local defence forces and surviving Rebel formations have answered the call. Four consolidated battle groups emerge around the Final Order capital and immediately move to engage the Sith fleet."
 foc_fallen_war.11.desc:0 "§LThe First Order is no longer content to hide. It is ready to teach the galaxy fear again.§!\n\nThe long truce collapses. The New Republic and Imperial Remnant commit their fleets to a renewed galactic struggle over the legacy of the old Empire."
 foc_fallen_war.21.desc:0 "§LHyperspace lanes in the Unknown Regions flare with the light of a vast fleet. Another galactic war is about to cross the frontier.§!\n\nThe Imperial Remnant has lost its final colony. Its fall has not brought peace: the First Order is assembling in the Unknown Regions. After a brief warning, Starkiller Base will prioritize the New Republic capital in the Hosnian Prime system."
 foc_fallen_war.22.desc:0 "§LThere is no cheering on the cold command deck—only second-by-second countdowns and rows of orders waiting to be executed.§!\n\nThe New Republic has lost its final colony before the First Order appeared. The power vacuum accelerates the crisis. Once established, the First Order will immediately absorb the surviving Imperial Remnant and take over its ten systems, fleets, colonies and fortresses."
 foc_fallen_war.6.desc:0 "§LIn the darkness of the Unknown Regions, an army the galaxy forgot is completing its final muster.§!\n\nThe §HBattle of Jakku§! is over. The last great Imperial armada has been destroyed above the desert. The New Republic governs from Hosnian Prime in a rim cluster on one side of the galaxy, while the Imperial Remnant has withdrawn to Bastion on the opposite rim, preserving Executor-class dreadnoughts and Death Star superweapons.\n\nThe old war appears over, but the First Order is already growing in the Unknown Regions, and the Final Order still waits beyond forgotten Sith routes. The appearance of these two old powers marks the beginning of the post-Jakku era."
 foc_hero_rewards.1.desc:0 "§LThe war has consumed many legends. At this moment, it places another legend in our path.§!\n\nAs Starkiller Base breaks apart in fire, a familiar YT-1300 freighter punches through the blast front. The §YMillennium Falcon§! delivers the last survivors to our capital. Her hull is scarred and her engines still roar with defiance—the ship that witnessed the fall of the Empire is ready to enter the war again."
 foc_hero_rewards.2.desc:0 "§LThe smoke of battle has barely cleared when a figure capable of changing morale—and the war itself—arrives among us.§!\n\nAfter Luke Skywalker's passing, Princess Leia Organa spends the last of her life reaching through the Force to her son. Her death breaks Kylo Ren's final bond to darkness; he casts aside the path of the Sith and returns as §YBen Solo§!. To keep this established hero recognizable to the player, he remains listed as §YKylo Ren§! and is ready to lead our armies against Exegol."
 foc_hero_rewards.4.desc:0 "§LThe smoke of battle has barely cleared when a figure capable of changing morale—and the war itself—arrives among us.§!\n\nBen Solo has personally led our armies onto Exegol. Beneath the shadow of the Sith citadel, he gives his life to break the final defenses and becomes one with his family in the Force. The §YKylo Ren§! hero has died; his sacrifice places Exegol and its system starbase under our control."
 foc_jakku_executor_site.1.desc:0 "§LJakku’s winds sweep across a graveyard of warships, and the Imperial wreckage beneath the sand has begun to reveal another secret.§!\n\nGround-penetrating scans have mapped the graveyard in three dimensions. Countless Star Destroyer wrecks overlap below Jakku's dunes, but an immense skeletal structure in the deepest layer warrants excavation."
 foc_jakku_executor_site.2.desc:0 "§LThis graveyard buried more than ships. It buried secrets from the Empire’s final days.§!\n\nThe buried keel and armored compartments greatly exceed Imperial-class specifications. Hull codes identify them as Executor-class support structures lost during the Battle of Jakku. A bridge section wrapped in layers of durasteel remains sealed."
 foc_jakku_executor_site.3.desc:0 "§LThis graveyard buried more than ships. It buried secrets from the Empire’s final days.§!\n\nMost of the command data core is ruined, but hull-stress models, power-grid diagrams, and shipyard production records remain readable. Our engineers begin combining these fragments with surveys of the wreckage."
 foc_jakku_executor_site.4.desc:0 "§LJakku’s winds sweep across a graveyard of warships, and the Imperial wreckage beneath the sand has begun to reveal another secret.§!\n\nThe wreckage survey and Imperial archives have been integrated. We now possess the fixed construction plan for the Executor-class Super Star Destroyer used by the Imperial Remnant. Its classified systems are sealed into a non-editable whole-ship blueprint."
 foc_khan.1003.desc:0 "§LThere is no cheering on the cold command deck—only second-by-second countdowns and rows of orders waiting to be executed.§!\n\nStarkiller Base has destroyed the §H[event_target:foc_khan_forced_starkiller_target_system.GetName] System§!, which was controlled by §Y[event_target:foc_khan_forced_starkiller_target_country.GetName]§!. Its star, planets, stations, and every life within were erased in a single attack.\n\nAs long as this weapon remains operational, no nation in the galaxy is safe."
 foc_khan.1602.desc:0 "§LIn the darkness of the Unknown Regions, an army the galaxy forgot is completing its final muster.§!\n\nThe completion of our Starkiller Base has made coexistence with the First Order and the Final Order impossible. Our former overlord can no longer restrain us. Both Orders have designated our empire their highest-priority target, and their fleets are already changing course toward our territory."
 foc_khan.46.desc:0 "§LThe final inheritance of the Imperial remnants has been reforged in the Unknown Regions into something harsher than the Empire itself.§!\n\nFirst Order annual reinforcements have reached Ilum. Each support fleet contains: Lowest, 4 Imperial + 3 Resurgent + 1 Mandator; Beginner, 8 Imperial + 5 Resurgent + 1 Mandator; Intermediate, 12 Imperial + 8 Resurgent + 1 Mandator; High and Madness, 16 Imperial + 10 Resurgent + 1 Mandator. Each annual wave contains 1 / 2 / 3 / 4 / 4 fleets, and support stops after 864 ships."
 foc_khan.5.desc:0 "§LIn the darkness of the Unknown Regions, an army the galaxy forgot is completing its final muster.§!\n\nThe Galactic Community has failed to secure peace. The First Order has established its military core at Ilum, deploying both the Supremacy and a functioning Starkiller Base. It now treats the entire galaxy as hostile."
 foc_khan.63.desc:0 "§LThe First Order is no longer content to hide. It is ready to teach the galaxy fear again.§!\n\nThe destruction of Starkiller Base and the Supremacy has not ended the war. The surviving First Order formations change their banners and join the Final Order at Exegol."
 foc_khan.64.desc:0 "§LIn the darkness of the Unknown Regions, an army the galaxy forgot is completing its final muster.§!\n\nThe First Order has been absorbed by the Final Order. Our previous submission has transferred with it, and we must now answer directly to the Sith Eternal on Exegol."
 foc_khan.81.desc:0 "§LThere is no cheering on the cold command deck—only second-by-second countdowns and rows of orders waiting to be executed.§!\n\nThe underground shipyards of Exegol have delivered their final reinforcement wave. A cumulative total of 864 Xyston-class Star Destroyers has joined the Final Order; no further annual Xyston support will arrive."
 foc_khan.91.desc:0 "§LThe final inheritance of the Imperial remnants has been reforged in the Unknown Regions into something harsher than the Empire itself.§!\n\nThe Final Order on Exegol has fallen. Palpatine and the Sith Eternal have lost the fleet meant to rule the galaxy, uprisings erupt across countless systems, and the remaining First Order formations rapidly collapse. Rey carries the legacy of the Jedi forward; while hope endures, the Jedi will never truly vanish."
 foc_khan_rebel.10.desc:0 "§LFrom smuggling routes to local shipyards, resources are disappearing from Imperial ledgers and flowing toward the same cause.§!\n\nThe First Order crisis has engulfed the galaxy, but resistance has not ended. A new Rebel Alliance has established a hidden base in the D'Qar system near Jakku and is prepared to regroup at Crait and Ajan Kloss as the war changes. Joining will immediately end our subject status and place us alongside the Alliance against the First Order and the Final Order. The Rebels promise neutrality toward all other states."
 foc_khan_rebel.3.desc:0 "§LAnother callsign appears on a hidden frequency. The Empire calls it rebellion; more and more people are beginning to call it hope.§!\n\n§HThe First Order has openly descended upon the galaxy.§! Officers, pilots, intelligence personnel and volunteers unwilling to submit are gathering in secret on §HD'Qar§!.\n\nA new resistance has formed. It lacks the fleets and industry of the Republic at its height, but it is prepared to continue the war.\n\n§YThe Resistance now exists as a hostile power against the First Order.§!"
 foc_khan_rebel.42.desc:0 "§LThe Empire has always ruled through fear. Now someone has proved that fear cannot silence everyone.§!\n\nThe defences of the D'Qar system have been breached. Enemy forces crossed the outer asteroid field, shattered the orbital screen and forced the Resistance to abandon its forest hangars. Most survivors escaped at the last moment and will regroup at Crait once Starkiller Base no longer threatens the route. Resistance did not end at D'Qar."
 foc_khan_settings.10.desc:0 "§LThis is not a front-line order, but a supreme-level mobilization authority that determines the scale of the entire war.§!\n\nUnified Star Wars MOD settings. Combat strength and fleet quantity remain independent. Strategic fighter strength follows the main combat tier automatically: Vanilla = original fighter profile, Intermediate = SG profile, ACOT = BUFF/enhanced profile. The fighter submenu now controls only visual size and designer faction visibility."
 foc_khan_settings.11.desc:0 "§LThe strategic simulation chamber is ready, and the staff is waiting for confirmation of the rules that will govern this campaign.§!\n\nThis setting changes ship, weapon, supercapital and crisis-country combat values only; it no longer controls fleet numbers. Strategic fighters are synchronized automatically: Vanilla uses the original fighter profile, Intermediate uses the SG fighter profile, and ACOT uses the BUFF/enhanced fighter profile."
 foc_khan_settings.12.desc:0 "§LHigh Command has opened the tactical simulation terminal. Every parameter chosen here will shape the tempo of the coming war.§!\n\nDisable automatic arrival, re-enable it, or trigger the crisis immediately. A crisis already unleashed cannot be sealed away again."
 foc_khan_settings.13.desc:0 "§LThe strategic simulation chamber is ready, and the staff is waiting for confirmation of the rules that will govern this campaign.§!\n\nConfigure combat strength, fleet scale, and the §Hmaster story timeline start§!, or close immediately to use the defaults: §YIntermediate combat strength + Large reinforcement scale + all fighter families + original fighter model size + story start in 2200§!."
 foc_khan_settings.14.desc:0 "§LThe strategic simulation chamber is ready, and the staff is waiting for confirmation of the rules that will govern this campaign.§!\n\nNo percentage rescaling is used. These are the four distinct fleet-count sets actually present in the current mod; former High and Madness already shared the same counts. Battle fleets contain 7 / 14 / 20 / 27 ships. Existing support composition, the 864-ship per-faction cap, and the 360-day support cycle are unchanged."
 foc_khan_settings.15.desc:0 "§LThis is not a front-line order, but a supreme-level mobilization authority that determines the scale of the entire war.§!\n\nChoose when the §HStar Wars story for the current origin route§! begins. The Republic origin releases Naboo at the selected year and shifts its Republic-to-Empire-to-Rebellion-to-New-Republic-to-Order chain with it. Ordinary origins hold the New Republic/Imperial Remnant story and later First Order succession until that year. The First Order origin keeps its game-start relocation and core technology, but unresolved Bloodline, Resistance, Starkiller and Kylo beats begin from the selected year.\n\n§Y2200 is the default; 2250, 2300 and 2400 delay the route by 50, 100 and 200 years respectively.§!"
 foc_khan_vassal.11.desc:0 "§LThe channel remains silent for a long moment. The other side leaves only two choices: submit, or continue the war.§!\n\nThe First Order accepts only unconditional submission. We may become an Order Territory and preserve our empire."
 foc_khan_vassal.11.loyal_desc:0 "§LThis is not a diplomatic negotiation. It is an ultimatum guaranteed by fleets and superweapons.§!\n\nWe have become a First Order Territory. While we fulfill our territorial obligations, its fleets and Starkiller Base will regard us as friendly."
 foc_khan_vassal.12.desc:0 "§LThe channel remains silent for a long moment. The other side leaves only two choices: submit, or continue the war.§!\n\nThe Final Order demands unconditional obedience. We may become an Order Territory and avoid annihilation."
 foc_khan_vassal.12.loyal_desc:0 "§LThe channel remains silent for a long moment. The other side leaves only two choices: submit, or continue the war.§!\n\nWe have submitted to the Final Order and are regarded as friendly."
 foc_khan_vassal.2.desc:0 "§LThe enemy envoy’s hologram offers no pleasantries. The terms of surrender are already on the table.§!\n\nOur war against the First Order is turning against us. We may preserve our empire by accepting First Order rule as an Order Territory, or continue the war."
 foc_khan_vassal.3.desc:0 "§LThis is not a diplomatic negotiation. It is an ultimatum guaranteed by fleets and superweapons.§!\n\nThe Final Order demands unconditional submission. We may survive as a Final Order Territory, or continue the war."
 foc_kylo.10.desc:0 "§LThe wounds left by Snoke, Skywalker, and the Solo family have brought Ben Solo to another moment of choice.§!\n\nThe temple was not set alight from outside.\n\n§HBen Solo§! was the son of Leia Organa and Han Solo, and the strongest gift in the Skywalker line. From childhood a voice spoke inside his head — a presence calling itself §HSnoke§!, reaching in from the Unknown Regions, saying patiently: your family has always been looking for someone else when they look at you. They are afraid of you. Including the uncle who sent you away to that temple.\n\nThat night he opened his eyes and saw his uncle standing over his bed with a lit lightsaber.\n\nEverything the voice had told him was confirmed in that one instant.\n\nHe took several students, burned the temple, and dropped the name Solo. The name he chose for himself was §HKylo Ren§!."
 foc_kylo.11.desc:0 "§LThe dark side did not arrive all at once. It has been whispering in one man’s mind for years.§!\n\nThose who left Yavin IV with him became something new: the §HKnights of Ren§!.\n\nSix of them, and six crude weapons — axe, glaive, crossbow, heavy blade. Not one lightsaber, and nothing that resembles Jedi or Sith issue. They preach no doctrine and hold no rites. They appear where they are needed and empty the place.\n\nKylo Ren leads them. Snoke gave him the band as a reward and as a leash.\n\nHis own crossguard saber is self-built: the kyber crystal is cracked, the energy will not hold, so the hilt has to vent at both sides. The two lateral blades are not a design. They are a fault."
 foc_kylo.12.desc:0 "§LThe First Order’s war is widening, but the battle that will decide Kylo Ren’s fate is being fought within him.§!\n\nStarkiller Base was already breaking up, the thermal breach cutting down through the planet. On the narrow unrailed catwalk above the reactor, something else happened.\n\n§HHan Solo§! crossed an exploding installation for one reason: to walk out onto that bridge. He drew no weapon. He called one name — not Kylo Ren, but §HBen§!.\n\nAnd for a moment the man hesitated. He said he was being torn apart, that he needed help to break free of the pull of the light. He held out the lightsaber.\n\nThen he ignited it.\n\nSolo reached up and touched his son's face, and fell. Snoke never wanted a superweapon out of this. He wanted that one cut: only by severing the last tie does the student truly belong to the dark.\n\nThe price arrived immediately. After that cut he lost, in a snow forest, to an untrained scavenger."
 foc_kylo.13.desc:0 "§LNeither darkness nor light has abandoned him. He must decide which name he will finally answer to.§!\n\nIn the throne room of the Supremacy, Snoke was enjoying his own omniscience: he had read every wavering in his student's mind and knew exactly when the young man would ignite the blade and kill the prisoner.\n\nHe was right about the blade. He was simply wrong about which lightsaber was lying beside whose hand, and which way it was pointing.\n\n§HSnoke was cut in half by his own apprentice.§! The Praetorian Guard came at once, and Kylo Ren fought that room back to back with the scavenger.\n\nWhen it was over he offered her his hand and asked her to burn all of it down with him — Jedi, Sith, Resistance, First Order, all of it. She refused.\n\nSo he took the title of §HSupreme Leader§! and sat in a chair nobody would defend for him."
 foc_kylo.14.desc:0 "§LThe dark side did not arrive all at once. It has been whispering in one man’s mind for years.§!\n\nHe had smashed that helmet himself, in a lift.\n\nNow it is back. The fragments were fitted together one by one and the seams filled with molten red alloy, so the healed cracks run across the mask like veins. He has not explained why he wanted it repaired.\n\nAt the same time a signal came out of the deep Unknown Regions on no known channel. It repeats a single summons, and the coordinates point at a planet on no chart: §HExegol§!.\n\nHe flew there alone. Waiting for him was a man who should have died in a reactor shaft above Endor a very long time ago."
 foc_kylo.15.desc:0 "§LAt the height of the First Order’s power, a fracture has opened beside the Supreme Leader that no warship can repair.§!\n\nThe same phenomenon has been reported at both ends of the galaxy: two people seeing and hearing each other with no warning, close enough that water carried on one set of hands lands on the other's deck. Distance does not affect it. Shielding does not affect it.\n\nThe old records call this a §Hdyad in the Force§!: a pairing so rare that the two of them constitute a single power. It cannot be cut, and neither side can close it alone.\n\nFor the First Order this is an enormous tactical hole — whatever is in the Supreme Leader's head can be seen by someone else at any moment.\n\nFor the Supreme Leader himself it is something else. Every connection forces him to look again at what he did on that catwalk."
 foc_kylo.16.desc:0 "§LThe wounds left by Snoke, Skywalker, and the Solo family have brought Ben Solo to another moment of choice.§!\n\nTwo things happened at once.\n\nOut towards Exegol he had just been run through by the scavenger's blade, and then healed by the same hands — she told him she had wanted to take Ben Solo's hand.\n\nHalf a galaxy away, §HLeia Organa§! spent the last of her life reaching through the Force to call her son's name, and stopped breathing.\n\nHe sat in the wreckage a long time. His father appeared in front of him — a man he killed himself, who only repeated the same line as before: come home.\n\nHe threw the cracked crossguard saber into the sea.\n\nThe man who stood up was not Kylo Ren. §HBen Solo§! had come back, and he knew where he was going."
 foc_kylo.17.desc:0 "§LThe dark side did not arrive all at once. It has been whispering in one man’s mind for years.§!\n\nBeneath the Sith altar Palpatine drained the Force out of both of them and made himself young again. In the end the two of them took that price back.\n\nThe Final Order fleet burned into fragments across the Exegol sky. When the dust settled there was one body at the bottom of the pit, not moving.\n\n§HBen Solo§! climbed down, lifted her, and gave her everything he had left. She opened her eyes and said his name — the first time in thirty years anyone had called him that, and the first time he answered.\n\nThen he smiled, and fell, and his body became the Force. Only the cloak was left on the ground.\n\nThe Skywalker bloodline ends here. The name was picked up later by someone else, under two suns on Tatooine."
 foc_luke.10.desc:0 "§LA trail involving the Jedi, Vader, and the Skywalker bloodline is pulling the war toward something far more personal.§!\n\nWhen the Death Star came apart above Yavin IV, three fighters were left on the Alliance's tactical display.\n\nThe final run was flown by a pilot nobody knew. He switched off his targeting computer and put the torpedoes into a two-metre exhaust port by hand. Nobody can explain how, except the old man who flew out with him — and the old man had already died inside the station.\n\nThe pilot's name is §HLuke Skywalker§!, of Tatooine, previously a moisture farmhand.\n\nHe now serves in our command."
 foc_luke.11.desc:0 "§LA ripple moves through the Force again, and the fate of the Skywalker family becomes entangled with the galactic war.§!\n\nSkywalker left formation without authorisation. His X-wing's last recorded heading pointed at §HDagobah§! — a hot, fogbound swamp world that is almost blank on our charts.\n\nHe came back months later, covered in mud. He says he found someone there: a creature barely a metre tall who puts his sentences in the wrong order. Before the Republic fell, that creature was Grand Master of the Jedi Council. He has lived alone in that bog for twenty years.\n\nHe taught Skywalker one thing: do it, or don't. There is no trying.\n\nHe told him something else, which Skywalker has not repeated."
 foc_luke.12.desc:0 "§LA ripple moves through the Force again, and the fate of the Skywalker family becomes entangled with the galactic war.§!\n\nThe Cloud City operation failed completely. Solo was frozen in carbonite and handed to a bounty hunter; Skywalker fought Darth Vader alone in a reactor shaft and lost his right hand along with his lightsaber.\n\nWhen we pulled him out of the underside vent, he did not talk about the injury. He said only that Vader told him one thing at the end.\n\n§HThe man who killed his father is his father.§!\n\nMedical fitted the prosthetic. Nothing in the bay can repair the other thing. He must now decide for himself whether that message is a rope down into the dark, or a man who can still be pulled back."
 foc_luke.13.desc:0 "§LThe galaxy watches the war, while the Force attends to another struggle visible to only a few.§!\n\nThe shield generator fell to the ground team and Death Star II broke apart in orbit. What decided the war, however, happened in that station's throne room.\n\nSkywalker surrendered himself to the Emperor in order to see Vader one last time. The Emperor told him to strike his father down and take the place beside the throne. He won the duel — and then threw the lightsaber away and said he was a Jedi, as his father had been before him.\n\nThe Emperor began to kill him with Force lightning. And then the black armour moved: Darth Vader picked the Emperor up and threw him into the reactor shaft.\n\nUnder the mask was a dying old man. §HAnakin Skywalker§! was burned on the forest moon of Endor. His son lit the pyre."
 foc_luke.15.desc:0 "§LA ripple moves through the Force again, and the fate of the Skywalker family becomes entangled with the galactic war.§!\n\nDeath Star II came apart above Endor, and the station is not what the Empire actually lost.\n\nThe Emperor brought Skywalker to the throne room intending to make the young man choose between his father and himself, and kill the other. Every step went as planned — until Skywalker won the duel, threw the lightsaber away, and said he was a Jedi.\n\nThe Emperor answered with Force lightning. And the figure who had stood watching, motionless, for a very long time, finally picked his master up and threw him down the reactor shaft.\n\n§HDarth Vader is dead.§! The name every officer in the fleet was afraid of is gone from the command roster, and everything he brought with him is gone too.\n\n§YThe §HDarth Vader§! modifier is removed and his named commander is killed.§!"
 foc_luke.17.desc:0 "§LA ripple moves through the Force again, and the fate of the Skywalker family becomes entangled with the galactic war.§!\n\nSomething happened in the throne room of Death Star II a few minutes before it came apart, and the official Imperial bulletin does not mention it at all.\n\n§HPalpatine is dead.§! The man who lifted him off the dais and threw him down the reactor shaft was the one person he had trusted for twenty-three years.\n\nThere is no body, no will, and no heir — he never arranged an heir, because he had no intention of dying. The entire legitimacy of the New Order rested on one man, and that man did not even leave remains.\n\nWithin twelve hours the Coruscant high command constituted an §HImperial Regency§! and announced that the Emperor is attending to matters of state. Nobody believes that sentence, including the people who issued it.\n\nFrom today the Empire is held together by a military government with no name — and every sector governor and admiral is watching the others to see who moves first.\n\n§YThe Empire enters a succession crisis: stability, government attraction, unity and fleet fire rate all fall, and war exhaustion rises.§!"
 foc_luke.20.desc:0 "§LA trail involving the Jedi, Vader, and the Skywalker bloodline is pulling the war toward something far more personal.§!\n\nIn the peace following the Galactic Treaty, Ben Solo, son of Han Solo and Leia Organa, is already showing immense but unstable Force potential. Luke Skywalker formally begins building a new Jedi Temple on §HOssus§!, taking Ben among the first students he intends to train personally.\n\nAround the same period, a girl named §HRey§! is born. No one yet knows that she will one day enter a struggle between light and darkness that has already consumed generations."
 foc_luke.21.desc:0 "§LThe galaxy watches the war, while the Force attends to another struggle visible to only a few.§!\n\nAs the First Order prepares to wage open war, Palpatine, working through the cloned proxy Snoke, has spent years poisoning Ben Solo’s mind. Luke senses overwhelming darkness in Ben’s sleep and, for one terrible instant, ignites his lightsaber.\n\nBen wakes in terror and breaks completely. Lightning and fire consume the new Jedi Temple on Ossus. He abandons his old name, becomes §HKylo Ren§!, and joins the First Order. Luke severs himself from the Force and retreats into exile on §HAhch-To§!.\n\nThe disaster comes only shortly before the First Order begins its open blitzkrieg."
 foc_luke.22.desc:0 "§LA trail involving the Jedi, Vader, and the Skywalker bloodline is pulling the war toward something far more personal.§!\n\nSkywalker severed every trace of himself in the Force and vanished.\n\nHe went to §HAhch-To§!, an island world of sea stacks and seabirds. On one island stands a hollow tree, and inside it the original texts of the first Jedi — the true source of the Order.\n\nHe did not go there to guard them. He went there so the Order would end with him.\n\nHis argument is this: the Jedi were the flaw. At their height they were blind to the Sith, let the Sith grow from inside their own ranks, and let the Republic become an Empire in front of them. And the version he rebuilt himself burned down in a single night.\n\n§YLuke Skywalker leaves the active command roster.§!"
 foc_luke.30.desc:0 "§LA trail involving the Jedi, Vader, and the Skywalker bloodline is pulling the war toward something far more personal.§!\n\nBeneath the salt of Crait the Resistance had been pushed into a last mine shaft, and the door had been breached by siege artillery.\n\nThen one man walked out alone and stood in front of the entire First Order ground force.\n\nThey put everything they had into him for a full minute. When the smoke cleared he was still standing, brushing his shoulder. Kylo Ren came down to duel him personally and ran a blade straight through him — and touched nothing.\n\n§HIt was not Luke Skywalker.§! He was still on the rocks of Ahch-To, spending the last of his strength to project himself half a galaxy away, holding that army in place while the survivors slipped out through the back of the ridge.\n\nThey got out. And on Ahch-To he sat down facing two setting suns, became one with the Force, and left his cloak on the stone.\n\nThe whole galaxy heard about it. From that day the First Order stopped being the thing nobody dares to fight."
 foc_luke.31.desc:0 "§LA ripple moves through the Force again, and the fate of the Skywalker family becomes entangled with the galactic war.§!\n\nThe old tree on Ahch-To burned too, in the end. The Jedi texts were not inside it — someone had taken them first.\n\nAnd the figure who appeared beside the fire was not supposed to be there.\n\nHe said two things. The first was about failure: that it is the greatest teacher, and nobody wants to admit it. The second was about inheritance: what has to be passed on is not the books, but the people who pick them up.\n\nThe archives, the temples, the Council — all gone. But while anyone still stands up in the Force, the Order is not finished."
 foc_nr_fix.2.desc:0 "§LNew Republic engineers have rechecked the inherited archives, and several critical blueprints thought lost in the transition have finally been recovered.§!\n\nWith the Concordance in force, the undersea yards of Mon Cala have relit their slips.\n\nThe improvised wartime refits are finished. In their place are two designs that had been sitting at the bottom of the drawing cabinet: the §HNebula-class§! line ship, and the §HViscount-class§! that nobody ever actually approved a budget for — seventeen kilometres of hull the Mon Calamari have been preparing a generation to build.\n\n§YNebula-class and Viscount-class construction is now available, and both fixed designs have been added to the shipyard list.§!"
 foc_padme.10.desc:0 "§LWar has made every choice heavier, and neither Padmé nor Anakin can remain outside its consequences.§!\n\nNaboo elects its monarch, for a fixed term. When §HPadmé Naberrie Amidala§! stepped down, her people very nearly amended the constitution to keep her. She refused, and took a different post instead: Naboo's seat in the Galactic Senate.\n\nWhat she brought into the chamber was a badly timed position — against the Military Creation Act, against granting the Chancellor's office one more emergency power of any kind. In one speech she said a line that has been quoted ever since: the Republic will not be conquered, it will be handed over to applause.\n\nFewer senators vote with her every year.\n\nAnd one thing appears in no record at all: the boy brought back from Tatooine years ago has grown up into the most conspicuous Jedi in the Order. What is between them is forbidden by the Order's code and by the Senate's rules alike."
 foc_padme.11.desc:0 "§LThe Republic is beginning to collapse, while one of its most important changes is taking place between only a handful of people.§!\n\nThree years into the Outer Rim war, the Jedi Archives received a report that was never filed.\n\n§HAnakin Skywalker§! has begun having the same dream. He sees Padmé die in childbirth, and himself standing beside her, unable to do anything. He has had this dream once before — years ago, about his mother. That one came true in every detail.\n\nHe asked a Jedi Master. What he got was instruction: fear of loss is the path to the dark side, and he must learn to let go.\n\nThen he went to a box at the opera. The Supreme Chancellor told him a Sith legend there — a master so powerful he could influence life and death, and keep the people he cared about from dying. The story ends with that master killed in his sleep by his own apprentice.\n\nAnd afterwards the Chancellor added one line: it is not a power the Jedi will teach you.\n\n\n\n§LThe story and other effects are retained; this event no longer adds extra conspiracy points.§!"
 foc_padme.12.desc:0 "§LCoruscant’s night cannot hide the widening fracture between private lives and galactic politics.§!\n\nAfter the temple burned she took her own ship to §HMustafar§!. She did not believe the reports. She was going to ask him herself.\n\nThe man she found described a new order to her: the war would end, the galaxy would be stable, he was strong enough now to overthrow the Chancellor and rule it himself, and they could do it together. She stepped back and said she did not know this person.\n\nThen Obi-Wan Kenobi walked down the ramp of her ship.\n\nHe read it as betrayal — that she had brought him. §HHe closed his hand on her throat§! and did not stop until she collapsed on the lava shore.\n\nHe lost his own limbs in the duel that followed, burned nearly to nothing, and was carried off the rock and sealed into black life-support armour.\n\nShe was taken to the medical centre on Polis Massa, delivered twins, and stopped breathing. The surgeons could find no physical cause. Their words were that she had lost the will to live.\n\n§YPadmé Amidala is dead.§!"
 foc_padme.13.desc:0 "§LWar has made every choice heavier, and neither Padmé nor Anakin can remain outside its consequences.§!\n\nNaboo gave her a state funeral. The body in the casket still appeared to be carrying — that had to be believed by everyone, including the man who had just come off the surgical table in new armour.\n\nThere are two children, and they have to be separated.\n\nThe girl goes to Bail Organa of Alderaan, to grow up in a royal house and learn very early how to speak in a senate. The boy goes back to §HTatooine§!, to his father's step-family and a moisture farm — one of the least worth searching places in the galaxy.\n\nYoda goes to Dagobah. Obi-Wan stays in the Tatooine desert, watching that farm, for nineteen years.\n\n§YThe hope in the Force was not broken. It was hidden.§!"
 foc_raddus.2.desc:0 "§LAlarms still echo across the flagship, but the engineering crews have found a problem more difficult to explain than battle damage.§!\n\nWhen the flagship's inspection report came up, the duty officer assumed it was a recording fault.\n\nAll three of the §HRaddus§!'s dedicated bays — engineering, docking, and the axial strike command module running the length of the hull — showed as empty on the fitting list. The hull is sound, the reactor is nominal, and all one hundred and twenty fighters are in their racks. But the three things that make her more than a large ship had, at some point, stopped being there.\n\nThe cause turns out to be absurd: the authorisation register for those bays lists the owner as the Alliance to Restore the Republic. Since the Concordance we do not go by that name. Same ship, same crew — only the heading on the paperwork changed, and the system decided the bays were not ours.\n\nThe register has been corrected. The bays are coming back online.\n\n§YThe Raddus's three dedicated bays are restored and the standard Arkship fit-out is installed: hangar, laser battery, sensor array, habitation module, plus armour and shields. Her combat loss rule is also corrected — Arkships are disabled, never captured.§!"
 foc_reb.1.desc:0 "§LThe Empire has always ruled through fear. Now someone has proved that fear cannot silence everyone.§!\n\n§HLothal§! is an Outer Rim farming world nobody can place on a chart. The Empire flattened its grasslands into munitions works and test fields; the locals went from farmers to workers, on Imperial wages and Imperial rations.\n\nThen a handful of people started causing trouble: stolen supplies, wrecked convoys, a flag run up a comm tower. So few that the Imperial governor first logged it as ordinary crime.\n\nThey have signalled us asking for recognition and support. Once the uprising succeeds, §HLothal will break from the Empire and pass under Imperial Rebel control§!.\n\n§YTwo routes: open uprising lights morale immediately but brings the reprisal columns; a cell network is slower and survives.§!"
 foc_reb.2.desc:0 "§LThe Empire has always ruled through fear. Now someone has proved that fear cannot silence everyone.§!\n\nThe Holy City on §HJedha§! stood for thousands of years — where the Jedi took their kyber, and one of the last places in the galaxy a pilgrim could still go. The Empire has mined there for years, hollowing out the mountain and shipping the crystal away by the freighter-load.\n\nSaw Gerrera's partisans hide in that desert. They have fought the Empire for over a decade, dirty and undisciplined, and Alliance command has never been willing to claim them.\n\nThen the Empire fired once, above Jedha.\n\nNot a ship's gun. The thing from the rumours, at a single low yield. The Holy City and several hundred kilometres around it became a new crater in seconds, and the dust went up into the atmosphere.\n\n§HThe rumour is not a rumour any more.§!"
 foc_reb.3.desc:0 "§LThere is no parade and no declaration of war—only old ships, people who refuse to kneel, and a purpose becoming clearer by the day.§!\n\nThe yards of §HMon Calamari§! are underwater and invisible from orbit. The Empire has wanted them requisitioned since the occupation, but Mon Cala's output figures have missed target every year — they hid their best workers and their best drawings.\n\nThey have stopped pretending.\n\nWhat comes with them is a set of plans. Not cruiser refits — complete capital ship designs: the mid-weight §HNebula-class§!, and seventeen kilometres of hull nobody ever approved a budget for, the §HViscount-class§!.\n\nThe Mon Calamari say they have been preparing a generation for this.\n\n§YGain the Mon Cala yards bonus: hull, shields and shipyard build speed.§!"
 foc_reb.4.desc:0 "§LThere is no parade and no declaration of war—only old ships, people who refuse to kneel, and a purpose becoming clearer by the day.§!\n\nMandalore is not ruled by election, and not entirely by blood. It is ruled by a sword — the §HDarksaber§!, a black blade forged a thousand years ago by the first Mandalorian Jedi. Win it in single combat and you have the standing to command the clans.\n\nThe Empire's puppet governor holds it now, and he did not win it in combat.\n\nThe clans have split. Half want to take it back. Half want to see who is paying more first.\n\nWhere we stand decides which way this world falls.\n\n§YBacking the clan fleets grants ship bonuses and naval capacity; backing the commandos grants formidable ground strength.§!"
 foc_reb.5.desc:0 "§LThe Empire has always ruled through fear. Now someone has proved that fear cannot silence everyone.§!\n\nUntil now what opposed the Empire was not an organisation but dozens of small groups who did not know each other and did not trust each other: the workers of Lothal, the partisans of Jedha, the yards of Mon Cala, the clans of Mandalore, and the few senators who had not been taken away.\n\nThey sat at one table on Corellia and signed a document. It is short. The substance is one sentence: from today we are one army.\n\nThe §HAlliance to Restore the Republic§! exists. It has a flag, an order of battle, a single chain of command — and for the first time something the Empire can formally declare war on.\n\n§YGain the Declaration bonus: unity, diplomatic weight and stability rise, war exhaustion falls.§!"
 foc_reb.6.desc:0 "§LThe Imperial star charts still look whole, but resistance is quietly linking system to system beneath the surface.§!\n\nWith the Imperial Rebellion now in existence, the shipwrights of Mon Calamari have finally released the military cruiser plans they kept hidden from Imperial requisition. Until now, the few commissioned hulls could exist only as scripted wartime ships; the class was not available for standard yard construction.\n\nThe MC80 reactor, distributed shield grid, heavy turbolasers and fighter decks have now been standardized into a complete production design.\n\n§YMC80 Cruiser construction is now unlocked. The Galactic Republic cannot obtain this construction permission early.§!"
 foc_rebel_growth.2.desc:0 "A newly controlled inhabited system has joined the Imperial Rebellion. Its shipyards and reserves can supply a battle group, or provide the equivalent alloy budget and join the fleet supply network.\n\n§YChoose: 20 MC80 cruisers, or 29,800 alloys and another −5% ship upkeep.§!\nThe alloy reward equals 20 times the reward MC80 design’s base alloy cost: 1,490 per ship, including hull and equipment, before national discounts. Each eligible system pays once."
 foc_rebyard.2.desc:0 "§LThe Rebellion has reached the point where it must answer a simple fact: without shipyards, there can be no real fleet.§!\n\nThe Alliance has had a problem since the day it formed that nobody wanted to say out loud: we can steal ships, refit ships and weld freighters into gunboats, but we have nowhere to lay a keel.\n\nThe systems we hold have outposts — a listening mast and a hyperlane inhibitor, and that is all. Nothing can be fitted to them, because there is nowhere on them to fit anything.\n\nEngineering has spent months expanding the capital's outpost into a proper citadel: two slips, an anchorage, a gun battery, crew quarters and a logistics office. Two other colonised systems each got a single slip for forward repair and spare capacity.\n\nThe rest stay as they are. The Alliance cannot afford fortresses everywhere, and does not need them.\n\n§YThe capital system is upgraded to a citadel with two shipyards, an anchorage and a gun battery; two further systems become starports with a shipyard each.§!"
 foc_rebyard.4.desc:0 "§LThe Rebellion has reached the point where it must answer a simple fact: without shipyards, there can be no real fleet.§!\n\nBoth Death Stars are wreckage, and the ring yards of §HKuat§! have fallen into our hands intact.\n\nThe Empire had no time to destroy anything on the way out — the slips are simply too large, large enough that the demolition teams ran the numbers and gave up. What is left is not only the production line. The drawing cabinets are still there, still on the locks fitted before the Imperial takeover.\n\nOn the top shelf is a design that was never laid down. A mid-weight capital ship, firepower worthy of its tonnage, at a fraction of the cost of an Imperial-class — the Republic Navy's intended next-generation line ship for the postwar rebuild. The Senate never approved the budget, and the Empire locked it away.\n\nThe Mon Calamari engineers looked at one sheet and said they recognised the lines. Half of this design is theirs.\n\nThe §HNebula-class Star Destroyer§! blueprint is unsealed.\n\n§YNebula-class construction is unlocked and the fixed design has been added to the shipyard list. The Viscount class remains sealed until the Galactic Concordance.§!"
 foc_rem.1.desc:0 "§LThe Empire has fallen, but Imperial officers remain. In the ruins, the remnants are deciding what they are willing to become.§!\n\nOn paper the Concordance left the Imperial Remnant as one state. It did not.\n\nEvery Outer Rim sector still flying Imperial colours has its own fleet, its own yards, and a governor or admiral calling himself the lawful successor. Some still issue orders in the Emperor's name; some have started minting their own currency. They have more border incidents with each other than with the New Republic.\n\nThe Remnant government has to settle this before it can do anything outward at all.\n\n§YIron discipline: stability and combat strength rise, happiness falls. Bought loyalty: naval capacity and stability rise, fleet upkeep rises.§!"
 foc_rem.2.desc:0 "§LThe Empire has fallen, but Imperial officers remain. In the ruins, the remnants are deciding what they are willing to become.§!\n\nAn Imperial-class Star Destroyer jumped in from the direction of the Unknown Regions, transmitted no identification, and came straight through the Remnant picket line.\n\nName: §HChimaera§!. Old, immaculately maintained, and carrying battle repairs of a kind nobody here recognises — those were not made by New Republic weapons.\n\nWhat it brings is more than a ship. It brings a chart of the galactic rim, a set of tactics ground out over years of fighting in the Unknown Regions, and a bridge that people are finally willing to obey.\n\nFrom today the Remnant fleet has a real flagship.\n\n§YGain the Chimaera bonus: damage, accuracy and tracking rise, war exhaustion falls.§!"
 foc_rem.3.desc:0 "§LThe Imperial crest still hangs over command bridges, but every banner now conceals a different ambition.§!\n\nThe Old Republic once built a fleet of two hundred Dreadnaught-class heavy cruisers, all full-rigged for slave circuitry, so that one bridge could command two hundred ships. On the maiden voyage the crews caught a plague and, out of their minds, jumped the whole fleet into hyperspace together.\n\nFor fifty years, looking for it has been the galaxy's most famous business in legends. Nobody found it.\n\nSomeone has now.\n\nThe hulls are intact, the reactors cold but sound, the weapons fifty years out of date — not advanced by today's standards. They do not need to be advanced. They need to be numerous.\n\n§YA Katana fleet has been entered into the Remnant order of battle.§!"
 foc_rem.4.desc:0 "§LFortress worlds across the Outer Rim watch one another carefully, each warlord waiting for the others to expose weakness.§!\n\nThe ring yards of §HKuat§! are the largest military industry in the galaxy; sixty percent of Imperial Navy tonnage was launched there. The Concordance gave Kuat to the New Republic — but the yards belong to Kuat Drive Yards, and that is a company.\n\nCompanies do not discuss positions. They discuss orders.\n\nThey have sent someone with a very practical proposal: New Republic orders are booked out seven years, and idle capacity in between is idle either way. The price is agreed. Delivery leaves no record.\n\n§YGain the Kuat contracts bonus: hull, armour and shipyard build speed.§!"
 foc_rem.5.desc:0 "§LThe stars are unusually quiet after the armistice, yet the engines of the old Imperial fleet have never truly gone cold.§!\n\nThe purge is finished, the flagship is back, the fleet is filled out and the yards are contracted. For the first time the Remnant is not a remnant but a state capable of making a choice.\n\nThe staff has put two proposals on the table.\n\nOne says hold the Outer Rim and nothing more. Accept the Concordance, settle these few dozen sectors, and spend twenty years making them into a country that can actually stand on its own — at the price of giving up forever the galaxy that used to be ours.\n\nThe other says move now. The New Republic senate is still arguing over the fleet budget, its border garrisons are hollow, and we have a man who knows how to win.\n\n§YConsolidation: large gains to stability, unity and diplomatic weight, lower war exhaustion, but reduced fleet damage. Reconquest: large gains to damage, fire rate, naval capacity and ground strength, at the cost of stability.§!"
 foc_republic_origin.12.desc:0 "§LCoruscant’s lights illuminate an entire world, but not the shadow gathering at the center of power.§!\n\nThe Trade Federation, the Banking Clan and the Techno Union have sent a single delegation. What they want is phrased very politely: legal recognition for the combines' 'escort forces', in exchange for a startling voluntary contribution and a cut in lane duties.\n\nEveryone understands what those escort forces are. They are fleets that answer to no senator.\n\nThe Chancellor's office has taken no position. It has simply put the proposal on this session's order paper.\n\n§YThis is one of the five key decisions. Only the option favorable to Palpatine counts 20 points; the other counts 0. Each decision is recorded once.§!"
 foc_republic_origin.13.desc:0 "§LCoruscant’s endless traffic lanes still blaze with light, yet the Republic’s fate has already begun to turn.§!\n\nThe Senate has spent an entire session on one bill: should the Republic have a standing army of its own?\n\nFor a thousand years its forces have been provided by its member systems. Supporters say the frontier is no longer safe. Opponents say an army answerable only to Coruscant will sooner or later be used by someone on Coruscant.\n\nThe vote is yours.\n\n§YThis is one of the five key decisions. Only the option favorable to Palpatine counts 20 points; the other counts 0. Each decision is recorded once.§!"
 foc_republic_origin.14.desc:0 "§LThe Republic Archives would later seal this day under special classification, for too many galaxy-changing decisions began with an ordinary report.§!\n\nA routine audit turns up a payment. The sum is small, but it appears in the budget eleven times, and every time it goes to a shell company registered in the Outer Rim with no employees.\n\nFollowing it upward, the third layer runs into a file that cannot be opened without authorisation from the Chancellor's office.\n\nThe auditor's report ends with a question: continue?\n\n§YThis is one of the five key decisions. Only the option favorable to Palpatine counts 20 points; the other counts 0. Each decision is recorded once.§!"
 foc_republic_origin.15.desc:0 "§LThe galaxy still believes the Republic can survive this crisis; the crisis itself is already remaking the Republic.§!\n\nThe wartime emergency is about to expire. By law the powers return to the Senate on that day.\n\nBut the front is still active, and fleet movements, requisitions and provincial martial law all hang on that one authorisation. The Chancellor says only this: he will hand the powers back personally, on the day the war ends.\n\nThe Senate is waiting to see where you stand.\n\n§YThis is one of the five key decisions. Only the option favorable to Palpatine counts 20 points; the other counts 0. Each decision is recorded once.§!"
 foc_republic_origin.160.desc:0 "§LFrom the Core Worlds to the Outer Rim front, the same message is being confirmed again and again over secure channels.§!\n\nBoth Death Stars and Executor, Lusankya and Punisher have been destroyed, and the Galactic Empire has lost Coruscant, Jakku and Kuat. The three strategic systems need not all be Rebel-owned; the Empire can no longer sustain the war and is forced to sign the Galactic Concordance."
 foc_republic_origin.161.desc:0 "§LThe Senate still tries to preserve order through procedure, even as war pushes every old rule toward its breaking point.§!\n\nBoth Death Stars and Executor, Lusankya and Punisher are gone, and we have lost Coruscant, Jakku and Kuat. Whoever now holds those strategic systems, the Galactic Empire can no longer sustain its old territory and must accept the Galactic Concordance."
 foc_republic_origin.162.desc:0 "§LThere is no grand ceremony—only an order, a report, and consequences that no one will later be able to reverse.§!\n\nThe Empire's open war is over, but its secrets did not die with it. High Command authorises the consolidation of Unknown Regions industry, kyber-crystal research and the surviving fleets into the §HFirst Order Plan§!.\n\nThe §HFirst Order Plan§! special project has been added to the Situation Log. Completing it will open §HIlum§! and unlock §HStarkiller Base, Supremacy and Resurgent§! technology; it will not immediately turn the country into a crisis."
 foc_republic_origin.165.desc:0 "§LThere is no grand ceremony—only an order, a report, and consequences that no one will later be able to reverse.§!\n\nThe routes into the Unknown Regions are complete. Ilum and the First Order technologies are unlocked. If the surviving state is the post-Treaty Imperial Remnant, completion of the plan immediately renames it the First Order and installs Supreme Leader Snoke. The formal crisis, ship-culture conversion and galaxy-wide war still wait for a completed Starkiller Base."
 foc_republic_origin.169.desc:0 "§LThe Republic Archives would later seal this day under special classification, for too many galaxy-changing decisions began with an ordinary report.§!\n\nThe Empire has completed §HDeath Star I§!, but Rebel Intelligence has intercepted an encrypted transmission from §HScarif§!. Its secret research base and archive contain the battlestation's complete structural and reactor plans.\n\n§YTake Scarif before attacking the Death Star.§! The plans unlock a Curator-style target-country damage bonus whenever a Rebel fleet enters a live Death Star's system: §H+2500% damage§! against the owning Empire. The Death Star's hull, armour, shields, weapons and reinforcement package remain untouched."
 foc_republic_origin.17.desc:0 "Reconnaissance confirms the droid foundries on Akiva. They are a major industrial and logistical objective."
 foc_republic_origin.170.desc:0 "§LCoruscant’s lights illuminate an entire world, but not the shadow gathering at the center of power.§!\n\nDeath Star I is operational above Coruscant. First Order technology remains sealed, and the Phase-II plan cannot begin unless this first battlestation is destroyed."
 foc_republic_origin.171.desc:0 "Death Star I has been destroyed. The Rebels receive their existing victory reward, and the old Death Star attack bonus ends immediately.\n\nA player Empire receives the Death Star II engineering project immediately; completion triggers Bothan intelligence and deploys the station at Endor. An AI Empire reveals and deploys its unfinished station exactly four years after this loss. Existing Imperial support-fleet rules remain in effect."
 foc_republic_origin.173.desc:0 "Bothan intelligence has located the unfinished Death Star II at Endor. Hull, armor, shields and weapon output are 1.3 times Death Star I; initial speed is zero. The AI never performs the mobile refit, and the expired Scarif attack solution does not return."
 foc_republic_origin.174.desc:0 "Death Star II is operational above Endor, with unfinished outer plating and propulsion. Initial speed is zero; hull, armor, shields and weapon output are 1.3 times Death Star I. A player Empire can research the optional completion and mobile refit to restore propulsion and adopt the original Death Star I model at 1.3 times its size."
 foc_republic_origin.175.desc:0 "§HThe second battlestation is gone.§! Rebel troops destroyed the shield generator on Endor, allowing starfighters to reach the main reactor through the unfinished superstructure. Imperial authority collapses in the aftermath.\n\n§YThe Empire's 360-day reinforcement stream now ends; fleets already delivered remain. The Rebels still receive the existing one-time reward for this battlestation's destruction, but newly acquired systems no longer grant fleets, resources, or additional upkeep-reduction stacks. Unclaimed system-acquisition rewards are cancelled.§!"
 foc_republic_origin.176.name:0 "Both Death Stars Lost: Inner-Rim Uprising"
 foc_republic_origin.176.desc:0 "§LWhen the second Death Star broke apart above Endor, the fear that held the Empire together broke with it.§!\n\nAcross the galaxy, the systems assigned by the eventual Galactic Concordance to the §HNew Republic§! rise almost at once. Local garrisons defect, governors lose control and restored councils openly side with the Rebel Alliance. §HCoruscant and Kuat are the only exceptions§! and must still be taken by force.\n\n§HJakku§! belongs to the postwar Imperial Remnant and is therefore outside this uprising; it remains one of the strategic systems the Galactic Empire must lose for the military Concordance route. Executor, Lusankya and Punisher must also still be destroyed.\n\n§YMechanic: every current-map system whose final Treaty owner is the New Republic immediately joins the Rebels, except Coruscant and Kuat.§!"
 foc_republic_origin.177.desc:0 "The Scarif operation secures the Death Star archive, but the complete plans have not yet safely reached Alliance command.\n\nThis event records the theft only. The Alderaan and Leia aftermath waits thirty days after Scarif. Death Star targeting and shield-damage intelligence unlock only when the Leia rescue event fires."
 foc_republic_origin.180.desc:0 "Executor guards Endor, Lusankya guards Coruscant, and Punisher guards Jakku. Each of the three groups consists of one Executor-class flagship and thirty Imperial II-class escorts. The unique flagships are commissioned once and are never rebuilt after destruction."
 foc_republic_origin.181.desc:0 "§LThere is no grand ceremony—only an order, a report, and consequences that no one will later be able to reverse.§!\n\nThe battlestation is in service, which raises the question of what it is actually for.\n\nGovernor Tarkin's answer is set out in a memorandum to the Emperor: §Hrule through the fear of force, rather than through force itself§!. A station that can destroy a world only has to exist for a thousand systems to abandon the idea of resistance. It never has to fire.\n\nThe other view is plainer. The Empire still has to collect taxes, maintain roads and issue rations. Fear holds for a while. It does not hold for a century.\n\n§YMechanic: while the Galactic Empire still possesses Death Star I or Death Star II, organic/random partisan escalation and spontaneous uprisings are suppressed by fear. They resume automatically once no Death Star remains. Rebel-directed espionage operations are unaffected.§!"
 foc_republic_origin.182.desc:0 "§LThe Republic Archives would later seal this day under special classification, for too many galaxy-changing decisions began with an ordinary report.§!\n\n§HStarkiller Base is fully charged.§! The senate, fleet command and principal communications network of §Y[event_target:foc_story_new_republic_strike_country.GetName]§! are concentrated on §H[event_target:foc_story_new_republic_strike_target.GetName]§!.\n\nOpen the Starkiller Base firing interface and designate that world as the primary target. Destroying the New Republic capital will shatter its central government and force the survivors to retreat to D'Qar as the Resistance."
 foc_republic_origin.190.desc:0 "§LThe Republic Archives would later seal this day under special classification, for too many galaxy-changing decisions began with an ordinary report.§!\n\n§HStarkiller Base is complete.§! The Imperial state that completed the First Order Plan formally reforms as the §HFirst Order§! and becomes a crisis.\n\nThe ensuing §HGalactic New Order, Final Order, Force Avatar and cosmic ascension§! sequence is identical to the First Order origin. This crisis route cannot begin before Starkiller Base is complete."
 foc_republic_origin.192.desc:0 "§LCoruscant’s endless traffic lanes still blaze with light, yet the Republic’s fate has already begun to turn.§!\n\n§HHosnian Prime is gone.§! The capital, the Senate and the separate New Republic government that remained there have been erased in a single column of light. Its surviving Inner Rim holdings collapse before the First Order.\n\nBut the contingency was made in time. §HD'Qar§! and the §HResistance§! are a different state, and the country under your command was already inherited there when the First Order appeared. Hosnian's destruction cannot reach the player identity, leaders, knowledge or treasury carried into that resistance."
 foc_republic_origin.2.desc:0 "§LWhile the Republic still calls itself the guardian of peace, the machinery of war is already turning.§!\n\nThe Galactic Senate opens a new session on §HCoruscant§!. Delegates from twenty-seven member systems gather beneath the dome: the industry and hyperlanes of the §H14-system Inner Rim§!, the ore and border garrisons of the §H13-system Outer Rim§!, together sustaining a union a thousand years old.\n\nEvery member world is administered from a §HMember-World Administrative Economic Nexus§!, supplying energy, minerals, food, consumer goods and alloys, and holding together local order and livelihood. The yards are expanding and escort squadrons patrol the great trade lanes.\n\nYet the Outer Rim tax disputes never quite settle, the commercial combines enlist more private troops every year, and in the Chancellor's office the emergency powers accumulate, one decree at a time."
 foc_republic_origin.20.desc:0 "The Confederacy submits its surrender.\n\nHostilities will end, all remaining territory including §HMustafar§! will be transferred over separate days, and the Confederacy will dissolve without a Council rump state. Order 66 and the birth of the Empire follow the end of the Clone Wars."
 foc_republic_origin.21.desc:0 "§LThere is no grand ceremony—only an order, a report, and consequences that no one will later be able to reverse.§!\n\nAn unsigned briefing crosses your desk: emergency decrees, off-ledger military funding, proxies in the Senate, all drawing together into an invisible web around the Supreme Chancellor.\n\nNothing in it can be proven. But after every crisis, power on Coruscant sits a little more tightly in one pair of hands than it did before."
 foc_republic_origin.22.desc:0 "§LThe distance between the Senate and the front has never felt greater, and everyone is waiting for an answer that will decide what comes next.§!\n\nOnce the §HClone Army Plan§! has been resolved, the Republic must prepare true capital-ship production for the war ahead. §HKuat Drive Yards§! submits a comprehensive expansion plan to the Senate.\n\nThe project can proceed only while the Republic controls Kuat. Losing the system aborts the project; retaking it requires starting again. Its engineering cost is tuned for roughly §Height years§! of early-Republic research."
 foc_republic_origin.23.desc:0 "§LThe distance between the Senate and the front has never felt greater, and everyone is waiting for an answer that will decide what comes next.§!\n\nThe growth vats of Kamino deliver the Republic's first clone legions. In the name of defending the Republic the Senate approves the §HClone Army Plan§!: no longer dependent on the local forces of its member systems, the Republic now fields a standing army that spans the galaxy and answers to the General Staff alone.\n\nAnd wartime command of the General Staff rests with the Supreme Chancellor.\n\nCommand of the first legions goes to §HCommander Cody§! - a clone, loyal to the Republic, and to whatever order supersedes the Republic.\n\n§YFixed milestone: conspiracy +10, recorded once.§!"
 foc_republic_origin.24.desc:0 "§LThe Senate still tries to preserve order through procedure, even as war pushes every old rule toward its breaking point.§!\n\nThe new slipways at §HKuat Drive Yards§! have lit their furnaces. The Republic Navy gains the §HVenator-class Star Destroyer§! - a capital ship that is both fleet flagship and carrier - and from today its keel can be laid in any Republic military yard.\n\nThe expansion grant was signed in the Chancellor's office. Kuat's board knows perfectly well whose order this is.\n\n§YFixed milestone: conspiracy +10, recorded once.§!\n\n§HAdvanced Durasteel Armor§! is now unlocked. Kuat receives its orbital ring reward; if no ring, construction or ruins already occupy the site, a §Htier III orbital ring§! with §Hfour shipyards§! is completed immediately."
 foc_republic_origin.25.desc:0 "§LThe Senate chamber still echoes with applause and argument, but history will remember what happens next.§!\n\nOne encrypted instruction reaches the command channel of every clone legion at the same moment. It is numbered §H66§!.\n\nThe soldiers who carry it out do not hesitate and do not ask why. From Coruscant to the Outer Rim, the generals and senators loyal to the Senate are removed in a single night. The spires of the Jedi Temple burn until morning; Yoda and Windu do not walk out of them, and the Order is all but gone.\n\nThe man who led the assault into the Temple was the one they used to call the Chosen One.\n\nThe army of the Republic no longer belongs to the Republic."
 foc_republic_origin.26.desc:0 "§LCoruscant’s lights illuminate an entire world, but not the shadow gathering at the center of power.§!\n\nA battered light freighter requests landing clearance at the edge of the base, squawking a transponder code that belonged to a Jedi flight decommissioned years ago.\n\nThe figure who steps out when the ramp drops still has Temple ash on his clothes: §HObi-Wan Kenobi§!, one of the few who got off Coruscant that night.\n\nThe first thing he says is not about himself. The man who carried out the purge, who cut his way through the Temple personally, was once his apprentice.\n\nBut the Order lives. That fact alone is enough to straighten the spine of the whole rebellion."
 foc_republic_origin.27.desc:0 "§LCoruscant has not stopped moving, but the air carries the unmistakable stillness before a storm.§!\n\nOrder 66 did not kill every Jedi. A handful slipped away that night and disappeared into the folds of the galaxy.\n\nThe Emperor has long since prepared for this. Fallen Force-sensitives are gathered, given black armour and spinning blades, and formed into a body answerable to him alone: the §HInquisitorius§!.\n\nThey have exactly one task - find the rest."
 foc_republic_origin.28.desc:0 "§LThere is no grand ceremony—only an order, a report, and consequences that no one will later be able to reverse.§!\n\nThe Temple is still burning.\n\nThe unit that carried out Order 66 there was led by a Jedi: the sharpest blade the Republic had, Obi-Wan Kenobi's apprentice, the one prophecy named as the Chosen One who would end the Sith. He walked into the place he grew up in, and never walked out of it under that name again.\n\nThe Emperor has given him a new one: §HDarth Vader§!.\n\nFrom now on the will of the Empire takes the field in person."
 foc_republic_origin.30.desc:0 "§LCoruscant has not stopped moving, but the air carries the unmistakable stillness before a storm.§!\n\nThe lights go down in the Senate chamber. The Supreme Chancellor takes the rostrum and declares the Republic reorganised, from this day, into the §HGalactic Empire§! - for a safe and secure society. The applause is deafening.\n\nNot everyone is applauding. Mon Mothma and a bloc of senators have already left Coruscant, and squadrons still loyal to the old Republic are gathering at §HYavin, D'Qar and Hoth§!. The galaxy will choose between two flags.\n\nThe state you command passes intact into your hands. It will raise one of those flags, keep its fleets, its yards and its people, and go to war with the other."
 foc_republic_origin.32.desc:0 "§LFrom the Core Worlds to the Outer Rim front, the same message is being confirmed again and again over secure channels.§!\n\nThe Imperial banner rises over Coruscant. The territory, yards and fleets of the old Republic pass whole into the new order, and the production lines for the §HImperial-class Star Destroyer§! are already running; the §HExecutor-class§! drawings remain locked in an engineering vault - a contingency to be opened only if a Death Star is ever lost.\n\nThe Emperor has also approved a project under the codename §HDeath Star§!: a battlestation capable of destroying a world. Once it is built, no rebellion will ever need to be negotiated with again."
 foc_republic_origin.33.desc:0 "§LFrom the Core Worlds to the Outer Rim front, the same message is being confirmed again and again over secure channels.§!\n\n§HYavin, D'Qar, Hoth§! - three hidden bases, a handful of squadrons that refused to stand down, and a list of names carried out of the old Senate. That is the whole of what stands against the Empire.\n\nIntelligence speaks of a battlestation unlike anything built before. If it is completed, any world it targets simply ceases to exist. The Imperial archive on Scarif may hold its weakness.\n\nThe rebellion begins today."
 foc_republic_origin.5.desc:0 "§LThe galaxy still believes the Republic can survive this crisis; the crisis itself is already remaking the Republic.§!\n\nTrade Federation freighters have blockaded §HNaboo§! and the Mid Rim lanes have seized up. The Senate argues procedure for weeks while the relief fleet never leaves dock.\n\nOut of the deadlock, a senator of the Naboo delegation moves a vote of no confidence in the sitting Supreme Chancellor, and is carried into that office by the vote that follows. His name is §HPalpatine§!.\n\nHe assures the Senate that all the Republic needs is efficiency.\n\n§YFixed milestone: conspiracy +10, recorded once.§!"
 foc_republic_origin.50.desc:0 "§LThe distance between the Senate and the front has never felt greater, and everyone is waiting for an answer that will decide what comes next.§!\n\nThe Republic's final colony has fallen, but surviving senators, officers and warships have assembled at §HD'Qar§! as a new §HRebel Alliance§!. Destroying the Republic completes only the second Dark Legacy gate. The Death Star must be finished and the Rebels eliminated before Order technology or the Galactic New Order crisis path can activate."
 foc_republic_origin.6.desc:0 "§LCoruscant’s lights illuminate an entire world, but not the shadow gathering at the center of power.§!\n\nFrom the spires of the Temple on Coruscant, the Jedi Council sends its greetings to the new session.\n\nThe Order belongs to no member system and answers to no senator. For a thousand generations it has settled disputes, escorted envoys and steadied the frontier, holding this vast and loose union together. In return, the Republic has never asked what happens inside the Temple.\n\nGrand Master §HYoda§! and Master §HMace Windu§! attend for the Order. Yoda adds only one remark: the Force has been uneasy of late.\n\nThe §HJedi Temple§! is open on Coruscant. While it stands, the Republic can raise Jedi formations from it."
 foc_republic_origin.60.desc:0 "§LThe Republic Archives would later seal this day under special classification, for too many galaxy-changing decisions began with an ordinary report.§!\n\nThe Imperial coup has failed and Palpatine's Empire has broken apart. The surviving powers sign the §HGalactic Concordance§!:\n\n- The Inner Rim reforms as the §HNew Republic§! with its capital at §HHosnian Prime§!, still under your command;\n- The Outer Rim withdraws to Bastion and holds the last Imperial territory as the §HImperial Remnant§!;\n- Both remain ordinary successor states rather than Fallen Empires;\n- Both sides retain their legacy post-war fleet packages.\n\nThe treaty is signed. Somewhere in the Unknown Regions, there are those who do not recognise it."
 foc_republic_origin.7.desc:0 "§LThe distance between the Senate and the front has never felt greater, and everyone is waiting for an answer that will decide what comes next.§!\n\nWith the Outer Rim in revolt, the Senate resolves that Jedi are to hold temporary commissions as commanders of the clone legions.\n\nInside the Temple the argument is bitter. Some say keepers of the peace should never be generals. Others say the Republic needs them. In the end the Senate sends the lightsabers to the front, and §HObi-Wan Kenobi§! takes a general's rank alongside his former apprentice §HAnakin Skywalker§!.\n\nIt is the first time the Order has gone to war as an institution. In closed session Yoda says something nobody wants entered into the record: this war will change the Order, not the other way round."
 foc_republic_origin.70.desc:0 "§LCoruscant’s endless traffic lanes still blaze with light, yet the Republic’s fate has already begun to turn.§!\n\nThat is no moon. The §HDeath Star§! is operational above Coruscant, its superlaser capable of shattering an entire world. The project gate is complete, but Dark Legacy still requires the destruction of both the Republic and Rebel Alliance."
 foc_republic_origin.76.desc:0 "§LCoruscant’s endless traffic lanes still blaze with light, yet the Republic’s fate has already begun to turn.§!\n\nRepublic survivors have established a covert base at §HD'Qar§! and declared war as the §HRebel Alliance§!. They reuse our starting main species and the existing Rebel ship and hero-fleet package. D'Qar is the uprising's sole political center; taking its last colony ends the Rebellion."
 foc_republic_origin.8.desc:0 "§LThere is no grand ceremony—only an order, a report, and consequences that no one will later be able to reverse.§!\n\nThe Grand Master asks to see you privately.\n\nThe Order senses a dark side presence, he says, here on Coruscant, close to the centre of power - but something clouds the Force and they cannot see whose it is. The Council requests authority to investigate the office of the Supreme Chancellor.\n\nNothing like it has happened in the history of the Republic. Grant it, and you publicly doubt a wartime Chancellor. Refuse, and the Order will obey, and go on searching in the dark.\n\n§YThis is one of the five key decisions. Only the option favorable to Palpatine counts 20 points; the other counts 0. Each decision is recorded once.§!"
 foc_republic_origin.80.desc:0 "§LThe Senate still tries to preserve order through procedure, even as war pushes every old rule toward its breaking point.§!\n\n§HThe Death Star is complete, the Republic has fallen, and the Rebel Alliance has been destroyed.§! All three gates are satisfied. Sealed §HStarkiller Base, Resurgent and Supremacy§! technologies, edicts and construction projects are now unlocked. The §HXyston-class§! remains sealed until the Final Order stage.\n\nThe ordinary First Order crisis is permanently bypassed. The Empire is forced into the First Order origin's complete §HGalactic New Order, Final Order, Force Avatar and cosmic ascension§! crisis sequence. The Final Order choice will arrive in twenty years."
 foc_republic_origin.90.desc:0 "§LThe Republic Archives would later seal this day under special classification, for too many galaxy-changing decisions began with an ordinary report.§!\n\n§HStarkiller Base is complete.§!\n\nAn entire world has been hollowed out and rebuilt around stellar-energy collection arrays. When the weapon charges, the star above it dims piece by piece until its light is consumed; when it fires, the beam crosses hyperspace and strikes multiple systems almost simultaneously.\n\nThe Empire ends here. What rises to replace it has emerged from the Unknown Regions under another name.\n\n§YOur nation formally becomes the new galactic crisis. The normal First Order crisis is permanently bypassed, opening the Galactic New Order, Final Order, Force Apotheosis, and cosmic ascension storylines. The Final Order decision will arrive in twenty years.§!"
 foc_rogue_one.1.desc:0 "§LThe secret routes linking Scarif, Jedha, and the Death Star are being redrawn. An operation with no path of retreat has begun.§!\n\n§HThe first Death Star is now operational.§!\n\nDirector Orson Krennic has demanded a controlled, low-power demonstration to prove to the Emperor that Project Stardust has succeeded. The target is §HJedha§!—a world the Empire has mined for kyber crystals for years, and where Saw Gerrera’s fighters remain active.\n\nOnly part of the superlaser reactor is engaged. Even so, the Holy City vanishes within seconds, and the shockwave turns the surface into an expanding ring of fire.\n\nGrand Moff Tarkin does not congratulate Krennic after reviewing the recording. He asks only one question: when can the station be placed directly under Imperial Fleet command?"
 foc_rogue_one.10.desc:0 "§LThe Empire sees this project as the final answer to rebellion. The Rebellion is searching for the one flaw that can undo it.§!\n\nIn the chaos after Jedha’s destruction, Saw Gerrera’s people deliver an unexpected prisoner. §HBodhi Rook§! was once an Imperial cargo pilot assigned to supply secret engineering sites.\n\nHe asks for no asylum and names no price. He repeats only one message: a man named §HGalen Erso§! sent him, and the information must reach the Rebel Alliance.\n\nErso is one of the principal engineers behind the Empire’s planet-killing weapon."
 foc_rogue_one.11.desc:0 "§LThe secret routes linking Scarif, Jedha, and the Death Star are being redrawn. An operation with no path of retreat has begun.§!\n\nThe damaged holographic message is finally restored. Galen Erso admits his role in the Death Star project—and explains why he stayed.\n\nHe could not stop the Empire from building the weapon, so he chose to ensure that it would carry a fatal flaw from the moment of its creation: an apparently ordinary reactor exhaust structure capable of transmitting a precisely placed hit directly to the main reactor.\n\nBut the message contains no complete schematics. Erso leaves only an archive codename—§HStardust§!—and the location of the master design files: §HScarif§!."
 foc_rogue_one.12.desc:0 "§LThe secret routes linking Scarif, Jedha, and the Death Star are being redrawn. An operation with no path of retreat has begun.§!\n\nThe intelligence trail leads us to an Imperial research installation on §HEadu§!. Galen Erso is here, confined with a group of engineers forced to work on the Death Star.\n\nBefore the ground team arrives, High Command has already authorized an air strike to destroy the facility. The team reaches Erso, but too late to recall the bombers.\n\nErso dies before his daughter. With his final words, he confirms only one thing: the complete plans proving the weakness still exist on Scarif."
 foc_rogue_one.13.desc:0 "§LThe Death Star was never meant to become public knowledge—until its existence could no longer be hidden.§!\n\nThe Rebel Council refuses to authorize an attack on Scarif. The intelligence is incomplete, the Imperial fleet holds overwhelming superiority, and staking the entire Alliance on an unverified engineering flaw looks more like a gamble than a strategy.\n\nAfter the meeting, §HJyn Erso§!, §HCassian Andor§!, Bodhi Rook, and a group of volunteers do not return to their quarters. They seize a transport and give flight control a hastily chosen callsign: §HRogue One§!.\n\nMinutes later, several Rebel captains who had been ordered to remain in port begin launching on their own authority."
 foc_rogue_one.14.desc:0 "Scarif's shield gate has been breached. The ground team finds the complete plans under the codename §HStardust§! and transmits them to the Rebel flagship.\n\n§HAdmiral Raddus§! holds the transmission window aboard Profundity until Imperial fire destroys his ship. Rogue One falls silent on the surface, but the plans have left the planet.\n\nThe intelligence is not yet analyzed. After at least a month, Death Star I can reach Scarif if it was already complete during the battle and still survives. The pursuit and rescue that follow will decide whether this sacrifice brings hope."
 foc_rogue_one.15.desc:0 "As the pursuers close in, the final defenders pass the data carrier onto a diplomatic corvette. §HLeia Organa§! receives the plans and orders a course for the Rebel base.\n\nThe pursuit continues, and the complete plans have not reached the analysts. Leia and her corvette soon fall into Vader's hands. Rescuing her becomes the key to the next Rebel operation."
 foc_rogue_one.2.desc:0 "§LThe secret routes linking Scarif, Jedha, and the Death Star are being redrawn. An operation with no path of retreat has begun.§!\n\nThe Imperial Security Bureau has intercepted a fragmentary report from Jedha. An Imperial cargo pilot named §HBodhi Rook§! has disappeared; his final assignment was connected to §HGalen Erso§!, chief energy engineer of the Death Star project.\n\nWorse, Krennic has confirmed that Erso inserted an unauthorized structure into the reactor design. Hidden among millions of pages of engineering schematics, it appears harmless—unless the complete archive falls into the hands of someone who knows what to look for. The battle station may not be as invulnerable as Imperial propaganda claims.\n\nOnly one complete backup of the design archive remains: §HScarif§!."
 foc_rogue_one.3.desc:0 "§LThe shadow of the Empire’s highest secret is closing in. Project Stardust is nearing the purpose for which it was truly built.§!\n\nKrennic returns to the Death Star to demand continued control of the project. Tarkin does not argue about engineering credit; he simply places an order signed by the Emperor’s office on the table.\n\nFrom this moment forward, the Death Star is formally incorporated into Imperial strategic command. Krennic remains responsible for technical matters, but the station itself now answers to §HWilhuff Tarkin§!.\n\nAs Krennic leaves the bridge, only one place still contains the original records that can prove the weapon was truly his work: the archive tower on Scarif."
 foc_rogue_one.4.desc:0 "The Scarif archive has been breached, and the complete Death Star plans have escaped through the shield gate. The garrison failed to cut the final transmission, although the ground team and Rebel flagship paid with their lives.\n\nImperial command prepares to order §HDarth Vader§! to pursue the courier. The lost intelligence must be recovered before the Rebels can analyze it."
 foc_rogue_one.5.desc:0 "Vader boards the ship and advances along its narrow corridors. The defenders pass the plans from hand to hand until they reach an escaping corvette.\n\nThe pursuit then catches §HLeia Organa§!. She and her ship fall under Imperial control, but the plans remain unaccounted for. Tarkin prepares to threaten Alderaan to force her to reveal the Rebel base."
 foc_saga_dqar.3.desc:0 "§LThe first light after the ceasefire falls across the shipyards, and for once the machinery of war is being asked to stand down.§!\n\nThe first document signed after the Concordance was not a declaration of victory. It was the demobilisation order.\n\nThose numbers were wartime numbers: to break two Death Stars and win a war in the Inner Rim that had no visible end, we ran the yards past their limits, drove war weariness to nothing, and pushed every unit of output into munitions. The fleet at its peak was three times the size of the old Republic's.\n\nThere is no war now, and this apparatus cannot be paid for — nor should it continue. The Senate passed the resolution quickly: reserves stood down, surplus fleets mothballed, capacity turned to reconstruction.\n\nSomeone asked in the chamber what happens if they come back. The answer was: then we fight again, but we cannot live by permanently preparing to.\n\n§YThe Death Star I, Death Star II and double-Death-Star wartime bonuses are retired with the Concordance and replaced by postwar demobilisation — smaller fleets and slower construction, higher output, stability, unity and diplomatic weight.§!"
 foc_sepplot.1.desc:0 "§LCoruscant still calls separatism a political crisis. On the edges of the galaxy, preparations for a real war are already underway.§!\n\nAfter Darth Maul is believed dead on Naboo, Palpatine turns to the former Jedi Master Count Dooku, who accepts the name Darth Tyranus."
 foc_sepplot.2.desc:0 "§LSomeone prepared the armies, money, and justification for this war long before the Republic realized a war was coming.§!\n\nConvinced that catastrophe is coming, Jedi Master Sifo-Dyas secretly commissions a clone army on Kamino without the Council's approval."
 foc_sepplot.3.desc:0 "§LBeneath the Republic’s surface calm, the Separatist Crisis is turning scattered clues into the outline of a single conspiracy.§!\n\nDooku eliminates Sifo-Dyas, erases the trail, and assumes control of the clone programme as Darth Tyranus."
 foc_sepplot.4.desc:0 "§LSomeone prepared the armies, money, and justification for this war long before the Republic realized a war was coming.§!\n\nDooku publicly denounces the Republic at Raxus and turns scattered discontent into an organised movement for secession."
 foc_sepplot.5.desc:0 "§LThe latest lead from Jedi Intelligence has brought no answers—only a more dangerous set of questions.§!\n\nThe Trade Federation and other corporate powers secretly pledge fleets, industry, and battle droids to Dooku on Geonosis."
 foc_sepplot.6.desc:0 "§LSomeone prepared the armies, money, and justification for this war long before the Republic realized a war was coming.§!\n\nObi-Wan Kenobi discovers the clone army while tracking the assassin Jango Fett, then follows him toward Geonosis."
 foc_sepplot.7.desc:0 "§LSomeone prepared the armies, money, and justification for this war long before the Republic realized a war was coming.§!\n\nObi-Wan discovers the corporate alliance and its droid armies, transmits the evidence to the Jedi Council, and is captured."
 foc_sepplot.8.desc:0 "§LThe latest lead from Jedi Intelligence has brought no answers—only a more dangerous set of questions.§!\n\nAnakin Skywalker and Padme Amidala attempt a rescue and are captured alongside Obi-Wan. All three are sentenced to die in the Geonosian arena."
 foc_sepplot.9.desc:0 "§LA file that should never have existed has been reopened, and every page points toward something darker.§!\n\nJar Jar Binks proposes emergency powers for Supreme Chancellor Palpatine. The Senate approves, and the newly discovered clone army is activated.\n\n§LThe story and other effects are retained; this event no longer adds extra conspiracy points.§!"
 foc_starkiller_coords.3.desc:0 "§LStellar energy surges through colossal conduits beneath the planet’s surface. The superweapon is entering combat readiness.§!\n\nThe first Starkiller strike has revealed its firing origin. The Imperial Remnant Gateway is now open to the entire galaxy and leads toward the hidden target system in the Unknown Regions."
 foc_story.10.desc:0 "§LThe bridge holomap refreshes, and the meaning of the war is no longer what it was only minutes ago.§!\n\nStarkiller Base has fired through hyperspace and struck the Hosnian system. Hosnian Prime, the Galactic Senate, the Republic naval anchorage and the entire capital region vanish in the stellar detonation. The New Republic has lost its central government and political symbol, leaving its surviving resistance forces scattered."
 foc_story.11.desc:0 "§LThis moment will soon be written into galactic history. Those living through it have time only to face what comes next.§!\n\nStarkiller Base has been completely destroyed. During the final operation inside the installation, Han Solo tried to bring his son Ben home, only to be killed by Kylo Ren. The strike team then detonated the critical systems, and the weaponized planet broke apart in fire."
 foc_story.12.desc:0 "§LReports arrive from every front at once: the old balance has been broken.§!\n\nThe First Order flagship Supremacy has broken apart in battle. Its immense hull is torn open by the hyperspace impact and cascading explosions, destroying the fleet command center and hyperspace-tracking complex. As the flagship becomes burning debris, the supreme authority of the First Order begins to collapse with it."
 foc_story.13.desc:0 "§LReports arrive from every front at once: the old balance has been broken.§!\n\nOur forces have seized the control center of Starkiller Base. The superweapon, its fixed defensive station and the stellar-energy extraction systems are now in our hands. We must decide whether to destroy this threat to the galaxy or turn it into an instrument of our own power."
 foc_story.20.desc:0 "§LThis war has just lost another thing that everyone once believed could never be destroyed.§!\n\nThe Final Order has fallen and Palpatine's last fleet has vanished in flame. War has shattered the old order of the galaxy, and the victor must now decide what follows: inherit the absolute power left by the Sith, or guide the galaxy back toward cooperation and the light."
 foc_story.21.desc:0 "§LThis war has just lost another thing that everyone once believed could never be destroyed.§!\n\nThe conqueror of the Final Order has proclaimed a new Galactic Empire and demands that every independent state recognize the Emperor's supreme authority. Submission means joining the new order. Refusal means total war."
 foc_story.23.desc:0 "§LThe bridge holomap refreshes, and the meaning of the war is no longer what it was only minutes ago.§!\n\nThe Final Order has fallen. The victor who destroyed Palpatine's last fleet is deciding the future political order of the galaxy."
 foc_story.31.desc:0 "§LReports arrive from every front at once: the old balance has been broken.§!\n\nCrait has fallen to the First Order or the Final Order. Luke Skywalker expended the last of his strength to cover the survivors’ escape before becoming one with the Force. Crait's defence has collapsed, but surviving Resistance forces may yet regroup at an unknown refuge. Our own empire must now choose whether to submit to the First Order or remain independent and continue the fight."
 foc_story.33.desc:0 "§LThe bridge holomap refreshes, and the meaning of the war is no longer what it was only minutes ago.§!\n\nCrait has fallen. Luke Skywalker expended the last of his strength to cover the survivors’ escape before becoming one with the Force. The salt-mine redoubt has collapsed, but some survivors escaped the blockade into deep space."
 foc_supremacy_duel.2.desc:0 "§LTwo colossal warships have finally entered the same battlefield, and every prepared tactical plan has become obsolete.§!\n\nThe Supremacy and the Raddus finally exchange fire in the same battlespace. In the middle of the engagement, the Raddus turns and jumps to hyperspace.\n\nA brilliant hyperspace trail tears through the Supremacy, destroying both capital ships almost simultaneously.\n\n§YThe Supremacy and the Raddus have both been destroyed.§!"
 foc_thrawn.2.desc:0 "§LA hyperspace breach opens again in the Unknown Regions, and one of the Empire’s most dangerous strategists returns to the board.§!\n\nDuring the post-treaty cold war, Ahsoka Tano and Sabine Wren finally reach the long-lost Ezra Bridger. Yet §HGrand Admiral Thrawn§!, exiled in a distant galaxy, also returns with the aid of the Nightsisters.\n\nThe New Republic dismisses the warning as a border incident. The Imperial remnant, however, once again has a commander capable of integrating its resources into a long-term strategy.\n\n§YThrawn assumes command of the Imperial remnant.§!"
 foc_wayfinder.3.desc:0 "§LAn ancient Sith artifact projects a route found on no public star chart. The Unknown Regions finally have a path inward.§!\n\nThe Sith wayfinder has been decoded. The special gate at Jakku now locks onto its counterpart in the isolated system of Exegol. The route is open to every nation in the galaxy."
 fop_ambition.2.desc:0 "§LConquering the galaxy is only the first ambition. The true objective now reaches toward reality and the Force itself.§!\n\n§YAct I—Galactic War§!\nAwaken Starkiller Base, receive the Imperial Remnant, and reveal the galaxy's true enemy.\n\n§YAct II—Chains of the Force§!\nThe first Force Thrall grants larger fleets, swifter fire, and an unbroken will to wage war.\n\n§YAct III—Galactic Dominion§!\nOnce three states submit, their fear further strengthens our armada.\n\n§YAct IV—Enslave the Force§!\nRule the galaxy and complete §YEnslave the Force§!. If Exegol was defied, the civil war must first be won.\n\n§YAct V—Shroud Apotheosis§!\nInvade the Sea of the Force, destroy its avatars, and complete the rite upon the Empty Throne."
 fop_origin.10.desc:0 "§LThe altars of the Sith Eternal burn again. A plan more dangerous than any superweapon is taking shape.§!\n\nThe darkness of the Unknown Regions has concealed our ascent. Ilum is now the frozen bastion of the First Order, Supremacy waits above the capital, and a secret passage into Imperial Remnant space has revealed itself.\n\nThe New Republic believes the war ended long ago. Soon it will learn that the Empire's shadow never vanished."
 fop_origin.100.desc:0 "§LFleets can conquer territory. Now someone is attempting to conquer the very power that gives life and will meaning.§!\n\nMaterial reality trembles and the Shroud falls eternally silent. The ruler's consciousness passes beyond flesh, death, and time, entering the Force, the stars, and the deepest laws of existence.\n\nThe First Order no longer rules the universe. The First Order is the universe."
 fop_origin.11.desc:0 "§LThe altars of the Sith Eternal burn again. A plan more dangerous than any superweapon is taking shape.§!\n\nBastion recognizes the First Order as the next bearer of the Imperial cause, opening old routes and supporting the young successor from the shadows."
 fop_origin.20.desc:0 "§LFleets can conquer territory. Now someone is attempting to conquer the very power that gives life and will meaning.§!\n\nThe heart of Starkiller Base has awakened. Across the same instant, signals of allegiance fill every military channel: the warships, domains, and forge worlds of the Imperial Remnant now belong to the First Order.\n\nFear has driven the powers of the galaxy beneath a single banner. Even empires that slept for untold ages have stirred their ancient war machines to prevent the New Order.\n\nYet farther into darkness, Exegol is calling. The Final Order will reveal itself in twenty years; the loss of Supremacy or Starkiller Base will only hasten the prophecy."
 fop_origin.50.desc:0 "§LFleets can conquer territory. Now someone is attempting to conquer the very power that gives life and will meaning.§!\n\nA dark signal from Exegol pierces the void. The voice of a dead Emperor again declares itself the galaxy's only sovereign, while the fleets of the Sith Eternal wait within the storm.\n\nPalpatine demands the First Order surrender its banner and throne to become the blade of the Final Order. We may answer the summons and command Exegol's legions, or defy the rule of the dead and let the galaxy burn in a war between two orders. Either path still leads toward the throne of the Force."
 fop_origin.55.desc:0 "§LThe Force resists its chains, but each act of resistance teaches the new order how to tighten them.§!\n\nThe storms of Exegol part before a new Emperor, and the Sith Eternal fleet swears allegiance amid endless thunder. The war machine of the First Order and the dark legions of Exegol have become one. The Final Order is crowned.\n\nConquering the galaxy is only the beginning. The Force itself shall wear our chains."
 fop_origin.58.desc:0 "§LConquering the galaxy is only the first ambition. The true objective now reaches toward reality and the Force itself.§!\n\nDefying the summons from Exegol has torn the First Order apart. Ambitious officers, frontier governors, and wavering subjects swear themselves to the Final Order. The guns of former comrades now turn toward the capital.\n\nIlum, Starkiller Base, and Supremacy remain in loyal hands. First we will break the false Emperor's legions. Then we will seize the power that stands above all living things."
 fop_origin.71.desc:0 "§LExegol’s storms never cease, and the echoes deep within the Force are becoming clearer.§!\n\nThe first empire has submitted completely. Billions feel terror in the same instant; their cries pass through the Force and dissolve into our will.\n\nThe first chain has been forged."
 fop_origin.73.desc:0 "§LConquering the galaxy is only the first ambition. The true objective now reaches toward reality and the Force itself.§!\n\nThree states have joined the New Order's collective will. The Force becomes clearer—and easier to control—with every submission."
 fop_origin.75.desc:0 "§LConquering the galaxy is only the first ambition. The true objective now reaches toward reality and the Force itself.§!\n\nNo throne beneath the stars remains capable of defying ours. The fear and obedience of countless lives converge within the Force, enough to forge chains around the Force itself.\n\nThe §YEnslave the Force§! project has begun."
 fop_origin.80.desc:0 "§LFleets can conquer territory. Now someone is attempting to conquer the very power that gives life and will meaning.§!\n\nThe Force once surrounded every living thing. Now it answers a single will. The psionic tides of the galaxy have reversed, and every fear and death among the stars feeds our power.\n\nThe Shroud offers one final act of resistance, tearing open a breach into the Sea of the Force."
 fop_origin.82.desc:0 "§LThe Force resists its chains, but each act of resistance teaches the new order how to tighten them.§!\n\nBeyond the breach lies no dream, but a psionic realm never conquered by mortal fleets. The Will of the Shroud awakens corrupted avatars and arrays them around the Empty Throne.\n\nThe last war will be fought beyond reality."
 fop_origin.91.desc:0 "§LThe Force resists its chains, but each act of resistance teaches the new order how to tighten them.§!\n\nThe last Shroud avatar dissolves into silence. The Sea of the Force grows still, and the Empty Throne stands exposed before our fleets.\n\nNo guardian remains to prevent the final rite."
 myk_starkiller.10.desc:0 "§LDeep beneath Ilum’s crust, the focusing wells begin to tremble. An entire planet is waking for a single shot.§!\n\nAs the final armour belt closes, the focusing core deep within the planet begins to thunder. Energy conduits spanning the crust ignite in sequence. This world is no longer a world, but a weapon capable of reshaping the fate of the galaxy. Starkiller Base is now combat-ready and awaits its first target."
 myk_starkiller.300.desc:0 "§LNo fleet can reproduce this kind of firepower. Once the target is confirmed, the whole sky will bear witness to the result.§!\n\nThe Starkiller target beacon has been established. Using “Destroy Habitable Worlds in Target System” will destroy every habitable or colonizable planet in the beacon’s system; using “Destroy Target System” will annihilate the entire system."
 myk_starkiller.310.desc:0 "§LStellar energy surges through colossal conduits beneath the planet’s surface. The superweapon is entering combat readiness.§!\n\nStarkiller Base has locked onto the target beacon. Confirm to begin the main weapon's direct charging sequence and fire."
 myk_starkiller.315.desc:0 "§LStellar energy surges through colossal conduits beneath the planet’s surface. The superweapon is entering combat readiness.§!\n\nStarkiller Base has completed its strike. The target beacon has been removed."
 myk_starkiller_dyson.8090.desc:0 "§LRed warnings ignite across Starkiller Base’s fire-control chamber. On the holomap, only the target remains to be confirmed.§!\n\nThe §H[event_target:myk_starkiller_target_system.GetName] System§! is locked. Choose a strike mode. “Destroy All Habitable Worlds” will search the system for every world capable of sustaining life or colonization; ordinary planets will break apart in the beam, while ringworld sections become shattered ruins. The 180-day charging sequence begins only after a mode or specific body is confirmed, followed by another 180 days to gather stellar energy again."
 myk_starkiller_dyson.8102.desc:0 "§LRed warnings ignite across Starkiller Base’s fire-control chamber. On the holomap, only the target remains to be confirmed.§!\n\nSelect the individual celestial body to destroy in the §H[event_target:myk_starkiller_target_system.GetName] System§!. Non-star bodies are shown in paginated lists. The 180-day firing sequence starts only after a target is confirmed."
 sai_supremacy_arkship.19.desc:0 "§LThe mobile capital’s strategic halls reopen. The Supremacy is not merely a ship, but an entire war system waiting to be deployed.§!\n\nThe Supremacy is more than a flagship: it is a mobile capital, shipyard, and engine of war. High Command awaits its next deployment order."
