l_english:
 foc_v1717_first_order_empire_arsenal_allowed:0 "First Order origin: complete Starkiller Base to open Imperial weapon research"
 foc_v1717_starkiller_completed_for_arsenal:0 "A Starkiller Base has actually been completed"
 foc_v185_flow.2.desc:0 "§LThe last focusing arrays beneath Ilum have locked into place. There is no ceremony—only a growing stream of allegiance signals across the fleet net.§!\n\n§HStarkiller Base§! is fully operational. With the weapon complete, any surviving §HImperial Remnant§! assets are absorbed into the First Order immediately.\n\nThe galactic war has not yet begun. §YThe first real firing of Starkiller Base will end the secret phase at once: the player First Order will become a crisis and enter total war with the galaxy.§!\n\n§YImperial weapon research:§! The First Order origin must complete a Starkiller Base before Imperial-branch weapon technologies become available. Completion opens research without granting advanced weapons. Support ships retain their fitted equipment; shared basic weapons keep their existing access rules."
 fop_starkiller_base_final_DESC:0 "A stellar-energy weapon formed from an entire planet. It drains a star and focuses the captured power through a kyber-based firing system.\n\n§YImperial weapon research:§! The First Order origin must complete a Starkiller Base before Imperial-branch weapon technologies become available. Completion opens research without granting advanced weapons. Support ships retain their fitted equipment; shared basic weapons keep their existing access rules."
 origin_fop_first_order_effects:0 "The First Order rises from isolated Ilum beyond the galactic rim, begins with stable-wormhole technology, and gains access to the secret route into Imperial Remnant space. No second First Order will emerge from the shadows. Completing Starkiller Base automatically grants the exclusive §YGalactic New Order§! ascension perk.\nStarts with basic turbolasers, mass drivers, concussion missiles and point defense. Advanced weapon technologies are not granted merely for choosing this origin.\n\n§YImperial weapon research:§! The First Order origin must complete a Starkiller Base before Imperial-branch weapon technologies become available. Completion opens research without granting advanced weapons. Support ships retain their fitted equipment; shared basic weapons keep their existing access rules."
