l_english:
 starbase_level_foc_starkiller_ring:0 "Starkiller Defense Ring"
 starbase_level_foc_starkiller_ring_desc:0 "The orbital defense ring of Starkiller Base, housing the installation's TIE hangar complexes."
 foc_starkiller_hangar_bay:0 "Starkiller Hangar Complex"
 foc_starkiller_hangar_bay_desc:0 "A vast subsurface TIE hangar complex, each fielding 8 TIE wings. Starkiller Base hosted the largest known deployment of First Order military forces."
 FOC_STARKILLER_TIE:0 "TIE/fo Wing (Starkiller Aerial Defense Force)"
 FOC_STARKILLER_TIE_desc:0 "First Order TIE/fo space superiority fighters of the unit tasked with the protection of Starkiller Base."
 FOC_STARKILLER_TIE_SET:0 "TIE/fo Wing (Starkiller Aerial Defense Force)"
 foc_starkiller_base_world:0 "Starkiller Garrison"
 foc_starkiller_base_world_desc:0 "The entire world has been turned into a fortification. A vast standing garrison is dug in beneath the crust and the planet is heavily hardened against orbital fire, while the thermal oscillator and phantom-energy facilities make it the First Order's foremost engineering site."
 foc_starkiller_ring:0 "Starkiller Defense Ring"
 foc_starkiller_defense_grid:0 "Planetary Defense Grid"
 foc_starkiller_defense_grid_desc:0 "Heavy shielding and gun emplacements across the installation, hardening the ring's hull, armour and shields and expanding its defense platform capacity."
 foc_starkiller_shipyard:0 "Starkiller Shipyard"
 foc_starkiller_shipyard_desc:0 "Heavy assembly slips in orbit of the installation, letting fleets be built and repaired at Starkiller Base itself."
 foc_starkiller_ring_plural:0 "Starkiller Defense Rings"
