l_english:
 foc_republic_origin.24.desc:0 "§LThe Senate still tries to preserve order through procedure, even as war pushes every old rule toward its breaking point.§!\n\nThe new slipways at §HKuat Drive Yards§! have lit their furnaces. The Republic Navy gains the §HVenator-class Star Destroyer§! - a capital ship that is both fleet flagship and carrier - and from today its keel can be laid in any Republic military yard.\n\nThe expansion grant was signed in the Chancellor's office. Kuat's board knows perfectly well whose order this is.\n\n§YFixed milestone: conspiracy +10, recorded once.§!\n\n§HAdvanced Durasteel Armor§! is now unlocked. Kuat receives its orbital ring reward; if no ring, construction or ruins already occupy the site, a §Htier III orbital ring§! with §Hfour shipyards§! is completed immediately.\n\n§HRepublic strategic aviation§! is now unlocked: Delta-7, strategic ARC-170 and the Republic remote aviation command core. The fixed Venator design now carries three strategic ARC-170 squadrons and a strategic air command crew."
 foc_v185_flow.2.desc:0 "§LThe last focusing arrays beneath Ilum have locked into place. There is no ceremony—only a growing stream of allegiance signals across the fleet net.§!\n\n§HStarkiller Base§! is fully operational. With the weapon complete, any surviving §HImperial Remnant§! assets are absorbed into the First Order immediately.\n\nThe galactic war has not yet begun. §YThe first real firing of Starkiller Base will end the secret phase at once: the player First Order will become a crisis and enter total war with the galaxy.§!\n\n§YImperial weapon research:§! The First Order origin must complete a Starkiller Base before Imperial-branch weapon technologies become available. Completion opens research without granting advanced weapons. Support ships retain their fitted equipment; shared basic weapons keep their existing access rules.\n\n§HImperial strategic aviation§! is now unlocked for the First Order origin, including its strategic aircraft and remote aviation command core. This completion reward grants no other advanced weapon technologies."
 tech_ssp_imperial_hyperspace_desc:0 "Unlocks TIE/LN, TIE/vn Silencer and the Imperial remote aviation command core.\n\nThe First Order origin receives this technology after a Starkiller Base is fully built; sites and construction do not count. Other advanced weapons still require research."
 tech_ssp_republic_hyperspace_desc:0 "Unlocks Delta-7, ARC-170 and the Republic remote aviation command core.\n\nThe Republic origin receives this technology when the Kuat expansion is actually completed. Imperial and Rebel successor stages hide Republic strategic aircraft while retaining the research record."
