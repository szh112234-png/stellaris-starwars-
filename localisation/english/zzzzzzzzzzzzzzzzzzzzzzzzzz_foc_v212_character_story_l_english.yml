l_english:
 FOC_V212_RADDUS_NAME:0 "Admiral Raddus"
 FOC_SAGA_MON_MOTHMA_NAME:0 "Mon Mothma"

 foc_v212_story.3.name:0 "Tatooine: A New Hope"
 foc_v212_story.3.desc:0 "The nineteenth year of the Galactic Civil War has arrived; if the Empire completed §HDeath Star I§! early, this moment comes sooner.\n\n§HLuke Skywalker§! leaves Tatooine and begins learning about the Jedi and the Force through Obi-Wan's teaching. He joins the §HImperial Rebellion§! led by Mon Mothma and begins his own part in the war.\n\nObi-Wan's final confrontation with Vader belongs to the mission to rescue Leia. Afterwards, he will continue to guide Luke as a Jedi spirit."
 foc_v212_story.3.a:0 "The light of the Jedi burns again."

 foc_v212_story.4.name:0 "Ten Years of Resistance"
 foc_v212_story.4.desc:0 "Ten years have passed since the Galactic Civil War began. Leia Organa formally joins the Rebel Alliance as a legendary political leader. Mon Mothma remains its head of government.\n\n§YRecruitment does not grant Death Star targeting or shield-damage intelligence. Those rewards still require the later Leia rescue event.§!"
 foc_v212_story.4.a:0 "For the freedom of the galaxy."
 foc_v212_story.23.name:0 "The Bridge of Raddus"
 foc_v212_story.23.desc:0 "The first time §HRaddus§! enters the same battlespace as a First Order fleet, Kylo Ren personally leads fighters through its defensive fire. He does not destroy the flagship; he concentrates the attack on its bridge.\n\nThe command centre is torn open and its crew cast into space. §HAdmiral Ackbar is killed.§! Raddus survives, but the Resistance has lost one of the most senior officers to have fought across the modern galactic wars.\n\nThis bridge strike occurs only once. The existing later encounter between Raddus and Supremacy remains available."
 foc_v212_story.23.a:0 "May the Force be with him."

 foc_canon.23.name:0 "Leia Rescued, Obi-Wan Sacrifices Himself"
 foc_canon.23.desc:0 "The hope carried from Scarif has reached the rescue team. Luke and his companions enter Imperial custody facilities and free §HLeia Organa§!. During their escape, §HObi-Wan Kenobi§! faces Darth Vader alone to buy them time.\n\nObi-Wan gives his life. He leaves active command, but continues to guide Luke through the Force as a Jedi spirit.\n\nConfirming the operation delivers the complete plans to Rebel command: Rebel weapons gain §H+50% shield damage§!, with a Death Star I attack solution active in its system. Leia formally joins the command structure through her own wartime story; Mon Mothma remains the Rebellion leader."
 foc_canon.34.desc:0 "The plans from Scarif are still passing between couriers, and Leia is now in Imperial custody. Tarkin targets §HAlderaan§! with Death Star I, intending to trade her homeworld for the location of the Rebel base.\n\nAs long as the battlestation can still fire, the next order will destroy an entire world. The Rebels must rescue Leia and deliver the full intelligence before completing their attack solution."
 foc_rogue_one.14.desc:0 "Scarif's shield gate has been breached. The ground team finds the complete plans under the codename §HStardust§! and transmits them to the Rebel flagship.\n\n§HAdmiral Raddus§! holds the transmission window aboard Profundity until Imperial fire destroys his ship. Rogue One falls silent on the surface, but the plans have left the planet.\n\nThe intelligence is not yet analyzed. After at least a month, Death Star I can reach Scarif if it was already complete during the battle and still survives. The pursuit and rescue that follow will decide whether this sacrifice brings hope."
 foc_canon.44.desc:0 "The Empire has lost control of §HScarif§!. Rebel infiltrators transmit the Death Star plans while the orbital blockade breaks apart.\n\nAdmiral Raddus leads the fleet directly against the Imperial screen to hold the transmission window and dies with his bridge crew. §HAdmiral Raddus is killed in the Battle of Scarif.§!\n\nThe victory is costly, but the plans are out."

 foc_canon.45.desc:0 "§HDeath Star I has been destroyed.§! The battlestation's destruction is recorded as victory in the Battle of Yavin.\n\n§HGrand Moff Wilhuff Tarkin§! refuses evacuation and dies with the station. The Empire has lost its instrument of galactic terror, and the Rebellion has paid heavily for this victory."
 foc_luke.10.desc:0 "Only a handful of Rebel fighters remain on the tactical display when Death Star I explodes. The final trench run is flown by §HLuke Skywalker§!, who had already joined the Imperial Rebellion after training under Obi-Wan.\n\nLuke switches off his targeting computer and uses the Force to place proton torpedoes into a two-metre exhaust port. Han Solo's Millennium Falcon breaks Vader's attack; seconds later the main reactor detonates.\n\nObi-Wan does not return from the station, yet his voice still reaches Luke through the Force. Tarkin dies with the Death Star.\n\nThe victory proves that the Empire can be beaten."
