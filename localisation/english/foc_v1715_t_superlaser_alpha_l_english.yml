 DEATH_STAR_GUN_desc:0 "Death Star I exclusive T-slot superlaser. Fixed base damage per hit: 750,000. Hull damage x60 (+5900%), shield damage x40, armor damage x20. 100% shield and armor penetration; hardening still counters penetration. Nominal reload on the default design: about 180 days, excluding windup; fire-rate modifiers can change the interval. Single-hit damage order: Death Star I = Death Star II > Eclipse > Xyston. Not a DPS order."
 FOC_DEATH_STAR_II_GUN_desc:0 "Death Star II exclusive T-slot superlaser. Fixed base damage per hit: 750,000. Hull damage x60 (+5900%), shield damage x40, armor damage x20. 100% shield and armor penetration; hardening still counters penetration. Nominal reload on the default design: about 120 days, excluding windup; fire-rate modifiers can change the interval. Single-hit damage order: Death Star I = Death Star II > Eclipse > Xyston. Not a DPS order."
 FOC_KHAN_ECLIPSE_II_SUPERLASER_desc:0 "Eclipse exclusive T-slot superlaser. Fixed base damage per hit: 500,000. Hull damage x60 (+5900%), shield damage x40, armor damage x20. 100% shield and armor penetration; hardening still counters penetration. Nominal reload on the default design: about 60 days, excluding windup; fire-rate modifiers can change the interval. Single-hit damage order: Death Star I = Death Star II > Eclipse > Xyston. Not a DPS order."
