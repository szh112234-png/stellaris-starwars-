 SSP_TIE_BOMBER_REMOTE_SET:0 "TIE/sa Bomber Remote Anti-Ship Wing"
 SSP_TIE_BOMBER_REMOTE_SET_DESC:0 "Each strategic hangar maintains 12 bombers. Their ordnance has 100% shield and armor penetration, uses bomber targeting against capital ships, and delivers higher anti-ship output than fighters of the same tier. Strategic strike craft replenish much more slowly; combat further reduces replenishment under the normal combat modifier."
