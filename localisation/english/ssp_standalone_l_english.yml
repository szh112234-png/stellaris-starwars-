 SSP_SETTINGS_OPEN_FIGHTER_GROUP:0 "Select Fighter Faction"
 SSP_FIGHTER_GROUP_TITLE:0 "Strategic Fighter Faction"
 SSP_FIGHTER_GROUP_DESC:0 "Choose which strategic hangars and command cores are visible in the ship designer. All fighters are visible by default."
 SSP_FIGHTER_GROUP_EMPIRE:0 "Imperial: TIE/LN + TIE/vn"
 SSP_FIGHTER_GROUP_EMPIRE_DESC:0 "Show only TIE/LN, TIE/vn Silencer and the Imperial/First Order command core."
 SSP_FIGHTER_GROUP_REBEL:0 "Rebel route: X-wing + Y-wing + B-wing"
 SSP_FIGHTER_GROUP_REBEL_DESC:0 "Opens the Rebel starfighter hyperspace technology. Research unlocks X-wing, Y-wing and B-wing hangars using the shared Rebel air command core. Other routes are closed to new research; previously researched aircraft remain available."
 SSP_FIGHTER_GROUP_REPUBLIC:0 "Old Republic: Delta-7 + ARC-170"
 SSP_FIGHTER_GROUP_REPUBLIC_DESC:0 "Show only Delta-7, ARC-170 and the Old Republic command core."
 SSP_FIGHTER_GROUP_ALL:0 "Show All Fighters; includes Separatist TRI; includes Separatist TRI"
 SSP_FIGHTER_GROUP_ALL_DESC:0 "Opens all three faction hyperspace technologies. The Rebel route includes X-wing, Y-wing and B-wing hangars using one shared Rebel command core.; includes Separatist TRI; includes Separatist TRI"
 SSP_EQUAL_DPS_NOTE:0 "All five hangars are normalized to similar baseline sustained damage. Quantity, penetration, target modifiers, speed, evasion and durability remain distinct."

 SSP_STRENGTH_ENHANCED_DESC:0 "About 500 base sustained damage per hangar, with improved durability, speed and penetration."
 SSP_STRENGTH_EXTREME_DESC:0 "Cinematic tier: about 1,000 base sustained damage per hangar, below SG tier."
 SSP_STRENGTH_SG_DESC:0 "Highest tier: about 2,000 base sustained damage per hangar for SG-level fleets and crises."

 tech_ssp_imperial_hyperspace:0 "Imperial Starfighter Hyperspace Doctrine"
 tech_ssp_imperial_hyperspace_desc:0 "Unlocks TIE/LN, TIE/vn Silencer and the Imperial remote aviation command core."
 SSP_TECH_IMPERIAL_UNLOCK_TITLE:0 "Unlocks: Imperial / First Order Starfighters"
 SSP_TECH_IMPERIAL_UNLOCK_DESC:0 "TIE/LN and TIE/vn Silencer squadrons, plus the Imperial remote aviation command core."
 tech_ssp_rebel_hyperspace:0 "Rebel Starfighter Hyperspace Doctrine"
 tech_ssp_rebel_hyperspace_desc:0 "Unlocks X-wing, Y-wing and B-wing strategic hangars and the shared Rebel remote air command core. Each B-wing squadron contains eight heavy anti-ship aircraft with red laser bolts."
 SSP_TECH_REBEL_UNLOCK_TITLE:0 "Unlocks: Rebel Starfighters"
 SSP_TECH_REBEL_UNLOCK_DESC:0 "X-wing, Y-wing and B-wing squadrons plus the shared Rebel remote air command core. All three use the same Rebel Strategic Strike action."
 tech_ssp_republic_hyperspace:0 "Old Republic Starfighter Hyperspace Doctrine"
 tech_ssp_republic_hyperspace_desc:0 "Unlocks Delta-7, ARC-170 and the Republic remote aviation command core."
 SSP_TECH_REPUBLIC_UNLOCK_TITLE:0 "Unlocks: Old Republic Starfighters"
 SSP_TECH_REPUBLIC_UNLOCK_DESC:0 "Delta-7 and ARC-170 squadrons, plus the Republic remote aviation command core."
 SSP_SETTINGS_ROOT_DESC:0 "Choose strength, visual scale, or the currently available faction research route. Previously researched faction aircraft remain available after switching routes."
 SSP_FIGHTER_GROUP_DESC:0 "Only the selected faction route can be researched. Previously completed faction technologies and aircraft remain available. Select All to open all three routes."
 SSP_FIGHTER_GROUP_EMPIRE:0 "Imperial route: TIE/LN + TIE/vn"
 SSP_FIGHTER_GROUP_EMPIRE_DESC:0 "Only the Imperial starfighter hyperspace doctrine is available for new research. Previously researched aircraft remain."
 SSP_FIGHTER_GROUP_REPUBLIC:0 "Old Republic route: Delta-7 + ARC-170"
 SSP_FIGHTER_GROUP_REPUBLIC_DESC:0 "Only the Old Republic starfighter hyperspace doctrine is available for new research. Previously researched aircraft remain."
 SSP_FIGHTER_GROUP_ALL:0 "Show All Fighters; includes Separatist TRI; includes Separatist TRI"
 SSP_REBEL_COMMAND_CORE_SET_DESC:0 "Shared remote air command for Rebel X-wing, Y-wing and B-wing squadrons. Provides the same Rebel Strategic Strike action from an auxiliary slot."
 SSP_FIGHTER_ROSTER_SUMMARY:0 "Four doctrines: Empire, Rebels, Old Republic and Separatists. TIE: 12 point-defense fighters; TRI: 24 point-defense fighters; B-wing: 12 bombers. Existing X-wings and Y-wings remain available."
