 SSP_IMPERIAL_COMMAND_CORE_DESC:0 "Installed in an auxiliary slot, this core unlocks the Imperial and First Order Strategic Strike action. Select a target system within two hyperlane jumps; the number of deployed craft is determined by the fleet’s matching numbered strategic hangars. Each hangar contributes two remote craft, which withdraw after 180 days."
