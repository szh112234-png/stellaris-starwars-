 SSP_FO_INTERCEPTOR_REMOTE:0 "First Order TIE Interceptor Remote Strike Wing"
 SSP_FO_INTERCEPTOR_REMOTE_DESC:0 "A temporary remote carrier wing generated by a strategic strike. Strategic strike craft replenish much more slowly; combat further reduces replenishment under the normal combat modifier."
 SSP_FO_INTERCEPTOR_HANGAR_01:0 "Black Squadron (Strategic Strike Squadron 01)"
 SSP_FO_INTERCEPTOR_HANGAR_01_DESC:0 "Black Squadron operates as an eight-craft TIE/VN Silencers strategic strike squadron. It maintains eight craft in normal combat and deploys eight remote craft during a strategic strike. §LElite First Order fighters with advanced fire-control, maneuvering systems, and shields.§!"
