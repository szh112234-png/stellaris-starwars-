 SSP_IMPERIAL_TIE_REMOTE:0 "Imperial TIE Point-Defense Squadron (12 craft | BALANCED | 1x)"
 SSP_IMPERIAL_TIE_REMOTE_DESC:0 "12 craft per squadron. Base aggregate damage per firing cycle: 2000 (about 166.6667 per craft), NOT per-craft damage or DPS.\nTotal hull 2400, armor 480, shields 0, divided among the craft. Point defense against strike craft and missiles; green bolts.\nVisual size does not multiply count or combat stats. Country, ship, technology and fire-rate bonuses apply separately. Use distinct hangar numbers on the same carrier for strategic dispatch."
