l_english:
 FOC_REPUBLIC_ORIGIN_DEATH_STAR_I_FLEET:0 "Death Star I Battlegroup"
 FOC_REPUBLIC_ORIGIN_DEATH_STAR_II_FLEET:0 "Death Star II Battlegroup"
 FOC_REPUBLIC_ORIGIN_DEATH_STAR_I_NAME:0 "Death Star I"
 FOC_REPUBLIC_ORIGIN_DEATH_STAR_II_NAME:0 "Death Star II"
 FOC_REPUBLIC_ORIGIN_FIRST_ORDER:0 "First Order"
 FOC_REPUBLIC_ORIGIN_DEATH_STAR_II_PROJECT:0 "Death Star II Construction"
 FOC_REPUBLIC_ORIGIN_DEATH_STAR_II_PROJECT_DESC:0 "Construct Death Star II at Endor. The player receives this project immediately after Death Star I is destroyed. Completion reveals the Bothan intelligence operation and spawns the unfinished station. Initial speed is zero; hull, armor, shields and weapon output are 1.3 times Death Star I. Mobile completion is a separate optional project."
 foc_republic_origin.160.name:0 "Galactic Treaty: The New Republic"
 foc_republic_origin.160.desc:0 "Both Death Stars have been destroyed, and the Rebels hold Jakku and the entire Inner Rim. The player-controlled Rebels become an ordinary New Republic and receive the sealed Nebula- and Viscount-class blueprints plus their fixed designs. The thirteen Outer-Rim systems form an ordinary AI Imperial Remnant, and the First Order story chain resumes."
 foc_republic_origin.160.a:0 "Let the New Republic rise from victory."
 foc_republic_origin.161.name:0 "Galactic Treaty: The Imperial Remnant"
 foc_republic_origin.161.desc:0 "Both Death Stars have been destroyed, and the Rebels hold Jakku and the entire Inner Rim. The Rebels form an ordinary New Republic with the sealed Nebula- and Viscount-class designs, while the player-controlled Empire retreats to the thirteen-system Outer Rim as an ordinary Imperial Remnant. The First Order Plan will now begin."
 foc_republic_origin.161.a:0 "The Empire is not yet finished."
 foc_republic_origin.162.name:0 "The First Order Plan"
 foc_republic_origin.162.desc:0 "The Imperial Remnant claims Ilum and establishes an exclusive Imperial Remnant Gateway between Ilum and Jakku. Starkiller Base, Resurgent, Supremacy and the sealed Imperial legacy technologies are now unlocked. Xyston construction remains sealed until the Final Order stage. The Remnant does not become a crisis until Starkiller Base is actually completed."
 foc_republic_origin.162.a:0 "Rebuild order in the Unknown Regions."
 foc_republic_origin.169.name:0 "The Imperial Secret Research Base on Scarif"
 foc_republic_origin.169.desc:0 "The Empire has completed §HDeath Star I§!, but Rebel Intelligence has intercepted an encrypted transmission from §HScarif§!. Its secret research base and archive contain the battlestation's complete structural and reactor plans.\n\n§YTake Scarif before attacking the Death Star.§! The plans unlock a Curator-style target-country damage bonus whenever a Rebel fleet enters a live Death Star's system: §H+2500% damage§! against the owning Empire. The Death Star's hull, armour, shields, weapons and reinforcement package remain untouched."
 foc_republic_origin.169.a:0 "Attack Scarif and seize the plans."
 foc_republic_origin.170.name:0 "Death Star I Complete"
 foc_republic_origin.170.desc:0 "Death Star I is operational above Coruscant. First Order technology remains sealed, and the Phase-II plan cannot begin unless this first battlestation is destroyed."
 foc_republic_origin.170.a:0 "Witness the firepower of this fully armed battlestation."
 foc_republic_origin.171.name:0 "Death Star I Destroyed"
 foc_republic_origin.171.desc:0 "Death Star I has been destroyed. The Rebels receive their existing victory reward, and the old Death Star attack bonus ends immediately.\n\nA player Empire receives the Death Star II engineering project immediately; completion triggers Bothan intelligence and deploys the station at Endor. An AI Empire reveals and deploys its unfinished station exactly four years after this loss. Existing Imperial support-fleet rules remain in effect."
 foc_republic_origin.171.a:0 "A great victory, but the war is not over."
 foc_republic_origin.173.name:0 "Death Star II Is Operational"
 foc_republic_origin.173.desc:0 "Bothan intelligence has located the unfinished Death Star II at Endor. Hull, armor, shields and weapon output are 1.3 times Death Star I; initial speed is zero. The AI never performs the mobile refit, and the expired Scarif attack solution does not return."
 foc_republic_origin.173.a:0 "Then we will destroy it again."
 foc_republic_origin.174.name:0 "Death Star II Complete"
 foc_republic_origin.174.desc:0 "Death Star II is operational above Endor, with unfinished outer plating and propulsion. Initial speed is zero; hull, armor, shields and weapon output are 1.3 times Death Star I. A player Empire can research the optional completion and mobile refit to restore propulsion and adopt the original Death Star I model at 1.3 times its size."
 foc_republic_origin.174.a:0 "This time there will be no weakness."
 foc_republic_origin.175.name:0 "Death Star II Destroyed"
 foc_republic_origin.175.desc:0 "§HThe second battlestation is gone.§! Rebel troops destroyed the shield generator on Endor, allowing starfighters to reach the main reactor through the unfinished superstructure. Imperial authority collapses in the aftermath.\n\n§YThe Empire's 360-day reinforcement stream now ends; fleets already delivered remain. The Rebels still receive the existing one-time reward for this battlestation's destruction, but newly acquired systems no longer grant fleets, resources, or additional upkeep-reduction stacks. Unclaimed system-acquisition rewards are cancelled.§!"
 foc_republic_origin.175.a:0 "The Empire's terror weapons are gone."
 foc_republic_origin.176.name:0 "Both Death Stars Lost: Inner-Rim Uprising"
 foc_republic_origin.176.desc:0 "With both Death Stars destroyed, the Rebels receive a major permanent reinforcement and all Inner-Rim systems join their cause. The Galactic Treaty still requires Rebel control of Jakku."
 foc_republic_origin.176.a:0 "Advance on Jakku."
 foc_republic_origin.177.name:0 "Scarif: Death Star Attack Solution"
 foc_republic_origin.177.desc:0 "The Scarif operation secures the Death Star archive, but the complete plans have not yet safely reached Alliance command.\n\nThis event records the theft only. The Alderaan and Leia aftermath waits thirty days after Scarif. Death Star targeting and shield-damage intelligence unlock only when the Leia rescue event fires."
 foc_republic_origin.177.a:0 "Distribute the plans to every Rebel fleet."
 foc_republic_origin.178.name:0 "Direct Imperial Victory: Starkiller Plan"
 foc_republic_origin.178.desc:0 "Death Star I is complete and every Imperial Rebel colony has been eliminated. The Empire now receives Starkiller Base technology and construction permission alone. Resurgent, Supremacy and the remaining First Order technologies stay sealed until Starkiller Base is completed and the Empire becomes the First Order. Xyston construction remains sealed beyond that point until the Final Order stage."
 foc_republic_origin.178.a:0 "Begin the Starkiller Base project."
 foc_republic_origin.190.name:0 "Starkiller Base: The First Order Rises"
 foc_republic_origin.190.desc:0 "Starkiller Base is complete. The surviving Imperial state becomes the First Order; a direct-victory Empire receives the previously sealed Order ship technologies at this moment. It now enters the same Galactic New Order, Final Order, Force Avatar and cosmic-ascension crisis path as the First Order origin."
 foc_republic_origin.190.a:0 "The First Order will rule the galaxy."

 foc_republic_origin_death_star_two_reinforced:0 "Reinforced Death Star II"
 foc_republic_origin_death_star_two_reinforced_desc:0 "Phase-II engineering substantially improves every major combat system."
 foc_republic_origin_death_star_weakness:0 "Scarif Structural Plans"
 foc_republic_origin_death_star_weakness_desc:0 "Legacy-save marker only. The plans no longer weaken the Death Star; the Rebel attack solution supplies the combat effect."
 foc_republic_origin_scarif_death_star_attack_solution:0 "Scarif Death Star Attack Solution"
 foc_republic_origin_scarif_death_star_attack_solution_desc:0 "While a Rebel fleet is in a live Death Star's system, the Rebels deal +2500% damage against the owning Empire. The effect ends when every Rebel fleet leaves; Death Star statistics remain unchanged."
 foc_republic_origin_rebel_death_star_one_victory:0 "First Death Star Victory"
 foc_republic_origin_rebel_death_star_one_victory_desc:0 "Morale, volunteers and industrial support surge after the first victory."
 foc_republic_origin_rebel_death_star_two_victory:0 "Second Death Star Victory"
 foc_republic_origin_rebel_death_star_two_victory_desc:0 "More systems openly join the uprising after the second victory."
 foc_republic_origin_rebel_double_death_star_victory:0 "Galactic Uprising"
 foc_republic_origin_rebel_double_death_star_victory_desc:0 "The Inner Rim rises after both Death Stars are destroyed."
 foc_republic_origin_scarif_intelligence:0 "Scarif Death Star Intelligence"
 foc_republic_origin_scarif_intelligence_desc:0 "Unlocked only after Leia is rescued and the complete plans are delivered. Grants +50% weapon damage to shields. The separate Death Star I attack solution still requires a living station and Rebel presence in its system."