l_english:
 foc_khan_settings.10.ai_support_debug:0 "Debug: AI Fleet Support Scale"
 foc_v211_support_debug.1.name:0 "AI Fleet Support Debugger"
 foc_v211_support_debug.1.desc:0 "Adjust the size of §Yfuture scripted fleet support§! received by each Star Wars story faction. These settings affect AI countries only. They do not change player support, normal shipyard construction, opening fleets, or one-off story invasion fleets, and they never delete or resize fleets that already exist. With no override selected, support remains at the mod's original §G100%§! scale. Disabling a faction still consumes its normal support intervals, so re-enabling it does not instantly reimburse skipped waves."
 foc_v211_support_debug.1.republic:0 "Adjust Galactic Republic AI Support"
 foc_v211_support_debug.1.cis:0 "Adjust Separatist AI Support"
 foc_v211_support_debug.1.empire:0 "Adjust Imperial AI Support"
 foc_v211_support_debug.1.rebel:0 "Adjust Rebel AI Support"
 foc_v211_support_debug.1.first_order:0 "Adjust First Order AI Support"
 foc_v211_support_debug.1.final_order:0 "Adjust Final Order AI Support"
 foc_v211_support_debug.1.reset:0 "Restore All to 100%"
 foc_v211_support_debug.1.reset_tt:0 "Clear all six debug multipliers. Future AI fleet support returns to the mod's default scale."
 foc_v211_support_debug.back:0 "Back to AI Support Debugger"
 foc_v211_support_debug.back_settings:0 "Back to Mod Settings"
 foc_v211_support_debug.scale.disabled:0 "Disable AI Support"
 foc_v211_support_debug.scale.half:0 "Set to 50%"
 foc_v211_support_debug.scale.standard:0 "Set to 100% (Default)"
 foc_v211_support_debug.scale.one_and_half:0 "Set to 150%"
 foc_v211_support_debug.scale.double:0 "Set to 200%"
 foc_v211_support_debug.current.disabled:0 "\n\nCurrent scale: §RDisabled§!"
 foc_v211_support_debug.current.half:0 "\n\nCurrent scale: §Y50%§!"
 foc_v211_support_debug.current.standard:0 "\n\nCurrent scale: §G100% (Default)§!"
 foc_v211_support_debug.current.one_and_half:0 "\n\nCurrent scale: §H150%§!"
 foc_v211_support_debug.current.double:0 "\n\nCurrent scale: §R200%§!"
 foc_v211_support_debug.10.name:0 "Galactic Republic AI Fleet Support"
 foc_v211_support_debug.10.desc:0 "Controls the number of Venator support fleets received by the Galactic Republic AI during the Clone Wars. Each fleet remains fixed at 25 Venators, and the first-wave and recurring 360-day timing is unchanged."
 foc_v211_support_debug.10.disabled_tt:0 "Future waves grant 0 fleets."
 foc_v211_support_debug.10.half_tt:0 "Future waves grant 2 fleets × 25 Venators, 50 ships total."
 foc_v211_support_debug.10.standard_tt:0 "Future waves grant 4 fleets × 25 Venators, 100 ships total."
 foc_v211_support_debug.10.one_and_half_tt:0 "Future waves grant 6 fleets × 25 Venators, 150 ships total."
 foc_v211_support_debug.10.double_tt:0 "Future waves grant 8 fleets × 25 Venators, 200 ships total."
 foc_v211_support_debug.20.name:0 "Separatist AI Fleet Support"
 foc_v211_support_debug.20.desc:0 "Controls recurring Lucrehulk support received by the Separatist AI at Geonosis during the Clone Wars. It does not alter the 25-ship opening garrison in each controlled system or the Year Three story invasion of Coruscant."
 foc_v211_support_debug.20.disabled_tt:0 "Future waves grant 0 Lucrehulks."
 foc_v211_support_debug.20.half_tt:0 "Future waves grant 13 Lucrehulks."
 foc_v211_support_debug.20.standard_tt:0 "Future waves grant 25 Lucrehulks."
 foc_v211_support_debug.20.one_and_half_tt:0 "Future waves grant 38 Lucrehulks."
 foc_v211_support_debug.20.double_tt:0 "Future waves grant 50 Lucrehulks."
 foc_v211_support_debug.30.name:0 "Galactic Empire and Imperial Remnant AI Support"
 foc_v211_support_debug.30.desc:0 "Controls Imperial-class reinforcement strength for the Galactic Empire and the existing non-Republic-origin War in Heaven support for the Imperial Remnant.\n\nGalactic Empire: one fleet immediately after Death Star I is destroyed, then one every 360 days until Death Star II is destroyed. No early unlock based on fleet power or battlestation construction. Scaling changes ships per wave only. Imperial Remnant War in Heaven support rules are unchanged."
 foc_v211_support_debug.30.disabled_tt:0 "No future AI support fleets of these types are generated."
 foc_v211_support_debug.30.half_tt:0 "Empire: 17 Imperial-class ships per wave. War in Heaven Remnant: 10 Imperial-class ships + one 418 cruiser."
 foc_v211_support_debug.30.standard_tt:0 "Empire: 33 Imperial-class ships per wave. War in Heaven Remnant: 20 Imperial-class ships + one 418 cruiser."
 foc_v211_support_debug.30.one_and_half_tt:0 "Empire: 50 Imperial-class ships per wave. War in Heaven Remnant: 30 Imperial-class ships + one 418 cruiser."
 foc_v211_support_debug.30.double_tt:0 "Empire: 66 Imperial-class ships per wave. War in Heaven Remnant: 40 Imperial-class ships + one 418 cruiser."
 foc_v211_support_debug.40.name:0 "Rebel, New Republic and Resistance AI Support"
 foc_v211_support_debug.40.desc:0 "Controls Rebel annual and conquest-reward MC80 fleets, Mon Cala shipyard support, Kuat Nebula support, Leia's Resistance support, and non-Republic-origin War in Heaven support for the New Republic. A human player's selectable conquest reward remains fixed at 20 MC80s."
 foc_v211_support_debug.40.disabled_tt:0 "No future AI support fleets of these types are generated."
 foc_v211_support_debug.40.half_tt:0 "MC80 packages: 10 ships. Kuat Nebulas: 8. Resistance/New Republic Nebulas: 5."
 foc_v211_support_debug.40.standard_tt:0 "MC80 packages: 20 ships. Kuat Nebulas: 15. Resistance/New Republic Nebulas: 10."
 foc_v211_support_debug.40.one_and_half_tt:0 "MC80 packages: 30 ships. Kuat Nebulas: 23. Resistance/New Republic Nebulas: 15."
 foc_v211_support_debug.40.double_tt:0 "MC80 packages: 40 ships. Kuat Nebulas: 30. Resistance/New Republic Nebulas: 20."
 foc_v211_support_debug.50.name:0 "First Order AI Annual Support"
 foc_v211_support_debug.50.desc:0 "Applies an additional multiplier to First Order AI annual support after the normal crisis fleet-quantity setting. It affects recurring support only, not the opening First Order invasion package. A human-controlled First Order always remains at 100%."
 foc_v211_support_debug.50.disabled_tt:0 "Future annual waves grant 0 fleets; the 360-day cycle continues."
 foc_v211_support_debug.50.half_tt:0 "With Low/Standard/Large/Maximum crisis fleet quantity, each wave grants 1/1/2/2 support fleets."
 foc_v211_support_debug.50.standard_tt:0 "With Low/Standard/Large/Maximum crisis fleet quantity, each wave grants 1/2/3/4 support fleets."
 foc_v211_support_debug.50.one_and_half_tt:0 "With Low/Standard/Large/Maximum crisis fleet quantity, each wave grants 2/3/5/6 support fleets."
 foc_v211_support_debug.50.double_tt:0 "With Low/Standard/Large/Maximum crisis fleet quantity, each wave grants 2/4/6/8 support fleets."
 foc_v211_support_debug.60.name:0 "Final Order AI Annual Support"
 foc_v211_support_debug.60.desc:0 "Applies an additional multiplier to Final Order AI annual support after the normal crisis fleet-quantity setting. It affects recurring support only, not the Phase II opening package. A human-controlled Final Order always remains at 100%."
 foc_v211_support_debug.60.disabled_tt:0 "Future annual waves grant 0 fleets; the 360-day cycle continues."
 foc_v211_support_debug.60.half_tt:0 "With Low/Standard/Large/Maximum crisis fleet quantity, each wave grants 1/1/2/2 support fleets."
 foc_v211_support_debug.60.standard_tt:0 "With Low/Standard/Large/Maximum crisis fleet quantity, each wave grants 1/2/3/4 support fleets."
 foc_v211_support_debug.60.one_and_half_tt:0 "With Low/Standard/Large/Maximum crisis fleet quantity, each wave grants 2/3/5/6 support fleets."
 foc_v211_support_debug.60.double_tt:0 "With Low/Standard/Large/Maximum crisis fleet quantity, each wave grants 2/4/6/8 support fleets."
