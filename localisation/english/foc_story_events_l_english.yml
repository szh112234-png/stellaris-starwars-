l_english:
 foc_story.10.name:0 "The Destruction of the New Republic"
 foc_story.10.desc:0 "Starkiller Base has fired through hyperspace and struck the Hosnian system. Hosnian Prime, the Galactic Senate, the Republic naval anchorage and the entire capital region vanish in the stellar detonation. The New Republic has lost its central government and political symbol, leaving its surviving resistance forces scattered."
 foc_story.10.a:0 "The age of the Republic is over."

 foc_story.11.name:0 "The Destruction of Starkiller Base and the Death of Han Solo"
 foc_story.11.desc:0 "Starkiller Base has been completely destroyed. During the final operation inside the installation, Han Solo tried to bring his son Ben home, only to be killed by Kylo Ren. The strike team then detonated the critical systems, and the weaponized planet broke apart in fire."
 foc_story.11.a:0 "May the Force be with him."

 foc_story.12.name:0 "The Destruction of the Supremacy"
 foc_story.12.desc:0 "The First Order flagship Supremacy has broken apart in battle. Its immense hull is torn open by the hyperspace impact and cascading explosions, destroying the fleet command center and hyperspace-tracking complex. As the flagship becomes burning debris, the supreme authority of the First Order begins to collapse with it."
 foc_story.12.a:0 "The First Order has lost its throne."

 foc_story.13.name:0 "The Fate of Starkiller Base"
 foc_story.13.desc:0 "Our forces have seized the control center of Starkiller Base. The superweapon, its fixed defensive station and the stellar-energy extraction systems are now in our hands. We must decide whether to destroy this threat to the galaxy or turn it into an instrument of our own power."
 foc_story.13.a:0 "Destroy Starkiller Base."
 foc_story.13.a.tooltip:0 "§RDestroy the weaponized world, Starkiller megastructure, and its defense ring.§!\nThe galaxy will no longer live beneath this superweapon’s shadow, and we gain §Y25000§! Unity."
 foc_story.13.b:0 "Take control of Starkiller Base."
 foc_story.13.b.tooltip:0 "Preserve Starkiller Base, its defense ring, arsenal, and firing capability. The First Order and Final Order will treat us as the thieves of their ultimate weapon."

 foc_story.20.name:0 "The Last Jedi"
 foc_story.20.desc:0 "The Final Order has fallen and Palpatine's last fleet has vanished in flame. War has shattered the old order of the galaxy, and the victor must now decide what follows: inherit the absolute power left by the Sith, or guide the galaxy back toward cooperation and the light."
 foc_story.20.a:0 "Fall to darkness — I will inherit the legacy of the Sith."
 foc_story.20.a.tooltip:0 "Become the §RGalactic Emperor§! and gain the permanent §YDark Throne§! modifier. Every independent empire will receive an ultimatum; those that refuse to join will face immediate total war."
 foc_dark_order_legacy_reward_tt:0 "§RDark-side inheritance:§! As the empire that personally destroyed the Final Order, we recover the construction technologies for §YStarkiller Base§!, the §YImperial-class§!, §YResurgent-class§!, and §YSupremacy§!. The Supremacy command edict and direct construction project are also unlocked. The §YXyston-class§! remains sealed until the country actually enters the §HFinal Order§! stage."
 foc_story.20.b:0 "Embrace the light — the galaxy shall know peace."
 foc_story.20.b.tooltip:0 "Become the §Bpermanent Galactic Custodian§! and gain the permanent §YGuardian of the Galaxy§! modifier. Also receive the §YNebula-class§! and §YViscount-class§! construction technologies and their complete fixed blueprints. Their exclusive weapons and components remain hidden and cannot be used separately."

 foc_story.21.name:0 "Ultimatum of the New Empire"
 foc_story.21.desc:0 "The conqueror of the Final Order has proclaimed a new Galactic Empire and demands that every independent state recognize the Emperor's supreme authority. Submission means joining the new order. Refusal means total war."
 foc_story.21.a:0 "We will join the new Empire."
 foc_story.21.a.tooltip:0 "Become a subject of the Galactic Emperor and avoid the war of galactic unification."
 foc_story.21.b:0 "We will never submit."
 foc_story.21.b.tooltip:0 "Reject the ultimatum. The Galactic Emperor will immediately declare a total war against us."

 foc_story.23.name:0 "The Last Jedi"
 foc_story.23.desc:0 "The Final Order has fallen. The victor who destroyed Palpatine's last fleet is deciding the future political order of the galaxy."
 foc_story.23.a:0 "An age has ended."

 foc_story_dark_emperor:0 "The Dark Throne"
 foc_story_dark_emperor_desc:0 "This empire has inherited the legacy of the Sith and raised a new Galactic Empire from the ruins of the Final Order."
 foc_story_light_custodian:0 "Guardian of the Galaxy"
 foc_story_light_custodian_desc:0 "This empire rejected the temptation of the dark side and became the permanent Custodian of the Galactic Community."

 foc_tech_dark_legacy_imperial:0 "Imperial-class Star Destroyer"
 foc_tech_dark_legacy_imperial_desc:0 "The Galactic Empire activates this capital-ship technology at its founding; the Dark Legacy path can also recover the complete construction data."
 foc_tech_dark_legacy_resurgent:0 "Resurgent-class Star Destroyer Blueprint"
 foc_tech_dark_legacy_resurgent_desc:0 "Recovered First Order archives grant controlled access to the Resurgent-class Star Destroyer hull. Completing all hull technologies (this blueprint, $tech_battleships$ and $tech_plasma_3$) also unlocks small, medium and large Advanced Durasteel Armor."
 foc_tech_dark_legacy_xyston:0 "Xyston-class Star Destroyer Blueprint"
 foc_tech_dark_legacy_xyston_desc:0 "Only after entering the §HFinal Order§! stage are the Exegol archives unsealed for Xyston-class construction. Equipping its dedicated T-slot axial superlaser reduces the ship's shield capacity by 100%."
 foc_tech_dark_legacy_supremacy:0 "Supremacy Blueprint"
 foc_tech_dark_legacy_supremacy_desc:0 "Recovered First Order command-ship data unlocks the Supremacy command edict and its direct construction project."
 foc_dark_order_legacy_required:0 "§RRequires the First Order origin or the dark-side legacy obtained by personally destroying the Final Order.§!"
 foc_story.31.name:0 "Battle of Crait"
 foc_story.31.desc:0 "Crait has fallen to the First Order or the Final Order. Luke Skywalker expended the last of his strength to cover the survivors’ escape before becoming one with the Force. Crait's defence has collapsed, but surviving Resistance forces may yet regroup at an unknown refuge. Our own empire must now choose whether to submit to the First Order or remain independent and continue the fight."
 foc_story.31.a:0 "Surrender to the First Order."
 foc_story.31.a.tooltip:0 "Our state will accept First Order rule, and our existing subjects will be drawn into its sphere. Crait's defence line has fallen."
 foc_story.31.a.starkiller_blocked:0 "§RA country that controls Starkiller Base cannot surrender to the First Order.§!"
 foc_story.31.b:0 "We will continue the fight!"
 foc_story.31.b.tooltip:0 "Our state refuses submission and will bear the cost of continuing the war against both Orders. Survivors are escaping from Crait."
 foc_story.33.name:0 "Battle of Crait"
 foc_story.33.desc:0 "Crait has fallen. Luke Skywalker expended the last of his strength to cover the survivors’ escape before becoming one with the Force. The salt-mine redoubt has collapsed, but some survivors escaped the blockade into deep space."
 foc_story.33.a:0 "The Battle of Crait is over."
