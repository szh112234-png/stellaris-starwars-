l_english:
 SAI_SUPREMACY_SG_REACTOR_FIRE_CONTROL:0 "Supremacy Reinforced Reactor and Fire-Control Core"
 SAI_SUPREMACY_SG_REACTOR_FIRE_CONTROL_DESC:0 "Vast reactor banks feed the long-range batteries and distributed fire-control network, coordinating volleys across the entire hull."
 SAI_SUPREMACY_SG_WARP_DRIVE:0 "Supremacy Military Hyperdrive"
 SAI_SUPREMACY_SG_WARP_DRIVE_DESC:0 "Multiple hyperspace field generators pull this mobile city into a calculated jump with astonishing speed."
 SAI_SUPREMACY_SG_THRUSTER:0 "Supremacy Heavy Thruster Array"
 SAI_SUPREMACY_SG_THRUSTER_DESC:0 "Colossal drives spread across the stern slowly but inexorably turn the sixty-kilometer hull."
 SAI_SUPREMACY_SG_SENSOR:0 "Supremacy Long-Range Sensors"
 SAI_SUPREMACY_SG_SENSOR_DESC:0 "Sensor and listening arrays across the hull detect fleet movements and hyperspace disturbances in distant systems."
