l_english:
 foc_sw_clone_legion:0 "Republic Clone Legion"
 foc_sw_clone_legion_desc:0 "Kaminoan clone soldiers form the disciplined backbone of the Grand Army of the Republic."
 foc_sw_clone_arc_troopers:0 "ARC Troopers"
 foc_sw_clone_arc_troopers_desc:0 "Elite Advanced Recon Commandos trained for independent breakthrough and decapitation missions."
 foc_sw_clone_commandos:0 "Republic Clone Commandos"
 foc_sw_clone_commandos_desc:0 "Small specialist teams trained to destroy command, shield and logistics targets behind enemy lines."
 foc_sw_cis_b1_droids:0 "B1 Battle Droid Army"
 foc_sw_cis_b1_droids_desc:0 "Cheap, obedient and deployable in overwhelming numbers."
 foc_sw_cis_b2_droids:0 "B2 Super Battle Droids"
 foc_sw_cis_b2_droids_desc:0 "Heavier armor and integrated weapons turn the B2 into the CIS's line-breaking infantry."
 foc_sw_cis_droidekas:0 "Droideka Units"
 foc_sw_cis_droidekas_desc:0 "Rolling destroyer droids combine speed, twin blasters and personal deflector shields."
 foc_sw_cis_commando_droids:0 "BX Commando Droids"
 foc_sw_cis_commando_droids_desc:0 "Elite infiltration droids with far greater tactical ability than standard B1 units."
 foc_sw_imperial_stormtroopers:0 "Imperial Stormtroopers"
 foc_sw_imperial_stormtroopers_desc:0 "The white-armored symbol of Imperial rule across the galaxy."
 foc_sw_imperial_storm_commandos:0 "Imperial Storm Commandos"
 foc_sw_imperial_storm_commandos_desc:0 "Elite reconnaissance and counter-insurgency troops trained to hunt rebel cells."
 foc_sw_imperial_dark_troopers:0 "Dark Troopers"
 foc_sw_imperial_dark_troopers_desc:0 "Heavily armored mechanized shock troops produced by advanced Imperial factories."
 foc_sw_rebel_infantry:0 "Rebel Infantry"
 foc_sw_rebel_infantry_desc:0 "Volunteers, defectors and veterans united by a refusal to accept Imperial rule."
 foc_sw_rebel_pathfinders:0 "Rebel Pathfinders"
 foc_sw_rebel_pathfinders_desc:0 "Infiltration troops who land first and seize objectives before the main force arrives."
 foc_sw_new_republic_marines:0 "New Republic Marines"
 foc_sw_new_republic_marines_desc:0 "A professional landing and rapid-response arm built from Civil War veterans and new recruits."
 foc_sw_first_order_stormtroopers:0 "First Order Stormtroopers"
 foc_sw_first_order_stormtroopers_desc:0 "Soldiers conditioned from childhood to continue the war the old Empire failed to finish."
 foc_sw_first_order_heavy_troopers:0 "First Order Heavy Troopers"
 foc_sw_first_order_heavy_troopers_desc:0 "Heavy weapons and reinforced armor provide the firing core of First Order ground formations."
 foc_sw_first_order_elite_troopers:0 "First Order Elite Corps"
 foc_sw_first_order_elite_troopers_desc:0 "Selected assault troops representing the highest standard of First Order discipline."
 foc_sw_first_order_at_m6:0 "AT-M6 Siege Group"
 foc_sw_first_order_at_m6_desc:0 "Massive walkers designed to break fortified planetary defenses."
 foc_sw_sith_eternal_troopers:0 "Sith Eternal Legions"
 foc_sw_sith_eternal_troopers_desc:0 "Red-armored soldiers raised in the darkness of Exegol for the Final Order."
 foc_sw_mandalorian_warriors:0 "Mandalorian Warriors"
 foc_sw_mandalorian_warriors_desc:0 "Clan tradition, beskar armor and generations of martial culture make Mandalorians formidable soldiers."
 foc_sw_mandalorian_elite:0 "Mandalorian Elite Commandos"
 foc_sw_mandalorian_elite_desc:0 "Veteran clan warriors equipped with superior beskar armor, jetpacks and heavy weapons."

 building_foc_sw_republic_barracks:0 "Republic Barracks"
 building_foc_sw_republic_barracks_desc:0 "A major staging and training complex for the Grand Army of the Republic."
 building_foc_sw_republic_factory:0 "Republic Military Factory"
 building_foc_sw_republic_factory_desc:0 "A wartime industrial complex producing vehicles, weapons and fleet components."
 building_foc_sw_separatist_parliament:0 "Separatist Parliament"
 building_foc_sw_separatist_parliament_desc:0 "A political center for the worlds and corporations that broke with Coruscant."
 building_foc_sw_geonosian_arena:0 "Geonosian Arena"
 building_foc_sw_geonosian_arena_desc:0 "A monumental arena that became one of the first battlefields of the Clone Wars."
 building_foc_sw_imperial_barracks:0 "Imperial Barracks"
 building_foc_sw_imperial_barracks_desc:0 "Stormtroopers and garrison formations are trained and deployed from this complex."
 building_foc_sw_imperial_factory:0 "Imperial Military Complex"
 building_foc_sw_imperial_factory_desc:0 "A vast industrial plant feeding the Imperial war machine."
 building_foc_sw_imperial_palace:0 "Imperial Palace"
 building_foc_sw_imperial_palace_desc:0 "The transformed center of galactic power from which the Emperor rules."
 building_foc_sw_fortress_vader:0 "Fortress Vader"
 building_foc_sw_fortress_vader_desc:0 "A black fortress rising over Mustafar's lava fields."
 building_foc_sw_rebel_command_center:0 "Rebel Command Center"
 building_foc_sw_rebel_command_center_desc:0 "Hidden hangars, war rooms and encrypted communications form the nerve center of a rebel base."
 building_foc_sw_hoth_ion_cannon:0 "Hoth Heavy Ion Cannon"
 building_foc_sw_hoth_ion_cannon_desc:0 "A massive ion weapon capable of opening a brief escape corridor through an orbital blockade."
 building_foc_sw_new_republic_senate:0 "New Republic Senate"
 building_foc_sw_new_republic_senate_desc:0 "Representatives of member worlds gather on Hosnian Prime to guide the restored Republic."
 building_foc_sw_first_order_training_center:0 "First Order Training Center"
 building_foc_sw_first_order_training_center_desc:0 "A regimented institution that shapes recruits into components of the First Order war machine."

 tech_foc_sw_star_forge:0 "Legacy of the Star Forge"
 tech_foc_sw_star_forge_desc:0 "Ancient records on Malachor point toward a super-industrial concept that feeds directly on stellar energy and matter."
 foc_sw_star_forge_site:0 "Star Forge"
 foc_sw_star_forge_site_DESC:0 "The first operational core of a stellar-scale forge."
 foc_sw_star_forge_2:0 "Star Forge: Industrial Core"
 foc_sw_star_forge_2_DESC:0 "Expanded forge arrays convert stellar power into a continuous stream of war material."
 foc_sw_star_forge_3:0 "Star Forge: Complete"
 foc_sw_star_forge_3_DESC:0 "A vast ancient industrial engine capable of sustaining an enormous war fleet."
 foc_sw_star_forge_one_only:0 "Only one Star Forge can be maintained by a single empire."

 foc_lore_alderaan_jewel_of_the_core:0 "Jewel of the Core"
 foc_lore_alderaan_jewel_of_the_core_desc:0 "Alderaan is renowned for ancient cities, natural beauty and republican political traditions."
 foc_lore_bracca_shipbreaking_yards:0 "Bracca Shipbreaking Yards"
 foc_lore_bracca_shipbreaking_yards_desc:0 "Warships are cut apart here and fed back into the galactic industrial chain."
 foc_lore_tanalorr_hidden_refuge:0 "Hidden Refuge of Tanalorr"
 foc_lore_tanalorr_hidden_refuge_desc:0 "A remote sanctuary isolated by hazardous routes."
 foc_lore_ossus_jedi_ruins:0 "Jedi Ruins of Ossus"
 foc_lore_ossus_jedi_ruins_desc:0 "Ancient Jedi knowledge survives among the ruins of this storied world."
 foc_lore_ahchto_first_temple:0 "First Jedi Temple"
 foc_lore_ahchto_first_temple_desc:0 "Stone ruins on remote islands preserve the earliest traditions of the Jedi Order."
 foc_lore_aldhani_highlands:0 "Aldhani Highlands"
 foc_lore_aldhani_highlands_desc:0 "Harsh highlands and sparse settlement make this world ideal for hidden installations."
 foc_lore_utapau_sinkhole_cities:0 "Sinkhole Cities of Utapau"
 foc_lore_utapau_sinkhole_cities_desc:0 "Civilization descends along immense sinkhole walls, turning geography into natural fortification."
 foc_lore_christophsis_crystal_world:0 "Christophsis Crystal Fields"
 foc_lore_christophsis_crystal_world_desc:0 "Enormous crystalline formations give the planet unusual industrial and strategic value."
 foc_lore_jedha_holy_city:0 "Holy City of Jedha"
 foc_lore_jedha_holy_city_desc:0 "Pilgrimage, Force traditions and kyber commerce make Jedha unique in galactic religious history."
 foc_lore_malachor_sith_battlefield:0 "Ancient Battlefield of Malachor"
 foc_lore_malachor_sith_battlefield_desc:0 "War and the dark side scarred this world, leaving dangerous knowledge beneath the ruins."
 foc_lore_aldoleem_industrial_mines:0 "Al'doleem Industrial Mines"
 foc_lore_aldoleem_industrial_mines_desc:0 "Remote heavy mines feed the wider Imperial industrial network."
 foc_sw_resistance_fighters:0 "Resistance Fighters"
 foc_sw_resistance_fighters_desc:0 "While the New Republic still debates whether the threat is real, these volunteers have already followed Leia to D'Qar."
 foc_sw_resistance_commandos:0 "Resistance Commandos"
 foc_sw_resistance_commandos_desc:0 "Small elite teams of Rebel veterans, Republic soldiers and frontier volunteers trained for infiltration and sabotage."
 building_foc_sw_resistance_command_post:0 "Resistance Command Post"
 building_foc_sw_resistance_command_post_desc:0 "Hidden communications arrays, hangars and improvised war rooms form the nerve center of a movement that refuses to wait for catastrophe."

