 FOC_DEATH_STAR_DEFENSE_DESC:0 "Super-heavy armour, shields and damage control covering the battlestation."
 foc_republic_origin.30.a.tt:0 "Your country becomes the Galactic Empire and inherits Republic territory. Completing Death Star II or eliminating the Imperial Rebellion commissions Executor, Lusankya and Punisher at Endor, Coruscant and Jakku. Each group has one Executor-class ship and thirty Imperial II-class escorts. Other Galactic Concordance requirements remain unchanged."
 foc_republic_origin.30.b.tt:0 "§HYour country becomes the Imperial Rebels in place§!. It does not receive Raddus at this stage; the true §HResistance§! formed in the later First Order era receives the unique maximum-tier Arkship §HRaddus§! once. Destroy both Death Stars and both Executor-class flagships and control §HCoruscant, Jakku and Kuat§!, or eliminate the Empire outright, to found the New Republic."
 foc_republic_origin.160.name:0 "Galactic Concordance: New Republic"
 foc_republic_origin.160.desc:0 "§HDeath Star I, Death Star II, Executor and Lusankya have all been destroyed, while the Alliance controls the Coruscant, Jakku and Kuat systems.§! The Empire is forced to sign the Galactic Concordance:\n\n- The Alliance becomes the ordinary §HNew Republic§! at §HHosnian Prime§! and receives the sealed §HViscount-class§! design;\n- The Imperial survivors withdraw to Bastion as the ordinary §HImperial Remnant§!;\n- Neither successor becomes a Fallen Empire.\n\nThe same Concordance takes effect immediately if the Galactic Empire is eliminated outright."
 foc_republic_origin.161.name:0 "Galactic Concordance: Imperial Remnant"
 foc_republic_origin.161.desc:0 "§HBoth Death Stars and both Executor-class flagships are gone, while the Alliance controls the Coruscant, Jakku and Kuat systems.§! The Empire can no longer sustain the war and accepts the Galactic Concordance:\n\n- The Alliance establishes the ordinary §HNew Republic§! and receives the sealed §HViscount-class§! design;\n- We withdraw to Bastion as the ordinary §HImperial Remnant§!;\n- Neither successor becomes a Fallen Empire."
 foc_republic_origin.171.desc:0 "Death Star I has been destroyed. The Rebels receive their existing victory reward, and the old Death Star attack bonus ends immediately.\n\nA player Empire receives the Death Star II engineering project immediately; completion triggers Bothan intelligence and deploys the station at Endor. An AI Empire reveals and deploys its unfinished station exactly four years after this loss. Existing Imperial support-fleet rules remain in effect."
 foc_republic_origin.176.name:0 "Both Death Stars Lost: General Offensive"
 foc_republic_origin.176.desc:0 "Death Star I and Death Star II are destroyed, granting the Alliance a major permanent boost. Imperial territory is not transferred automatically: to force the §HGalactic Concordance§!, the Alliance must also destroy §HExecutor and Lusankya§! and physically control the §HCoruscant, Jakku and Kuat§! systems.\n\nEliminating the Galactic Empire outright also triggers the Concordance immediately."
 foc_republic_origin.176.a:0 "Destroy the Empire's remaining strategic pillars."
 foc_republic_origin.180.name:0 "Two Executors Enter Service"
 foc_republic_origin.180.desc:0 "Executor guards Endor, Lusankya guards Coruscant, and Punisher guards Jakku. Each of the three groups consists of one Executor-class flagship and thirty Imperial II-class escorts. The unique flagships are commissioned once and are never rebuilt after destruction."