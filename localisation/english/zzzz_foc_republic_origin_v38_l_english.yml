 foc_rebel_home_arkship_strike_command_module_DESC:0 "Raddus's unique fixed Tier III axial module, coordinating X-wing and Y-wing squadrons for interstellar strategic strikes."
 foc_rebel_home_arkship_strike_command_module_tt:0 "§YFixed axial module§!\n§HStrategic squadrons:§! 9 X-wing and 9 Y-wing\n§HStrategic action:§! Rebel Starfighter Strike\nThis module cannot be replaced and never appears on vanilla Arkships or the Supremacy."
