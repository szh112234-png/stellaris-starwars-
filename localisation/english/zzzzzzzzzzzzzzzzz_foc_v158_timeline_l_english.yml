l_english:
 foc_luke.20.name:0 "Ossus: Rebirth of the Jedi"
 foc_luke.20.desc:0 "Exactly four years after the Galactic Treaty, Luke Skywalker establishes a new Jedi Temple on §HOssus§!. The galaxy is at peace, and for the first time since the Purge the Jedi possess a permanent home again. Ben Solo is still a child and remains a narrative figure at this stage; no Ben or Kylo leader is created yet."
 foc_luke.20.a:0 "The Jedi have a home again."
 foc_luke.23.name:0 "Ben Solo Begins His Training"
 foc_luke.23.desc:0 "Ten years have passed since the Galactic Treaty. §HBen Solo§!, the son of Leia Organa and Han Solo, formally joins Luke Skywalker's students on Ossus. His connection to the Force is extraordinary, but Ben remains a story character only; he is not yet a recruitable leader."
 foc_luke.23.a:0 "Luke will train him."
 foc_luke.21.name:0 "The Destruction of the Ossus Temple"
 foc_luke.21.desc:0 "Twenty-three years after the Galactic Treaty, the darkness surrounding §HBen Solo§! finally breaks into the open. The Jedi Temple on §HOssus§! is consumed by fire and Luke's new Order is shattered. Ben disappears into the shadow of Snoke, but he does §Hnot§! yet appear as a recruitable Kylo Ren; that transformation occurs only when the First Order itself descends upon the galaxy.\n\nIn the same year, the political backlash against Leia Organa reaches its breaking point. Forced out of the New Republic and convinced that the Senate will not confront the danger gathering in the Unknown Regions, Leia leaves for D'Qar to form the §HResistance§!."
 foc_luke.21.a:0 "The light has suffered a terrible wound."
