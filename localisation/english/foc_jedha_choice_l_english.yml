l_english:
 NAME_FOC_JEDHA_EXTREMIST_REBELS:0 "Jedha Partisans"
 foc_jedha_choice.name:0 "Jedha: Extremist Rebel Activity"
 foc_jedha_choice.desc:0 "§HDeath Star I is complete and operational.§!\n\nImperial Intelligence reports that Saw Gerrera's extremist partisans are attacking kyber shipments and mining facilities on §HJedha§!, preparing to seize the system.\n\nThe Death Star can destroy Jedha entirely, taking the insurgents and the world's kyber reserves with it. If we leave the uprising unchecked, our garrison will withdraw and the Rebels will take control of the whole system.\n\nThe final order is yours."
 foc_jedha_choice.destroy:0 "Destroy Jedha with the Death Star."
 foc_jedha_choice.destroy.tt:0 "§RJedha becomes a Shattered World, losing its population, colony and all kyber modifiers.§!\nThe §HTarkin Doctrine§! event follows."
 foc_jedha_choice.ignore:0 "Leave them alone."
 foc_jedha_choice.ignore.tt:0 "§YThe Rebels take ownership of the entire Jedha system.§! Jedha and its kyber deposits survive.\n§RThe Tarkin Doctrine event is permanently blocked for the rest of this game.§!"
 foc_jedha_choice.rebel.name:0 "The Fate of Jedha"
 foc_jedha_choice.rebel_destroyed.desc:0 "The Empire has fired on Jedha. The Death Star's superlaser tore the entire world apart, consuming the Holy City, its mines and its inhabitants. Only planetary fragments remain.\n\nJedha's kyber production is gone. Rebels who were offworld have brought back the images: the Empire can destroy a world, and it has chosen to do so."
 foc_jedha_choice.rebel_spared.desc:0 "Although its Death Star is operational, the Empire has chosen to leave Jedha's insurgents alone. The Imperial garrison withdrew and the Rebels took control of the starbase, colonies and entire system.\n\nThe Holy City and its kyber mines survive. The desert partisans have opened their bases and supply routes to the Rebellion, and the Empire has abandoned this opportunity to impose the Tarkin Doctrine."
 foc_jedha_choice.rebel.a:0 "Send word to the Alliance."
 foc_jedha_choice.bodhi_spared.desc:0 "Imperial cargo pilot Bodhi Rook has reached Rebel-held Jedha with a secret message from Galen Erso: the Death Star is complete, but its reactor design contains a fatal weakness.\n\nWith Jedha intact, Saw Gerrera's partisans have been able to deliver both the pilot and his message to the Rebellion. We must find the full evidence Galen left behind."
 foc_jedha_choice.tarkin.desc:0 "Jedha is a shattered world. The Death Star has carried out its first act of planetary destruction. With the Holy City and its kyber mines gone, the galaxy can no longer doubt what this weapon can do.\n\nGovernor Tarkin submits a memorandum to the Emperor: §Hrule through the fear of force, rather than through force itself§!. Every system will see Jedha's fate and understand the cost of open rebellion.\n\nThe Tarkin Doctrine will turn this destruction into the Empire's enduring method of enforcing order."
