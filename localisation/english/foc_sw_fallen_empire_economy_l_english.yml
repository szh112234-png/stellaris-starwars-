l_english:
 building_foc_sw_fe_civil_nexus:0 "Ancient Civil Nexus"
 building_foc_sw_fe_civil_nexus_desc:0 "A planet-spanning web of administration, logistics, and automation maintains this world without relying on a conventional bureaucracy."
 building_foc_sw_fe_power_core:0 "Zero-Point Power Core"
 building_foc_sw_fe_power_core_desc:0 "Ancient generators buried deep beneath the surface draw power from vacuum fluctuations, supplying cities, fleets, and orbital installations."
 building_foc_sw_fe_matter_fabricator:0 "Dimensional Matter Loom"
 building_foc_sw_fe_matter_fabricator_desc:0 "Vast fabrication arrays reorganize energy into minerals, rare elements, and strategic materials, freeing the world from fragile supply lines."
 building_foc_sw_fe_ship_foundry:0 "Autonomous Fleet Foundry"
 building_foc_sw_fe_ship_foundry_desc:0 "Self-directed industrial cities manufacture everything from durasteel frames to precision starship systems. The New Republic favors civilian supply, while the Imperial Remnant devotes more capacity to warships."
 building_foc_sw_fe_nourishment_vault:0 "Perpetual Nourishment Vault"
 building_foc_sw_fe_nourishment_vault_desc:0 "Closed ecosystems, molecular synthesizers, and ancient agricultural archives ensure that the population can survive even the longest blockade."
 building_foc_sw_fe_archive:0 "Galactic Memory Vault"
 building_foc_sw_fe_archive_desc:0 "Scientific records, navigation data, and civilizational archives from countless eras remain under the care of tireless automated research matrices."

 foc_sw_fallen_empire_economy_core:0 "Ancient Economic Network"
 foc_sw_fallen_empire_economy_core_desc:0 "Highly automated production and immense strategic reserves sustain vast fleets and fortress networks indefinitely. Its battle doctrine forbids both combat disengagement and emergency FTL retreat."
 foc_sw_new_republic_economy_focus:0 "New Republic Prosperity System"
 foc_sw_new_republic_economy_focus_desc:0 "The New Republic directs ancient industry toward civilian welfare, research, and stability while retaining enough capacity to defend its Core Worlds."
 foc_sw_imperial_remnant_economy_focus:0 "Imperial War Industry"
 foc_sw_imperial_remnant_economy_focus_desc:0 "The Imperial Remnant concentrates minerals, energy, and automated factories on military production, preserving the last Imperial domains through steel and discipline."
 foc_sw_awakened_fallen_empire_war_economy:0 "Total War Mobilization"
 foc_sw_awakened_fallen_empire_war_economy_desc:0 "Dormant industrial networks have awakened. Sealed shipyards burn again, strategic reserves are opened, and the entire state turns toward a war for the fate of the galaxy."
 foc_sw_fe_infrastructure_heir_core:0 "Inherited Ancient Infrastructure"
 foc_sw_fe_infrastructure_heir_core_desc:0 "As the designated successor state, this empire can still operate the ancient production facilities left by the two Fallen Empires, and keeps their strategic storage capacity and fleet maintenance network."
 building_foc_sw_fe_support_complex:0 "Ancient Integrated Support Complex"
 building_foc_sw_fe_support_complex_desc:0 "A compact automated complex combines heavy industry, nourishment, research and logistics in a single hardened facility, preserving the ancient economy on worlds with limited building capacity."
