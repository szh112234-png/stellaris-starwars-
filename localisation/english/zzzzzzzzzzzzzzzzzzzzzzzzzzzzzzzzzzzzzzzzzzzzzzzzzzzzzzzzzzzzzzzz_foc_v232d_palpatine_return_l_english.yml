l_english:
 foc_khan.63.name:0 "The Emperor Returns: Rise of the Final Order"
 foc_khan.63.desc:0 "§LFrom within the storms of Exegol, a voice that should have been dead speaks across the galaxy once more.§!\n\nPalpatine truly died aboard Death Star II, hurled into the reactor shaft by Darth Vader as the battlestation was destroyed. Yet the Sith Eternal never ceased its cloning experiments and efforts to preserve their master's consciousness. Now a broken but viable new body opens its eyes. §HEmperor Palpatine has returned.§!\n\nThe destruction of Starkiller Base and the Supremacy did not end the war. First Order remnants gather at Exegol while the Sith Eternal's Xyston fleet rises from the storm. The two orders become one: the §HFinal Order§! has arrived."
 foc_khan.63.a:0 "The dead Emperor has returned."
 foc_khan.64.name:0 "The Dead Return"
 foc_khan.64.desc:0 "§LWe once bowed to the First Order. Now the true master behind its throne has revealed himself.§!\n\nPalpatine, killed aboard Death Star II, has returned in a cloned body on Exegol. The First Order has been absorbed by the Final Order, and our submission transfers with it. From this day forward we answer directly to §Hthe resurrected Emperor Palpatine§! and the Sith Eternal."
 foc_khan.64.a:0 "The Emperor rules once more."
 fop_origin.55.name:0 "The Emperor Returns: Coronation of the Final Order"
 fop_origin.55.desc:0 "§LThe storms of Exegol part before an Emperor returned from death.§!\n\nEndor was not the end of Palpatine. The Sith Eternal preserved his consciousness and spent years creating a vessel capable of bearing it. Now the Sith Lord who died in Death Star II's reactor has opened his eyes again on Exegol. §HPalpatine has returned and reclaimed the throne.§!\n\nThe First Order war machine and Exegol's dark legions become one. The Xyston fleet awaits the Emperor's command, and the §HFinal Order§! is crowned. Conquering the galaxy is only the beginning."
 fop_origin.55.a:0 "The Final Order obeys the Emperor."
