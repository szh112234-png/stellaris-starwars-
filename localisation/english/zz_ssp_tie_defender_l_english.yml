l_english:
 SSP_IMPERIAL_DEFENDER_REMOTE:0 "TIE Defender Point-Defense Remote Squadron [1× · 标准]"
 SSP_IMPERIAL_DEFENDER_REMOTE_DESC:0 "12 craft per squadron. Independent Imperial TIE Defender point-defense fighter; it does not replace the original TIE/LN. Prioritizes hostile strike craft and missiles. On SG, per-craft damage is about 133.333–200; across 12 craft the squadron average totals 2000. Lower strengths follow the same curve on a whole-squadron basis. Display scale affects visuals only."
