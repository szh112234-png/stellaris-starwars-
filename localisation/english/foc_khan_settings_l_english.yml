l_english:
 edict_foc_khan_settings_menu_edict: "Star Wars MOD Settings"
 edict_foc_khan_settings_menu_edict_desc:0 "Unified Star Wars MOD settings for combat strength, strategic fighters, crisis fleet quantity, crisis arrival, and Republic-origin testing."

 foc_khan_settings.10.name: "Star Wars MOD Settings"
 foc_khan_settings.10.desc:0 "Unified Star Wars MOD settings. Combat strength and fleet quantity remain independent. Strategic fighter strength follows the main combat tier automatically: Vanilla = original fighter profile, Intermediate = SG profile, ACOT = BUFF/enhanced profile. The fighter submenu now controls only visual size and designer faction visibility."
 foc_khan_settings.10.strength:0 "Set MOD Combat Strength"
 foc_khan_settings.10.fighter_settings:0 "Star Wars Fighter Settings"
 foc_khan_settings.10.fleet_scale:0 "Set Crisis Fleet Quantity"
 foc_khan_settings.10.trigger_settings:0 "Set Crisis Arrival"
 foc_khan_settings.10.republic_origin_test:0 "Story Debug: High Command Console"
 foc_khan_settings.10.close:0 "Dismiss High Command"

 foc_khan_settings.11.name:0 "Choose Combat Strength"
 foc_khan_settings.11.desc:0 "This setting changes ship, weapon, supercapital and crisis-country combat values only; it no longer controls fleet numbers. Strategic fighters are synchronized automatically: Vanilla uses the original fighter profile, Intermediate uses the SG fighter profile, and ACOT uses the BUFF/enhanced fighter profile."
 foc_khan_settings.11.lowest:0 "Vanilla: Vanilla-Scale Combat"
 foc_khan_settings.11.intermediate:0 "Intermediate: SG / FOC Combat"
 foc_khan_settings.11.madness:0 "ACOT: Ancient-Power Combat"

 foc_khan_settings.12.name: "Crisis Trigger Settings"
 foc_khan_settings.12.desc:0 "Disable automatic arrival, re-enable it, or trigger the crisis immediately. A crisis already unleashed cannot be sealed away again."
 foc_khan_settings.12.disable: "Disable Automatic Crisis Trigger"
 foc_khan_settings.12.enable: "Enable Automatic Crisis Trigger"
 foc_khan_settings.12.trigger_now: "Trigger Crisis Immediately (Irreversible)"
 foc_khan_settings.12.already_started: "The crisis has already started; trigger settings are locked"
 foc_khan_settings.back: "Back"

 foc_khan_settings.13.name:0 "Initial Crisis Setup"
 foc_khan_settings.13.desc:0 "Configure combat strength, fleet scale, and the §Hmaster story timeline start§!, or close immediately to use the defaults: §YIntermediate combat strength + Large reinforcement scale + all fighter families + original fighter model size + story start in 2200§!."

 foc_khan_settings.14.name:0 "Choose Crisis Fleet Scale"
 foc_khan_settings.14.desc:0 "No percentage rescaling is used. These are the four distinct fleet-count sets actually present in the current mod; former High and Madness already shared the same counts. Battle fleets contain 7 / 14 / 20 / 27 ships. Existing support composition, the 864-ship per-faction cap, and the 360-day support cycle are unchanged."
 foc_khan_settings.14.low:0 "Small: FO starts 2 x 7; support 1 x (4 Imperial + 3 Resurgent + 1 Mandator) = 8; Final support 1 x 7"
 foc_khan_settings.14.standard:0 "Standard: FO starts 4 x 14; support 2 x (8 Imperial + 5 Resurgent + 1 Mandator) = 28; Final support 2 x 14 = 28"
 foc_khan_settings.14.large:0 "Large: FO starts 6 x 20; support 3 x (12 Imperial + 8 Resurgent + 1 Mandator) = 63; Final support 3 x 20 = 60"
 foc_khan_settings.14.max:0 "Total Mobilization: FO starts 8 x 27; support 4 x (16 Imperial + 10 Resurgent + 1 Mandator) = 108; Final support 4 x 27 = 108"

 foc_khan_strength_lowest_first: "Vanilla: First Order"
 foc_khan_strength_lowest_first_desc:0 "The First Order uses the complete vanilla-scale ship, weapon, and defensive component balance."
 foc_khan_strength_lowest_final: "Vanilla: Final Order"
 foc_khan_strength_lowest_final_desc:0 "The Final Order uses the complete vanilla-scale ship, weapon, and defensive component balance."
 foc_khan_strength_intermediate_first: "Intermediate: First Order"
 foc_khan_strength_intermediate_first_desc:0 "Original SG/FOC equipment strength without ACOT-scale global multipliers."
 foc_khan_strength_intermediate_final: "Intermediate: Final Order"
 foc_khan_strength_intermediate_final_desc:0 "Original SG/FOC equipment strength without ACOT-scale global multipliers."
 foc_khan_strength_madness_first: "ACOT: First Order"
 foc_khan_strength_madness_first_desc:0 "Original SG/FOC equipment plus the former Madness ancient-power global combat package."
 foc_khan_strength_madness_final: "ACOT: Final Order"
 foc_khan_strength_madness_final_desc:0 "Original SG/FOC equipment plus the former Madness ancient-power global combat package."

 foc_khan_settings.11.initial:0 "Legacy Beginner (Migrated)"
 foc_khan_settings.11.high:0 "Legacy High (Migrated)"
 foc_khan_strength_initial_first: "Legacy Beginner: First Order"
 foc_khan_strength_initial_first_desc:0 "Legacy save compatibility entry."
 foc_khan_strength_initial_final: "Legacy Beginner: Final Order"
 foc_khan_strength_initial_final_desc:0 "Legacy save compatibility entry."
 foc_khan_strength_high_first: "Legacy High: First Order"
 foc_khan_strength_high_first_desc:0 "Legacy save compatibility entry."
 foc_khan_strength_high_final: "Legacy High: Final Order"
 foc_khan_strength_high_final_desc:0 "Legacy save compatibility entry."

 foc_khan_settings.13.strength:0 "1. Set Combat Strength"
 foc_khan_settings.13.fighter_settings:0 "Fighter Visuals and Faction Settings"
 foc_khan_settings.13.fleet_scale:0 "2. Set Fleet Scale"
 foc_khan_settings.13.story_timeline:0 "3. Set Story Start Time"
 foc_khan_settings.13.confirm:0 "Confirm Settings"
 foc_khan_settings.13.close_default:0 "§GClose and use defaults§! (Intermediate / Large / All fighters / Original size / Story starts in 2200)"
 foc_khan_settings.15.name:0 "Story Timeline Start"
 foc_khan_settings.15.desc:0 "Choose when the §HStar Wars story for the current origin route§! begins. The Republic origin releases Naboo at the selected year and shifts its Republic-to-Empire-to-Rebellion-to-New-Republic-to-Order chain with it. Ordinary origins hold the New Republic/Imperial Remnant story and later First Order succession until that year. The First Order origin keeps its game-start relocation and core technology, but unresolved Bloodline, Resistance, Starkiller and Kylo beats begin from the selected year.\n\n§Y2200 is the default; 2250, 2300 and 2400 delay the route by 50, 100 and 200 years respectively.§!"
 foc_khan_settings.15.y2200:0 "§GTrigger in 2200 (Default)§!"
 foc_khan_settings.15.y2250:0 "Trigger in 2250"
 foc_khan_settings.15.y2300:0 "Trigger in 2300"
 foc_khan_settings.15.y2400:0 "Trigger in 2400"

