 preset_fop_imperial_scion:0 "Imperial Legacy Succession"
 preset_fop_imperial_scion_desc:0 "The First Order grows under the patronage of the Imperial Remnant until the successor is strong enough to eclipse its forebears."
 fop_origin.11.name:0 "Heir to the Imperial Legacy"
 fop_origin.11.desc:0 "Bastion recognizes the First Order as the next bearer of the Imperial cause, opening old routes and supporting the young successor from the shadows."
