l_english:
 foc_khan_vanilla_balance_country_combat:0 "Restricted Readiness"
 foc_khan_vanilla_balance_country_combat_desc:0 "The fleet fights within conventional galactic standards for energy, ammunition, and logistics."
 foc_khan_vanilla_balance_standard_ship:0 "Conventional Readiness"
 foc_khan_vanilla_balance_standard_ship_desc:0 "Reactor output and defensive reserves are rationed for a prolonged galactic campaign."
 foc_khan_vanilla_balance_heavy_ship:0 "Heavy Hull Readiness Limits"
 foc_khan_vanilla_balance_heavy_ship_desc:0 "Much of this enormous hull is devoted to life support, propulsion, and expeditionary supply, limiting its direct combat output."
 foc_khan_vanilla_balance_xyston:0 "Xyston Restricted Readiness"
 foc_khan_vanilla_balance_xyston_desc:0 "The Xyston axial superlaser, armor reserves, and shield output are constrained by Exegol supply limits."
 foc_khan_vanilla_balance_supercapital:0 "Supercapital Readiness Limits"
 foc_khan_vanilla_balance_supercapital_desc:0 "This supercapital has not entered total mobilization, and its arsenal and defenses operate at restricted output."
 foc_khan_vanilla_balance_ultracapital:0 "Flagship Readiness Limits"
 foc_khan_vanilla_balance_ultracapital_desc:0 "The immense hull must power command, shipyard, and logistical facilities rather than devote all energy to weapons and shields."
 foc_khan_vanilla_balance_player_supremacy:0 "Supremacy Restricted Readiness"
 foc_khan_vanilla_balance_player_supremacy_desc:0 "The Supremacy serves as a mobile capital and arkship, with much of its power committed to population, shipyards, and command infrastructure."
 foc_khan_vanilla_balance_supremacy_speed:0 "Supremacy Strategic Speed"
 foc_khan_vanilla_balance_supremacy_speed_desc:0 "The massive mobile capital remains deliberately slow."
 foc_khan_vanilla_balance_starkiller_world:0 "Starkiller Restricted Readiness"
 foc_khan_vanilla_balance_starkiller_world_desc:0 "The base has not entered doomsday readiness; garrisons, shields, and surface batteries remain at fortress-world strength."
 foc_khan_vanilla_balance_arkship:0 "Arkship Expeditionary Configuration"
 foc_khan_vanilla_balance_arkship_desc:0 "Arkships reserve most of their power for colonies, laboratories, and shipyards, preventing them from fighting as pure warships."
