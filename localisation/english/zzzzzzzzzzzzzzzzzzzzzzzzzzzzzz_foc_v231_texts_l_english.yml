 building_foc_v231_droid_foundry:0 "Droid Foundry"
 building_foc_v231_droid_foundry_desc:0 "An automated assembly complex turning out droid units in continuous production. Every major power maintains one on its seat of government, and the pattern rolling off the line says a great deal about who is giving the orders."

 NAME_FOC_V231_HOME_ONE:0 "Home One"
 foc_v231_home_one_arkship_level_tooltip:0 "Home One"
 foc_v231_home_one_strike_command_module_tt:0 "§HHome One Fighter Command§!\n\nThe fixed axial command deck. It coordinates the Alliance's strike wings across an entire theatre and cannot be removed or replaced."

 trait_robot_battledroid:0 "Battle Droid"
 trait_robot_battledroid_desc:0 "A class IV droid built for war and nothing else. Individually fragile and barely capable of learning from a battle it survives, but assembled faster and more cheaply than any organic soldier could ever be trained."
 trait_robot_tacticaldroid:0 "Tactical Droid"
 trait_robot_tacticaldroid_desc:0 "A command-pattern droid built to direct armies where organic leadership is unavailable. It processes battlefield data continuously and recalculates odds faster than any staff officer, at a correspondingly steep upkeep."
