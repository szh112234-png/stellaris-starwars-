l_english:
 foc_supremacy_duel.2.name:0 "§HThe Holdo Maneuver§!"
 foc_supremacy_duel.2.desc:0 "The Supremacy and the Raddus finally exchange fire in the same battlespace. In the middle of the engagement, the Raddus turns and jumps to hyperspace.\n\nA brilliant hyperspace trail tears through the Supremacy, destroying both capital ships almost simultaneously.\n\n§YThe Supremacy and the Raddus have both been destroyed.§!"
 foc_supremacy_duel.2.a:0 "That maneuver seems strangely familiar."
