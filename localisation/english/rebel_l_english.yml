 #####################################
 # CIVICS
 #####################################
 
 civic_rebel_alliance: "Rebel Alliance"
 civic_rebel_alliance_desc: "A loose alliance of various systems and insurrectionist factions all working together for a common cause. Due to their nomadic nature, they are smaller than typical empires, but are more accustomed to fighting as underdogs."  
 
 #####################################
 # Namelists
 #####################################  
 
 name_list_rebels: "Rebel Alliance"
 
 ##############
 # Chandrila
 ##############
 
 hanna_city: "Hanna City"
 hanna_city_desc: "The capital city of Chandrila is major center of tourism and trade containing local art galleries, opera houses, and large public rotundas for political discourse. The planet itself is also a lush world with calm weather and natural beauty."   
 
 ##############
 # YAVIN IV
 ##############
 
 yavin_system_NAME: "Yavin System"
 yavin_system_DESC: "Start on Yavin IV, one of the moons of the gas giant Yavin. Dac, the homeworld of the Mon Calamari is also included as a neighbor system"
 
 building_massassi_great_temple: "Massassi Temple"
 building_massassi_great_temple_desc: "A massive structure built by the Massassi civilization, a race that worshiped the ancient Sith Lord Exar Kun on the moon. The structure is now home to an Alliance base." 
 
 building_jedi_praxeum: "Jedi Praxeum"
 building_jedi_praxeum_desc: "Once the headquarters of the Rebel Alliance, now converted into a Jedi Academy by Luke to train the next generation of Jedi Knights."
 
 massassi_temples: "Massassi Temples"
 massassi_temples_desc: "Ancient structures left behind by the Massassi, a primitive civilization that served the Old Sith Empire. These structures may still possess ancient and valuable artifacts."
 
 alliance_hq: "Alliance High Command"
 alliance_hq_desc: "Alliance High Command is stationed here to coordinate the war-effort for Alliance cells across the galaxy."
 
 ##############
 # Hoth
 ##############
 
 hoth_system_NAME: "Hoth System"
 hoth_system_DESC: "Start in the Hoth System; the location of the secret Rebel Alliance base." 
 
 echo_base: "Echo Base"
 echo_base_desc: "The remote planet of Hoth was an ideal location to establish a base of operations. The base itself is cared out of a glacier and serves as the Alliance's headquarters after the evacuation of Yavin IV."
 
 frozen_wasteland: "Frozen Wasteland"
 frozen_wasteland_desc: "The surface of Hoth is a near-uninhabitable icy wasteland filled jagged cliffs, desolate ice plains, and deadly blizzards. The indigenous predators known as Wampa are a dangerous hazard when venturing out into the remote areas of the planet."
 
 building_hothioncannon: "v-150 Planet Defender"
 building_hothioncannon_desc: "A surface-to-orbit ion cannon that was installed in Echo Base to protect the planet."
 
 ############
 # Coruscant
 ############
 
 new_republic_init_NAME: "New Republic Systems"
 new_republic_init_DESC: "Start in the Coruscant System; the New Republic capital in addition to Yavin IV and Dac (Mon Calamari) as neighbor planets."
 
 queen_of_the_core: "Queen of the Core"
 queen_of_the_core_desc: "Located at the intersection of numerous hyperlanes and with a population estimated at 3 trillion, Coruscant is one of the most influential planets in the Galaxy."
 
 coruscant_underworld: "Coruscant's Underworld"
 coruscant_underworld_desc: "Coruscant's underworld is located a kilometer below the massive skyscrapers on the surface. The lower the level, the more dangerous and crime-ridden it becomes."
 
 centax_infrastructure: "Centax Infrastructure"
 centax_infrastructure_desc: "Although the Centax moons of Coruscant are naturally sterile, thousands of years of development have created an extensive array of habitable structures and mining facilities."   
 
 centax_correctional: "Penal World"
 centax_correctional_desc: "The tranquil mines of Centax-1 Maximum Correctional Facilities are a haven set aside for the ill-fated of Coruscant."
 
 new_republic_capital: "New Republic Capital"
 new_republic_capital_desc: "After a grueling struggle with the Empire, the New Republic has claimed Coruscant as their capital. Known to many as the center of the galaxy, Coruscant is a bustling ecumenopolis and the heart of galactic commerce."  
 
 building_newrepublicsenate: "New Republic Senate Building"
 building_newrepublicsenate_desc: "Located within the old Imperial Senate building, the New Republic Senate is filled with thousands of senators from across the galaxy."
 
 
 ############
 # Mon Cala
 ############
 
 mon_cala_system_NAME: "Calamari System"
 mon_cala_system_DESC: "Start on the planet Dac (Calamari); the homeworld of the Mon Calamari and Quarren." 
 
 mon_cala_shipyards: "Mon Cala Shipyards"
 mon_cala_shipyards_desc: "A major shipbuilding company, Mon Calamari Shipyards were renowned for their elegant, streamlined ship designs that favored organic hulls, unique engineering, and a focus on exploration and luxury liners. They also have the capacity to build powerful warships that were used by both the Rebel Alliance and New Republic in their war against the Empire."
 
 coral_city: "Coral City"
 coral_city_desc: "The capital city of Dac and the center of commerce for the planet. Part of the city is visible on the surface of Mon Cala, the other half, known as the Coral Depths is submerged underwater."
 
 ##########
 # Planets
 ##########
 
 hosnian_init_NAME: "Hosnian System"
 hosnian_init_DESC: "Start on Hosnian Prime; the capital of the New Republic."
 
 pc_coruscant_tile: "Galactic City"
 pc_coruscant_tile_desc: "Endless sprawl in all directions provides habitation for all known species."
 pc_coruscant: "Capital Planet"
 pc_coruscant_desc: "This city planet serves as the capital for many sentients of the galaxy."
 coruscant: "Capital Planet"
 coruscant_desc: "This city planet serves as the capital for many sentients of the galaxy."
 pc_centax_tile: "Underground Facility"
 pc_centax_tile_desc: "The surface of this planet may be sterile, but in the tunnels below there is life."
 pc_centax: "Barren World"
 pc_centax_desc: "Barren and rocky world with a thin or non-existent atmosphere. The surface is covered in meteor impact craters and completely devoid of life."
 centax: "Barren World"
 centax_desc: "Barren and rocky world with a thin or non-existent atmosphere. The surface is covered in meteor impact craters and completely devoid of life."
 
 
 ##########
 # ARMIES 
 ##########
 
 rebel_alliance_army: "Alliance Army"
 rebel_alliance_army_desc: "An assortment of ground forces of varying skill and training united under a single banner. These forces are aimed at tying down and harassing an enemy force rather than meeting that enemy in open battle."
 
 rebel_alliance_special_forces: "Alliance Special Forces"
 rebel_alliance_special_forces_desc: "Elite Alliance soldiers and commandos used for the purpose of infiltration and subterfuge."
 
 rebel_alliance_t2b_tanks: "T-2B Repulsor Tanks"
 rebel_alliance_t2b_tanks_desc: "Armored light repulsorcraft scout vehicle equipped with shields and armed with quad light blaster cannons for hit-and-run attacks."
 
 rebel_alliance_t4b_tanks: "T-4B Heavy Tanks"
 rebel_alliance_t4b_tanks_desc: "Heavily armored all-purpose battle tanks armed with heavy laser cannons and concussion missile launchers."
 
 rebel_alliance_mptl2a_artillery: "MPTL-2a Artillery Platform"
 rebel_alliance_mptl2a_artillery_desc: "Mobile Proton Torpedo Launcher crawler artillery platforms used to fire a volley of proton torpedoes from its armored shell."
 
 rebel_alliance_t47_airspeeder_squadron: "T-47 Airspeeder Squadron"
 rebel_alliance_t47_airspeeder_squadron_desc: "Incom Corporation airspeeders modified by the Alliance with two double laser canons and a light repeating blaster cannon used for reconnaissance and hit-and-run attacks."
 
 rebel_alliance_xwing_squadron: "T-65 X-Wing Starfighter Squadron"
 rebel_alliance_xwing_squadron_desc: "Powerful Alliance all-purpose fighters known for its versatility and exceptional combat performance. Armed with 4 Taim & Bak KX9 laser cannons and a two proton torpedo launchers for attacking armored targets."
 
 rebel_alliance_ywing_squadron: "BTL Y-Wing Bomber Squadron"
 rebel_alliance_ywing_squadron_desc: "Repurposed armored republic fighter-bombers armed with two laser cannons, ion cannon turrets, proton torpedo launchers and a proton bomb chute used to bomb heavily-armored targets."
 
 
 
 
 
 
 
