 foc_canon.53.name:0 "Fulcrum: Ahsoka Returns"
 foc_canon.53.desc:0 "The Rebel Alliance has grown from scattered cells into an open resistance to the Empire. A survivor who once walked away from the Jedi Order has reappeared on its clandestine communications network.\n\n§HAhsoka Tano§! joins the Rebellion under the codename Fulcrum. She no longer speaks for the Jedi Council; this war is her own choice.\n\n§YAhsoka joins the Rebel leader pool as a real commander.§!"
