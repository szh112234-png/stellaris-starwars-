l_english:
 foc_canon.ok:0 "Continue."
 foc_canon.10.name:0 "Mortis: Prophecy of the Chosen One"
 foc_canon.10.desc:0 "Anakin, Obi-Wan and Ahsoka are drawn into Mortis, where the Father, Daughter and Son embody a struggle within the Force itself. The vision leaves Anakin with a warning about the future he may yet create."
 foc_canon.11.name:0 "Mandalore: The Shadow Collective"
 foc_canon.11.desc:0 "the restored Darth Maul unites criminal syndicates, seizes Mandalore and murders Duchess Satine before Obi-Wan. A neutral world is dragged back into galactic war."
 foc_canon.12.name:0 "The Chip and the Inquisitorius"
 foc_canon.12.desc:0 "a clone inhibitor chip malfunctions early and exposes a hidden command buried in the Grand Army. At the same time, the foundations of the future Imperial Inquisitorius are laid in secret."
 foc_canon.13.name:0 "Bombing of the Jedi Temple"
 foc_canon.13.desc:0 "Barriss Offee frames Ahsoka Tano for the Temple bombing. Even after the truth emerges, Ahsoka refuses the Council's invitation to return and leaves the Jedi Order."
 foc_canon.14.name:0 "Yoda: The Path Beyond Death"
 foc_canon.14.desc:0 "guided by Qui-Gon's spirit, Yoda completes the trials that teach him how consciousness may endure after death. The Jedi are preparing for a war they do not yet understand."
 foc_canon.20.name:0 "The Bad Batch"
 foc_canon.20.desc:0 "Clone Force 99 rejects the new Empire's total obedience, escapes with Omega, and the Kaminoan clone establishment is destroyed as the Empire turns toward mass conscription."
 foc_canon.21.name:0 "Corellia: A Young Han Solo"
 foc_canon.21.desc:0 "A young Han Solo escapes Corellia and becomes a smuggler beneath the shadow of the Empire. He meets Chewbacca, wins the §HMillennium Falcon§! from Lando Calrissian, and makes the reckless Kessel Run later immortalized as “twelve parsecs.”\n\nFor now Han only wants to survive. He has no idea he will become one of the Rebellion’s most famous heroes."
 foc_canon.22.name:0 "Bracca: Fallen Jedi"
 foc_canon.22.desc:0 "Jedi Padawan §HCal Kestis§!, hiding in the Bracca scrapyards, exposes himself to save a friend. The pursuit leads him toward a holocron identifying Force-sensitive children and eventually into the Imperial Inquisitor fortress.\n\nCal destroys the holocron himself. While the Empire hunts Jedi, knowing where those children are is not hope—it is a death list."
 foc_canon.23.name:0 "Leia Rescued, Obi-Wan Sacrifices Himself"
 foc_canon.23.desc:0 "The hope carried from Scarif has reached the rescue team. Luke and his companions enter Imperial custody facilities and free §HLeia Organa§!. During their escape, §HObi-Wan Kenobi§! faces Darth Vader alone to buy them time.\n\nObi-Wan gives his life. He leaves active command, but continues to guide Luke through the Force as a Jedi spirit.\n\nConfirming the operation delivers the complete plans to Rebel command: Rebel weapons gain §H+50% shield damage§!, with a Death Star I attack solution active in its system. Leia formally joins the command structure through her own wartime story; Mon Mothma remains the Rebellion leader."
 foc_canon.24.name:0 "Tanalorr: Beyond the Hidden Path"
 foc_canon.24.desc:0 "Cal Kestis finds §HTanalorr§!, hidden beyond dangerous hyperspace anomalies. The isolated world offers the Hidden Path’s refugees and surviving Jedi a place the Empire may never be able to reach."
 foc_canon.25.name:0 "The Aldhani Heist"
 foc_canon.25.desc:0 "Cassian Andor is recruited by Luthen Rael for the raid on the Imperial payroll vault at Aldhani. The Empire treats the heist as a public humiliation and responds with the §HPublic Order Resentencing Directive§!.\n\nRepression intensifies, and isolated resistance groups increasingly realize they are fighting the same enemy."
 foc_canon.26.name:0 "Tatooine: The Last Grudge"
 foc_canon.26.desc:0 "Maul finds Obi-Wan on Tatooine. Their final duel is brief; dying, Maul understands that Kenobi is protecting someone who may yet end the Sith."
 foc_canon.27.name:0 "A Small Light"
 foc_canon.27.desc:0 "Hera Syndulla gives birth to Jacen, her son with Kanan Jarrus. The Force has not vanished with the Jedi Temple."
 foc_canon.30.name:0 "The Restoration of Mandalore"
 foc_canon.30.desc:0 "Din Djarin, Bo-Katan and the reunited clans retake Mandalore and destroy Moff Gideon's power base. Grogu returns to Din, while Boba Fett establishes his own rule on Tatooine."
 foc_canon.31.name:0 "Ilum Project: Starkiller Construction"
 foc_canon.31.desc:0 "The First Order seals Ilum and begins turning the entire kyber-rich world into a weapon capable of draining stellar energy. The project diverts alloy output and shipyard capacity away from the conventional fleet until construction is complete. The galaxy will later know the weapon as Starkiller Base."
 foc_canon.40.name:0 "Battle of Christophsis"
 foc_canon.40.desc:0 "§HChristophsis§! has fully passed out of Confederate control. During the campaign, Ahsoka Tano is formally assigned to Anakin Skywalker as his Padawan.\n\n§YThe Battle of Christophsis is complete and records an independent battle anchor.§!"
 foc_canon.41.name:0 "Siege of Mandalore"
 foc_canon.41.desc:0 "The Confederacy has completely lost control of the §HMandalore§! system. Ahsoka and the 332nd have broken Maul’s hold over the world.\n\n§YThe Siege of Mandalore is complete and records an independent battle anchor.§!"
 foc_canon.42.name:0 "Tragedy on Malachor"
 foc_canon.42.desc:0 "Ahsoka follows the Rebel mission to §HMalachor§! and confronts Darth Vader in the ancient Sith ruins. Kanan loses his sight, while Ahsoka stays behind and later vanishes from the Rebellion.\n\nThis is a narrative event, not a territorial battle anchor."
 foc_canon.43.name:0 "Liberation of Lothal"
 foc_canon.43.desc:0 "The Empire has completely lost control of §HLothal§!. Kanan Jarrus gives his life for his companions, and Ezra Bridger calls the purrgil to carry Thrawn and the Chimaera into the unknown.\n\n§YThe Liberation of Lothal is complete and records an independent battle anchor.§!"
 foc_canon.44.name:0 "Battle of Scarif"
 foc_canon.44.desc:0 "The Empire has completely lost control of §HScarif§!. Rebel infiltrators transmit the Death Star plans while the orbital blockade breaks apart.\n\nThe victory is costly, but the plans are out."
 foc_canon.45.name:0 "Battle of Yavin"
 foc_canon.45.desc:0 "§HDeath Star I has been destroyed.§! The battlestation's destruction is recorded as victory in the Battle of Yavin.\n\n§HGrand Moff Wilhuff Tarkin§! refuses evacuation and dies with the station. The Empire has lost its instrument of galactic terror, and the Rebellion has paid heavily for this victory."
 foc_canon.46.name:0 "Battle of Hoth"
 foc_canon.46.desc:0 "The Rebellion has §Hcompletely lost control of the Hoth system§!. Echo Base has been evacuated and the surviving fleet has broken into deep space.\n\nThe Empire takes Hoth, but not the Rebellion."
 foc_canon.47.name:0 "Battle of Endor"
 foc_canon.47.desc:0 "The Empire has completely lost control of the §HEndor§! system. The second Death Star and the Imperial command structure collapse in the same campaign.\n\n§YThe Battle of Endor is complete and records an independent battle anchor.§!"
 foc_canon.48.name:0 "Night of a Thousand Tears"
 foc_canon.48.desc:0 "The Imperial purge of §HMandalore§! has been completed. The bombardment is not meant to occupy the world, but to destroy the material basis of Mandalorian resistance.\n\nSurvivors remember it as the §HNight of a Thousand Tears§!."
 foc_canon.49.name:0 "Battle of Jakku"
 foc_canon.49.desc:0 "The Galactic Empire and its remnants have §Hcompletely lost control of Jakku§!. The last great fleet battle there ends Imperial ability to organize the war from the system.\n\n§YThe Battle of Jakku is complete and records an independent battle anchor.§!"
 foc_canon.50.name:0 "Evacuation of D'Qar"
 foc_canon.50.desc:0 "The Resistance once held §HD’Qar§!, but has now completely lost control of the system. With orbital control gone, the fixed base is abandoned and command shifts aboard the Raddus."
 foc_canon.51.name:0 "Battle of Crait"
 foc_canon.51.desc:0 "The Resistance once held §HCrait§!, but has now completely lost control of the system. Luke Skywalker uses a projection across the galaxy to hold the pursuers long enough for survivors to escape."
 foc_canon.52.name:0 "Battle of Exegol"
 foc_canon.52.desc:0 "The final battle has begun over §HExegol§!. The Final Order rises while civilian ships, smugglers and veterans pour into the system along the only navigable route."
 foc_canon.28.name:0 "Tatooine: Escape from the Sarlacc"
 foc_canon.28.desc:0 "Luke Skywalker returns to Tatooine to rescue Han Solo. Jabba’s criminal court is destroyed at the Great Pit of Carkoon, while Boba Fett survives his fall into the sarlacc.\n\nAt nearly the same time, Master Yoda reaches the end of his nine-hundred-year life on Dagobah. Luke loses the last teacher of the old Jedi and must face Vader and the Emperor on his own."
 foc_canon.29.name:0 "Operation Cinder"
 foc_canon.29.desc:0 "Imperial forces still loyal to the dead Emperor begin executing §HOperation Cinder§!. Orbital bombardment and scorched-earth orders are not meant to reconquer the galaxy, but to punish an Empire that “failed to protect its Emperor.”\n\nAmid the chaos, the New Republic is proclaimed while some of the Empire’s most elite formations begin withdrawing toward the Unknown Regions."
 foc_canon.32.name:0 "Exegol: The Sith Ember"
 foc_canon.32.desc:0 "The Galactic Concordance does not truly end the Sith. On Exegol, Sith Eternal cultists use cloning and genetic engineering to assemble a broken new body for Palpatine while hidden shipyards begin laying down an immense secret fleet.\n\nIn the same year the Empire publicly surrenders, the seeds of the §HFirst Order§! and the §HFinal Order§! take root in the Unknown Regions."
 foc_canon.15.name:0 "Birth of the Red Blade"
 foc_canon.15.desc:0 "Darth Vader hunts a Jedi survivor on Al’doleem, takes the fallen Jedi’s kyber crystal, and forces it to “bleed” through rage and pain in a Sith rite.\n\nFrom this moment, the brilliant §Rred lightsaber§! becomes one of the Empire’s most feared symbols."
 foc_canon.33.name:0 "Thrawn Returns"
 foc_canon.33.desc:0 "Ahsoka Tano and Sabine Wren cross the stars searching for the long-lost Ezra Bridger. Ezra is recovered—but §HGrand Admiral Thrawn§! also returns to the galaxy with the aid of the Nightsisters, seeking to rally the Imperial remnant.\n\nNew Republic leaders dismiss the warnings as alarmism. A strategic threat that should shake the galaxy is treated as border noise by a peacetime bureaucracy."
 foc_canon.39.name:0 "Battle of Geonosis"
 foc_canon.39.desc:0 "§HGeonosis§! has fully passed out of Confederate control. The Republic now controls the system, closing the first great clash between clone and droid armies.\n\n§YThe Battle of Geonosis is complete and records an independent battle anchor.§!"
 foc_canon.16.name:0 "Mustafar Purge: The Separatist End"
 foc_canon.16.desc:0 "After Order 66, Vader reaches §HMustafar§!. The Confederate military has already stood down, but the Separatist Council still uses the system as its final refuge.\n\nVader purges the Council and shuts down the remaining droid command network. Republic forces then take full control of Mustafar, and the surviving Confederacy is formally destroyed."
 foc_canon.34.name:0 "The Destruction of Alderaan"
 foc_canon.34.desc:0 "The plans from Scarif are still passing between couriers, and Leia is now in Imperial custody. Tarkin targets §HAlderaan§! with Death Star I, intending to trade her homeworld for the location of the Rebel base.\n\nAs long as the battlestation can still fire, the next order will destroy an entire world. The Rebels must rescue Leia and deliver the full intelligence before completing their attack solution."
