 foc_v1718k_secret_resource_collection_desc:0 "The First Order maintains covert procurement and transport routes in the Unknown Regions to supply its fleet and the Starkiller project.\n\nFixed monthly deliveries:\n£sr_tibanna_swgs£ Tibanna Gas: §G+100§!\n£sr_coaxium_foc£ Coaxium: §G+100§!\n\n§YThis modifier and both deliveries end after the first actual completion of Starkiller Base.§! A construction site, blueprint or ongoing upgrade does not count as completion.\n\nResources are credited by a monthly event and may not appear as regular monthly income. Loading a save gives no extra resources or retroactive payments."
