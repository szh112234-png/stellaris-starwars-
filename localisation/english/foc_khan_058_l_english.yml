l_english:
 foc_khan.1602.name:0 "The Starkiller Ultimatum"
 foc_khan.1602.desc:0 "The completion of our Starkiller Base has made coexistence with the First Order and the Final Order impossible. Our former overlord can no longer restrain us. Both Orders have designated our empire their highest-priority target, and their fleets are already changing course toward our territory."
 foc_khan.1602.a:0 "Then we will meet them in battle."
 myk_starkiller_requires_full_system_control:0 "§RThe Starkiller Base system must be fully controlled by us before charging can begin.§!"
 foc_khan.1604.name:0 "Starkiller Base Seized"
 foc_khan.1604.desc:0 "Our ground forces have occupied the Starkiller Base planet and seized control of the weapon. The former owner has lost access to the base. The First Order and Final Order now regard us as their highest-priority enemy, and we cannot remain a subject of another empire."
 foc_khan.1604.a:0 "The weapon is ours."
