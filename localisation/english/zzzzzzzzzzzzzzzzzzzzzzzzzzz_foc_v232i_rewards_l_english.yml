l_english:
 foc_v232i_conquest_reward_name:0 "Support from a New System"
 foc_v232i_conquest_reward_desc:0 "A newly controlled inhabited system has joined the Imperial Rebellion. Its shipyards and reserves can supply a battle group, or provide the equivalent alloy budget and join the fleet supply network.\n\n§YChoose: 20 MC80 cruisers, or 29,800 alloys and another −5% ship upkeep.§!\nThe alloy reward equals 20 times the reward MC80 design’s base alloy cost: 1,490 per ship, including hull and equipment, before national discounts. Each eligible system pays once."
 foc_v232i_conquest_reward_queue_desc:0 "$foc_v232i_conquest_reward_desc$\n\nPending rewards: §Y[Root.foc_v232i_pending_conquest_rewards]§! (including this one). This choice settles one reward; the next is processed afterwards."
 foc_v232i_conquest_reward_fleet:0 "Receive a fleet of 20 MC80 cruisers."
 foc_v232i_conquest_reward_resources:0 "Receive 29,800 alloys and another −5% ship upkeep."
 foc_v232i_liberated_system_logistics:0 "Liberated-System Fleet Logistics"
 foc_v232i_liberated_system_logistics_desc:0 "Each resource reward adds −5 percentage points of ship upkeep: −5%, −10%, −15%, and so on. The existing Rebel-era retirement rule is preserved: this bonus is cleared at the Galactic Concordance."
 mod_commander_skill_levels:0 "Commander Maximum Skill Level"
