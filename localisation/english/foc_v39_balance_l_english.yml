l_english:
 foc_republic_origin_rebellion_war_effort: "Rebel Wartime Logistics (Legacy)"
 foc_republic_origin_rebellion_war_effort_desc: "Legacy Rebel logistics compatibility modifier. It no longer grants blanket combat multipliers."
 foc_republic_origin_rebellion_player_logistics: "Rebel: Intermediate (No Extra Bonus)"
 foc_republic_origin_rebellion_player_logistics_desc: "Intermediate is the baseline tier and grants player Rebels no difficulty-specific combat or logistics bonus."
 foc_republic_origin_rebellion_player_logistics_lowest: "Rebel Wartime Logistics: Vanilla"
 foc_republic_origin_rebellion_player_logistics_lowest_desc: "Limited player-Rebel logistics on Vanilla difficulty so the Galactic Civil War does not begin with the Empire already outclassed."
 foc_republic_origin_rebellion_player_logistics_madness: "Rebel Wartime Logistics: ACOT"
 foc_republic_origin_rebellion_player_logistics_madness_desc: "Higher logistics capacity against the strengthened ACOT-tier AI Empire, without direct player combat multipliers."
 foc_republic_origin_rebellion_ai_lowest: "AI Rebel Support: Vanilla"
 foc_republic_origin_rebellion_ai_lowest_desc: "Vanilla-tier AI Rebels receive logistics support only."
 foc_republic_origin_rebellion_ai_intermediate: "AI Rebels: Intermediate (No Extra Bonus)"
 foc_republic_origin_rebellion_ai_intermediate_desc: "Intermediate is the baseline tier and grants AI Rebels no additional combat or logistics bonus."
 foc_republic_origin_rebellion_ai_madness: "AI Rebel Support: ACOT"
 foc_republic_origin_rebellion_ai_madness_desc: "ACOT-tier AI Rebels receive strong support while remaining far below the First/Final Order crisis multipliers."
 foc_republic_origin_empire_ai_lowest: "AI Galactic Empire: Vanilla"
 foc_republic_origin_empire_ai_lowest_desc: "No additional combat multiplier is granted to the Galactic Empire on Vanilla difficulty."
 foc_republic_origin_empire_ai_intermediate: "AI Galactic Empire: Intermediate (No Extra Bonus)"
 foc_republic_origin_empire_ai_intermediate_desc: "Intermediate is the baseline tier and grants the AI Galactic Empire no additional combat bonus."
 foc_republic_origin_empire_ai_madness: "AI Galactic Empire: ACOT"
 foc_republic_origin_empire_ai_madness_desc: "The AI Galactic Empire is substantially strengthened on ACOT difficulty; player Rebels do not inherit a matching blanket combat multiplier."
