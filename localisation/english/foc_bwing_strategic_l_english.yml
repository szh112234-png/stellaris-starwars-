 SSP_BWING_REMOTE:0 "Rebel B-wing Bomber Squadron (12 craft | BALANCED | 1x)"
 SSP_BWING_REMOTE_DESC:0 "12 craft per squadron. Base aggregate damage per firing cycle: 3000 (about 250.0000 per craft), NOT per-craft damage or DPS.\nTotal hull 4800, armor 2400, shields 2400, divided among the craft. Bomber: red bolts; 3x armor damage, 0.5x shield damage; no armor/shield bypass.\nVisual size does not multiply count or combat stats. Country, ship, technology and fire-rate bonuses apply separately. Use distinct hangar numbers on the same carrier for strategic dispatch."
