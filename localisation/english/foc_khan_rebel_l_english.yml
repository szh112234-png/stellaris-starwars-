l_english:
 FOC_KHAN_REBEL_ALLIANCE:0 "Rebel Alliance"
 FOC_KHAN_REBEL_SPECIES:0 "Human"
 FOC_KHAN_REBEL_SPECIES_PLURAL:0 "Humans"
 FOC_KHAN_REBEL_FLEET:0 "Rebel Expeditionary Fleet"
 foc_khan_rebel.10.name:0 "A Spark of Rebellion"
 foc_khan_rebel.10.desc:0 "The First Order crisis has engulfed the galaxy, but resistance has not ended. A new Rebel Alliance has established a hidden base in the D'Qar system near Jakku and is prepared to regroup at Crait and Ajan Kloss as the war changes. Joining will immediately end our subject status and place us alongside the Alliance against the First Order and the Final Order. The Rebels promise neutrality toward all other states."
 foc_khan_rebel.10.a:0 "We will join the Rebel Alliance."
 foc_khan_rebel.10.b:0 "We remain loyal to the Order."
 foc_khan_rebel.42.name:0 "The Battle of D'Qar"
 foc_khan_rebel.42.desc:0 "The defences of the D'Qar system have been breached. Enemy forces crossed the outer asteroid field, shattered the orbital screen and forced the Resistance to abandon its forest hangars. Most survivors escaped at the last moment and will regroup at Crait once Starkiller Base no longer threatens the route. Resistance did not end at D'Qar."
 foc_khan_rebel.42.a:0 "They must keep fighting."
