l_english:
 foc_rebel_growth.2.name:0 "The Spoils of a New System"
 foc_rebel_growth.2.desc:0 "A newly controlled inhabited system has joined the Imperial Rebellion. Its shipyards and reserves can supply a battle group, or provide the equivalent alloy budget and join the fleet supply network.\n\n§YChoose: 20 MC80 cruisers, or 29,800 alloys and another −5% ship upkeep.§!\nThe alloy reward equals 20 times the reward MC80 design’s base alloy cost: 1,490 per ship, including hull and equipment, before national discounts. Each eligible system pays once."
 foc_rebel_growth.2.a:0 "Commission a 20-MC80 fleet now."
 foc_rebel_growth.2.b:0 "Receive 29,800 alloys and expand fleet logistics (ship upkeep −5%, stacking)."
 foc_gcw.32.name:0 "Sustain a Frontier Resistance"
 foc_gcw.32.desc:0 "A planet on the Imperial frontier is willing to build a lasting underground organization, but safe houses, weapons, identities, and encrypted communications do not appear from nothing. Continued yearly support will advance the local movement from a secret cell to an underground network and finally an open uprising led by the planet itself.\n\nOnly one target is sustained at a time. Only a mobile Imperial combat fleet suppresses uprising activity; starbases, defence platforms, science ships, construction ships, colony ships, and transports do not count as a garrison fleet. Obtaining a Death Star permanently closes this special support channel."
 foc_gcw.32.a:0 "Commit 2,000 energy, 1,000 alloys, and 500 unity."
 foc_gcw.32.b:0 "Provide no support this year."
 operation_foc_gcw_instigate_system_uprising_desc:0 "§ROnly targets the Galactic Empire.§!\n\nChoose an Imperial colony system without a mobile Imperial combat fleet and outside its local suppression cooldown. Establish resistance cells, expand the underground network, arm it, and launch a local uprising. The revolt is resolved by the Empire's normal response event rather than directly handing over the system.\n\n§YThis operation is repeatable, not once per campaign.§! Each attempt still requires 10 spy-network power and 180 influence, with 12 monthly energy upkeep. Once the previous operation is completed or cancelled, another eligible target may be selected. The existing shared target-selection process reserves one such operation at a time.\n\nOnly mobile Imperial combat fleets block or interrupt it; starbases, platforms, science ships, constructors, colony ships and transports do not."
 foc_gcw_active.40.desc:0 "Everything is ready. The underground in §Y[event_target:foc_gcw_active_uprising_target_system.GetName]§! is waiting for the final coded signal. Once sent, the local planet will launch an open uprising. The Empire may still commit resources to suppress it; the operation itself no longer hands the system directly to the Rebels."
 FOC_V202_DEATH_STAR_PROJECT_EMERGENCY:0 "Death Star I Emergency Program"
 FOC_V202_DEATH_STAR_PROJECT_EMERGENCY_DESC:0 "Total Imperial Rebel fleet power has exceeded the Empire's. This one-shot emergency program requires one quarter of the normal Death Star I engineering workload: §Y15,000§!."
 FOC_V202_DEATH_STAR_II_PROJECT_EMERGENCY:0 "Emergency Death Star II Construction"
 FOC_V202_DEATH_STAR_II_PROJECT_EMERGENCY_DESC:0 "Accelerate construction of the second Death Star at Endor. Completion triggers Bothan intelligence and deploys the immobile station. Mobile refitting remains a separate player project."