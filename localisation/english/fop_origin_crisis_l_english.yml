l_english:
 ap_fop_new_order_crisis:0 "Galactic New Order"
 ap_fop_new_order_crisis_desc:0 "The First Order will no longer wait for the galaxy to acknowledge its rule. Starkiller Base shall be its throne and the Imperial Remnant its legions."
 ap_fop_new_order_crisis_effect_tooltip:0 "§YFirst Order origin exclusive ascension perk§!\nAutomatically granted when Starkiller Base is completed. Annex the Imperial Remnant, become a controllable crisis, and trigger one galactic anti-crisis total war containing every normal and Fallen Empire. Complete five ambition stages to enslave the Force and ascend as a cosmic god."
 fop_ap_requires_completed_starkiller:0 "Requires a completed §YStarkiller Base§!"

 origin_fop_first_order_effects:0 "Begins directly in isolated Ilum beyond Jakku, just outside the main galactic rim, and unlocks the Ilum-Jakku Imperial Remnant gate. The normal First Order crisis is replaced by the player path. Completing Starkiller Base automatically grants the exclusive §YGalactic New Order§! ascension perk.\nStarts with basic turbolasers, mass drivers, concussion missiles and point defense. Advanced weapon technologies are not granted merely for choosing this origin."

 NAME_FOP_ABANDONED_STAGING_SYSTEM:0 "Abandoned Mustering Point"
 NAME_FOP_ABANDONED_STAGING_WORLD:0 "Sealed Icefields"

 fop_origin.10.name:0 "First Order in the Unknown Regions"
 fop_origin.10.desc:0 "Ilum has been established in the Unknown Regions beyond Jakku. Supremacy rests above the new capital, and the Imperial Remnant's secret route awaits our fleets. The normal First Order crisis will not appear in this game—we have replaced it."
 fop_origin.10.a:0 "The First Order will rise."

 fop_origin.11.name:0 "Heir to the Empire"
 fop_origin.11.desc:0 "The Imperial Remnant recognizes the First Order as heir to the Imperial cause. A special friendly relationship has been established, and the Imperial Remnant gate between Ilum and Jakku is now open to us."
 fop_origin.11.a:0 "The old Empire will be the foundation of the new order."

 fop_origin.20.name:0 "Galactic New Order"
 fop_origin.20.desc:0 "Starkiller Base is complete. The fleets, territories, and industry of the Imperial Remnant have been incorporated into the First Order. The galaxy has selected an anti-crisis leader and formed one coalition total war against us—including dormant and awakened Fallen Empires.\n\nThe exclusive §YGalactic New Order§! ascension perk and its five-stage ambition are active. The Final Order will approach in twenty years; losing Supremacy or Starkiller Base will bring that moment immediately."
 fop_origin.20.a:0 "Let the galaxy submit to the new order."

 fop_origin.50.name:0 "The Final Order"
 fop_origin.50.desc:0 "A signal from Exegol sweeps across the galaxy. The Sith Eternal demands that the First Order submit to Palpatine's Final Order. We may surrender the state's banner and throne, personally commanding the Final Order in the conquest of the galaxy, or reject the resurrected Emperor and face the normally spawned Final Order crisis while the apotheosis war continues."
 fop_origin.50.a:0 "We are the Final Order."
 fop_origin.50.a.tt:0 "The country is renamed and transformed into the §YFinal Order§!, its capital moves to Exegol, Palpatine becomes ruler, and the player continues the galactic war as a controllable crisis."
 fop_origin.50.b:0 "The First Order bows to no dead Emperor."
 fop_origin.50.b.tt:0 "Normally spawns an independent §YFinal Order crisis§! and starts a First Order civil war. Some ordinary fleets, non-core colonies, and subjects defect; Ilum, Starkiller Base, and Supremacy are protected. The player keeps the crisis identity and full apotheosis path."

 fop_force_ascension_status_edict:0 "Force Dominion Interface"
 fop_force_ascension_status_edict_desc:0 "Open the §YGalactic New Order§! ambition screen to review all five player-crisis stages, the current objective, and unlocked power."
 FOP_ENSLAVE_FORCE_PROJECT:0 "Enslave the Force"
 FOP_ENSLAVE_FORCE_PROJECT_DESC:0 "Weave the fear, obedience, and life of the entire galaxy into psionic chains that compel the Force itself to serve the New Order."
 FOP_COSMIC_ASCENSION_PROJECT:0 "Cosmic Apotheosis"
 FOP_COSMIC_ASCENSION_PROJECT_DESC:0 "Seize the essence of the Shroud Throne and write the ruler's will into the laws beneath reality and the Shroud."

 NAME_FOP_FORCE_SHROUD_REALM:0 "Sea of the Force"
 NAME_FOP_FORCE_SHROUD_HEART:0 "Heart of the Shroud"
 NAME_FOP_FORCE_SHROUD_THRONE:0 "The Empty Throne"
 NAME_FOP_FORCE_SHROUD_ECHO_I:0 "Echo of Fear"
 NAME_FOP_FORCE_SHROUD_ECHO_II:0 "Echo of Obedience"
 NAME_FOP_WILL_OF_THE_SHROUD:0 "Will of the Shroud"
 NAME_FOP_SHROUD_GODHOST:0 "God-Shadow of the Force"
 NAME_FOP_FINAL_ORDER_DEFECTORS:0 "Final Order Defectors"

 fop_force_chains_stage:0 "Chains of the Force"
 fop_force_chains_stage_desc:0 "The first state has been bound to the will of the New Order."
 fop_force_dominion_stage:0 "Galactic Dominion"
 fop_force_dominion_stage_desc:0 "Ever more civilizations are becoming part of the Force dominion network."
 fop_force_enslaved_stage:0 "The Enslaved Force"
 fop_force_enslaved_stage_desc:0 "The Force no longer possesses a will of its own."
 fop_new_cosmic_deity_modifier:0 "Newborn Cosmic Deity"
 fop_new_cosmic_deity_modifier_desc:0 "The ruler's will has been inscribed into the laws of material reality and the Shroud."
 fop_force_bound_subject_modifier:0 "Force Thrall"
 fop_force_bound_subject_modifier_desc:0 "The collective will of this state is bound to the Galactic New Order."
 fop_shroud_guardian_power:0 "Shroud Divinity"
 fop_shroud_guardian_power_desc:0 "These entities are the Shroud's instinctive resistance to enslavement."

 fop_origin.55.name:0 "Coronation of the Final Order"
 fop_origin.55.desc:0 "Exegol is now the capital and the Sith Eternal fleet obeys us. The state has been reforged into a fully player-controlled Final Order, but its goal remains the conquest of the galaxy and enslavement of the Force."
 fop_origin.55.a:0 "The entire universe will obey."
 fop_origin.58.name:0 "First Order Civil War"
 fop_origin.58.desc:0 "Rejecting Palpatine has torn the First Order apart. Officers, frontier governors, and subjects have sworn themselves to the Final Order, while rebel fleets appear near the capital. Ilum, Starkiller Base, and Supremacy remain loyal. We must defeat the Final Order, but the apotheosis plan continues."
 fop_origin.58.a:0 "Purge the traitors, then seize the Force."

 fop_origin.65.name:0 "Galactic New Order: Force Dominion"
 fop_origin.65.desc.1:0 "§YStage I—New Crisis§!\nStarkiller Base has ignited the galactic war.\n\n§ENext objective:§! Fully occupy every colony of one empire and turn it into a Force Thrall."
 fop_origin.65.desc.2:0 "§YStage II—Chains of the Force§!\nThe first state has submitted.\n\n§ENext objective:§! Control at least three subjects; total domination also completes this in a small galaxy."
 fop_origin.65.desc.3:0 "§YStage III—Galactic Dominion§!\nFear and obedience flow into one psionic network.\n\n§ENext objective:§! Subjugate or destroy every normal and Fallen Empire. If the Final Order was resisted, it must also be destroyed."
 fop_origin.65.desc.4:0 "§YStage IV—Enslave the Force§!\nThe galaxy lies beneath us. Complete the §YEnslave the Force§! special project."
 fop_origin.65.desc.5:0 "§YStage V—Invasion of the Shroud§!\nThe Force is chained. Cross the breach and destroy every Shroud avatar in the Sea of the Force."
 fop_origin.65.desc.6:0 "§MFinal Stage—Newborn Cosmic Deity§!\nThe galaxy, the Force, material reality, and the Shroud are extensions of your will."
 fop_origin.65.a:0 "Continue."

 fop_origin.71.name:0 "The First Chain"
 fop_origin.71.desc:0 "The first empire has been occupied and bound as a Force Thrall. The fear of billions is becoming psionic power we can wield."
 fop_origin.71.a:0 "Bind more wills."
 fop_origin.73.name:0 "Galactic Dominion Network"
 fop_origin.73.desc:0 "Three states have joined the New Order's collective will. The Force becomes clearer—and easier to control—with every submission."
 fop_origin.73.a:0 "No will remains free."
 fop_origin.75.name:0 "One Master of the Galaxy"
 fop_origin.75.desc:0 "No independent empire remains capable of defying us. The fear and obedience of all life can now forge chains around the Force itself. The §YEnslave the Force§! project has begun."
 fop_origin.75.a:0 "Make the Force kneel."
 fop_origin.80.name:0 "The Force Enslaved"
 fop_origin.80.desc:0 "The galaxy's psionic tides have reversed. For the first time, the Force answers not to life, but to our command. The Shroud resists, and a breach into the Sea of the Force has been torn open."
 fop_origin.80.a:0 "Invade the Shroud."
 fop_origin.82.name:0 "The Sea of the Force"
 fop_origin.82.desc:0 "Beyond the breach is not a dream, but a psionic realm that fleets can conquer. The Will of the Shroud has formed hosts of corrupted avatars around an empty throne. Destroy them and seize godhood."
 fop_origin.82.a:0 "Even gods will obey the New Order."
 fop_origin.91.name:0 "The Empty Throne"
 fop_origin.91.desc:0 "The last Shroud avatar has dissolved. The Empty Throne lies exposed, and the ritual of cosmic apotheosis can begin."
 fop_origin.91.a:0 "Begin the final ritual."
 fop_origin.100.name:0 "A New Cosmic God"
 fop_origin.100.desc:0 "Material reality trembles and the Shroud falls silent. The ruler's consciousness passes beyond flesh and time to become part of the Force, the galaxy, and reality's laws. The First Order no longer merely rules the stars—its will is the will of the universe."
 fop_origin.100.a:0 "I am Order. I am the Force. I am eternal."

 fop_ambition_window_title:0 "FIRST ORDER AMBITION: GALACTIC NEW ORDER"
 fop_ambition_window_subtitle:0 "Conquer the galaxy, enslave the Force, invade the Shroud, and seize a cosmic throne. Resisting the Final Order does not leave this path."
 fop_ambition.1.name:0 "Galactic New Order"
 fop_ambition.2.desc:0 "§YStage I—Galactic War§!\nComplete Starkiller Base, annex the Imperial Remnant, and gain major fleet and war bonuses.\n\n§YStage II—Chains of the Force§!\nThe first Force Thrall grants naval capacity, fire rate, and war endurance.\n\n§YStage III—Galactic Dominion§!\nThree submitted states unlock stronger fleet damage, fire rate, and naval capacity.\n\n§YStage IV—Enslave the Force§!\nDominating the galaxy unlocks the Enslave the Force project. Resisting the Final Order also requires victory in the civil war.\n\n§YStage V—Shroud Apotheosis§!\nInvade the Sea of the Force, destroy its avatars, and complete the cosmic apotheosis ritual."
 fop_ambition_show_rewards:0 "View Stage Powers"
 fop_ambition_show_objectives:0 "View Current Objective"
 fop_ambition_points_gui:0 "Ambition: [This.fop_force_dominion_points]"
 fop_ambition_points_tooltip:0 "Destroying an enemy ship grants §Y1§!, conquering a colony §Y25§!, and binding or destroying an empire §Y100§! Ambition. Advancing also requires each stage objective."
 fop_ambition_stage_1_name:0 "STAGE I  GALACTIC WAR"
 fop_ambition_stage_1_short:0 "Ignite Starkiller; annex the Remnant; formally wage war on the galaxy."
 fop_ambition_stage_2_name:0 "STAGE II  CHAINS OF THE FORCE"
 fop_ambition_stage_2_short:0 "Fully occupy the first state and bind billions as Force Thralls."
 fop_ambition_stage_3_name:0 "STAGE III  GALACTIC DOMINION"
 fop_ambition_stage_3_short:0 "Control at least three subjects and build a dominion across the stars."
 fop_ambition_stage_4_name:0 "STAGE IV  ENSLAVE THE FORCE"
 fop_ambition_stage_4_short:0 "Break the last independent power and complete the Force project."
 fop_ambition_stage_5_name:0 "STAGE V  SHROUD APOTHEOSIS"
 fop_ambition_stage_5_short:0 "Invade the Sea of the Force, destroy its avatars, seize the throne."
 fop_ambition_stage_1_locked_tt:0 "The galactic war has not yet begun."
 fop_ambition_stage_1_active_tt:0 "§GComplete:§! Starkiller Base has transformed the First Order into a new crisis."
 fop_ambition_stage_2_locked_tt:0 "Bind the first Force Thrall."
 fop_ambition_stage_2_active_tt:0 "§GComplete:§! The first chain around the Force has been forged."
 fop_ambition_stage_3_locked_tt:0 "Control at least three subjects, or already dominate the galaxy."
 fop_ambition_stage_3_active_tt:0 "§GComplete:§! The Galactic Dominion network has been established."
 fop_ambition_stage_4_locked_tt:0 "Subjugate or destroy every normal and Fallen Empire. If the Final Order was resisted, win the civil war."
 fop_ambition_stage_4_active_tt:0 "§GUnlocked:§! Complete the §YEnslave the Force§! special project."
 fop_ambition_stage_5_locked_tt:0 "Complete the Enslave the Force special project."
 fop_ambition_stage_5_active_tt:0 "§GUnlocked:§! The Shroud breach is open; seize the Empty Throne."
 wg_fop_galactic_crisis:0 "Galactic Anti-Crisis War"
 war_goal_wg_fop_galactic_crisis:0 "Galactic Anti-Crisis War"
 war_goal_wg_fop_galactic_crisis_desc:0 "The powers of the galaxy have joined one coalition total war to destroy the First Order's new crisis."
