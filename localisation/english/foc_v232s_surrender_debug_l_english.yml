l_english:
 foc_v232s.debug_surrender_tooltip:0 "§RDebug only: commit Confederate surrender immediately.§!\nNo Coruscant or Utapau battle, 140-point score, or colony occupation is required. War, territory, and country cleanup still occur on separate days, followed by the existing Order 66 sequence. Wartime choices are not rewritten and settlement cannot be duplicated."
 foc_v232s.debug_status_button:0 "Inspect Clone Wars Conditions (Read Only)"
 foc_v232s.status.name:0 "Clone Wars: Normal Victory Conditions"
 foc_v232s.status.desc:0 "§HRead-only: this panel neither forces surrender nor grants conspiracy points.§!\n\n§YStory route§!: [Root.GetFocV232sStoryVictoryStatus]\nCoruscant battle: [Root.GetFocV232sCoruscantStatus]\nUtapau battle: [Root.GetFocV232sUtapauStatus]\nActual conspiracy progress: [Root.foc_v232s_status_plot]/140; threshold: [Root.GetFocV232sPlotStatus]\n\n§YMilitary total-war victory§!: [Root.GetFocV232sMilitaryVictoryStatus]\nOnly a confirmed engine victory over the CIS, or Republic destruction of the CIS during that war, satisfies this route. Colony counts and ground controllers no longer simulate a war result. A missing country, peace without victory, status quo, Republic defeat, and third-party annihilation do not qualify.\n\nEither route starts the usual surrender settlement. Below 140, win the military route; time grants no points. The separate §Rdebug force-surrender§! button still bypasses these normal requirements."
 foc_v232s.status.yes:0 "§GMet§!"
 foc_v232s.status.no:0 "§RNot met§!"
 foc_v232s.status.refresh:0 "Refresh Status (No Story Changes)"
 foc_v232s.status.back:0 "Return to Story Debug Console"
 foc_v232s.surrender_military.desc:0 "The Republic has won its actual total war against the Confederacy of Independent Systems. Military command has confirmed the outcome, and the Clone Wars enter their closing phase.\n\nAny remaining Confederate territory and forces follow the existing staged settlement; an already eliminated Confederacy is not recreated. Order 66 and the birth of the Empire then continue through their original event chain."
