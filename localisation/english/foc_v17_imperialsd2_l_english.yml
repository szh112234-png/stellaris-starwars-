 foc_v17_tech_imperialsd2:0 "Imperial II-class Refit"
 foc_v17_tech_imperialsd2_desc:0 "The loss of the Death Star forced the Empire back onto its capital ships. The Imperial II refit thickens the armour belt, doubles up the deflector generators and rebalances the turbolaser batteries for line engagements, all without raising the yard cost."
 foc_imperialsd2_foc_lowest:0 "Imperial II-class Star Destroyer"
 foc_imperialsd2_foc_lowest_plural:0 "Imperial II-class Star Destroyers"
 foc_v17_isd2.1.name:0 "Weakness of the Star Destroyer"
 foc_v17_isd2.1.desc:0 "The battle station is gone, and with it the argument that one weapon could hold the galaxy. The Naval Board has spent the weeks since Yavin tearing apart every action report from the Imperial I-class line.\n\nThe findings are uncomfortable. Deflector coverage thins badly at the dorsal trench. Armour belts were laid for a fleet that expected to outrange everything it met. The turbolaser batteries were tuned for orbital bombardment, not for a line engagement against capital ships that shoot back.\n\nThe yards at Kuat can correct all three. The refit costs nothing the Empire is not already spending."
 foc_v17_isd2.1.a:0 "Upgrade our ships."
