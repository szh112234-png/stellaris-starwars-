 foc_native_species_kashyyyk_desc:0 "Kashyyyk's principal population is Wookiee. They are a mature member civilization with their own technology, society and military traditions, not a pre-FTL people."
 foc_native_species_mon_cala_desc:0 "Dac is home to both the Mon Calamari and the Quarren. Both are advanced native civilizations participating in galactic politics as Republic citizens."
 foc_native_species_geonosis_desc:0 "The Geonosians possess mature industry, weapons production and interstellar technology. Under the Republic they are represented as a highly autonomous native civilization; after joining the Separatists they become full citizens of the Confederacy."
