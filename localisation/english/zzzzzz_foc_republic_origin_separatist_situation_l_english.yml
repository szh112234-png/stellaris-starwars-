l_english:
 situation_foc_republic_origin_separatist_crisis:0 "The Separatist Crisis"
 situation_foc_republic_origin_separatist_crisis_type:0 "The Separatist Crisis"
 situation_foc_republic_origin_separatist_crisis_desc:0 "From Naboo to Geonosis, the Separatist Crisis leads to secession and open war. §HThis bar controls the pre-war crisis; it is not Palpatine's conspiracy or a war-victory score.§!\n\n§YConfederate surrender: either victory route is sufficient§!\n§HStory route§!: complete the Coruscant and Utapau battle events and reach 140 conspiracy points.\n§HMilitary route§!: the engine must confirm a Republic victory against the CIS in their actual total war, or the Republic must destroy the CIS during that war. Colony counts, temporary controllers, and a missing CIS are not victory results. Status quo, a Republic defeat, or a third-party destruction of the CIS do not qualify. Neither 140 points nor the two battle events is required.\nIf unfavorable or mixed choices leave the conspiracy below 140, finish the war by military conquest, not by waiting for extra points. Both routes use the staged surrender settlement; the two commanders dying is not a separate victory condition."
 situation_foc_republic_origin_separatist_crisis_monthly_change_tooltip:0 "Monthly progress is zero. Only story events advance the situation; the war starts only after Geonosis completes it."
 foc_republic_origin_sep_stage_naboo:0 "Naboo and the Sith Shadow"
 foc_republic_origin_sep_stage_naboo_desc:0 "The Naboo Crisis reshapes the Republic while an unknown army begins to take form on Kamino."
 foc_republic_origin_sep_stage_naboo_tooltip:0 "Story events, not elections or monthly ticks, advance this situation."
 foc_republic_origin_sep_stage_shadow_army:0 "War Prepared in Secret"
 foc_republic_origin_sep_stage_shadow_army_desc:0 "The clone project has fallen under Dooku's control."
 foc_republic_origin_sep_stage_shadow_army_tooltip:0 "The hidden clone programme and Dooku's political campaign push the crisis toward open secession."
 foc_republic_origin_sep_stage_secession:0 "The Separatist Movement"
 foc_republic_origin_sep_stage_secession_desc:0 "Thousands of systems answer Dooku while the corporate combines prepare droid armies."
 foc_republic_origin_sep_stage_secession_tooltip:0 "The CIS is not created yet; the political and military conspiracy must first be exposed."
 foc_republic_origin_sep_stage_geonosis:0 "The Geonosis Crisis"
 foc_republic_origin_sep_stage_geonosis_desc:0 "The conspiracy is exposed, Jedi are captive, and the Senate is considering emergency powers."
 foc_republic_origin_sep_stage_geonosis_tooltip:0 "Only the Geonosis opening story event can complete this situation and start the Separatist War; it does not count as a battle-time anchor."
 foc_republic_origin_sep_approach_watch:0 "Track the Crisis"
 foc_republic_origin_sep_approach_watch_desc:0 "This situation advances only through its story events."
 foc_republic_origin_sep_approach_watch_tooltip:0 "Elections no longer start the Separatist War."
 foc_sepplot.1.name:0 "A New Sith Apprentice"
 foc_sepplot.1.desc:0 "After Darth Maul is believed dead on Naboo, Palpatine turns to the former Jedi Master Count Dooku, who accepts the name Darth Tyranus."
 foc_sepplot.1.a:0 "The new apprentice is in place."
 foc_sepplot.2.name:0 "Sifo-Dyas's Warning"
 foc_sepplot.2.desc:0 "Convinced that catastrophe is coming, Jedi Master Sifo-Dyas secretly commissions a clone army on Kamino without the Council's approval."
 foc_sepplot.2.a:0 "An army ordered in secret."
 foc_sepplot.3.name:0 "The Clone Project Hijacked"
 foc_sepplot.3.desc:0 "Dooku eliminates Sifo-Dyas, erases the trail, and assumes control of the clone programme as Darth Tyranus."
 foc_sepplot.3.a:0 "Control of the army changes hands."
 foc_sepplot.4.name:0 "The Separatist Movement"
 foc_sepplot.4.desc:0 "Dooku publicly denounces the Republic at Raxus and turns scattered discontent into an organised movement for secession."
 foc_sepplot.4.a:0 "The galaxy is splitting."
 foc_sepplot.5.name:0 "The Geonosis Compact"
 foc_sepplot.5.desc:0 "The Trade Federation and other corporate powers secretly pledge fleets, industry, and battle droids to Dooku on Geonosis."
 foc_sepplot.5.a:0 "This is no longer a protest."
 foc_sepplot.6.name:0 "The Secret of Kamino"
 foc_sepplot.6.desc:0 "Obi-Wan Kenobi discovers the clone army while tracking the assassin Jango Fett, then follows him toward Geonosis."
 foc_sepplot.6.a:0 "Find out who ordered this army."
 foc_sepplot.7.name:0 "The Plot on Geonosis"
 foc_sepplot.7.desc:0 "Obi-Wan discovers the corporate alliance and its droid armies, transmits the evidence to the Jedi Council, and is captured."
 foc_sepplot.7.a:0 "Warn the Council and Senate."
 foc_sepplot.8.name:0 "The Jedi Captured"
 foc_sepplot.8.desc:0 "Anakin Skywalker and Padme Amidala attempt a rescue and are captured alongside Obi-Wan. All three are sentenced to die in the Geonosian arena."
 foc_sepplot.8.a:0 "Prepare the rescue."
 foc_sepplot.9.name:0 "Emergency Powers"
 foc_sepplot.9.desc:0 "§LA file that should never have existed has been reopened, and every page points toward something darker.§!\n\nJar Jar Binks proposes emergency powers for Supreme Chancellor Palpatine. The Senate approves, and the newly discovered clone army is activated.\n\n§LThe story and other effects are retained; this event no longer adds extra conspiracy points.§!"
 foc_sepplot.9.a:0 "Grant emergency powers."
