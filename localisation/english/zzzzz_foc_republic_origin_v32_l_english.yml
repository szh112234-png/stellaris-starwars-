 FOC_REPUBLIC_ORIGIN_REBEL_GARRISON_FLEET:0 "Rebel Garrison Fleet"
 foc_republic_origin_imperial_fear_deficit:0 "A New Order With Nothing Behind It"
 foc_republic_origin_imperial_fear_deficit_desc:0 "The Empire took the galaxy by force and has not yet given it a reason to stay taken. The worlds comply, and none of them consent.\n\nThis clears only once Death Star I is actually built and the Emperor commits to the §HTarkin Doctrine§! - rule through fear of that station. An Empire that chooses to govern the Outer Rim instead carries the deficit indefinitely."
