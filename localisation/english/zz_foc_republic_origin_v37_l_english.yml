l_english:
 foc_republic_origin.192.name:0 "Hosnian Falls: The New Republic Is Destroyed"
 foc_republic_origin.192.desc:0 "§HHosnian Prime is gone.§! The capital, the Senate and the separate New Republic government that remained there have been erased in a single column of light. Its surviving Inner Rim holdings collapse before the First Order.\n\nBut the contingency was made in time. §HD'Qar§! and the §HResistance§! are a different state, and the country under your command was already inherited there when the First Order appeared. Hosnian's destruction cannot reach the player identity, leaders, knowledge or treasury carried into that resistance."
 foc_republic_origin.192.a:0 "The New Republic has fallen; the Resistance endures."
