l_english:
 origin_foc_republic_unification:0 "Galactic Republic: Eve of Division"
 origin_foc_republic_unification_desc:0 "The Galactic Empire does not yet exist. The ancient Galactic Republic governs twenty-seven Inner- and Outer-Rim member systems from Coruscant, but disputes over local autonomy, commercial combines and the Chancellor's growing emergency powers are driving it toward separatist war and the birth of the Empire.\n\n§YConfederate surrender: either victory route is sufficient§!\n§HStory route§!: complete the Coruscant and Utapau battle events and reach 140 conspiracy points.\n§HMilitary route§!: the engine must confirm a Republic victory against the CIS in their actual total war, or the Republic must destroy the CIS during that war. Colony counts, temporary controllers, and a missing CIS are not victory results. Status quo, a Republic defeat, or a third-party destruction of the CIS do not qualify. Neither 140 points nor the two battle events is required.\nIf unfavorable or mixed choices leave the conspiracy below 140, finish the war by military conquest, not by waiting for extra points. Both routes use the staged surrender settlement; the two commanders dying is not a separate victory condition."
 origin_foc_republic_unification_effects:0 "§YStory Path:§!\n- Lead the Galactic Republic through the Separatist crisis, Clone Wars and Order 66\n- Choose the Galactic Empire or Imperial Rebels; ordinary internal breakaway revolts from the Galactic Empire are absorbed by the Imperial Rebels\n- The military Galactic Concordance route requires both Death Stars and Executor, Lusankya and Punisher destroyed, and the Galactic Empire to §Hlose Coruscant, Jakku and Kuat§!. Those systems no longer have to be owned by the Rebels\n- Eliminating the Galactic Empire still triggers the Treaty directly\n- Choosing the Empire automatically unlocks the supplied Empire Ships addon sections and rebuilds automatic designs so Republic hull models do not remain in use\n\n§YConfederate surrender: either victory route is sufficient§!\n§HStory route§!: complete the Coruscant and Utapau battle events and reach 140 conspiracy points.\n§HMilitary route§!: the engine must confirm a Republic victory against the CIS in their actual total war, or the Republic must destroy the CIS during that war. Colony counts, temporary controllers, and a missing CIS are not victory results. Status quo, a Republic defeat, or a third-party destruction of the CIS do not qualify. Neither 140 points nor the two battle events is required.\nIf unfavorable or mixed choices leave the conspiracy below 140, finish the war by military conquest, not by waiting for extra points. Both routes use the staged surrender settlement; the two commanders dying is not a separate victory condition."
 START_SCREEN_FOC_REPUBLIC_UNIFICATION:0 "A long time ago, in a galaxy far, far away....\n\nThe Galactic Empire has not yet been born. For generations the Galactic Republic has governed from Coruscant, and twenty-seven member systems—from Hosnian and Kuat to Bastion, Jakku and Tatooine—send delegates to its Senate. The New Republic and Imperial Remnant belong to a future that has not happened; the Inner and Outer Rim answer directly to the Republic.\n\nRepublic fleets guard the trade lanes while Kuat reviews the drawings for a new generation of capital ship. Yet Outer-Rim assemblies resist central taxation, commercial combines arm in secret, and the Supreme Chancellor gathers emergency powers. The Republic stands on the eve of division, and the Empire can arise only after it falls."

