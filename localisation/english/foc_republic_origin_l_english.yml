 FOC_REPUBLIC_ORIGIN_PRESET:0 "Galactic Republic"
 trait_foc_republic_origin_preset_ethics:0 "Egalitarian / Xenophile / Militarist"
 FOC_REPUBLIC_ORIGIN_PRESET_DESC:0 "A democratic Republic led by the Galactic Senate on Coruscant and Supreme Chancellor Palpatine. This preset uses the Republic flag, portraits and ship culture with the Galactic Republic: Eve of Division origin, beginning before the Separatist War, Imperial rise and dual-Death-Star story."

 foc_republic_origin_command.1.name:0 "Story Debug: High Command Console"
 foc_republic_origin_command.1.desc:0 "Story debugging commands for the current route. §RForce Confederate Surrender§! directly starts the staged settlement, bypassing battle, 140-point, and colony-occupation requirements without forging choices or battle flags. It cannot settle an already finished or currently settling war twice.\n\n§HInspect Clone Wars Conditions§! only reports the two normal victory routes and their missing requirements. §HRecalculate Conspiracy§! still reads recorded choices without awarding free points."
 foc_republic_origin_command.1.start_separatists:0 "Declare the Outer Rim systems to be in rebellion."
 foc_republic_origin_command.1.surrender_separatists:0 "[DEBUG] Force Confederate Surrender (Bypass Victory Conditions)"
 foc_republic_origin_command.1.plot_25:0 "Recalculate conspiracy (no free points)"
 foc_republic_origin_command.1.plot_complete:0 "Complete post-war conspiracy closure (war must be over)"
 foc_republic_origin_command.1.build_death_star_one:0 "[DEBUG] Spawn Death Star I now (skip construction)"
 foc_republic_origin_command.1.destroy_death_star_one:0 "[DEBUG] Destroy Death Star I (play explosion)"
 foc_republic_origin_command.1.build_death_star_two:0 "[DEBUG] Spawn Death Star II now (skip construction / 4-year wait)"
 foc_republic_origin_command.1.destroy_death_star_two:0 "[DEBUG] Destroy Death Star II (play explosion)"
 foc_republic_origin_command.1.force_treaty:0 "Convene all parties and sign the Galactic Concordance now."
 foc_republic_origin_command.1.grant_mon_cala:0 "Reissue the Mon Cala construction authorisation to every Republic-side power."
 foc_republic_origin_command.1.close:0 "Leave the war map."

 civic_foc_republic_origin_galactic_senate:0 "Galactic Senate"
 civic_foc_republic_origin_galactic_senate_desc:0 "The Coruscant Senate represents the Republic's member systems and maintains a galaxy-wide diplomatic network."
 civic_foc_republic_origin_defense_fleet:0 "Republic Defense Force"
 civic_foc_republic_origin_defense_fleet_desc:0 "The Republic fleet and its ground forces preserve the union."
 civic_foc_republic_origin_separatist_council:0 "Separatist Council"
 civic_foc_republic_origin_separatist_council_desc:0 "Outer Rim governors and commercial combines oppose central rule from Coruscant."
 civic_foc_republic_origin_droid_army:0 "Separatist War Machine"
 civic_foc_republic_origin_droid_army_desc:0 "An automated military-industrial system sustains the Separatist fleets and armies."
 civic_foc_republic_origin_galactic_emperor:0 "Galactic Emperor"
 civic_foc_republic_origin_galactic_emperor_desc:0 "All power is concentrated in the Galactic Emperor and the designated successor."
 civic_foc_republic_origin_imperial_military:0 "Imperial War Machine"
 civic_foc_republic_origin_imperial_military_desc:0 "The Imperial Navy, governors and forge worlds are the iron pillars of the New Order."
 gov_foc_republic_origin_republic:0 "Galactic Republic"
 gov_foc_republic_origin_republic_desc:0 "A galactic democracy led by the Coruscant Senate and an elected Supreme Chancellor."
 gov_foc_republic_origin_separatists:0 "Confederacy of Independent Systems"
 gov_foc_republic_origin_separatists_desc:0 "An alliance of autonomous Outer Rim governments and commercial combines."
 gov_foc_republic_origin_empire:0 "Galactic Empire"
 gov_foc_republic_origin_empire_desc:0 "A centralized autocracy ruled by the Galactic Emperor and the Imperial Navy."
 RT_FOC_REPUBLIC_ORIGIN_CHANCELLOR:0 "Supreme Chancellor"
 RT_FOC_REPUBLIC_ORIGIN_HEAD_OF_STATE:0 "Head of State"
 RT_FOC_REPUBLIC_ORIGIN_EMPEROR:0 "Galactic Emperor"
 RT_FOC_REPUBLIC_ORIGIN_EMPRESS:0 "Galactic Empress"
 HT_FOC_REPUBLIC_ORIGIN_SUPREME_COMMANDER:0 "Supreme Commander"

 foc_republic_origin_union_economy:0 "Republic Union Economy"
 foc_republic_origin_union_economy_desc:0 "Inner Rim industry and Outer Rim resources are coordinated from Coruscant, including centralized maintenance for the Republic's line fleets."
 building_foc_republic_origin_member_world_nexus:0 "Member-World Administrative Economic Nexus"
 building_foc_republic_origin_member_world_nexus_desc:0 "A permanent planetary capital installed on every Republic member world. It directly supplies essential resources, housing, amenities, stability and policing, keeping all lore planets colonized without immediate bankruptcy or rebellion from low habitability, unemployment or fleet upkeep."
 foc_republic_origin_civil_war_economy:0 "Civil-War Mobilization"
 foc_republic_origin_civil_war_economy_desc:0 "The entire state has entered indefinite wartime mobilization, including centralized maintenance for its story fleets."
 war_goal_wg_foc_republic_civil_war:0 "Galactic Civil War"
 war_goal_wg_foc_republic_civil_war_desc:0 "This civil war is resolved by the story conditions of its era. The following requirements apply only to the Clone Wars against the Confederacy; the later Imperial-Rebel conflict retains its own rules.\n\n§YConfederate surrender: either victory route is sufficient§!\n§HStory route§!: complete the Coruscant and Utapau battle events and reach 140 conspiracy points.\n§HMilitary route§!: the engine must confirm a Republic victory against the CIS in their actual total war, or the Republic must destroy the CIS during that war. Colony counts, temporary controllers, and a missing CIS are not victory results. Status quo, a Republic defeat, or a third-party destruction of the CIS do not qualify. Neither 140 points nor the two battle events is required.\nIf unfavorable or mixed choices leave the conspiracy below 140, finish the war by military conquest, not by waiting for extra points. Both routes use the staged surrender settlement; the two commanders dying is not a separate victory condition."

 foc_republic_origin.2.name:0 "A United Republic"
 foc_republic_origin.2.desc:0 "The Galactic Senate opens a new session on §HCoruscant§!. Delegates from twenty-seven member systems gather beneath the dome: the industry and hyperlanes of the §H14-system Inner Rim§!, the ore and border garrisons of the §H13-system Outer Rim§!, together sustaining a union a thousand years old.\n\nEvery member world is administered from a §HMember-World Administrative Economic Nexus§!, supplying energy, minerals, food, consumer goods and alloys, and holding together local order and livelihood. The yards are expanding and escort squadrons patrol the great trade lanes.\n\nYet the Outer Rim tax disputes never quite settle, the commercial combines enlist more private troops every year, and in the Chancellor's office the emergency powers accumulate, one decree at a time."
 foc_republic_origin.2.a:0 "The Republic will endure."
 foc_republic_origin.10.name:0 "The Separatist Civil War"
 foc_republic_origin.10.desc:0 "The Republic's political crisis has become open war. The Confederacy governs from Mustafar while Akiva remains a center of droid production and fleet supply."
 foc_republic_origin.10.a:0 "The Republic will not be divided."
 foc_republic_origin.17.name:0 "The Akiva Droid Foundries"
 foc_republic_origin.17.desc:0 "Reconnaissance confirms the droid foundries on Akiva. They are a major industrial and logistical objective."
 foc_republic_origin.17.a:0 "Break its war industry and keep advancing."
 foc_republic_origin.20.name:0 "Confederate Surrender"
 foc_republic_origin.20.desc:0 "The Confederacy submits its surrender.\n\nHostilities will end, all remaining territory including §HMustafar§! will be transferred over separate days, and the Confederacy will dissolve without a Council rump state. Order 66 and the birth of the Empire follow the end of the Clone Wars."
 foc_republic_origin.20.a:0 "Rebuild—and prepare."
 foc_republic_origin.30.name:0 "The Imperial Civil War"
 foc_republic_origin.30.desc:0 "The lights go down in the Senate chamber. The Supreme Chancellor takes the rostrum and declares the Republic reorganised, from this day, into the §HGalactic Empire§! - for a safe and secure society. The applause is deafening.\n\nNot everyone is applauding. Mon Mothma and a bloc of senators have already left Coruscant, and squadrons still loyal to the old Republic are gathering at §HYavin, D'Qar and Hoth§!. The galaxy will choose between two flags.\n\nThe state you command passes intact into your hands. It will raise one of those flags, keep its fleets, its yards and its people, and go to war with the other."
 foc_republic_origin.30.a:0 "Command the Galactic Empire."
 foc_republic_origin.30.a.tt:0 "Your country becomes the Galactic Empire and inherits Republic territory. Completing Death Star II or eliminating the Imperial Rebellion commissions Executor, Lusankya and Punisher at Endor, Coruscant and Jakku. Each group has one Executor-class ship and thirty Imperial II-class escorts. Other Galactic Concordance requirements remain unchanged."
 foc_republic_origin.30.b:0 "Command the Imperial Rebels."
 foc_republic_origin.30.b.tt:0 "Your own country becomes the Imperial Rebellion in place, with no country change, falling back on Yavin, D'Qar and Hoth and absorbing the D'Qar base, fleets and named commanders. During the Rebellion they use Rebel-era hulls only and do not receive the Nebula class. Destroy both AI-built Death Stars, hold the Inner Rim and Jakku, then become the New Republic and unlock the Nebula class."
 foc_republic_origin.32.name:0 "A New Master of the Empire"
 foc_republic_origin.32.desc:0 "The Imperial banner rises over Coruscant. The territory, yards and fleets of the old Republic pass whole into the new order, and the production lines for the §HImperial-class Star Destroyer§! are already running; the §HExecutor-class§! drawings remain locked in an engineering vault - a contingency to be opened only if a Death Star is ever lost.\n\nThe Emperor has also approved a project under the codename §HDeath Star§!: a battlestation capable of destroying a world. Once it is built, no rebellion will ever need to be negotiated with again."
 foc_republic_origin.32.a:0 "One galaxy. One Empire."
 foc_republic_origin.33.name:0 "The Imperial Rebels"
 foc_republic_origin.33.desc:0 "§HYavin, D'Qar, Hoth§! - three hidden bases, a handful of squadrons that refused to stand down, and a list of names carried out of the old Senate. That is the whole of what stands against the Empire.\n\nIntelligence speaks of a battlestation unlike anything built before. If it is completed, any world it targets simply ceases to exist. The Imperial archive on Scarif may hold its weakness.\n\nThe rebellion begins today."
 foc_republic_origin.33.a:0 "The rebellion begins today."
 foc_republic_origin.50.name:0 "The Republic Falls: Rebellion Rises"
 foc_republic_origin.50.desc:0 "The Republic's final colony has fallen, but surviving senators, officers and warships have assembled at §HD'Qar§! as a new §HRebel Alliance§!. Destroying the Republic completes only the second Dark Legacy gate. The Death Star must be finished and the Rebels eliminated before Order technology or the Galactic New Order crisis path can activate."
 foc_republic_origin.50.a:0 "Find the Rebels and destroy them."

 FOC_REPUBLIC_ORIGIN_DEATH_STAR_PROJECT:0 "Death Star I Plan and Construction"
 FOC_REPUBLIC_ORIGIN_DEATH_STAR_PROJECT_DESC:0 "Imperial engineers will complete Death Star I above Coruscant. The normal workload is §Y60,000§! engineering. If total Imperial Rebel fleet power overtakes the Empire and the one-shot emergency program is activated, the total cost falls to §Y15,000§! without canceling the current project. An AI Empire normally needs 20 years; the emergency deadline is §Y2.5 years§! from the ORIGINAL program start. A later activation can complete immediately once that deadline has elapsed."
 foc_republic_origin.70.name:0 "The Death Star Is Complete"
 foc_republic_origin.70.desc:0 "That is no moon. The §HDeath Star§! is operational above Coruscant, its superlaser capable of shattering an entire world. The project gate is complete, but Dark Legacy still requires the destruction of both the Republic and Rebel Alliance."
 foc_republic_origin.70.a:0 "Witness the firepower of this fully armed battlestation."
 foc_republic_origin.76.name:0 "The Rebel Alliance"
 foc_republic_origin.76.desc:0 "Republic survivors have established a covert base at §HD'Qar§! and declared war as the §HRebel Alliance§!. They reuse our starting main species and the existing Rebel ship and hero-fleet package. D'Qar is the uprising's sole political center; taking its last colony ends the Rebellion."
 foc_republic_origin.76.a:0 "Crush the Rebellion at its source."
 foc_republic_origin.80.name:0 "Imperial Triumph: Dark Legacy"
 foc_republic_origin.80.desc:0 "§HThe Death Star is complete, the Republic has fallen, and the Rebel Alliance has been destroyed.§! All three gates are satisfied. Sealed §HStarkiller Base, Resurgent and Supremacy§! technologies, edicts and construction projects are now unlocked. The §HXyston-class§! remains sealed until the Final Order stage.\n\nThe ordinary First Order crisis is permanently bypassed. The Empire is forced into the First Order origin's complete §HGalactic New Order, Final Order, Force Avatar and cosmic ascension§! crisis sequence. The Final Order choice will arrive in twenty years."
 foc_republic_origin.80.a:0 "One galaxy. One Empire."
 foc_republic_origin.60.name:0 "The Galactic Treaty"
 foc_republic_origin.60.desc:0 "The Imperial coup has failed and Palpatine's Empire has broken apart. The surviving powers sign the §HGalactic Concordance§!:\n\n- The Inner Rim reforms as the §HNew Republic§! with its capital at §HHosnian Prime§!, still under your command;\n- The Outer Rim withdraws to Bastion and holds the last Imperial territory as the §HImperial Remnant§!;\n- Both sides stand down their civil-war fleets, each retaining two engineering flotillas, two great battlestations and eight line fleets, and neither may expand into the other's space again.\n\nThe treaty is signed. Somewhere in the Unknown Regions, there are those who do not recognise it."
 foc_republic_origin.60.a:0 "May this treaty bring a lasting peace."
 foc_republic_origin.160.name:0 "The Galactic Treaty: New Republic"
 foc_republic_origin.160.desc:0 "Both Death Stars are destroyed, the Inner Rim is yours and Jakku has fallen. The §HGalactic Concordance§! is signed:\n\n- The Alliance reforms as the §HNew Republic§! with its capital at §HHosnian Prime§!, still under your command;\n- The Imperial remnant withdraws to Bastion and keeps the Outer Rim as the §HImperial Remnant§!;\n- Both sides stand down their civil-war fleets, each retaining two engineering flotillas, two great battlestations and eight line fleets.\n\nThe galaxy is quiet at last. Only from the Unknown Regions has nothing been heard."
 foc_republic_origin.160.a:0 "Let the New Republic rise from victory."
 foc_republic_origin.161.name:0 "The Galactic Treaty: Imperial Remnant"
 foc_republic_origin.161.desc:0 "Both Death Stars are gone and the rebels hold the Inner Rim and Jakku. The Empire can no longer keep its old borders, and signs the §HGalactic Concordance§!:\n\n- The Alliance founds the §HNew Republic§! at §HHosnian Prime§! and takes the Inner Rim;\n- We withdraw to the Outer Rim and reform at Bastion as the §HImperial Remnant§!;\n- Both sides stand down their civil-war fleets, each retaining two engineering flotillas, two great battlestations and eight line fleets.\n\nThe signatures on the treaty are genuine. The fleet numbers that sailed for the Unknown Regions appear on no handover list."
 foc_republic_origin.161.a:0 "The Empire is not yet finished."

 foc_republic_origin.162.name:0 "The First Order Plan: Project Unlocked"
 foc_republic_origin.162.desc:0 "The Empire's open war is over, but its secrets did not die with it. High Command authorises the consolidation of Unknown Regions industry, kyber-crystal research and the surviving fleets into the §HFirst Order Plan§!.\n\nThe §HFirst Order Plan§! special project has been added to the Situation Log. Completing it will open §HIlum§! and unlock §HStarkiller Base, Supremacy and Resurgent§! technology; it will not immediately turn the country into a crisis."
 foc_republic_origin.162.a:0 "Authorise the secret preparations."

 foc_republic_origin.165.name:0 "The First Order Plan Complete"
 foc_republic_origin.165.desc:0 "The routes into the Unknown Regions have finally been charted. §HIlum§! and its kyber deposits are being opened to us, while a dedicated gateway link between Ilum and Jakku is established.\n\n§HStarkiller Base, Supremacy and Resurgent§! technology is now unlocked. Only the completion of Starkiller Base will reform the surviving Imperial state into the First Order and begin the full crisis sequence shared with the First Order origin."
 foc_republic_origin.165.a:0 "The First Order will return from the Unknown Regions."

 FOC_REPUBLIC_ORIGIN_FIRST_ORDER_PLAN_PROJECT:0 "The First Order Plan"
 FOC_REPUBLIC_ORIGIN_FIRST_ORDER_PLAN_PROJECT_DESC:0 "Consolidate the Imperial fleets that withdrew into the Unknown Regions, survey Ilum's kyber deposits and complete the First Order's secret armament system. Completion opens Ilum and directly unlocks Starkiller Base, Supremacy and Resurgent technology."

 foc_republic_origin.190.name:0 "Starkiller Base: The First Order Rises"
 foc_republic_origin.190.desc:0 "§HStarkiller Base is complete.§! The Imperial state that completed the First Order Plan formally reforms as the §HFirst Order§! and becomes a crisis.\n\nThe ensuing §HGalactic New Order, Final Order, Force Avatar and cosmic ascension§! sequence is identical to the First Order origin. This crisis route cannot begin before Starkiller Base is complete."
 foc_republic_origin.190.a:0 "The First Order will rule the galaxy."
 foc_republic_origin.192.name:0 "Hosnian Falls: The Republic Becomes the Resistance"
 foc_republic_origin.192.desc:0 "§HHosnian Prime is gone.§! The capital, the Senate, the fleet command and billions of lives, turned to dust by a single column of light drawn across the stars. The New Republic government simply stops functioning, and within days the rest of the Inner Rim passes to the First Order.\n\nThe surviving captains, senators and intelligence officers regroup on §HD'Qar§! and trade the old Republic banner for a smaller sigil. The Viscount yards, the ancient economic network, the great battlestations - all of it was lost with the capital.\n\nWhat remains is the name §HResistance§!, and the people who will not surrender."
 foc_republic_origin.192.a:0 "The Republic is gone; the Resistance endures."

 FOC_REPUBLIC_ORIGIN_PALPATINE_CHANCELLOR_NAME:0 "Palpatine"

 foc_republic_origin.5.name:0 "The Naboo Crisis"
 foc_republic_origin.5.desc:0 "§LThe galaxy still believes the Republic can survive this crisis; the crisis itself is already remaking the Republic.§!\n\nTrade Federation freighters have blockaded §HNaboo§! and the Mid Rim lanes have seized up. The Senate argues procedure for weeks while the relief fleet never leaves dock.\n\nOut of the deadlock, a senator of the Naboo delegation moves a vote of no confidence in the sitting Supreme Chancellor, and is carried into that office by the vote that follows. His name is §HPalpatine§!.\n\nHe assures the Senate that all the Republic needs is efficiency.\n\n§YFixed milestone: conspiracy +10, recorded once.§!"
 foc_republic_origin.5.a:0 "Someone has to clean up a crisis."

 foc_republic_origin.21.name:0 "Palpatine's Plot"
 foc_republic_origin.21.desc:0 "§LThere is no grand ceremony—only an order, a report, and consequences that no one will later be able to reverse.§!\n\nAn unsigned briefing crosses your desk: emergency decrees, off-ledger military funding, proxies in the Senate, all drawing together into an invisible web around the Supreme Chancellor.\n\nNothing in it can be proven. But after every crisis, power on Coruscant sits a little more tightly in one pair of hands than it did before."
 foc_republic_origin.21.a:0 "Watch the Senate, and watch the army."

 foc_republic_origin.23.name:0 "The Clone Army Plan"
 foc_republic_origin.23.desc:0 "§LThe distance between the Senate and the front has never felt greater, and everyone is waiting for an answer that will decide what comes next.§!\n\nThe growth vats of Kamino deliver the Republic's first clone legions. In the name of defending the Republic the Senate approves the §HClone Army Plan§!: no longer dependent on the local forces of its member systems, the Republic now fields a standing army that spans the galaxy and answers to the General Staff alone.\n\nAnd wartime command of the General Staff rests with the Supreme Chancellor.\n\nCommand of the first legions goes to §HCommander Cody§! - a clone, loyal to the Republic, and to whatever order supersedes the Republic.\n\n§YFixed milestone: conspiracy +10, recorded once.§!"
 foc_republic_origin.23.a:0 "Activate the Clone Army Plan. (Original military effects; conspiracy +10 once)"

 foc_republic_origin.24.name:0 "The Kuat Expansion"
 foc_republic_origin.24.desc:0 "§LThe Senate still tries to preserve order through procedure, even as war pushes every old rule toward its breaking point.§!\n\nThe new slipways at §HKuat Drive Yards§! have lit their furnaces. The Republic Navy gains the §HVenator-class Star Destroyer§! - a capital ship that is both fleet flagship and carrier - and from today its keel can be laid in any Republic military yard.\n\nThe expansion grant was signed in the Chancellor's office. Kuat's board knows perfectly well whose order this is.\n\n§YFixed milestone: conspiracy +10, recorded once.§!\n\n§HAdvanced Durasteel Armor§! is now unlocked. Kuat receives its orbital ring reward; if no ring, construction or ruins already occupy the site, a §Htier III orbital ring§! with §Hfour shipyards§! is completed immediately."
 foc_republic_origin.24.a:0 "Launch them."

 foc_republic_origin.25.name:0 "Order 66"
 foc_republic_origin.25.desc:0 "One encrypted instruction reaches the command channel of every clone legion at the same moment. It is numbered §H66§!.\n\nThe soldiers who carry it out do not hesitate and do not ask why. From Coruscant to the Outer Rim, the generals and senators loyal to the Senate are removed in a single night. The spires of the Jedi Temple burn until morning; Yoda and Windu do not walk out of them, and the Order is all but gone.\n\nThe man who led the assault into the Temple was the one they used to call the Chosen One.\n\nThe army of the Republic no longer belongs to the Republic."
 foc_republic_origin.25.a:0 "The age of the Republic is over."

 FOC_REPUBLIC_ORIGIN_KUAT_INVESTMENT_PROJECT:0 "Kuat Drive Yards Expansion"
 FOC_REPUBLIC_ORIGIN_KUAT_INVESTMENT_PROJECT_DESC:0 "Republic engineering will fund new heavy slipways at Kuat Drive Yards, large enough for a new generation of capital ship. Completion unlocks the §HVenator-class Star Destroyer§! and advances §HPalpatine's Plot§!.\n\nCompleting the expansion unlocks §HAdvanced Durasteel Armor§! and grants an orbital ring at Kuat. If no ring, construction or ruins already occupy the site, a §Htier III orbital ring§! with §Hfour shipyards§! is completed immediately."

 foc_republic_origin_clone_army_program:0 "Clone War Mobilization"
 foc_republic_origin_clone_army_program_desc:0 "The Kaminoan growth vats and the Republic's training pipeline run at full capacity, feeding population and fresh legions to the front without pause."

 foc_republic_origin_plot_progress_separatist_war:0 "Automatic scoring disabled"
 foc_republic_origin_plot_progress_postwar_powers:0 "Automatic scoring disabled"
 foc_republic_origin_plot_progress_clone_army:0 "Automatic scoring disabled"

 situation_foc_republic_origin_palpatine_plot:0 "Palpatine's Plot"
 situation_foc_republic_origin_palpatine_plot_type:0 "Palpatine's Plot"
 situation_foc_republic_origin_palpatine_plot_desc:0 "§YPre-war and wartime score: maximum 140§!\nFive choices: accept corporate donations, pass the Military Creation Act, close the audit, extend emergency powers, and refuse the Jedi investigation. Each favorable choice grants §G+20§!; the other choice grants §Y+0§!.\nFour fixed milestones: Naboo, the Clone Army Plan, Kuat shipyard expansion, and the Battle of Coruscant. Each counts §G+10§! once.\n§H100 + 40 = 140§!. All five favorable choices and all four milestones are required to reach 140. There is no monthly growth and no point farming through repeated events or approach changes.\n\n§YConfederate surrender: either victory route is sufficient§!\n§HStory route§!: complete the Coruscant and Utapau battle events and reach 140 conspiracy points.\n§HMilitary route§!: the engine must confirm a Republic victory against the CIS in their actual total war, or the Republic must destroy the CIS during that war. Colony counts, temporary controllers, and a missing CIS are not victory results. Status quo, a Republic defeat, or a third-party destruction of the CIS do not qualify. Neither 140 points nor the two battle events is required.\nIf unfavorable or mixed choices leave the conspiracy below 140, finish the war by military conquest, not by waiting for extra points. Both routes use the staged surrender settlement; the two commanders dying is not a separate victory condition.\n\nProgress beyond 140 is reserved for the post-war surrender and Order 66 closure, not for waiting out the war."
 situation_foc_republic_origin_palpatine_plot_monthly_change_tooltip:0 "§HAutomatic monthly growth: 0.§!\n\n§YPre-war and wartime score: maximum 140§!\nFive choices: accept corporate donations, pass the Military Creation Act, close the audit, extend emergency powers, and refuse the Jedi investigation. Each favorable choice grants §G+20§!; the other choice grants §Y+0§!.\nFour fixed milestones: Naboo, the Clone Army Plan, Kuat shipyard expansion, and the Battle of Coruscant. Each counts §G+10§! once.\n§H100 + 40 = 140§!. All five favorable choices and all four milestones are required to reach 140. There is no monthly growth and no point farming through repeated events or approach changes.\n\nUnfavorable or mixed choices that leave the score below 140 require the native total-war victory route; time adds no points."
 foc_republic_origin_plot_stage_whispers:0 "Whispers in the Senate"
 foc_republic_origin_plot_stage_whispers_desc:0 "Emergency authority is quietly gathering in the Chancellor's hands."
 foc_republic_origin_plot_stage_whispers_tooltip:0 "0–50: score recorded political choices and milestones. This stage does not automatically activate the clone army.\n§YPre-war and wartime score: maximum 140§!\nFive choices: accept corporate donations, pass the Military Creation Act, close the audit, extend emergency powers, and refuse the Jedi investigation. Each favorable choice grants §G+20§!; the other choice grants §Y+0§!.\nFour fixed milestones: Naboo, the Clone Army Plan, Kuat shipyard expansion, and the Battle of Coruscant. Each counts §G+10§! once.\n§H100 + 40 = 140§!. All five favorable choices and all four milestones are required to reach 140. There is no monthly growth and no point farming through repeated events or approach changes.\n\nUnfavorable or mixed choices that leave the score below 140 require the native total-war victory route; time adds no points."
 foc_republic_origin_plot_stage_clone_army:0 "Wartime Centralization"
 foc_republic_origin_plot_stage_clone_army_desc:0 "Recorded choices and completed milestones advance the conspiracy, not the years spent at war."
 foc_republic_origin_plot_stage_clone_army_tooltip:0 "§YPre-war and wartime score: maximum 140§!\nFive choices: accept corporate donations, pass the Military Creation Act, close the audit, extend emergency powers, and refuse the Jedi investigation. Each favorable choice grants §G+20§!; the other choice grants §Y+0§!.\nFour fixed milestones: Naboo, the Clone Army Plan, Kuat shipyard expansion, and the Battle of Coruscant. Each counts §G+10§! once.\n§H100 + 40 = 140§!. All five favorable choices and all four milestones are required to reach 140. There is no monthly growth and no point farming through repeated events or approach changes.\n\n§YConfederate surrender: either victory route is sufficient§!\n§HStory route§!: complete the Coruscant and Utapau battle events and reach 140 conspiracy points.\n§HMilitary route§!: the engine must confirm a Republic victory against the CIS in their actual total war, or the Republic must destroy the CIS during that war. Colony counts, temporary controllers, and a missing CIS are not victory results. Status quo, a Republic defeat, or a third-party destruction of the CIS do not qualify. Neither 140 points nor the two battle events is required.\nIf unfavorable or mixed choices leave the conspiracy below 140, finish the war by military conquest, not by waiting for extra points. Both routes use the staged surrender settlement; the two commanders dying is not a separate victory condition."
 foc_republic_origin_plot_stage_order_66:0 "Conspiracy Ready"
 foc_republic_origin_plot_stage_order_66_desc:0 "Conspiracy has reached 140: complete Coruscant and Utapau for story surrender, or win independently by full military conquest."
 foc_republic_origin_plot_stage_order_66_tooltip:0 "At 140, ordinary Confederate reinforcements stop; the Coruscant story raid remains exempt. Both battle events complete the story surrender route. Full-colony military conquest requires neither the score nor the battle events. After either victory, the existing staged settlement and Order 66 close the situation without rewriting wartime choices."
 foc_republic_origin_plot_approach_emergency_powers:0 "Maintain Emergency Powers"
 foc_republic_origin_plot_approach_emergency_powers_desc:0 "The Senate extends the state of emergency again and again, and the Chancellor never refuses."
 foc_republic_origin_plot_approach_emergency_powers_tooltip:0 "§HThis approach produces no automatic progress.§!\n§YPre-war and wartime score: maximum 140§!\nFive choices: accept corporate donations, pass the Military Creation Act, close the audit, extend emergency powers, and refuse the Jedi investigation. Each favorable choice grants §G+20§!; the other choice grants §Y+0§!.\nFour fixed milestones: Naboo, the Clone Army Plan, Kuat shipyard expansion, and the Battle of Coruscant. Each counts §G+10§! once.\n§H100 + 40 = 140§!. All five favorable choices and all four milestones are required to reach 140. There is no monthly growth and no point farming through repeated events or approach changes.\n\nUnfavorable or mixed choices that leave the score below 140 require the native total-war victory route; time adds no points."
 foc_republic_origin_rebellion_war_effort:0 "Rebel War Effort"
 foc_republic_origin_rebellion_war_effort_desc:0 "Hidden yards, salvaged Imperial armour plate and refits at any cost let Mon Calamari cruisers stand in the line against Imperial-class Star Destroyers. It belongs to the war against the Empire and to nothing after it."

 foc_republic_origin.171.name:0 "Death Star I Destroyed"
 foc_republic_origin.171.desc:0 "Death Star I has been destroyed. The Rebels receive their existing victory reward, and the old Death Star attack bonus ends immediately.\n\nA player Empire receives the Death Star II engineering project immediately; completion triggers Bothan intelligence and deploys the station at Endor. An AI Empire reveals and deploys its unfinished station exactly four years after this loss. Existing Imperial support-fleet rules remain in effect."
 foc_republic_origin.171.a:0 "A great victory. The war is not over."

 foc_republic_origin.182.name:0 "We Must Destroy the New Republic Capital"
 foc_republic_origin.182.desc:0 "§HStarkiller Base is fully charged.§! The senate, fleet command and principal communications network of §Y[event_target:foc_story_new_republic_strike_country.GetName]§! are concentrated on §H[event_target:foc_story_new_republic_strike_target.GetName]§!.\n\nOpen the Starkiller Base firing interface and designate that world as the primary target. Destroying the New Republic capital will shatter its central government and force the survivors to retreat to D'Qar as the Resistance."
 foc_republic_origin.182.a:0 "Mark the New Republic capital as Target One."

 foc_republic_origin.180.name:0 "Executor-class Commissioned"
 foc_republic_origin.180.desc:0 "Executor guards Endor, Lusankya guards Coruscant, and Punisher guards Jakku. Each of the three groups consists of one Executor-class flagship and thirty Imperial II-class escorts. The unique flagships are commissioned once and are never rebuilt after destruction."
 foc_republic_origin.180.a:0 "Let them see it in their skies."

 FOC_REPUBLIC_ORIGIN_YODA_NAME:0 "Yoda"
 FOC_REPUBLIC_ORIGIN_WINDU_NAME:0 "Mace Windu"
 FOC_REPUBLIC_ORIGIN_KENOBI_NAME:0 "Obi-Wan Kenobi"
 FOC_REPUBLIC_ORIGIN_ANAKIN_NAME:0 "Anakin Skywalker"
 FOC_REPUBLIC_ORIGIN_VADER_NAME:0 "Darth Vader"
 FOC_REPUBLIC_ORIGIN_CODY_NAME:0 "Commander Cody"
 FOC_REPUBLIC_ORIGIN_TARKIN_NAME:0 "Wilhuff Tarkin"

 foc_republic_origin_jedi_order:0 "The Jedi Order"
 foc_republic_origin_jedi_order_desc:0 "The Order belongs to no member system, yet it has kept the peace on the Republic's behalf for a thousand generations: settling disputes, escorting envoys, steadying the frontier, and drawing a lightsaber when nothing else will serve."
 foc_republic_origin_jedi_generals:0 "Jedi Generals"
 foc_republic_origin_jedi_generals_desc:0 "Jedi hold temporary commissions and take the field with the clone legions on every front. It is the first time the Order has gone to war as an institution, and it will be the last."
 foc_republic_origin_jedi_survivor:0 "Surviving Jedi"
 foc_republic_origin_jedi_survivor_desc:0 "One of them lived. Negligible in fleet strength, and everything to the people who now know the Order was not entirely destroyed."
 foc_republic_origin_inquisitorius:0 "The Inquisitorius"
 foc_republic_origin_inquisitorius_desc:0 "Imperial Inquisitors hunt what remains of the Jedi across the galaxy. Effective, and hated."
 foc_republic_origin_senate_backlash:0 "Senate Backlash"
 foc_republic_origin_senate_backlash_desc:0 "The Order pointed at the Chancellor's own office. The Senate closed ranks around him, and the Jedi were the ones painted as overreaching."

 foc_republic_origin.6.name:0 "The Jedi Council"
 foc_republic_origin.6.desc:0 "From the spires of the Temple on Coruscant, the Jedi Council sends its greetings to the new session.\n\nThe Order belongs to no member system and answers to no senator. For a thousand generations it has settled disputes, escorted envoys and steadied the frontier, holding this vast and loose union together. In return, the Republic has never asked what happens inside the Temple.\n\nGrand Master §HYoda§! and Master §HMace Windu§! attend for the Order. Yoda adds only one remark: the Force has been uneasy of late.\n\nThe §HJedi Temple§! is open on Coruscant. While it stands, the Republic can raise Jedi formations from it."
 foc_republic_origin.6.a:0 "May the Force be with the Republic."

 foc_republic_origin.7.name:0 "Jedi Generals"
 foc_republic_origin.7.desc:0 "With the Outer Rim in revolt, the Senate resolves that Jedi are to hold temporary commissions as commanders of the clone legions.\n\nInside the Temple the argument is bitter. Some say keepers of the peace should never be generals. Others say the Republic needs them. In the end the Senate sends the lightsabers to the front, and §HObi-Wan Kenobi§! takes a general's rank alongside his former apprentice §HAnakin Skywalker§!.\n\nIt is the first time the Order has gone to war as an institution. In closed session Yoda says something nobody wants entered into the record: this war will change the Order, not the other way round."
 foc_republic_origin.7.a:0 "They will be on every front."

 foc_republic_origin.8.name:0 "The Council's Misgivings"
 foc_republic_origin.8.desc:0 "§LThere is no grand ceremony—only an order, a report, and consequences that no one will later be able to reverse.§!\n\nThe Grand Master asks to see you privately.\n\nThe Order senses a dark side presence, he says, here on Coruscant, close to the centre of power - but something clouds the Force and they cannot see whose it is. The Council requests authority to investigate the office of the Supreme Chancellor.\n\nNothing like it has happened in the history of the Republic. Grant it, and you publicly doubt a wartime Chancellor. Refuse, and the Order will obey, and go on searching in the dark.\n\n§YThis is one of the five key decisions. Only the option favorable to Palpatine counts 20 points; the other counts 0. Each decision is recorded once.§!"
 foc_republic_origin.8.a:0 "Authorize the investigation. (Original backlash; conspiracy +0)"
 foc_republic_origin.8.b:0 "Suppress the matter. (Original resources; conspiracy +20)"

 foc_republic_origin.26.name:0 "Someone Survived"
 foc_republic_origin.26.desc:0 "A battered light freighter requests landing clearance at the edge of the base, squawking a transponder code that belonged to a Jedi flight decommissioned years ago.\n\nThe figure who steps out when the ramp drops still has Temple ash on his clothes: §HObi-Wan Kenobi§!, one of the few who got off Coruscant that night.\n\nThe first thing he says is not about himself. The man who carried out the purge, who cut his way through the Temple personally, was once his apprentice.\n\nBut the Order lives. That fact alone is enough to straighten the spine of the whole rebellion."
 foc_republic_origin.26.a:0 "Get the word out."

 foc_republic_origin.27.name:0 "The Inquisitors"
 foc_republic_origin.27.desc:0 "Order 66 did not kill every Jedi. A handful slipped away that night and disappeared into the folds of the galaxy.\n\nThe Emperor has long since prepared for this. Fallen Force-sensitives are gathered, given black armour and spinning blades, and formed into a body answerable to him alone: the §HInquisitorius§!.\n\nThey have exactly one task - find the rest."
 foc_republic_origin.27.a:0 "Leave none of them."
 foc_republic_origin_darth_vader:0 "Darth Vader"
 foc_republic_origin_darth_vader_desc:0 "Not a fleet doctrine. One man, and the Empire's armies and officers behave very differently once he is aboard - out of loyalty, and out of fear."

 foc_republic_origin.28.name:0 "The Chosen One"
 foc_republic_origin.28.desc:0 "The Temple is still burning.\n\nThe unit that carried out Order 66 there was led by a Jedi: the sharpest blade the Republic had, Obi-Wan Kenobi's apprentice, the one prophecy named as the Chosen One who would end the Sith. He walked into the place he grew up in, and never walked out of it under that name again.\n\nThe Emperor has given him a new one: §HDarth Vader§!.\n\nFrom now on the will of the Empire takes the field in person."
 foc_republic_origin.28.a:0 "Rise, my apprentice."
 foc_republic_origin.28.b:0 "We lost more than a Temple."
 building_foc_republic_origin_jedi_temple:0 "Jedi Temple"
 building_foc_republic_origin_jedi_temple_desc:0 "Five spires have stood on Coruscant for a thousand years. This is where the Council sits, where every padawan in the galaxy is trained, and where the archives and the continuity of the whole Order are kept.\n\nWhile the Temple stands, the Republic can raise Jedi formations from it."
 foc_republic_origin_jedi_padawans:0 "Jedi Padawans"
 foc_republic_origin_jedi_padawans_desc:0 "Apprentices who have not yet faced the Trials, sent to the front early under the pressure of war. Their blades are not steady yet, and they are still more than enough to make a droid legion pay."
 foc_republic_origin_jedi_knights:0 "Jedi Knights"
 foc_republic_origin_jedi_knights_desc:0 "Jedi who have passed the Trials. One Knight can hold a company of droids, and morale is not something they have to think about."
 foc_republic_origin_jedi_masters:0 "Jedi Masters"
 foc_republic_origin_jedi_masters_desc:0 "Masters sent by the Council itself. They do not usually take part in ground fighting - and where they do, there is no longer a front line."

 foc_republic_origin.12.name:0 "The Combines' Proposal"
 foc_republic_origin.12.desc:0 "§LCoruscant’s lights illuminate an entire world, but not the shadow gathering at the center of power.§!\n\nThe Trade Federation, the Banking Clan and the Techno Union have sent a single delegation. What they want is phrased very politely: legal recognition for the combines' 'escort forces', in exchange for a startling voluntary contribution and a cut in lane duties.\n\nEveryone understands what those escort forces are. They are fleets that answer to no senator.\n\nThe Chancellor's office has taken no position. It has simply put the proposal on this session's order paper.\n\n§YThis is one of the five key decisions. Only the option favorable to Palpatine counts 20 points; the other counts 0. Each decision is recorded once.§!"
 foc_republic_origin.12.a:0 "Accept the donation. (Original resources; conspiracy +20)"
 foc_republic_origin.12.b:0 "Reject the proposal. (Original political cost; conspiracy +0)"

 foc_republic_origin.13.name:0 "The Military Creation Act"
 foc_republic_origin.13.desc:0 "§LCoruscant’s endless traffic lanes still blaze with light, yet the Republic’s fate has already begun to turn.§!\n\nThe Senate has spent an entire session on one bill: should the Republic have a standing army of its own?\n\nFor a thousand years its forces have been provided by its member systems. Supporters say the frontier is no longer safe. Opponents say an army answerable only to Coruscant will sooner or later be used by someone on Coruscant.\n\nThe vote is yours.\n\n§YThis is one of the five key decisions. Only the option favorable to Palpatine counts 20 points; the other counts 0. Each decision is recorded once.§!"
 foc_republic_origin.13.a:0 "Pass the Act. (Original military bonuses; conspiracy +20)"
 foc_republic_origin.13.b:0 "Rely on member-system forces. (Original resources; conspiracy +0)"

 foc_republic_origin.14.name:0 "An Unexplained Ledger"
 foc_republic_origin.14.desc:0 "§LThe Republic Archives would later seal this day under special classification, for too many galaxy-changing decisions began with an ordinary report.§!\n\nA routine audit turns up a payment. The sum is small, but it appears in the budget eleven times, and every time it goes to a shell company registered in the Outer Rim with no employees.\n\nFollowing it upward, the third layer runs into a file that cannot be opened without authorisation from the Chancellor's office.\n\nThe auditor's report ends with a question: continue?\n\n§YThis is one of the five key decisions. Only the option favorable to Palpatine counts 20 points; the other counts 0. Each decision is recorded once.§!"
 foc_republic_origin.14.a:0 "Pursue the audit. (Original investigation costs; conspiracy +0)"
 foc_republic_origin.14.b:0 "Close the case. (Original resources; conspiracy +20)"

 foc_republic_origin.15.name:0 "Renewal of Emergency Powers"
 foc_republic_origin.15.desc:0 "§LThe galaxy still believes the Republic can survive this crisis; the crisis itself is already remaking the Republic.§!\n\nThe wartime emergency is about to expire. By law the powers return to the Senate on that day.\n\nBut the front is still active, and fleet movements, requisitions and provincial martial law all hang on that one authorisation. The Chancellor says only this: he will hand the powers back personally, on the day the war ends.\n\nThe Senate is waiting to see where you stand.\n\n§YThis is one of the five key decisions. Only the option favorable to Palpatine counts 20 points; the other counts 0. Each decision is recorded once.§!"
 foc_republic_origin.15.a:0 "Extend the emergency. (Original wartime bonuses; conspiracy +20)"
 foc_republic_origin.15.b:0 "Return the powers on time. (Original oversight effects; conspiracy +0)"

 foc_republic_origin.22.name:0 "Kuat Expansion after the Clone Army Plan"
 foc_republic_origin.22.desc:0 "Once the §HClone Army Plan§! has been resolved, the Republic must prepare true capital-ship production for the war ahead. §HKuat Drive Yards§! submits a comprehensive expansion plan to the Senate.\n\nThe project can proceed only while the Republic controls Kuat. Losing the system aborts the project; retaking it requires starting again. Its engineering cost is tuned for roughly §Height years§! of early-Republic research."
 foc_republic_origin.22.a:0 "Break ground."

 foc_republic_origin.23.b:0 "Rely on member-system militias. (Original effects; conspiracy +0)"

 foc_republic_origin.181.name:0 "The Tarkin Doctrine"
 foc_republic_origin.181.desc:0 "The battlestation is in service, which raises the question of what it is actually for.\n\nGovernor Tarkin's answer is set out in a memorandum to the Emperor: §Hrule through the fear of force, rather than through force itself§!. A station that can destroy a world only has to exist for a thousand systems to abandon the idea of resistance. It never has to fire.\n\nThe other view is plainer. The Empire still has to collect taxes, maintain roads and issue rations. Fear holds for a while. It does not hold for a century."
 foc_republic_origin.181.a:0 "Rule through fear. (Large gains in compliance and stability, more crime and misery)"
 foc_republic_origin.181.b:0 "Rule through administration. (Output, policing and living standards)"

 foc_republic_origin_asset_mon_cala:0 "Mon Calamari Yards"
 foc_republic_origin_asset_mon_cala_desc:0 "The submerged yards of Mon Cala build the sturdiest cruisers in the galaxy. Whoever holds them replaces losses faster."
 foc_republic_origin_asset_kamino:0 "Kaminoan Growth Facilities"
 foc_republic_origin_asset_kamino_desc:0 "The Kaminoan cloning lines are still running. Whichever side holds this world raises soldiers at a rate nobody should have."
 foc_republic_origin_asset_kuat:0 "Kuat Drive Yards"
 foc_republic_origin_asset_kuat_desc:0 "The largest military shipbuilding industry in the galaxy. Hold Kuat and warships come cheaper and faster."
 foc_republic_origin_tarkin_doctrine:0 "The Tarkin Doctrine"
 foc_republic_origin_tarkin_doctrine_desc:0 "Rule through the fear of force rather than through force itself. Adopting the doctrine immediately removes the §Rungarrisoned stability penalty§! from Imperial colonies and prevents it from returning, while all Imperial planets gain §G+8 Stability§!. Compliance comes quickly, and so do the people with nothing left to lose."
 foc_republic_origin_new_order_administration:0 "New Order Administration"
 foc_republic_origin_new_order_administration_desc:0 "The Empire still has to collect taxes, maintain roads and issue rations. Fear holds for a while; administration holds for a century."
 foc_republic_origin_combine_resentment:0 "Combine Resentment"
 foc_republic_origin_combine_resentment_desc:0 "Turned down, the commercial combines moved their capital and their shipping lanes somewhere else."
 foc_republic_origin_military_creation_act:0 "Military Creation Act"
 foc_republic_origin_military_creation_act_desc:0 "For the first time the Republic has armed forces of its own."
 foc_republic_origin_emergency_powers:0 "Wartime Emergency Powers"
 foc_republic_origin_emergency_powers_desc:0 "Movements, requisitions and martial law no longer require a vote. The efficiency is remarkable."
 foc_republic_origin_senate_oversight:0 "Senate Oversight"
 foc_republic_origin_senate_oversight_desc:0 "Every order goes through a vote. The war is fought slowly, and the Republic is still a republic."
 foc_republic_origin_militia_levies:0 "Member-System Levies"
 foc_republic_origin_militia_levies_desc:0 "With no clone legions, the front is filled by troops each member system sends itself. Badly equipped, badly coordinated, and belonging to no one man."
 foc_republic_origin_command.1.release_timeline:0 "Force-release the current story timeline."
 foc_republic_origin_command.1.fo_origin_repair:0 "Repair and continue the First Order Starkiller aftermath."
 foc_republic_origin_command.1.trigger_first_order:0 "Trigger the ordinary-origin First Order crisis now."
