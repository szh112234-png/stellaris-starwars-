l_english:
 FOC_KHAN_SMALL_ADAPTIVE_DEFENSE_ARMOR_DESC:0 "Layered durasteel and field-effect buffers disperse impacts, allowing even small hulls to survive sustained fire."
 FOC_KHAN_MEDIUM_ADAPTIVE_DEFENSE_ARMOR_DESC:0 "Adaptive durasteel channels explosive force through a reinforced medium hull while preserving structural integrity."
 FOC_KHAN_ADAPTIVE_DEFENSE_ARMOR_DESC:0 "Advanced durasteel combines high-strength alloys, reactive plating, and field buffers into a capital ship’s final line of defense."
 FOC_KHAN_DEFENCE_TURBO_G_EC_DESC:0 "High-speed tracking arrays guide green turbolaser fire into incoming fighters and ordnance before they reach the hull."
 FOC_REBEL_DEFENCE_TURBO_R_EC_DESC:0 "High-speed tracking arrays guide red turbolaser fire into a dense close-defense screen around the capital ship."
