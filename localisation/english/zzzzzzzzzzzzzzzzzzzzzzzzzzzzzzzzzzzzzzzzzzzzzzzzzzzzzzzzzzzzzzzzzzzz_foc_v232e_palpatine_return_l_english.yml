 foc_v232e_palpatine_return.2.name:0 "The Emperor Returns: The Dead Speak Again"
 foc_v232e_palpatine_return.2.desc:0 "§LThe voice comes first. Across military channels, intercepted transmissions, and the storms of Exegol, a presence that should have vanished at Endor speaks again.§!\n\nEmperor Palpatine truly died aboard Death Star II. Darth Vader cast him into the reactor shaft, and the station's destruction consumed his body. But the Sith Eternal preserved fragments of his consciousness and spent years growing vessels capable of containing it. On Exegol, one of those vessels has finally endured.\n\nA scarred clone opens its eyes. The throne is occupied once more. First Order remnants and the Sith Eternal kneel before the same master, and the Xyston fleet answers to his command. §HPalpatine has returned, and the Final Order now has its Emperor.§!"
 foc_v232e_palpatine_return.2.a:0 "The dead Emperor rules again."
