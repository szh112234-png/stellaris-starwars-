 foc_khan_first_order_power:0 "First Order Total Mobilization"
 foc_khan_first_order_power_desc:0 "The First Order opens every arsenal in the Unknown Regions and enters the war with fleet power capable of challenging ancient civilizations."
 foc_khan_final_order_power:0 "Final Order Doomsday Mobilization"
 foc_khan_final_order_power_desc:0 "The Sith Eternal awaken forbidden technology beneath Exegol, granting the Final Order the power to extinguish the galaxy."

 foc_khan.5.name: "The First Order Descends"
 foc_khan.5.desc: "The Galactic Community has failed to secure peace. The First Order has established its military core at Ilum, deploying both the Supremacy and a functioning Starkiller Base. It now treats the entire galaxy as hostile."
 foc_khan.5.a: "The galaxy must unite."

 foc_khan.63.name: "Rise of the Final Order"
 foc_khan.63.desc: "The destruction of Starkiller Base and the Supremacy has not ended the war. The surviving First Order formations change their banners and join the Final Order at Exegol."
 foc_khan.63.a: "The true final battle begins."

 foc_khan.91.name: "The Last Jedi"
 foc_khan.91.desc: "The Final Order on Exegol has fallen. Palpatine and the Sith Eternal have lost the fleet meant to rule the galaxy, uprisings erupt across countless systems, and the remaining First Order formations rapidly collapse. Rey carries the legacy of the Jedi forward; while hope endures, the Jedi will never truly vanish."
 foc_khan.91.a: "The Force will be with us, always."



 foc_khan.5.b: "Accept First Order rule and become its vassal."
 foc_khan.63.b: "Submit as a Final Order Territory and preserve our civilization."
 foc_khan.64.name: "A New Master"
 foc_khan.64.desc: "The First Order has been absorbed by the Final Order. Our previous submission has transferred with it, and we must now answer directly to the Sith Eternal on Exegol."
 foc_khan.64.a: "We have no choice."
 foc_khan.81.name: "The Sith Eternal Fleet Is Complete"
 foc_khan.81.desc: "The underground shipyards of Exegol have delivered their final reinforcement wave. A cumulative total of 864 Xyston-class Star Destroyers has joined the Final Order; no further annual Xyston support will arrive."
 foc_khan.81.a: "The galaxy faces an unprecedented fleet."

 foc_khan_mandator: "Mandator IV-class Dreadnought"
 foc_khan_eclipse: "Eclipse-class Super Star Destroyer"
 NAME_FOC_KHAN_MANDATOR: "Mandator IV-class Dreadnought"
 NAME_FOC_KHAN_ECLIPSE: "Eclipse-class Super Star Destroyer"
 foc_khan.46.name: "First Order Reinforcement Corridor"
 foc_khan.46.desc: "First Order annual reinforcements have reached Ilum. Each support fleet contains: Lowest, 4 Imperial + 3 Resurgent + 1 Mandator; Beginner, 8 Imperial + 5 Resurgent + 1 Mandator; Intermediate, 12 Imperial + 8 Resurgent + 1 Mandator; High and Madness, 16 Imperial + 10 Resurgent + 1 Mandator. Each annual wave contains 1 / 2 / 3 / 4 / 4 fleets, and support stops after 864 ships."
 foc_khan.46.a: "Their war machine continues to expand."

 FOC_KHAN_ENGINEERING_FLEET: "First Order Engineering Fleet"
 FOC_KHAN_INVASION_FORCE: "First Order Ground Assault Group"
 FOC_KHAN_STORMTROOPER_ARMY: "First Order Stormtrooper Corps"
 foc_khan_vassal.2.name:0 "First Order Ultimatum"
 foc_khan_vassal.2.desc:0 "Our war against the First Order is turning against us. We may preserve our empire by accepting First Order rule as an Order Territory, or continue the war."
 foc_khan_vassal.2.a:0 "Become a First Order Territory"
 foc_khan_vassal.2.b:0 "We will never submit"
 foc_khan_vassal.3.name:0 "Final Order Ultimatum"
 foc_khan_vassal.3.desc:0 "The Final Order demands unconditional submission. We may survive as a Final Order Territory, or continue the war."
 foc_khan_vassal.3.a:0 "Become a Final Order Territory"
 foc_khan_vassal.3.b:0 "Defy the Final Order"
 foc_khan_mandator_plural: "Mandator IV-class Dreadnoughts"
 foc_khan_eclipse_plural: "Eclipse-class Super Star Destroyers"
 foc_khan_vassal.11.name:0 "First Order Diplomacy"
 foc_khan_vassal.11.desc:0 "The First Order accepts only unconditional submission. We may become an Order Territory and preserve our empire."
 foc_khan_vassal.11.loyal_desc:0 "We have become a First Order Territory. While we fulfill our territorial obligations, its fleets and Starkiller Base will regard us as friendly."
 foc_khan_vassal.11.a:0 "Submit to the First Order"
 foc_khan_vassal.11.b:0 "Rebel against the First Order"
 foc_khan_vassal.12.name:0 "Final Order Diplomacy"
 foc_khan_vassal.12.desc:0 "The Final Order demands unconditional obedience. We may become an Order Territory and avoid annihilation."
 foc_khan_vassal.12.loyal_desc:0 "We have submitted to the Final Order and are regarded as friendly."
 foc_khan_vassal.12.a:0 "Submit to the Final Order"
 foc_khan_vassal.12.b:0 "Rebel against the Final Order"
 foc_khan_vassal.close:0 "End communications"
 foc_khan_vassal.rebellion_cooldown:0 "An Order Territory cannot rebel during the first five years after submission."
 foc_khan_starkiller_fortress_network:0 "Starkiller Fortress Network"
 foc_khan_starkiller_fortress_network_desc:0 "A layered planetary defence grid protects Starkiller Base against orbital bombardment and strengthens its defensive armies."
 foc_khan_supremacy_heavy_ark_slowdown:0 "Supremacy Heavy Arkship Hull"
 foc_khan_supremacy_heavy_ark_slowdown_desc:0 "The sixty-kilometer hull carries shipyards, cities, and the highest command. It turns slowly, but sustains formidable firepower and endurance across an entire front."
 preset_foc_khan_satrapy:0 "Order Territory"
 preset_foc_khan_satrapy_desc:0 "A territory bound to the First Order or Final Order."

 FOC_KHAN_FIRST_ORDER_MONTHLY_SUPPORT:0 "First Order Annual Reinforcement Fleet"
 FOC_KHAN_FINAL_ORDER_MONTHLY_SUPPORT:0 "Final Order Annual Reinforcement Fleet"

 foc_khan.1003.name:0 "A Star System Erased"
 foc_khan.1003.desc:0 "Starkiller Base has destroyed the §H[event_target:foc_khan_forced_starkiller_target_system.GetName] System§!, which was controlled by §Y[event_target:foc_khan_forced_starkiller_target_country.GetName]§!. Its star, planets, stations, and every life within were erased in a single attack.\n\nAs long as this weapon remains operational, no nation in the galaxy is safe."
 foc_khan.1003.a:0 "Starkiller Base must be destroyed immediately"

 foc_khan_spawn_corridor_acceleration:0 "Crisis Launch Acceleration"
 foc_khan_spawn_corridor_acceleration_desc:0 "Newly arrived fleets race along cleared launch corridors from Ilum or Exegol, preventing massive formations from choking the assembly zone."

