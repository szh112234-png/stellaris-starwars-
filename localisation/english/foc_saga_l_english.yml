# =============================================================================
 foc_balance.10.name:0 "The Cost of Order"
 foc_balance.10.desc:0 "The Interior Ministry's quarterly report reaches one conclusion: the cost of holding the New Order together is getting away from us.\n\nFor twenty years a governor's office and a token garrison were enough in each Outer Rim sector. That worked not because of troop numbers but because nobody believed resistance meant anything.\n\nSomeone believes it now.\n\nStrikes, sabotage, graffiti on comm towers, convoys that do not arrive — no single incident justifies moving a fleet, and together they are dragging administrative capacity down across the Rim. And the pattern is unmistakable: §Hworlds with no Imperial fleet overhead are markedly worse.§!\n\nThe sector governors are asking for the same thing, in the same words: leave us ships.\n\n§YThe Empire enters a state of unrest that worsens with each Rebel success. In addition, any colony with no Imperial fleet in its system suffers a further stability and output penalty — it returns the month a fleet leaves, and lifts the moment one returns.§!"
 foc_balance.10.a:0 "Spread the fleet out and hold the ground."
 foc_saga_rebel_step_1_spark:0 "The Spark"
 foc_saga_rebel_step_1_spark_desc:0 "Three base worlds are holding. The Alliance is still weak; this step only lets it survive."
 foc_saga_rebel_step_2_scarif:0 "The Scarif Archive"
 foc_saga_rebel_step_2_scarif_desc:0 "Every original engineering file for the Empire's superweapon programmes. It is worth more than one exhaust port."
 foc_saga_rebel_step_3_yavin:0 "After Yavin"
 foc_saga_rebel_step_3_yavin_desc:0 "A Death Star was destroyed by fewer than thirty fighters. Since that day volunteers arrive by the formation."
 foc_saga_rebel_step_4_uprising:0 "The Inner Rim Rises"
 foc_saga_rebel_step_4_uprising_desc:0 "A dozen systems changed colours in one week. The Alliance has a rear area now, not just hiding places."
 foc_saga_rebel_step_5_kuat:0 "The Kuat Slips"
 foc_saga_rebel_step_5_kuat_desc:0 "The largest military industry in the galaxy has changed hands. Sixty percent of Imperial Navy tonnage was launched here."
 foc_saga_rebel_step_6_coruscant:0 "Coruscant Falls"
 foc_saga_rebel_step_6_coruscant_desc:0 "The capital has changed hands and the Empire has lost its centre. What remains is taking the Rim back one system at a time."
 foc_saga_imperial_unrest_1:0 "The Sectors Wait and See"
 foc_saga_imperial_unrest_1_desc:0 "The Rebels are holding. Sector governors still keep office hours, and have started reporting lower tax figures."
 foc_saga_imperial_unrest_2:0 "Fear Devalued"
 foc_saga_imperial_unrest_2_desc:0 "A Death Star was destroyed. The one thing the New Order runs on has been shown to be breakable."
 foc_saga_imperial_unrest_3:0 "Unrest Everywhere"
 foc_saga_imperial_unrest_3_desc:0 "Both Death Stars are gone. Governors are being detained by their own garrisons and local assemblies are sitting again."
 foc_saga_planet_ungarrisoned:0 "No Fleet Overhead"
 foc_saga_planet_ungarrisoned_desc:0 "This penalty is checked only while the Galactic Empire actually controls the colony. If any other country occupies or controls it, the penalty is removed automatically."

 foc_reb.6.name:0 "Mon Calamari Star Cruiser Design"
 foc_reb.6.desc:0 "With the Imperial Rebellion now in existence, the shipwrights of Mon Calamari have finally released the military cruiser plans they kept hidden from Imperial requisition. Until now, the few commissioned hulls could exist only as scripted wartime ships; the class was not available for standard yard construction.\n\nThe MC80 reactor, distributed shield grid, heavy turbolasers and fighter decks have now been standardized into a complete production design.\n\n§YMC80 Cruiser construction is now unlocked. The Galactic Republic cannot obtain this construction permission early.§!"
 foc_reb.6.a:0 "Distribute the design to the fleet yards."
