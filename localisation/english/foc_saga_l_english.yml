l_english:

 FOC_SAGA_LUKE_NAME:0 "Luke Skywalker"
 FOC_SAGA_KYLO_NAME:0 "Kylo Ren"
 FOC_SAGA_KYLO_SUPREME_NAME:0 "Supreme Leader Kylo Ren"
 FOC_SAGA_BEN_SOLO_NAME:0 "Ben Solo"
 FOC_SAGA_GRIEVOUS_NAME:0 "General Grievous"
 FOC_SAGA_SEPARATIST_RAID_FLEET:0 "Separatist Raiding Group"

 foc_luke.10.name:0 "Yavin: A New Hope"
 foc_luke.10.desc:0 "When the Death Star came apart above Yavin IV, three fighters were left on the Alliance's tactical display.\n\nThe final run was flown by a pilot nobody knew. He switched off his targeting computer and put the torpedoes into a two-metre exhaust port by hand. Nobody can explain how, except the old man who flew out with him — and the old man had already died inside the station.\n\nThe pilot's name is §HLuke Skywalker§!, of Tatooine, previously a moisture farmhand.\n\nHe now serves in our command."
 foc_luke.10.a:0 "He proved the Empire can be beaten."

 foc_luke.11.name:0 "Dagobah: The Last Master"
 foc_luke.11.desc:0 "Skywalker left formation without authorisation. His X-wing's last recorded heading pointed at §HDagobah§! — a hot, fogbound swamp world that is almost blank on our charts.\n\nHe came back months later, covered in mud. He says he found someone there: a creature barely a metre tall who puts his sentences in the wrong order. Before the Republic fell, that creature was Grand Master of the Jedi Council. He has lived alone in that bog for twenty years.\n\nHe taught Skywalker one thing: do it, or don't. There is no trying.\n\nHe told him something else, which Skywalker has not repeated."
 foc_luke.11.a:0 "While a master survives, the Order survives."

 foc_luke.12.name:0 "Bespin: The Truth"
 foc_luke.12.desc:0 "The Cloud City operation failed completely. Solo was frozen in carbonite and handed to a bounty hunter; Skywalker fought Darth Vader alone in a reactor shaft and lost his right hand along with his lightsaber.\n\nWhen we pulled him out of the underside vent, he did not talk about the injury. He said only that Vader told him one thing at the end.\n\n§HThe man who killed his father is his father.§!\n\nMedical fitted the prosthetic. Nothing in the bay can repair the other thing. He must now decide for himself whether that message is a rope down into the dark, or a man who can still be pulled back."
 foc_luke.12.a:0 "Put the blade away. The Jedi do not win by rage."
 foc_luke.12.b:0 "Then use that rage, and break the Empire with it."

 foc_luke.13.name:0 "Endor: Return of the Jedi"
 foc_luke.13.desc:0 "The shield generator fell to the ground team and Death Star II broke apart in orbit. What decided the war, however, happened in that station's throne room.\n\nSkywalker surrendered himself to the Emperor in order to see Vader one last time. The Emperor told him to strike his father down and take the place beside the throne. He won the duel — and then threw the lightsaber away and said he was a Jedi, as his father had been before him.\n\nThe Emperor began to kill him with Force lightning. And then the black armour moved: Darth Vader picked the Emperor up and threw him into the reactor shaft.\n\nUnder the mask was a dying old man. §HAnakin Skywalker§! was burned on the forest moon of Endor. His son lit the pyre."
 foc_luke.13.a:0 "The Jedi have returned."
 foc_luke.20.name:0 "Ossus: The New Jedi Temple"
 foc_luke.20.desc:0 "In the peace following the Galactic Treaty, Ben Solo, son of Han Solo and Leia Organa, is already showing immense but unstable Force potential. Luke Skywalker formally begins building a new Jedi Temple on §HOssus§!, taking Ben among the first students he intends to train personally.\n\nAround the same period, a girl named §HRey§! is born. No one yet knows that she will one day enter a struggle between light and darkness that has already consumed generations."
 foc_luke.20.a:0 "Put the Order back on its feet."
 foc_luke.21.name:0 "Fall of the New Jedi Temple"
 foc_luke.21.desc:0 "As the First Order prepares to wage open war, Palpatine, working through the cloned proxy Snoke, has spent years poisoning Ben Solo’s mind. Luke senses overwhelming darkness in Ben’s sleep and, for one terrible instant, ignites his lightsaber.\n\nBen wakes in terror and breaks completely. Lightning and fire consume the new Jedi Temple on Ossus. He abandons his old name, becomes §HKylo Ren§!, and joins the First Order. Luke severs himself from the Force and retreats into exile on §HAhch-To§!.\n\nThe disaster comes only shortly before the First Order begins its open blitzkrieg."
 foc_luke.21.a:0 "That instant was my failure."

 foc_luke.22.name:0 "Ahch-To: The Last Jedi"
 foc_luke.22.desc:0 "Skywalker severed every trace of himself in the Force and vanished.\n\nHe went to §HAhch-To§!, an island world of sea stacks and seabirds. On one island stands a hollow tree, and inside it the original texts of the first Jedi — the true source of the Order.\n\nHe did not go there to guard them. He went there so the Order would end with him.\n\nHis argument is this: the Jedi were the flaw. At their height they were blind to the Sith, let the Sith grow from inside their own ranks, and let the Republic become an Empire in front of them. And the version he rebuilt himself burned down in a single night.\n\n§YLuke Skywalker leaves the active command roster.§!"
 foc_luke.22.a:0 "Let it end with me."

 foc_luke.30.name:0 "Crait: Two Suns"
 foc_luke.30.desc:0 "Beneath the salt of Crait the Resistance had been pushed into a last mine shaft, and the door had been breached by siege artillery.\n\nThen one man walked out alone and stood in front of the entire First Order ground force.\n\nThey put everything they had into him for a full minute. When the smoke cleared he was still standing, brushing his shoulder. Kylo Ren came down to duel him personally and ran a blade straight through him — and touched nothing.\n\n§HIt was not Luke Skywalker.§! He was still on the rocks of Ahch-To, spending the last of his strength to project himself half a galaxy away, holding that army in place while the survivors slipped out through the back of the ridge.\n\nThey got out. And on Ahch-To he sat down facing two setting suns, became one with the Force, and left his cloak on the stone.\n\nThe whole galaxy heard about it. From that day the First Order stopped being the thing nobody dares to fight."
 foc_luke.30.a:0 "The spark is out there now."

 foc_luke.31.name:0 "A Voice in the Force"
 foc_luke.31.desc:0 "The old tree on Ahch-To burned too, in the end. The Jedi texts were not inside it — someone had taken them first.\n\nAnd the figure who appeared beside the fire was not supposed to be there.\n\nHe said two things. The first was about failure: that it is the greatest teacher, and nobody wants to admit it. The second was about inheritance: what has to be passed on is not the books, but the people who pick them up.\n\nThe archives, the temples, the Council — all gone. But while anyone still stands up in the Force, the Order is not finished."
 foc_luke.31.a:0 "We are not the last."

 foc_kylo.10.name:0 "The Fall of Ben Solo"
 foc_kylo.10.desc:0 "The temple was not set alight from outside.\n\n§HBen Solo§! was the son of Leia Organa and Han Solo, and the strongest gift in the Skywalker line. From childhood a voice spoke inside his head — a presence calling itself §HSnoke§!, reaching in from the Unknown Regions, saying patiently: your family has always been looking for someone else when they look at you. They are afraid of you. Including the uncle who sent you away to that temple.\n\nThat night he opened his eyes and saw his uncle standing over his bed with a lit lightsaber.\n\nEverything the voice had told him was confirmed in that one instant.\n\nHe took several students, burned the temple, and dropped the name Solo. The name he chose for himself was §HKylo Ren§!."
 foc_kylo.10.a:0 "He will not turn back now."

 foc_kylo.11.name:0 "The Knights of Ren"
 foc_kylo.11.desc:0 "Those who left Yavin IV with him became something new: the §HKnights of Ren§!.\n\nSix of them, and six crude weapons — axe, glaive, crossbow, heavy blade. Not one lightsaber, and nothing that resembles Jedi or Sith issue. They preach no doctrine and hold no rites. They appear where they are needed and empty the place.\n\nKylo Ren leads them. Snoke gave him the band as a reward and as a leash.\n\nHis own crossguard saber is self-built: the kyber crystal is cracked, the energy will not hold, so the hilt has to vent at both sides. The two lateral blades are not a design. They are a fault."
 foc_kylo.11.a:0 "They answer to one man."

 foc_kylo.12.name:0 "Starkiller Base: The Bridge"
 foc_kylo.12.desc:0 "Starkiller Base was already breaking up, the thermal breach cutting down through the planet. On the narrow unrailed catwalk above the reactor, something else happened.\n\n§HHan Solo§! crossed an exploding installation for one reason: to walk out onto that bridge. He drew no weapon. He called one name — not Kylo Ren, but §HBen§!.\n\nAnd for a moment the man hesitated. He said he was being torn apart, that he needed help to break free of the pull of the light. He held out the lightsaber.\n\nThen he ignited it.\n\nSolo reached up and touched his son's face, and fell. Snoke never wanted a superweapon out of this. He wanted that one cut: only by severing the last tie does the student truly belong to the dark.\n\nThe price arrived immediately. After that cut he lost, in a snow forest, to an untrained scavenger."
 foc_kylo.12.a:0 "He killed his own way back."

 foc_kylo.13.name:0 "The Supremacy: Supreme Leader"
 foc_kylo.13.desc:0 "In the throne room of the Supremacy, Snoke was enjoying his own omniscience: he had read every wavering in his student's mind and knew exactly when the young man would ignite the blade and kill the prisoner.\n\nHe was right about the blade. He was simply wrong about which lightsaber was lying beside whose hand, and which way it was pointing.\n\n§HSnoke was cut in half by his own apprentice.§! The Praetorian Guard came at once, and Kylo Ren fought that room back to back with the scavenger.\n\nWhen it was over he offered her his hand and asked her to burn all of it down with him — Jedi, Sith, Resistance, First Order, all of it. She refused.\n\nSo he took the title of §HSupreme Leader§! and sat in a chair nobody would defend for him."
 foc_kylo.13.a:0 "Let the old things die."

 foc_kylo.14.name:0 "The Mask, Remade"
 foc_kylo.14.desc:0 "He had smashed that helmet himself, in a lift.\n\nNow it is back. The fragments were fitted together one by one and the seams filled with molten red alloy, so the healed cracks run across the mask like veins. He has not explained why he wanted it repaired.\n\nAt the same time a signal came out of the deep Unknown Regions on no known channel. It repeats a single summons, and the coordinates point at a planet on no chart: §HExegol§!.\n\nHe flew there alone. Waiting for him was a man who should have died in a reactor shaft above Endor a very long time ago."
 foc_kylo.14.a:0 "Go and meet the one who did not die."

 foc_kylo.15.name:0 "A Dyad in the Force"
 foc_kylo.15.desc:0 "The same phenomenon has been reported at both ends of the galaxy: two people seeing and hearing each other with no warning, close enough that water carried on one set of hands lands on the other's deck. Distance does not affect it. Shielding does not affect it.\n\nThe old records call this a §Hdyad in the Force§!: a pairing so rare that the two of them constitute a single power. It cannot be cut, and neither side can close it alone.\n\nFor the First Order this is an enormous tactical hole — whatever is in the Supreme Leader's head can be seen by someone else at any moment.\n\nFor the Supreme Leader himself it is something else. Every connection forces him to look again at what he did on that catwalk."
 foc_kylo.15.a:0 "They can see each other."

 foc_kylo.16.name:0 "The Return of Ben Solo"
 foc_kylo.16.desc:0 "Two things happened at once.\n\nOut towards Exegol he had just been run through by the scavenger's blade, and then healed by the same hands — she told him she had wanted to take Ben Solo's hand.\n\nHalf a galaxy away, §HLeia Organa§! spent the last of her life reaching through the Force to call her son's name, and stopped breathing.\n\nHe sat in the wreckage a long time. His father appeared in front of him — a man he killed himself, who only repeated the same line as before: come home.\n\nHe threw the cracked crossguard saber into the sea.\n\nThe man who stood up was not Kylo Ren. §HBen Solo§! had come back, and he knew where he was going."
 foc_kylo.16.a:0 "He finally said the name."

 foc_kylo.17.name:0 "Exegol: The Last Skywalker"
 foc_kylo.17.desc:0 "Beneath the Sith altar Palpatine drained the Force out of both of them and made himself young again. In the end the two of them took that price back.\n\nThe Final Order fleet burned into fragments across the Exegol sky. When the dust settled there was one body at the bottom of the pit, not moving.\n\n§HBen Solo§! climbed down, lifted her, and gave her everything he had left. She opened her eyes and said his name — the first time in thirty years anyone had called him that, and the first time he answered.\n\nThen he smiled, and fell, and his body became the Force. Only the cloak was left on the ground.\n\nThe Skywalker bloodline ends here. The name was picked up later by someone else, under two suns on Tatooine."
 foc_kylo.17.a:0 "He gave himself back."

 foc_cis.10.name:0 "The Separatist War Machine"
 foc_cis.10.desc:0 "Confederate fleets and war industries are dispersed across the theaters."
 foc_cis.10.a:0 "Move to a full war footing."

 foc_cis.11.name:0 "General Grievous"
 foc_cis.11.desc:0 "The Confederacy has a new supreme commander.\n\nHe is not a politician or a corporate delegate but a rebuilt war machine: barely any organic parts remain, the rest is alloy frame and servomotors. He coughs, because the lungs were kept from the original body. He collects lightsabers, because he took each one off a Jedi himself.\n\nSince he took command, Confederate fleets have shown real tactical direction for the first time — raiders coordinate, line fleets anticipate Republic movements instead of waiting to be hit.\n\n§YSeparatist line fleets and raiding groups both receive reinforcement, and Confederate fleets gain a command bonus.§!"
 foc_cis.11.a:0 "The Outer Rim front is hardening."

 foc_cis.12.name:0 "The Combines Mobilise"
 foc_cis.12.desc:0 "The Trade Federation, the Banking Clan, the Techno Union and the Mining Guild signed a joint declaration on Akiva: every member corporation's \"escort forces\" pass into the Confederate order of battle with immediate effect.\n\nThose ships were meant to escort cargo, lean on local governments, and close a shipping lane or two when required. There are a startling number of them, because in twenty years the Senate never once actually counted them.\n\nThe Republic rejected a bill in the Senate chamber that would have recognised those escort forces as lawful. They no longer require the Senate's recognition.\n\n§YThe Confederacy gains substantial reinforcement fleets and a full mobilisation bonus.§!"
 foc_cis.12.a:0 "The combines have staked everything."

 foc_saga_hope_of_the_rebellion:0 "Hope of Yavin"
 foc_saga_hope_of_the_rebellion_desc:0 "A farmhand destroyed a station that kills planets. The whole galaxy heard, and that is worth far more than a warship."
 foc_saga_jedi_restraint:0 "A Jedi's Restraint"
 foc_saga_jedi_restraint_desc:0 "He put the blade away after Bespin. Restraint buys discipline and loyalty, not victories."
 foc_saga_rebel_vengeance:0 "The Fire of Vengeance"
 foc_saga_rebel_vengeance_desc:0 "Rage works. It simply has an expiry date, and something else has to pay for it."
 foc_saga_return_of_the_jedi:0 "Return of the Jedi"
 foc_saga_return_of_the_jedi_desc:0 "The Emperor died at his own apprentice's hands, and the name of the Order is on the comm channels again."
 foc_saga_new_jedi_order:0 "A New Jedi Order"
 foc_saga_new_jedi_order_desc:0 "Twelve students in a temple on Yavin IV. Negligible in numbers, incalculable as a symbol."
 foc_saga_broken_master:0 "A Master Who Failed"
 foc_saga_broken_master_desc:0 "The temple burned and the students scattered. He knows the real failure began the instant his own blade lit."
 foc_saga_last_jedi:0 "The Last Jedi"
 foc_saga_last_jedi_desc:0 "He will not act, but he is still alive. While he is, the Order has not formally ended."
 foc_saga_spark_of_hope:0 "The Spark"
 foc_saga_spark_of_hope_desc:0 "One man held an entire army and then vanished between two setting suns. From that day the First Order was something people fight."
 foc_saga_force_ghost_guidance:0 "A Voice in the Force"
 foc_saga_force_ghost_guidance_desc:0 "Failure is the greatest teacher, and nobody wants to admit it. Someone is still telling the next generation so."
 foc_saga_knights_of_ren:0 "Knights of Ren"
 foc_saga_knights_of_ren_desc:0 "Six of them, six crude weapons, no doctrine and no rites. They answer to one man."
 foc_saga_supreme_leader_kylo:0 "Supreme Leader Kylo Ren"
 foc_saga_supreme_leader_kylo_desc:0 "He killed his master and took the chair. The fleets obey him, and nobody is entirely sure he will keep it."
 foc_saga_force_dyad:0 "A Dyad in the Force"
 foc_saga_force_dyad_desc:0 "A pairing so rare that two people constitute one power. It cannot be cut, and neither side can close it alone."
 foc_saga_ben_solo_redeemed:0 "Ben Solo Returns"
 foc_saga_ben_solo_redeemed_desc:0 "He threw away the cracked blade, and the name that went with it."
 foc_saga_skywalker_legacy:0 "The Skywalker Legacy"
 foc_saga_skywalker_legacy_desc:0 "The bloodline ended. The name did not — someone picked it up under two suns on Tatooine."
 foc_saga_separatist_war_machine:0 "Separatist War Machine"
 foc_saga_separatist_war_machine_desc:0 "The automated system beneath Akiva runs day and night: hulls on orbital slips, droids crated straight off the belt. This army needs no pay, no rations, and never tires of the war."
 foc_saga_grievous_command:0 "Grievous in Command"
 foc_saga_grievous_command_desc:0 "The Confederacy finally has a supreme commander who can fight. Its fleets anticipate now instead of waiting."
 foc_saga_separatist_full_mobilisation:0 "Combine Mobilisation"
 foc_saga_separatist_full_mobilisation_desc:0 "The Trade Federation, Banking Clan, Techno Union and Mining Guild have folded every private squadron into the Confederate order of battle."

 foc_nr_fix.2.name:0 "The Mon Cala Slips"
 foc_nr_fix.2.desc:0 "With the Concordance in force, the undersea yards of Mon Cala have relit their slips.\n\nThe improvised wartime refits are finished. In their place are two designs that had been sitting at the bottom of the drawing cabinet: the §HNebula-class§! line ship, and the §HViscount-class§! that nobody ever actually approved a budget for — seventeen kilometres of hull the Mon Calamari have been preparing a generation to build.\n\n§YNebula-class and Viscount-class construction is now available, and both fixed designs have been added to the shipyard list.§!"
 foc_nr_fix.2.a:0 "Lay them down."
 FOC_SAGA_LEIA_NAME:0 "Leia Organa"
 FOC_SAGA_MON_MOTHMA_NAME:0 "Mon Mothma"

 foc_luke.15.name:0 "Endor: What Happened in the Throne Room"
 foc_luke.15.desc:0 "Death Star II came apart above Endor, and the station is not what the Empire actually lost.\n\nThe Emperor brought Skywalker to the throne room intending to make the young man choose between his father and himself, and kill the other. Every step went as planned — until Skywalker won the duel, threw the lightsaber away, and said he was a Jedi.\n\nThe Emperor answered with Force lightning. And the figure who had stood watching, motionless, for a very long time, finally picked his master up and threw him down the reactor shaft.\n\n§HDarth Vader is dead.§! The name every officer in the fleet was afraid of is gone from the command roster, and everything he brought with him is gone too.\n\n§YThe §HDarth Vader§! modifier is removed and his named commander is killed.§!"
 foc_luke.15.a:0 "Fear no longer fights our wars."

# =============================================================================
# 帕德梅·阿米达拉
# =============================================================================
 FOC_SAGA_PADME_NAME:0 "Padmé Amidala"

 foc_padme.10.name:0 "The Senator from Naboo"
 foc_padme.10.desc:0 "Naboo elects its monarch, for a fixed term. When §HPadmé Naberrie Amidala§! stepped down, her people very nearly amended the constitution to keep her. She refused, and took a different post instead: Naboo's seat in the Galactic Senate.\n\nWhat she brought into the chamber was a badly timed position — against the Military Creation Act, against granting the Chancellor's office one more emergency power of any kind. In one speech she said a line that has been quoted ever since: the Republic will not be conquered, it will be handed over to applause.\n\nFewer senators vote with her every year.\n\nAnd one thing appears in no record at all: the boy brought back from Tatooine years ago has grown up into the most conspicuous Jedi in the Order. What is between them is forbidden by the Order's code and by the Senate's rules alike."
 foc_padme.10.a:0 "Someone in that chamber is still telling the truth."

 foc_padme.11.name:0 "He Dreams of Her Dying"
 foc_padme.11.desc:0 "§LThe Republic is beginning to collapse, while one of its most important changes is taking place between only a handful of people.§!\n\nThree years into the Outer Rim war, the Jedi Archives received a report that was never filed.\n\n§HAnakin Skywalker§! has begun having the same dream. He sees Padmé die in childbirth, and himself standing beside her, unable to do anything. He has had this dream once before — years ago, about his mother. That one came true in every detail.\n\nHe asked a Jedi Master. What he got was instruction: fear of loss is the path to the dark side, and he must learn to let go.\n\nThen he went to a box at the opera. The Supreme Chancellor told him a Sith legend there — a master so powerful he could influence life and death, and keep the people he cared about from dying. The story ends with that master killed in his sleep by his own apprentice.\n\nAnd afterwards the Chancellor added one line: it is not a power the Jedi will teach you.\n\n\n\n§LThe story and other effects are retained; this event no longer adds extra conspiracy points.§!"
 foc_padme.11.a:0 "He would hand over anything rather than lose her."

 foc_padme.12.name:0 "Mustafar"
 foc_padme.12.desc:0 "After the temple burned she took her own ship to §HMustafar§!. She did not believe the reports. She was going to ask him herself.\n\nThe man she found described a new order to her: the war would end, the galaxy would be stable, he was strong enough now to overthrow the Chancellor and rule it himself, and they could do it together. She stepped back and said she did not know this person.\n\nThen Obi-Wan Kenobi walked down the ramp of her ship.\n\nHe read it as betrayal — that she had brought him. §HHe closed his hand on her throat§! and did not stop until she collapsed on the lava shore.\n\nHe lost his own limbs in the duel that followed, burned nearly to nothing, and was carried off the rock and sealed into black life-support armour.\n\nPadmé is still alive. Obi-Wan and Yoda rush her to §HPolis Massa§!, where the medical team prepares for an emergency delivery. She is critically weak, but the twins have not yet been born."
 foc_padme.12.a:0 "Everything he did to keep her is why he lost her."

 foc_padme.13.name:0 "The Twins"
 foc_padme.13.desc:0 "At the medical center on §HPolis Massa§!, Padmé gives birth to twins: Luke and Leia. The children are healthy, but her condition rapidly collapses. The medical droids can find no mortal physical injury; after her final words, she stops breathing.\n\n§YPadmé Amidala is dead.§!\n\nNaboo later gives her a state funeral. The body in the casket still appears to be carrying — that must be believed by everyone, including the man newly sealed inside black armour.\n\nThe children have to be separated. The girl goes to Bail Organa of Alderaan; the boy goes to §HTatooine§! to be raised by Owen and Beru. Yoda departs for Dagobah, while Obi-Wan remains in the desert to watch over the boy.\n\n§YThe hope in the Force was not broken. It was hidden.§!"
 foc_padme.13.a:0 "Split them up. Tell no one."

 foc_saga_amidala_senator:0 "Senator Amidala"
 foc_saga_amidala_senator_desc:0 "Her weight in the chamber comes from that crisis — it was her motion that removed the last Chancellor. She now spends the same effort blocking the next emergency powers bill."
 foc_saga_anakin_visions:0 "The Chosen One's Nightmares"
 foc_saga_anakin_visions_desc:0 "He has started preparing for something that has not happened yet. And the man interpreting the dreams for him knows exactly what he is most afraid of."
 foc_saga_mustafar_aftermath:0 "After Mustafar"
 foc_saga_mustafar_aftermath_desc:0 "The Chosen One has been sealed inside black armour; Padmé is rushed to Polis Massa, barely alive."

 foc_rebel_growth.2.name:0 "A New Battle Group"
 foc_rebel_growth.2.desc:0 "A newly controlled inhabited system has joined the Imperial Rebellion. Its shipyards and reserves can supply a battle group, or provide the equivalent alloy budget and join the fleet supply network.\n\n§YChoose: 20 MC80 cruisers, or 29,800 alloys and another −5% ship upkeep.§!\nThe alloy reward equals 20 times the reward MC80 design’s base alloy cost: 1,490 per ship, including hull and equipment, before national discounts. Each eligible system pays once."
 foc_rebel_growth.2.a:0 "Keep pushing."

# =============================================================================
# 恩多之后的帝国
# =============================================================================
 FOC_SAGA_THRAWN_NAME:0 "Grand Admiral Thrawn"

 foc_luke.17.name:0 "The Death of the Emperor"
 foc_luke.17.desc:0 "Something happened in the throne room of Death Star II a few minutes before it came apart, and the official Imperial bulletin does not mention it at all.\n\n§HPalpatine is dead.§! The man who lifted him off the dais and threw him down the reactor shaft was the one person he had trusted for twenty-three years.\n\nThere is no body, no will, and no heir — he never arranged an heir, because he had no intention of dying. The entire legitimacy of the New Order rested on one man, and that man did not even leave remains.\n\nWithin twelve hours the Coruscant high command constituted an §HImperial Regency§! and announced that the Emperor is attending to matters of state. Nobody believes that sentence, including the people who issued it.\n\nFrom today the Empire is held together by a military government with no name — and every sector governor and admiral is watching the others to see who moves first.\n\n§YThe Empire enters a succession crisis: stability, government attraction, unity and fleet fire rate all fall, and war exhaustion rises.§!"
 foc_luke.17.a:0 "His Majesty is attending to matters of state."
 foc_thrawn.2.name:0 "Grand Admiral Thrawn Returns"
 foc_thrawn.2.desc:0 "During the post-treaty cold war, Ahsoka Tano and Sabine Wren finally reach the long-lost Ezra Bridger. Yet §HGrand Admiral Thrawn§!, exiled in a distant galaxy, also returns with the aid of the Nightsisters.\n\nThe New Republic dismisses the warning as a border incident. The Imperial remnant, however, once again has a commander capable of integrating its resources into a long-term strategy.\n\n§YThrawn assumes command of the Imperial remnant.§!"
 foc_thrawn.2.a:0 "The Empire has not lost. It has changed how it plays."

 foc_saga_imperial_succession_crisis:0 "Imperial Succession Crisis"
 foc_saga_imperial_succession_crisis_desc:0 "The legitimacy of the New Order rested on one man, and at Endor that man did not even leave remains. Every sector governor and admiral is watching the others."
 foc_saga_thrawn_command:0 "Thrawn in Command"
 foc_saga_thrawn_command_desc:0 "He does not rule by fear and he does not win by numbers. He works out what the other side intends to do next, and then makes it pointless."

 NAME_FOC_REBEL_NEBULA_NR:0 "Nebula-class Star Destroyer"
 NAME_FOC_REBEL_MC158_NR:0 "Viscount-class Star Defender"

# =============================================================================
# 克隆人战争 / 义军时代 / 索龙时代
# =============================================================================
 FOC_SAGA_KATANA_FLEET:0 "Katana Fleet"

 foc_cw.1.name:0 "Battle of Geonosis"
 foc_cw.1.desc:0 "The Geonosis crisis forces the Republic to deploy its clone army. Closing this event establishes the Confederacy and begins the Clone Wars."
 foc_cw.1.a:0 "We won the first one."

 foc_cw.2.name:0 "The Outer Rim Sieges"
 foc_cw.2.desc:0 "§LThe military channels carry only coordinates, casualty figures, and orders. The true cost will not be visible until the fighting ends.§!\n\nThe front has reached the Outer Rim, and the Outer Rim has no front — only a string of unconnected systems, each of which has to be taken on its own.\n\nThe Confederacy builds its factories underground, hides its fleets in asteroid fields, and garrisons with machines that need no supply. The Republic sends Jedi out one at a time as generals: one man, one legion, one world, and then months of silence.\n\nThe staff has to choose a way to fight this.\n\n§YTwo doctrines: attrition buys durability and endurance; a Jedi spearhead buys damage and breakthroughs at higher leader upkeep.§!"
 foc_cw.2.a:0 "Grind it down. Tonnage and time."
 foc_cw.2.b:0 "Put the Jedi in front. Speed costs fewer lives."

 foc_cw.6.name:0 "Coruscant Assault: The Chancellor Taken"
 foc_cw.6.desc:0 "A Confederate strike force of §H25 Lucrehulk-class battleships§! has arrived over Coruscant and abducted the Chancellor."
 foc_cw.6.a:0 "Cut them off. Bring the Chancellor back."
 foc_cw.3.name:0 "The Battle of Coruscant"
 foc_cw.3.desc:0 "§LThe military channels carry only coordinates, casualty figures, and orders. The true cost will not be visible until the fighting ends.§!\n\nCoruscant has held. Every Confederate assault fleet committed to the capital has been destroyed or driven out, and the Republic still controls the system.\n\nA Confederate fleet appeared over the Republic capital — not to hold it, but to take one man.\n\n§HThe Supreme Chancellor was carried onto the flagship.§! Two Jedi went in after him, and what they met on that bridge was §HCount Dooku§!.\n\nDooku put one of them down, fought the other, lost, and had both hands taken off. He knelt there waiting to be arrested and tried.\n\nThen the Chancellor spoke. He did not ask for a prisoner.\n\nThe young Jedi hesitated for two seconds and did it. Afterwards the Chancellor reassured him: I would have done the same.\n\nThe Sith never keep two apprentices. The old one is dead and the place is open — and the young man knows perfectly well who it is open for.\n\n§YPalpatine's conspiracy advances by 10.§!\n\n§YCoruscant is complete; the actual Dooku leader dies; this milestone counts +10 conspiracy points once.§!"
 foc_cw.3.a:0 "He has learned something he should not have."

 foc_cw.4.name:0 "Utapau: End of the Machine"
 foc_cw.4.desc:0 "§LThe Jedi once mediated wars. Now they stand on warship bridges and personally order clone legions into battle.§!\n\nThe Confederacy has completely lost control of §HUtapau§!. Its high command was finally located on the arid world of sinkholes with the droid legions housed in cities built into the shaft walls.\n\nThe Republic sent a single Jedi ahead to scout. He rode a local mount down the rim, and caught §HGeneral Grievous§! on the landing platform as he was boarding to escape.\n\nFour lightsabers against one. What ended it was not a lightsaber but a blaster picked up off a dead guard — two shots into the organic lungs.\n\nWhen the General went down, every battle droid in the galaxy was still working. But the head giving the orders was gone.\n\n§YGeneral Grievous is killed, the Confederacy loses its command bonus, and the Republic gains a period of battlefield advantage.§!\n\n§YUtapau is complete and Grievous is dead. This battle does not add extra conspiracy points.§!"
 foc_cw.4.a:0 "The droids still move. Nobody is directing them."

 foc_cw.5.name:0 "Kashyyyk: The Last Victory"
 foc_cw.5.desc:0 "§LThe Jedi once mediated wars. Now they stand on warship bridges and personally order clone legions into battle.§!\n\nThe Confederacy has completely lost control of §HKashyyyk§!. On its shallows, Master Yoda and the Wookiees held the beach. The Confederate landing was pushed back into the water and the report went to Coruscant: Outer Rim operations are nearly concluded.\n\nIt is the last battle the Republic wins.\n\nStanding in that surf, Yoda took an encrypted transmission from Coruscant. He listened to the end, said nothing, then turned and spoke to the clone commander beside him.\n\nThe commander came to attention, saluted, took the comm off his belt — and received an order on a different channel."
 foc_cw.5.a:0 "Pull the troops back."

 foc_reb.1.name:0 "Lothal: One World Says No"
 foc_reb.1.desc:0 "§HLothal§! is an Outer Rim farming world nobody can place on a chart. The Empire flattened its grasslands into munitions works and test fields; the locals went from farmers to workers, on Imperial wages and Imperial rations.\n\nThen a handful of people started causing trouble: stolen supplies, wrecked convoys, a flag run up a comm tower. So few that the Imperial governor first logged it as ordinary crime.\n\nThey have signalled us asking for recognition and support. Once the uprising succeeds, §HLothal will break from the Empire and pass under Imperial Rebel control§!.\n\n§YTwo routes: open uprising lights morale immediately but brings the reprisal columns; a cell network is slower and survives.§!"
 foc_reb.1.a:0 "Recognise them openly. Let other worlds see it."
 foc_reb.1.b:0 "Build the cells first. Surviving beats being loud."

 foc_reb.2.name:0 "Jedha: The Holy City"
 foc_reb.2.desc:0 "The Holy City on §HJedha§! stood for thousands of years — where the Jedi took their kyber, and one of the last places in the galaxy a pilgrim could still go. The Empire has mined there for years, hollowing out the mountain and shipping the crystal away by the freighter-load.\n\nSaw Gerrera's partisans hide in that desert. They have fought the Empire for over a decade, dirty and undisciplined, and Alliance command has never been willing to claim them.\n\nThen the Empire fired once, above Jedha.\n\nNot a ship's gun. The thing from the rumours, at a single low yield. The Holy City and several hundred kilometres around it became a new crater in seconds, and the dust went up into the atmosphere.\n\n§HThe rumour is not a rumour any more.§!"
 foc_reb.2.a:0 "Everyone has to be told about this."

 foc_reb.3.name:0 "Mon Cala: The Slips"
 foc_reb.3.desc:0 "The yards of §HMon Calamari§! are underwater and invisible from orbit. The Empire has wanted them requisitioned since the occupation, but Mon Cala's output figures have missed target every year — they hid their best workers and their best drawings.\n\nThey have stopped pretending.\n\nWhat comes with them is a set of plans. Not cruiser refits — complete capital ship designs: the mid-weight §HNebula-class§!, and seventeen kilometres of hull nobody ever approved a budget for, the §HViscount-class§!.\n\nThe Mon Calamari say they have been preparing a generation for this.\n\n§YGain the Mon Cala yards bonus: hull, shields and shipyard build speed.§!"
 foc_reb.3.a:0 "Open the slips."

 foc_reb.4.name:0 "Mandalore: The Darksaber"
 foc_reb.4.desc:0 "Mandalore is not ruled by election, and not entirely by blood. It is ruled by a sword — the §HDarksaber§!, a black blade forged a thousand years ago by the first Mandalorian Jedi. Win it in single combat and you have the standing to command the clans.\n\nThe Empire's puppet governor holds it now, and he did not win it in combat.\n\nThe clans have split. Half want to take it back. Half want to see who is paying more first.\n\nWhere we stand decides which way this world falls.\n\n§YBacking the clan fleets grants ship bonuses and naval capacity; backing the commandos grants formidable ground strength.§!"
 foc_reb.4.a:0 "Back the clan fleets. We need things that fly."
 foc_reb.4.b:0 "Back the commandos. We need people who can land."

 foc_reb.5.name:0 "The Corellian Treaty"
 foc_reb.5.desc:0 "Until now what opposed the Empire was not an organisation but dozens of small groups who did not know each other and did not trust each other: the workers of Lothal, the partisans of Jedha, the yards of Mon Cala, the clans of Mandalore, and the few senators who had not been taken away.\n\nThey sat at one table on Corellia and signed a document. It is short. The substance is one sentence: from today we are one army.\n\nThe §HAlliance to Restore the Republic§! exists. It has a flag, an order of battle, a single chain of command — and for the first time something the Empire can formally declare war on.\n\n§YGain the Declaration bonus: unity, diplomatic weight and stability rise, war exhaustion falls.§!"
 foc_reb.5.a:0 "From today we are one army."

 foc_rem.1.name:0 "The Warlords"
 foc_rem.1.desc:0 "On paper the Concordance left the Imperial Remnant as one state. It did not.\n\nEvery Outer Rim sector still flying Imperial colours has its own fleet, its own yards, and a governor or admiral calling himself the lawful successor. Some still issue orders in the Emperor's name; some have started minting their own currency. They have more border incidents with each other than with the New Republic.\n\nThe Remnant government has to settle this before it can do anything outward at all.\n\n§YIron discipline: stability and combat strength rise, happiness falls. Bought loyalty: naval capacity and stability rise, fleet upkeep rises.§!"
 foc_rem.1.a:0 "Iron discipline. Replace the governors who will not listen."
 foc_rem.1.b:0 "Buy them in. Give them posts, take their fleets."

 foc_rem.2.name:0 "The Chimaera"
 foc_rem.2.desc:0 "An Imperial-class Star Destroyer jumped in from the direction of the Unknown Regions, transmitted no identification, and came straight through the Remnant picket line.\n\nName: §HChimaera§!. Old, immaculately maintained, and carrying battle repairs of a kind nobody here recognises — those were not made by New Republic weapons.\n\nWhat it brings is more than a ship. It brings a chart of the galactic rim, a set of tactics ground out over years of fighting in the Unknown Regions, and a bridge that people are finally willing to obey.\n\nFrom today the Remnant fleet has a real flagship.\n\n§YGain the Chimaera bonus: damage, accuracy and tracking rise, war exhaustion falls.§!"
 foc_rem.2.a:0 "All ships form on the Chimaera."

 foc_rem.3.name:0 "The Katana Fleet"
 foc_rem.3.desc:0 "The Old Republic once built a fleet of two hundred Dreadnaught-class heavy cruisers, all full-rigged for slave circuitry, so that one bridge could command two hundred ships. On the maiden voyage the crews caught a plague and, out of their minds, jumped the whole fleet into hyperspace together.\n\nFor fifty years, looking for it has been the galaxy's most famous business in legends. Nobody found it.\n\nSomeone has now.\n\nThe hulls are intact, the reactors cold but sound, the weapons fifty years out of date — not advanced by today's standards. They do not need to be advanced. They need to be numerous.\n\n§YA Katana fleet has been entered into the Remnant order of battle.§!"
 foc_rem.3.a:0 "Tow all of them back to the yards."

 foc_rem.4.name:0 "Kuat Drive Yards"
 foc_rem.4.desc:0 "The ring yards of §HKuat§! are the largest military industry in the galaxy; sixty percent of Imperial Navy tonnage was launched there. The Concordance gave Kuat to the New Republic — but the yards belong to Kuat Drive Yards, and that is a company.\n\nCompanies do not discuss positions. They discuss orders.\n\nThey have sent someone with a very practical proposal: New Republic orders are booked out seven years, and idle capacity in between is idle either way. The price is agreed. Delivery leaves no record.\n\n§YGain the Kuat contracts bonus: hull, armour and shipyard build speed.§!"
 foc_rem.4.a:0 "Sign it. No records."

 foc_rem.5.name:0 "Two Roads"
 foc_rem.5.desc:0 "The purge is finished, the flagship is back, the fleet is filled out and the yards are contracted. For the first time the Remnant is not a remnant but a state capable of making a choice.\n\nThe staff has put two proposals on the table.\n\nOne says hold the Outer Rim and nothing more. Accept the Concordance, settle these few dozen sectors, and spend twenty years making them into a country that can actually stand on its own — at the price of giving up forever the galaxy that used to be ours.\n\nThe other says move now. The New Republic senate is still arguing over the fleet budget, its border garrisons are hollow, and we have a man who knows how to win.\n\n§YConsolidation: large gains to stability, unity and diplomatic weight, lower war exhaustion, but reduced fleet damage. Reconquest: large gains to damage, fire rate, naval capacity and ground strength, at the cost of stability.§!"
 foc_rem.5.a:0 "Hold the Rim. Make it a real country."
 foc_rem.5.b:0 "Move now. They are not ready."

 foc_saga_cw_grand_army:0 "Grand Army of the Republic"
 foc_saga_cw_grand_army_desc:0 "A standing army for the first time in two thousand years. Nobody can say who placed the order."
 foc_saga_cw_attrition_doctrine:0 "Doctrine of Attrition"
 foc_saga_cw_attrition_doctrine_desc:0 "Grind it down with tonnage and time. Slow, and more of them come home."
 foc_saga_cw_jedi_spearhead:0 "Jedi Spearhead"
 foc_saga_cw_jedi_spearhead_desc:0 "Jedi sent out one at a time as generals, one world at a time. Speed really is the cheapest thing in lives — for the ones who survive."
 foc_saga_cw_droid_command_broken:0 "Command Net Broken"
 foc_saga_cw_droid_command_broken_desc:0 "The droids still move. The head that gave the orders is gone."
 foc_saga_reb_open_uprising:0 "Open Uprising"
 foc_saga_reb_open_uprising_desc:0 "Let other worlds see that someone actually dared. The reprisal columns saw it too."
 foc_saga_reb_cell_network:0 "Cell Network"
 foc_saga_reb_cell_network_desc:0 "No contact, no names. One arrest does not lead to a second. Slow, and it lasts."
 foc_saga_reb_mon_cala_yards:0 "Mon Cala Slips"
 foc_saga_reb_mon_cala_yards_desc:0 "Undersea yards, invisible from orbit. The Mon Calamari hid a generation of drawings and workers for this day."
 foc_saga_reb_mandalorian_fleet:0 "Mandalorian Clan Fleets"
 foc_saga_reb_mandalorian_fleet_desc:0 "Private clan ships folded into the Alliance order of battle. Hard to command, willing to go in."
 foc_saga_reb_mandalorian_commandos:0 "Mandalorian Commandos"
 foc_saga_reb_mandalorian_commandos_desc:0 "The most expensive and most effective ground troops in the galaxy. They do not recognise rank, only people who win."
 foc_saga_reb_declaration:0 "The Corellian Treaty"
 foc_saga_reb_declaration_desc:0 "Dozens of mutually suspicious groups sat at one table. The document is short."
 foc_saga_rem_iron_discipline:0 "Iron Discipline"
 foc_saga_rem_iron_discipline_desc:0 "The governors who would not listen have been replaced. The rest are extremely obedient and extremely unhappy."
 foc_saga_rem_bought_loyalty:0 "Bought Loyalty"
 foc_saga_rem_bought_loyalty_desc:0 "Posts for fleets. The ships arrived, and so did the bill."
 foc_saga_rem_chimaera:0 "The Chimaera"
 foc_saga_rem_chimaera_desc:0 "Old, immaculately maintained, carrying battle repairs of a kind nobody here recognises."
 foc_saga_rem_kuat_contracts:0 "Kuat Contracts"
 foc_saga_rem_kuat_contracts_desc:0 "Companies do not discuss positions, only orders. Delivery leaves no record."
 foc_saga_rem_consolidation:0 "Consolidation"
 foc_saga_rem_consolidation_desc:0 "Accept the Concordance and spend twenty years making these sectors into a country that can stand on its own."
 foc_saga_rem_reconquest:0 "Reconquest"
 foc_saga_rem_reconquest_desc:0 "Their senate is still arguing over the fleet budget, their borders are hollow, and we have a man who knows how to win."

 foc_ethics.2.name:0 "The New Order"
 foc_ethics.2.desc:0 "The Empire changed its government, its civics and its flag, but one thing never caught up: on paper this state still runs on Republic values.\n\nThe open-borders clauses of the Senate era, the demilitarisation pledges, the species equality acts — all still in the legal code, simply no longer enforced. Governors work from the old text, the military works from the new orders, and the two collide daily.\n\nThe Chancellor's office abolished all of it today.\n\n§HThe three pillars of the New Order are written into the charter: human primacy, military priority, absolute authority.§!\n\n§YCountry ethics corrected to §HXenophobe + Militarist + Authoritarian§!, in line with the Imperial government.§!"
 foc_ethics.2.a:0 "The code has finally caught up with reality."

 foc_rebyard.2.name:0 "The Hangars"
 foc_rebyard.2.desc:0 "The Alliance has had a problem since the day it formed that nobody wanted to say out loud: we can steal ships, refit ships and weld freighters into gunboats, but we have nowhere to lay a keel.\n\nThe systems we hold have outposts — a listening mast and a hyperlane inhibitor, and that is all. Nothing can be fitted to them, because there is nowhere on them to fit anything.\n\nEngineering has spent months expanding the capital's outpost into a proper citadel: two slips, an anchorage, a gun battery, crew quarters and a logistics office. Two other colonised systems each got a single slip for forward repair and spare capacity.\n\nThe rest stay as they are. The Alliance cannot afford fortresses everywhere, and does not need them.\n\n§YThe capital system is upgraded to a citadel with two shipyards, an anchorage and a gun battery; two further systems become starports with a shipyard each.§!"
 foc_rebyard.2.a:0 "Lay the keels."

 foc_rebyard.4.name:0 "The Kuat Slips"
 foc_rebyard.4.desc:0 "Both Death Stars are wreckage, and the ring yards of §HKuat§! have fallen into our hands intact.\n\nThe Empire had no time to destroy anything on the way out — the slips are simply too large, large enough that the demolition teams ran the numbers and gave up. What is left is not only the production line. The drawing cabinets are still there, still on the locks fitted before the Imperial takeover.\n\nOn the top shelf is a design that was never laid down. A mid-weight capital ship, firepower worthy of its tonnage, at a fraction of the cost of an Imperial-class — the Republic Navy's intended next-generation line ship for the postwar rebuild. The Senate never approved the budget, and the Empire locked it away.\n\nThe Mon Calamari engineers looked at one sheet and said they recognised the lines. Half of this design is theirs.\n\nThe §HNebula-class Star Destroyer§! blueprint is unsealed.\n\n§YNebula-class construction is unlocked and the fixed design has been added to the shipyard list. The Viscount class remains sealed until the Galactic Concordance.§!"
 foc_rebyard.4.a:0 "Lay them down."

 foc_raddus.2.name:0 "The Raddus Bays"
 foc_raddus.2.desc:0 "When the flagship's inspection report came up, the duty officer assumed it was a recording fault.\n\nAll three of the §HRaddus§!'s dedicated bays — engineering, docking, and the axial strike command module running the length of the hull — showed as empty on the fitting list. The hull is sound, the reactor is nominal, and all one hundred and twenty fighters are in their racks. But the three things that make her more than a large ship had, at some point, stopped being there.\n\nThe cause turns out to be absurd: the authorisation register for those bays lists the owner as the Alliance to Restore the Republic. Since the Concordance we do not go by that name. Same ship, same crew — only the heading on the paperwork changed, and the system decided the bays were not ours.\n\nThe register has been corrected. The bays are coming back online.\n\n§YThe Raddus's three dedicated bays are restored and the standard Arkship fit-out is installed: hangar, laser battery, sensor array, habitation module, plus armour and shields. Her combat loss rule is also corrected — Arkships are disabled, never captured.§!"
 foc_raddus.2.a:0 "A change of letterhead nearly cost us a flagship."

 foc_saga_dqar.3.name:0 "Demobilisation"
 foc_saga_dqar.3.desc:0 "The first document signed after the Concordance was not a declaration of victory. It was the demobilisation order.\n\nThose numbers were wartime numbers: to break two Death Stars and win a war in the Inner Rim that had no visible end, we ran the yards past their limits, drove war weariness to nothing, and pushed every unit of output into munitions. The fleet at its peak was three times the size of the old Republic's.\n\nThere is no war now, and this apparatus cannot be paid for — nor should it continue. The Senate passed the resolution quickly: reserves stood down, surplus fleets mothballed, capacity turned to reconstruction.\n\nSomeone asked in the chamber what happens if they come back. The answer was: then we fight again, but we cannot live by permanently preparing to.\n\n§YThe Death Star I, Death Star II and double-Death-Star wartime bonuses are retired with the Concordance and replaced by postwar demobilisation — smaller fleets and slower construction, higher output, stability, unity and diplomatic weight.§!"
 foc_saga_dqar.3.a:0 "Turn the yards back to civilian work."
 foc_saga_postwar_demobilisation:0 "Postwar Demobilisation"
 foc_saga_postwar_demobilisation_desc:0 "The wartime footing is stood down with the Concordance. Less capacity for fighting, more for building and governing."

