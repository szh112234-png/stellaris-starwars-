l_english:
 foc_khan_settings.13.name:0 "Star Wars MOD Game Mode"
 foc_khan_settings.13.desc:0 "Choose a new-game preset. All presets use original fighter display size and unlock every strategic strike-fighter family. FOC Mode is the recommended default; Detailed Settings opens the per-item configuration menu."
 foc_khan_settings.13.vanilla_mode:0 "Vanilla Game Mode"
 foc_khan_settings.13.vanilla_mode_desc:0 "Vanilla combat strength, original fighter size, all strategic strike aircraft, standard crisis support, 2200 story timeline."
 foc_khan_settings.13.foc_mode:0 "FOC Game Mode (Default)"
 foc_khan_settings.13.foc_mode_desc:0 "Intermediate/FOC combat strength, original fighter size, all strategic strike aircraft, maximum crisis support, 2200 story timeline."
 foc_khan_settings.13.acot_mode:0 "ACOT Game Mode"
 foc_khan_settings.13.acot_mode_desc:0 "ACOT combat strength, original fighter size, all strategic strike aircraft, maximum crisis support, 2200 story timeline."
 foc_khan_settings.13.detailed:0 "Detailed Settings"
 foc_khan_settings.13.detailed_desc:0 "Open the per-item configuration menu, starting from the FOC preset."
 foc_khan_settings.16.name:0 "Star Wars MOD Detailed Settings"
 foc_khan_settings.16.desc:0 "Configure combat strength, strategic fighters, crisis support scale and story timeline separately."
