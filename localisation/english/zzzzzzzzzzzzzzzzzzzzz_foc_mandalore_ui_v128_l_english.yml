 origin_foc_mandalore_state:0 "Mandalore: Neutral Duchy"
 origin_foc_mandalore_state_desc:0 "Mandalore remains politically independent during the final Republic era. Duchess Satine Kryze's New Mandalorians seek to replace generations of clan warfare with neutrality and reconstruction, while the warrior tradition and Death Watch continue to contest the world's future."
 origin_foc_mandalore_state_effects:0 "§YStory Country:§!\n- Mandalore begins as an independent neutral state\n- Its primary species is fixed to §HMandalorians§!\n- Government identity changes with §HSatine → Maul → Bo-Katan/restoration§!\n- The Siege, Imperial annexation, Great Purge and post-Treaty future are controlled by FOC story events"

 gov_foc_mandalore_new_mandalorians:0 "New Mandalorian Duchy"
 gov_foc_mandalore_new_mandalorians_desc:0 "Satine Kryze's New Mandalorian government seeks to replace generations of clan warfare with neutrality, diplomacy and reconstruction."
 gov_foc_mandalore_shadow_collective:0 "Shadow Collective Rule"
 gov_foc_mandalore_shadow_collective_desc:0 "Maul rules Mandalore through Death Watch, coercion and the criminal alliances of the Shadow Collective."
 gov_foc_mandalore_clan_council:0 "Mandalorian Clan Council"
 gov_foc_mandalore_clan_council_desc:0 "Bo-Katan and the surviving clans maintain a common state through clan compacts and collective defense rather than one dynasty or one weapon."

