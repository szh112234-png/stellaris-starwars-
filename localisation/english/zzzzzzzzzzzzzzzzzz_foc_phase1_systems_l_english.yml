l_english:
 foc_phase1_rebel_operations_edict:0 "Rebel Special Operations Bureau"
 foc_phase1_rebel_operations_edict_desc:0 "Commit intelligence cells, pilots and strike teams to high-risk operations tied directly to FOC's existing strategic worlds and timeline."
 foc_phase1_fleet_archive_edict:0 "Fleet Archive and Mothball Order"
 foc_phase1_fleet_archive_edict_desc:0 "Manage ships across eras. Mothballing never destroys active vessels or deletes technology; it only closes a historical production line until deliberately reactivated."
 foc_phase1.20.name:0 "Rebel Special Operations Bureau"
 foc_phase1.20.desc:0 "Not every Imperial advantage can be challenged in a fleet battle. FOC's special-operations doctrine targets the strategic infrastructure already present in this timeline: Kuat's yards, Scarif's archive network, and Fondor's industrial scheduling system. Veteran commanders materially improve the odds, but failure costs the committed resources and time."
 foc_phase1.20.a:0 "§YOperation Spearpoint§! — infiltrate Kuat and seize an Imperial capital ship"
 foc_phase1.20.b:0 "§YOperation Glass Shadow§! — probe Scarif's archive network"
 foc_phase1.20.c:0 "§YOperation Breakwater§! — disrupt Fondor's shipbuilding system"
 foc_phase1.close:0 "Return to strategic planning."
 foc_phase1.21.name:0 "Operation Spearpoint: Success"
 foc_phase1.21.desc:0 "The strike force never attempted to occupy Kuat. Conflicting accident alarms, localized communications failures and a precisely timed boarding action let the team seize an Imperial-class Star Destroyer still undergoing yard trials. The captured maintenance records are nearly as valuable as the hull itself."
 foc_phase1.21.a:0 "Give it Rebel identification codes."
 foc_phase1.22.name:0 "Operation Spearpoint: Compromised"
 foc_phase1.22.desc:0 "Kuat's security net closed before the boarding teams reached their target berth. The survivors withdrew, but the committed resources are lost."
 foc_phase1.23.name:0 "Operation Glass Shadow: Archive Breach"
 foc_phase1.23.desc:0 "The team did not recover the Death Star plans — that still requires breaking Scarif itself — but they extracted an authentication core containing project references, clearance chains and partial fleet orders. It will not reveal a superweapon weakness, but it will make future Imperial networks far easier to read."
 foc_phase1.23.a:0 "Turn it over to Intelligence."
 foc_phase1.24.name:0 "Operation Glass Shadow: Silent Failure"
 foc_phase1.24.desc:0 "Scarif rejected the forged clearance chain at its last security layer. The team burned its equipment and withdrew before the Empire learned the true target."
 foc_phase1.25.name:0 "Operation Breakwater: Fondor Stalled"
 foc_phase1.25.desc:0 "Rather than destroy the yards outright, the strike team hit synchronization, reactor servicing and calibration systems. Construction schedules collapsed while Rebel cells diverted alloys and engineering records."
 foc_phase1.25.a:0 "Make every lost production day count."
 foc_phase1.26.name:0 "Operation Breakwater: Lockdown"
 foc_phase1.26.desc:0 "Fondor security detected abnormal traffic before the sabotage package was in place. The core team escaped, but the shipyards remain operational."
 foc_phase1.40.name:0 "Fleet Archive and Mothball Order"
 foc_phase1.40.desc:0 "A timeline spanning generations should not leave every historical hull permanently in the construction menu. The Archive preserves technology and active ships while deciding whether an old production line can accept new orders. The first FOC-specific hull covered is the Republic Venator-class Star Destroyer."
 foc_phase1.40.a:0 "Mothball Venator production."
 foc_phase1.40.b:0 "Reactivate Venator production."
 foc_phase1.41.name:0 "The Republic Fleet Legacy"
 foc_phase1.41.desc:0 "The age has changed. Venators remain capable combatants, but keeping their entire production standard active competes with newer fleet doctrine. The Archive recommends reserve status: existing hulls remain in service while new orders stop."
 foc_phase1.41.a:0 "Open the Fleet Archive."
 foc_phase1.41.b:0 "Keep the line active for now."
 foc_phase1.60.name:0 "Galactic Strategic Corridors"
 foc_phase1.60.desc:0 "The six major routes on the current Star Wars map—the Perlemian Trade Route, Corellian Run, Corellian Trade Spine, Rimma Trade Route, Hydian Way and Fedalle–Kuat route—now form the single strategic route-control network.\n\nThe network contains §Y39 unique major-route systems§!. Controlling at least 10/20/30 nodes grants Regional, Interregional and Galactic route-control tiers. Existing planet-local economic corridor traits remain local and no longer define country-level route control."
 foc_phase1_corellian_commercial_spine:0 "Corellian Commercial Spine"
 foc_phase1_corellian_commercial_spine_desc:0 "Dense traffic and financial exchange place this world on FOC's principal commercial arc."
 foc_phase1_coreward_industrial_corridor:0 "Coreward Industrial Corridor"
 foc_phase1_coreward_industrial_corridor_desc:0 "The administrative and shipbuilding axis linking Coruscant, Kuat and Fondor."
 foc_phase1_outer_rim_supply_lane:0 "Outer Rim Supply Lane"
 foc_phase1_outer_rim_supply_lane_desc:0 "A military logistics chain that sustains distant fleets, garrisons and long-haul transport."
 foc_phase1_scarif_cipher_network:0 "Scarif Cipher Chain"
 foc_phase1_scarif_cipher_network_desc:0 "An intercepted Imperial authentication core improves long-term decryption capability."
 foc_phase1_fondor_shipyard_disruption:0 "Fondor Scheduling Collapse"
 foc_phase1_fondor_shipyard_disruption_desc:0 "Targeted sabotage has disrupted yard synchronization and delayed ship production."
 foc_phase1_fleet_archive_savings:0 "Historical Hull Reserve System"
 foc_phase1_fleet_archive_savings_desc:0 "Mothballed production standards release maintenance staff and industrial capacity without scrapping active ships."
 foc_phase1_malachor_memory_site:0 "Malachor: Silent Memory Vault"
 foc_phase1_malachor_memory_site_intro:0 "After Ahsoka's disappearance on Malachor, an unfamiliar Force echo appears beneath the ruined temple. It feels less like a Sith tomb than a deliberately isolated archive."
 foc_phase1_arch.1.name:0 "Echoes Beneath the Ash"
 foc_phase1_arch.1.desc:0 "The expedition finds artificial barriers beneath war-melted stone. Beyond them are damaged navigation records rather than weapons."
 foc_phase1_arch.2.name:0 "A Broken Inheritance"
 foc_phase1_arch.2.desc:0 "Fragments come from Jedi, defectors and unnamed Force sensitives. Together they form no doctrine; they appear designed to prevent one."
 foc_phase1_arch.3.name:0 "The Memory Crystal"
 foc_phase1_arch.3.desc:0 "At the center lies a shielded memory crystal preserving warnings from failed traditions: every regime that tried to make the Force a complete instrument of state eventually taught its own fear to the next generation."
 foc_phase1_arch.4.name:0 "The Malachor Legacy"
 foc_phase1_arch.4.desc:0 "The recovered crystal is neither a conventional Jedi holocron nor a Sith artifact. It is a record of survival, doubt and failure across rival traditions."
 foc_phase1_arch.ok:0 "Continue the excavation."
 foc_phase1_arch.4.a:0 "Place the crystal in the national relic archive."
 r_foc_malachor_memory_crystal:0 "Malachor Memory Crystal"
 r_foc_malachor_memory_crystal_desc:0 "A layered archive recovered from Malachor, preserving lessons deliberately left outside Jedi and Sith orthodoxy."
 r_foc_scarif_cipher_core:0 "Scarif Cipher Core"
 r_foc_scarif_cipher_core_desc:0 "An authentication core extracted from Scarif. It is not a Death Star blueprint, but it exposes the architecture of Imperial information security."
 foc_phase1_malachor_relic_triumph:0 "Memory Crystal Resonance"
 foc_phase1_malachor_relic_triumph_desc:0 "Leadership training and Force research temporarily draw on the recovered archive."
 foc_phase1_scarif_relic_triumph:0 "Scarif Authentication Breakthrough"
 foc_phase1_scarif_relic_triumph_desc:0 "Imperial authentication structures are temporarily compromised, improving intelligence and targeting."
 NAME_FOC_PHASE1_CAPTURED_KUAT_FLEET:0 "Captured Kuat Squadron"
 NAME_FOC_PHASE1_CAPTURED_ISD:0 "Spear of Freedom"
 fop_phase1_crisis_rank_2:0 "First Order Ambition: Theater Integration"
 fop_phase1_crisis_rank_2_desc:0 "The first chain of submission is now integrated into a unified war machine."
 fop_phase1_crisis_rank_3:0 "First Order Ambition: Dominion Network"
 fop_phase1_crisis_rank_3_desc:0 "Subjects, strategic systems and fleets are becoming a real galactic command network."
 fop_phase1_crisis_rank_4:0 "First Order Ambition: Galactic Sovereignty"
 fop_phase1_crisis_rank_4_desc:0 "The First Order is no longer merely a successor state; it is becoming the political structure of the galaxy itself."
 fop_phase1_crisis_rank_5:0 "First Order Ambition: Force Hegemony"
 fop_phase1_crisis_rank_5_desc:0 "Power accumulated in the material galaxy is being turned against the Force itself."
 fop_phase1_force_project_requires_ambition:0 "At least §Y5000§! First Order Ambition is required before galactic conquest can be converted into a project to enslave the Force."
 fop_ambition_points_tooltip:0 "§YFirst Order Ambition§! comes from concrete strategic results: enemy ship §Y+1§!, starbase §Y+10§!, conquered colony §Y+25§!, destroyed country §Y+100§!, newly bound subject §Y+150§!. First control of Jakku grants §Y+100§!, Kuat §Y+150§!, Coruscant §Y+250§!, and Exegol §Y+300§!.\n\nRanks are not point grinds: every promotion still requires its FOC-specific story objective."
 fop_origin.65.desc.1:0 "§YStage I — Starkiller Fire§!\nStarkiller Base has transformed the First Order from an Imperial successor into an open galactic crisis.\n\n§ENext:§! Reach §Y400§! Ambition and force the first state into submission."
 fop_origin.65.desc.2:0 "§YStage II — Theater Integration§!\nThe first subject has been absorbed into the First Order war machine.\n\n§ENext:§! Reach §Y1200§! Ambition and control at least three subjects, unless the galaxy is already fully dominated."
 fop_origin.65.desc.3:0 "§YStage III — Dominion Network§!\nStrategic systems, subjects and fleets are becoming a true galactic command network.\n\n§ENext:§! Reach §Y3000§! Ambition and eliminate or subordinate every ordinary and Fallen Empire; a resisted Final Order must also be defeated."
 fop_origin.65.desc.4:0 "§YStage IV — Galactic Sovereignty§!\nNo independent great power remains able to deny the First Order.\n\n§ENext:§! Reach §Y5000§! Ambition and complete the §YEnslave the Force§! project."
 fop_origin.65.desc.5:0 "§YStage V — Force Hegemony§!\nThe accumulated machinery of conquest has become a chain around the Force itself.\n\n§ENext:§! Enter the Force realm, destroy its avatars and seize the vacant throne."
 # ---- FOC Galactic Civil War strength and partisan system ----
 foc_gcw_empire_high_control:0 "Galactic Civil War: Firm Imperial Control"
 foc_gcw_empire_high_control_desc:0 "The core routes, administrative nodes and occupation apparatus remain securely in Imperial hands."
 foc_gcw_empire_low_control:0 "Galactic Civil War: Fracturing Rule"
 foc_gcw_empire_low_control_desc:0 "More worlds are beginning to treat Imperial orders as commands that can be refused."
 foc_gcw_empire_high_morale:0 "Galactic Civil War: High Imperial Morale"
 foc_gcw_empire_high_morale_desc:0 "The Imperial military still believes order and superior firepower can end the war."
 foc_gcw_empire_low_morale:0 "Galactic Civil War: Faltering Morale"
 foc_gcw_empire_low_morale_desc:0 "A long war, lost territory and spreading rebellion are eroding confidence throughout the Imperial war machine."

 foc_gcw_partisan_cell:0 "Underground Resistance Cell"
 foc_gcw_partisan_cell_desc:0 "Scattered opponents of Imperial rule have established covert contacts and begun sabotage and intelligence leaks."
 foc_gcw_partisan_network:0 "Partisan Underground"
 foc_gcw_partisan_network_desc:0 "Local resistance has developed reliable communications, safe houses and clandestine supply routes."
 foc_gcw_partisan_uprising:0 "Open Uprising"
 foc_gcw_partisan_uprising_desc:0 "The underground has entered open revolt. Failure to restore control may deliver this system to the Imperial Rebellion."
 foc_gcw_partisan_armed:0 "Covert Rebel Aid"
 foc_gcw_partisan_armed_desc:0 "Weapons, advisers and encrypted communications from the Imperial Rebellion have reached the underground."
 foc_gcw_local_concessions:0 "Local Political Concessions"
 foc_gcw_local_concessions_desc:0 "Autonomy, amnesties and economic concessions have temporarily restored order."

 foc_gcw_rebel_mobilization_1:0 "Rebel Mobilization: Scattered Sparks"
 foc_gcw_rebel_mobilization_1_desc:0 "Resistance exists across the galaxy, but little of it can yet be mobilized for open war."
 foc_gcw_rebel_mobilization_2:0 "Rebel Mobilization: Underground Network"
 foc_gcw_rebel_mobilization_2_desc:0 "Multiple resistance movements can now share intelligence and supplies."
 foc_gcw_rebel_mobilization_3:0 "Rebel Mobilization: Galactic Alliance"
 foc_gcw_rebel_mobilization_3_desc:0 "Public support, logistics, intelligence and fleet readiness can sustain a true galactic war."
 foc_gcw_rebel_mobilization_4:0 "Rebel Mobilization: A Galaxy Aflame"
 foc_gcw_rebel_mobilization_4_desc:0 "Years of resistance have merged into a galaxy-wide logistics, intelligence and combat network."

 foc_gcw.6.name:0 "The Sparks Converge"
 foc_gcw.6.desc.1:0 "The Imperial Rebellion now fights under a common banner, but years of underground preparation have yielded only a limited mobilization base."
 foc_gcw.6.desc.2:0 "Resistance networks were already coordinating before the Alliance declaration. One additional battle group now joins the existing FOC story fleets."
 foc_gcw.6.desc.3:0 "The Empire's fractures have become a galactic underground front. Two additional battle groups and mature supply networks rally to the Alliance."
 foc_gcw.6.desc.4:0 "This rebellion did not appear overnight. Years of strikes, safe houses, smuggling routes and local uprisings now reveal themselves at once. Three additional battle groups join the existing main force."
 foc_gcw.ok:0 "Turn every spark into a front."

 foc_gcw.11.name:0 "Underground Resistance Cell"
 foc_gcw.11.desc:0 "Security services on [Root.GetName] have uncovered contacts using the same clandestine encryption. They are not yet a true partisan force, but neglect may draw the world into the Imperial Rebellion's network."
 foc_gcw.11.a:0 "Order a covert ISB sweep."
 foc_gcw.11.b:0 "Send the garrison in openly."
 foc_gcw.11.c:0 "Watch them. Do not close the net yet."

 foc_gcw.12.name:0 "The Underground Takes Shape"
 foc_gcw.12.desc:0 "Resistance on [Root.GetName] now maintains safe houses, transport nodes and secure communications. The Imperial Rebellion may already be in contact."
 foc_gcw.12.a:0 "Launch a joint security offensive."
 foc_gcw.12.b:0 "Impose martial law and drive them underground."
 foc_gcw.12.c:0 "Break the network with amnesty and local autonomy."

 foc_gcw.13.name:0 "Open Uprising"
 foc_gcw.13.desc:0 "The underground on [Root.GetName] has taken up arms. Imperial offices are under attack and the garrison is falling back toward fortified positions. Success may bring the entire system into the Imperial Rebellion."
 foc_gcw.13.a:0 "Restore Imperial order at any cost."
 foc_gcw.13.b:0 "Withdraw and preserve the fleet."

 foc_gcw.30.name:0 "A Line from Inside the Empire"
 foc_gcw.30.desc:0 "A new underground network has reached us through layers of intermediaries. They do not ask us to fight their war, only for enough equipment, codes and communications support to survive until they can rise."
 foc_gcw.30.a:0 "Smuggle in weapons and advisers."
 foc_gcw.30.b:0 "Establish an intelligence link only."
 foc_gcw.30.c:0 "Keep our distance and protect the wider network."
 foc_gcw.31.name:0 "Deepen Imperial Infiltration"
 foc_gcw.31.desc:0 "The Imperial Rebellion now maintains a usable spy network inside the Galactic Empire. Resources can be committed to safe houses, encrypted communications, false identities and embedded contacts, directly increasing real infiltration for operations such as instigating system uprisings."
 foc_gcw.31.a:0 "Expand the existing clandestine network."
 foc_gcw.31.b:0 "Launch a major infiltration drive."
 foc_gcw.31.c:0 "Keep a low profile this year."

