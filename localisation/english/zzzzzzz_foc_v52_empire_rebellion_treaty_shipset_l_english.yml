l_english:
 origin_foc_republic_unification_effects:0 "§YStory Path:§!\n- Lead the Galactic Republic through the Separatist crisis, Clone Wars and Order 66\n- Choose the Galactic Empire or Imperial Rebels; ordinary internal breakaway revolts from the Galactic Empire are absorbed by the Imperial Rebels\n- The military Galactic Concordance route requires both Death Stars and Executor, Lusankya and Punisher destroyed, and the Galactic Empire to §Hlose Coruscant, Jakku and Kuat§!. Those systems no longer have to be owned by the Rebels\n- Eliminating the Galactic Empire still triggers the Treaty directly\n- Choosing the Empire automatically unlocks the supplied Empire Ships addon sections and rebuilds automatic designs so Republic hull models do not remain in use\n\n§YConfederate surrender: either victory route is sufficient§!\n§HStory route§!: complete the Coruscant and Utapau battle events and reach 140 conspiracy points.\n§HMilitary route§!: the engine must confirm a Republic victory against the CIS in their actual total war, or the Republic must destroy the CIS during that war. Colony counts, temporary controllers, and a missing CIS are not victory results. Status quo, a Republic defeat, or a third-party destruction of the CIS do not qualify. Neither 140 points nor the two battle events is required.\nIf unfavorable or mixed choices leave the conspiracy below 140, finish the war by military conquest, not by waiting for extra points. Both routes use the staged surrender settlement; the two commanders dying is not a separate victory condition."
 foc_republic_origin.30.a.tt:0 "Your country becomes the Galactic Empire and inherits Republic territory. Completing Death Star II or eliminating the Imperial Rebellion commissions Executor, Lusankya and Punisher at Endor, Coruscant and Jakku. Each group has one Executor-class ship and thirty Imperial II-class escorts. Other Galactic Concordance requirements remain unchanged."
 foc_republic_origin.30.b.tt:0 "§HYour country becomes the Imperial Rebels in place§!. Later ordinary internal breakaway revolts from the Galactic Empire are absorbed into your Rebellion. Destroy both Death Stars and Executor, Lusankya and Punisher, then make the Empire lose §HCoruscant, Jakku and Kuat§! to force the Galactic Concordance; you do not have to own all three yourself."
 foc_republic_origin.160.desc:0 "Both Death Stars and Executor, Lusankya and Punisher have been destroyed, and the Galactic Empire has lost Coruscant, Jakku and Kuat. The three strategic systems need not all be Rebel-owned; the Empire can no longer sustain the war and is forced to sign the Galactic Concordance."
 foc_republic_origin.161.desc:0 "Both Death Stars and Executor, Lusankya and Punisher are gone, and we have lost Coruscant, Jakku and Kuat. Whoever now holds those strategic systems, the Galactic Empire can no longer sustain its old territory and must accept the Galactic Concordance."
 foc_republic_origin.176.desc:0 "Both Death Stars are gone. The remaining military conditions are to destroy Executor, Lusankya and Punisher and make the Galactic Empire lose Coruscant, Kuat and Jakku. The Imperial Rebels no longer need to personally own all three systems. Eliminating the Empire outright remains an immediate alternate route."
 edict_sws_empire_01_addon:0 "Enable Imperial Addon Ship Models"
 edict_sws_empire_01_addon_desc:0 "Unlock additional Imperial hull models and ship sections. The Republic-to-Empire conversion now performs the same unlock automatically."
 tech_sws_empire_01_addon_sections:0 "Additional Imperial Ship Designs"
 tech_sws_empire_01_addon_sections_desc:0 "Unlocks additional Imperial hull models and sections for the ship designer."
