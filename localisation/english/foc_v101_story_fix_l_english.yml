l_english:
 foc_khan_rebel.3.name:0 "The Resistance Is Born"
 foc_khan_rebel.3.desc:0 "§HThe First Order has openly descended upon the galaxy.§! Officers, pilots, intelligence personnel and volunteers unwilling to submit are gathering in secret on §HD'Qar§!.\n\nA new resistance has formed. It lacks the fleets and industry of the Republic at its height, but it is prepared to continue the war.\n\n§YThe Resistance now exists as a hostile power against the First Order.§!"
 foc_khan_rebel.3.a:0 "The war is not over."
