l_english:
 foc_falcon_support.10.name:0 "The Galaxy Answers"
 foc_falcon_support.10.desc:0 "The §YMillennium Falcon§! has crossed the hidden route into the Unknown Regions. Its arrival is followed by thousands of independent signals: veterans, smugglers, local defence forces and surviving Rebel formations have answered the call. Four consolidated battle groups emerge around the Final Order capital and immediately move to engage the Sith fleet."
 foc_falcon_support.10.a:0 "There are more of us."
 FOC_GALACTIC_SUPPORT_FLEET_1:0 "Citizens' Fleet Aurek"
