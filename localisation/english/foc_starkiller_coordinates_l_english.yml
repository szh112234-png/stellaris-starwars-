 foc_starkiller_coords.3.desc:0 "The first Starkiller strike has revealed its firing origin. The Imperial Remnant Gateway is now open to the entire galaxy and leads toward the hidden target system in the Unknown Regions."
 foc_starkiller_coords.3.a:0 "The route is open."
