 FOC_STARKILLER_COORDINATES_PROJECT:0 "Locate Starkiller Base"
 FOC_STARKILLER_COORDINATES_PROJECT_DESC:0 "Analyze the hyperspace energy trail left by the crisis Starkiller Base's first destroyed system and triangulate its hidden coordinates. Once any empire completes this project, every country can use the Imperial Remnant Gateway."
