l_english:
 sai_supremacy_arkship_construction_site:0 "Construct Supremacy Arkship"
 sai_supremacy_arkship_construction_site_DESC:0 "First Order construction ships lay the Supremacy’s primary frame directly in orbit, then expand shipyards, cities, and command facilities until the sixty-kilometer mobile capital awakens."
 sai_supremacy_arkship_construction_site_MEGASTRUCTURE_DETAILS:0 "§YDirect construction by a construction ship§!: costs £alloys£ §Y10000§! and £influence£ §Y250§!, requiring §Y1800 days§!. On completion an initially operational Supremacy joins the fleet, and the empire may commission further arkships of the class."
 edict_sai_supremacy_arkship_command:0 "Supremacy Arkship Command"
 edict_sai_supremacy_arkship_command_desc:0 "Convene the high command to deploy a new Supremacy, complete one at full battle readiness, or order existing military arkships rebuilt around the Supremacy hull."
 edict_sai_supremacy_arkship_command_effect:0 "Open the Supremacy High Command directive."
 sai_supremacy_arkship.19.name:0 "Supremacy Arkship Command"
 sai_supremacy_arkship.19.desc:0 "The Supremacy is more than a flagship: it is a mobile capital, shipyard, and engine of war. High Command awaits its next deployment order."
 sai_supremacy_arkship.19.a:0 "Deploy an Initially Operational Supremacy"
 sai_supremacy_arkship.19.a.tt:0 "Deploy a Supremacy with its primary hull and essential infrastructure completed in the capital system."
 sai_supremacy_arkship.19.b:0 "Deploy a Fully Operational Supremacy"
 sai_supremacy_arkship.19.b.tt:0 "Deploy a Supremacy whose arsenal, shields, hangars, and command infrastructure are already at full readiness."
 sai_supremacy_arkship.19.c:0 "Refit Existing Military Arkships"
 sai_supremacy_arkship.19.c.tt:0 "Order current and future military arkships rebuilt around the corresponding Supremacy hull. Existing colonies, population, modules, and buildings remain operational."
 NAME_SAI_SUPREMACY_ARKSHIP: "Supremacy Arkship"
 NAME_SAI_SUPREMACY_ARKSHIP_TIER_3_FULL: "Supremacy Military Arkship III (Full Rebuild)"
 sai_supremacy_arkship_stats: "Supremacy Superstructure"
 sai_supremacy_arkship_stats_desc: "The Supremacy's immense hull, armor, shields, and Arkship facilities."
 SAI_SUPREMACY_ARKSHIP_TIER_1_SECTION: "Supremacy Main Hull"
 SAI_SUPREMACY_ARKSHIP_TIER_2_SECTION: "Supremacy Main Hull"
 SAI_SUPREMACY_ARKSHIP_TIER_3_SECTION: "Supremacy Main Hull"
 SAI_SUPREMACY_LARGE_TURBOLASER: "Supremacy Heavy Turbolaser"
 SAI_SUPREMACY_LARGE_TURBOLASER_DESC: "A long-range heavy turbolaser adapted from the integrated First/Final Order component profile."
 SAI_SUPREMACY_MEDIUM_TURBOLASER: "Supremacy Medium Turbolaser"
 SAI_SUPREMACY_MEDIUM_TURBOLASER_DESC: "A medium-caliber turbolaser optimized for sustained capital-ship fire."
 SAI_SUPREMACY_SMALL_TURBOLASER: "Supremacy XX-9 Turbolaser"
 SAI_SUPREMACY_SMALL_TURBOLASER_DESC: "A compact XX-9-pattern turbolaser for close and medium-range engagements."
 SAI_SUPREMACY_POINT_DEFENCE_TURBOLASER: "Supremacy Point-Defense Turbolaser"
 SAI_SUPREMACY_POINT_DEFENCE_TURBOLASER_DESC: "Fast-tracking laser cannon used against missiles and strike craft."
 SAI_SUPREMACY_TIE_FIGHTER: "Supremacy TIE Fighter Wing"
 SAI_SUPREMACY_TIE_FIGHTER_DESC:0 "Six TIE fighters form a standard Supremacy carrier wing. They rely on speed and concentrated fire against armor and hull, but struggle against heavy shields and dense point defenses."
 SAI_SUPREMACY_LARGE_DURASTEEL_ARMOR: "Advanced Durasteel Armor"
 SAI_SUPREMACY_LARGE_DURASTEEL_ARMOR_DESC: "Layered durasteel armor integrated with local shield and structural regeneration systems."
 SAI_SUPREMACY_DEFLECTOR_ARRAY: "Deflector Defense Reinforcement Array"
 SAI_SUPREMACY_DEFLECTOR_ARRAY_DESC: "An auxiliary array that improves fire control and regenerates the ship's defensive layers."
 sai_supremacy_arkship_tier_1: "Supremacy Military Arkship I"
 sai_supremacy_arkship_tier_2: "Supremacy Military Arkship II"
 sai_supremacy_arkship_tier_3: "Supremacy Military Arkship III"
 sai_supremacy_arkship_tier_1_plural: "Supremacy Military Arkships I"
 sai_supremacy_arkship_tier_2_plural: "Supremacy Military Arkships II"
 sai_supremacy_arkship_tier_3_plural: "Supremacy Military Arkships III"
 sm_sai_supremacy_hyperspace_tracker_module: "Hyperspace Tracker"
 sm_sai_supremacy_hyperspace_tracker_module_desc: "An active hyperspace tracking array buried deep within the Supremacy. It reads residual jump wakes and reacquires hostile fleets after they emerge from hyperspace."
 sai_supremacy_hyperspace_tracker_module: "Hyperspace Tracker"
 sai_supremacy_hyperspace_tracker_module_desc: "An active hyperspace tracking array buried deep within the Supremacy."
 sai_supremacy_hyperspace_tracker_module_tt: "§YFilm-style Hyperspace Tracking§!: Massively expands strategic sensor and hyperlane detection, while providing complete base intelligence so known fleets can be reacquired after a jump.\n\n§YFixed Axial System§!: Installed automatically only after the Supremacy reaches §YMilitary Arkship III§!. It cannot be removed or replaced; normal Arkships are unaffected."
 SAI_SUPREMACY_HYPERSPACE_TRACKER_SECTION: "Hyperspace Tracker"

