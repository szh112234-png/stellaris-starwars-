l_english:
 foc_republic_origin.192.name:0 "Hosnian Falls: The New Republic Becomes the Resistance"
 foc_republic_origin.192.desc:0 "§HHosnian is gone.§! The capital, Senate and central command are erased by Starkiller Base, and the Republic's remaining territory rapidly falls to the First Order.\n\nThe New Republic is not deleted and no replacement state is created. Its surviving government, fleets and leaders regroup on §HD'Qar§!, while the same country object continues as the §HResistance§!. Player identity, technology, traditions, treasury, fleets and unique historical leaders are preserved; duplicate Leia, Luke, Mon Mothma, Ackbar, Raddus and Lando copies are consolidated."
 foc_republic_origin.192.a:0 "The Republic is gone, but the same resistance endures."
