l_english:
 ap_fop_new_order_crisis_desc:0 "The Empire may have fallen, but the will to impose order endures. Starkiller Base shall be the new throne, and the Imperial Remnant its iron fist among the stars."
 ap_fop_new_order_crisis_effect_tooltip:0 "§YExclusive to the First Order origin§!\nAutomatically granted when Starkiller Base is completed. The Imperial Remnant swears allegiance, the First Order becomes a galactic crisis, and the powers of the galaxy—including the ancient empires—unite in total war. Follow five acts of ambition to conquer the stars, enslave the Force, invade the Shroud, and claim a cosmic throne."

 origin_fop_first_order_effects:0 "The First Order rises from isolated Ilum beyond the galactic rim, begins with stable-wormhole technology, and gains access to the secret route into Imperial Remnant space. No second First Order will emerge from the shadows. Completing Starkiller Base automatically grants the exclusive §YGalactic New Order§! ascension perk.\nStarts with basic turbolasers, mass drivers, concussion missiles and point defense. Advanced weapon technologies are not granted merely for choosing this origin."
 START_SCREEN_FOP_FIRST_ORDER:0 "A long time ago, in a galaxy far, far away....\n\nThe old Empire has fallen. The New Republic sleeps within the illusion of victory, while the last Imperial loyalists vanish into the Unknown Regions.\n\nOn the frozen world of Ilum, the §YFirst Order§! gathers in secret. §YSupremacy§! darkens the sky and lost legions await their command. When Starkiller fire is kindled, the entire galaxy will tremble before a new order...."

 fop_origin.10.desc:0 "The darkness of the Unknown Regions has concealed our ascent. Ilum is now the frozen bastion of the First Order, Supremacy waits above the capital, and a secret passage into Imperial Remnant space has revealed itself.\n\nThe New Republic believes the war ended long ago. Soon it will learn that the Empire's shadow never vanished."
 fop_origin.10.a:0 "The galaxy will remember the First Order."

 fop_origin.11.desc:0 "A transmission bearing the highest Imperial cipher has reached Ilum. The marshals and governors of the Imperial Remnant recognize the First Order as the true heir to the Imperial will, and the secret passage they have guarded for decades now stands open to our fleets.\n\nThe shattered banners of the Empire shall gather beneath one sky again."
 fop_origin.11.a:0 "Let the Empire's last legions rally to our banner."

 fop_origin.20.desc:0 "The heart of Starkiller Base has awakened. Across the same instant, signals of allegiance fill every military channel: the warships, domains, and forge worlds of the Imperial Remnant now belong to the First Order.\n\nFear has driven the powers of the galaxy beneath a single banner. Even empires that slept for untold ages have stirred their ancient war machines to prevent the New Order.\n\nYet farther into darkness, Exegol is calling. The Final Order will reveal itself in twenty years; the loss of Supremacy or Starkiller Base will only hasten the prophecy."
 fop_origin.20.a:0 "Kindle the stars. Make the galaxy kneel."

 fop_origin.50.desc:0 "A dark signal from Exegol pierces the void. The voice of a dead Emperor again declares itself the galaxy's only sovereign, while the fleets of the Sith Eternal wait within the storm.\n\nPalpatine demands the First Order surrender its banner and throne to become the blade of the Final Order. We may answer the summons and command Exegol's legions, or defy the rule of the dead and let the galaxy burn in a war between two orders. Either path still leads toward the throne of the Force."
 fop_origin.50.a:0 "From this moment, we are the Final Order."
 fop_origin.50.a.tt:0 "The state becomes the §YFinal Order§!, the capital moves to Exegol, and Palpatine takes the throne. Exegol's fleets join our command and the galactic war continues."
 fop_origin.50.b.tt:0 "The §YFinal Order§! rises independently on Exegol and the First Order Civil War begins. Some fleets, frontier colonies, and subjects defect; Ilum, Starkiller Base, and Supremacy remain loyal. The §YGalactic New Order§! ambition and the path to apotheosis continue."

 fop_force_ascension_status_edict:0 "Galactic New Order Directive"
 fop_force_ascension_status_edict_desc:0 "Consult the §YGalactic New Order§! archives to review the Supreme Leader's present decree, the progress of conquest, and the powers already claimed."

 fop_origin.55.desc:0 "The storms of Exegol part before a new Emperor, and the Sith Eternal fleet swears allegiance amid endless thunder. The war machine of the First Order and the dark legions of Exegol have become one. The Final Order is crowned.\n\nConquering the galaxy is only the beginning. The Force itself shall wear our chains."

 fop_origin.58.desc:0 "Defying the summons from Exegol has torn the First Order apart. Ambitious officers, frontier governors, and wavering subjects swear themselves to the Final Order. The guns of former comrades now turn toward the capital.\n\nIlum, Starkiller Base, and Supremacy remain in loyal hands. First we will break the false Emperor's legions. Then we will seize the power that stands above all living things."
 fop_origin.58.a:0 "The galaxy will have only one order."

 fop_origin.65.desc.1:0 "§YAct I—Enemy of the Galaxy§!\nStarkiller fire has ignited the galactic war.\n\n§EDecree of the Supreme Leader:§! Fully occupy every colony of one empire and bind it as a Force Thrall."
 fop_origin.65.desc.2:0 "§YAct II—Chains of the Force§!\nThe first state has bent the knee, and billions of wills now dwell within our shadow.\n\n§EDecree of the Supreme Leader:§! Command at least three subjects; if the galaxy already lies conquered, this decree is fulfilled."
 fop_origin.65.desc.3:0 "§YAct III—Galactic Dominion§!\nFear and obedience weave a psionic web between the stars.\n\n§EDecree of the Supreme Leader:§! Subjugate or destroy the galactic powers and the ancient empires. If Exegol was defied, the Final Order must also fall."
 fop_origin.65.desc.4:0 "§YAct IV—Enslave the Force§!\nThe galaxy lies prostrate beneath the throne. Complete §YEnslave the Force§! and forge chains for the unseen power."
 fop_origin.65.desc.5:0 "§YAct V—Invasion of the Shroud§!\nThe Force is chained. Cross the breach and destroy every Shroud avatar within the Sea of the Force."
 fop_origin.65.desc.6:0 "§MFinal Act—Newborn Cosmic Deity§!\nThe stars, the Force, material reality, and the Shroud have become extensions of your will."
 fop_origin.65.a:0 "Let destiny continue."

 fop_origin.71.desc:0 "The first empire has submitted completely. Billions feel terror in the same instant; their cries pass through the Force and dissolve into our will.\n\nThe first chain has been forged."
 fop_origin.71.a:0 "More wills will follow."
 fop_origin.75.desc:0 "No throne beneath the stars remains capable of defying ours. The fear and obedience of countless lives converge within the Force, enough to forge chains around the Force itself.\n\nThe §YEnslave the Force§! project has begun."
 fop_origin.80.desc:0 "The Force once surrounded every living thing. Now it answers a single will. The psionic tides of the galaxy have reversed, and every fear and death among the stars feeds our power.\n\nThe Shroud offers one final act of resistance, tearing open a breach into the Sea of the Force."
 fop_origin.82.desc:0 "Beyond the breach lies no dream, but a psionic realm never conquered by mortal fleets. The Will of the Shroud awakens corrupted avatars and arrays them around the Empty Throne.\n\nThe last war will be fought beyond reality."
 fop_origin.91.desc:0 "The last Shroud avatar dissolves into silence. The Sea of the Force grows still, and the Empty Throne stands exposed before our fleets.\n\nNo guardian remains to prevent the final rite."
 fop_origin.100.desc:0 "Material reality trembles and the Shroud falls eternally silent. The ruler's consciousness passes beyond flesh, death, and time, entering the Force, the stars, and the deepest laws of existence.\n\nThe First Order no longer rules the universe. The First Order is the universe."

 fop_ambition_window_subtitle:0 "Conquer the stars, enslave the Force, invade the Shroud, and claim a cosmic throne. Even defiance of Exegol cannot end this path."
 fop_ambition.2.desc:0 "§YAct I—Galactic War§!\nAwaken Starkiller Base, receive the Imperial Remnant, and reveal the galaxy's true enemy.\n\n§YAct II—Chains of the Force§!\nThe first Force Thrall grants larger fleets, swifter fire, and an unbroken will to wage war.\n\n§YAct III—Galactic Dominion§!\nOnce three states submit, their fear further strengthens our armada.\n\n§YAct IV—Enslave the Force§!\nRule the galaxy and complete §YEnslave the Force§!. If Exegol was defied, the civil war must first be won.\n\n§YAct V—Shroud Apotheosis§!\nInvade the Sea of the Force, destroy its avatars, and complete the rite upon the Empty Throne."
 fop_ambition_show_rewards:0 "Review Claimed Powers"
 fop_ambition_show_objectives:0 "Hear the Supreme Decree"
 fop_ambition_points_tooltip:0 "Destroying an enemy ship grants §Y1§!, conquering a colony §Y25§!, and binding or destroying an empire §Y100§! Ambition. Each ascent also requires fulfillment of the corresponding imperial decree."
 fop_ambition_stage_1_name:0 "ACT I  GALACTIC WAR"
 fop_ambition_stage_2_name:0 "ACT II  CHAINS OF THE FORCE"
 fop_ambition_stage_3_name:0 "ACT III  GALACTIC DOMINION"
 fop_ambition_stage_4_name:0 "ACT IV  ENSLAVE THE FORCE"
 fop_ambition_stage_5_name:0 "ACT V  SHROUD APOTHEOSIS"

 wg_fop_galactic_crisis:0 "Galactic Resistance War"
 war_goal_wg_fop_galactic_crisis:0 "Galactic Resistance War"
 war_goal_wg_fop_galactic_crisis_desc:0 "Faced with Starkiller fire, the powers of the galaxy set aside their old rivalries and form a united front to defend the last remnants of freedom."
