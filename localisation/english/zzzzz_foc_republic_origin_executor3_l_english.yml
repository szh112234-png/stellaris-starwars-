l_english:
 NAME_FOC_REPUBLIC_ORIGIN_EXECUTOR_THREE:0 "Punisher"
 FOC_REPUBLIC_ORIGIN_EXECUTOR_ENDOR_GUARD_FLEET:0 "Executor Endor Guard Fleet"
 FOC_REPUBLIC_ORIGIN_LUSANKYA_CORUSCANT_GUARD_FLEET:0 "Lusankya Coruscant Guard Fleet"
 FOC_REPUBLIC_ORIGIN_PUNISHER_JAKKU_GUARD_FLEET:0 "Punisher Jakku Guard Fleet"
 foc_republic_origin.180.name:0 "Three Executor-class Flagships Commissioned"
 foc_republic_origin.180.desc:0 "Executor guards Endor, Lusankya guards Coruscant, and Punisher guards Jakku. Each of the three groups consists of one Executor-class flagship and thirty Imperial II-class escorts. The unique flagships are commissioned once and are never rebuilt after destruction."
 foc_republic_origin_scarif_intelligence_desc:0 "Unlocked only after Leia is rescued and the complete plans are delivered. Grants +50% weapon damage to shields. The separate Death Star I attack solution still requires a living station and Rebel presence in its system."
 foc_republic_origin.165.desc:0 "The routes into the Unknown Regions are complete. Ilum and the First Order technologies are unlocked. If the surviving state is the post-Treaty Imperial Remnant, completion of the plan immediately renames it the First Order and installs Supreme Leader Snoke. The formal crisis, ship-culture conversion and galaxy-wide war still wait for a completed Starkiller Base."
 origin_foc_republic_unification_effects:0 "§YStory Path:§!\n- Lead the Galactic Republic through the Separatist crisis, Clone Wars and Order 66\n- Choose the Galactic Empire or Imperial Rebels; ordinary internal breakaway revolts from the Galactic Empire are absorbed by the Imperial Rebels\n- The military Galactic Concordance route requires both Death Stars and Executor, Lusankya and Punisher destroyed, and the Galactic Empire to §Hlose Coruscant, Jakku and Kuat§!. Those systems no longer have to be owned by the Rebels\n- Eliminating the Galactic Empire still triggers the Treaty directly\n- Choosing the Empire automatically unlocks the supplied Empire Ships addon sections and rebuilds automatic designs so Republic hull models do not remain in use\n\n§YConfederate surrender: either victory route is sufficient§!\n§HStory route§!: complete the Coruscant and Utapau battle events and reach 140 conspiracy points.\n§HMilitary route§!: the engine must confirm a Republic victory against the CIS in their actual total war, or the Republic must destroy the CIS during that war. Colony counts, temporary controllers, and a missing CIS are not victory results. Status quo, a Republic defeat, or a third-party destruction of the CIS do not qualify. Neither 140 points nor the two battle events is required.\nIf unfavorable or mixed choices leave the conspiracy below 140, finish the war by military conquest, not by waiting for extra points. Both routes use the staged surrender settlement; the two commanders dying is not a separate victory condition."
 foc_republic_origin.30.a.tt:0 "Your country becomes the Galactic Empire and inherits Republic territory. Completing Death Star II or eliminating the Imperial Rebellion commissions Executor, Lusankya and Punisher at Endor, Coruscant and Jakku. Each group has one Executor-class ship and thirty Imperial II-class escorts. Other Galactic Concordance requirements remain unchanged."
 foc_republic_origin.30.b.tt:0 "§HYour country becomes the Imperial Rebels in place§!. Destroy both Death Stars and Executor, Lusankya and Punisher, then control Coruscant, Jakku and Kuat—or eliminate the Empire outright—to found the New Republic."
 foc_republic_origin.160.desc:0 "Both Death Stars and all three Executor-class flagships—Executor, Lusankya and Punisher—have been destroyed, while the Alliance controls Coruscant, Jakku and Kuat. The Galactic Empire is forced to sign the Galactic Concordance."
 foc_republic_origin.161.desc:0 "Both Death Stars and all three Executor-class flagships—Executor, Lusankya and Punisher—have been destroyed, while the Alliance controls Coruscant, Jakku and Kuat. The Empire can no longer sustain the war and accepts the Galactic Concordance."
 foc_republic_origin.171.desc:0 "Death Star I has been destroyed. The Rebels receive their existing victory reward, and the old Death Star attack bonus ends immediately.\n\nA player Empire receives the Death Star II engineering project immediately; completion triggers Bothan intelligence and deploys the station at Endor. An AI Empire reveals and deploys its unfinished station exactly four years after this loss. Existing Imperial support-fleet rules remain in effect."
 foc_republic_origin.176.desc:0 "Both Death Stars are gone. To force the Galactic Concordance, the Alliance must also destroy Executor, Lusankya and Punisher and control Coruscant, Jakku and Kuat. Eliminating the Empire outright remains an alternate route."
 foc_republic_origin.177.desc:0 "The Scarif operation secures the Death Star archive, but the complete plans have not yet safely reached Alliance command.\n\nThis event records the theft only. The Alderaan and Leia aftermath waits thirty days after Scarif. Death Star targeting and shield-damage intelligence unlock only when the Leia rescue event fires."