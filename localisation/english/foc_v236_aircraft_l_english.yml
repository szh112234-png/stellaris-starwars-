 FOC_TRADE_LUCREHULK_ARC170:0 "Separatist Droid Tri-fighter Squadron (24 craft | BALANCED | 1x)"
 FOC_TRADE_LUCREHULK_ARC170_DESC:0 "24 craft per squadron. Base aggregate damage per firing cycle: 2000 (about 83.3333 per craft), NOT per-craft damage or DPS.\nTotal hull 2400, armor 480, shields 0, divided among the craft. Point defense against strike craft and missiles; green bolts.\nVisual size does not multiply count or combat stats. Country, ship, technology and fire-rate bonuses apply separately. Use distinct hangar numbers on the same carrier for strategic dispatch."
 FOC_TRADE_LUCREHULK_ARC170_FOC_FIXED_LOWEST:0 "Separatist Droid Tri-fighter Squadron (24 craft | LOWEST | 1x)"
 FOC_TRADE_LUCREHULK_ARC170_FOC_FIXED_LOWEST_DESC:0 "24 craft per squadron. Base aggregate damage per firing cycle: 80 (about 3.3333 per craft), NOT per-craft damage or DPS.\nTotal hull 320, armor 320, shields 0, divided among the craft. Point defense against strike craft and missiles; green bolts.\nVisual size does not multiply count or combat stats. Country, ship, technology and fire-rate bonuses apply separately. Use distinct hangar numbers on the same carrier for strategic dispatch."
 FOC_TRADE_LUCREHULK_ARC170_FOC_LOWEST:0 "Separatist Droid Tri-fighter Squadron (24 craft | LOWEST | 1x)"
 FOC_TRADE_LUCREHULK_ARC170_FOC_LOWEST_DESC:0 "24 craft per squadron. Base aggregate damage per firing cycle: 80 (about 3.3333 per craft), NOT per-craft damage or DPS.\nTotal hull 320, armor 320, shields 0, divided among the craft. Point defense against strike craft and missiles; green bolts.\nVisual size does not multiply count or combat stats. Country, ship, technology and fire-rate bonuses apply separately. Use distinct hangar numbers on the same carrier for strategic dispatch."
