l_english:
 foc_republic_origin.197.name:0 "Resistance Begins in Exile"
 foc_republic_origin.197.desc:0 "§LThe New Republic's façade of peace finally fractures.§!\n\nLeia Organa's warnings about the First Order's military buildup in the Unknown Regions have long been dismissed by the Senate, while political enemies expose her blood relation to Darth Vader. She resigns and leaves for §HD'Qar§! with Ackbar, Ematt, Poe Dameron, veterans of the old Rebellion, and a new generation of pilots.\n\nFrom this moment, the §HResistance§! formally begins. If the New Republic is player-controlled, the established inheritance rules resolve the state split; other routes establish an independent D'Qar resistance force."
 foc_republic_origin.197.a:0 "The Resistance begins at D'Qar."

 fop_origin.33.name:0 "Leia's Choice: The D'Qar Resistance"
 fop_origin.33.desc:0 "§LLeia Organa will no longer wait for a government that refuses to act.§!\n\nWhether the First Order already exists in the Unknown Regions, the First Order Plan has just made the threat real, or the normal historical clock has reached the political break, Leia reaches the same conclusion: preparations cannot wait until enemy fleets appear over the capital.\n\nAckbar, Ematt, Poe Dameron and veterans of the old Rebellion follow her to §HD'Qar§!, where an independent §HResistance§! begins operating outside the New Republic command structure.\n\n§YThe First Order origin triggers this at game start; other origins trigger it when the First Order Plan is completed; the original timed trigger remains as a non-duplicating fallback.§!"
 fop_origin.33.a:0 "D'Qar will keep watch."
