 foc_canon.11.name:0 "Maul's Coup (20 BBY)"
 foc_canon.11.desc:0 "Mandalore's long neutrality collapses from within. The former Sith §HMaul§! binds Death Watch, Black Sun, the Pyke Syndicate and other criminal powers into the Shadow Collective, then uses Mandalore's own political divisions to open the capital to him.\n\nMaul refuses to remain a hidden patron. Following one of Mandalore's oldest and most brutal traditions, he wins a public duel and takes the §HDarksaber§!. Part of Death Watch immediately swears loyalty to its new ruler.\n\nDuchess Satine is captured. Maul executes her before Obi-Wan Kenobi, turning private vengeance into the founding spectacle of his new regime.\n\nMandalore has not truly submitted. Satine's sister, §HBo-Katan Kryze§!, rejects an outsider's claim through the Darksaber and leads loyal clans away from Death Watch. Maul holds the capital, but resistance is already spreading across the world."

 foc_canon.41.name:0 "Siege of Mandalore (19 BBY)"
 foc_canon.41.desc:0 "The Republic is only steps from its own destruction, yet Mandalore's civil war remains unfinished. Bo-Katan asks the Republic for aid, while the Jedi Council cannot openly intervene in a neutral system. In the end, the person who accepts the request is §HAhsoka Tano§!, no longer a member of the Jedi Order.\n\nAnakin places part of the 501st under her command. The orange-marked §H332nd Company§! enters Mandalore beside Ahsoka and Rex as Bo-Katan's resistance attacks from within the cities. Republic gunships cross the capital while Death Watch and Maul's super commandos make their last stand.\n\nMaul has already sensed that disaster is approaching. He tries to convince Ahsoka to join him against Darth Sidious, but she refuses. Their duel carries them from the throne room into the city's superstructure. Ahsoka finally defeats and §Hcaptures Maul§!.\n\nMaul's government collapses. Bo-Katan reunites the loyal clans and assumes authority, while Republic troops do not annex the system. Mandalore remains an §Hindependent state§!. But as the transport carrying Maul leaves the world, another order is already being prepared for every clone army in the galaxy..."

 foc_mandalore.20.name:0 "Imperial Annexation of Mandalore"
 foc_mandalore.20.desc:0 "The Republic is gone. The newborn Galactic Empire has no intention of tolerating an independent Mandalore with beskar deposits, armed clans and a military tradition outside Imperial control. Imperial forces enter the system, strip Bo-Katan's government of authority and seize the capital and orbital infrastructure.\n\nMandalorian sovereignty is formally abolished. Some clans disappear underground; others try to survive somewhere between occupation and collaboration. Maul escapes amid the chaos surrounding the Republic's collapse, but Mandalore gains no freedom from it."

 foc_canon.48.name:0 "Night of a Thousand Tears"
 foc_canon.48.desc:0 "The destruction of the second Death Star does not bring freedom to Mandalore. Imperial forces decide to settle the question permanently. Bombers, cruisers and ground formations strike together, targeting not merely military positions but cities, armor forges, clan strongholds and everything capable of sustaining Mandalorian society.\n\nFire rolls across the planet. Survivors will remember it as the §HNight of a Thousand Tears§!. The objective is not to occupy Mandalore again, but to convince its people that their homeworld can never be lived on again.\n\nDeep below the ruins, however, the Imperial officer §HGideon§! leaves behind a project absent from public battle reports: a hidden cloning and experimentation complex. Mandalore is declared dead while the Empire continues its work beneath the corpse."

 foc_canon.30.name:0 "The Restoration of Mandalore"
 foc_canon.30.desc:0 "Six years have passed since the Galactic Treaty, and Mandalore is still held by the Imperial Remnant. The fire that swept the homeworld did not destroy its people; it scattered the surviving clans across the galaxy. Now the clans judge Imperial control weak enough to strike.\n\n§HBo-Katan Kryze§! gathers the exiles, while §HDin Djarin§! and Mandalorian strike teams return to the homeworld. The coalition breaks through the remaining defenses and storms §HMoff Gideon's§! hidden cloning facility beneath the ruined cities, destroying the base completely.\n\nDuring the final fighting Gideon crushes the §HDarksaber§! in his armored hand. The ancient symbol once used to determine Mandalorian legitimacy is gone.\n\nThis time no Republic army decides Mandalore's future. The clans proclaim sovereignty over the ruins, and §HMandalore is reborn as an independent state§!."

 foc_mandalore_neutral_state:0 "Neutral Mandalore"
 foc_mandalore_neutral_state_desc:0 "Satine's government preserves Mandalorian sovereignty and neutrality, refusing to join the Republic-Separatist war."
 foc_mandalore_shadow_collective_state:0 "Shadow Collective Rule"
 foc_mandalore_shadow_collective_state_desc:0 "Maul controls Mandalore through Death Watch and criminal syndicates, replacing neutral governance with violence and fear."
 foc_mandalore_clan_coalition:0 "Mandalorian Clan Coalition"
 foc_mandalore_clan_coalition_desc:0 "Bo-Katan has reunited clans that reject foreign rule."
 foc_mandalore_332nd_deployment:0 "332nd Company Deployed"
 foc_mandalore_332nd_deployment_desc:0 "Ahsoka Tano and Rex lead the 332nd Company in the Siege of Mandalore."
 foc_mandalore_imperial_occupation:0 "Imperial Occupation of Mandalore"
 foc_mandalore_imperial_occupation_desc:0 "Imperial garrisons control Mandalore's cities, orbital infrastructure and beskar economy."
 foc_mandalore_gideon_secret_clone_base:0 "Gideon's Secret Clone Base"
 foc_mandalore_gideon_secret_clone_base_desc:0 "A hidden Imperial experimental facility beneath Mandalore's ruins is conducting covert cloning and enhancement programs."
 foc_mandalore_restored_sovereignty:0 "Restored Mandalorian Sovereignty"
 foc_mandalore_restored_sovereignty_desc:0 "The clans have returned to their homeworld and restored an independent state. The Darksaber is gone; the new Mandalore no longer uses it to determine legitimacy."
 FOC_DIN_DJARIN:0 "Din Djarin"
 leader_trait_foc_bo_katan_legendary:0 "Legendary Commander: Bo-Katan"
 leader_trait_foc_bo_katan_legendary_desc:0 "A veteran of Mandalorian clan politics and warfare, Bo-Katan excels at uniting divided warriors around a common objective and committing elite forces at decisive points."
 leader_trait_foc_din_djarin_legendary:0 "Legendary Commander: Din Djarin"
 leader_trait_foc_din_djarin_legendary_desc:0 "Forged by years as a bounty hunter and Mandalorian warrior, Din Djarin excels at small-unit strikes, pursuit and preserving a fighting core when the situation turns against him."
 foc_mandalore_new_republic_accession:0 "Mandalore Joins the New Republic"
 foc_mandalore_new_republic_accession_desc:0 "Imperial Rebels controlled the Mandalore system when the Galactic Treaty was signed. As the Rebellion reorganizes into the New Republic, Mandalore enters New Republic territory. Bo-Katan Kryze and Din Djarin join its command structure; when Leia later organizes a new Resistance, both commanders will follow her movement."
