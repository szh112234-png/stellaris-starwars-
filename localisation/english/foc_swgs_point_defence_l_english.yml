 FOC_KHAN_DEFENCE_TURBO_G:0 "Defensive Turbolaser (Green)"
 FOC_KHAN_DEFENCE_TURBO_G_DESC:0 "Green turbolaser bolts sweep the space around the hull with high-speed mounts and precision tracking."
 FOC_REBEL_DEFENCE_TURBO_R:0 "Defensive Turbolaser (Red)"
 FOC_REBEL_DEFENCE_TURBO_R_DESC:0 "Red turbolaser fire forms a continuous close-defense screen against strike craft and guided weapons."
 foc_tech_rebel_ship_sections:0 "Rebel Hull Architecture"
 foc_tech_rebel_ship_sections_desc:0 "Hull architecture standardized across Rebel, Mon Calamari and successor shipyards."
