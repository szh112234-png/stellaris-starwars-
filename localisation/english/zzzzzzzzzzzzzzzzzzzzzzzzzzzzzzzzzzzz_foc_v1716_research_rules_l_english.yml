 foc_v1716_republic_start_arsenal_allowed:0 "Republic arsenal: complete the Kuat Drive Yards expansion"
 FOC_REPUBLIC_ORIGIN_KUAT_INVESTMENT_PROJECT_DESC:0 "Republic engineering will fund new heavy slipways at Kuat Drive Yards, large enough for a new generation of capital ship. Completion unlocks the §HVenator-class Star Destroyer§! and advances §HPalpatine's Plot§!.\n\nCompleting the expansion unlocks §HAdvanced Durasteel Armor§! and grants an orbital ring at Kuat. If no ring, construction or ruins already occupy the site, a §Htier III orbital ring§! with §Hfour shipyards§! is completed immediately.\n\n§YWeapon access:§! Complete the Kuat Drive Yards expansion to unlock the Republic's 17 starting weapon families. Later stages open research paths without granting advanced weapon technology. Support ships retain their fitted equipment; production blueprints require research for their fitted weapons."
 origin_foc_republic_unification_effects:0 "§YStory Path:§!\n- Lead the Galactic Republic through the Separatist crisis, Clone Wars and Order 66\n- Choose the Galactic Empire or Imperial Rebels; ordinary internal breakaway revolts from the Galactic Empire are absorbed by the Imperial Rebels\n- The military Galactic Concordance route requires both Death Stars and Executor, Lusankya and Punisher destroyed, and the Galactic Empire to §Hlose Coruscant, Jakku and Kuat§!. Those systems no longer have to be owned by the Rebels\n- Eliminating the Galactic Empire still triggers the Treaty directly\n- Choosing the Empire automatically unlocks the supplied Empire Ships addon sections and rebuilds automatic designs so Republic hull models do not remain in use\n\n§YConfederate surrender: either victory route is sufficient§!\n§HStory route§!: complete the Coruscant and Utapau battle events and reach 140 conspiracy points.\n§HMilitary route§!: the engine must confirm a Republic victory against the CIS in their actual total war, or the Republic must destroy the CIS during that war. Colony counts, temporary controllers, and a missing CIS are not victory results. Status quo, a Republic defeat, or a third-party destruction of the CIS do not qualify. Neither 140 points nor the two battle events is required.\nIf unfavorable or mixed choices leave the conspiracy below 140, finish the war by military conquest, not by waiting for extra points. Both routes use the staged surrender settlement; the two commanders dying is not a separate victory condition.\n\n§YWeapon access:§! Complete the Kuat Drive Yards expansion to unlock the Republic's 17 starting weapon families. Later stages open research paths without granting advanced weapon technology. Support ships retain their fitted equipment; production blueprints require research for their fitted weapons."
