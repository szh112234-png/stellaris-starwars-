 myk_starkiller_base_final_DESC:0 "A planet-scale superweapon capable of annihilating a target system and collapsing its stars into black holes."
 myk_starkiller.10.desc:0 "As the final armour belt closes, the focusing core deep within the planet begins to thunder. Energy conduits spanning the crust ignite in sequence. This world is no longer a world, but a weapon capable of reshaping the fate of the galaxy. Starkiller Base is now combat-ready and awaits its first target."
 myk_starkiller.310.desc:0 "Starkiller Base has locked onto the target beacon. Confirm to begin the main weapon's direct charging sequence and fire."
 myk_starkiller_dyson_gun_button:0 "Select a target system and confirm the star or planet to strike. Firing puts the base on a ~360-day cooldown (180-day charge + 180-day recharge after impact); the button shows the remaining time."
 myk_starkiller_dyson_shot_activity_key:0 "Starkiller Base cooling down"
 myk_starkiller_dyson_shot_progress_activity_key:0 "Starkiller Base charging: [PROGRESS]%"
 myk_starkiller_dyson_targeting_activity_key:0 "Starkiller Base acquiring target"
 myk_starkiller_dyson.8100.title:0 "Select Starkiller Strike Target"
 myk_starkiller_dyson.8090.title:0 "Select Starkiller Strike Mode"
 myk_starkiller_dyson.8090.desc:0 "The §H[event_target:myk_starkiller_target_system.GetName] System§! is locked. Choose a strike mode. “Destroy All Habitable Worlds” will search the system for every world capable of sustaining life or colonization; ordinary planets will break apart in the beam, while ringworld sections become shattered ruins. The 180-day charging sequence begins only after a mode or specific body is confirmed, followed by another 180 days to gather stellar energy again."
 myk_starkiller_target_all_habitable_option:0 "Destroy All Habitable Planets (Dynamic Detection; Ruin Rings)"
 myk_starkiller_target_single_planet_menu:0 "Destroy One Planet..."
 myk_starkiller_back_to_main_menu:0 "Return to Strike Mode Menu"
 myk_starkiller_dyson.8102.title:0 "Select One Planet"
 myk_starkiller_dyson.8102.desc:0 "Select the individual celestial body to destroy in the §H[event_target:myk_starkiller_target_system.GetName] System§!. Non-star bodies are shown in paginated lists. The 180-day firing sequence starts only after a target is confirmed."
 myk_starkiller_dyson.8100.desc:0 "The §H[event_target:myk_starkiller_target_system.GetName] System§! is locked. Target its star to annihilate the system, or choose any non-star celestial body from the paged list, including habitable worlds, barren worlds, gas giants, asteroids, moons and ring-world sections. §YThe 180-day firing sequence begins only after this selection; impact is followed by a 180-day cooldown.§!"
 myk_starkiller_target_star_option:0 "Target the star — annihilate the system"
 myk_starkiller_next_target_page:0 "Next target page"
