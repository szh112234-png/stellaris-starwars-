l_english:
 foc_ds2_integration.bothan.name:0 "Bothan Spynet Intelligence Operation"
 foc_ds2_integration.bothan.desc:0 "After learning of the Death Star, the Bothan Spynet committed its full network. Despite brutal Imperial counterintelligence operations, its agents located the second Death Star at §HEndor§! and recovered critical structural blueprints.\n\nMany Bothans died to bring us this information. The unfinished station is operational, but cannot move. The old Scarif attack solution expired with Death Star I and does not apply to this station."
 foc_ds2_integration.bothan.a:0 "Their sacrifice will not be forgotten."
 foc_ds2_integration.bothan.empire.desc:0 "The second Death Star is operational above Endor, although its outer shell and propulsion systems remain unfinished. The Bothan Spynet has penetrated our security, revealing the construction site and technical plans to the Rebels.\n\nHull, armor, shields and weapon output are 1.3 times those of Death Star I. A player-controlled Empire may now research the optional mobile refit."
 foc_ds2_integration.bothan.empire.a:0 "Secure Endor and prepare the refit."
 FOC_DS2_MOBILE_REFIT_PROJECT:0 "Death Star II: Completion and Mobile Refit"
 FOC_DS2_MOBILE_REFIT_PROJECT_DESC:0 "Finish the outer shell and propulsion systems. Replace the unfinished appearance with the original Death Star I model scaled to 1.3 times its size, and restore its mobility. Combat statistics remain at 1.3 times Death Star I. This optional project is available only to a human Empire. A refit completed during combat is applied after combat ends."
 foc_ds2_integration.refit.name:0 "Death Star II Fully Operational"
 foc_ds2_integration.refit.desc:0 "The final armor panels are sealed and propulsion systems are online. Death Star II now uses the complete Death Star I model at 1.3 times the size, with restored mobility and unchanged Phase-II combat statistics."
 foc_ds2_integration.refit.a:0 "Engage propulsion."
