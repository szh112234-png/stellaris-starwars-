l_english:
 foc_coldwar.2.name:0 "Galactic Cold War"
 foc_coldwar.2.desc:0 "The old Galactic Civil War is over, but peace has never become secure. The §HNew Republic§! and the §HImperial Remnant§! now face each other as two powerful, inward-looking §HFallen Empires§!, separated by Jakku and the borders of the old war. Both possess fleets far beyond the reach of ordinary states, yet neither is willing to ignite another total war.\n\nBeyond the public hyperspace routes, the Unknown Regions still conceal the fate of many vanished Imperial formations. The galaxy appears peaceful; in reality, it has entered a long cold war."
 foc_coldwar.2.a:0 "Peace is only the interval between wars."
