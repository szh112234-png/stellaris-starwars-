 foc_fallen_war.6.name:0 "After the Battle of Jakku"
 foc_fallen_war.6.desc:0 "The §HBattle of Jakku§! is over. The last great Imperial armada has been destroyed above the desert. The New Republic governs from Hosnian Prime in a rim cluster on one side of the galaxy, while the Imperial Remnant has withdrawn to Bastion on the opposite rim, preserving Executor-class dreadnoughts and Death Star superweapons.\n\nThe old war appears over, but the First Order is already growing in the Unknown Regions, and the Final Order still waits beyond forgotten Sith routes. The appearance of these two old powers marks the beginning of the post-Jakku era."
 foc_fallen_war.6.a:0 "The old war is over. The next is approaching."
 foc_fallen_war.11.name:0 "War in Heaven"
 foc_fallen_war.11.desc:0 "The founding of the Galactic Community shatters a balance maintained for decades. The New Republic recalls its Nebula fleets while the Imperial Remnant reignites dormant Star Destroyers. Forces from twenty systems cross the frontier at once, beginning a galactic war over the legacy of the old Empire."
 foc_fallen_war.11.a:0 "The galaxy is divided once more."
 foc_fallen_war.21.name:0 "Shadow of the Unknown Regions"
 foc_fallen_war.21.desc:0 "The Imperial Remnant has lost its final colony. Its fall has not brought peace: the First Order is assembling in the Unknown Regions. After a brief warning, Starkiller Base will prioritize the New Republic capital in the Hosnian Prime system."
 foc_fallen_war.21.a:0 "The war is far from over."
 foc_fallen_war.22.name:0 "Fall of the New Republic"
 foc_fallen_war.22.desc:0 "The New Republic has lost its final colony before the First Order appeared. The power vacuum accelerates the crisis. Once established, the First Order will immediately absorb the surviving Imperial Remnant and take over its ten systems, fleets, colonies and fortresses."
 foc_fallen_war.22.a:0 "The remnants have become the foundation of a new order."
 FOC_SW_NEW_REPUBLIC_ENGINEERING_CORPS:0 "New Republic Engineering Corps"
 FOC_SW_IMPERIAL_REMNANT_ENGINEERING_CORPS:0 "Imperial Remnant Engineering Corps"

