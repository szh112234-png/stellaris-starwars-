 # Jakku-exclusive planetary feature
 d_foc_sw_jakku_star_destroyer_graveyard:0 "Star Destroyer Graveyard"
 d_foc_sw_jakku_star_destroyer_graveyard_desc:0 "After the Battle of Jakku, the wrecks of Imperial Star Destroyers and support vessels lay half-buried across the desert. Salvage crews recover armor, reactor assemblies, and shipboard systems that can still be studied."

