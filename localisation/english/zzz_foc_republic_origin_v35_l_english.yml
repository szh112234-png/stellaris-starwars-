l_english:
 foc_republic_origin.60.desc:0 "The Imperial coup has failed and Palpatine's Empire has broken apart. The surviving powers sign the §HGalactic Concordance§!:\n\n- The Inner Rim reforms as the §HNew Republic§! with its capital at §HHosnian Prime§!, still under your command;\n- The Outer Rim withdraws to Bastion and holds the last Imperial territory as the §HImperial Remnant§!;\n- Both remain ordinary successor states rather than Fallen Empires;\n- Both sides retain their legacy post-war fleet packages.\n\nThe treaty is signed. Somewhere in the Unknown Regions, there are those who do not recognise it."
 foc_republic_origin.160.desc:0 "Both Death Stars are destroyed, the Inner Rim is yours and Jakku has fallen. The §HGalactic Concordance§! is signed:\n\n- The Alliance reforms as the ordinary §HNew Republic§! at §HHosnian Prime§! and receives the sealed §HViscount-class§! design;\n- The Imperial remnant withdraws to Bastion as the ordinary §HImperial Remnant§!;\n- Both retain their legacy post-war fleet packages without becoming Fallen Empires.\n\nThe galaxy is quiet at last. Only from the Unknown Regions has nothing been heard."
 foc_republic_origin.161.desc:0 "Both Death Stars are gone and the rebels hold the Inner Rim and Jakku. The Empire signs the §HGalactic Concordance§!:\n\n- The Alliance founds the ordinary §HNew Republic§! at §HHosnian Prime§! and receives the sealed §HViscount-class§! design;\n- We withdraw to Bastion as the ordinary §HImperial Remnant§!;\n- Both retain their legacy post-war fleet packages without becoming Fallen Empires.\n\nThe signatures are genuine. The fleet numbers that sailed for the Unknown Regions appear on no handover list."
