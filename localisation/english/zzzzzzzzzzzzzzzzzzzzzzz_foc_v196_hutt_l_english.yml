 FOC_V196_HUTT_CRIMINAL_EMPIRE:0 "Hutt Criminal Empire"
 FOC_V196_HUTT_CRIMINAL_EMPIRE_ADJ:0 "Hutt"
 FOC_V196_HUTT_PRESET:0 "Hutt Criminal Empire"
 FOC_V196_HUTT_SPECIES_BIO:0 "Ancient, long-lived Hutt kajidics bind trade, tribute and organized crime into one corporate underworld stretching across the Outer Rim."
 FOC_V196_HUTT_RULER_NAME:0 "Jabba Desilijic Tiure"
 FOC_V196_HUTT_RULER_TITLE:0 "Grand Hutt"
 origin_foc_hutt_criminal_empire:0 "Hutt Criminal Empire"
 origin_foc_hutt_criminal_empire_desc:0 "The Hutt kajidics rule a criminal corporate state from Nal Hutta, with Tatooine and Nar Shaddaa anchoring their Outer-Rim underworld."
 origin_foc_hutt_criminal_empire_effects:0 "§YStarting Effects:§!\n- Begins in the §HGalactic Republic era§! with an AI Galactic Republic on Coruscant\n- Requires a §HCorporate§! authority with §HCriminal Heritage§!\n- The player directly owns §HTatooine§!, §HNal Hutta§! and §HNar Shaddaa§!\n- §HNal Hutta§! becomes the capital and the temporary engine home is removed\n- No additional AI Hutt empire is created"
 START_SCREEN_FOC_HUTT_CRIMINAL_EMPIRE:0 "A long time ago, in a galaxy far, far away....\n\nFor ages the Hutt kajidics have treated law, commerce and crime as different names for the same instrument of power. From the swamps of Nal Hutta, contracts and blood debts reach the moonlit towers of Nar Shaddaa and the desert ports of Tatooine.\n\nThe Galactic Republic still governs from Coruscant, and the Naboo Crisis has begun to disturb its long peace. Beyond the Senate's reach, the clans stand united beneath a single criminal corporate empire. Every smuggler's route is a trade lane, every protection payment is tribute, and every distant market is an invitation."
