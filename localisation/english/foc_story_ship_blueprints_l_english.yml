l_english:
 tech_foc_rebel_nebula_blueprint:0 "Nebula-class Construction Blueprint"
 tech_foc_rebel_nebula_blueprint_desc:0 "After the fall of the Final Order, the complete design of the New Republic's Nebula-class Star Destroyer is entrusted to the galaxy's light-side guardian. The vessel is built from a fixed whole-ship blueprint; its exclusive weapons and components are not made separately available in the ship designer."

 tech_foc_rebel_viscount_blueprint:0 "Viscount-class Construction Blueprint"
 tech_foc_rebel_viscount_blueprint_desc:0 "The complete preserved design of the New Republic's Viscount-class Star Defender. The vessel is built from a fixed whole-ship blueprint; its exclusive weapons and components are not made separately available in the ship designer."

 tech_foc_jakku_executor_blueprint:0 "Executor-class Super Star Destroyer"
 tech_foc_jakku_executor_blueprint_desc:0 "The Galactic Empire develops the Executor-class Super Star Destroyer from its Imperial-class industrial base. Completing this rare engineering technology adds the sealed fixed design to Imperial shipyards; excavating the Jakku wreckage can also award the blueprint directly. Its exclusive weapons and components remain hidden and cannot be used separately."

 foc_jakku_executor_wreckage_site:0 "Executor Wreckage of Jakku"
 foc_jakku_executor_wreckage_site_intro:0 "Metallic returns far larger than an ordinary Imperial-class Star Destroyer are scattered beneath Jakku's dunes. They may conceal sections of an Executor-class Super Star Destroyer and intact Imperial data vaults."

 foc_jakku_executor_site.1.name:0 "Echoes Beneath the Sand"
 foc_jakku_executor_site.1.desc:0 "Ground-penetrating scans have mapped the graveyard in three dimensions. Countless Star Destroyer wrecks overlap below Jakku's dunes, but an immense skeletal structure in the deepest layer warrants excavation."
 foc_jakku_executor_site.1.a:0 "Mark the deep wreckage."

 foc_jakku_executor_site.2.name:0 "The Dreadnought's Bones"
 foc_jakku_executor_site.2.desc:0 "The buried keel and armored compartments greatly exceed Imperial-class specifications. Hull codes identify them as Executor-class support structures lost during the Battle of Jakku. A bridge section wrapped in layers of durasteel remains sealed."
 foc_jakku_executor_site.2.a:0 "Open the bridge section."

 foc_jakku_executor_site.3.name:0 "Imperial Command Archives"
 foc_jakku_executor_site.3.desc:0 "Most of the command data core is ruined, but hull-stress models, power-grid diagrams, and shipyard production records remain readable. Our engineers begin combining these fragments with surveys of the wreckage."
 foc_jakku_executor_site.3.a:0 "Reconstruct the complete design."

 foc_jakku_executor_site.4.name:0 "The Executor Reborn"
 foc_jakku_executor_site.4.desc:0 "The wreckage survey and Imperial archives have been integrated. We now possess the fixed construction plan for the Executor-class Super Star Destroyer used by the Imperial Remnant. Its classified systems are sealed into a non-editable whole-ship blueprint."
 foc_jakku_executor_site.4.a:0 "Add the Executor-class to our shipyards."
 foc_jakku_executor_site.4.a.tooltip:0 "Gain §YExecutor-class Reconstruction§! and add the Imperial Remnant Executor-class fixed blueprint to the ship list. Its exclusive weapons and components remain hidden and cannot be used or replaced separately."
