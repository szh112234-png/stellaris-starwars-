 FOC_STARKILLER_RING_REACTOR:0 "Starkiller Base Stellar Reactor"
 FOC_STARKILLER_RING_REACTOR_desc:0 "Stellar energy flows through colossal conduits into the defense ring, powering shields, batteries, and hangars."
 FOC_STARKILLER_RING_COMPUTER:0 "Starkiller Base Fire-Control Computer"
 FOC_STARKILLER_RING_COMPUTER_desc:0 "A distributed fire-control core weaves every turbolaser, point-defense battery, and starfighter into a single kill web."
 FOC_STARKILLER_RING_SENSOR:0 "Starkiller Base Sensor Array"
 FOC_STARKILLER_RING_SENSOR_desc:0 "Long-range sensors buried inside the base track hyperspace disturbances and feed a complete battlespace picture to the defense ring."
