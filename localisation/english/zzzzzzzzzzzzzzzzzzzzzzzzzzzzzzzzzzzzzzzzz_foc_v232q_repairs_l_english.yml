l_english:
 foc_republic_origin.171.desc:0 "Death Star I has been destroyed. The Rebels receive their existing victory reward, and the old Death Star attack bonus ends immediately.\n\nA player Empire receives the Death Star II engineering project immediately; completion triggers Bothan intelligence and deploys the station at Endor. An AI Empire reveals and deploys its unfinished station exactly four years after this loss. Existing Imperial support-fleet rules remain in effect."
 foc_republic_origin.175.desc:0 "§HThe second battlestation is gone.§! Rebel troops destroyed the shield generator on Endor, allowing starfighters to reach the main reactor through the unfinished superstructure. Imperial authority collapses in the aftermath.\n\n§YThe Empire's 360-day reinforcement stream now ends; fleets already delivered remain. The Rebels still receive the existing one-time reward for this battlestation's destruction, but newly acquired systems no longer grant fleets, resources, or additional upkeep-reduction stacks. Unclaimed system-acquisition rewards are cancelled.§!"
 foc_v211_support_debug.30.desc:0 "Controls Imperial-class reinforcement strength for the Galactic Empire and the existing non-Republic-origin War in Heaven support for the Imperial Remnant.\n\nGalactic Empire: one fleet immediately after Death Star I is destroyed, then one every 360 days until Death Star II is destroyed. No early unlock based on fleet power or battlestation construction. Scaling changes ships per wave only. Imperial Remnant War in Heaven support rules are unchanged."
 operation_foc_gcw_instigate_system_uprising_desc:0 "§ROnly targets the Galactic Empire.§!\n\nChoose an Imperial colony system without a mobile Imperial combat fleet and outside its local suppression cooldown. Establish resistance cells, expand the underground network, arm it, and launch a local uprising. The revolt is resolved by the Empire's normal response event rather than directly handing over the system.\n\n§YThis operation is repeatable, not once per campaign.§! Each attempt still requires 10 spy-network power and 180 influence, with 12 monthly energy upkeep. Once the previous operation is completed or cancelled, another eligible target may be selected. The existing shared target-selection process reserves one such operation at a time.\n\nOnly mobile Imperial combat fleets block or interrupt it; starbases, platforms, science ships, constructors, colony ships and transports do not."
 foc_v232q_coup_busy:0 "Another system-uprising operation is active. Finish or cancel it before starting the next one."
 foc_v232q_home_one.5.name:0 "Home One: Location Confirmed"
 foc_v232q_home_one.5.desc:0 "An actual §HHome One§! hull has been verified under §H[Root.GetName]§!, currently in §H[event_target:foc_v232q_home_one_system.GetName]§! and assigned to §H[event_target:foc_v232q_home_one_fleet.GetName]§!.\n\nHome One retains its MC80 hull and combat configuration on a maximum-tier military Arkship frame with a fixed axial command module. It is an §HArkship / mobile starbase§!, not just an entry in the ordinary military fleet list. Use this event's map-location button to find the actual ship.\n\nThis report refers to an existing hull. Repairing it does not create a second flagship."
 foc_v232q_home_one.5.a:0 "Home One's position is confirmed."
 foc_v232q_home_one.7.name:0 "Home One: Legacy Record Review"
 foc_v232q_home_one.7.desc:0 "The Battle of Hoth has concluded and the legacy save records Home One as commissioned, but no matching hull could be found under any country. Older versions did not record its destruction reliably; absence alone cannot distinguish failed creation from a genuine historical loss.\n\n§YOnly request a replacement if Home One was never received and was not destroyed.§! The choice rechecks global uniqueness before commissioning one ship near the current Rebel capital. No duplicate is created if a hull exists or the new version has recorded its destruction.\n\n§YAfter a confirmed replacement request, Home One is commissioned only in a Rebel-owned system free of Imperial and other hostile fleets. If no safe system exists, commissioning waits for a later monthly check. Existing live ships are not cloned or teleported.§!"
 foc_v232q_home_one.7.restore:0 "Confirm it was never received; commission one missing Home One."
 foc_v232q_home_one.7.keep_loss:0 "Preserve the existing commissioning/loss record. Do not replace it."
 Yria:0 "Yria"
