l_english:
 foc_phase1_fleet_archive_edict:0 "Fleet Archive and Mothballing Order"
 foc_phase1_fleet_archive_edict_desc:0 "Manage capital-ship production lines spanning the Republic, Empire, Rebellion and First Order eras. Mothballing never deletes technology or existing ships; it only stops new orders."

 foc_phase1.40.name:0 "Historical Fleet Archive"
 foc_phase1.40.desc:0 "A war lasting decades inevitably leaves once-defining capital ships behind. §YMothballing only affects new construction§!: technology, design knowledge and all ships already in service remain intact.\n\nThe archive can now manage the §YVenator§!, §YImperial-class§!, §YMC80§! and §YResurgent-class§! production lines."
 foc_phase1.40.venator_retire:0 "Mothball Venator production."
 foc_phase1.40.venator_restore:0 "Reopen Venator production."
 foc_phase1.40.imperial_retire:0 "Mothball Imperial-class production."
 foc_phase1.40.imperial_restore:0 "Reopen Imperial-class production."
 foc_phase1.40.mc80_retire:0 "Mothball MC80 production."
 foc_phase1.40.mc80_restore:0 "Reopen MC80 production."
 foc_phase1.40.resurgent_retire:0 "Mothball Resurgent production."
 foc_phase1.40.resurgent_restore:0 "Reopen Resurgent production."
 foc_phase1.41.name:0 "Old Ships, New Eras"
 foc_phase1.41.desc:0 "Regime change does not erase a fleet overnight. Old hulls may serve in reserve formations and frontier commands for decades, but keeping every historical production line fully active also consumes shipyard and maintenance capacity."

 foc_phase1_archive_republic_line:0 "Archived Republic Capital Line"
 foc_phase1_archive_republic_line_desc:0 "The Venator mass-production line has entered strategic reserve status."
 foc_phase1_archive_imperial_line:0 "Archived Imperial Capital Line"
 foc_phase1_archive_imperial_line_desc:0 "The Imperial-class mass-production line has entered strategic reserve status."
 foc_phase1_archive_rebel_line:0 "Archived Rebel Capital Line"
 foc_phase1_archive_rebel_line_desc:0 "The MC80 mass-production line has entered strategic reserve status."
 foc_phase1_archive_first_order_line:0 "Archived First Order Capital Line"
 foc_phase1_archive_first_order_line_desc:0 "The Resurgent-class mass-production line has entered strategic reserve status."

 foc_phase1_rebel_route_network_1:0 "Rebel Smuggling Network: Regional"
 foc_phase1_rebel_route_network_1_desc:0 "The Rebels control at least 10 of the current map's 39 major-route systems, enough for a regional clandestine logistics network."
 foc_phase1_rebel_route_network_2:0 "Rebel Smuggling Network: Interregional"
 foc_phase1_rebel_route_network_2_desc:0 "The Rebels control at least 20 of the current map's 39 major-route systems, linking several major routes into an interregional supply chain."
 foc_phase1_rebel_route_network_3:0 "Rebel Smuggling Network: Galactic"
 foc_phase1_rebel_route_network_3_desc:0 "The Rebels control at least 30 of the current map's 39 major-route systems, giving their covert logistics network galaxy-scale reach."
 foc_phase1_imperial_route_network_1:0 "Imperial Route Control: Regional"
 foc_phase1_imperial_route_network_1_desc:0 "The Empire controls at least 10 of the current map's 39 major-route systems, sustaining regional route coordination."
 foc_phase1_imperial_route_network_2:0 "Imperial Route Control: Interregional"
 foc_phase1_imperial_route_network_2_desc:0 "The Empire controls at least 20 of the current map's 39 major-route systems and can coordinate logistics across several regions."
 foc_phase1_imperial_route_network_3:0 "Imperial Route Control: Galactic"
 foc_phase1_imperial_route_network_3_desc:0 "The Empire controls at least 30 of the current map's 39 major-route systems, keeping the galaxy's main transport skeleton under unified control."

 foc_phase1_ossus_jedi_archive_site:0 "Ossus: The Silent Jedi Archive"
 foc_phase1_ossus_jedi_archive_site_intro:0 "After Order 66, the ruins of Ossus were systematically sealed and stripped. Some records beneath the old temples never appeared in Imperial inventories."
 foc_phase1_arch.10.name:0 "Students Without Names"
 foc_phase1_arch.10.desc:0 "The first layer contains no grand pronouncements from famous Masters, only training notes, failed exercises and mission reports from ordinary students."
 foc_phase1_arch.11.name:0 "An Order at War"
 foc_phase1_arch.11.desc:0 "Internal records from the Clone Wars reveal how many Jedi understood that the war itself was changing the Order. Their warnings contradict each other rather than offering a simple answer."
 foc_phase1_arch.12.name:0 "The Last Transfer"
 foc_phase1_arch.12.desc:0 "In the short interval after the Temple fell, someone transferred fragments of training material and history to Ossus, leaving no list of future Jedi and no name."
 foc_phase1_arch.13.name:0 "The Ossus Legacy"
 foc_phase1_arch.13.desc:0 "The final vault preserves no authority capable of recreating the old Council. Instead it teaches how to learn, doubt and take responsibility for power when no Order remains."
 foc_phase1_arch.13.a:0 "Preserve a Jedi legacy without a master."
 r_foc_ossus_jedi_archive:0 "Ossus Jedi Archive"
 r_foc_ossus_jedi_archive_desc:0 "A decentralized body of Jedi knowledge surviving from the final Republic era, deliberately preserved without a new Council or succession list."
 foc_phase1_ossus_relic_triumph:0 "Study of the Ossus Archive"
 foc_phase1_ossus_relic_triumph_desc:0 "Recovered Ossus material is being used for leadership training and Force research."

 foc_phase1_mandalore_clan_vault_site:0 "Mandalore: Clan Vault"
 foc_phase1_mandalore_clan_vault_site_intro:0 "The Night of a Thousand Tears, Imperial occupation and Gideon's hidden base destroyed the cities above, but not every clan memory below them."
 foc_phase1_arch.20.name:0 "The Sealed Beskar Door"
 foc_phase1_arch.20.desc:0 "The vault was built not merely against foreign invaders, but against Mandalorians themselves during periods of civil war. Records beyond the door belong to rival clans."
 foc_phase1_arch.21.name:0 "A History Larger Than One Blade"
 foc_phase1_arch.21.desc:0 "The archive preserves arguments over legitimacy. The Darksaber was one symbol among others: clan oaths, adoption, rescue, vengeance and shared battle all shaped Mandalorian authority."
 foc_phase1_arch.22.name:0 "Clans Across the Galaxy"
 foc_phase1_arch.22.desc:0 "After the Great Purge, survivors left encrypted records on dozens of worlds. Together they form a map of the diaspora the Empire never managed to erase."
 foc_phase1_arch.23.name:0 "A New Clan Codex"
 foc_phase1_arch.23.desc:0 "The last chamber does not preserve an old succession rule. It preserves enough shared memory for scattered clans to rebuild a common political identity after the Darksaber's destruction."
 foc_phase1_arch.23.a:0 "Make clan memory the foundation of the new Mandalore."
 r_foc_mandalore_clan_codex:0 "Mandalorian Clan Codex"
 r_foc_mandalore_clan_codex_desc:0 "A multi-era archive of clan identity, oaths and war records showing that Mandalorian continuity never depended on one ruler or one weapon."
 foc_phase1_mandalore_relic_triumph:0 "Clan Mobilization"
 foc_phase1_mandalore_relic_triumph_desc:0 "The Clan Codex is being used to reorganize fleets, ground forces and diaspora networks."

 fop_origin.65.desc.2:0 "§YStage II — Theater Integration§!\nThe first subject has become part of the First Order war machine.\n\n§ENext objective:§! reach §Y1200§! Ambition, control at least three subjects, and decapitate the New Republic by destroying Hosnian, annexing it, or otherwise ending the New Republic."
 fop_origin.65.desc.3:0 "§YStage III — Axis of Dominion§!\nThe old New Republic order has been broken and fear is becoming a real system of galactic rule.\n\n§ENext objective:§! reach §Y3000§! Ambition and simultaneously control §YCoruscant, Kuat and Jakku§!."
 fop_origin.65.desc.4:0 "§YStage IV — Galactic Sovereignty§!\nThe First Order controls the old Republic's political center, shipbuilding artery and the endpoint of the Imperial war.\n\n§EFinal material objective:§! reach §Y5000§! Ambition and leave no independent galactic power before the §YEnslave the Force§! project can begin."
 fop_ambition.2.desc:0 "§YStage I — Starkiller Fire§!\nComplete Starkiller Base and cross the line between an Imperial successor and an open galactic crisis.\n\n§YStage II — Theater Integration§!\nForge the first chain of subjects and destroy or absorb the New Republic's political center.\n\n§YStage III — Axis of Dominion§!\nControl Coruscant, Kuat and Jakku: political center, shipbuilding artery and endpoint of the Imperial war.\n\n§YStage IV — Galactic Sovereignty§!\nReach 5000 Ambition and eliminate every independent great power before enslaving the Force.\n\n§YStage V — Apotheosis§!\nInvade the Force realm, destroy its manifestations and complete the final ascension."
 fop_ambition_stage_3_locked_tt:0 "Requires at least three subjects and the political decapitation of the New Republic."
 fop_ambition_stage_3_active_tt:0 "§GComplete:§! the New Republic order has collapsed and the dominion network is established."
 fop_ambition_stage_4_locked_tt:0 "Requires 3000 Ambition and simultaneous control of Coruscant, Kuat and Jakku."
 fop_ambition_stage_4_active_tt:0 "§GComplete:§! the First Order controls the galactic strategic axis; subjugate the rest of the galaxy to unlock Enslave the Force."
