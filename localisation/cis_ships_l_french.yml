cis_01:0 "SW: Separatist"
cis_01_shipset_desc:0 "The Separatist fleet was built upon a conglomerate of megacorporations all sharing a common goal of liberating themselves from the Republic's dysfunction."

edict_sws_cis_01_addon:0 "Star Wars Separatist Ships - Optional Addon Models and Sections"
edict_sws_cis_01_addon_desc:0 "Due to this shipset consisting of more models than there are appropriate roles on the roster, an option has been provided that adds additional player only (the ai cannot and will not use such sections) and relatively balanced ship sections that make use of these extra models. This edict will provide your empire's ship designer with 3 additional ship models making up 3 corvette sections (see the mod's Steam page description for what this model is)."

tech_sws_cis_01_addon_sections:0 "Additional Separatist Ship Designs"
tech_sws_cis_01_addon_sections_desc:0 "New ship sections and designs intended to help complement our existing roster of vessels."

SWS_CIS_CORVETTE_M1S1_01: "Heavy Core"
SWS_CIS_CORVETTE_M1S1_02: "Torpedo Core"
SWS_CIS_CORVETTE_PD2S1: "Screen Ship"
