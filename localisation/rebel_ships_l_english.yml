rebel_01:0 "SW: Rebel"
rebel_01_shipset_desc:0 "The Rebel fleet was built upon a desperate collection of cells, factions and worlds all united by their cause to end the Empire's Tyranny. Their ships come from all corners of the galaxy."

edict_sws_rebel_01_addon:0 "Star Wars Rebel Ships - Optional Addon Models and Sections"
edict_sws_rebel_01_addon_desc:0 "Due to this shipset consisting of more models than there are appropriate roles on the roster, an option has been provided that adds additional player only (the ai cannot and will not use such sections) and relatively balanced ship sections that make use of these extra models. This edict will provide your empire's ship designer with 6 additional ship models making up 4 corvette sections and 3 cruiser sections (see the mod's Steam page description for what these models are)."

tech_sws_rebel_01_addon_sections:0 "Additional Rebel Ship Designs"
tech_sws_rebel_01_addon_sections_desc:0 "New ship sections and designs intended to help complement our existing roster of vessels."

