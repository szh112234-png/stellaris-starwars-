 XYSTONSD_GUN_desc:0 "长矛级专属 T 槽超级激光。固定单发基础伤害 350,000；对舰体伤害 ×60（+5900%），对护盾 ×40，对护甲 ×20。护盾穿透 100%、护甲穿透 100%；硬化仍可抵消穿透。默认设计名义冷却约 30 天，不含预热；射速加成可改变实际间隔。单发伤害排序：死星 I = 死星 II > 日蚀 > 长矛。不是持续输出排序。 §R安装后本舰护盾容量 -100%。仅最终秩序开放建造。§!"
