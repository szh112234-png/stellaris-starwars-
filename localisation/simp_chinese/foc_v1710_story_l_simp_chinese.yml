l_simp_chinese:
 foc_canon.23.name:0 "莱雅获救，欧比旺牺牲"
 foc_canon.23.desc:0 "斯卡里夫传出的希望终于抵达了营救队手中。卢克与同伴闯入帝国的拘押设施，救出了§H莱雅·奥加纳§!。撤离途中，§H欧比旺·克诺比§!独自迎战达斯·维达，为他们争取最后的逃生时间。\n\n欧比旺牺牲了。他离开现役指挥岗位，却以绝地英灵的身份继续在原力中引导卢克。\n\n确认行动结果后，莱雅携带的完整图纸送达义军指挥部：义军获得§H对护盾伤害 +50%§!，与死星一号同处一个星系时启用攻击解算。莱雅正式加入指挥体系仍遵循她自己的战时历程，蒙·莫斯马继续领导义军。"
 foc_canon.34.desc:0 "逃离斯卡里夫的图纸仍在辗转传递，莱雅已落入帝国手中。塔金将死星一号的超级激光瞄准§H奥德朗§!，试图用她的家园换取义军基地的位置。\n\n只要这座战斗空间站仍能开火，下一道命令便会让整颗星球毁灭。义军必须救出莱雅，将完整情报带回，才能完成对死星的攻击解算。"
 foc_republic_origin.177.desc:0 "斯卡里夫行动取得了死星档案，然而完整图纸还没有安全送达义军指挥部。\n\n§Y本事件只记录图纸被夺取，不立即发放死星特攻或护盾伤害加成。§!斯卡里夫战役后等待30天，奥德朗与莱雅救援事件才会进入后续剧情；莱雅获救后，义军方能完成弱点分析。"
 foc_republic_origin_scarif_intelligence_desc:0 "莱雅获救并带回完整图纸后，义军才完成死星结构与帝国偏导护盾频率分析。武器对护盾伤害+50%；死星一号特攻另受存活、同星系等条件限制。"
