 foc_v1718k_secret_resource_collection_desc:0 "第一秩序在未知星域维持秘密采购与运输网络，为弑星者工程和舰队建设提供关键原料。\n\n每月固定获得：\n£sr_tibanna_swgs£ 提亚巴纳气体：§G+100§!\n£sr_coaxium_foc£ 同轴ium（Coaxium）：§G+100§!\n\n§Y首次真正完成弑星者基地后，本增益和这两项月度补给自动结束。§!开工、获得蓝图或开始升级不算完成。\n\n资源通过月度事件加入库存；可能不计入资源栏的常规月产。读档不额外发放，也不补算过去月份。"
