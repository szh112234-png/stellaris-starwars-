 foc_fallen_war.6.name:0 "贾库战役之后"
 foc_fallen_war.6.desc:0 "§H贾库战役§!已经结束。银河帝国最后的大规模舰队在沙海上空覆灭，燃烧的歼星舰残骸散落于荒漠。新共和国以霍斯尼亚为政治中心，在银河一侧的边缘星团维持脆弱的新秩序；帝国残余则退守另一侧银河边缘的巴斯提恩星团，保存着执行者级超级歼星舰与死星级终极武器。\n\n战争看似结束，但未知区域仍在孕育第一秩序，更深处的最终秩序也尚未现身。两个旧时代政权的出现，标志着贾库战役之后的新银河时代正式开始。"
 foc_fallen_war.6.a:0 "旧战争结束了，新的战争正在逼近。"
 foc_fallen_war.11.name:0 "天堂之战"
 foc_fallen_war.11.desc:0 "星海共同体的成立打破了延续数十年的脆弱平衡。新共和国召回星云舰队，帝国残余则让沉睡的歼星舰重新点燃反应堆。来自二十个星系的舰队同时越过边境，一场决定旧帝国遗产归属的银河战争已经开始。"
 foc_fallen_war.11.a:0 "银河再次被分成两半。"
 foc_fallen_war.21.name:0 "未知区域的阴影"
 foc_fallen_war.21.desc:0 "帝国残余已经失去最后一颗殖民地。它的覆灭并未带来和平：来自未知区域的第一秩序正在集结。危机将在短暂预警后降临，弑星者基地将优先锁定新共和国当前首都所在的霍斯尼安主星系。"
 foc_fallen_war.21.a:0 "战争远未结束。"
 foc_fallen_war.22.name:0 "新共和国的覆灭"
 foc_fallen_war.22.desc:0 "新共和国在第一秩序现身前已经失去最后一颗殖民地。权力真空加速了危机降临：第一秩序正在未知区域集结，并将在建立后立即吞并仍然存续的帝国残余，接管其十个星系、舰队、殖民地与要塞。"
 foc_fallen_war.22.a:0 "帝国残余将成为新秩序的根基。"
