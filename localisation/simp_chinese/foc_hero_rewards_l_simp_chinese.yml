 FOC_HERO_KYLO_REN:0 "凯洛·伦"
 foc_hero_rewards.1.name:0 "千年隼"
 foc_hero_rewards.1.desc:0 "弑星者基地在烈焰中崩解后，一艘熟悉的YT-1300货船穿过爆炸余波。§Y千年隼§!带着最后一批幸存者抵达我们的首都。她的船体伤痕累累，引擎却依旧发出不羁的轰鸣——这艘见证过帝国覆灭的传奇飞船，准备再次投入战争。"
 foc_hero_rewards.1.a:0 "她归我们了。"
 foc_hero_rewards.2.name:0 "莱娅公主之死与本·索罗回归"
 foc_hero_rewards.2.desc:0 "卢克·天行者逝去后，莱娅·奥加纳公主以最后的生命通过原力呼唤自己的儿子。她的离世击碎了凯洛·伦最后的黑暗防线；他抛弃了西斯的道路，以§Y本·索罗§!的身份归来。为了让玩家能够识别这名既有英雄，他仍以§Y凯洛·伦§!之名加入我们的将领序列，并愿意亲自率领陆军进攻厄西戈。"
 foc_hero_rewards.2.a:0 "欢迎回来，本。"
 foc_hero_rewards.4.name:0 "本·索罗之死"
 foc_hero_rewards.4.desc:0 "本·索罗亲自率领我们的陆军踏上厄西戈。在西斯圣殿的阴影下，他以生命为代价撕开了最终防线，并在原力中与家人重逢。§Y凯洛·伦§!英雄已经死亡；他的牺牲使厄西戈及其星系基地归于我国控制。"
 foc_hero_rewards.4.a:0 "愿原力与你同在，本。"
