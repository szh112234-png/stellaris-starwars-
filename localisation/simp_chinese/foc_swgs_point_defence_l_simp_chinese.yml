l_simp_chinese:
 foc_tech_swgs_defence_turbo:0 "先进防御涡轮激光"
 foc_tech_swgs_defence_turbo_desc:0 "将快速跟踪涡轮激光阵列改造成舰队近防网，以连续火力拦截战机、鱼雷和导弹。"
 foc_tech_swgs_crisis_point_defence:0 "主力舰近防涡轮激光协议"
 foc_tech_swgs_crisis_point_defence_desc:0 "针对大规模舰队战形成的近防火控体系，将反应堆输出、目标解算与炮组协同集中到饱和防御上，使各阵营主力舰都能在密集攻击中维持连续火网。"
 FOC_KHAN_DEFENCE_TURBO_G:0 "防御涡轮激光炮（绿色）"
 FOC_KHAN_DEFENCE_TURBO_G_DESC:0 "绿色涡轮激光炮以高速炮塔和精密跟踪器扫荡舰体周围的战机与来袭弹药。"
 FOC_REBEL_DEFENCE_TURBO_R:0 "防御涡轮激光炮（红色）"
 FOC_REBEL_DEFENCE_TURBO_R_DESC:0 "红色涡轮激光炮构成连续近防火网，保护主力舰免受小型目标和制导武器袭击。"
 foc_tech_rebel_ship_sections:0 "义军舰体结构体系"
 foc_tech_rebel_ship_sections_desc:0 "由蒙卡拉、科雷利亚与义军船坞共同形成的舰体结构标准，只服务于义军及其后继舰队。"
