l_simp_chinese:
 myk_tech_starkiller_base:0 "弑星者基地"


 myk_tech_starkiller_base_desc:0 "弑星者基地科技。现在以前置科技“战列舰”为条件解锁。"
 myk_starkiller_base_site:0 "弑星者基地基址"
 myk_starkiller_base_site_DESC:0 "弑星者基地的初始施工平台。"
 myk_starkiller_base_final:0 "弑星者基地"
 myk_starkiller_base_final_DESC:0 "一座以整颗行星为核心建成的超级武器，能够跨越星海摧毁目标星系，并令恒星坍缩为黑洞。"
 myk_starkiller_sun_drain:0 "恒星吸能"
 myk_starkiller_fire_origin_marker:0 "主炮超空间校准节点"
 myk_starkiller_fire_target_marker:0 "弑星者命中光束"
 myk_starkiller_one_only:0 "只能拥有一座弑星者基地。"
 myk_starkiller_requires_complete_base:0 "需要一座已完成的弑星者基地。"
 myk_starkiller_on_cooldown:0 "弑星者基地正在冷却。"
 myk_edict_starkiller_fire:0 "启动弑星者基地"
 myk_edict_starkiller_fire_desc:0 "打开目标选择界面，从候选星系中选择一个星系进行毁灭打击。"
 myk_starkiller.10.title:0 "弑星者基地完工"
 myk_starkiller.10.desc:0 "随着最后一道装甲带封闭，行星深处的聚能核心开始轰鸣。横贯地壳的导能网络逐级点亮，整颗星球已不再是一个世界，而是一件足以改写银河命运的武器。弑星者基地现已进入战备状态，等待最高统帅部指定第一个目标。"
 myk_starkiller.100.title:0 "选择弑星者目标"
 myk_starkiller.100.desc:0 "请选择一个目标星系。列表会显示候选的无人星系或非己方星系；如果没有想要的目标，可以刷新候选。"
 myk_starkiller.101.title:0 "目标锁定"
 myk_starkiller.101.desc:0 "弑星者基地已锁定：[event_target:myk_starkiller_target_system_legacy.GetName]。确认后将开始充能并开火。"
 myk_starkiller_fire_now:0 "开火。"
 myk_starkiller_fire_warning:0 "目标星系将被摧毁，恒星将坍缩为黑洞。"
 myk_starkiller.150.title:0 "星系已摧毁"
 myk_starkiller.150.desc:0 "弑星者基地已经完成开火。目标星系被摧毁，恒星坍缩为黑洞。"
 myk_starkiller_reroll_targets:0 "刷新候选目标"
 myk_starkiller_select_target_tooltip:0 "选择该星系作为弑星者基地目标。"
 myk_starkiller_target_option_1:0 "目标 1：[event_target:myk_starkiller_select_system_1.GetName]"
