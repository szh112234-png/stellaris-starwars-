 myk_pc_starkiller:0 "弑星者基地"
 myk_pc_starkiller_desc:0 "被改造为超级武器的星球。"
 myk_starkiller_only_one_beacon:0 "只能同时拥有一个弑星者目标信标。"
 myk_starkiller_requires_target_beacon:0 "需要一个已完成的弑星者目标信标。"
 myk_edict_starkiller_fire_beacon_system:0 "弑星者基地：摧毁信标星系"
 myk_edict_starkiller_fire_beacon_system_desc:0 "对当前弑星者目标信标所在星系开火，摧毁整个星系。开火后信标会自动移除。"


 myk_edict_starkiller_fire_beacon_planet:0 "弑星者基地：摧毁目标殖民/宜居星球"



 myk_edict_starkiller_fire_beacon_planet_desc:0 "摧毁目标信标所在星系内所有已殖民、有人控制或宜居/可殖民星球。保留原有打击动画。"
 myk_starkiller.300.title:0 "目标信标已建立"


 myk_starkiller.300.desc:0 "弑星者目标信标已经建立。使用“摧毁目标宜居星球”会摧毁信标所在星系内所有宜居/可殖民星球；使用“摧毁目标星系”会摧毁整个星系。"
 myk_starkiller.310.title:0 "目标信标锁定"

 myk_starkiller.310.desc:0 "弑星者基地已经锁定目标信标。确认后，主炮阵列将直接进入蓄能程序并对目标开火。"
 myk_starkiller.315.title:0 "弑星者打击完成"

 myk_starkiller.315.desc:0 "弑星者基地已经完成打击，目标信标已被移除。"
 myk_starkiller_dyson_shot_action:0 "弑星者基地开火"
 myk_starkiller_requires_owned_colony:0 "必须建造在你拥有的、已殖民的宜居星球上"
 myk_starkiller_dyson_gun_button:0 "选择目标星系并确认要打击的恒星或星球。开火后基地进入约360天冷却（180天充能 + 命中后180天再充能），期间按钮显示剩余冷却时间。"
 myk_starkiller_dyson_shot_activity_key:0 "弑星者基地冷却中"
 myk_starkiller_dyson_shot_progress_activity_key:0 "弑星者基地充能：[PROGRESS]%"
 myk_starkiller_dyson_targeting_activity_key:0 "弑星者基地正在锁定目标"
 myk_starkiller_dyson.8100.title:0 "选择弑星者打击目标"
 myk_starkiller_dyson.8090.title:0 "选择弑星者打击方式"
 myk_starkiller_dyson.8090.desc:0 "§H[event_target:myk_starkiller_target_system.GetName]星系§!已经锁定。请选择打击方式。“摧毁所有宜居星球”将搜索该星系内一切能够维持生命或殖民活动的世界；普通行星会在光束中崩解，环世界区段则化为破碎残骸。只有确认打击方式或具体天体后，180天蓄能程序才会开始；命中后基地还需180天重新汇聚恒星能量。"
 myk_starkiller_target_all_habitable_option:0 "摧毁所有宜居星球（动态识别；环世界变为破碎环）"
 myk_starkiller_target_single_planet_menu:0 "摧毁单独星球……"
 myk_starkiller_back_to_main_menu:0 "返回打击方式菜单"
 myk_starkiller_dyson.8102.title:0 "选择单独星球"
 myk_starkiller_dyson.8102.desc:0 "请选择§H[event_target:myk_starkiller_target_system.GetName]星系§!内要单独摧毁的天体。列表包含该星系内的非恒星天体，并按页显示。确认目标后才开始180天开火流程。"
 myk_starkiller_dyson.8100.desc:0 "§H[event_target:myk_starkiller_target_system.GetName]星系§!已经锁定。你可以打击恒星并摧毁整个星系，也可以从分页列表中选择该星系内任意非恒星天体，包括宜居星球、荒芜星球、气态巨行星、小行星、卫星和环世界区段。§Y只有完成本次选择后，180天开火流程才会开始；命中后还需冷却180天。§!"
 myk_starkiller_target_star_option:0 "打击恒星——摧毁整个星系"
