l_simp_chinese:
 # V102 - 最终优先级剧情文本同步层。只覆盖文本，不改变剧情脚本。

 origin_foc_republic_unification_effects:0 "§Y主要剧情（当前版本）：§!\n- 剧情时间轴默认§H2200年§!开始，也可选择2250/2300/2400；共和国起源从纳布危机开始，后续节点按既有间隔顺延\n- §H克隆人计划完成后§!才会提出夸特扩建；特殊项目需要§H3200工程学§!，按早期科研水平约§H8年§!完成并解锁猎兵级\n- 分离主义战争结束并完成帕尔帕廷阴谋后才会诞生银河帝国；§H所有帝国时期战役事件都要求帝国已经正式建立§!\n- 帝国内战时帝国叛军以§H雅雯与霍斯§!为早期基地；§H迪卡不会在帝国时代提前出现§!，它留到新共和国/第一秩序时代\n- 帝国路线拥有两阶段死星工程；执行者号、卢桑基亚号、惩罚者号在§H死星二号完成或帝国叛军被彻底击败§!后投入服役\n- 银河条约军事路线要求摧毁两座死星与三艘执行者级剧情旗舰，并使银河帝国§H失去科洛桑、夸特与贾库§!；三处不必由义军亲自占领，直接消灭帝国同样立即触发条约\n- 第一秩序正式降临时会§H强制建立迪卡抵抗组织§!；霍斯尼亚被弑星者摧毁后，AI新共和国必定覆灭，玩家新共和国则由抵抗组织继承，避免直接失败\n- 第一秩序起源建成弑星者基地后的原有后续剧情保持不变，不再受剧情起始年份继续延迟\n\n§Y分离主义投降：两条路线，满足任意一条§!\n§H剧情路线§!：科洛桑战役事件完成＋乌塔堡（乌塔帕）战役事件完成＋帕尔帕廷的阴谋达到140点。\n§H军事路线§!：由游戏实际判定共和国在对邦联的全面战争中获胜，或确认共和国在该战争中彻底消灭邦联，才进入投降收尾。殖民地数量、暂时的控制权或找不到邦联均不单独判胜；维持现状、共和国战败及第三方消灭邦联不算共和国胜利。本路线不要求阴谋140点或两场战役事件。\n全选不利或混合选择导致阴谋不足140点时，必须通过军事路线结束战争，不能靠等待补分。两条路线均接入分日投降结算；杜库与格里弗斯死亡不单独判为胜利。"
 START_SCREEN_FOC_REPUBLIC_UNIFICATION:0 "很久很久以前，在遥远的银河系……\n\n银河帝国尚未诞生。银河共和国仍从§H科洛桑§!统治成员世界，新共和国、帝国残余、第一秩序与最终秩序都属于尚未发生的未来。\n\n开局可把整条剧情的起点设为§H2200、2250、2300或2400年§!，默认2200。时间到达后，纳布危机将成为共和国时代的第一块多米诺骨牌；克隆人计划、夸特扩建、分离主义战争、66号命令、银河帝国与帝国叛军会依次出现。\n\n§Y注意：迪卡不会在帝国时代提前生成。帝国时期的反抗以雅雯与霍斯为核心；迪卡将在银河条约后的新共和国/第一秩序阶段出现。§!"

 foc_khan_settings.15.desc:0 "选择§H当前起源路线的剧情起始年份§!。\n\n- §H共和国起源§!：所选年份触发纳布危机，之后共和国→克隆战争→帝国→帝国叛军→银河条约→新共和国→第一秩序/最终秩序按既有剧情间隔推进。\n- §H普通起源§!：所选年份以前不会提前放行新共和国/帝国残余通往第一秩序危机的主线。\n- §H第一秩序起源§!：开局迁移、基础科技与起源基础设施照常生效；所选年份只控制尚未开始的前期剧情。§Y一旦弑星者基地建成，其后的第一秩序原有剧情链立即恢复正常，不再继续等待时间锁。§!\n\n§Y2200为默认；2250、2300、2400分别相当于整体延后50、100、200年。§!"

 foc_republic_origin.22.name:0 "克隆人计划后的夸特扩建"
 foc_republic_origin.22.desc:0 "§H克隆人计划§!已经完成决策。共和国即将面对的战争规模远超地方舰队能够承担的极限，§H夸特动力船坞§!因此向议会提交了一份全面扩建方案。\n\n项目只会在克隆人计划完成后出现。只要共和国仍控制夸特，就可以启动§H夸特船坞扩建工程§!；工程量为§H3200工程学§!，按正常早期共和国科研水平约需§H8年§!。若工程期间失去夸特，项目会中止，夺回后需要重新启动。"
 FOC_REPUBLIC_ORIGIN_KUAT_INVESTMENT_PROJECT_DESC:0 "在§H克隆人计划完成后§!，共和国可向夸特动力船坞投入§H3200工程学§!扩建大型军用船台。按正常早期科研水平约需§H8年§!。完成后解锁§H猎兵级歼星舰§!并继续推进共和国军备剧情；项目期间必须保持对夸特的控制。\n\n完成扩建后解锁§H先进耐钢装甲§!，并在夸特行星落实行星环奖励：没有既有环、施工或废墟时，直接建成配备§H4座船坞§!的§H三级行星环§!。"
 foc_republic_origin.24.desc:0 "§L最高议会仍试图用程序维持秩序，然而战争正在把每一道旧规则推向极限。§!\n\n夸特轨道上的最后一组新船台点亮了导航灯。共和国海军早已拥有少量猎兵级服役舰，但它们始终依赖有限的专用船台与手工装配，无法支撑一场席卷银河的长期战争。\n\n如今，新的标准化生产线终于贯通。猎兵级不再只是中央舰队中屈指可数的重型旗舰——从这一刻起，它将成为共和国真正能够持续补充的战争主力。\n\n§Y固定剧情节点：阴谋＋10，只记录一次。§!\n\n§H先进耐钢装甲§!现已解锁。夸特将获得行星环奖励；没有既有环、施工或废墟时，直接建成配备§H4座船坞§!的§H三级行星环§!。"

 foc_republic_origin.30.desc:0 "议会大厅的灯熄灭了。最高议长站上讲坛，宣布共和国即日改组为§H银河帝国§!——为了一个安全而有序的社会。掌声雷动。\n\n但并非所有人都在鼓掌。蒙·莫思玛与忠于旧共和国的军官正在§H雅雯与霍斯§!建立早期反抗据点；§H迪卡此时不会出现§!，它属于未来的新共和国/抵抗组织时代。\n\n你必须选择银河内战中的一面旗帜。无论选择帝国还是帝国叛军，帝国时期的战役事件都只会在§H银河帝国真正诞生之后§!开始。"
 foc_republic_origin.30.a.tt:0 "§H你的国家就地改组为银河帝国§!并继承共和国疆域。完成死星二号或彻底击败帝国叛军后，执行者号、卢桑基亚号与惩罚者号三艘剧情旗舰服役，分别驻守恩多、科洛桑与贾库；每支编队为§H1艘执行者级＋30艘帝国 II 级§!。其余银河协议条件沿用原模组。"
 foc_republic_origin.30.b.tt:0 "你的国家就地改组为§H帝国叛军§!，继承早期反抗力量并以§H雅雯、霍斯§!为核心继续战争；§H迪卡不会在帝国时代生成§!。叛军阶段不会提前获得新共和国时代舰型。\n\n§Y迫使银河帝国签署银河条约的军事路线：摧毁死星一号、死星二号、执行者号、卢桑基亚号与惩罚者号，并让帝国失去科洛桑、夸特和贾库；这些星系不要求由你亲自控制。直接消灭银河帝国也会立即进入银河条约。§!"

 foc_republic_origin.32.desc:0 "银河帝国的旗帜已经升起在科洛桑上空。共和国的疆域、船坞与舰队被新秩序接管，帝国级歼星舰开始量产；一阶段§H死星计划§!也正式启动。\n\n§Y执行者级剧情旗舰仍处于封存状态。它们要到死星二号完成，或帝国叛军被彻底消灭后，才会正式投入服役。§!"
 foc_republic_origin.33.desc:0 "§H雅雯与霍斯§!——这就是帝国叛军最初能够公开依靠的两个核心基地。迪卡仍不存在于这个时代；未来只有在新共和国与第一秩序的故事开始后，它才会成为抵抗组织的据点。\n\n帝国正在推进死星工程，而斯卡里夫的秘密档案库可能保存着它的结构弱点。\n\n§Y从现在开始，帝国时期战役事件才被正式放行。§!"

 foc_republic_origin.70.desc:0 "那不是卫星。\n\n第一座死星已经完成。它拥有自己的超空间能力、驻防舰队和足以摧毁行星的超级激光。帝国相信这件武器可以用恐惧终结整个银河内战。\n\n§Y帝国若想走直胜路线，需要真正消灭帝国叛军国家，而不是检查已经取消的迪卡帝国时代基地。迪卡仍留给未来的新共和国/抵抗组织时期。§!"
 foc_republic_origin.171.desc:0 "§H死星一号已经被摧毁。§!银河看见了帝国最可怕的武器也会爆炸。义军获得原有的一次性胜利奖励，对死星的旧攻击增伤立即失效。\n\n玩家帝国立即获得§H死星二号建造计划§!，完成工程时触发博桑情报事件，二号在恩多出现。AI帝国则在一号毁灭§H4年后§!暴露并部署未完工二号。\n\n原有帝国支援舰队规则保持：立即获得一支支援舰队，此后每360天再获得一支，直到死星二号被摧毁。"
 foc_republic_origin.180.name:0 "三艘执行者级正式服役"
 foc_republic_origin.180.desc:0 "三座军港收到了启航命令。\n\n§H执行者号§!率30艘帝国 II 级驻守恩多，§H卢桑基亚号§!率30艘帝国 II 级驻守科洛桑，§H惩罚者号§!率30艘帝国 II 级驻守贾库。\n\n三支编队各为§H1艘执行者级＋30艘帝国 II 级§!。三艘剧情旗舰各自只服役一次，被摧毁后不会重建。"
 foc_republic_origin.176.name:0 "双死星覆灭：银河全面反攻"
 foc_republic_origin.176.desc:0 "两座死星都已经成为残骸，帝国的恐惧统治开始瓦解。但银河条约的军事路线仍有最后的条件：§H执行者号、卢桑基亚号与惩罚者号§!三艘执行者级剧情旗舰必须全部被摧毁，同时银河帝国必须§H失去科洛桑、夸特与贾库§!。\n\n§Y这三个战略星系不需要全部由帝国叛军亲自占领；只要银河帝国不再控制它们即可。直接消灭银河帝国仍会立即触发银河条约。§!"
 foc_republic_origin.160.name:0 "银河条约：新共和国"
 foc_republic_origin.160.desc:0 "§H死星一号、死星二号、执行者号、卢桑基亚号与惩罚者号均已被摧毁，银河帝国也已经失去科洛桑、夸特与贾库。§!三处战略要地最终由谁占领并不重要；帝国已经失去继续维持旧秩序的能力。\n\n各方正式签署§H银河条约§!：义军同盟改组为以霍斯尼亚为政治中心的§H新共和国§!，帝国残部退守并成为§H帝国残余§!。两者都保持普通国家形态，而非堕落帝国。\n\n§Y若银河帝国被直接消灭，也会立即进入同一条约流程。§!"
 foc_republic_origin.161.name:0 "银河条约：帝国残余"
 foc_republic_origin.161.desc:0 "两座死星与§H执行者号、卢桑基亚号、惩罚者号§!都已被摧毁，我方也失去了§H科洛桑、夸特和贾库§!。这些世界是否由义军亲自占领已经没有区别——银河帝国再也无法维持旧疆域。\n\n我们只能接受§H银河条约§!并退守为§H帝国残余§!；义军则建立普通国家§H新共和国§!。"

 foc_republic_origin.182.desc:0 "§H弑星者基地已经完成充能。§!新共和国的政治中心位于§H[event_target:foc_story_new_republic_strike_target.GetName]§!，摧毁霍斯尼亚将直接斩断其中央政府。\n\n§Y第一秩序正式降临时，系统已经会强制建立§HD'Qar（迪卡）§!抵抗组织。霍斯尼亚被摧毁后，AI新共和国会被强制清算并覆灭；若玩家控制新共和国，则玩家身份、领袖与核心继承会先转入抵抗组织，避免直接Game Over。§!"
 foc_republic_origin.192.name:0 "霍斯尼亚陨落：新共和国覆灭"
 foc_republic_origin.192.desc:0 "§H霍斯尼亚不存在了。§!新共和国的中央政府、议会与留守体系被弑星者基地一击摧毁，剩余AI新共和国领土随后被第一秩序清算，国家本身不再继续存在。\n\n但抵抗并没有随首都一起消失。§H第一秩序正式降临时，迪卡抵抗组织就已经被强制建立§!；若你原本控制新共和国，玩家身份、领袖、知识与核心资源会优先由抵抗组织继承，因此霍斯尼亚毁灭不会直接结束你的游戏。"

 foc_khan.5.name:0 "第一秩序降临"
 foc_khan.5.desc:0 "§H第一秩序已经公开降临银河。§!它以伊冷与未知星域军工体系为核心，把弑星者基地、至尊号与复兴级舰队投入对银河秩序的战争。\n\n这一次，反抗不会再等待霍斯尼亚先毁灭：§H第一秩序正式创建的同时，迪卡抵抗组织会被强制启动并持续重试，直到义军/抵抗组织国家真正诞生。§!\n\n如果随后弑星者摧毁霍斯尼亚，AI新共和国将必定覆灭；玩家新共和国则由抵抗组织接续。"
 foc_khan_rebel.3.name:0 "义军诞生：抵抗组织成立"
 foc_khan_rebel.3.desc:0 "§H第一秩序已经公开降临银河。§!无论霍斯尼亚此刻是否仍然存在，拒绝屈服的军官、飞行员、情报人员与志愿者都已经在§HD'Qar（迪卡）§!完成集结。\n\n抵抗组织现在作为独立国家正式成立，并与第一秩序敌对。若后续霍斯尼亚被弑星者摧毁，这支抵抗力量将成为新共和国覆灭后的直接继承者与剧情兜底。"
 foc_khan_rebel.10.desc:0 "第一秩序危机已经开始，§HD'Qar（迪卡）§!的抵抗组织也已被强制建立。它会在迪卡失守后按现有剧情继续向克瑞特、阿占克洛转移，而不是因为霍斯尼亚事件链失败就永远无法出生。\n\n加入抵抗后，我们将脱离与第一秩序相冲突的从属关系并与其共同作战。"

 foc_story.10.name:0 "霍斯尼亚毁灭：新共和国终结"
 foc_story.10.desc:0 "弑星者基地的光束穿过超空间，§H霍斯尼亚§!与新共和国中央政府在数秒内化为灰烬。\n\n§Y当前剧情逻辑会强制完成后续清算：AI新共和国必定覆灭，残余疆域不再以一个失去首都的国家继续存在；抵抗组织则已在第一秩序降临时于§HD'Qar§!建立。若原新共和国由玩家控制，玩家会优先继承抵抗组织而不是直接失败。§!"

 foc_balance.10.desc:0 "帝国各地的治安正在恶化。一个非常清楚的规律已经出现：§H只有仍由银河帝国实际控制、且上空没有帝国驻防舰队的殖民地§!才会承受额外的稳定与产能惩罚。\n\n星球一旦被帝国叛军、新共和国或其它国家夺取，§H“上空无驻防舰队”§!会被自动清除；若帝国重新夺回该世界，系统才会重新检查当地是否存在足够战力的帝国舰队。\n\n§Y塔金主义生效后，这一行星级驻防惩罚也会被移除，不再重新施加。§!"
 foc_saga_planet_ungarrisoned_desc:0 "只有§H银河帝国实际控制§!的殖民地才可能拥有此惩罚。只要星球被帝国叛军、新共和国、抵抗组织、帝国残余、第一秩序、最终秩序或任何其它国家占领/控制，修正都会自动移除；银河帝国重新夺回实际控制权后才会重新检查驻防舰队。"

 foc_reb.1.desc:0 "§H罗萨§!长期被银河帝国当作农业、工业与试飞基地使用。当地反抗细胞已经从零散破坏行动发展成公开起义，并向帝国叛军发出联络。\n\n§Y事件成功推进后，§H罗萨星系会真正脱离银河帝国并移交给帝国叛军控制§!，而不只是获得一个象征性的国家修正。该事件只属于银河帝国已经正式建立后的帝国时代。§!"

 fop_cradle_war_machine_desc:0 "第一秩序从诞生之初就将人口、教育与工业组织成一台为战争服务的机器。§Y有机人口增长速度：+25%§!。银河系其它正常国家会因此降低对玩家第一秩序的评价，§H帝国残余明确排除，不受这项外交惩罚§!。该国家精神只授予玩家控制的第一秩序。"
