l_simp_chinese:
 foc_republic_origin_reapply_empire_shipset:0 "重新应用银河帝国船模"
 foc_republic_origin_reapply_empire_shipset_desc:0 "重新将当前银河帝国的舰船图形文化设为帝国舰船包，并刷新自动舰船设计。用于旧存档或称帝后设计器仍显示共和国船模时。"
 edict_foc_republic_origin_reapply_empire_shipset:0 "重新应用银河帝国船模"
 edict_foc_republic_origin_reapply_empire_shipset_desc:0 "重新将当前银河帝国的舰船图形文化设为帝国舰船包，并刷新自动舰船设计。"
 edict_sws_empire_01_addon:0 "启用帝国附加舰船模型"
 edict_sws_empire_01_addon_desc:0 "按照帝国舰船包原本的法令逻辑，解锁额外的帝国舰体模型与船段。该法令不再强行替换自动设计。"
 tech_sws_empire_01_addon_sections:0 "帝国附加舰船设计"
 tech_sws_empire_01_addon_sections_desc:0 "为舰船设计器开放与当前版本兼容的帝国附加舰体模型与船段。"
