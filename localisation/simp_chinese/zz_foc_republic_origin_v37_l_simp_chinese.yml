l_simp_chinese:
 foc_republic_origin.192.name:0 "霍斯尼亚陨落：新共和国覆灭"
 foc_republic_origin.192.desc:0 "§H霍斯尼亚不存在了。§!首都、议会以及留守当地的独立新共和国政府，都在一道横贯星海的光柱中化为尘埃；它在内环的剩余疆域也随之落入第一秩序手中。\n\n但我们的准备及时完成了。§H迪卡§!与§H义军§!属于另一个国家，而你统率的原新共和国早在第一秩序出现时便已经在那里完成继承。霍斯尼亚的毁灭无法夺走转移到抵抗组织中的玩家身份、领袖、知识与国库。"
 foc_republic_origin.192.a:0 "新共和国已逝，抵抗仍将继续。"
