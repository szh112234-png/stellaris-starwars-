 NAME_FOC_KHAN_RESURGENT:0 "第一秩序复兴级战列巡洋舰"
 NAME_FOC_KHAN_XYSTON: "长矛级（Xyston级）歼星舰"

 foc_khan_first_order_power:0 "第一秩序全面动员"
 foc_khan_first_order_power_desc:0 "第一秩序解封未知区域中的全部武库，以足以挑战远古文明的舰队战力投入战争。"
 foc_khan_final_order_power:0 "最终秩序末日动员"
 foc_khan_final_order_power_desc:0 "西斯永恒唤醒厄西戈的禁忌技术，让最终秩序舰队获得毁灭银河的力量。"

 foc_khan.5.name: "第一秩序降临"
 foc_khan.5.desc: "星海共同体的成立没能带来和平。第一秩序已经在伊冷建立军事核心，至尊号与真正的弑星者基地同时投入战斗。该势力已将整个银河视为敌人。"
 foc_khan.5.a: "银河必须联合起来。"

 foc_khan.63.name: "最终秩序崛起"
 foc_khan.63.desc: "弑星者基地和至尊号的毁灭并未结束战争。第一秩序残余舰队全部改旗，在厄西戈并入最终秩序。西斯舰队已经开始全面出击。"
 foc_khan.63.a: "真正的决战开始了。"

 foc_khan.91.name: "最后的绝地武士"
 foc_khan.91.desc: "厄西戈的最终秩序已经覆灭。帕尔帕廷与西斯永恒失去了统治银河的舰队，各地民众同时起义，残存的第一秩序军团迅速瓦解。雷伊继承了绝地的意志；只要仍有人选择希望，绝地就不会消亡。"
 foc_khan.91.a: "原力将永远与我们同在。"



 foc_khan.5.b: "接受第一秩序的统治，成为第一秩序辖区。"
 foc_khan.63.b: "向最终秩序投降，保存我们的文明。"
 foc_khan.64.name: "新的主人"
 foc_khan.64.desc: "第一秩序已经被最终秩序吸收。我们先前的臣服条约也随之转移，如今必须直接效忠厄西戈的西斯永恒。"
 foc_khan.64.a: "我们别无选择。"
 foc_khan.81.name: "西斯永恒舰队集结完成"
 foc_khan.81.desc: "厄西戈的地下船坞已经完成最后一批支援舰。累计八百六十四艘长矛级歼星舰加入最终秩序，此后不再有新的年度长矛级支援。"
 foc_khan.81.a: "银河面对的是一支前所未有的舰队。"

 foc_khan_mandator: "曼达托IV级无畏舰"
 foc_khan_eclipse: "日蚀级超级歼星舰"
 NAME_FOC_KHAN_MANDATOR: "曼达托IV级无畏舰"
 NAME_FOC_KHAN_ECLIPSE: "日蚀级超级歼星舰"
 foc_khan.46.name: "第一秩序增援航道"
 foc_khan.46.desc: "第一秩序年度增援已抵达伊冷。每支支援舰队编制为：最低档4艘帝国级、3艘复兴级、1艘曼达洛级；初级档8艘帝国级、5艘复兴级、1艘曼达洛级；中级档12艘帝国级、8艘复兴级、1艘曼达洛级；高级和疯狂档16艘帝国级、10艘复兴级、1艘曼达洛级。各档每年分别获得1、2、3、4、4支舰队，累计支援达到864艘后停止。"
 foc_khan.46.a: "他们的战争机器正在持续扩张。"

 FOC_KHAN_ENGINEERING_FLEET: "第一秩序工程舰队"
 FOC_KHAN_INVASION_FORCE: "第一秩序地面突击群"
 FOC_KHAN_STORMTROOPER_ARMY: "第一秩序风暴兵军团"
 foc_khan_vassal.2.name:0 "第一秩序最后通牒"
 foc_khan_vassal.2.desc:0 "对第一秩序的战争正在走向不利。我们可以接受其统治，成为第一秩序辖区以保全帝国，或者继续战争。"
 foc_khan_vassal.2.a:0 "成为第一秩序辖区"
 foc_khan_vassal.2.b:0 "我们绝不臣服"
 foc_khan_vassal.3.name:0 "最终秩序最后通牒"
 foc_khan_vassal.3.desc:0 "最终秩序要求无条件臣服。我们可以成为最终秩序辖区以保全文明，或者继续战争。"
 foc_khan_vassal.3.a:0 "成为最终秩序辖区"
 foc_khan_vassal.3.b:0 "反抗最终秩序"
 foc_khan_mandator_plural: "曼达托IV级无畏舰"
 foc_khan_eclipse_plural: "日蚀级超级歼星舰"
 foc_khan_vassal.11.name:0 "第一秩序外交"
 foc_khan_vassal.11.desc:0 "第一秩序只接受无条件臣服。我们可以成为其秩序辖区，以换取帝国的存续。"
 foc_khan_vassal.11.loyal_desc:0 "我们已经成为第一秩序辖区。只要继续履行辖区义务，其舰队和弑星者基地便不会把我们视为敌人。"
 foc_khan_vassal.11.a:0 "向第一秩序臣服"
 foc_khan_vassal.11.b:0 "反抗第一秩序"
 foc_khan_vassal.12.name:0 "最终秩序外交"
 foc_khan_vassal.12.desc:0 "最终秩序要求银河无条件服从。我们可以成为其秩序辖区，以避免被彻底毁灭。"
 foc_khan_vassal.12.loyal_desc:0 "我们已经向最终秩序臣服，并被其视为友军。"
 foc_khan_vassal.12.a:0 "向最终秩序臣服"
 foc_khan_vassal.12.b:0 "反抗最终秩序"
 foc_khan_vassal.close:0 "结束通讯"
 foc_khan_vassal.rebellion_cooldown:0 "臣服后五年内不能反叛。"
 foc_khan_starkiller_fortress_network:0 "弑星者要塞防御网"
 foc_khan_starkiller_fortress_network_desc:0 "分层行星防御系统显著削弱轨道轰炸，并强化弑星者基地的防御军。"
 foc_khan_supremacy_heavy_ark_slowdown:0 "至尊号重型方舟舰体"
 foc_khan_supremacy_heavy_ark_slowdown_desc:0 "六十公里舰体承载着船坞、城市与最高指挥部，因此转向迟缓，却能在战线上维持惊人的火力与生存能力。"
 preset_foc_khan_satrapy:0 "秩序辖区"
 preset_foc_khan_satrapy_desc:0 "接受第一秩序或最终秩序统治的辖区。"

 FOC_KHAN_FIRST_ORDER_MONTHLY_SUPPORT:0 "第一秩序年度增援舰队"
 FOC_KHAN_FINAL_ORDER_MONTHLY_SUPPORT:0 "最终秩序年度增援舰队"

 foc_khan.1003.name:0 "一个星系被彻底抹除"
 foc_khan.1003.desc:0 "弑星者基地已经摧毁了§Y[event_target:foc_khan_forced_starkiller_target_country.GetName]§!控制下的§H[event_target:foc_khan_forced_starkiller_target_system.GetName]星系§!。恒星、行星、空间站以及其中的一切生命，都在一次攻击中被彻底抹除。\n\n这件武器只要继续存在，银河中就没有任何国家是安全的。"
 foc_khan.1003.a:0 "必须立刻摧毁弑星者基地"

 foc_khan_spawn_corridor_acceleration:0 "危机舰队出港加速"
 foc_khan_spawn_corridor_acceleration_desc:0 "新抵达的舰队沿预先清空的出航走廊高速离开伊冷或厄西戈，避免庞大编队堵塞集结区。"

