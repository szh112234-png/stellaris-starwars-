l_simp_chinese:
 foc_khan_settings.10.ai_support_debug:0 "调试：AI舰队支援规模"
 foc_v211_support_debug.1.name:0 "AI舰队支援调试"
 foc_v211_support_debug.1.desc:0 "调整各星战剧情阵营§Y之后获得的脚本舰队支援§!。设置只影响AI国家，不改变玩家支援、普通船坞建造、开局舰队或一次性剧情入侵舰队；已经生成的舰队不会被删除或改编。未设置时保持原版MOD的§G100%§!规模。关闭某一阵营后，该阵营的支援计时仍按原节奏推进，重新开启不会立刻补发被跳过的舰队。"
 foc_v211_support_debug.1.republic:0 "调整银河共和国AI支援"
 foc_v211_support_debug.1.cis:0 "调整分离主义AI支援"
 foc_v211_support_debug.1.empire:0 "调整帝国系AI支援"
 foc_v211_support_debug.1.rebel:0 "调整义军系AI支援"
 foc_v211_support_debug.1.first_order:0 "调整第一秩序AI支援"
 foc_v211_support_debug.1.final_order:0 "调整最终秩序AI支援"
 foc_v211_support_debug.1.reset:0 "全部恢复为100%"
 foc_v211_support_debug.1.reset_tt:0 "清除六个阵营的调试倍率，之后的AI舰队支援全部恢复MOD默认规模。"
 foc_v211_support_debug.back:0 "返回AI支援调试"
 foc_v211_support_debug.back_settings:0 "返回MOD设置"
 foc_v211_support_debug.scale.disabled:0 "关闭AI支援"
 foc_v211_support_debug.scale.half:0 "设为50%"
 foc_v211_support_debug.scale.standard:0 "设为100%（默认）"
 foc_v211_support_debug.scale.one_and_half:0 "设为150%"
 foc_v211_support_debug.scale.double:0 "设为200%"
 foc_v211_support_debug.current.disabled:0 "\n\n当前档位：§R关闭§!"
 foc_v211_support_debug.current.half:0 "\n\n当前档位：§Y50%§!"
 foc_v211_support_debug.current.standard:0 "\n\n当前档位：§G100%（默认）§!"
 foc_v211_support_debug.current.one_and_half:0 "\n\n当前档位：§H150%§!"
 foc_v211_support_debug.current.double:0 "\n\n当前档位：§R200%§!"
 foc_v211_support_debug.10.name:0 "银河共和国AI舰队支援"
 foc_v211_support_debug.10.desc:0 "控制克隆人战争期间银河共和国AI每轮猎兵级支援的舰队数量。每支舰队仍固定为25艘猎兵级，第一次支援和后续支援的360天间隔不变。"
 foc_v211_support_debug.10.disabled_tt:0 "之后每轮获得0支舰队。"
 foc_v211_support_debug.10.half_tt:0 "之后每轮获得2支×25艘猎兵级，共50艘。"
 foc_v211_support_debug.10.standard_tt:0 "之后每轮获得4支×25艘猎兵级，共100艘。"
 foc_v211_support_debug.10.one_and_half_tt:0 "之后每轮获得6支×25艘猎兵级，共150艘。"
 foc_v211_support_debug.10.double_tt:0 "之后每轮获得8支×25艘猎兵级，共200艘。"
 foc_v211_support_debug.20.name:0 "分离主义AI舰队支援"
 foc_v211_support_debug.20.desc:0 "控制克隆人战争期间分离主义AI在吉奥诺西斯获得的周期性卢克里赫拉克级支援。不会修改开战时每个控制星系的25艘驻防舰队，也不会修改第三年入侵科洛桑的剧情舰队。"
 foc_v211_support_debug.20.disabled_tt:0 "之后每轮获得0艘卢克里赫拉克级。"
 foc_v211_support_debug.20.half_tt:0 "之后每轮获得13艘卢克里赫拉克级。"
 foc_v211_support_debug.20.standard_tt:0 "之后每轮获得25艘卢克里赫拉克级。"
 foc_v211_support_debug.20.one_and_half_tt:0 "之后每轮获得38艘卢克里赫拉克级。"
 foc_v211_support_debug.20.double_tt:0 "之后每轮获得50艘卢克里赫拉克级。"
 foc_v211_support_debug.30.name:0 "银河帝国与帝国残余AI舰队支援"
 foc_v211_support_debug.30.desc:0 "统一控制银河帝国的帝国级支援，以及非共和国起源天国之战中的帝国残余支援。\n\n银河帝国：死星一号被摧毁后立即生成一支支援舰队，此后每360天一支，死星二号被摧毁后停止；不再按舰队战力差或死星建成提前解锁。倍率只调整每支舰队的舰船数。帝国残余原有天国之战支援规则不变。"
 foc_v211_support_debug.30.disabled_tt:0 "之后不再生成上述AI支援舰队。"
 foc_v211_support_debug.30.half_tt:0 "银河帝国每轮17艘帝国级；天国之战帝国残余每轮10艘帝国级＋1艘418巡洋舰。"
 foc_v211_support_debug.30.standard_tt:0 "银河帝国每轮33艘帝国级；天国之战帝国残余每轮20艘帝国级＋1艘418巡洋舰。"
 foc_v211_support_debug.30.one_and_half_tt:0 "银河帝国每轮50艘帝国级；天国之战帝国残余每轮30艘帝国级＋1艘418巡洋舰。"
 foc_v211_support_debug.30.double_tt:0 "银河帝国每轮66艘帝国级；天国之战帝国残余每轮40艘帝国级＋1艘418巡洋舰。"
 foc_v211_support_debug.40.name:0 "义军、新共和国与抵抗组织AI舰队支援"
 foc_v211_support_debug.40.desc:0 "统一控制义军年度与占领奖励MC80、蒙卡拉船坞支援、夸特星云级支援、莱雅抵抗组织支援，以及非共和国起源天国之战中的新共和国支援。玩家亲自选择的占领奖励仍固定为20艘MC80。"
 foc_v211_support_debug.40.disabled_tt:0 "之后不再生成上述AI支援舰队。"
 foc_v211_support_debug.40.half_tt:0 "MC80支援10艘；夸特星云级8艘；抵抗组织/新共和国星云级5艘。"
 foc_v211_support_debug.40.standard_tt:0 "MC80支援20艘；夸特星云级15艘；抵抗组织/新共和国星云级10艘。"
 foc_v211_support_debug.40.one_and_half_tt:0 "MC80支援30艘；夸特星云级23艘；抵抗组织/新共和国星云级15艘。"
 foc_v211_support_debug.40.double_tt:0 "MC80支援40艘；夸特星云级30艘；抵抗组织/新共和国星云级20艘。"
 foc_v211_support_debug.50.name:0 "第一秩序AI年度支援"
 foc_v211_support_debug.50.desc:0 "在现有危机舰队数量档位之后，再调整第一秩序AI的年度支援波次。只影响周期性支援，不改变第一秩序危机开局舰队；玩家控制的第一秩序始终保持100%。"
 foc_v211_support_debug.50.disabled_tt:0 "之后年度支援为0支舰队；360天周期仍继续。"
 foc_v211_support_debug.50.half_tt:0 "危机舰队数量为低/标准/大型/最大时，每轮分别获得1/1/2/2支支援舰队。"
 foc_v211_support_debug.50.standard_tt:0 "危机舰队数量为低/标准/大型/最大时，每轮分别获得1/2/3/4支支援舰队。"
 foc_v211_support_debug.50.one_and_half_tt:0 "危机舰队数量为低/标准/大型/最大时，每轮分别获得2/3/5/6支支援舰队。"
 foc_v211_support_debug.50.double_tt:0 "危机舰队数量为低/标准/大型/最大时，每轮分别获得2/4/6/8支支援舰队。"
 foc_v211_support_debug.60.name:0 "最终秩序AI年度支援"
 foc_v211_support_debug.60.desc:0 "在现有危机舰队数量档位之后，再调整最终秩序AI的年度支援波次。只影响周期性支援，不改变最终秩序第二阶段开局舰队；玩家控制的最终秩序始终保持100%。"
 foc_v211_support_debug.60.disabled_tt:0 "之后年度支援为0支舰队；360天周期仍继续。"
 foc_v211_support_debug.60.half_tt:0 "危机舰队数量为低/标准/大型/最大时，每轮分别获得1/1/2/2支支援舰队。"
 foc_v211_support_debug.60.standard_tt:0 "危机舰队数量为低/标准/大型/最大时，每轮分别获得1/2/3/4支支援舰队。"
 foc_v211_support_debug.60.one_and_half_tt:0 "危机舰队数量为低/标准/大型/最大时，每轮分别获得2/3/5/6支支援舰队。"
 foc_v211_support_debug.60.double_tt:0 "危机舰队数量为低/标准/大型/最大时，每轮分别获得2/4/6/8支支援舰队。"
