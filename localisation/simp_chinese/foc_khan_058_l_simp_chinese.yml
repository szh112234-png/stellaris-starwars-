l_simp_chinese:
 foc_khan.1602.name:0 "弑星者最后通牒"
 foc_khan.1602.desc:0 "弑星者基地的竣工使我们再也无法与第一秩序和最终秩序共存。原宗主已无法继续控制我们，我们立即恢复独立。两个秩序阵营均已将我国列为最高优先级目标，其进攻舰队正在改变航向，直扑我们的领土。"
 foc_khan.1602.a:0 "那就让他们来吧。"
 myk_starkiller_requires_full_system_control:0 "§R必须完全控制弑星者基地所在星系后，才能开始充能。§!"
 foc_khan.1604.name:0 "夺取弑星者基地"
 foc_khan.1604.desc:0 "我军已经占领弑星者基地所在行星，并夺取了这件武器的控制权。原拥有者已失去基地。第一秩序与最终秩序现已将我国列为最高优先级敌人，同时我国无法继续作为任何国家的附庸。"
 foc_khan.1604.a:0 "这件武器现在属于我们。"
