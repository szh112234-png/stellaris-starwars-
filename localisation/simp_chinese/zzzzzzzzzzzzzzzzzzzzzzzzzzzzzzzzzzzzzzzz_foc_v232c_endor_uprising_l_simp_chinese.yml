 foc_luke.19.name:0 "最后的救赎：天选之子的归宿"
 foc_luke.19.desc:0 "第二死星主控室内，卢克·天行者在愤怒中爆发，一剑砍断了达斯·维达的机械右掌。但看着残缺的父亲，卢克猛然惊醒，他扔掉光剑，坚决地拒绝了黑暗面：‘我是个绝地武士，就像我父亲以前一样。’\n\n阴谋落空的皇帝帕尔帕廷暴怒，释放出致命的§H原力闪电§!疯狂折磨卢克。卢克痛苦地倒地，向一旁的父亲绝望呼救：‘父亲……救我！’\n\n维达在沉重的机械呼吸声中痛苦挣扎。最终，父爱战胜了黑暗。他冲上前一把抱住皇帝，顶着刺骨的闪电将其高高举起，扔进了反应堆炉心。皇帝湮灭了，但维达的维生战甲也彻底短路瘫痪。\n\n死星即将崩溃，卢克拼死将父亲拖到停机坪的穿梭机旁。\n\n维达虚弱地靠在起落架上，微弱地祈求：‘卢克……帮我把面具摘下来。让我用自己的眼睛……看你一次。’\n\n伴随着气密锁解开的泄气声，冰冷的黑面具被缓缓揭开。面具下没有恶魔，只有一张苍白、布满伤疤的脸，那双眼睛恢复了安纳金·天行者原本澄澈的蓝色。\n\n‘你做到了，卢克。’安纳金欣慰地微笑着，‘你是对的。告诉你妹妹……你对我的看法……是对的……’话音落下，他安详地闭上了眼睛。\n\n不久后，恩多卫星的森林里燃起了火葬的篝火。而在义军欢庆胜利的晚宴旁，欧比旺、尤达以及恢复了年轻面容的§H安纳金·天行者§!以原力英灵的形态悄然并肩而立，含笑看着远方。天选之子终于回归光明，为原力带来了平衡。\n\n§Y达斯·维达与皇帝帕尔帕廷均已死亡。§!"
 foc_luke.19.a:0 "天选之子终于回归光明。"

 foc_republic_origin.176.desc:0 "§L第二颗死星在恩多上空解体的那一刻，帝国赖以维系统治的恐惧也一起崩塌。§!\n\n真正属于内环起义范围的星系几乎同时易帜：地方守军倒戈、总督府失去控制、议会与抵抗组织公开接管政权。§H科洛桑与夸特§!仍必须由义军亲自攻克。\n\n§H阿尔多利姆、伦迪利、克里斯托福西斯、乌塔堡、杰达§!不属于本次内环起义范围，因此不会在双死星覆灭时自动转入义军控制；它们在银河条约后的最终归属仍按条约领土规则处理。§H贾库§!则属于战后帝国残余，同样不会参与起义。\n\n§Y机制：内环起义会自动转移符合条约新共和国范围的星系，但明确排除阿尔多利姆、伦迪利、克里斯托福西斯、乌塔堡、杰达、科洛桑与夸特。§!"
