 foc_v1717_first_order_empire_arsenal_allowed:0 "第一秩序起源：完成弑星者基地，开放帝国武器研究"
 foc_v1717_starkiller_completed_for_arsenal:0 "已真正完成弑星者基地"
 foc_v185_flow.2.desc:0 "§L伊冷深处最后一组聚能阵列已经锁定。没有庆典，只有舰队频道上不断增加的效忠讯号。§!\n\n§H弑星者基地§!正式投入战备。随着这件武器完成，仍然独立存在的§H帝国残余§!舰队、星域与军工体系立即被第一秩序接收。\n\n但银河全面战争尚未开始。第一秩序仍可以把自己的真正实力隐藏在未知星域。§Y第一次弑星者实战开火时，秘密阶段将立即结束：我国将化身天灾，并与全银河进入总力战争。§!\n\n§Y帝国武器研究：§!第一秩序起源须真正完成弑星者基地后，才开放帝国分支武器科技。完成基地不直接授予高级武器，仍需逐项研究；支援战舰保留随舰配装。共用基础武器沿用原有解锁条件。"
 fop_starkiller_base_final_DESC:0 "一座由整颗行星构成的恒星能量武器。基地能够抽取恒星能量，并将其通过凯伯水晶聚焦后投向遥远星系。\n\n§Y帝国武器研究：§!第一秩序起源须真正完成弑星者基地后，才开放帝国分支武器科技。完成基地不直接授予高级武器，仍需逐项研究；支援战舰保留随舰配装。共用基础武器沿用原有解锁条件。"
 origin_fop_first_order_effects:0 "第一秩序自银河边缘外的孤立伊冷星系崛起，掌握稳定虫洞科技，并获准使用通往帝国残余疆域的秘密航路。第一秩序不会以另一支势力再次降临。建成弑星者基地后自动获得专属飞升§Y银河新秩序§!。\n开局仅赠送基础涡轮炮、质量加速炮、震荡导弹与点防御；高级武器科技不会因选择此起源而直接解锁。\n\n§Y帝国武器研究：§!第一秩序起源须真正完成弑星者基地后，才开放帝国分支武器科技。完成基地不直接授予高级武器，仍需逐项研究；支援战舰保留随舰配装。共用基础武器沿用原有解锁条件。"
