l_simp_chinese:
 foc_republic_origin.197.name:0 "抵抗，始于流亡"
 foc_republic_origin.197.desc:0 "§L新共和国的和平表象终于裂开。§!\n\n莱雅·奥加纳对第一秩序在未知星域扩军的警告长期被议会忽视，而她与达斯·维达的血缘又被政敌公开。她辞去职务，带领阿克巴、艾美特、波·达默龙以及一批旧义军老兵和年轻飞行员前往§H迪卡§!。\n\n从这一刻起，§H抵抗组织§!正式成立。若当前由玩家控制新共和国，则严格按照既定继承规则完成国家分离；其他路线则建立独立的迪卡抵抗力量。"
 foc_republic_origin.197.a:0 "抵抗从迪卡开始。"

 fop_origin.33.name:0 "莱雅的选择：迪卡抵抗组织"
 fop_origin.33.desc:0 "§L莱雅·奥加纳不再等待一个迟迟不肯行动的政府。§!\n\n第一秩序可能已经在未知星域存在，也可能刚刚通过秘密计划成为现实威胁；而在正常历史时间线中，这一决裂也会在银河条约后的政治危机中发生。无论是哪一种道路，莱雅都得出了同一个结论：不能等到敌人的舰队出现在首都上空才开始准备战争。\n\n阿克巴、艾美特、波·达默龙以及旧义军的情报与飞行骨干追随她前往§H迪卡§!。在那里，一个独立于新共和国指挥体系之外的§H抵抗组织§!开始运作。\n\n§Y第一秩序起源会在开局触发这一事件；其他起源会在完成“第一秩序计划”时触发；原有的时间触发仍保留为兜底，并且不会重复建立第二个抵抗组织。§!"
 fop_origin.33.a:0 "迪卡将继续守望。"
