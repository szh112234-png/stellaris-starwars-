l_simp_chinese:
 ap_fop_new_order_crisis:0 "银河新秩序"
 ap_fop_new_order_crisis_desc:0 "第一秩序不再等待银河承认它的统治。弑星者基地将成为新秩序的王座，帝国残余将成为它的军团。"
 ap_fop_new_order_crisis_effect_tooltip:0 "§Y第一秩序起源专属飞升§!\n完成弑星者基地后自动获得。立即吞并帝国残余、成为可操控的玩家天灾，并触发包含普通帝国与堕落帝国的单一银河反天灾总力战。通过五阶段野望征服银河、奴役原力、入侵虚境，最终升格为新的宇宙神明。"
 fop_ap_requires_completed_starkiller:0 "需要拥有一座完工的§Y弑星者基地§!"

 origin_fop_first_order_effects:0 "游戏开始时直接出现在主银河边缘外、位于贾库外侧的孤立伊冷星系，并解锁伊冷—贾库帝国残余星门。普通第一秩序危机将被玩家流程替代。建成弑星者基地后自动获得专属飞升§Y银河新秩序§!。\n开局仅赠送基础涡轮炮、质量加速炮、震荡导弹与点防御；高级武器科技不会因选择此起源而直接解锁。"

 NAME_FOP_ABANDONED_STAGING_SYSTEM:0 "废弃集结地"
 NAME_FOP_ABANDONED_STAGING_WORLD:0 "封存冰原"

 fop_origin.10.name:0 "未知区域的第一秩序"
 fop_origin.10.desc:0 "伊冷已经在贾库外侧的未知区域完成部署。至尊号停泊于新首都上空，而帝国残余的秘密航道正等待我们的舰队。普通第一秩序危机不会在本局游戏中出现——我们就是它的替代者。"
 fop_origin.10.a:0 "第一秩序必将崛起。"

 fop_origin.11.name:0 "帝国正统的继承者"
 fop_origin.11.desc:0 "帝国残余承认第一秩序是帝国事业的继承者。双方建立了特殊友好关系，伊冷与贾库之间的帝国残余星门已经对我们开放。"
 fop_origin.11.a:0 "旧帝国将成为新秩序的根基。"

 fop_origin.20.name:0 "银河新秩序"
 fop_origin.20.desc:0 "弑星者基地已经完工。帝国残余的舰队、星域与工业立即并入第一秩序。银河已经推举反天灾领袖，并组成一场针对我们的联盟总力战——沉睡或觉醒的堕落帝国也已加入。\n\n专属飞升§Y银河新秩序§!及其五阶段野望已经开启。最终秩序将在二十年后逼近；若至尊号或弑星者基地提前失去，这一时刻将立刻到来。"
 fop_origin.20.a:0 "让银河在新秩序面前屈服。"

 fop_origin.50.name:0 "最终秩序"
 fop_origin.50.desc:0 "来自艾克西戈的信号席卷银河。西斯永恒要求第一秩序接受帕尔帕廷的最终秩序。我们可以交出国家的旗帜与王座，亲自统率最终秩序继续征服银河；也可以拒绝这位死而复生的皇帝，在继续升神战争的同时对抗正常降临的最终秩序危机。"
 fop_origin.50.a:0 "我们就是最终秩序。"
 fop_origin.50.a.tt:0 "国家将更名并转变为§Y最终秩序§!，首都迁往艾克西戈，帕尔帕廷成为统治者，并继续以可操控玩家天灾的身份与银河作战。"
 fop_origin.50.b:0 "第一秩序绝不向亡灵俯首。"
 fop_origin.50.b.tt:0 "正常生成独立的§Y最终秩序危机§!并爆发第一秩序内战。部分普通舰队、非核心殖民地与附庸会倒戈；伊冷、弑星者基地和至尊号不会被脚本夺走。玩家保留天灾身份与完整升神路线。"

 fop_force_ascension_status_edict:0 "原力支配界面"
 fop_force_ascension_status_edict_desc:0 "打开§Y银河新秩序§!野望界面，查看五阶段玩家天灾路线、当前目标与已解锁力量。"
 FOP_ENSLAVE_FORCE_PROJECT:0 "奴役原力"
 FOP_ENSLAVE_FORCE_PROJECT_DESC:0 "将全银河的恐惧、服从与生命编织成灵能枷锁，迫使原力本身服从新秩序。"
 FOP_COSMIC_ASCENSION_PROJECT:0 "宇宙升神仪式"
 FOP_COSMIC_ASCENSION_PROJECT_DESC:0 "夺取虚境王座的本质，将统治者的意志写入现实与虚境的底层法则。"

 NAME_FOP_FORCE_SHROUD_REALM:0 "原力之海"
 NAME_FOP_FORCE_SHROUD_HEART:0 "虚境之心"
 NAME_FOP_FORCE_SHROUD_THRONE:0 "无主神座"
 NAME_FOP_FORCE_SHROUD_ECHO_I:0 "恐惧回响"
 NAME_FOP_FORCE_SHROUD_ECHO_II:0 "服从回响"
 NAME_FOP_WILL_OF_THE_SHROUD:0 "虚境意志"
 NAME_FOP_SHROUD_GODHOST:0 "原力诸神之影"
 NAME_FOP_FINAL_ORDER_DEFECTORS:0 "最终秩序叛军"

 fop_force_chains_stage:0 "原力锁链"
 fop_force_chains_stage_desc:0 "第一个国家已经被新秩序的意志束缚。"
 fop_force_dominion_stage:0 "银河支配"
 fop_force_dominion_stage_desc:0 "越来越多的文明成为原力支配网络的一部分。"
 fop_force_enslaved_stage:0 "被奴役的原力"
 fop_force_enslaved_stage_desc:0 "原力不再拥有自己的意志，只会回应新秩序的命令。"
 fop_new_cosmic_deity_modifier:0 "新生宇宙神明"
 fop_new_cosmic_deity_modifier_desc:0 "统治者已将自身意志刻入物质宇宙与虚境的法则。"
 fop_force_bound_subject_modifier:0 "原力奴仆"
 fop_force_bound_subject_modifier_desc:0 "这个国家的集体意志已被银河新秩序束缚。"
 fop_shroud_guardian_power:0 "虚境神性"
 fop_shroud_guardian_power_desc:0 "这些实体由虚境抵抗奴役的本能凝聚而成。"

 fop_origin.55.name:0 "最终秩序加冕"
 fop_origin.55.desc:0 "艾克西戈已经成为新首都，西斯永恒舰队听从我们的号令。第一秩序的国家机器被重铸为可由玩家完全操控的最终秩序，但征服银河与奴役原力的升神目标没有改变。"
 fop_origin.55.a:0 "整个宇宙都将服从。"

 fop_origin.58.name:0 "第一秩序内战"
 fop_origin.58.desc:0 "拒绝帕尔帕廷的命令撕裂了第一秩序。部分军官、边疆总督与附庸向最终秩序宣誓效忠，叛军舰队已经在首都附近现身。伊冷、弑星者基地和至尊号仍掌握在忠诚派手中。我们必须击败最终秩序，但升神计划仍将继续。"
 fop_origin.58.a:0 "清洗叛徒，然后夺取原力。"

 fop_origin.65.name:0 "银河新秩序：原力支配"
 fop_origin.65.desc.1:0 "§Y阶段 I——新天灾§!\n弑星者基地已经点燃银河战争。\n\n§E下一目标：§!完全占领一个帝国的全部殖民地，将其变为原力奴仆。"
 fop_origin.65.desc.2:0 "§Y阶段 II——原力锁链§!\n第一个国家已经臣服。\n\n§E下一目标：§!拥有至少三个附庸；小型银河中完全统治所有帝国也可直接完成。"
 fop_origin.65.desc.3:0 "§Y阶段 III——银河支配§!\n恐惧与服从正汇入同一张灵能网络。\n\n§E下一目标：§!令所有普通帝国与堕落帝国臣服或灭亡；若选择反抗最终秩序，还必须先消灭最终秩序。"
 fop_origin.65.desc.4:0 "§Y阶段 IV——奴役原力§!\n银河已经在我们脚下。完成特殊项目§Y奴役原力§!。"
 fop_origin.65.desc.5:0 "§Y阶段 V——虚境入侵§!\n原力已经被锁链束缚。穿过裂口，消灭原力之海中的全部虚境化身。"
 fop_origin.65.desc.6:0 "§M最终阶段——新生宇宙神明§!\n银河、原力、物质宇宙与虚境都已成为你意志的延伸。"
 fop_origin.65.a:0 "继续。"

 fop_origin.71.name:0 "第一条原力锁链"
 fop_origin.71.desc:0 "第一个帝国已被完全占领并束缚为原力奴仆。亿万生命的恐惧开始转化为可以被我们调用的灵能力量。"
 fop_origin.71.a:0 "让更多意志加入锁链。"
 fop_origin.73.name:0 "银河支配网络"
 fop_origin.73.desc:0 "三个国家的集体意志已经并入新秩序。原力在每一次臣服中变得更加清晰，也更加容易控制。"
 fop_origin.73.a:0 "没有意志可以保持自由。"
 fop_origin.75.name:0 "银河归于一主"
 fop_origin.75.desc:0 "银河中已不存在能够挑战我们的独立帝国。现在，所有生命的恐惧与服从足以铸成束缚原力本身的枷锁。特殊项目§Y奴役原力§!已经开启。"
 fop_origin.75.a:0 "让原力跪下。"
 fop_origin.80.name:0 "原力已被奴役"
 fop_origin.80.desc:0 "银河的灵能潮汐已经逆转。原力第一次不再回应生命，而是回应我们的命令。虚境本能地反抗，通往原力之海的裂口已经被撕开。"
 fop_origin.80.a:0 "入侵虚境。"
 fop_origin.82.name:0 "原力之海"
 fop_origin.82.desc:0 "裂口另一端并非梦境，而是一片可以被舰队征服的灵能国度。虚境意志凝聚出大批腐化化身守卫无主神座。消灭它们，夺取神位。"
 fop_origin.82.a:0 "诸神也必须服从新秩序。"
 fop_origin.91.name:0 "无主神座"
 fop_origin.91.desc:0 "最后一个虚境化身已经消散。无主神座暴露在舰队面前，宇宙升神仪式可以开始了。"
 fop_origin.91.a:0 "完成最后的仪式。"
 fop_origin.100.name:0 "新的宇宙神明"
 fop_origin.100.desc:0 "物质宇宙震颤，虚境归于寂静。统治者的意识越过肉体与时间，成为原力、银河和现实法则的一部分。第一秩序不再仅仅统治星系——它的意志已经成为宇宙本身的意志。"
 fop_origin.100.a:0 "我即秩序，我即原力，我即永恒。"

 fop_ambition_window_title:0 "第一秩序野望：银河新秩序"
 fop_ambition_window_subtitle:0 "征服银河，奴役原力，踏入虚境并夺取宇宙神座。反抗最终秩序不会中断此路线。"
 fop_ambition.1.name:0 "银河新秩序"
 fop_ambition.2.desc:0 "§Y阶段 I——银河战争§!\n完成弑星者基地、吞并帝国残余并获得强大的舰队与战争加成。\n\n§Y阶段 II——原力锁链§!\n第一个原力奴仆带来额外海军容量、射速与抗战能力。\n\n§Y阶段 III——银河支配§!\n三个国家臣服后解锁更强的舰队伤害、射速与海军容量。\n\n§Y阶段 IV——奴役原力§!\n统治整个银河后开启奴役原力特殊项目；反抗最终秩序时必须赢得内战。\n\n§Y阶段 V——虚境升神§!\n奴役原力后入侵原力之海，消灭虚境化身，完成宇宙升神仪式。"
 fop_ambition_show_rewards:0 "查看阶段力量"
 fop_ambition_show_objectives:0 "查看当前目标"
 fop_ambition_points_gui:0 "野望点数：[This.fop_force_dominion_points]"
 fop_ambition_points_tooltip:0 "摧毁敌舰获得§Y1§!点、攻占殖民地获得§Y25§!点、束缚或摧毁一个帝国获得§Y100§!点野望。阶段推进同时要求完成对应征服或特殊项目目标。"
 fop_ambition_stage_1_name:0 "阶段 I　银河战争"
 fop_ambition_stage_1_short:0 "弑星者点火；帝国残余并入；与全银河正式开战。"
 fop_ambition_stage_2_name:0 "阶段 II　原力锁链"
 fop_ambition_stage_2_short:0 "完全占领第一个国家，将亿万意志束缚为原力奴仆。"
 fop_ambition_stage_3_name:0 "阶段 III　银河支配"
 fop_ambition_stage_3_short:0 "控制至少三个附庸，建立覆盖群星的支配网络。"
 fop_ambition_stage_4_name:0 "阶段 IV　奴役原力"
 fop_ambition_stage_4_short:0 "消灭最后的独立强权，完成奴役原力特殊项目。"
 fop_ambition_stage_5_name:0 "阶段 V　虚境升神"
 fop_ambition_stage_5_short:0 "入侵原力之海，毁灭化身并登上无主神座。"
 fop_ambition_stage_1_locked_tt:0 "尚未点燃银河战争。"
 fop_ambition_stage_1_active_tt:0 "§G已完成：§!弑星者基地已将第一秩序化为新天灾。"
 fop_ambition_stage_2_locked_tt:0 "需要束缚第一个原力奴仆。"
 fop_ambition_stage_2_active_tt:0 "§G已完成：§!第一条原力锁链已经铸成。"
 fop_ambition_stage_3_locked_tt:0 "需要控制至少三个附庸，或已经完全统治银河。"
 fop_ambition_stage_3_active_tt:0 "§G已完成：§!银河支配网络已经建立。"
 fop_ambition_stage_4_locked_tt:0 "需要令所有普通帝国与堕落帝国臣服或灭亡；反抗最终秩序时还要赢得内战。"
 fop_ambition_stage_4_active_tt:0 "§G已解锁：§!可以完成§Y奴役原力§!特殊项目。"
 fop_ambition_stage_5_locked_tt:0 "需要完成奴役原力特殊项目。"
 fop_ambition_stage_5_active_tt:0 "§G已解锁：§!虚境裂口已经开启；夺取无主神座。"
 wg_fop_galactic_crisis:0 "银河反天灾战争"
 war_goal_wg_fop_galactic_crisis:0 "银河反天灾战争"
 war_goal_wg_fop_galactic_crisis_desc:0 "银河诸国已经结成单一联盟，誓言以总力战摧毁第一秩序的新天灾。"
