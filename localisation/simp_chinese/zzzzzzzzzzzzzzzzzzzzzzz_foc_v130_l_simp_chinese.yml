l_simp_chinese:
 r_foc_darksaber:0 "暗剑"
 r_foc_darksaber_desc:0 "由第一位曼达洛绝地塔雷·维兹拉打造的黑刃光剑。几个世纪以来，暗剑既是武器，也是曼达洛统治合法性的政治象征。它能够凝聚氏族，同样也能够把氏族拖入新的继承战争。"
 foc_phase1_darksaber_relic_triumph:0 "暗剑号召"
 foc_phase1_darksaber_relic_triumph_desc:0 "暗剑被公开展示为战争与氏族团结的象征，大批曼达洛战士与地方盟友正在响应号召。"

 r_foc_sith_wayfinder:0 "西斯寻路仪"
 r_foc_sith_wayfinder_desc:0 "一件能够穿越未知星域极端导航环境、锁定厄西戈秘密航路的古代西斯导航器。拥有实体寻路仪意味着可以更早、更安全地进入最终秩序的腹地，但它并不是银河永远无法替代的唯一钥匙。"
 foc_phase1_sith_wayfinder_relic_triumph:0 "寻路仪导航演算"
 foc_phase1_sith_wayfinder_relic_triumph_desc:0 "寻路仪的导航算法被暂时扩展到全舰队，跃迁准备、远程导航和情报解密能力得到强化。"
