 foc_tech_std_turbo_1:0 "共和国共同 涡轮激光 1"
 foc_tech_std_turbo_1_desc:0 "FOC：研究完成后可在舰船设计器实际装备：帝国涡轮激光炮 Mk.01（S/M/L槽）；义军涡轮激光炮 Mk.01（S/M/L槽）；帝国速射涡轮炮 Mk.01（S/M/L槽）；义军速射涡轮炮 Mk.01（S/M/L槽）；帝国长程精确涡轮炮 Mk.01（L槽）；义军长程精确涡轮炮 Mk.01（L槽）。每件武器有独立组件与实际属性，不是空白前置科技。不同战术分支不会互相覆盖；下一型号只淘汰本支旧型号。 LOWEST仍使用原组件与原科技路径。"
