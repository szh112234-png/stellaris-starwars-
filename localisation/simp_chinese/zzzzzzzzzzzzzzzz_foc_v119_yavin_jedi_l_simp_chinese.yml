l_simp_chinese:
 foc_canon.45.name:0 "雅雯战役"
 foc_canon.45.desc:0 "§H死星一号已被摧毁。§!巨大空间站的毁灭被记录为雅文战役的胜利。\n\n§H威尔霍夫·塔金总督§!拒绝撤离，最终与战斗空间站一同死亡。帝国失去了它赖以震慑银河的武器，而义军为这场胜利付出了沉重代价。"
 leader_trait_foc_force_sensitive:0 "原力敏感者"
 leader_trait_foc_force_sensitive_desc:0 "这名领袖能够感知并运用原力。直觉、预感与超越常人的感官并不能替代训练，却能在探索、统军与危急决断中改变结果。"

 foc_republic_origin_jedi_guardians:0 "绝地守护者"
 foc_republic_origin_jedi_guardians_desc:0 "从武士团中挑选出的正面战斗专家，以坚韧的防御、近身剑术和对同伴的保护著称。他们往往站在克隆人军团最危险的那一段战线上。"
 foc_republic_origin_jedi_sentinels:0 "绝地哨兵"
 foc_republic_origin_jedi_sentinels_desc:0 "强调速度、技术与精确打击的绝地武士。他们擅长突破机器人阵线、猎杀指挥节点，并在敌人来得及重组之前结束战斗。"
 foc_republic_origin_jedi_consulars:0 "绝地执政官"
 foc_republic_origin_jedi_consulars_desc:0 "更专注于原力、外交与控制技巧的绝地。他们并非最猛烈的战士，却常常能在不扩大伤亡的情况下瓦解一场战斗。"
 foc_republic_origin_jedi_sages:0 "绝地贤者"
 foc_republic_origin_jedi_sages_desc:0 "对原力拥有深厚造诣的绝地施术者，能够以念动力压制大片敌军并稳定友军阵线。他们的力量强大，却必须谨慎使用。"
 foc_republic_origin_jedi_shadows:0 "绝地暗影"
 foc_republic_origin_jedi_shadows_desc:0 "武士团最少被公开谈论的一支力量。绝地暗影追踪西斯遗物、渗透敌后并摧毁黑暗面的网络；真正交战之前，目标往往已经失去通讯与士气。"
