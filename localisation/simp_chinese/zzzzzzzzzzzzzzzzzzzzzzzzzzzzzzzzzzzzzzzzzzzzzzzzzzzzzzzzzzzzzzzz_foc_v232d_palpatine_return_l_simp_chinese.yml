l_simp_chinese:
 foc_khan.63.name:0 "皇帝归来：最终秩序崛起"
 foc_khan.63.desc:0 "§L厄西戈的风暴中，一个本应已经死去的声音再次传遍银河。§!\n\n帕尔帕廷确实死在了第二死星——被达斯·维达投入反应堆炉心，肉体随战斗空间站一同毁灭。但西斯永恒从未停止在厄西戈进行克隆与意识保存实验。如今，一具残破却足以承载西斯之主意识的新躯体睁开了双眼。§H皇帝帕尔帕廷已经归来。§!\n\n弑星者基地和至尊号的毁灭没有结束战争。第一秩序残余向厄西戈汇集，西斯永恒的萨斯顿级舰队从风暴中升起。两个秩序合而为一——§H最终秩序§!正式降临银河。"
 foc_khan.63.a:0 "死去的皇帝回来了。"
 foc_khan.64.name:0 "亡者归来"
 foc_khan.64.desc:0 "§L我们曾向第一秩序屈膝，如今王座背后真正的主人终于现身。§!\n\n死于第二死星的帕尔帕廷已经在厄西戈的克隆躯体中复活。第一秩序被最终秩序吸收，我们原有的臣服关系也随之转移。今后，我们必须直接向§H复活的皇帝帕尔帕廷§!与西斯永恒效忠。"
 foc_khan.64.a:0 "皇帝再一次统治银河。"
 fop_origin.55.name:0 "皇帝归来：最终秩序加冕"
 fop_origin.55.desc:0 "§L厄西戈的风暴为一个从死亡中归来的皇帝让路。§!\n\n恩多并不是帕尔帕廷故事的终点。西斯永恒保存了他的意识，并以漫长的克隆实验为其塑造新的容器。如今，第二死星反应堆中死去的西斯之主已经在厄西戈重新睁开双眼。§H帕尔帕廷归来，并再次登上王座。§!\n\n第一秩序的军政机器与厄西戈的黑暗军团融为一体，萨斯顿级舰队听候皇帝号令，§H最终秩序§!由此加冕。征服银河只是开始。"
 fop_origin.55.a:0 "最终秩序听命于皇帝。"
