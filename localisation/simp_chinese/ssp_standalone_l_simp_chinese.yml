 SSP_SETTINGS_OPEN_FIGHTER_GROUP:0 "选择可用战机阵营"
 SSP_FIGHTER_GROUP_TITLE:0 "选择战略战机阵营"
 SSP_FIGHTER_GROUP_DESC:0 "决定舰船设计器显示哪些战略机库与对应指挥核心。默认显示全部战机。切换后请重新保存舰船设计并升级现有舰船。"
 SSP_FIGHTER_GROUP_EMPIRE:0 "§R帝国战机§!：TIE/LN＋TIE/vn"
 SSP_FIGHTER_GROUP_EMPIRE_DESC:0 "仅显示标准TIE/LN战机、TIE/vn“沉默者”及帝国/第一秩序远程航空指挥核心。"
 SSP_FIGHTER_GROUP_REBEL:0 "§H义军战机路线§!：X 翼＋Y 翼＋B 翼"
 SSP_FIGHTER_GROUP_REBEL_DESC:0 "开放“义军战机超空间技术”，研究后可装备 X 翼、Y 翼和 B 翼战略机库，统一使用义军远程航空指挥中心。帝国与旧共和国路线不开放新研究；此前已研究的其他阵营战机仍会保留。"
 SSP_FIGHTER_GROUP_REPUBLIC:0 "§B旧共和国战机§!：Delta-7＋ARC-170"
 SSP_FIGHTER_GROUP_REPUBLIC_DESC:0 "仅显示Delta-7绝地战机、ARC-170重型战机及旧共和国远程航空指挥核心。"
 SSP_FIGHTER_GROUP_ALL:0 "§G显示全部战机§!；含分离主义 TRI；含分离主义 TRI"
 SSP_FIGHTER_GROUP_ALL_DESC:0 "同时开放帝国、义军与旧共和国三项战机超空间技术；义军路线包含 X 翼、Y 翼和 B 翼，共用义军远程航空指挥中心。；含分离主义 TRI；含分离主义 TRI"
 SSP_EQUAL_DPS_NOTE:0 "五种战机按每个机库的基础持续输出进行对齐：TIE/LN依靠24架数量，TIE/vn与Delta-7则依靠更高单机火力。穿透、对甲倍率、速度、闪避与耐久仍保持电影化差异。"

 tech_ssp_imperial_hyperspace:0 "帝国战机超空间技术"
 tech_ssp_imperial_hyperspace_desc:0 "建立帝国/第一秩序远程战机投送体系，同时解锁24架编制的标准TIE/LN战机、4架编制的TIE/vn“沉默者”以及帝国远程航空指挥核心。"
 SSP_TECH_IMPERIAL_UNLOCK_TITLE:0 "解锁：帝国/第一秩序战略战机"
 SSP_TECH_IMPERIAL_UNLOCK_DESC:0 "TIE/LN、TIE/vn“沉默者”中队与帝国远程航空指挥核心。"
 tech_ssp_rebel_hyperspace:0 "义军战机超空间技术"
 tech_ssp_rebel_hyperspace_desc:0 "建立义军远程战机投送体系，解锁 X 翼、Y 翼与 B 翼战略机库，以及共用的义军远程航空指挥中心。B 翼每组 8 架，以红色激光执行重型对舰打击。"
 SSP_TECH_REBEL_UNLOCK_TITLE:0 "解锁：义军战略战机"
 SSP_TECH_REBEL_UNLOCK_DESC:0 "X 翼、Y 翼、B 翼战略中队与义军远程航空指挥中心。三种机型使用同一义军战略打击行动。"
 tech_ssp_republic_hyperspace:0 "旧共和国战机超空间技术"
 tech_ssp_republic_hyperspace_desc:0 "重建旧共和国远程战机投送体系，同时解锁2架编制的Delta-7绝地战机、8架编制的ARC-170重型战机以及共和国远程航空指挥核心。"
 SSP_TECH_REPUBLIC_UNLOCK_TITLE:0 "解锁：旧共和国战略战机"
 SSP_TECH_REPUBLIC_UNLOCK_DESC:0 "Delta-7、ARC-170中队与共和国远程航空指挥核心。"
 SSP_SETTINGS_ROOT_DESC:0 "请选择要调整的项目。默认强度为平衡档、模型为原版大小。开局需选择可研究的战机阵营；中后期可通过法令切换路线。已经研究完成的阵营科技和战机不会因切换而被清除或隐藏。"
 SSP_FIGHTER_GROUP_DESC:0 "选择当前开放研究的战机阵营。未选择且尚未研究的另外两个阵营科技与战机将完全隐藏；已研究完成的旧阵营战机永久保留。选择“全部战机”可同时开放三条科技路线。"
 SSP_FIGHTER_GROUP_EMPIRE:0 "§R帝国战机路线§!：TIE/LN＋TIE/vn"
