 SSP_CINEMATIC_PROFILE_NOTE:0 "舰载机基础属性按照电影表现进行相对定位，而非严格照搬资料书数值。"
 SSP_FIGHTER_ROSTER_SUMMARY:0 "四条战机路线：帝国、义军、旧共和国和分离主义。TIE 点防中队 12 架；TRI 点防中队 24 架；义军 B 翼轰炸中队 12 架，并保留 X 翼、Y 翼。"
 edict_ssp_star_wars_fighter_settings_edict:0 "星球大战战机设置"
 edict_ssp_star_wars_fighter_settings_edict_desc:0 "旧版兼容项。独立法令已隐藏，请从“星球大战MOD设置”进入战机设置。"
 ssp_star_wars_fighter_settings_edict:0 "星球大战战机设置"
 ssp_star_wars_fighter_settings_edict_desc:0 "旧版兼容项。独立入口已整合进“星球大战MOD设置”。"
 SSP_SETTINGS_ROOT_TITLE:0 "星球大战战机设置"
 SSP_SETTINGS_ROOT_DESC:0 "战机强度已由主MOD难度自动管理。§H星战剧情国家§!的战略战机阵营与科技由国家身份自动决定，这里只能调整模型显示大小；§H普通起源国家§!仍可额外选择舰船设计器中的战机阵营。"
 SSP_SETTINGS_OPEN_STRENGTH:0 "战机强度由主MOD难度控制"
 SSP_SETTINGS_OPEN_SIZE:0 "调整战机显示大小"
 SSP_SETTINGS_BACK:0 "返回上一级"
 SSP_SETTINGS_CLOSE:0 "关闭"
 SSP_STRENGTH_TITLE:0 "选择星球大战战机强度"
 SSP_STRENGTH_DESC:0 "跟随主难度设置：原版、中级、ACOT。TIE 12 架、TRI 24 架、B 翼 12 架。难度改变组件属性；1×/2×/5×/10×只改变显示大小。\n$FOC_STRATEGIC_NO_COMBAT_REGEN_DESC$"
 SSP_STRENGTH_EDICT_TITLE:0 "调整星球大战战机强度"
 SSP_STRENGTH_EDICT_DESC:0 "战机强度现已锁定为主MOD难度映射，不能在此单独修改。"
 SSP_STRENGTH_BALANCED:0 "§G原版强度（初始版本）§!"
 SSP_STRENGTH_BALANCED_DESC:0 "直接使用战略战机Mod最初的基础属性版本，不使用SG或强化属性。"
 SSP_STRENGTH_ENHANCED:0 "§Y强化档§!"
 SSP_STRENGTH_ENHANCED_DESC:0 "每个机库的基础持续输出约500；提高耐久、速度和穿透，但仍适合中等强度游戏环境。"
 SSP_STRENGTH_EXTREME:0 "§B电影档§!"
 SSP_STRENGTH_EXTREME_DESC:0 "电影表现档，每个机库的基础持续输出约1000；突出王牌战机，但明显低于SG档。"
 SSP_STRENGTH_SG:0 "§RSG档（最高）§!"
 SSP_STRENGTH_SG_DESC:0 "最高强度，每个机库的基础持续输出约2000，适合SG级舰船包和高强度危机。"
 SSP_SIZE_TITLE:0 "选择战机显示大小"
 SSP_SIZE_DESC:0 "只改变战机模型的视觉尺寸，不改变数量、碰撞和战斗属性。默认使用原版模型大小。"
 SSP_SIZE_ORIGINAL:0 "§G原版模型大小§!"
 SSP_SIZE_ORIGINAL_DESC:0 "使用资源文件原始设定的模型尺寸，为默认选项。"
 SSP_SIZE_2X:0 "§H模型大小×2§!"
 SSP_SIZE_2X_DESC:0 "相对原版模型放大2倍。"
 SSP_SIZE_5X:0 "§Y模型大小×5§!"
 SSP_SIZE_5X_DESC:0 "相对原版模型放大5倍，更容易观察战机。"
 SSP_SIZE_10X:0 "§R模型大小×10§!"
 SSP_SIZE_10X_DESC:0 "相对原版模型放大10倍，适合观赏和截图。"
 SSP_IMPERIAL_TIE_REMOTE_SET:0 "帝国 TIE 点防战斗机中队"
 SSP_IMPERIAL_TIE_REMOTE_SET_DESC:0 "每中队 12 架；本地机库与远程战略派遣使用相同难度属性。显示倍率不增加中队数量。"
 SSP_IMPERIAL_TIE_REMOTE:0 "帝国 TIE 点防战斗机中队（12架｜旧平衡｜1×）"
 SSP_IMPERIAL_TIE_REMOTE_DESC:0 "每中队 12 架。中队基础单轮总伤害 2000，平均分到单机约 166.6667；不是每架造成 2000 伤害，也不是每秒伤害。\n中队总船体 2400、装甲 480、护盾 0，均按架数分配。\n点防战斗机：可拦截敌方舰载机和导弹；使用绿色激光弹。\n显示倍率只改变外观，不改变架数、伤害或血量。实际战斗数值还受国家、舰船、科技和射速修正影响。"
