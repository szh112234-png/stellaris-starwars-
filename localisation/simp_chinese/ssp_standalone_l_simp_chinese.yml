 SSP_IMPERIAL_COMMAND_CORE:0 "帝国/第一秩序远程航空指挥核心"
 SSP_IMPERIAL_COMMAND_CORE_DESC:0 "安装在辅助槽后解锁“帝国/第一秩序战略打击”。发动时可选择当前舰队两跳内的目标星系；系统按舰队中对应编号战略机库的数量投送机群。每个战略机库按照对应机型的中队编制投送远程舰载机，远程机群将在180天后撤离。"
 SSP_IMPERIAL_ACTION:0 "帝国/第一秩序舰载机战略打击"
 SSP_IMPERIAL_ACTION_DESC:0 "选择当前舰队两跳内的星系，远程投送已装备的TIE/LN与TIE/VN“寂静者”战略打击中队。"
 SSP_IMPERIAL_ACTIVITY:0 "正在准备帝国/第一秩序舰载机战略打击"
 SSP_IMPERIAL_TARGET_TITLE:0 "选择帝国/第一秩序舰载机战略打击目标"
 SSP_IMPERIAL_TARGET_DESC:0 "可选择距离当前舰队1—2条超空间航道的星系。"
 SSP_REBEL_COMMAND_CORE:0 "义军远程航空指挥中心"
 SSP_REBEL_COMMAND_CORE_DESC:0 "辅助槽安装本核心即可统一指挥 X 翼、Y 翼与 B 翼。B 翼现在为每中队 12 架的重型轰炸机。按编号机库派遣，目标 1—2 跳，180 天后撤离；原版档同样可用。"
 SSP_REPUBLIC_COMMAND_CORE:0 "银河共和国远程航空指挥核心"
 SSP_REPUBLIC_COMMAND_CORE_DESC:0 "安装在辅助槽后解锁“银河共和国战略打击”。发动时可选择当前舰队两跳内的目标星系；系统按舰队中对应编号战略机库的数量投送机群。每个战略机库按照对应机型的中队编制投送远程舰载机，远程机群将在180天后撤离。"
 SSP_IMPERIAL_COMMAND_CORE_SET:0 "帝国/第一秩序远程航空指挥核心"
 SSP_IMPERIAL_COMMAND_CORE_SET_DESC:0 "安装在辅助槽后解锁“帝国/第一秩序战略打击”。"
 SSP_REBEL_COMMAND_CORE_SET:0 "义军远程航空指挥中心"
 SSP_REBEL_COMMAND_CORE_SET_DESC:0 "义军 X 翼、Y 翼与 B 翼共用的远程航空指挥中心；安装在辅助槽后开启同一战略打击行动。"
 SSP_REPUBLIC_COMMAND_CORE_SET:0 "银河共和国远程航空指挥核心"
 SSP_REPUBLIC_COMMAND_CORE_SET_DESC:0 "安装在辅助槽后解锁“银河共和国战略打击”。"
 tech_ssp_imperial_tie:0 "TIE/LN战斗机"
 tech_ssp_imperial_tie_desc:0 "解锁帝国 TIE 点防战斗机。每中队 12 架，使用用户提供的三翼 TIE 模型，中级组件的中队基础总伤害 2000。"
 tech_ssp_fo_interceptor:0 "TIE/VN“寂静者”"
 tech_ssp_fo_interceptor_desc:0 "解锁TIE/vn“沉默者”战略中队。每个机库维持4架；单机火力最高，护盾与机动性极强。"
 tech_ssp_xwing:0 "T-65 X翼战斗机"
 tech_ssp_xwing_desc:0 "解锁T-65B X翼战略中队。每个机库维持8架；火力、防护和机动均衡，综合生存能力最高。"
 tech_ssp_delta7:0 "Delta-7绝地战斗机"
 tech_ssp_delta7_desc:0 "解锁Delta-7绝地战机战略中队。每个机库维持2架；100%脚本闪避、最高速度与追踪，火力和护盾经过加强。"
 tech_ssp_arc170:0 "ARC-170重型战斗机"
 tech_ssp_arc170_desc:0 "解锁ARC-170重型战机战略中队。每个机库维持6架；拥有重装甲和强力对舰火力，但机动性较低。"
