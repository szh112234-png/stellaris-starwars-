l_simp_chinese:
 foc_republic_origin.171.desc:0 "§H死星一号已经被摧毁。§!银河看见了帝国最可怕的武器也会爆炸。义军获得原有的一次性胜利奖励，对死星的旧攻击增伤立即失效。\n\n玩家帝国立即获得§H死星二号建造计划§!，完成工程时触发博桑情报事件，二号在恩多出现。AI帝国则在一号毁灭§H4年后§!暴露并部署未完工二号。\n\n原有帝国支援舰队规则保持：立即获得一支支援舰队，此后每360天再获得一支，直到死星二号被摧毁。"
 foc_republic_origin.175.desc:0 "§H第二座也没了。§!\n\n地面小队摧毁了恩多的护盾发生器，义军战机从未完工的外壳缺口深入反应炉，将第二死星化为燃烧的残骸。帝国统治的支柱随之崩塌。\n\n§Y帝国的360天周期支援从此停止，已到达的舰队保留。义军仍获得本次死星毁灭自身的既有胜利奖励，但此后新取得的星系不再提供舰队、资源或新的维护费减免层数；未领取的新星系奖励同时取消。§!"
 foc_v211_support_debug.30.desc:0 "统一控制银河帝国的帝国级支援，以及非共和国起源天国之战中的帝国残余支援。\n\n银河帝国：死星一号被摧毁后立即生成一支支援舰队，此后每360天一支，死星二号被摧毁后停止；不再按舰队战力差或死星建成提前解锁。倍率只调整每支舰队的舰船数。帝国残余原有天国之战支援规则不变。"
 operation_foc_gcw_instigate_system_uprising_desc:0 "§R仅能针对银河帝国发动。§!\n\n选择一个没有帝国机动军事舰队驻留、且已结束当地镇压冷却的殖民星系，建立反抗细胞、扩张地下网络并输送武器，最终由当地星球发动公开起义。行动本身不会直接赠送星系，起义仍通过帝国的正常应对事件结算。\n\n§Y行动可重复发动，不是一次性行动。§!每次仍需10点间谍网力量、180影响力，进行期间每月消耗12能量。上一场行动完成或取消后，只要仍有合格目标即可再次筹备；现有目标选择流程一次只保留一场此类行动。\n\n只有帝国机动军事舰队会阻止或中断行动；恒星基地、防御平台、科研船、工程船、殖民船和运输船不计入阻止行动的驻军。"
 foc_v232q_coup_busy:0 "另一场星系起义行动仍在筹备中；完成或取消后可再次发动。"
 foc_v232q_home_one.5.name:0 "家园一号：入列位置已确认"
 foc_v232q_home_one.5.desc:0 "已核验§H[Root.GetName]§!名下存在实际的§H家园一号§!舰体，当前位于§H[event_target:foc_v232q_home_one_system.GetName]§!，编入§H[event_target:foc_v232q_home_one_fleet.GetName]§!。\n\n家园一号保留MC80舰体与战斗配置，并使用最高级军用方舟框架和固定轴向指挥模块。它属于§H方舟／移动恒星基地§!，不应只在普通军事舰队列表中寻找。可使用本事件的地图定位按钮前往实际舰只所在位置。\n\n本通知以现存舰只为依据；若舰只已经存在，修复不会额外生成另一艘。"
 foc_v232q_home_one.5.a:0 "确认家园一号的位置。"
 foc_v232q_home_one.7.name:0 "家园一号：旧档记录核对"
 foc_v232q_home_one.7.desc:0 "霍斯战役已经完成，旧存档也保存着家园一号的入列标记，但当前所有国家名下都没有找到对应舰体。旧版本没有可靠的家园一号毁灭记录，因此仅凭缺失无法区分生成失败和过去的真实损失。\n\n§Y只有确认家园一号从未正常获得、并非曾经被摧毁时，才选择补发。§!补发前会再次检查唯一性，在当前义军首都附近创建一艘；已有舰体或新版本已记录其毁灭时不会重复生成。\n\n§Y选择补发后，家园一号只在义军拥有且没有帝国或其他交战方舰队的星系生成；没有安全星系时等待后续月度检查。已有存活舰只不会被复制或传送。§!"
 foc_v232q_home_one.7.restore:0 "确认此前未正常获得，补发一艘家园一号。"
 foc_v232q_home_one.7.keep_loss:0 "保留原有入列／损失记录，不补发。"
 Yria:0 "Yria"
