l_simp_chinese:

# =============================================================================
# 命名角色
# =============================================================================
 FOC_SAGA_LUKE_NAME:0 "卢克·天行者"
 FOC_SAGA_KYLO_NAME:0 "凯洛·伦"
 FOC_SAGA_KYLO_SUPREME_NAME:0 "最高领袖凯洛·伦"
 FOC_SAGA_BEN_SOLO_NAME:0 "本·索罗"
 FOC_SAGA_GRIEVOUS_NAME:0 "格里弗斯将军"

# =============================================================================
# 卢克·天行者：帝国时代
# =============================================================================
 foc_luke.10.name:0 "雅雯之战：一线希望"
 foc_luke.10.desc:0 "死星在雅雯四号上空爆炸的时候，义军的战术屏幕上只剩下三架战机。\n\n最后一次攻击跑道由一名没人认识的飞行员完成。他关掉了瞄准计算机，凭手感把质子鱼雷射进了两米宽的排气口。没有人能解释他是怎么做到的——除了跟着他一起飞出来的那位老人，那位老人在半途中已经死在了死星里面。\n\n飞行员的名字叫§H卢克·天行者§!，来自塔图因，此前的职业是农场帮工。\n\n他现在编入我们的指挥序列。"
 foc_luke.10.a:0 "他证明了帝国可以被击败。"

 foc_luke.11.name:0 "达戈巴：最后一位大师"
 foc_luke.11.desc:0 "天行者未经批准就脱离了编队。他的X翼最后一次出现在通讯范围内时，航向指向§H达戈巴§!——一颗湿热、多雾、地图上几乎空白的沼泽星球。\n\n数月之后他才回来，机身上全是泥。他说他在那里找到了一个人，一个身高不到一米、说话把词序全部颠倒的老家伙。那个人在共和国覆灭前是绝地议会的大议长，此后在这颗星球的泥沼里独居了整整二十年。\n\n他只教了天行者一件事：要么去做，要么不做，没有“试试看”。\n\n他还说了另一件事，天行者没有转述。"
 foc_luke.11.a:0 "武士团还剩下老师，就还剩下希望。"

 foc_luke.12.name:0 "贝斯滨：真相"
 foc_luke.12.desc:0 "云城的行动彻底失败。索罗被冻进碳凝块交给了赏金猎人，天行者在反应炉井道里与达斯·维达单独交手，右手连同光剑一起被削掉。\n\n把他从下方通风管道救出来的时候，他没有谈伤势。他只说，维达在最后对他讲了一句话。\n\n§H那个杀死他父亲的人，就是他父亲。§!\n\n医疗舱替他装上了义肢。至于另一件事，没有任何设备能修。他现在必须自己决定：是把这条消息当成通往黑暗的绳索，还是当成一个仍然可以被拉回来的人。"
 foc_luke.12.a:0 "收起光剑。绝地不是靠愤怒赢的。"
 foc_luke.12.b:0 "那就用这份愤怒，把帝国砸碎。"

 foc_luke.13.name:0 "恩多：绝地归来"
 foc_luke.13.desc:0 "恩多的护盾发生器被地面部队摧毁，死星二号在轨道上解体。而真正决定胜负的事，发生在那座战斗空间站的王座厅里。\n\n天行者主动向皇帝投降，为的是见维达最后一面。皇帝要他动手杀死自己的父亲，好接替那个位置。他打赢了那一场决斗——然后把光剑扔在地上，说自己是绝地，和他父亲一样。\n\n皇帝开始用原力闪电杀他。就在那时，那具黑色的装甲动了：达斯·维达抱起皇帝，把他扔进了反应炉井。\n\n面罩摘下来的时候，里面是一个将死的老人。§H阿纳金·天行者§!在恩多的月亮上被火化，是他儿子亲手点的火。"
 foc_luke.13.a:0 "绝地归来了。"

# =============================================================================
# 卢克·天行者：新共和国时代
# =============================================================================
 foc_luke.20.name:0 "奥苏斯：新绝地圣殿"
 foc_luke.20.desc:0 "银河和约后的和平年代里，韩·索罗与莱娅·奥加纳的儿子班·索罗已经显露出强大却并不稳定的原力天赋。卢克·天行者选择在§H奥苏斯§!正式动工建立新的绝地圣殿，并将班列为第一批重点培养的亲传学徒。\n\n与此同时，一个名叫§H雷伊§!的女孩出生。此时没有人知道，她终有一天会走进这场已经延续数代人的光明与黑暗之争。"
 foc_luke.20.a:0 "让武士团重新站起来。"
 foc_luke.21.name:0 "新绝地圣殿覆灭"
 foc_luke.21.desc:0 "第一秩序准备公开发动战争之际，帕尔帕庭通过克隆傀儡斯诺克长期侵蚀班·索罗的心智。卢克在班的睡梦中感受到几乎不可挽回的黑暗，在一瞬间的恐惧中点亮光剑。\n\n班惊醒后彻底崩溃。雷电与火焰吞没奥苏斯的新绝地圣殿，他抛弃旧名，成为§H凯洛·伦§!并投奔第一秩序。卢克则在自责中切断与原力的联系，前往§H阿奇托§!自我放逐。\n\n这一切发生在第一秩序公开发动闪电战之前不久。"
 foc_luke.21.a:0 "那一瞬间是我的失败。"

# =============================================================================
# 卢克·天行者：第一秩序时代
# =============================================================================
 foc_luke.22.name:0 "阿奇托：最后的绝地"
 foc_luke.22.desc:0 "天行者切断了自己在原力中的全部痕迹，然后消失了。\n\n他去的地方叫§H阿奇托§!，一颗遍布礁石与海鸟的孤岛世界。岛上有一棵中空的古树，树里藏着银河系第一批绝地留下的原典——武士团真正的源头。\n\n他不是去守护它们的。他是去等武士团在自己手里终结的。\n\n他的说法是：绝地本身就是错误的一环。武士团在顶点时对西斯视而不见，让西斯从他们内部诞生，让共和国在他们眼皮底下变成帝国。而他自己重建的那个版本，只用了一夜就烧成了灰。\n\n§Y卢克·天行者退出现役指挥序列。§!"
 foc_luke.22.a:0 "让它随我一起结束。"

 foc_luke.30.name:0 "克瑞特：两轮落日"
 foc_luke.30.desc:0 "克瑞特的盐层下，抵抗力量已经被逼进最后一条矿道，闸门被攻城炮轰开。\n\n就在那时，一个人独自走出闸门，站在整支第一秩序地面部队面前。\n\n对方把全部炮火倾泻过去，足足打了一分多钟。烟散之后，他还站在原地，掸了掸肩膀上的灰。凯洛·伦亲自下来与他决斗，一剑穿过了他的身体——什么也没有碰到。\n\n§H那不是卢克·天行者本人。§!他此刻仍在阿奇托的礁石上，用尽全部原力把自己投射到半个银河之外，为的是拖住这支部队，让幸存者从后山的裂缝里逃出去。\n\n幸存者逃掉了。而在阿奇托，他望着两轮落日坐了下来，然后与原力合而为一，只留下地上的斗篷。\n\n整个银河都听说了这件事。从这一天起，第一秩序不再是无人敢于反抗的东西。"
 foc_luke.30.a:0 "火种已经传出去了。"

 foc_luke.31.name:0 "原力之灵"
 foc_luke.31.desc:0 "阿奇托的那棵古树后来也烧了，绝地原典却没有在里面——有人早一步把它们带走了。\n\n而在火光旁出现的，是一个不该出现的人。\n\n他说了两句话。第一句是关于失败的：这才是最好的老师，只是没有人愿意承认。第二句是关于传承的：真正要传下去的不是那些书，而是拿起它们的人。\n\n武士团的档案、神殿、议会都没有了。但只要还有人在原力中站起来，武士团就没有断。"
 foc_luke.31.a:0 "我们不是最后一批。"

# =============================================================================
# 凯洛·伦
# =============================================================================
 foc_kylo.10.name:0 "本·索罗的堕落"
 foc_kylo.10.desc:0 "神殿的火并不是从外面点起来的。\n\n§H本·索罗§!是莱娅·奥加纳与汉·索罗的儿子，也是天行者血脉里天赋最高的一个。从很小的时候起，就有一个声音在他脑子里说话——一个自称§H斯诺克§!的存在，从未知星域伸过来，耐心地对他说：你的家族一直在你身上找另一个人的影子，他们害怕你，包括那个把你送去神殿的舅舅。\n\n那一夜，他睁开眼睛，看见的是舅舅站在床边、光剑已经点亮。\n\n那个声音说的每一句话，在那一瞬间都被证实了。\n\n他带走了几名学徒，烧掉了神殿，从此弃用索罗这个姓氏。他给自己取的新名字是§H凯洛·伦§!。"
 foc_kylo.10.a:0 "他不会再回头了。"

 foc_kylo.11.name:0 "伦骑士团"
 foc_kylo.11.desc:0 "跟着他离开雅雯四号的人组成了一个新的东西：§H伦骑士团§!。\n\n六个人，六件粗糙的武器——斧、钺、弩、重刃，没有一件是光剑，也没有一件像绝地或西斯的制式装备。他们不谈原力哲学，也不宣讲任何教义，只是出现在需要他们出现的地方，然后把那里清空。\n\n凯洛·伦是他们的首领。斯诺克把这支小队交给他，既是奖赏，也是拴住他的绳子。\n\n他自己那把交叉护手光剑是自制的：凯伯水晶有裂痕，能量无法稳定，所以必须在剑柄两侧开泄压口。那两道横刃不是设计，是缺陷。"
 foc_kylo.11.a:0 "他们只效忠一个人。"

 foc_kylo.12.name:0 "弑星者基地：那座桥"
 foc_kylo.12.desc:0 "弑星者基地已经在崩解，热力井正在贯穿整颗行星。而在反应炉上方那道没有护栏的窄桥上，发生了另一件事。\n\n§H汉·索罗§!穿过整座正在爆炸的基地，为的只是走上那座桥。他没有带武器出场，只喊了一个名字——不是凯洛·伦，是§H本§!。\n\n那一刻对方犹豫了。他承认自己正在被撕成两半，说自己需要帮助才能挣脱那道光。他把光剑递了过去。\n\n然后他点亮了它。\n\n索罗伸手碰了碰儿子的脸，坠进了井底。斯诺克要的从来不是一座超级武器，而是这一刀：只有亲手斩断最后一条牵挂，那个学生才算真正属于黑暗。\n\n代价立刻出现了。那一刀之后，他在雪林里输给了一个从未受过训练的拾荒者。"
 foc_kylo.12.a:0 "他杀掉的是自己唯一的退路。"

 foc_kylo.13.name:0 "至尊号：最高领袖"
 foc_kylo.13.desc:0 "至尊号的王座厅里，斯诺克得意于自己的全知：他早就看穿了那个学生心里的每一次动摇，也算准了他会举起光剑杀死俘虏。\n\n他确实算准了那把剑会被点亮。他只是没有算准那把剑当时躺在谁的手边、剑锋朝着哪个方向。\n\n§H斯诺克被自己的学生斩成了两截。§!御前卫队随即扑上来，而那一场混战里，凯洛·伦是背靠背和拾荒者一起打完的。\n\n打完之后他伸出了手，请她一起把过去全部烧掉——绝地、西斯、义军、第一秩序，通通不要。她拒绝了。\n\n于是他自立为§H最高领袖§!，坐上了那把没有人再为他辩护的椅子。"
 foc_kylo.13.a:0 "旧的一切必须死。"

 foc_kylo.14.name:0 "重铸的面具"
 foc_kylo.14.desc:0 "那顶头盔本来已经被他自己砸碎在电梯里。\n\n现在它回来了。碎片被逐一拼回，缝隙里灌进熔化的赤色合金，愈合的裂纹像血管一样爬满整张面罩。他没有解释为什么要修它。\n\n与此同时，未知星域深处传来一段不属于任何已知频道的信号。信号一直重复着同一句召唤，坐标指向一颗不在任何航图上的行星——§H埃克索尔§!。\n\n他独自把飞船开了过去。等在那里的，是一个本该在恩多的反应炉井里死了很多年的人。"
 foc_kylo.14.a:0 "去见那个还没有死的人。"

 foc_kylo.15.name:0 "原力连接"
 foc_kylo.15.desc:0 "银河的两端出现了同一种现象：两个人在毫无预兆的情况下彼此看见、彼此听见，甚至能把手上的水滴带到对方的甲板上。距离对它没有意义，屏蔽对它也没有意义。\n\n古老的记载里管这个叫§H原力连接§!：原力中极其罕见的一对，两个人构成一股力量。它不能被切断，也不能被单方面关闭。\n\n这对第一秩序是个巨大的战术漏洞——最高领袖脑子里的东西，随时可能被另一个人看见。\n\n它对那个最高领袖本人则是另一回事：每一次连接，他都会被迫再看一眼自己当年在窄桥上做过什么。"
 foc_kylo.15.a:0 "他们看得见彼此。"

 foc_kylo.16.name:0 "本·索罗归来"
 foc_kylo.16.desc:0 "两件事同时发生。\n\n在埃克索尔的方向，他刚刚被那个拾荒者的光剑贯穿，随即又被同一个人用原力治愈——她说，她本来想接住的是本·索罗的手。\n\n在半个银河之外，§H莱娅·奥加纳§!用尽最后的生命，在原力中呼唤了儿子的名字，然后停止了呼吸。\n\n他在废墟里坐了很久。父亲的幻影出现在他面前——一个他亲手杀死的人，如今只是重复了当年那句话：回家吧。\n\n他把那把有裂痕的交叉护手光剑扔进了海里。\n\n站起来的人不再是凯洛·伦。§H本·索罗§!回来了，而且他知道自己要去哪里。"
 foc_kylo.16.a:0 "他终于说出了那个名字。"

 foc_kylo.17.name:0 "埃克索尔：最后一次天行者"
 foc_kylo.17.desc:0 "西斯的祭坛下，帕尔帕廷抽干了那两个人身上的原力，让自己重新变得年轻。而那个代价最终也由那两个人还了回去。\n\n最终秩序的舰队烧成了埃克索尔天空里的碎片。等尘埃落定，深坑底下只剩下一具躺着不动的身体。\n\n§H本·索罗§!爬了下去，把她抱起来，把自己全部的生命力送了过去。她睁开眼睛，喊了他的名字——这是三十年里第一次有人这样喊他，而且他也第一次答应了。\n\n然后他微笑着倒了下去，身体化作原力，斗篷落在地上。\n\n天行者的血脉到此为止。那个姓氏后来被另一个人在塔图因的双日下捡了起来。"
 foc_kylo.17.a:0 "他把自己还了回去。"

# =============================================================================
# 分离主义战报（共和国视角）
# =============================================================================
 foc_cis.10.name:0 "分离主义的战争机器"
 foc_cis.10.desc:0 "邦联把舰队和战争工业分散到多个战区。"
 foc_cis.10.a:0 "全线转入战时状态。"

 foc_cis.11.name:0 "格里弗斯将军"
 foc_cis.11.desc:0 "邦联换了最高统帅。\n\n新上任的这一位不是政客，也不是财团代表，而是一台被改造过的战争机器：有机部件只剩下极少一部分，其余全是合金骨架与伺服机构。他咳嗽，因为那对肺是从原来的身体里保留下来的；他收藏光剑，因为那些光剑的原主人都是被他亲手杀掉的绝地。\n\n他上任之后，邦联的舰队第一次表现出真正的战术指挥：突击群开始有配合，主力舰队开始预判共和国的机动，而不是被动等待。\n\n§Y分离主义远征舰队与突击群同时得到增援，邦联舰队获得指挥加成。§!"
 foc_cis.11.a:0 "外环的战线正在变硬。"

 foc_cis.12.name:0 "商业财团总动员"
 foc_cis.12.desc:0 "贸易联盟、银行业协会、技术联合会与采矿业公会在阿基瓦签署了联合声明：所有成员企业的“护航部队”即日起全部并入邦联舰队序列。\n\n这批船本来是用来护送货物、威慑地方政府、必要时封锁一两条航道的。它们数量惊人，因为过去二十年里议会一次也没有真正清点过。\n\n共和国当年在议会大厅里拒绝过一份提案，要求承认这些“护航部队”的合法地位。现在它们不再需要议会承认了。\n\n§Y邦联获得大批增援舰队与全面动员加成。§!"
 foc_cis.12.a:0 "财团把全部家底押上了。"

 FOC_SAGA_SEPARATIST_RAID_FLEET:0 "分离主义突击群"

# =============================================================================
# 修正
# =============================================================================
 foc_saga_hope_of_the_rebellion:0 "雅雯的希望"
 foc_saga_hope_of_the_rebellion_desc:0 "一个农场帮工击毁了一座能摧毁行星的空间站。整个银河都听说了这件事，而这件事的用处远远超过一艘战舰。"
 foc_saga_jedi_restraint:0 "绝地的克制"
 foc_saga_jedi_restraint_desc:0 "他在云城之后收起了光剑。克制换来的是纪律和人心，不是战果。"
 foc_saga_rebel_vengeance:0 "复仇的怒火"
 foc_saga_rebel_vengeance_desc:0 "愤怒确实好用，只是有期限，而且要用别的东西来付账。"
 foc_saga_return_of_the_jedi:0 "绝地归来"
 foc_saga_return_of_the_jedi_desc:0 "皇帝死在自己学徒手里，武士团的名字重新出现在银河的通讯频道上。"
 foc_saga_new_jedi_order:0 "新绝地武士团"
 foc_saga_new_jedi_order_desc:0 "雅雯四号的神殿里只有十二个学徒。人数微不足道，象征意义无法估量。"
 foc_saga_broken_master:0 "失败的老师"
 foc_saga_broken_master_desc:0 "神殿烧了，学徒散了。而他很清楚，那一夜真正的错是从自己点亮光剑的那一瞬间开始的。"
 foc_saga_last_jedi:0 "最后的绝地"
 foc_saga_last_jedi_desc:0 "他不再出手，但他还在。只要还在，武士团就没有正式结束。"
 foc_saga_spark_of_hope:0 "火种"
 foc_saga_spark_of_hope_desc:0 "一个人挡住了一整支地面部队，然后消失在两轮落日之间。从那天起，第一秩序不再是无人敢反抗的东西。"
 foc_saga_force_ghost_guidance:0 "原力之灵的指点"
 foc_saga_force_ghost_guidance_desc:0 "失败才是最好的老师，只是没有人愿意承认。有人还在把这句话讲给下一代听。"
 foc_saga_knights_of_ren:0 "伦骑士团"
 foc_saga_knights_of_ren_desc:0 "六个人，六件粗糙的武器，没有教义也没有仪式。他们只效忠一个人。"
 foc_saga_supreme_leader_kylo:0 "最高领袖凯洛·伦"
 foc_saga_supreme_leader_kylo_desc:0 "他杀掉了自己的老师，坐上了那把椅子。舰队服从他，但没有人真的确信他坐得稳。"
 foc_saga_force_dyad:0 "原力连接"
 foc_saga_force_dyad_desc:0 "原力中极其罕见的一对，两个人构成一股力量。它不能被切断，也不能被单方面关闭。"
 foc_saga_ben_solo_redeemed:0 "本·索罗归来"
 foc_saga_ben_solo_redeemed_desc:0 "他扔掉了那把有裂痕的光剑，也扔掉了那个名字。"
 foc_saga_skywalker_legacy:0 "天行者的遗产"
 foc_saga_skywalker_legacy_desc:0 "血脉断了，名字没有断——有人在塔图因的双日下把它捡了起来。"
 foc_saga_separatist_war_machine:0 "分离主义战争机器"
 foc_saga_separatist_war_machine_desc:0 "阿基瓦地下的自动化体系昼夜不停：舰体在轨道船台上成型，机器人从流水线直接装箱上船。这支军队不需要发饷，不需要口粮，也不会厌战。"
 foc_saga_grievous_command:0 "格里弗斯的指挥"
 foc_saga_grievous_command_desc:0 "邦联终于有了一个真正会打仗的最高统帅。舰队开始预判对手的机动，而不是被动等待。"
 foc_saga_separatist_full_mobilisation:0 "商业财团总动员"
 foc_saga_separatist_full_mobilisation_desc:0 "贸易联盟、银行业协会、技术联合会与采矿业公会把全部私兵并入了邦联舰队序列。"

# =============================================================================
# 新共和国船坞修复
# =============================================================================
 foc_nr_fix.2.name:0 "蒙卡拉马利的船台"
 foc_nr_fix.2.desc:0 "银河条约生效之后，蒙卡拉的水下船坞终于重新点火。\n\n战争年代那批临时改装的巡洋舰不会再造了。取而代之的是两份一直压在图纸柜最底层的设计：中型主力舰§H星云级§!，以及那艘从来没有人真正批准过预算的§H子爵级§!——十七公里长，蒙卡拉马利人为它准备了整整一代人的时间。\n\n§Y星云级与子爵级的建造权限现已开放，两份固定设计已加入船坞建造列表。§!"
 foc_nr_fix.2.a:0 "让它们下水。"
 FOC_SAGA_LEIA_NAME:0 "莱娅·奥加纳"
 FOC_SAGA_MON_MOTHMA_NAME:0 "蒙·莫思玛"

 foc_luke.15.name:0 "恩多：王座厅里发生的事"
 foc_luke.15.desc:0 "死星二号在恩多上空解体了，而帝国真正失去的不是那座战斗空间站。\n\n皇帝把天行者带上了王座厅，本意是让那个年轻人在父亲和自己之间选一个，然后杀掉另一个。计划的每一步都按预想推进——直到天行者赢下决斗、扔掉光剑，说自己是绝地。\n\n皇帝随即动用原力闪电。而站在旁边一动不动看了很久的那个人，最后抱起自己的主人，把他扔进了反应炉井。\n\n§H达斯·维达已经阵亡。§!舰队指挥序列里那个所有人都害怕的名字消失了，帝国失去了他带来的一切。\n\n§Y修正§H达斯·维达§!已移除，其命名指挥官阵亡。§!"
 foc_luke.15.a:0 "恐惧不再替我们打仗了。"

# =============================================================================
# 帕德梅·阿米达拉
# =============================================================================
 FOC_SAGA_PADME_NAME:0 "帕德梅·阿米达拉"

 foc_padme.10.name:0 "纳布的议员"
 foc_padme.10.desc:0 "纳布的君主是选举产生的，任期有限。§H帕德梅·纳贝里·阿米达拉§!卸任时，纳布人几乎一致要求修宪让她连任。她拒绝了，然后接受了另一个职位——纳布派驻银河议会的议员。\n\n她带进议会大厅的是一份很不合时宜的立场：反对军队组建法案，反对给最高议长办公室追加任何紧急权力。她在演讲里说过一句后来被反复引用的话——共和国不会被入侵推翻，它会在一片掌声里被交出去。\n\n投她票的人一年比一年少。\n\n还有一件事没有出现在任何一份记录里：那个当年从塔图因带回来的男孩已经长大，成了绝地武士团里最惹眼的一个。他们两人之间的事，武士团的戒律和议会的规矩都不允许。"
 foc_padme.10.a:0 "议会里还有人在说真话。"

 foc_padme.11.name:0 "他梦见她死去"
 foc_padme.11.desc:0 "§L共和国的命运正在崩塌，而最重要的变化此刻只发生在极少数人之间。§!\n\n外环的战事拖到第三年，科洛桑的绝地档案室收到一份没有归档的口头报告。\n\n§H安纳金·天行者§!开始做同一个梦。他梦见帕德梅在分娩时死去，梦见自己站在旁边什么也做不了。这种梦他做过一次——很多年前，梦的是他母亲，后来全部应验了。\n\n他去问了绝地大师。得到的回答是训导：对失去的恐惧才是通往黑暗面的路，要学会放下。\n\n他又去了歌剧院的包厢。最高议长在那里给他讲了一个西斯传说：从前有一位大师，力量强到能干预生死，能让他在乎的人不死。故事的结尾是那位大师被自己的徒弟在睡梦中杀掉。\n\n讲完之后，议长补了一句：这种力量，绝地是不会教给你的。\n\n\n\n§L本事件保留原剧情与其他效果，不额外增加帕尔帕廷阴谋点数。§!"
 foc_padme.11.a:0 "他会为了不失去她，交出任何东西。"

 foc_padme.12.name:0 "穆斯塔法"
 foc_padme.12.desc:0 "神殿烧掉之后，她驾着自己的飞船去了§H穆斯塔法§!。她不相信那些报告，她要当面问他。\n\n她见到的人向她描述了一个新的秩序：战争会结束，银河会安定，他强大到足以推翻议长、亲自统治一切，而他们可以一起。她后退了一步，说她不认识眼前这个人。\n\n然后欧比旺·克诺比从她的飞船舷梯上走了下来。\n\n他认定这是背叛，是她把人带来的。§H他隔空掐住了她的喉咙§!，直到她昏死在熔岩滩上。\n\n他自己在随后的决斗里被砍断四肢、烧成焦炭，被人从火边捡回去，装进了那身黑色的维生装甲。\n\n帕德梅仍有生命迹象。欧比旺和尤达将她紧急送往§H波利斯·马萨§!，医疗人员准备进行分娩。她的情况极度虚弱，但双生子还没有出生。"
 foc_padme.12.a:0 "他为了不失去她做的每一件事，都是失去她的原因。"

 foc_padme.13.name:0 "双生子"
 foc_padme.13.desc:0 "在§H波利斯·马萨§!的医疗中心，帕德梅生下了一对双胞胎：卢克和莱娅。孩子平安，但她的生命体征迅速衰弱。医疗机器人找不到足以致命的生理损伤——她在说出最后的话后停止了呼吸。\n\n§Y帕德梅·阿米达拉已经死亡。§!\n\n纳布随后为她举行国葬。棺木里的人看上去仍然怀着身孕——这是必须让所有人相信的事，包括那个刚刚被封进黑色装甲里的男人。\n\n孩子必须分开。女孩由奥德朗的贝尔·奥加纳收养；男孩被送回§H塔图因§!，交给欧文和贝鲁抚养。尤达去了达戈巴，欧比旺留在塔图因的沙漠里守望。\n\n§Y原力中的希望没有断，只是被藏了起来。§!"
 foc_padme.13.a:0 "把他们分开，谁也不要告诉。"

 foc_saga_amidala_senator:0 "纳布议员阿米达拉"
 foc_saga_amidala_senator_desc:0 "她在议会里的分量来自那场危机——换掉上一任议长的，正是她的不信任案。如今她把同样的力气用在拦住下一份紧急权力法案上。"
 foc_saga_anakin_visions:0 "天选之子的梦魇"
 foc_saga_anakin_visions_desc:0 "他开始为一件还没有发生的事做准备。而在他身边替他解梦的那个人，正好知道他最怕什么。"
 foc_saga_mustafar_aftermath:0 "穆斯塔法之后"
 foc_saga_mustafar_aftermath_desc:0 "天选之子已经被封进黑色装甲；帕德梅则被紧急送往波利斯·马萨，命悬一线。"

 foc_rebel_growth.2.name:0 "新的战斗群"
 foc_rebel_growth.2.desc:0 "一个新控制的殖民星系加入了帝国叛军。当地造船厂与补给仓库可以提供一支战斗群，也可以转交等值合金预算并加入舰队补给网络。\n\n§Y二选一：20艘MC80，或29800合金并叠加舰船维护费−5%。§!\n合金奖励按奖励版MC80完整设计的基础合金造价核算：每艘1490合金（舰体与配件），20艘共29800，不按各国临时折扣浮动。每个符合条件的星系仅结算一次。"
 foc_rebel_growth.2.a:0 "继续推进。"

# =============================================================================
# 恩多之后的帝国
# =============================================================================
 FOC_SAGA_THRAWN_NAME:0 "索龙元帅"

 foc_luke.17.name:0 "皇帝之死"
 foc_luke.17.desc:0 "死星二号的王座厅在解体前几分钟发生过一件事，帝国的官方通报里一个字也没提。\n\n§H帕尔帕廷死了。§!把他从御座边抱起来、扔进反应炉井的，是他自己二十三年来最信任的那个人。\n\n没有遗体，没有遗嘱，也没有继承人——他从来没有安排过继承人，因为他压根不打算死。整个新秩序的合法性都系在一个人身上，而那个人现在连一具尸首都没留下。\n\n科洛桑的军部在十二小时内成立了§H帝国摄政§!，对外宣称皇帝仍在处理事务。没有人相信这句话，包括发布它的人。\n\n从今天起，帝国由一个没有名字的军人政府维持——各战区的总督和元帅正在互相试探，看谁先动手。\n\n§Y帝国进入继承危机：稳定度、政府吸引力、凝聚力与舰队射速全面下降，厌战上升。§!"
 foc_luke.17.a:0 "皇帝陛下仍在处理事务。"
 foc_thrawn.2.name:0 "索龙元帅归来"
 foc_thrawn.2.desc:0 "银河和约后的冷战年代，阿索卡·塔诺与萨宾·辛格终于追上失踪多年的埃兹拉·布里杰；然而，流亡在遥远星系的§H索龙元帅§!也借暗夜姐妹之力重返银河。\n\n新共和国把相关警告视为边境小题大做，帝国残余却第一次重新拥有了一个真正懂得如何整合资源与制定长期战略的统帅。\n\n§Y索龙接掌帝国残余。§!"
 foc_thrawn.2.a:0 "帝国还没有输，只是换了个打法。"

 foc_saga_imperial_succession_crisis:0 "帝国继承危机"
 foc_saga_imperial_succession_crisis_desc:0 "新秩序的一切合法性都系在一个人身上，而那个人在恩多连一具尸首都没留下。各战区的总督和元帅正在互相试探。"
 foc_saga_thrawn_command:0 "索龙元帅的指挥"
 foc_saga_thrawn_command_desc:0 "他不靠恐惧统治，也不靠数量取胜。他先弄清楚对手下一步要做什么，然后让那一步变得毫无意义。"

 NAME_FOC_REBEL_NEBULA_NR:0 "星云级歼星舰"
 NAME_FOC_REBEL_MC158_NR:0 "子爵级星际防御舰"

# =============================================================================
# 克隆人战争 / 义军时代 / 索龙时代
# =============================================================================
 FOC_SAGA_KATANA_FLEET:0 "卡塔纳舰队"

# ===== 克隆人战争 =====
 foc_cw.1.name:0 "吉奥诺西斯战役"
 foc_cw.1.desc:0 "吉奥诺西斯危机迫使共和国启用克隆人大军。关闭本事件后，独立星系邦联正式建立，克隆人战争爆发。"
 foc_cw.1.a:0 "我们赢了第一仗。"

 foc_cw.2.name:0 "外环攻势"
 foc_cw.2.desc:0 "§L军团频道里只剩简短的坐标、伤亡数字和命令，真正的代价要等战斗结束后才看得见。§!\n\n战线拉到了外环，而外环没有战线可言——只有一串互不相连的星系，每一个都要单独打。\n\n邦联把工厂修在地下，把舰队藏在小行星带里，把守军换成不需要补给的机器人。共和国这边则把绝地一个个派出去当将军：一个人带一个军团，一次派往一颗星球，从此音讯全无地打上几个月。\n\n参谋部现在必须选一种打法。"
 foc_cw.2.a:0 "稳扎稳打。用吨位和时间碾过去。"
 foc_cw.2.b:0 "让绝地打头阵。速度就是伤亡最小。"

 foc_cw.6.name:0 "科洛桑突袭：议长被劫持"
 foc_cw.6.desc:0 "邦联的一支§H25艘卢克里胡克级战列舰§!突袭舰队已抵达科洛桑，最高议长遭到劫持。"
 foc_cw.6.a:0 "截住他们，把议长带回来。"
 foc_cw.3.name:0 "科洛桑之战"
 foc_cw.3.desc:0 "§L军团频道里只剩简短的坐标、伤亡数字和命令，真正的代价要等战斗结束后才看得见。§!\n\n科洛桑防线守住了。实际投入首都突袭的邦联舰队已经被全部消灭或赶出星系，共和国仍然控制首都。\n\n邦联舰队突然出现在共和国首都上空——不是为了占领，是为了绑走一个人。\n\n§H最高议长本人被劫上了旗舰。§!营救行动由两名绝地执行，而他们在舰桥上撞见的是§H杜库伯爵§!。\n\n杜库击昏了其中一个，与另一个交手，输了，双手被斩断。他跪在那里，等着被押走受审。\n\n然后议长开口了。他没有说要活的。\n\n那名年轻的绝地在犹豫了两秒之后照做了。事后议长安慰他：换作是我，也会这么做。\n\n西斯从不留两个学徒。老的那个死了，位置空了出来——而空出来的位置，年轻人自己心里清楚是留给谁的。\n\n§Y帕尔帕廷的阴谋推进 10 点。§!\n\n§Y科洛桑战役已完成；杜库真实死亡；本节点只记阴谋＋10。§!"
 foc_cw.3.a:0 "他学会了一件不该学会的事。"

 foc_cw.4.name:0 "乌塔帕：机器的终点"
 foc_cw.4.desc:0 "§L绝地曾经调停战争，如今他们站在战舰舰桥上，亲自命令军团投入战争。§!\n\n邦联已经完全失去§H乌塔帕§!星系控制权。最高统帅部的位置最终被锁定在这颗一颗满是竖井的干旱星球，机器人军团就藏在井壁的城市里。\n\n共和国单派了一名绝地先行侦察。他骑着一头本地驮兽从竖井边缘一路冲下去，在停机坪上截住了正要登舰逃跑的§H格里弗斯将军§!。\n\n四把光剑对一把。最后结束这件事的不是光剑，是一把从死掉的卫兵身上捡来的爆能枪，两枪打进那对有机肺叶。\n\n将军倒下的时候，全银河的战斗机器人还在正常运转。但发出命令的那颗脑袋没有了。\n\n§Y乌塔堡战役已完成，格里弗斯死亡。本战役不额外增加阴谋分数。§!"
 foc_cw.4.a:0 "机器人还在动，但没有人在指挥它们了。"

 foc_cw.5.name:0 "卡希克：最后一场胜仗"
 foc_cw.5.desc:0 "§L绝地曾经调停战争，如今他们站在战舰舰桥上，亲自命令军团投入战争。§!\n\n邦联已经完全失去§H卡希克§!星系控制权。卡希克的浅滩上，绝地大师尤达和伍基人并肩守住了海岸线。邦联的登陆部队被压回水里，战报发往科洛桑：外环战事即将结束。\n\n这是共和国打赢的最后一场仗。\n\n就在那片浅滩上，尤达接到了一段来自科洛桑的加密通讯。他站在原地听完，没有说话，然后转身对身边的克隆人指挥官说了些什么。\n\n那名指挥官立正、敬礼，然后从腰间取下通讯器，接收了另一条频道上的指令。"
 foc_cw.5.a:0 "把部队撤回来。"

# ===== 义军时代 =====
 foc_reb.1.name:0 "罗萨：一颗星球的反抗"
 foc_reb.1.desc:0 "§H罗萨§!是外环一颗谁都记不住名字的农业星球。帝国把它的草原铲平，改成了兵工厂和试飞场；本地人从农民变成了工人，工资由帝国定，粮食由帝国配给。\n\n然后有一小撮人开始搞事：偷补给、炸运输队、在通讯塔上插旗。人数少到帝国总督起初只当成治安案件。\n\n他们向我们发来了信号，请求承认与支援。起义成功后，§H罗萨星系将正式脱离帝国并加入帝国叛军控制§!。\n\n§Y两条路线：公开起义能立刻点燃士气，但会招来清剿；细胞网络更慢，也更活得下去。§!"
 foc_reb.1.a:0 "公开承认他们。让别的星球也看见。"
 foc_reb.1.b:0 "先建细胞网络。活着比响亮重要。"

 foc_reb.2.name:0 "杰达：圣城"
 foc_reb.2.desc:0 "§H杰达§!的圣城站了几千年，是绝地采集凯伯水晶的地方，也是全银河朝圣者最后能去的地方之一。帝国在那里开矿已经很多年，把整座山掏空，把晶体一船一船运走。\n\n索·格雷拉的游击队就藏在那片沙漠里。他们打了帝国十几年，手段脏，纪律差，义军高层一直不肯认他们。\n\n然后帝国在杰达上空开了一炮。\n\n不是舰炮。是那件传闻里的东西，用了单发低当量。圣城连同周围数百公里在几秒钟内变成一个新的陨石坑，沙尘冲上大气层。\n\n§H传闻不再是传闻了。§!"
 foc_reb.2.a:0 "所有人都必须知道这件事。"

 foc_reb.3.name:0 "蒙卡拉马利：船台"
 foc_reb.3.desc:0 "§H蒙卡拉马利§!的船坞在水下，从太空看不见。帝国占领这颗星球之后一直想把它们征用，但蒙卡拉人给出的产能报表年年不达标——他们把最好的工人和最好的图纸都藏了起来。\n\n现在他们决定不装了。\n\n随同加入的还有一批设计图。那不是巡洋舰改装方案，是完整的主力舰设计：中型的§H星云级§!，以及一份从来没有人批准过预算的十七公里长的东西——§H子爵级§!。\n\n蒙卡拉人说，他们为这一天准备了整整一代人。\n\n§Y获得蒙卡拉船台加成：舰体、护盾与船坞建造速度提升。§!"
 foc_reb.3.a:0 "让船台开工。"

 foc_reb.4.name:0 "曼达洛：暗黑剑"
 foc_reb.4.desc:0 "曼达洛的统治权不靠选举，也不完全靠血统。它靠一把剑——§H暗黑剑§!，一千年前由第一位曼达洛绝地锻造的黑色光剑。谁在决斗中赢下它，谁就有资格号令各氏族。\n\n帝国扶植的傀儡总督手里现在拿着那把剑，而他不是靠决斗拿到的。\n\n各氏族分成了两半。一半要打回去，一半要先看看谁给的价码高。\n\n我们的态度会决定这颗星球倒向哪边。\n\n§Y支持氏族舰队可获得舰船加成与海军上限；支持突击队可获得极强的地面作战能力。§!"
 foc_reb.4.a:0 "支持氏族舰队。我们需要能上天的东西。"
 foc_reb.4.b:0 "支持突击队。我们需要能落地的人。"

 foc_reb.5.name:0 "科雷利亚条约"
 foc_reb.5.desc:0 "在此之前，反抗帝国的从来不是一个组织，而是几十个互不认识、互相提防的小团体：罗萨的工人、杰达的游击队、蒙卡拉的船厂、曼达洛的氏族、还有议会里那几个没有被抓走的议员。\n\n他们在科雷利亚坐到了同一张桌子前，签了一份文件。文件很短，主要内容只有一句：从今天起，我们是同一支军队。\n\n§H义军同盟§!正式成立。科雷利亚也公开脱离银河帝国并加入帝国叛军，成为同盟的重要工业与交通枢纽。它现在有旗帜、有编制、有统一的指挥系统，也第一次有了一个能被帝国正式宣战的对象。\n\n§Y科雷利亚星系将移交帝国叛军，并获得同盟宣言加成：凝聚力、外交权重与稳定度上升，厌战下降。§!"
 foc_reb.5.a:0 "从今天起，我们是同一支军队。"

# ===== 索龙时代 =====
 foc_rem.1.name:0 "军阀割据"
 foc_rem.1.desc:0 "银河条约签下去之后，帝国残余在纸面上是一个国家。实际上不是。\n\n外环每一个还挂着帝国旗的星区，手里都有自己的舰队、自己的船坞、以及一个自称合法继承人的总督或元帅。有人还在用皇帝的名义发号施令，有人已经开始铸自己的钱。他们之间的边境摩擦比对新共和国的还多。\n\n残余政府必须先解决这件事，否则谈不上任何对外行动。\n\n§Y铁腕整肃：稳定度与战力上升，但民众幸福度下降。收编招安：海军上限与稳定度上升，但舰队维护费上升。§!"
 foc_rem.1.a:0 "铁腕整肃。把不听话的星区总督换掉。"
 foc_rem.1.b:0 "收编招安。给他们位置，换他们的舰队。"

 foc_rem.2.name:0 "奇美拉号"
 foc_rem.2.desc:0 "一艘帝国级歼星舰从未知星域的方向跳了出来，没有报出识别码，径直穿过残余的哨戒线。\n\n舰名§H奇美拉§!。舰龄很老，维护得极好，舰体上带着一些没人见过的战损修补痕迹——那些不是新共和国的武器打出来的。\n\n它带来的不只是一艘船。它带来的是一份银河边缘的航图、一套在未知星域打了很多年才磨出来的战术，以及一个终于有人肯服从的舰桥。\n\n从今天起，残余舰队有了一个真正的旗舰。\n\n§Y获得奇美拉号加成：火力、命中、追踪提升，厌战下降。§!"
 foc_rem.2.a:0 "全舰队向奇美拉号靠拢。"

 foc_rem.3.name:0 "卡塔纳舰队"
 foc_rem.3.desc:0 "旧共和国时代有过一支两百艘德雷德诺特级组成的舰队，全部装了全舰联动系统，一个舰桥就能指挥两百条船。首航时全体船员染上疫病，在神志不清的状态下把整支舰队一起跳进了超空间。\n\n此后五十年，找它成了银河系最著名的一桩传说生意。没有人找到过。\n\n现在有人找到了。\n\n船体完好，反应炉冷了但没坏，武器系统还是五十年前的型号——放在今天的战场上不算先进，可它们不需要先进，它们只需要够多。\n\n§Y一支卡塔纳舰队已编入残余舰队序列。§!"
 foc_rem.3.a:0 "把它们全部拖回船坞。"

 foc_rem.4.name:0 "夸特船台"
 foc_rem.4.desc:0 "§H夸特§!的环形船台是银河系最大的军工设施，帝国海军六成的吨位从那里下水。条约把夸特划给了新共和国，但船台的所有权在夸特驱动器场手里，而那是一家公司。\n\n公司不谈立场，只谈订单。\n\n他们派人来了，带着一份很实际的方案：新共和国的订单排到七年后，中间那段产能空着也是空着。价钱谈妥了，交货方式不留记录。\n\n§Y获得夸特合约加成：舰体、装甲与船坞建造速度提升。§!"
 foc_rem.4.a:0 "签。别留记录。"

 foc_rem.5.name:0 "两条路"
 foc_rem.5.desc:0 "整肃完成了，旗舰回来了，舰队补齐了，船台也接上了。残余第一次不再是残余，而是一个有能力做选择的政权。\n\n参谋部把两份方案摆上了桌。\n\n一份主张就守着外环这块地。承认条约，坐稳这几十个星区，用二十年把它变成一个真正能自己活下去的国家——代价是永远放弃那个曾经属于我们的银河。\n\n另一份主张现在就动手。新共和国的议会还在为舰队预算吵架，边境守备是空的，而我们手里有一个知道怎么打赢的人。\n\n§Y巩固：稳定度、凝聚力、外交权重大幅提升，厌战下降，但舰队火力下降。再征服：火力、射速、海军上限与地面战大幅提升，但稳定度下降。§!"
 foc_rem.5.a:0 "守住外环。把它变成真正的国家。"
 foc_rem.5.b:0 "现在动手。他们还没准备好。"

# ===== 修正 =====
 foc_saga_cw_grand_army:0 "大共和国军"
 foc_saga_cw_grand_army_desc:0 "银河系两千年来第一次有了常备军。没有人说得清那份订单是谁下的。"
 foc_saga_cw_attrition_doctrine:0 "消耗战学说"
 foc_saga_cw_attrition_doctrine_desc:0 "用吨位和时间碾过去。慢，但是活得下来的人多。"
 foc_saga_cw_jedi_spearhead:0 "绝地突击"
 foc_saga_cw_jedi_spearhead_desc:0 "把绝地一个个派出去当将军，一次一颗星球。速度确实是最省人命的东西——对活下来的那些人而言。"
 foc_saga_cw_droid_command_broken:0 "指挥中枢瘫痪"
 foc_saga_cw_droid_command_broken_desc:0 "机器人还在动，但发出命令的那颗脑袋没有了。"
 foc_saga_reb_open_uprising:0 "公开起义"
 foc_saga_reb_open_uprising_desc:0 "让别的星球看见有人真的敢动手。代价是清剿队也看见了。"
 foc_saga_reb_cell_network:0 "细胞网络"
 foc_saga_reb_cell_network_desc:0 "互不认识，互不联络，一个被抓不会牵出第二个。慢，但活得久。"
 foc_saga_reb_mon_cala_yards:0 "蒙卡拉船台"
 foc_saga_reb_mon_cala_yards_desc:0 "水下的船坞从太空看不见。蒙卡拉人为这一天藏了整整一代人的图纸和工人。"
 foc_saga_reb_mandalorian_fleet:0 "曼达洛氏族舰队"
 foc_saga_reb_mandalorian_fleet_desc:0 "各氏族的私船并入了同盟序列。它们不好指挥，但它们敢往里冲。"
 foc_saga_reb_mandalorian_commandos:0 "曼达洛突击队"
 foc_saga_reb_mandalorian_commandos_desc:0 "全银河最贵也最好用的地面部队。他们不认军衔，只认打得赢的人。"
 foc_saga_reb_declaration:0 "科雷利亚条约"
 foc_saga_reb_declaration_desc:0 "几十个互相提防的小团体坐到了同一张桌子前。文件很短，主要内容只有一句。"
 foc_saga_rem_iron_discipline:0 "铁腕整肃"
 foc_saga_rem_iron_discipline_desc:0 "不听话的星区总督被换掉了。剩下的人非常听话，也非常不高兴。"
 foc_saga_rem_bought_loyalty:0 "收编招安"
 foc_saga_rem_bought_loyalty_desc:0 "给他们位置，换他们的舰队。船是到手了，账单也一起到手了。"
 foc_saga_rem_chimaera:0 "奇美拉号"
 foc_saga_rem_chimaera_desc:0 "舰龄很老，维护得极好，舰体上带着一些没人见过的战损修补痕迹。"
 foc_saga_rem_kuat_contracts:0 "夸特合约"
 foc_saga_rem_kuat_contracts_desc:0 "公司不谈立场，只谈订单。交货方式不留记录。"
 foc_saga_rem_consolidation:0 "巩固外环"
 foc_saga_rem_consolidation_desc:0 "承认条约，坐稳这几十个星区，用二十年把它变成一个真正能自己活下去的国家。"
 foc_saga_rem_reconquest:0 "再征服"
 foc_saga_rem_reconquest_desc:0 "新共和国的议会还在为舰队预算吵架，边境守备是空的，而我们手里有一个知道怎么打赢的人。"

 foc_ethics.2.name:0 "新秩序"
 foc_ethics.2.desc:0 "帝国的政体、国策和旗帜都换过了，但有一样东西一直没有跟上：这个国家在纸面上仍然按共和国的价值观运转。\n\n议会时代的对外开放条款、非军事化承诺、种族平等法案，全部还挂在法典里，只是没有人再执行。总督们照着旧条文办事，军方照着新命令办事，两边每天都在打架。\n\n最高议长办公室今天一次性废除了它们。\n\n§H新秩序的三条支柱正式写进宪章：人类至上、军事优先、绝对权威。§!\n\n§Y国家伦理观已修正为§H排外主义 + 军国主义 + 威权主义§!，与帝国政体一致。§!"
 foc_ethics.2.a:0 "法典终于跟上了现实。"

 foc_rebyard.2.name:0 "机库"
 foc_rebyard.2.desc:0 "同盟从成立那天起就有一个谁都不愿意说破的问题：我们能抢船、能改装船、能把货轮焊成炮艇，但我们没有一处能把龙骨铺下去的地方。\n\n占下来的星系只有前哨站——一根监听桅杆，一台跃迁抑制器，仅此而已。那上面装不了任何东西，因为它根本没有装东西的地方。\n\n工程队花了几个月把首都星系的前哨站扩建成一座真正的要塞：两条船台、一处锚地、一组炮台，外加乘员舱与后勤办公室。另外两个有殖民地的星系各加了一条船台，用来做前线修理和备用产能。\n\n其余星系维持原样。同盟养不起遍地要塞，也不需要。\n\n§Y首都星系已升级为要塞级恒星基地（双船坞 + 锚地 + 炮台），另有两个星系各升为星港并获得一条船台。§!"
 foc_rebyard.2.a:0 "把龙骨铺下去。"

 foc_rebyard.4.name:0 "夸特的船台"
 foc_rebyard.4.desc:0 "两座死星都成了残骸，而§H夸特§!的环形船台完整地落在了我们手里。\n\n帝国撤退时来不及炸毁任何东西——那些船台太大了，大到工程队算过之后放弃了。留下的不只是产线：图纸柜也在原地，锁还是帝国接管前的那一批。\n\n最上面一层压着一份从来没有下水过的设计。中型主力舰，火力对得起吨位，造价只有帝国级的一小部分，本来是共和国海军为战后重建准备的下一代主力。议会当年没有批预算，帝国接管后把它锁进了柜子。\n\n蒙卡拉的工程师看了一眼图纸，说他们认得这个线条——这份设计有一半是他们画的。\n\n§H星云级歼星舰§!的蓝图现已解封。\n\n§Y获得星云级建造权限，固定设计已加入船坞列表。子爵级仍然封存，要等银河条约之后。§!"
 foc_rebyard.4.a:0 "开工。"

 foc_raddus.2.name:0 "拉杜斯号的舱段"
 foc_raddus.2.desc:0 "旗舰的检修报告送上来时，值班军官以为是记录出错了。\n\n§H拉杜斯号§!的三处专属舱段——工程舱、停泊舱、以及贯穿舰体的轴向打击指挥模块——在编制表上全部显示为空。船体完好，反应炉正常，机库里一百二十架战机也都在位，但那三样让它不只是一艘大船的东西，不知道从哪一天起就不在了。\n\n追查下去，原因很荒唐：那些舱段的授权名录里写的是「义军同盟」。而我们在银河条约之后已经不叫这个名字了。舰还是那艘舰，人还是那批人，只是登记簿上的抬头换了，于是系统判定这些舱段不属于我们。\n\n名录已经改过来了，舱段正在重新接入。\n\n§Y拉杜斯号的三处专属舱段已恢复，并补齐原版方舟舰套件：机库、激光炮组、传感器阵列、居住舱，以及装甲与护盾。同时修正了它在战斗中会被俘获的判定（原版方舟舰不会易主，只会瘫痪）。§!"
 foc_raddus.2.a:0 "改个抬头就差点弄丢一艘旗舰。"

 foc_saga_dqar.3.name:0 "复员令"
 foc_saga_dqar.3.desc:0 "银河条约签字之后的第一份文件不是庆祝声明，是复员令。\n\n那些数字是战时的：为了拆掉两座死星、为了在内环打赢一场看不到头的仗，我们把船坞开到极限、把厌战压到最低、把每一份产能都塞进军工。舰队规模一度超过旧共和国鼎盛期的三倍。\n\n现在没有仗打了，而这套体制养不起，也不该继续存在。议会用了很短的时间就通过了决议：预备役解散，超编舰队封存，产能转向重建。\n\n有人在议场里问，如果他们回来怎么办。回答是：那就再打一次，但不能靠一直准备打仗活着。\n\n§Y摧毁死星一号、死星二号与双死星覆灭的战时加成已随条约收回，转为战后复员修正——舰队规模与建造速度下调，产能、稳定度、凝聚力与外交权重提升。§!"
 foc_saga_dqar.3.a:0 "把船坞转回民用。"
 foc_saga_postwar_demobilisation:0 "战后复员"
 foc_saga_postwar_demobilisation_desc:0 "战时体制随银河条约解除。打仗的能力降下来，建设与治理的能力提上去。"

# =============================================================================
# 银河内战平衡
# =============================================================================
 foc_balance.10.name:0 "治安成本"
 foc_balance.10.desc:0 "内政部送来的季度报告只有一句结论：新秩序的统治成本正在失控。\n\n过去二十年，帝国在外环的每个星区只留一个总督府和一支象征性的驻军就够了。这套办法能成立，靠的不是兵力，是没有人相信反抗有意义。\n\n现在有人相信了。\n\n罢工、破坏、通讯塔上的涂鸦、消失的运输队——单独看每一件都不值得动用舰队，加在一起就是整个外环的行政效率在往下掉。而且它有一个非常清楚的规律：§H凡是上空没有帝国舰队的星球，情况都要糟得多。§!\n\n地方总督的要求出奇一致：给我们留船。\n\n§Y帝国全境进入不良治安状态，随义军的战果逐级恶化。此外，任何一颗上空没有帝国舰队驻防的殖民地将额外承受稳定度与产能惩罚——舰队一走惩罚就回来，开回去立刻消失。§!"
 foc_balance.10.a:0 "把舰队摊开去守地方。"
 foc_saga_rebel_step_1_spark:0 "星火"
 foc_saga_rebel_step_1_spark_desc:0 "三颗基地世界站住了脚。义军还很弱，这一步只是让他们活下去。"
 foc_saga_rebel_step_2_scarif:0 "斯卡里夫档案"
 foc_saga_rebel_step_2_scarif_desc:0 "帝国全部超级武器项目的原始工程档案。它值的不只是那个排气口。"
 foc_saga_rebel_step_3_yavin:0 "雅雯之后"
 foc_saga_rebel_step_3_yavin_desc:0 "死星被一支不到三十架战机的小队打掉了。从那天起，志愿者开始成建制地来。"
 foc_saga_rebel_step_4_uprising:0 "内环起义"
 foc_saga_rebel_step_4_uprising_desc:0 "十几个星系在同一周之内易帜。义军第一次有了后方，而不只是藏身处。"
 foc_saga_rebel_step_5_kuat:0 "夸特船台"
 foc_saga_rebel_step_5_kuat_desc:0 "银河系最大的军工设施易手。帝国海军六成的吨位曾经从这里下水。"
 foc_saga_rebel_step_6_coruscant:0 "科洛桑陷落"
 foc_saga_rebel_step_6_coruscant_desc:0 "首都易帜，帝国失去了中枢。剩下的只是把外环一个个收回来。"
 foc_saga_imperial_unrest_1:0 "地方观望"
 foc_saga_imperial_unrest_1_desc:0 "义军站住了脚。各星区总督还在照常办公，但已经开始把税收数字往低了报。"
 foc_saga_imperial_unrest_2:0 "恐惧贬值"
 foc_saga_imperial_unrest_2_desc:0 "死星被打掉了。新秩序赖以运转的那样东西，第一次被证明是可以打破的。"
 foc_saga_imperial_unrest_3:0 "全境动荡"
 foc_saga_imperial_unrest_3_desc:0 "两座死星都没了。总督被自己的驻军扣押，几十年没开过的地方议会重新召集起来。"
 foc_saga_planet_ungarrisoned:0 "上空无驻防舰队"
 foc_saga_planet_ungarrisoned_desc:0 "只有银河帝国实际控制这颗殖民地时才会检查驻防舰队。若被任何其它国家占领或控制，此惩罚会自动移除。"

 foc_reb.6.name:0 "蒙·卡拉马里星际巡洋舰设计"
 foc_reb.6.desc:0 "帝国叛军成立后，蒙·卡拉马里的造船师终于把长期隐藏的军用巡洋舰方案交给了叛军舰队。此前这些船体只能以少量预先服役舰存在，无法作为标准舰型在船坞批量建造。\n\n现在，MC80的主反应堆、分布式护盾阵列、重型涡轮激光炮和舰载机甲板已经整理成完整的标准化设计。\n\n§YMC80巡洋舰现已解锁建造。共和国时代无法提前获得该建造权限。§!"
 foc_reb.6.a:0 "把设计交给各舰队船坞。"
 FOC_TRADE_FEDERATION_CORUSCANT_INVASION:0 "科洛桑入侵舰队"
