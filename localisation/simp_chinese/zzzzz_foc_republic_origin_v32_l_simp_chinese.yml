 foc_republic_origin_imperial_fear_deficit_desc:0 "帝国以武力夺取了银河，却还没有给出统治它的理由。各世界表面服从，暗地里没有一个真心归附。\n\n只有当死星一号真正建成、且皇帝确立§H塔金主义§!——以对那座空间站的恐惧进行统治——之后，这一状态才会解除。若选择以行政手段治理外环，帝国将长期背负这份不稳定。"
