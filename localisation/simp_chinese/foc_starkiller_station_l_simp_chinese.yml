 FOC_STARKILLER_RING_REACTOR:0 "弑星者基地恒星反应堆"
 FOC_STARKILLER_RING_REACTOR_desc:0 "恒星能量沿巨型输能管道汇入防御环，为护盾、炮群与机库持续供能。"
 FOC_STARKILLER_RING_COMPUTER:0 "弑星者基地火控电脑"
 FOC_STARKILLER_RING_COMPUTER_desc:0 "分布式火控核心将整座防御环的涡轮激光、点防炮与舰载机编织成统一杀伤网。"
 FOC_STARKILLER_RING_SENSOR:0 "弑星者基地传感器阵列"
 FOC_STARKILLER_RING_SENSOR_desc:0 "深埋于基地内部的远程传感器能够追踪超空间扰动，并为防御环提供完整战场图景。"
