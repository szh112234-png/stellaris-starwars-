l_simp_chinese:
 foc_khan_settings.13.name:0 "星球大战MOD初始模式"
 foc_khan_settings.13.desc:0 "选择一套开局游戏模式。三个预设都会使用§Y战机原版显示大小§!。§H星战剧情国家§!的战略打击飞机科技改为按国家身份自动解锁，与开局选项无关；§H普通起源国家§!仍按开局战机阵营设置决定可用科技。§HFOC游戏模式§!为默认推荐；只有选择§H详细设置§!后，才进入分项设置。"
 foc_khan_settings.13.vanilla_mode:0 "§G原版游戏模式§!"
 foc_khan_settings.13.vanilla_mode_desc:0 "§G原版强度§!；战机原版大小；星战剧情国家按身份解锁对应战略战机，普通起源开放全部战略战机；危机采用§Y中等/标准支援§!；剧情时间轴默认2200年。"
 foc_khan_settings.13.foc_mode:0 "§YFOC游戏模式（默认）§!"
 foc_khan_settings.13.foc_mode_desc:0 "§Y中等/FOC强度§!；战机原版大小；星战剧情国家按身份解锁对应战略战机，普通起源开放全部战略战机；危机采用§R最大支援§!；剧情时间轴默认2200年。"
 foc_khan_settings.13.acot_mode:0 "§RACOT游戏模式§!"
 foc_khan_settings.13.acot_mode_desc:0 "§RACOT级强度§!；战机原版大小；星战剧情国家按身份解锁对应战略战机，普通起源开放全部战略战机；危机采用§R最大支援§!；剧情时间轴默认2200年。"
 foc_khan_settings.13.detailed:0 "§H详细设置§!"
 foc_khan_settings.13.detailed_desc:0 "进入分项设置界面。初始值以§YFOC游戏模式§!为基准。星战剧情国家只能调整战机显示大小，战机阵营由国家身份自动决定；普通起源仍可自行选择战机阵营。"
 foc_khan_settings.16.name:0 "星球大战MOD详细设置"
 foc_khan_settings.16.desc:0 "这里才是分项设置界面。当前默认值为§Y中等/FOC强度 + 战机原版大小 + 危机最大支援 + 2200年剧情§!。星战剧情国家的战略战机科技按身份自动配置；普通起源仍可在战机菜单选择阵营。修改后返回本页并确认。"
 foc_khan_settings.16.strength:0 "§H一、战斗强度§!"
 foc_khan_settings.16.fighter_settings:0 "§H二、战略战机显示设置§!"
 foc_khan_settings.16.fleet_scale:0 "§H三、危机支援规模§!"
 foc_khan_settings.16.story_timeline:0 "§H四、完整剧情开始时间§!"
 foc_khan_settings.16.confirm:0 "§G确认详细设置并开始§!"
 foc_khan_settings.16.back:0 "返回游戏模式选择"
