l_simp_chinese:
 ap_fop_new_order_crisis_desc:0 "帝国虽已覆灭，秩序的意志却从未消亡。弑星者基地将成为新王座，帝国残余将化作征服群星的铁拳。"
 ap_fop_new_order_crisis_effect_tooltip:0 "§Y第一秩序起源专属飞升§!\n弑星者基地完工后自动获得。帝国残余将宣誓效忠，第一秩序将化身席卷银河的新天灾，使银河诸国与古老帝国共同发动总力战争。循五幕野望征服群星、奴役原力、攻入虚境，最终登临宇宙神座。"

 origin_fop_first_order_effects:0 "第一秩序自银河边缘外的孤立伊冷星系崛起，掌握稳定虫洞科技，并获准使用通往帝国残余疆域的秘密航路。第一秩序不会以另一支势力再次降临。建成弑星者基地后自动获得专属飞升§Y银河新秩序§!。\n开局仅赠送基础涡轮炮、质量加速炮、震荡导弹与点防御；高级武器科技不会因选择此起源而直接解锁。"
 START_SCREEN_FOP_FIRST_ORDER:0 "很久很久以前，在遥远的银河系……\n\n旧帝国已经覆灭。新共和国沉睡在胜利的幻象中，而帝国最后的忠诚者遁入未知区域。\n\n在冰封世界伊冷，§Y第一秩序§!秘密集结。§Y至尊号§!遮蔽苍穹，失落的军团等待号令；只待弑星者之火点燃，整个银河都将在新的秩序下颤抖……"

 fop_origin.10.desc:0 "未知区域的黑暗掩护了我们的崛起。伊冷已被改造成第一秩序的冰封堡垒，至尊号静候于首都上空，通往帝国残余疆域的秘密航路也已显现。\n\n新共和国相信战争早已结束。很快，他们就会明白：帝国的阴影从未离去。"
 fop_origin.10.a:0 "银河将铭记第一秩序之名。"

 fop_origin.11.desc:0 "一份使用帝国最高级密码签署的讯息抵达伊冷。帝国残余的元帅与总督承认第一秩序为帝国意志真正的继承者，并向我们的舰队开放他们守护多年的秘密航路。\n\n破碎的帝国旗帜，将再次在同一片星空下集结。"
 fop_origin.11.a:0 "让帝国最后的军团归于我们的旗帜。"

 fop_origin.20.desc:0 "弑星者基地的核心已经苏醒。与此同时，来自帝国残余的效忠讯号传遍舰队频道：他们的战舰、星域与铸造世界从此归于第一秩序。\n\n恐惧把银河诸国聚到同一面战旗下。就连沉睡万年的古老帝国也已启动战争机器，准备阻止新秩序降临。\n\n然而，在更遥远的黑暗中，艾克西戈正在呼唤。二十年后，最终秩序将现身；失去至尊号或弑星者基地，只会让预言提前应验。"
 fop_origin.20.a:0 "点燃群星，让银河屈服。"

 fop_origin.50.desc:0 "一道来自艾克西戈的黑暗讯号穿透虚空。死者的声音再次宣称自己是银河唯一的皇帝，西斯永恒的舰队则在风暴中等待命令。\n\n帕尔帕廷要求第一秩序献上旗帜与王座，成为最终秩序的利刃。我们可以接受召唤，亲自统率艾克西戈的军团；也可以拒绝亡者的统治，让银河在两种秩序的内战中燃烧。无论选择哪一条道路，通往原力神座的征途都不会终止。"
 fop_origin.50.a:0 "从今以后，我们就是最终秩序。"
 fop_origin.50.a.tt:0 "国号将改为§Y最终秩序§!，首都迁往艾克西戈，帕尔帕廷登上王座；艾克西戈的舰队将归入我们的指挥，银河战争继续。"
 fop_origin.50.b.tt:0 "§Y最终秩序§!将在艾克西戈独立崛起，第一秩序内战随即爆发。部分舰队、边疆殖民地与附庸会倒戈；伊冷、弑星者基地和至尊号仍效忠于我们。§Y银河新秩序§!野望与升神征途不受影响。"

 fop_force_ascension_status_edict:0 "银河新秩序密令"
 fop_force_ascension_status_edict_desc:0 "调阅§Y银河新秩序§!帝国档案，检视当前敕令、征服进程与已经掌握的权能。"

 fop_origin.55.desc:0 "艾克西戈的风暴为新皇帝让路，西斯永恒舰队在无尽雷鸣中宣誓效忠。第一秩序的军政机器与艾克西戈的黑暗军团融为一体，最终秩序由此加冕。\n\n征服银河只是开始。原力本身也将戴上我们的锁链。"

 fop_origin.58.desc:0 "拒绝艾克西戈的召唤撕裂了第一秩序。野心家、边疆总督与动摇的附庸纷纷向最终秩序宣誓，昔日同袍的舰炮已经对准首都。\n\n伊冷、弑星者基地与至尊号仍在忠诚者手中。先粉碎伪皇帝的军团，再去夺取那凌驾众生的原力。"
 fop_origin.58.a:0 "银河只能有一个秩序。"

 fop_origin.65.desc.1:0 "§Y第一幕——银河之敌§!\n弑星者基地的怒火已经点燃银河战争。\n\n§E最高领袖敕令：§!完全占领一个帝国的全部殖民地，将其变为原力奴仆。"
 fop_origin.65.desc.2:0 "§Y第二幕——原力锁链§!\n第一个国家已经屈膝，亿万意志汇入我们的阴影。\n\n§E最高领袖敕令：§!拥有至少三个附庸；若银河已完全臣服，此项敕令立即完成。"
 fop_origin.65.desc.3:0 "§Y第三幕——银河支配§!\n恐惧与服从正在群星之间织成一张灵能之网。\n\n§E最高领袖敕令：§!令银河诸国与古老帝国臣服或灭亡；若曾拒绝艾克西戈，还必须摧毁最终秩序。"
 fop_origin.65.desc.4:0 "§Y第四幕——奴役原力§!\n银河已经匍匐在王座之下。完成特殊项目§Y奴役原力§!，为无形之力铸造枷锁。"
 fop_origin.65.desc.5:0 "§Y第五幕——虚境入侵§!\n原力已被锁链束缚。穿过裂口，消灭原力之海中的全部虚境化身。"
 fop_origin.65.desc.6:0 "§M终幕——新生宇宙神明§!\n群星、原力、物质宇宙与虚境，都已成为你意志的延伸。"
 fop_origin.65.a:0 "让命运继续前行。"

 fop_origin.71.desc:0 "第一个帝国已经彻底屈服。亿万生命在同一时刻感到恐惧，他们的呼喊穿过原力，最终汇入我们的意志。\n\n第一条锁链已经铸成。"
 fop_origin.71.a:0 "还会有更多意志屈服。"
 fop_origin.75.desc:0 "群星之下再没有能够挑战我们的王座。无数生命的恐惧与服从在原力中汇聚，足以铸成束缚原力本身的枷锁。\n\n特殊项目§Y奴役原力§!已经开启。"
 fop_origin.80.desc:0 "原力曾环绕一切生命，如今却只回应一个意志。银河的灵能潮汐已经逆转，群星间每一次恐惧与死亡都成为我们的力量。\n\n虚境发出最后的反抗，通往原力之海的裂口随之撕开。"
 fop_origin.82.desc:0 "裂口另一端并非梦境，而是一片从未被凡人舰队征服的灵能国度。虚境意志唤醒腐化化身，环绕无主神座列阵。\n\n最后一场战争，将在现实之外打响。"
 fop_origin.91.desc:0 "最后一个虚境化身在沉默中消散。原力之海停止翻涌，无主神座终于暴露在舰队面前。\n\n再没有守护者能够阻止升神仪式。"
 fop_origin.100.desc:0 "物质宇宙为之震颤，虚境归于永恒的寂静。统治者的意识越过肉体、死亡与时间，进入原力、群星和现实最深处的法则。\n\n第一秩序不再统治宇宙。第一秩序就是宇宙。"

 fop_ambition_window_subtitle:0 "征服群星，奴役原力，攻入虚境并夺取宇宙神座。即使拒绝艾克西戈的召唤，这条征途仍将继续。"
 fop_ambition.2.desc:0 "§Y第一幕——银河战争§!\n唤醒弑星者基地，接收帝国残余，并令全银河认清真正的敌人。\n\n§Y第二幕——原力锁链§!\n第一个原力奴仆将为舰队带来更庞大的编制、更猛烈的炮火与更坚定的意志。\n\n§Y第三幕——银河支配§!\n三个国家臣服后，群星间的恐惧将进一步强化我们的舰队。\n\n§Y第四幕——奴役原力§!\n统治银河并完成§Y奴役原力§!；若曾拒绝艾克西戈，必须先赢得内战。\n\n§Y第五幕——虚境升神§!\n攻入原力之海，毁灭虚境化身，在无主神座上完成宇宙升神。"
 fop_ambition_show_rewards:0 "检阅已获权能"
 fop_ambition_show_objectives:0 "聆听最高敕令"
 fop_ambition_points_tooltip:0 "摧毁敌舰获得§Y1§!点、攻占殖民地获得§Y25§!点、束缚或摧毁一个帝国获得§Y100§!点野望。每一次晋升还必须完成相应的帝国敕令。"
 fop_ambition_stage_1_name:0 "第一幕　银河战争"
 fop_ambition_stage_2_name:0 "第二幕　原力锁链"
 fop_ambition_stage_3_name:0 "第三幕　银河支配"
 fop_ambition_stage_4_name:0 "第四幕　奴役原力"
 fop_ambition_stage_5_name:0 "第五幕　虚境升神"

 wg_fop_galactic_crisis:0 "银河抵抗战争"
 war_goal_wg_fop_galactic_crisis:0 "银河抵抗战争"
 war_goal_wg_fop_galactic_crisis_desc:0 "面对第一秩序的弑星之火，银河诸国放下旧怨组成联合战线，誓以总力战争守住最后的自由。"
