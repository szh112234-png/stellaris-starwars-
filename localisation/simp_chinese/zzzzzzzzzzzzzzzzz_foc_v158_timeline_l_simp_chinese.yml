l_simp_chinese:
 foc_luke.20.name:0 "奥苏斯：绝地重生"
 foc_luke.20.desc:0 "银河条约签订整整§H4年§!后，卢克·天行者在§H奥苏斯§!建立新的绝地圣殿。自绝地大清洗以来，绝地第一次重新拥有一处真正的永久家园。此时本·索罗仍只是剧情人物，不会生成本·索罗或凯洛·伦可用领袖。"
 foc_luke.20.a:0 "绝地终于重新有了家园。"
 foc_luke.23.name:0 "本·索罗开始修习绝地之道"
 foc_luke.23.desc:0 "银河条约签订已经过去§H10年§!。莱雅·奥加纳与韩·索罗的儿子§H本·索罗§!正式加入卢克在奥苏斯培养的学徒行列。他拥有异常强大的原力天赋，但在这一阶段仍然§H只作为剧情人物存在§!，不会成为可招募领袖。"
 foc_luke.23.a:0 "卢克会亲自教导他。"
 foc_luke.21.name:0 "奥苏斯绝地圣殿毁灭"
 foc_luke.21.desc:0 "银河条约签订§H23年§!后，长期笼罩在§H本·索罗§!周围的黑暗终于爆发。烈火吞没§H奥苏斯§!的新绝地圣殿，卢克重建的绝地武士团几乎在一夜之间毁灭。本·索罗随后消失在斯诺克的阴影中，但此时§H不会§!生成凯洛·伦领袖；只有当第一秩序真正降临银河时，他才会舍弃本·索罗之名，以凯洛·伦身份加入第一秩序。\n\n同一年，针对莱雅·奥加纳的政治攻击达到顶点。新共和国议会拒绝正视未知星域不断扩张的军事威胁，莱雅被迫离开新共和国，带领追随者前往§H迪卡§!，正式成立§H抵抗军§!。"
 foc_luke.21.a:0 "绝地遭受了毁灭性的打击。"
