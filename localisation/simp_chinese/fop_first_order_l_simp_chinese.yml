 NAME_FOP_Ilum_II:0 "伊冷二号"
 NAME_FOP_Ilum_III:0 "伊冷三号"
 NAME_FOP_Ilum_IV:0 "伊冷四号"
 NAME_FOP_Ilum_V:0 "伊冷五号"
