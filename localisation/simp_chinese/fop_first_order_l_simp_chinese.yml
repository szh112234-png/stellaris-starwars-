 NAME_FOP_Solo:0 "索洛"

 fop_origin.10.name:0 "未知区域中的新秩序"
 fop_origin.10.desc:0 "银河帝国在恩多战败后，幸存的军官、技术人员与舰队遵循应急计划撤入未知区域。经过数十年的秘密扩军与军事化统治，帝国残余已经重组为第一秩序。\n\n伊冷主恒星的微弱光芒照耀着冰封首都。绝地曾在地下水晶洞窟中寻找光剑水晶，帝国则在赤道留下了巨大的采掘鸿沟。§H至尊号§!如今承担移动指挥中心、造船基地与舰队旗舰的职责。\n\n第一秩序已经掌握弑星者基地的核心技术，并可选择合适的殖民星球建设这一超级武器。"
 fop_origin.10.a:0 "新秩序将从未知区域崛起。"
 fop_origin.20.name:0 "弑星者基地建成"
 fop_origin.20.desc:0 "行星规模的能源收集槽、聚能系统与超远程发射装置已经全部投入运行。这颗星球已成为§H弑星者基地§!。"
 fop_origin.20.a:0 "启动武器系统。"

 FOP_FIRST_ORDER:0 "第一秩序"
 FOP_FIRST_ORDER_ADJ:0 "第一秩序"
 FOP_HUMAN:0 "人类"
 FOP_HUMANS:0 "人类"
 FOP_HUMAN_ADJ:0 "人类"
 FOP_FIRST_ORDER_SPECIES_BIO:0 "第一秩序由帝国残余、军官集团、技术官僚与从小接受军国主义教育的人口构成。他们将秩序、服从与军事力量置于一切之上。"
 FOP_SNOKE:0 "斯诺克"
 FOP_SUPREME_LEADER:0 "最高领袖"
 gov_fop_first_order:0 "第一秩序军政府"
 gov_fop_first_order_desc:0 "由帝国残余重组而成的独裁军事国家。军队、政府与社会动员体系没有明确界限，一切权力最终归于最高领袖。"

 FOP_FIRST_ORDER_PRESET:0 "第一秩序"
 trait_fop_preset_ethics:0 "威权主义 / 极端军国主义"
 FOP_FIRST_ORDER_PRESET_DESC:0 "由帝国残余在未知区域建立的军国主义政权。第一秩序由最高领袖斯诺克统治，以伊冷为秘密首都，并准备凭借新一代舰队重返银河。"

 START_SCREEN_FOP_FIRST_ORDER:0 "银河帝国在恩多战役中覆灭后，最坚定的军官、技术人员和残余舰队遵照应急计划撤入未知区域。数十年的秘密扩军、军事化教育与严格统治，使这些流亡者重组为§H第一秩序§!。最高领袖斯诺克掌握绝对权力，风暴兵军团与新一代星际舰队只服从他的命令。\n\n第一秩序的秘密首都是伊冷主恒星微弱光芒下的冰封行星§H伊冷§!。帝国曾在这里开采凯伯水晶，并在赤道留下横贯星球的巨大鸿沟。如今，§H至尊号§!作为移动指挥中心和舰队旗舰巡弋于星海，第一秩序也已掌握建造弑星者基地的核心技术。新共和国沉溺于和平，银河却即将再次认识秩序与力量。"
 fop_cradle_war_machine:0 "摇篮里的战争机器"
 fop_cradle_war_machine_desc:0 "第一秩序从诞生之初就将人口、教育与工业组织成一台为战争服务的机器。§Y有机人口增长速度：+25%§!。除帝国残余外，银河系其它正常国家对第一秩序的评价降低。"
 fop_opinion_cradle_war_machine:0 "摇篮里的战争机器"
