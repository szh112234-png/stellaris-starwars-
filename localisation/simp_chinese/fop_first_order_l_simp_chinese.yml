l_simp_chinese:
 origin_fop_first_order:0 "第一秩序：未知区域的继承者"
 origin_fop_first_order_desc:0 "银河帝国在恩多战败后，残余舰队与军官集团撤入未知区域，并在那里重组为第一秩序。最高领袖统治着这个秘密军事国家，其舰队与超级武器计划都服务于重建银河秩序的目标。"
 origin_fop_first_order_effects:0 "§Y开局效果：§!\n- 首都固定为可居住冰封世界§H伊冷§!\n- 伊冷拥有§H凯伯水晶洞窟§!和§H帝国采掘鸿沟§!\n- 开局获得一艘§H一级至尊号方舟舰§!\n- 开局掌握§H弑星者基地§!科技，可在任意符合条件的本国殖民星球建造\n开局仅赠送基础涡轮炮、质量加速炮、震荡导弹与点防御；高级武器科技不会因选择此起源而直接解锁。"

 fop_tech_starkiller_base:0 "弑星者计划"
 fop_tech_starkiller_base_desc:0 "将行星规模的能源收集网络、凯伯水晶聚能系统与超远程发射装置整合为弑星者基地。第一秩序在开局时已经掌握这项技术。"

 fop_starkiller_base_site:0 "弑星者基地建造工程"
 fop_starkiller_base_site_DESC:0 "在一颗本国殖民星球上建设行星级能量收集、储存与发射结构。"
 fop_starkiller_base_final:0 "弑星者基地"
 fop_starkiller_base_final_DESC:0 "一座由整颗行星构成的恒星能量武器。基地能够抽取恒星能量，并将其通过凯伯水晶聚焦后投向遥远星系。"
 fop_starkiller_one_only:0 "§R一个国家只能拥有一座弑星者基地。§!"
 fop_starkiller_requires_owned_colony:0 "§R必须建造在本国拥有并殖民的星球上。§!"

 fop_kyber_crystal_caves:0 "凯伯水晶洞窟"
 fop_kyber_crystal_caves_desc:0 "伊冷地下的古老水晶洞窟曾是绝地幼徒举行集会试炼、寻找光剑水晶的圣地。"
 fop_imperial_mining_trench:0 "帝国采掘鸿沟"
 fop_imperial_mining_trench_desc:0 "帝国为死星武器计划大规模开采凯伯水晶，在伊冷赤道留下了几乎环绕行星的巨大伤痕。"
 fop_airless_low_gravity_rock:0 "黑色低重力岩体"
 fop_airless_low_gravity_rock_desc:0 "这颗位于星系最外围的黑色岩石几乎没有大气与重力。"
 fop_starkiller_world:0 "行星武器化工程"
 fop_starkiller_world_desc:0 "这颗星球的地壳、能源网络与聚能设施已被整合为弑星者基地。"

 NAME_FOP_Ilum_System:0 "伊冷星系"
 NAME_FOP_Ilum_Star:0 "伊冷主恒星"
 NAME_FOP_Asar:0 "伊冷主恒星"
 NAME_FOP_Ilum:0 "伊冷"
