 foc_falcon_support.10.name:0 "全银河的支援"
 foc_falcon_support.10.desc:0 "§Y千年隼§!穿过隐秘航路，闯入了最终秩序盘踞的未知星域。紧随其后的不是一支正规军，而是来自银河各处的无数应答信号：退伍军人、走私者、地方防卫舰队以及幸存的反抗军编队都响应了号召。四支经过整编的联合舰队跃迁至最终秩序首都周围，并立即向西斯舰队发起攻击。"
 foc_falcon_support.10.a:0 "我们的人更多。"
