l_simp_chinese:
 building_foc_sw_fe_civil_nexus:0 "远古文明中枢"
 building_foc_sw_fe_civil_nexus_desc:0 "遍布行星的行政、物流与自动化网络共同构成了一个永不休眠的文明中枢。它能够在几乎不依赖常规官僚体系的情况下维持整个世界的秩序与运转。"
 building_foc_sw_fe_power_core:0 "零点能源核心"
 building_foc_sw_fe_power_core_desc:0 "被封存在行星深处的远古能源网络持续从真空涨落中抽取能量，为城市、舰队和轨道设施提供近乎无穷的动力。"
 building_foc_sw_fe_matter_fabricator:0 "维度物质编织器"
 building_foc_sw_fe_matter_fabricator_desc:0 "巨型物质编织阵列能够将能量直接重组为矿物、稀有晶体与其他战略物资，使这个世界无需依赖脆弱的外部供应线。"
 building_foc_sw_fe_ship_foundry:0 "自主舰船铸造城"
 building_foc_sw_fe_ship_foundry_desc:0 "从耐钢框架到精密舰载设备，整座工业城市都由自律机械昼夜不停地生产。新共和国更重视民用供应，帝国残余则将更多产能投入军舰建造。"
 building_foc_sw_fe_nourishment_vault:0 "永续营养穹顶"
 building_foc_sw_fe_nourishment_vault_desc:0 "封闭生态系统、分子合成设备和古老农业数据库共同保证了行星人口在任何封锁下都不会陷入饥荒。"
 building_foc_sw_fe_archive:0 "银河记忆圣库"
 building_foc_sw_fe_archive_desc:0 "这里保存着横跨无数时代的科学记录、航路资料与文明档案。即使大部分知识早已无人问津，自动研究矩阵仍在继续整理和推演。"

 foc_sw_fallen_empire_economy_core:0 "远古文明经济网络"
 foc_sw_fallen_empire_economy_core_desc:0 "高度自动化的生产体系与庞大战略储备足以长期维持巨型舰队和要塞群；其作战教令禁止舰船脱离战斗或启动紧急超光速撤退。"
 foc_sw_new_republic_economy_focus:0 "新共和国繁荣体系"
 foc_sw_new_republic_economy_focus_desc:0 "新共和国将远古工业能力更多用于民生、科研和社会稳定，同时保留足以守卫核心世界的舰船产能。"
 foc_sw_imperial_remnant_economy_focus:0 "帝国残余战争工业"
 foc_sw_imperial_remnant_economy_focus_desc:0 "帝国残余把矿产、能源和自动化工厂集中到军备生产之中，以钢铁与纪律维系最后的帝国疆域。"
 foc_sw_awakened_fallen_empire_war_economy:0 "全面战争动员"
 foc_sw_awakened_fallen_empire_war_economy_desc:0 "沉睡的工业网络已被全部唤醒。封存船坞重新点火，战略储备向前线开放，整个国家开始为一场决定银河命运的战争运转。"
 foc_sw_fe_infrastructure_heir_core:0 "远古基建继承"
 foc_sw_fe_infrastructure_heir_core_desc:0 "作为剧情指定的继承者，本国仍能操作两大堕落帝国留下的远古生产设施，并保留其战略储备容量与舰队维护体系。"
 building_foc_sw_fe_support_complex:0 "远古综合支援中心"
 building_foc_sw_fe_support_complex_desc:0 "一座高度自动化的综合设施，将重工业、营养供给、科研与后勤压缩进同一座坚固建筑，使建筑槽位有限的世界也能维持完整的远古经济体系。"
