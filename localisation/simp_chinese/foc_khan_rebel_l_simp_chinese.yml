l_simp_chinese:
 FOC_KHAN_REBEL_ALLIANCE:0 "反抗军同盟"
 FOC_KHAN_REBEL_SPECIES:0 "人类"
 FOC_KHAN_REBEL_SPECIES_PLURAL:0 "人类"
 FOC_KHAN_REBEL_FLEET:0 "反抗军远征舰队"
 foc_khan_rebel.10.name:0 "反抗的火种"
 foc_khan_rebel.10.desc:0 "第一秩序危机已经席卷银河，但反抗并未终结。一个新的反抗军同盟在贾库附近的迪卡星系建立了秘密基地，并准备在战局变化时转移至克瑞特与阿占克洛。加入后，我们将立即脱离附庸关系，与反抗军共同对抗第一秩序和最终秩序。反抗军承诺对其他国家保持中立。"
 foc_khan_rebel.10.a:0 "加入反抗军同盟。"
 foc_khan_rebel.10.b:0 "继续效忠秩序。"
 foc_khan_rebel.42.name:0 "迪卡战役"
 foc_khan_rebel.42.desc:0 "迪卡星系的防线已经被突破。敌军穿过外围小行星带，摧毁了轨道防御并迫使反抗军放弃森林中的地下机库。大部分幸存者已在最后一刻完成撤离，正准备在弑星者基地的威胁解除后转移至克瑞特。反抗并未在迪卡终结。"
 foc_khan_rebel.42.a:0 "他们必须继续战斗。"
