l_simp_chinese:
 foc_phase1_fleet_archive_edict:0 "舰队档案与封存令"
 foc_phase1_fleet_archive_edict_desc:0 "管理横跨共和国、帝国、义军与第一秩序时代的主力舰生产线。封存不会删除科技，也不会摧毁任何现役舰艇，只停止该舰型的新订单。"

 foc_phase1.40.name:0 "时代舰型档案"
 foc_phase1.40.desc:0 "战争持续了数十年，曾经代表一个时代的主力舰最终都会从标准生产体系转入战略储备。§Y封存只影响新建造§!：科技、设计知识和现役舰艇全部保留。\n\n当前可管理的历史生产线包括共和国§Y猎兵级§!、银河帝国§Y帝国级§!、义军§YMC80§!以及第一秩序§Y复兴级§!。"
 foc_phase1.40.venator_retire:0 "封存猎兵级生产线。"
 foc_phase1.40.venator_restore:0 "重新启封猎兵级生产线。"
 foc_phase1.40.imperial_retire:0 "封存帝国级生产线。"
 foc_phase1.40.imperial_restore:0 "重新启封帝国级生产线。"
 foc_phase1.40.mc80_retire:0 "封存 MC80 生产线。"
 foc_phase1.40.mc80_restore:0 "重新启封 MC80 生产线。"
 foc_phase1.40.resurgent_retire:0 "封存复兴级生产线。"
 foc_phase1.40.resurgent_restore:0 "重新启封复兴级生产线。"
 foc_phase1.41.name:0 "旧舰与新时代"
 foc_phase1.41.desc:0 "政权更替之后，旧舰并不会一夜消失。很多舰艇会在地方舰队、预备役和边境驻军继续服役数十年，但维持全部旧生产线同样会消耗造船厂与维护体系。现在可以把不再需要量产的舰型转入历史储备。"

 foc_phase1_archive_republic_line:0 "封存：共和国主力舰生产线"
 foc_phase1_archive_republic_line_desc:0 "猎兵级的标准生产体系已转为历史储备。"
 foc_phase1_archive_imperial_line:0 "封存：帝国主力舰生产线"
 foc_phase1_archive_imperial_line_desc:0 "帝国级的标准生产体系已转为历史储备。"
 foc_phase1_archive_rebel_line:0 "封存：义军主力舰生产线"
 foc_phase1_archive_rebel_line_desc:0 "MC80 的大规模生产体系已转为历史储备。"
 foc_phase1_archive_first_order_line:0 "封存：第一秩序主力舰生产线"
 foc_phase1_archive_first_order_line_desc:0 "复兴级的标准生产体系已转为历史储备。"

 foc_phase1_rebel_route_network_1:0 "义军走私网络：区域级"
 foc_phase1_rebel_route_network_1_desc:0 "义军控制当前39个主要航道星系中的至少10个，地下运输网络已达到区域级规模。"
 foc_phase1_rebel_route_network_2:0 "义军走私网络：跨区级"
 foc_phase1_rebel_route_network_2_desc:0 "义军控制当前39个主要航道星系中的至少20个，多个主要航道已经能组成跨区地下供应链。"
 foc_phase1_rebel_route_network_3:0 "义军走私网络：银河级"
 foc_phase1_rebel_route_network_3_desc:0 "义军控制当前39个主要航道星系中的至少30个，秘密物流网络已经覆盖银河主要交通骨架。"
 foc_phase1_imperial_route_network_1:0 "帝国航路控制：区域级"
 foc_phase1_imperial_route_network_1_desc:0 "帝国控制当前39个主要航道星系中的至少10个，仍能维持区域级航路调度。"
 foc_phase1_imperial_route_network_2:0 "帝国航路控制：跨区级"
 foc_phase1_imperial_route_network_2_desc:0 "帝国控制当前39个主要航道星系中的至少20个，可跨多个星区稳定调度舰队与物资。"
 foc_phase1_imperial_route_network_3:0 "帝国航路控制：银河级"
 foc_phase1_imperial_route_network_3_desc:0 "帝国控制当前39个主要航道星系中的至少30个，银河主要交通骨架仍处于高度统一控制下。"

 foc_phase1_ossus_jedi_archive_site:0 "奥苏斯：沉默的绝地档案"
 foc_phase1_ossus_jedi_archive_site_intro:0 "66号令以后，奥苏斯的绝地遗迹被系统性封锁和掠夺。但深埋在旧圣殿地下的部分档案没有进入帝国清单。"
 foc_phase1_arch.10.name:0 "没有名字的学徒"
 foc_phase1_arch.10.desc:0 "第一层档案并非大师的训诫，而是大量普通学徒的练习记录、失败报告与任务笔记。共和国最后几十年的绝地生活，在这些细碎记录中比任何英雄传说都更加真实。"
 foc_phase1_arch.11.name:0 "战争中的教团"
 foc_phase1_arch.11.desc:0 "克隆战争时期的内部报告显示，越来越多绝地已经意识到教团正在被战争重塑。档案没有提供一个简单答案，只留下大量互相矛盾的警告。"
 foc_phase1_arch.12.name:0 "封锁前的最后传输"
 foc_phase1_arch.12.desc:0 "圣殿陷落后的短暂时间里，有人把部分训练资料和历史记录转移到了奥苏斯。发送者没有留下姓名，也没有试图建立新的绝地名单。"
 foc_phase1_arch.13.name:0 "奥苏斯遗存"
 foc_phase1_arch.13.desc:0 "最终密库没有保存能够重建旧绝地委员会的权威，而是一套故意去中心化的知识档案：如何学习、如何怀疑、如何在教团不存在时仍对自己的力量负责。"
 foc_phase1_arch.13.a:0 "保存这份没有主人的绝地遗产。"
 r_foc_ossus_jedi_archive:0 "奥苏斯绝地档案"
 r_foc_ossus_jedi_archive_desc:0 "一套从共和国末期幸存下来的分散式绝地知识档案。它没有新委员会的名单，也没有要求后来者复制旧教团。"
 foc_phase1_ossus_relic_triumph:0 "奥苏斯档案研习"
 foc_phase1_ossus_relic_triumph_desc:0 "被整理后的奥苏斯资料正在用于领袖训练与原力研究。"

 foc_phase1_mandalore_clan_vault_site:0 "曼达洛：氏族密库"
 foc_phase1_mandalore_clan_vault_site_intro:0 "千泪之夜、帝国占领和吉迪恩的秘密基地摧毁了地表城市，却没能烧掉所有氏族记忆。重建中的探测队在废墟下发现了一座没有出现在帝国档案中的密库。"
 foc_phase1_arch.20.name:0 "封死的贝斯卡门"
 foc_phase1_arch.20.desc:0 "入口不是为外敌设计的，而是为了在曼达洛人自己陷入内战时保护内部资料。门后的记录跨越多个彼此敌对的氏族。"
 foc_phase1_arch.21.name:0 "不是一把剑的历史"
 foc_phase1_arch.21.desc:0 "密库里保存着大量关于统治合法性的争论。暗剑只是其中一个象征；氏族盟约、收养、救援、复仇与共同作战同样决定谁有资格被称为曼达洛人。"
 foc_phase1_arch.22.name:0 "散落银河的氏族"
 foc_phase1_arch.22.desc:0 "千泪之夜之后，幸存者在数十个世界留下加密记录。它们拼成了一张流亡网络，解释了为什么帝国摧毁一颗星球仍没能消灭曼达洛。"
 foc_phase1_arch.23.name:0 "新的氏族法典"
 foc_phase1_arch.23.desc:0 "密库最后留下的不是旧王座继承规则，而是一套能让分散氏族重新建立共同政治身份的档案。暗剑已经毁灭，但曼达洛的合法性不必跟着一起消失。"
 foc_phase1_arch.23.a:0 "让氏族记忆成为新曼达洛的根基。"
 r_foc_mandalore_clan_codex:0 "曼达洛氏族法典"
 r_foc_mandalore_clan_codex_desc:0 "由多个时代、多个氏族共同留下的身份、盟约与战争档案。它证明曼达洛人的延续从来不依赖单一统治者或单一武器。"
 foc_phase1_mandalore_relic_triumph:0 "氏族总动员"
 foc_phase1_mandalore_relic_triumph_desc:0 "氏族法典被用于重新组织舰队、地面部队和流亡者网络。"

 fop_origin.65.desc.2:0 "§Y阶段 II——战区统合§!\n第一个臣服国已经成为第一秩序战争机器的一部分。\n\n§E下一目标：§!积累至少§Y1200§!点野望、控制至少三个附庸，并完成对新共和国政治中心的斩首——摧毁霍斯尼亚、吞并新共和国，或令新共和国不复存在。"
 fop_origin.65.desc.3:0 "§Y阶段 III——支配轴心§!\n新共和国的旧秩序已经被击穿，恐惧与臣服开始转化为真正的银河统治结构。\n\n§E下一目标：§!积累至少§Y3000§!点野望，并同时控制§Y科洛桑、夸特和贾库§!。"
 fop_origin.65.desc.4:0 "§Y阶段 IV——银河统治权§!\n第一秩序已经掌握旧共和国的政治核心、造船命脉和帝国战争终点。\n\n§E最终现实目标：§!将野望提高到§Y5000§!点并令银河诸国全部臣服或灭亡，之后才可启动§Y奴役原力§!。"
 fop_ambition.2.desc:0 "§Y阶段 I——弑星之火§!\n完成弑星者基地，以超级武器正式跨过帝国残余与银河天灾之间的界线。\n\n§Y阶段 II——战区统合§!\n建立第一条臣服链，并摧毁或吞并新共和国的政治核心。\n\n§Y阶段 III——支配轴心§!\n控制科洛桑、夸特、贾库三大象征：政治中心、造船命脉、帝国战争终点。\n\n§Y阶段 IV——银河统治权§!\n达到5000野望并使全部独立强权臣服，才可开始奴役原力。\n\n§Y阶段 V——虚境升神§!\n入侵原力之海、摧毁虚境化身，并完成最终升格。"
 fop_ambition_stage_3_locked_tt:0 "需要至少三个附庸，并完成对新共和国政治中心的斩首。"
 fop_ambition_stage_3_active_tt:0 "§G已完成：§!新共和国秩序已经崩解，支配网络正式成形。"
 fop_ambition_stage_4_locked_tt:0 "需要3000野望，并同时控制科洛桑、夸特与贾库。"
 fop_ambition_stage_4_active_tt:0 "§G已完成：§!第一秩序已经控制银河战略轴心；继续统治全银河以开启奴役原力。"
