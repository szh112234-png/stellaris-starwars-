l_simp_chinese:
 NAME_FOC_JEDHA_EXTREMIST_REBELS:0 "杰达极端义军"
 foc_jedha_choice.name:0 "杰达：极端义军活动"
 foc_jedha_choice.desc:0 "§H死星一号建造完成，已经投入服役。§!\n\n帝国情报部门报告，索·格雷拉领导的极端义军正在§H杰达§!活动。他们袭击凯伯水晶运输队、破坏矿区，并试图夺取整个星系。\n\n死星的超级激光足以彻底摧毁杰达，让反抗者与这颗富含凯伯水晶的世界一同消失；如果帝国选择放任不管，当地驻军将撤离，义军将接管杰达星系。\n\n最终命令由您下达。"
 foc_jedha_choice.destroy:0 "用死星摧毁杰达。"
 foc_jedha_choice.destroy.tt:0 "§R杰达将变为破碎星球，失去全部人口、殖民地和凯伯水晶修正。§!\n随后触发§H塔金主义§!事件。"
 foc_jedha_choice.ignore:0 "放任不管。"
 foc_jedha_choice.ignore.tt:0 "§Y义军将占领整个杰达星系。§!杰达及其凯伯水晶得以保留。\n§R本局游戏此后永远不会触发塔金主义事件。§!"
 foc_jedha_choice.rebel.name:0 "杰达的命运"
 foc_jedha_choice.rebel_destroyed.desc:0 "帝国已经对杰达开火。死星的超级激光撕裂了整颗星球，圣城、矿区和地表居民全部被吞没，只剩下漂浮的行星碎片。\n\n杰达的凯伯水晶产出已经消失。幸存于星外的义军带回了毁灭的影像：帝国的新武器拥有摧毁世界的力量，而帝国已经决定使用它。"
 foc_jedha_choice.rebel_spared.desc:0 "尽管死星已经服役，帝国仍决定不干预杰达的武装活动。当地驻军撤离后，义军接管了星基、殖民地和整个星系。\n\n杰达的圣城与凯伯水晶矿区得以保留。来自沙漠的抵抗组织向义军开放了基地和补给线，而帝国没有借杰达推行塔金主义。"
 foc_jedha_choice.rebel.a:0 "把消息传给同盟。"
 foc_jedha_choice.bodhi_spared.desc:0 "帝国货运飞行员菩提·鲁克抵达了义军控制的杰达。他带来了盖伦·厄索的秘密口信：死星已经完工，但其反应堆设计中藏着一个致命缺陷。\n\n杰达没有遭到摧毁，索·格雷拉的武装得以将这名飞行员和口信一同交给义军。我们需要找到盖伦留下的完整证据。"
 foc_jedha_choice.tarkin.desc:0 "杰达已经成为一颗破碎星球。死星完成了第一次真正的毁灭行动，连同圣城与凯伯矿区一起消失的，还有银河各地对这件武器的怀疑。\n\n塔金总督据此向皇帝提交了一份备忘录：§H通过对武力的恐惧统治，而不是通过武力本身§!。杰达的命运将被传遍帝国，让每一个星系明白公开反抗的代价。\n\n塔金主义将把这次毁灭转化为帝国长期维持秩序的手段。"
