 foc_v135_treaty.1.name:0 "军事裁减法案"
 foc_v135_treaty.1.desc:0 "银河条约结束了持续多年的全面战争。随着帝国主力体系瓦解、共和国重新建立，参议院中的和平派迅速取得了压倒性优势。大量议员认为，维持战争时期的庞大造舰体系既昂贵又危险，并可能让新共和国重蹈旧共和国军事化的覆辙。\n\n《军事裁减法案》因此正式通过。各大国营与军用船坞被要求大幅削减订单、封存生产线并转向民用重建。§Y新共和国的造舰速度降低90%。§!\n\n莱娅·奥加纳所领导的独立义军与后续抵抗力量不受该法案约束。"
 foc_v135_treaty.1.a:0 "战争已经结束了。"
 foc_v135_new_republic_military_reduction_act:0 "军事裁减法案"
 foc_v135_new_republic_military_reduction_act_desc:0 "银河条约后的新共和国大规模裁撤军用造舰体系，船坞生产效率仅维持战争时期的一小部分。"
