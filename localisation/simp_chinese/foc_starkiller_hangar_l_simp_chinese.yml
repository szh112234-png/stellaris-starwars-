l_simp_chinese:
 starbase_level_foc_starkiller_ring:0 "弑星者防御环"
 starbase_level_foc_starkiller_ring_desc:0 "弑星者基地的轨道防御环，容纳基地的 TIE 机库群。"
 foc_starkiller_hangar_bay:0 "弑星者机库群"
 foc_starkiller_hangar_bay_desc:0 "深入行星地壳的大型 TIE 机库综合体，每座可部署 8 个 TIE 中队。弑星者基地是第一秩序已知规模最大的军事部署地。"
 FOC_STARKILLER_TIE:0 "TIE/fo 中队（弑星者空防部队）"
 FOC_STARKILLER_TIE_desc:0 "驻防弑星者基地的第一秩序 TIE/fo 太空优势战斗机中队。"
 FOC_STARKILLER_TIE_SET:0 "TIE/fo 中队（弑星者空防部队）"
 foc_starkiller_base_world:0 "弑星者基地驻防"
 foc_starkiller_base_world_desc:0 "整颗行星已被改造为要塞：庞大的常备守军深植于地壳之下，并对轨道轰炸有极强的抗性。基地的热能振荡器与相位能量设施同时使这里成为第一秩序首屈一指的工程研究场所。"
 foc_starkiller_ring:0 "弑星者防御环"
 foc_starkiller_defense_grid:0 "行星防御网格"
 foc_starkiller_defense_grid_desc:0 "覆盖基地地表的重型护盾与炮群阵列，大幅强化防御环的结构、装甲与护盾，并扩充防御平台容量。"
 foc_starkiller_shipyard:0 "弑星者船坞"
 foc_starkiller_shipyard_desc:0 "基地轨道上的重型舰船装配设施，可直接在弑星者基地建造与维修舰队。"
 foc_starkiller_ring_plural:0 "弑星者防御环"
