l_simp_chinese:
 FOC_V212_RADDUS_NAME:0 "拉杜斯上将"
 FOC_SAGA_MON_MOTHMA_NAME:0 "蒙·莫斯马"

 foc_v212_story.3.name:0 "塔图因：新的希望"
 foc_v212_story.3.desc:0 "银河内战的第十九年已经到来；若帝国更早建成§H死星一号§!，这个时刻便会提前。\n\n§H卢克·天行者§!离开塔图因，接受欧比旺留下的教导，开始认识绝地与原力。他加入由蒙·莫斯马领导的§H帝国反抗军§!，踏上自己的战争历程。\n\n欧比旺与维达的最后对决将在营救莱雅的行动中展开；此后，他仍会以绝地英灵的身份指引卢克。"
 foc_v212_story.3.a:0 "绝地的火种重新燃起。"

 foc_v212_story.4.name:0 "十年抗争：莱雅加入义军"
 foc_v212_story.4.desc:0 "银河内战爆发已满十年。莱雅·奥加纳正式加入义军，作为传奇领袖投身政治组织与反抗事业。蒙·莫斯马继续担任义军领袖。\n\n§Y本次加入不发放死星特攻或护盾增伤。两项增益仍须等待斯卡里夫之后的莱雅获救事件。§!"
 foc_v212_story.4.a:0 "为了银河的自由。"
 foc_v212_story.23.name:0 "拉杜斯号舰桥遇袭"
 foc_v212_story.23.desc:0 "§H拉杜斯号§!第一次与第一秩序舰队进入同一战区时，凯洛·伦亲自率领战机穿过防空火力。他没有摧毁这艘旗舰，而是把攻击集中在舰桥。\n\n爆炸撕开了指挥中心，舰桥人员被抛入太空。§H阿克巴上将当场阵亡。§!拉杜斯号本身仍然幸存，但抵抗组织失去了一位从克隆人战争时代一路奋战至今的最高级将领。\n\n这次袭击只会发生一次；之后拉杜斯号与至尊号之间原有的遭遇及撞击剧情仍可继续。"
 foc_v212_story.23.a:0 "愿原力与他同在。"

 foc_canon.23.name:0 "莱雅获救，欧比旺牺牲"
 foc_canon.23.desc:0 "斯卡里夫传出的希望终于抵达了营救队手中。卢克与同伴闯入帝国的拘押设施，救出了§H莱雅·奥加纳§!。撤离途中，§H欧比旺·克诺比§!独自迎战达斯·维达，为他们争取最后的逃生时间。\n\n欧比旺牺牲了。他离开现役指挥岗位，却以绝地英灵的身份继续在原力中引导卢克。\n\n确认行动结果后，莱雅携带的完整图纸送达义军指挥部：义军获得§H对护盾伤害 +50%§!，与死星一号同处一个星系时启用攻击解算。莱雅正式加入指挥体系仍遵循她自己的战时历程，蒙·莫斯马继续领导义军。"
 foc_canon.34.desc:0 "逃离斯卡里夫的图纸仍在辗转传递，莱雅已落入帝国手中。塔金将死星一号的超级激光瞄准§H奥德朗§!，试图用她的家园换取义军基地的位置。\n\n只要这座战斗空间站仍能开火，下一道命令便会让整颗星球毁灭。义军必须救出莱雅，将完整情报带回，才能完成对死星的攻击解算。"
 foc_rogue_one.14.desc:0 "斯卡里夫的护盾大门已被突破。地面小队在档案塔中找到代号§H星尘§!的完整图纸，并将数据传向轨道上的义军旗舰。\n\n§H拉杜斯上将§!驾驶深奥号坚守传输窗口，最终与旗舰一同毁于帝国炮火。侠盗一号地面小队再无回音，但图纸已经离开星球。\n\n义军尚未完成情报分析。至少一个月后，若战役发生时已建成的死星一号仍然存在，它将抵达斯卡里夫；此后的追击与营救将决定这些牺牲是否换来希望。"
 foc_canon.44.desc:0 "帝国已经失去§H斯卡里夫§!星系的完整控制权。义军突击队成功把死星蓝图送出档案设施，轨道封锁也被突破。\n\n为了守住传输窗口，拉杜斯上将率领旗舰与帝国舰队正面交战，并最终与舰桥人员一同阵亡。§H拉杜斯上将死于斯卡里夫战役。§!\n\n这是一场代价惨重的胜利，但蓝图已经送出。"

 foc_canon.45.desc:0 "§H死星一号已被摧毁。§!巨大空间站的毁灭被记录为雅文战役的胜利。\n\n§H威尔霍夫·塔金总督§!拒绝撤离，最终与战斗空间站一同死亡。帝国失去了它赖以震慑银河的武器，而义军为这场胜利付出了沉重代价。"
 foc_luke.10.desc:0 "死星一号爆炸时，义军战术屏幕上只剩下少数战机。最后一次攻击跑道由§H卢克·天行者§!完成——他早已在欧比旺的训练后加入帝国叛军。\n\n卢克关闭瞄准计算机，依靠原力把质子鱼雷送进两米宽的排气口。韩·索罗驾驶千年隼号突然切入，打乱维达的攻击；数秒后，主反应堆被引爆。\n\n欧比旺没有从死星中归来，但他的声音仍通过原力传到卢克耳边。塔金则与死星一同毁灭。\n\n这场胜利证明了帝国可以被击败。"
