 foc_republic_origin.181.name:0 "塔金计划"
 foc_republic_origin.181.desc:0 "死星终于从图纸、预算争论和无数秘密船坞中走进了现实。它不再是一项武器工程，而是一种新的统治方式。\n\n威尔赫夫·塔金将自己的方案呈到皇帝面前：帝国不必在每一颗反抗的星球上打一场战争。只要银河相信某一次反抗可能换来整个世界的毁灭，恐惧本身就会替舰队维持秩序。\n\n第一场示范已经选好了目标——杰达。"
 foc_republic_origin.181.a:0 "批准塔金计划。"
 foc_v109_tarkin_jedha_fear:0 "塔金主义：恐惧维持秩序"
 foc_v109_tarkin_jedha_fear_desc:0 "杰达化为灰烬之后，银河终于明白死星并不是一项无法兑现的威胁。许多世界选择了沉默——至少在第二颗死星陨落之前。"
 NAME_FOC_V109_SCARIF_DEFENSE_FLEET:0 "斯卡里夫轨道防御舰队"
