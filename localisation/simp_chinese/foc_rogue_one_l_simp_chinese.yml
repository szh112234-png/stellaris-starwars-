l_simp_chinese:
 foc_rogue_one.1.name:0 "杰达：第一次试射"
 foc_rogue_one.1.desc:0 "§H死星一号已经具备实战能力。§!\n\n奥森·克伦尼克主管要求用一次受控的低功率射击向皇帝证明‘星尘计划’已经成功。目标被选在§H杰达§!——帝国多年来从那里开采凯伯水晶，索·格雷拉的武装也在那里活动。\n\n超级激光只启用了一部分反应堆。即便如此，圣城仍在数秒内消失，冲击波把地表掀成一圈不断扩大的火海。\n\n塔金总督看完记录后没有祝贺克伦尼克。他只问了一句：这座空间站什么时候可以归帝国舰队直接指挥？"
 foc_rogue_one.1.a:0 "威慑已经有了形状。"
 foc_rogue_one.2.name:0 "盖伦·厄索的背叛"
 foc_rogue_one.2.desc:0 "安全局截获了一份来自杰达的残缺情报。一个名叫§H博迪·鲁克§!的帝国货运飞行员失踪了；他最后一次任务与死星首席能源工程师§H盖伦·厄索§!有关。\n\n更糟的是，克伦尼克已经确认厄索在反应堆设计中留下了未经批准的结构。它被藏在数百万页工程图里，平时看不出异常，但如果完整档案落入懂得寻找它的人手中，这座战斗空间站可能并不像宣传里那样无懈可击。\n\n真正完整的设计档案只有一个地方还有备份：§H斯卡里夫§!。"
 foc_rogue_one.2.a:0 "封锁斯卡里夫档案库。"
 foc_rogue_one.3.name:0 "克伦尼克与塔金"
 foc_rogue_one.3.desc:0 "克伦尼克赶回死星要求保留项目指挥权。塔金没有与他争论技术贡献，只把一份皇帝办公室签署的命令放在桌面上。\n\n从这一刻开始，死星被正式编入帝国战略指挥体系。克伦尼克仍然负责工程问题，但空间站本身由§H威尔霍夫·塔金§!控制。\n\n克伦尼克离开舰桥时，只剩一个地方还能证明这座武器是他的作品：斯卡里夫那座装满原始设计记录的档案塔。"
 foc_rogue_one.3.a:0 "死星属于帝国，不属于某个工程主管。"
 foc_rogue_one.4.name:0 "斯卡里夫告急"
 foc_rogue_one.4.desc:0 "斯卡里夫档案库遭到突破，完整的死星图纸已经越过护盾大门传出。守军未能截断最后的数据链路，地面小队与轨道上的义军旗舰却付出了生命的代价。\n\n帝国指挥部准备命令§H达斯·维达§!追击携带图纸的信使。失去的情报必须追回，叛军不能获得解析它的时间。"
 foc_rogue_one.4.a:0 "不惜一切代价追回那些图纸。"
 foc_rogue_one.5.name:0 "追击中的维达"
 foc_rogue_one.5.desc:0 "维达率军登舰，沿着狭窄的通道逼近数据载体。守军将图纸逐手传递，终于送上撤离的护卫舰。\n\n追击随即锁定了§H莱雅·奥加纳§!。她与护卫舰落入帝国控制，但图纸的去向仍未查明；塔金准备以奥德朗迫使她交代义军的位置。"
 foc_rogue_one.5.a:0 "找到那艘护卫舰。"
 foc_rogue_one.10.name:0 "来自杰达的帝国飞行员"
 foc_rogue_one.10.desc:0 "杰达毁灭后的混乱中，索·格雷拉的人送来了一个意外的俘虏。§H博迪·鲁克§!原本是帝国货运飞行员，负责给秘密工程设施运送物资。\n\n他没有要求庇护，也没有开价。他反复说同一件事：自己受一个叫§H盖伦·厄索§!的人委托，必须把一段信息交给义军。\n\n厄索正是帝国那座行星杀手的主要工程师之一。"
 foc_rogue_one.10.a:0 "听听他带来了什么。"
 foc_rogue_one.11.name:0 "盖伦·厄索的留言"
 foc_rogue_one.11.desc:0 "残缺的全息影像终于被修复。盖伦·厄索承认自己参与了死星工程，但也说明了为什么。\n\n他无法阻止帝国建成这件武器，于是选择让它从内部就带着一个致命错误：一条看似普通的反应堆排热结构，能够把一次精确命中直接传导到主反应堆。\n\n但留言没有完整图纸。厄索只留下了档案代号——§H星尘§!——以及储存设计总档案的地点：§H斯卡里夫§!。"
 foc_rogue_one.11.a:0 "先找到厄索本人。"
 foc_rogue_one.12.name:0 "伊杜"
 foc_rogue_one.12.desc:0 "情报把我们带到§H伊杜§!的一处帝国研究设施。盖伦·厄索就在这里，与一批被迫为死星工作的工程师关在一起。\n\n行动开始前，高层已经授权一次空袭，目标是彻底摧毁这座设施。地面小队赶到了厄索身边，却来不及让轰炸机返航。\n\n厄索死在女儿面前。临死前他只确认了一件事：真正能证明弱点存在的完整图纸仍在斯卡里夫。"
 foc_rogue_one.12.a:0 "那就去斯卡里夫。"
 foc_rogue_one.13.name:0 "侠盗一号"
 foc_rogue_one.13.desc:0 "义军议会没有批准进攻斯卡里夫。情报不完整，帝国舰队占据绝对优势，而把整个同盟押在一个未经证实的工程弱点上，看起来更像赌博而不是战略。\n\n会议结束后，§H琴·厄索§!、§H卡西安·安多§!、博迪·鲁克与一批志愿者没有返回驻地。他们夺取了一艘运输机，在起飞许可里报出了一个临时呼号：§H侠盗一号§!。\n\n几分钟后，一些原本奉命留守的义军舰长开始自行离港。"
 foc_rogue_one.13.a:0 "他们需要一支舰队。"
 foc_rogue_one.14.name:0 "斯卡里夫战役"
 foc_rogue_one.14.desc:0 "斯卡里夫的护盾大门已被突破。地面小队在档案塔中找到代号§H星尘§!的完整图纸，并将数据传向轨道上的义军旗舰。\n\n§H拉杜斯上将§!驾驶深奥号坚守传输窗口，最终与旗舰一同毁于帝国炮火。侠盗一号地面小队再无回音，但图纸已经离开星球。\n\n义军尚未完成情报分析。至少一个月后，若战役发生时已建成的死星一号仍然存在，它将抵达斯卡里夫；此后的追击与营救将决定这些牺牲是否换来希望。"
 foc_rogue_one.14.a:0 "他们完成了任务。"
 foc_rogue_one.15.name:0 "希望"
 foc_rogue_one.15.desc:0 "追兵逼近时，最后的守军把数据载体交上了一艘外交护卫舰。舰桥上的§H莱雅·奥加纳§!接过图纸，命令舰船尽快前往义军基地。\n\n帝国的追击尚未结束，完整图纸也还没有送到分析人员手中。莱雅与护卫舰很快落入维达的控制，营救她成为义军下一步行动的关键。"
 foc_rogue_one.15.a:0 "把图纸送到雅汶。"
 foc_rogue_one_scarif_assault:0 "侠盗一号：斯卡里夫突袭"
 foc_rogue_one_scarif_assault_desc:0 "志愿舰队正在为斯卡里夫地面小队争取时间：舰船速度+15%，射速+10%，追踪+5。夺取斯卡里夫后该修正立即移除。"
 foc_rogue_one_vader_pursuit:0 "维达的追击"
 foc_rogue_one_vader_pursuit_desc:0 "斯卡里夫档案泄露后，帝国舰队进入短期最高追击状态：舰船速度+10%，射速+10%，武器伤害+10%。"

 foc_rogue_one.16.name:0 "死星浮现"
 foc_rogue_one.16.desc:0 "斯卡里夫战役已经过去至少一个月。战斗空间站的庞大轮廓从超空间中出现，§H死星一号§!抵达了斯卡里夫。\n\n幸存者面对的已不只是传闻中的秘密武器。携带图纸的信使必须继续逃离追击，将这个庞然大物的弱点带到能够利用它的人手中。"
 foc_rogue_one.16.a:0 "死星来了。"
