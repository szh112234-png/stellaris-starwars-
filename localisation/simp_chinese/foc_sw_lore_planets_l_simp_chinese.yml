l_simp_chinese:
 foc_lore_hosnian_senate_world:0 "新共和国议会驻地"
 foc_lore_hosnian_senate_world_desc:0 "霍斯尼亚主星是复兴共和国的政治心脏，来自银河各地的议员、行政人员与商贸活动汇聚于此。"
 foc_lore_hosnian_cosmopolitan_system:0 "霍斯尼亚都会网络"
 foc_lore_hosnian_cosmopolitan_system_desc:0 "霍斯尼亚星系的居民世界以密集航路、民用设施和都会服务支撑着共和国首都。"
 foc_lore_coruscant_galactic_metropolis:0 "银河都会"
 foc_lore_coruscant_galactic_metropolis_desc:0 "这颗覆盖全球的城市星球曾长期作为银河首都，以惊人规模集中着政府、档案、学府与贸易。"
 foc_lore_core_world_support_network:0 "核心世界支援网络"
 foc_lore_core_world_support_network_desc:0 "这些高度开发的核心世界依靠成熟物流、制造业与公共机构满足科洛桑的庞大需求。"
 foc_lore_kuat_orbital_shipbuilding:0 "夸特轨道造船业"
 foc_lore_kuat_orbital_shipbuilding_desc:0 "环绕夸特的庞大船坞把精炼合金和先进工程技术转化为成批的主力舰。"
 foc_lore_chandrila_republican_traditions:0 "千瑞拉共和传统"
 foc_lore_chandrila_republican_traditions_desc:0 "千瑞拉的公民文化、开阔风景与悠久共和传统维系着稳定而繁荣的社会。"
 foc_lore_akiva_droid_foundries:0 "阿基瓦机器人铸造厂"
 foc_lore_akiva_droid_foundries_desc:0 "被遗忘的地下工厂与回收的分离主义机械，使阿基瓦成为出人意料的工业考古中心。"
 foc_lore_corellia_massive_shipyards:0 "科雷利亚巨型船厂"
 foc_lore_corellia_massive_shipyards_desc:0 "科雷利亚的庞大船厂与工程企业以坚固船体、高速生产和大胆设计闻名银河。"
 foc_lore_naboo_harmonious_civilization:0 "纳布—冈根共生文明"
 foc_lore_naboo_harmonious_civilization_desc:0 "田园般的纳布人与水下冈根文明共享一颗盛产食物、艺术和公民传统的丰饶世界。"
 foc_lore_kashyyyk_wroshyr_world:0 "伍尔希尔森林世界"
 foc_lore_kashyyyk_wroshyr_world_desc:0 "卡希克的巨型伍尔希尔森林庇护着坚韧的伍基人聚落；他们对树冠层的了解令入侵异常困难。"
 foc_lore_mon_cala_starship_craft:0 "蒙卡拉舰船工艺"
 foc_lore_mon_cala_starship_craft_desc:0 "蒙卡拉船匠把海洋城市的传统融入优雅而强大的主力舰设计。"
 foc_lore_endor_living_forest:0 "恩多生命森林"
 foc_lore_endor_living_forest_desc:0 "茂密森林、本土生物与伊沃克聚落为守军提供掩护，使这颗卫星远比外表更加难以征服。"
 foc_lore_hoth_echo_base:0 "霍斯回音基地冰层工事"
 foc_lore_hoth_echo_base_desc:0 "冰川隧道和隐蔽的护盾设施在霍斯致命的冰冻地表下构成了易守难攻的避难所。"
 foc_lore_bespin_tibanna_industry:0 "贝斯平提班纳工业"
 foc_lore_bespin_tibanna_industry_desc:0 "云城依靠采集并精炼贝斯平上层大气中的珍贵提班纳气体而繁荣。"
 foc_lore_lothal_fields_and_temple:0 "洛塔农田与绝地圣殿"
 foc_lore_lothal_fields_and_temple_desc:0 "肥沃平原、矿产资源与古老绝地圣所，让洛塔兼具物质价值和深厚的原力意义。"
 foc_lore_bastion_imperial_fortress:0 "巴斯提恩帝国要塞"
 foc_lore_bastion_imperial_fortress_desc:0 "巴斯提恩是一颗围绕多层防御、严密行政和帝国残余机构建设的坚固指挥世界。"
 foc_lore_bilbringi_military_yards:0 "比尔布林吉军用船厂"
 foc_lore_bilbringi_military_yards_desc:0 "小行星资源与设防轨道设施使比尔布林吉成为帝国重型战舰的主要生产中心。"
 foc_lore_yaga_minor_ubiqtorate:0 "亚加-米诺帝国情报中枢"
 foc_lore_yaga_minor_ubiqtorate_desc:0 "军用工业与帝国情报机构把亚加-米诺塑造成受到严密控制的战略神经中枢。"
 foc_lore_rendili_stardrive:0 "伦迪利星际动力"
 foc_lore_rendili_stardrive_desc:0 "数百年的海军造舰传统为伦迪利留下了成熟的工程基础和经验丰富的大型战舰产业。"
 foc_lore_jakku_ship_graveyard:0 "贾库舰船坟场"
 foc_lore_jakku_ship_graveyard_desc:0 "一场决定性战役留下的残骸养活了拾荒者和打捞工程师，也让无法无天在沙丘间蔓延。"
 foc_lore_geonosis_droid_foundries:0 "吉奥诺西斯机器人铸造厂"
 foc_lore_geonosis_droid_foundries_desc:0 "蜂巢地下墓穴与掩埋的装配线能够大批量生产武器和战斗机器人。"
 foc_lore_kamino_cloning_centers:0 "卡米诺克隆中心"
 foc_lore_kamino_cloning_centers_desc:0 "常年遭受风暴的海上平台容纳着无与伦比的基因实验室和军事训练设施。"
 foc_lore_mustafar_mineral_world:0 "穆斯塔法矿业设施"
 foc_lore_mustafar_mineral_world_desc:0 "火山活动暴露出宝贵矿脉和地热能，但只有最极端的工业设施才能在这颗熔岩世界上存续。"
 foc_lore_nur_inquisitor_fortress:0 "审判官堡垒"
 foc_lore_nur_inquisitor_fortress_desc:0 "努尔海洋深处隐藏着一座装甲帝国要塞，兼具监狱、档案库和原力敏感者猎手总部的功能。"
 foc_lore_mandalore_beskar_warrior_clans:0 "贝斯卡与战士氏族"
 foc_lore_mandalore_beskar_warrior_clans_desc:0 "贝斯卡矿藏、先进甲匠与尚武氏族传统使曼达洛成为一颗令人畏惧的军事世界。"
 foc_lore_scarif_imperial_archive:0 "斯卡里夫帝国档案库"
 foc_lore_scarif_imperial_archive_desc:0 "一座设防的热带设施在行星防御体系后方保存着帝国最敏感的武器研究资料。"
 foc_lore_kessel_spice_coaxium_mines:0 "凯塞尔香料与同轴晶体矿井"
 foc_lore_kessel_spice_coaxium_mines_desc:0 "丰富的香料与同轴晶体矿藏催生出残酷的采掘经济，并由走私者、强迫劳动和有组织犯罪维系。"
 foc_lore_dathomir_nightsister_nexus:0 "暗夜姐妹魔法节点"
 foc_lore_dathomir_nightsister_nexus_desc:0 "古代遗迹、危险生物与暗夜姐妹的绿色魔法令达索米尔充斥着黑暗力量。"
 foc_lore_tatooine_hutt_spaceport:0 "塔图因赫特太空港"
 foc_lore_tatooine_hutt_spaceport_desc:0 "偏远港口把水分农场和矿产勘探者连接到由走私者、赏金猎人与赫特财团构成的暴利地下世界。"
 foc_lore_exegol_sith_eternal_sanctuary:0 "西斯永恒圣所"
 foc_lore_exegol_sith_eternal_sanctuary_desc:0 "埃克西戈隐藏在致命的超空间异常之后，其古老堡垒把西斯邪教徒、禁忌实验室和庞大地下防御连为一体。"
