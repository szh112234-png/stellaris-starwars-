l_simp_chinese:
 preset_fop_imperial_scion:0 "帝国遗产继承体系"
 preset_fop_imperial_scion_desc:0 "第一秩序在帝国残余的庇护下积蓄力量。旧帝国提供庇护与秘密航路，而年轻的继承者仍保留扩张与外交空间；当新的秩序足以取代旧时代时，这一关系也将走到终点。"
 fop_origin.11.name:0 "帝国遗产的继承者"
 fop_origin.11.desc:0 "来自巴斯提恩的密电使用着只有帝国最高统帅部才掌握的古老密码。帝国残余没有把伊冷上的新政权视为竞争者，而是把第一秩序认作延续帝国意志的下一代。老去的舰队为我们打开航路，并以先辈的身份庇护尚未成熟的新秩序。\n\n但所有人都明白：继承者终有一天会比先辈更强大。"
 foc_fallen_war.11.name:0 "天堂之战"
 foc_fallen_war.11.desc:0 "漫长的停战终于崩裂。新共和国的舰队越过边境，帝国残余也让沉睡多年的歼星舰重新点燃反应堆。旧战争留下的裂痕从未真正愈合，如今双方再次把整个银河拖入争夺帝国遗产的决战。"
 foc_khan_settings.15.desc:0 "选择§H当前起源路线的星战剧情§!何时开始。共和国起源会在所选年份开启共和国时代，并让后续历史按原有间隔推进；普通起源与第一秩序起源的天堂之战默认在剧情起点§H60年后§!爆发，因此选择2250、2300或2400也会把这场战争整体向后顺延。\n\n共和国路线在签署银河条约后采用独立计时：§H24年后§!爆发天堂之战；若战争持续§H5年§!仍未结束，第一秩序危机将获得一个额外触发机会，而原有危机触发条件继续保留。\n\n§Y2200为默认；2250、2300、2400分别延后50、100、200年。§!"
