l_simp_chinese:
 SSP_FIGHTER_GROUP_DESC:0 "§L这不是前线命令，而是一份决定整个战争尺度的最高级战备授权。§!\n\n选择当前开放研究的战机阵营。未选择且尚未研究的另外两个阵营科技与战机将完全隐藏；已研究完成的旧阵营战机永久保留。选择“全部战机”可同时开放三条科技路线。"
 SSP_IMPERIAL_TARGET_DESC:0 "§L全息作战沙盘展开，舰队编制、武器强度与战略规则都可以在这里重新校准。§!\n\n可选择距离当前舰队1—2条超空间航道的星系。"
 SSP_REBEL_TARGET_DESC:0 "§L战略模拟室已经准备完毕，参谋官正在等待你确认本局采用的战争规则。§!\n\n可选择距离当前舰队1—2条超空间航道的星系。"
 SSP_REPUBLIC_TARGET_DESC:0 "§L最高统帅部打开战术演算终端，所有参数都将直接改变接下来战争的节奏。§!\n\n可选择距离当前舰队1—2条超空间航道的星系。"
 SSP_SETTINGS_ROOT_DESC:0 "§L全息作战沙盘展开，舰队编制、武器强度与战略规则都可以在这里重新校准。§!\n\n请选择要调整的项目。默认强度为平衡档、模型为原版大小。开局需选择可研究的战机阵营；中后期可通过法令切换路线。已经研究完成的阵营科技和战机不会因切换而被清除或隐藏。"
 SSP_SIZE_DESC:0 "§L战略模拟室已经准备完毕，参谋官正在等待你确认本局采用的战争规则。§!\n\n只改变战机模型的视觉尺寸，不改变数量、碰撞和战斗属性。默认使用原版模型大小。"
 SSP_STRENGTH_EDICT_DESC:0 "§L这不是前线命令，而是一份决定整个战争尺度的最高级战备授权。§!\n\n战机强度现已锁定为主MOD难度映射，不能在此单独修改。"
 foc_balance.10.desc:0 "§L帝国统计部门送来的数字比任何前线战报都更令人不安：统治本身正在变成一场消耗战。§!\n\n内政部送来的报告越来越厚。外环的运输队失踪，工厂在夜里停摆，帝国徽记被人从行政大楼上拆下来。地方总督都在说同一件事：那些看得见歼星舰的世界最安静。\n\n舰队一旦离开，谣言、罢工与破坏行动就会重新出现；而当某颗星球公开倒向反抗军时，旧有的恐惧也随帝国旗帜一起消失。\n\n新秩序发现，统治银河不仅需要命令，还需要让人每天抬头都能看见执行命令的舰船。"
 foc_canon.31.desc:0 "§L时代的齿轮再次咬合，另一个注定被后世反复讲述的瞬间已经到来。§!\n\n第一秩序的工程部队彻底封锁伊冷。凯伯水晶矿脉被扩大成贯穿地壳的工业设施，整颗星球开始被改造成一件能够抽取恒星能量的超级武器。\n\n工程代号没有出现在任何公开档案里。如此规模的建设正在持续抽走第一秩序的合金与船坞产能，在基地完工前，常规舰队扩建将不得不为超级武器让路。后来银河会用另一个名字记住它：§H弑星者基地§!。"
 foc_canon.34.desc:0 "逃离斯卡里夫的图纸仍在辗转传递，莱雅已落入帝国手中。塔金将死星一号的超级激光瞄准§H奥德朗§!，试图用她的家园换取义军基地的位置。\n\n只要这座战斗空间站仍能开火，下一道命令便会让整颗星球毁灭。义军必须救出莱雅，将完整情报带回，才能完成对死星的攻击解算。"
 foc_canon.40.desc:0 "§L时代的齿轮再次咬合，另一个注定被后世反复讲述的瞬间已经到来。§!\n\n§H克里斯托夫西斯§!已经完全脱离邦联控制。年轻的阿索卡·塔诺在这场战役中被正式分配给阿纳金·天行者作为学徒。"
 foc_canon.53.desc:0 "§L一段曾经只存在于传说与档案中的历史，如今正在我们的星图上真实发生。§!\n\n义军同盟已经从分散的抵抗组织成长为公开反抗帝国的力量。一名曾经离开绝地武士团、又从66号令中幸存下来的老朋友重新出现在秘密通讯网络中。\n\n§H阿索卡·塔诺§!以代号“支点（Fulcrum）”加入义军。她不再代表绝地委员会，而是以自己的选择投入这场战争。\n\n§Y阿索卡作为真实指挥官加入义军领袖池。§!"
 foc_cis.10.desc:0 "邦联把舰队和战争工业分散到多个战区。"
 foc_cis.11.desc:0 "§L战争进入最残酷的阶段后，每一颗星球都可能在一夜之间成为银河命运的支点。§!\n\n邦联换了最高统帅。\n\n新上任的这一位不是政客，也不是财团代表，而是一台被改造过的战争机器：有机部件只剩下极少一部分，其余全是合金骨架与伺服机构。他咳嗽，因为那对肺是从原来的身体里保留下来的；他收藏光剑，因为那些光剑的原主人都是被他亲手杀掉的绝地。\n\n他上任之后，邦联的舰队第一次表现出真正的战术指挥：突击群开始有配合，主力舰队开始预判共和国的机动，而不是被动等待。"
 foc_cis.12.desc:0 "§L外环的超空间航道被战火切割成无数孤岛，而共和国只能一处一处夺回来。§!\n\n贸易联盟、银行业协会、技术联合会与采矿业公会在阿基瓦签署了联合声明：所有成员企业的“护航部队”即日起全部并入邦联舰队序列。\n\n这批船本来是用来护送货物、威慑地方政府、必要时封锁一两条航道的。它们数量惊人，因为过去二十年里议会一次也没有真正清点过。\n\n共和国当年在议会大厅里拒绝过一份提案，要求承认这些“护航部队”的合法地位。现在它们不再需要议会承认了。"
 foc_coldwar.2.desc:0 "§L炮火暂时沉寂，银河却没有迎来真正的和平。旧敌人只是隔着边界重新审视彼此。§!\n\n旧日的银河大战已经结束，但和平并没有真正到来。§H新共和国§!与§H帝国残余§!作为两个强大而自我封闭的§H堕落帝国§!隔着贾库与旧疆界彼此对峙。双方都拥有足以让普通国家退避的舰队，却都避免再次点燃全面战争。\n\n在公开航路之外，未知区域仍然吞没着大量帝国失踪舰队的去向。银河表面维持着和平，实际上已经进入一场漫长的冷战。"
 foc_cw.1.desc:0 "吉奥诺西斯危机迫使共和国启用克隆人大军。关闭本事件后，独立星系邦联正式建立，克隆人战争爆发。"
 foc_cw.2.desc:0 "§L军团频道里只剩简短的坐标、伤亡数字和命令，真正的代价要等战斗结束后才看得见。§!\n\n战线拉到了外环，而外环没有战线可言——只有一串互不相连的星系，每一个都要单独打。\n\n邦联把工厂修在地下，把舰队藏在小行星带里，把守军换成不需要补给的机器人。共和国这边则把绝地一个个派出去当将军：一个人带一个军团，一次派往一颗星球，从此音讯全无地打上几个月。\n\n参谋部现在必须选一种打法。"
 foc_cw.3.desc:0 "§L军团频道里只剩简短的坐标、伤亡数字和命令，真正的代价要等战斗结束后才看得见。§!\n\n科洛桑防线守住了。实际投入首都突袭的邦联舰队已经被全部消灭或赶出星系，共和国仍然控制首都。\n\n邦联舰队突然出现在共和国首都上空——不是为了占领，是为了绑走一个人。\n\n§H最高议长本人被劫上了旗舰。§!营救行动由两名绝地执行，而他们在舰桥上撞见的是§H杜库伯爵§!。\n\n杜库击昏了其中一个，与另一个交手，输了，双手被斩断。他跪在那里，等着被押走受审。\n\n然后议长开口了。他没有说要活的。\n\n那名年轻的绝地在犹豫了两秒之后照做了。事后议长安慰他：换作是我，也会这么做。\n\n西斯从不留两个学徒。老的那个死了，位置空了出来——而空出来的位置，年轻人自己心里清楚是留给谁的。\n\n§Y帕尔帕廷的阴谋推进 10 点。§!\n\n§Y科洛桑战役已完成；杜库真实死亡；本节点只记阴谋＋10。§!"
 foc_cw.4.desc:0 "§L绝地曾经调停战争，如今他们站在战舰舰桥上，亲自命令军团投入战争。§!\n\n邦联已经完全失去§H乌塔帕§!星系控制权。最高统帅部的位置最终被锁定在这颗一颗满是竖井的干旱星球，机器人军团就藏在井壁的城市里。\n\n共和国单派了一名绝地先行侦察。他骑着一头本地驮兽从竖井边缘一路冲下去，在停机坪上截住了正要登舰逃跑的§H格里弗斯将军§!。\n\n四把光剑对一把。最后结束这件事的不是光剑，是一把从死掉的卫兵身上捡来的爆能枪，两枪打进那对有机肺叶。\n\n将军倒下的时候，全银河的战斗机器人还在正常运转。但发出命令的那颗脑袋没有了。\n\n§Y乌塔堡战役已完成，格里弗斯死亡。本战役不额外增加阴谋分数。§!"
 foc_cw.5.desc:0 "§L绝地曾经调停战争，如今他们站在战舰舰桥上，亲自命令军团投入战争。§!\n\n邦联已经完全失去§H卡希克§!星系控制权。卡希克的浅滩上，绝地大师尤达和伍基人并肩守住了海岸线。邦联的登陆部队被压回水里，战报发往科洛桑：外环战事即将结束。\n\n这是共和国打赢的最后一场仗。\n\n就在那片浅滩上，尤达接到了一段来自科洛桑的加密通讯。他站在原地听完，没有说话，然后转身对身边的克隆人指挥官说了些什么。\n\n那名指挥官立正、敬礼，然后从腰间取下通讯器，接收了另一条频道上的指令。"
 foc_cw.6.desc:0 "邦联的一支§H25艘卢克里胡克级战列舰§!突袭舰队已抵达科洛桑，最高议长遭到劫持。"
 foc_ethics.2.desc:0 "§L帝国已经改变了旗帜与制度，却仍有共和国时代的旧法律像幽灵一样留在每一份档案里。§!\n\n帝国的政体、国策和旗帜都换过了，但有一样东西一直没有跟上：这个国家在纸面上仍然按共和国的价值观运转。\n\n议会时代的对外开放条款、非军事化承诺、种族平等法案，全部还挂在法典里，只是没有人再执行。总督们照着旧条文办事，军方照着新命令办事，两边每天都在打架。\n\n最高议长办公室今天一次性废除了它们。\n\n§H新秩序的三条支柱正式写进宪章：人类至上、军事优先、绝对权威。§!"
 foc_falcon_support.10.desc:0 "§L一艘老旧货船再次冲进最危险的航路，而整个银河像从沉睡中被它唤醒。§!\n\n§Y千年隼§!穿过隐秘航路，闯入了最终秩序盘踞的未知星域。紧随其后的不是一支正规军，而是来自银河各处的无数应答信号：退伍军人、走私者、地方防卫舰队以及幸存的反抗军编队都响应了号召。四支经过整编的联合舰队跃迁至最终秩序首都周围，并立即向西斯舰队发起攻击。"
 foc_fallen_war.11.desc:0 "§L第一秩序不再满足于隐藏。它准备让整个银河重新学会恐惧。§!\n\n漫长的停战终于崩裂。新共和国的舰队越过边境，帝国残余也让沉睡多年的歼星舰重新点燃反应堆。旧战争留下的裂痕从未真正愈合，如今双方再次把整个银河拖入争夺帝国遗产的决战。"
 foc_fallen_war.21.desc:0 "§L未知区域的航道被一支庞大舰队照亮，新一轮银河战争即将越过边界。§!\n\n帝国残余已经失去最后一颗殖民地。它的覆灭并未带来和平：来自未知区域的第一秩序正在集结。危机将在短暂预警后降临，弑星者基地将优先锁定新共和国当前首都所在的霍斯尼安主星系。"
 foc_fallen_war.22.desc:0 "§L冰冷的舰桥上没有欢呼，只有精确到秒的倒计时与一排排等待执行的命令。§!\n\n新共和国最后一处仍能升起旗帜的殖民地也沉默了。边境哨站在等待命令，帝国残余则把越来越多的舰队调往未知区域的航线。\n\n没有人知道黑暗里究竟在集结什么，只知道那些失踪多年的帝国军用频段重新开始交换加密信号。银河没有因为一个政权的消失而得到和平，反而像是替某个更危险的继承者腾出了位置。"
 foc_fallen_war.6.desc:0 "§L未知星域的黑暗中，一支被银河遗忘的军队正在完成最后的集结。§!\n\n§H贾库战役§!已经结束。银河帝国最后的大规模舰队在沙海上空覆灭，燃烧的歼星舰残骸散落于荒漠。新共和国以霍斯尼亚为政治中心，在银河一侧的边缘星团维持脆弱的新秩序；帝国残余则退守另一侧银河边缘的巴斯提恩星团，保存着执行者级超级歼星舰与死星级终极武器。\n\n战争看似结束，但未知区域仍在孕育第一秩序，更深处的最终秩序也尚未现身。两个旧时代政权的出现，标志着贾库战役之后的新银河时代正式开始。"
 foc_hero_rewards.1.desc:0 "§L战争夺走了很多传奇，也在这一刻把另一段传奇送到了我们面前。§!\n\n弑星者基地在烈焰中崩解后，一艘熟悉的YT-1300货船穿过爆炸余波。§Y千年隼§!带着最后一批幸存者抵达我们的首都。她的船体伤痕累累，引擎却依旧发出不羁的轰鸣——这艘见证过帝国覆灭的传奇飞船，准备再次投入战争。"
 foc_hero_rewards.2.desc:0 "§L大战留下的硝烟尚未散去，一位足以改变士气与战局的人物抵达了我们的阵营。§!\n\n卢克·天行者逝去后，莱娅·奥加纳用最后的生命在原力中呼唤自己的儿子。那声呼唤穿过了凯洛·伦多年来筑起的黑暗，也唤回了一个几乎被他亲手埋葬的名字。\n\n他抛下交叉护手光剑，重新以§H本·索罗§!的身份站了起来。没有赦免，也没有欢迎仪式；只有一条通往厄西戈的航路，以及一件他必须亲自完成的事。"
 foc_hero_rewards.4.desc:0 "§L大战留下的硝烟尚未散去，一位足以改变士气与战局的人物抵达了我们的阵营。§!\n\n本·索罗亲自率领我们的陆军踏上厄西戈。在西斯圣殿的阴影下，他以生命为代价撕开了最终防线，并在原力中与家人重逢。§Y凯洛·伦§!英雄已经死亡；他的牺牲使厄西戈及其星系基地归于我国控制。"
 foc_jakku_executor_site.1.desc:0 "§L贾库的风沙掠过舰船坟场，埋在沙层下的帝国遗骸终于露出新的秘密。§!\n\n科研队用地层扫描仪绘制了坟场的立体图。大量歼星舰残骸在贾库的沙层下彼此堆叠，而最深处一组异常庞大的龙骨结构值得进一步开掘。"
 foc_jakku_executor_site.2.desc:0 "§L这片坟场埋葬的不只是舰船，也埋着帝国末日最后几天留下的秘密。§!\n\n沙层下的主龙骨和装甲隔舱远超帝国级的规格。舰体编码证实，这些是贾库战役中损毁的执行者级支援结构。一处被多层耐钢包覆的舰桥区段仍保持密封。"
 foc_jakku_executor_site.3.desc:0 "§L这片坟场埋葬的不只是舰船，也埋着帝国末日最后几天留下的秘密。§!\n\n密封舱内的指挥数据核心大部分已经损坏，但舰体应力模型、能量网格图和船坞生产档案仍可读取。技术人员开始将这些碎片与现场残骸的测绘数据拼合。"
 foc_jakku_executor_site.4.desc:0 "§L贾库的风沙掠过舰船坟场，埋在沙层下的帝国遗骸终于露出新的秘密。§!\n\n贾库残骸和帝国档案的数据已完成整合。我们现在拥有帝国残余所使用的执行者级超级歼星舰固定建造方案。为避免机密系统流入普通舰船设计，该方案以不可编辑的完整蓝图形式封存。"
 foc_khan.1003.desc:0 "§L冰冷的舰桥上没有欢呼，只有精确到秒的倒计时与一排排等待执行的命令。§!\n\n弑星者基地已经摧毁了§Y[event_target:foc_khan_forced_starkiller_target_country.GetName]§!控制下的§H[event_target:foc_khan_forced_starkiller_target_system.GetName]星系§!。恒星、行星、空间站以及其中的一切生命，都在一次攻击中被彻底抹除。\n\n这件武器只要继续存在，银河中就没有任何国家是安全的。"
 foc_khan.1602.desc:0 "§L未知星域的黑暗中，一支被银河遗忘的军队正在完成最后的集结。§!\n\n弑星者基地的竣工使我们再也无法与第一秩序和最终秩序共存。原宗主已无法继续控制我们，我们立即恢复独立。两个秩序阵营均已将我国列为最高优先级目标，其进攻舰队正在改变航向，直扑我们的领土。"
 foc_khan.46.desc:0 "§L帝国残余留下的最后遗产，正在未知星域被锻造成一种更极端的新秩序。§!\n\n伊冷外侧的超空间连续闪烁了数小时。新造的歼星舰从未知区域一批批抵达，舰体上还带着船坞的焊接痕迹。\n\n最高统帅部没有举行阅舰式。新舰队完成编组后立即收到航路和目标，随后散入银河。第一秩序正在把隐藏多年的工业储备一点点变成前线兵力。"
 foc_khan.5.desc:0 "§L未知星域的黑暗中，一支被银河遗忘的军队正在完成最后的集结。§!\n\n未知区域沉寂多年的航路同时亮起。第一批复兴级歼星舰穿过贾库之外的黑暗，随后是更多舰队，以及一艘宽得像移动城市的旗舰。旧帝国的徽记被重新锻造成更冷、更锋利的形状。\n\n他们自称§H第一秩序§!。对他们而言，银河条约只是一场叛乱者强加给帝国的停战，而现在，停战结束了。\n\n新共和国议会仍在争论该把这支军队称作边境危机还是全面战争。莱娅·奥加纳已经不再等待答案。"
 foc_khan.63.desc:0 "§L第一秩序不再满足于隐藏。它准备让整个银河重新学会恐惧。§!\n\n弑星者基地和至尊号的毁灭并未结束战争。第一秩序残余舰队全部改旗，在厄西戈并入最终秩序。西斯舰队已经开始全面出击。"
 foc_khan.64.desc:0 "§L未知星域的黑暗中，一支被银河遗忘的军队正在完成最后的集结。§!\n\n第一秩序已经被最终秩序吸收。我们先前的臣服条约也随之转移，如今必须直接效忠厄西戈的西斯永恒。"
 foc_khan.81.desc:0 "§L冰冷的舰桥上没有欢呼，只有精确到秒的倒计时与一排排等待执行的命令。§!\n\n埃克西戈地下最后一座船台熄灭了施工灯。长矛级舰队已经塞满行星上空的阴影，更多舰体已没有必要继续开工。\n\n西斯永恒把剩余资源转向补给、武器与人员。造舰阶段结束了；接下来要做的，只是把这些舰船送向银河。"
 foc_khan.91.desc:0 "§L帝国残余留下的最后遗产，正在未知星域被锻造成一种更极端的新秩序。§!\n\n厄西戈的最终秩序已经覆灭。帕尔帕廷与西斯永恒失去了统治银河的舰队，各地民众同时起义，残存的第一秩序军团迅速瓦解。雷伊继承了绝地的意志；只要仍有人选择希望，绝地就不会消亡。"
 foc_khan_rebel.10.desc:0 "§L从走私航线到地方船坞，越来越多资源开始从帝国的账本上消失，流向同一个方向。§!\n\n一段经过多次中继的加密讯号穿过第一秩序的封锁线，最终抵达我们的通讯阵列。发信地点被故意抹去，只留下一个签名：莱娅·奥加纳。\n\n她没有要求我们宣誓效忠某个政府。她只问了一件事——当第一秩序命令我们向自己的邻居开火时，我们是否愿意说不。\n\n迪卡还有位置，也还有一场尚未打完的战争。"
 foc_khan_rebel.3.desc:0 "§L秘密频道里又亮起一个新的呼号。帝国把它称作叛乱，而越来越多人把它称作希望。§!\n\n迪卡的密林把机库、跑道和通讯阵列全部藏在树冠之下。第一批飞行员降落时没有仪仗，也没有共和国舰队护航；他们只带着旧战争留下的徽章和一份不再等待议会批准的决心。\n\n来自新共和国、旧义军、地方防卫队和情报网络的人在这里重新编成一支军队。指挥室墙上挂起了一枚熟悉的星鸟徽记。\n\n§H抵抗组织成立了。§!"
 foc_khan_rebel.42.desc:0 "§L帝国习惯用恐惧维持秩序，而现在有人第一次证明恐惧并不能让所有人沉默。§!\n\n迪卡星系的防线已经被突破。敌军穿过外围小行星带，摧毁了轨道防御并迫使反抗军放弃森林中的地下机库。大部分幸存者已在最后一刻完成撤离，正准备在弑星者基地的威胁解除后转移至克瑞特。反抗并未在迪卡终结。"
 foc_khan_settings.10.desc:0 "§L这不是前线命令，而是一份决定整个战争尺度的最高级战备授权。§!\n\n统一的星球大战MOD设置入口。战斗强度与舰队数量保持独立；战略战机强度自动跟随主战斗强度：§G原版档=原版战机§!、§Y中级档=SG战机§!、§RACOT级=BUFF强化战机§!。战机子菜单只调整模型显示大小与设计器阵营。"
 foc_khan_settings.11.desc:0 "§L战略模拟室已经准备完毕，参谋官正在等待你确认本局采用的战争规则。§!\n\n该选项只决定舰船、武器、超级主力舰与危机国家的战斗数值，§Y不再决定舰队数量§!。§G原版档§!会启用此前完成的完整原版化组件与武器平衡，并同步使用原版战机强度；§Y中级档§!使用原有SG/FOC舰船与武器数值，并同步使用SG战机强度；§RACOT级§!在中级装备基础上追加原疯狂档的远古文明级战斗强化，并同步使用BUFF强化战机版本。"
 foc_khan_settings.12.desc:0 "§L最高统帅部打开战术演算终端，所有参数都将直接改变接下来战争的节奏。§!\n\n我们可以切断未知区域中的自动触发信号，等待更合适的时机；也可以主动追踪第一秩序，让战争立即开始。已经降临的危机无法被重新封回黑暗。"
 foc_khan_settings.13.desc:0 "§L战略模拟室已经准备完毕，参谋官正在等待你确认本局采用的战争规则。§!\n\n这是统一的星球大战MOD初始设置菜单。你可以逐项修改战斗强度、舰队规模和§H完整剧情时间轴起点§!。直接关闭则采用默认配置：§Y中级档战斗强度 + 大型规模增援 + 开放全部战机 + 战机原版模型大小 + 剧情于2200年开始§!。"
 foc_khan_settings.14.desc:0 "§L战略模拟室已经准备完毕，参谋官正在等待你确认本局采用的战争规则。§!\n\n这里不使用百分比重新计算，而是直接沿用当前MOD实际存在的四组舰队数量。旧高级档与疯狂档本来就使用相同数量，因此合并为同一项。主力舰每支规模为§Y7 / 14 / 20 / 27艘§!；现有支援编成、§Y864艘/阵营§!累计上限和§Y360天§!支援周期均保持不变。"
 foc_khan_settings.15.desc:0 "§L这不是前线命令，而是一份决定整个战争尺度的最高级战备授权。§!\n\n选择§H当前起源路线的星战剧情§!何时开始。共和国起源会在所选年份开启共和国时代，并让后续历史按原有间隔推进；普通起源与第一秩序起源的天堂之战默认在剧情起点§H60年后§!爆发，因此选择2250、2300或2400也会把这场战争整体向后顺延。\n\n共和国路线在签署银河条约后采用独立计时：§H24年后§!爆发天堂之战；若战争持续§H5年§!仍未结束，第一秩序危机将获得一个额外触发机会，而原有危机触发条件继续保留。\n\n§Y2200为默认；2250、2300、2400分别延后50、100、200年。§!"
 foc_khan_vassal.11.desc:0 "§L通讯频道里沉默了很久，对方只留下两个选择：服从，或者继续战争。§!\n\n第一秩序只接受无条件臣服。我们可以成为其秩序辖区，以换取帝国的存续。"
 foc_khan_vassal.11.loyal_desc:0 "§L这不是外交谈判，而是一份以舰队与超级武器作担保的最后通牒。§!\n\n我们已经成为第一秩序辖区。只要继续履行辖区义务，其舰队和弑星者基地便不会把我们视为敌人。"
 foc_khan_vassal.12.desc:0 "§L通讯频道里沉默了很久，对方只留下两个选择：服从，或者继续战争。§!\n\n最终秩序要求银河无条件服从。我们可以成为其秩序辖区，以避免被彻底毁灭。"
 foc_khan_vassal.12.loyal_desc:0 "§L通讯频道里沉默了很久，对方只留下两个选择：服从，或者继续战争。§!\n\n我们已经向最终秩序臣服，并被其视为友军。"
 foc_khan_vassal.2.desc:0 "§L敌方使者的全息投影没有寒暄，投降条件已经直接摆上了桌面。§!\n\n对第一秩序的战争正在走向不利。我们可以接受其统治，成为第一秩序辖区以保全帝国，或者继续战争。"
 foc_khan_vassal.3.desc:0 "§L这不是外交谈判，而是一份以舰队与超级武器作担保的最后通牒。§!\n\n最终秩序要求无条件臣服。我们可以成为最终秩序辖区以保全文明，或者继续战争。"
 foc_kylo.10.desc:0 "§L斯诺克、天行者与索罗家族留下的伤痕，再一次把本·索罗推到选择面前。§!\n\n神殿的火并不是从外面点起来的。\n\n§H本·索罗§!是莱娅·奥加纳与汉·索罗的儿子，也是天行者血脉里天赋最高的一个。从很小的时候起，就有一个声音在他脑子里说话——一个自称§H斯诺克§!的存在，从未知星域伸过来，耐心地对他说：你的家族一直在你身上找另一个人的影子，他们害怕你，包括那个把你送去神殿的舅舅。\n\n那一夜，他睁开眼睛，看见的是舅舅站在床边、光剑已经点亮。\n\n那个声音说的每一句话，在那一瞬间都被证实了。\n\n他带走了几名学徒，烧掉了神殿，从此弃用索罗这个姓氏。他给自己取的新名字是§H凯洛·伦§!。"
 foc_kylo.11.desc:0 "§L黑暗面没有突然降临，它只是多年如一日地在一个人的心里低语。§!\n\n跟着他离开雅雯四号的人组成了一个新的东西：§H伦骑士团§!。\n\n六个人，六件粗糙的武器——斧、钺、弩、重刃，没有一件是光剑，也没有一件像绝地或西斯的制式装备。他们不谈原力哲学，也不宣讲任何教义，只是出现在需要他们出现的地方，然后把那里清空。\n\n凯洛·伦是他们的首领。斯诺克把这支小队交给他，既是奖赏，也是拴住他的绳子。\n\n他自己那把交叉护手光剑是自制的：凯伯水晶有裂痕，能量无法稳定，所以必须在剑柄两侧开泄压口。那两道横刃不是设计，是缺陷。"
 foc_kylo.12.desc:0 "§L第一秩序的战争正在扩大，而真正决定凯洛·伦命运的战斗发生在他的内心。§!\n\n弑星者基地已经在崩解，热力井正在贯穿整颗行星。而在反应炉上方那道没有护栏的窄桥上，发生了另一件事。\n\n§H汉·索罗§!穿过整座正在爆炸的基地，为的只是走上那座桥。他没有带武器出场，只喊了一个名字——不是凯洛·伦，是§H本§!。\n\n那一刻对方犹豫了。他承认自己正在被撕成两半，说自己需要帮助才能挣脱那道光。他把光剑递了过去。\n\n然后他点亮了它。\n\n索罗伸手碰了碰儿子的脸，坠进了井底。斯诺克要的从来不是一座超级武器，而是这一刀：只有亲手斩断最后一条牵挂，那个学生才算真正属于黑暗。\n\n代价立刻出现了。那一刀之后，他在雪林里输给了一个从未受过训练的拾荒者。"
 foc_kylo.13.desc:0 "§L黑暗与光明都没有放弃他，而他必须决定自己最终回应哪一个名字。§!\n\n至尊号的王座厅里，斯诺克得意于自己的全知：他早就看穿了那个学生心里的每一次动摇，也算准了他会举起光剑杀死俘虏。\n\n他确实算准了那把剑会被点亮。他只是没有算准那把剑当时躺在谁的手边、剑锋朝着哪个方向。\n\n§H斯诺克被自己的学生斩成了两截。§!御前卫队随即扑上来，而那一场混战里，凯洛·伦是背靠背和拾荒者一起打完的。\n\n打完之后他伸出了手，请她一起把过去全部烧掉——绝地、西斯、义军、第一秩序，通通不要。她拒绝了。\n\n于是他自立为§H最高领袖§!，坐上了那把没有人再为他辩护的椅子。"
 foc_kylo.14.desc:0 "§L黑暗面没有突然降临，它只是多年如一日地在一个人的心里低语。§!\n\n那顶头盔本来已经被他自己砸碎在电梯里。\n\n现在它回来了。碎片被逐一拼回，缝隙里灌进熔化的赤色合金，愈合的裂纹像血管一样爬满整张面罩。他没有解释为什么要修它。\n\n与此同时，未知星域深处传来一段不属于任何已知频道的信号。信号一直重复着同一句召唤，坐标指向一颗不在任何航图上的行星——§H埃克索尔§!。\n\n他独自把飞船开了过去。等在那里的，是一个本该在恩多的反应炉井里死了很多年的人。"
 foc_kylo.15.desc:0 "§L在第一秩序最强盛的时候，最高领袖身边却出现了一道无法用舰队解决的裂痕。§!\n\n银河的两端出现了同一种现象：两个人在毫无预兆的情况下彼此看见、彼此听见，甚至能把手上的水滴带到对方的甲板上。距离对它没有意义，屏蔽对它也没有意义。\n\n古老的记载里管这个叫§H原力连接§!：原力中极其罕见的一对，两个人构成一股力量。它不能被切断，也不能被单方面关闭。\n\n这对第一秩序是个巨大的战术漏洞——最高领袖脑子里的东西，随时可能被另一个人看见。\n\n它对那个最高领袖本人则是另一回事：每一次连接，他都会被迫再看一眼自己当年在窄桥上做过什么。"
 foc_kylo.16.desc:0 "§L斯诺克、天行者与索罗家族留下的伤痕，再一次把本·索罗推到选择面前。§!\n\n两件事同时发生。\n\n在埃克索尔的方向，他刚刚被那个拾荒者的光剑贯穿，随即又被同一个人用原力治愈——她说，她本来想接住的是本·索罗的手。\n\n在半个银河之外，§H莱娅·奥加纳§!用尽最后的生命，在原力中呼唤了儿子的名字，然后停止了呼吸。\n\n他在废墟里坐了很久。父亲的幻影出现在他面前——一个他亲手杀死的人，如今只是重复了当年那句话：回家吧。\n\n他把那把有裂痕的交叉护手光剑扔进了海里。\n\n站起来的人不再是凯洛·伦。§H本·索罗§!回来了，而且他知道自己要去哪里。"
 foc_kylo.17.desc:0 "§L黑暗面没有突然降临，它只是多年如一日地在一个人的心里低语。§!\n\n西斯的祭坛下，帕尔帕廷抽干了那两个人身上的原力，让自己重新变得年轻。而那个代价最终也由那两个人还了回去。\n\n最终秩序的舰队烧成了埃克索尔天空里的碎片。等尘埃落定，深坑底下只剩下一具躺着不动的身体。\n\n§H本·索罗§!爬了下去，把她抱起来，把自己全部的生命力送了过去。她睁开眼睛，喊了他的名字——这是三十年里第一次有人这样喊他，而且他也第一次答应了。\n\n然后他微笑着倒了下去，身体化作原力，斗篷落在地上。\n\n天行者的血脉到此为止。那个姓氏后来被另一个人在塔图因的双日下捡了起来。"
 foc_luke.10.desc:0 "§L一条关于绝地、维达与天行者血脉的线索，正在把战争推向更私人的方向。§!\n\n死星在雅雯四号上空爆炸的时候，义军的战术屏幕上只剩下三架战机。\n\n最后一次攻击跑道由一名没人认识的飞行员完成。他关掉了瞄准计算机，凭手感把质子鱼雷射进了两米宽的排气口。没有人能解释他是怎么做到的——除了跟着他一起飞出来的那位老人，那位老人在半途中已经死在了死星里面。\n\n飞行员的名字叫§H卢克·天行者§!，来自塔图因，此前的职业是农场帮工。\n\n他现在编入我们的指挥序列。"
 foc_luke.11.desc:0 "§L原力中的涟漪再次扩散开来，天行者家族的命运正与银河战争纠缠在一起。§!\n\n天行者未经批准就脱离了编队。他的X翼最后一次出现在通讯范围内时，航向指向§H达戈巴§!——一颗湿热、多雾、地图上几乎空白的沼泽星球。\n\n数月之后他才回来，机身上全是泥。他说他在那里找到了一个人，一个身高不到一米、说话把词序全部颠倒的老家伙。那个人在共和国覆灭前是绝地议会的大议长，此后在这颗星球的泥沼里独居了整整二十年。\n\n他只教了天行者一件事：要么去做，要么不做，没有“试试看”。\n\n他还说了另一件事，天行者没有转述。"
 foc_luke.12.desc:0 "§L原力中的涟漪再次扩散开来，天行者家族的命运正与银河战争纠缠在一起。§!\n\n云城的行动彻底失败。索罗被冻进碳凝块交给了赏金猎人，天行者在反应炉井道里与达斯·维达单独交手，右手连同光剑一起被削掉。\n\n把他从下方通风管道救出来的时候，他没有谈伤势。他只说，维达在最后对他讲了一句话。\n\n§H那个杀死他父亲的人，就是他父亲。§!\n\n医疗舱替他装上了义肢。至于另一件事，没有任何设备能修。他现在必须自己决定：是把这条消息当成通往黑暗的绳索，还是当成一个仍然可以被拉回来的人。"
 foc_luke.13.desc:0 "§L银河正在关注战局，而原力关注的是另一场只有少数人能够看见的较量。§!\n\n恩多的护盾发生器被地面部队摧毁，死星二号在轨道上解体。而真正决定胜负的事，发生在那座战斗空间站的王座厅里。\n\n天行者主动向皇帝投降，为的是见维达最后一面。皇帝要他动手杀死自己的父亲，好接替那个位置。他打赢了那一场决斗——然后把光剑扔在地上，说自己是绝地，和他父亲一样。\n\n皇帝开始用原力闪电杀他。就在那时，那具黑色的装甲动了：达斯·维达抱起皇帝，把他扔进了反应炉井。\n\n面罩摘下来的时候，里面是一个将死的老人。§H阿纳金·天行者§!在恩多的月亮上被火化，是他儿子亲手点的火。"
 foc_luke.15.desc:0 "§L原力中的涟漪再次扩散开来，天行者家族的命运正与银河战争纠缠在一起。§!\n\n死星二号在恩多上空解体了，而帝国真正失去的不是那座战斗空间站。\n\n皇帝把天行者带上了王座厅，本意是让那个年轻人在父亲和自己之间选一个，然后杀掉另一个。计划的每一步都按预想推进——直到天行者赢下决斗、扔掉光剑，说自己是绝地。\n\n皇帝随即动用原力闪电。而站在旁边一动不动看了很久的那个人，最后抱起自己的主人，把他扔进了反应炉井。\n\n§H达斯·维达已经阵亡。§!舰队指挥序列里那个所有人都害怕的名字消失了，帝国失去了他带来的一切。"
 foc_luke.17.desc:0 "§L原力中的涟漪再次扩散开来，天行者家族的命运正与银河战争纠缠在一起。§!\n\n死星二号的王座厅在解体前几分钟发生过一件事，帝国的官方通报里一个字也没提。\n\n§H帕尔帕廷死了。§!把他从御座边抱起来、扔进反应炉井的，是他自己二十三年来最信任的那个人。\n\n没有遗体，没有遗嘱，也没有继承人——他从来没有安排过继承人，因为他压根不打算死。整个新秩序的合法性都系在一个人身上，而那个人现在连一具尸首都没留下。\n\n科洛桑的军部在十二小时内成立了§H帝国摄政§!，对外宣称皇帝仍在处理事务。没有人相信这句话，包括发布它的人。\n\n从今天起，帝国由一个没有名字的军人政府维持——各战区的总督和元帅正在互相试探，看谁先动手。"
 foc_luke.20.desc:0 "§L一条关于绝地、维达与天行者血脉的线索，正在把战争推向更私人的方向。§!\n\n银河和约后的和平年代里，韩·索罗与莱娅·奥加纳的儿子班·索罗已经显露出强大却并不稳定的原力天赋。卢克·天行者选择在§H奥苏斯§!正式动工建立新的绝地圣殿，并将班列为第一批重点培养的亲传学徒。\n\n与此同时，一个名叫§H雷伊§!的女孩出生。此时没有人知道，她终有一天会走进这场已经延续数代人的光明与黑暗之争。"
 foc_luke.21.desc:0 "§L银河正在关注战局，而原力关注的是另一场只有少数人能够看见的较量。§!\n\n第一秩序准备公开发动战争之际，帕尔帕庭通过克隆傀儡斯诺克长期侵蚀班·索罗的心智。卢克在班的睡梦中感受到几乎不可挽回的黑暗，在一瞬间的恐惧中点亮光剑。\n\n班惊醒后彻底崩溃。雷电与火焰吞没奥苏斯的新绝地圣殿，他抛弃旧名，成为§H凯洛·伦§!并投奔第一秩序。卢克则在自责中切断与原力的联系，前往§H阿奇托§!自我放逐。\n\n这一切发生在第一秩序公开发动闪电战之前不久。"
 foc_luke.22.desc:0 "§L一条关于绝地、维达与天行者血脉的线索，正在把战争推向更私人的方向。§!\n\n天行者切断了自己在原力中的全部痕迹，然后消失了。\n\n他去的地方叫§H阿奇托§!，一颗遍布礁石与海鸟的孤岛世界。岛上有一棵中空的古树，树里藏着银河系第一批绝地留下的原典——武士团真正的源头。\n\n他不是去守护它们的。他是去等武士团在自己手里终结的。\n\n他的说法是：绝地本身就是错误的一环。武士团在顶点时对西斯视而不见，让西斯从他们内部诞生，让共和国在他们眼皮底下变成帝国。而他自己重建的那个版本，只用了一夜就烧成了灰。\n\n§Y卢克·天行者退出现役指挥序列。§!"
 foc_luke.30.desc:0 "§L一条关于绝地、维达与天行者血脉的线索，正在把战争推向更私人的方向。§!\n\n克瑞特的盐层下，抵抗力量已经被逼进最后一条矿道，闸门被攻城炮轰开。\n\n就在那时，一个人独自走出闸门，站在整支第一秩序地面部队面前。\n\n对方把全部炮火倾泻过去，足足打了一分多钟。烟散之后，他还站在原地，掸了掸肩膀上的灰。凯洛·伦亲自下来与他决斗，一剑穿过了他的身体——什么也没有碰到。\n\n§H那不是卢克·天行者本人。§!他此刻仍在阿奇托的礁石上，用尽全部原力把自己投射到半个银河之外，为的是拖住这支部队，让幸存者从后山的裂缝里逃出去。\n\n幸存者逃掉了。而在阿奇托，他望着两轮落日坐了下来，然后与原力合而为一，只留下地上的斗篷。\n\n整个银河都听说了这件事。从这一天起，第一秩序不再是无人敢于反抗的东西。"
 foc_luke.31.desc:0 "§L原力中的涟漪再次扩散开来，天行者家族的命运正与银河战争纠缠在一起。§!\n\n阿奇托的那棵古树后来也烧了，绝地原典却没有在里面——有人早一步把它们带走了。\n\n而在火光旁出现的，是一个不该出现的人。\n\n他说了两句话。第一句是关于失败的：这才是最好的老师，只是没有人愿意承认。第二句是关于传承的：真正要传下去的不是那些书，而是拿起它们的人。\n\n武士团的档案、神殿、议会都没有了。但只要还有人在原力中站起来，武士团就没有断。"
 foc_nr_fix.2.desc:0 "§L新共和国的工程档案被重新核对，一些本该随政权继承的关键蓝图终于被找了回来。§!\n\n银河条约生效之后，蒙卡拉的水下船坞终于重新点火。\n\n战争年代那批临时改装的巡洋舰不会再造了。取而代之的是两份一直压在图纸柜最底层的设计：中型主力舰§H星云级§!，以及那艘从来没有人真正批准过预算的§H子爵级§!——十七公里长，蒙卡拉马利人为它准备了整整一代人的时间。\n\n和平才刚开始，新共和国却已经在为下一次可能到来的战争设计舰队。"
 foc_padme.10.desc:0 "§L战争让所有人的选择都变得沉重，而帕德梅与安纳金也无法置身事外。§!\n\n纳布的君主是选举产生的，任期有限。§H帕德梅·纳贝里·阿米达拉§!卸任时，纳布人几乎一致要求修宪让她连任。她拒绝了，然后接受了另一个职位——纳布派驻银河议会的议员。\n\n她带进议会大厅的是一份很不合时宜的立场：反对军队组建法案，反对给最高议长办公室追加任何紧急权力。她在演讲里说过一句后来被反复引用的话——共和国不会被入侵推翻，它会在一片掌声里被交出去。\n\n投她票的人一年比一年少。\n\n还有一件事没有出现在任何一份记录里：那个当年从塔图因带回来的男孩已经长大，成了绝地武士团里最惹眼的一个。他们两人之间的事，武士团的戒律和议会的规矩都不允许。"
 foc_padme.11.desc:0 "§L共和国的命运正在崩塌，而最重要的变化此刻只发生在极少数人之间。§!\n\n外环的战事拖到第三年，科洛桑的绝地档案室收到一份没有归档的口头报告。\n\n§H安纳金·天行者§!开始做同一个梦。他梦见帕德梅在分娩时死去，梦见自己站在旁边什么也做不了。这种梦他做过一次——很多年前，梦的是他母亲，后来全部应验了。\n\n他去问了绝地大师。得到的回答是训导：对失去的恐惧才是通往黑暗面的路，要学会放下。\n\n他又去了歌剧院的包厢。最高议长在那里给他讲了一个西斯传说：从前有一位大师，力量强到能干预生死，能让他在乎的人不死。故事的结尾是那位大师被自己的徒弟在睡梦中杀掉。\n\n讲完之后，议长补了一句：这种力量，绝地是不会教给你的。\n\n\n\n§L本事件保留原剧情与其他效果，不额外增加帕尔帕廷阴谋点数。§!"
 foc_padme.12.desc:0 "§L科洛桑的夜色掩不住私人生活与银河政治之间越来越危险的裂缝。§!\n\n神殿烧掉之后，她驾着自己的飞船去了§H穆斯塔法§!。她不相信那些报告，她要当面问他。\n\n她见到的人向她描述了一个新的秩序：战争会结束，银河会安定，他强大到足以推翻议长、亲自统治一切，而他们可以一起。她后退了一步，说她不认识眼前这个人。\n\n然后欧比旺·克诺比从她的飞船舷梯上走了下来。\n\n他认定这是背叛，是她把人带来的。§H他隔空掐住了她的喉咙§!，直到她昏死在熔岩滩上。\n\n他自己在随后的决斗里被砍断四肢、烧成焦炭，被人从火边捡回去，装进了那身黑色的维生装甲。\n\n她被送到波利斯·马萨的医疗舱，生下一对双胞胎，然后停止了呼吸。医生查不出任何生理上的死因——他们的原话是，她失去了活下去的意志。\n\n§Y帕德梅·阿米达拉已经死亡。§!"
 foc_padme.13.desc:0 "§L战争让所有人的选择都变得沉重，而帕德梅与安纳金也无法置身事外。§!\n\n纳布为她举行了国葬。棺木里的人看上去仍然怀着身孕——这是必须让所有人相信的事，包括那个躺在手术台上刚刚换完装甲的人。\n\n孩子有两个，而且必须分开。\n\n女孩由奥德朗的贝尔·奥加纳收养，会在王室里长大，会很早就学会在议会里说话。男孩被送回§H塔图因§!，交给他父亲的继兄一家，在一座水分农场上长大——那是全银河最不值得搜查的地方之一。\n\n尤达去了达戈巴。欧比旺留在塔图因的沙漠里，看着那座农场，一看就是十九年。\n\n§Y原力中的希望没有断，只是被藏了起来。§!"
 foc_raddus.2.desc:0 "§L旗舰甲板上的警报没有停，工程人员却发现了一个比战损更难解释的问题。§!\n\n旗舰的检修报告送上来时，值班军官以为是记录出错了。\n\n§H拉杜斯号§!的三处专属舱段——工程舱、停泊舱、以及贯穿舰体的轴向打击指挥模块——在编制表上全部显示为空。船体完好，反应炉正常，机库里一百二十架战机也都在位，但那三样让它不只是一艘大船的东西，不知道从哪一天起就不在了。\n\n追查下去，原因很荒唐：那些舱段的授权名录里写的是「义军同盟」。而我们在银河条约之后已经不叫这个名字了。舰还是那艘舰，人还是那批人，只是登记簿上的抬头换了，于是系统判定这些舱段不属于我们。\n\n名录已经改过来了，舱段正在重新接入。"
 foc_reb.1.desc:0 "§L帝国习惯用恐惧维持秩序，而现在有人第一次证明恐惧并不能让所有人沉默。§!\n\n罗萨的工厂停工了。帝国广播仍在重复宵禁令，但街道上的扩音器已经被当地人拆下，行政建筑上的帝国徽记一块接一块落地。\n\n在轨道上，驻防部队第一次发现补给航道被本地飞行员切断。地面反抗细胞同时打开隐藏多年的通讯频道，向义军发送同一句短讯：§H罗萨已经起义。§!\n\n这不再是一场地下行动。一颗星球正在公开选择自己的旗帜。"
 foc_reb.2.desc:0 "§L帝国习惯用恐惧维持秩序，而现在有人第一次证明恐惧并不能让所有人沉默。§!\n\n§H杰达§!的圣城站了几千年，是绝地采集凯伯水晶的地方，也是全银河朝圣者最后能去的地方之一。帝国在那里开矿已经很多年，把整座山掏空，把晶体一船一船运走。\n\n索·格雷拉的游击队就藏在那片沙漠里。他们打了帝国十几年，手段脏，纪律差，义军高层一直不肯认他们。\n\n然后帝国在杰达上空开了一炮。\n\n不是舰炮。是那件传闻里的东西，用了单发低当量。圣城连同周围数百公里在几秒钟内变成一个新的陨石坑，沙尘冲上大气层。\n\n§H传闻不再是传闻了。§!"
 foc_reb.3.desc:0 "§L没有阅兵，没有宣战书，只有一艘艘旧船、一群不肯低头的人和越来越清晰的共同目标。§!\n\n§H蒙卡拉马利§!的船坞在水下，从太空看不见。帝国占领这颗星球之后一直想把它们征用，但蒙卡拉人给出的产能报表年年不达标——他们把最好的工人和最好的图纸都藏了起来。\n\n现在他们决定不装了。\n\n随同加入的还有一批设计图。那不是巡洋舰改装方案，是完整的主力舰设计：中型的§H星云级§!，以及一份从来没有人批准过预算的十七公里长的东西——§H子爵级§!。\n\n蒙卡拉人说，他们为这一天准备了整整一代人。"
 foc_reb.4.desc:0 "§L没有阅兵，没有宣战书，只有一艘艘旧船、一群不肯低头的人和越来越清晰的共同目标。§!\n\n曼达洛的统治权不靠选举，也不完全靠血统。它靠一把剑——§H暗黑剑§!，一千年前由第一位曼达洛绝地锻造的黑色光剑。谁在决斗中赢下它，谁就有资格号令各氏族。\n\n帝国扶植的傀儡总督手里现在拿着那把剑，而他不是靠决斗拿到的。\n\n各氏族分成了两半。一半要打回去，一半要先看看谁给的价码高。\n\n我们的态度会决定这颗星球倒向哪边。"
 foc_reb.5.desc:0 "§L帝国习惯用恐惧维持秩序，而现在有人第一次证明恐惧并不能让所有人沉默。§!\n\n在此之前，反抗帝国的从来不是一个组织，而是几十个互不认识、互相提防的小团体：罗萨的工人、杰达的游击队、蒙卡拉的船厂、曼达洛的氏族，还有议会里那些没有被抓走的人。\n\n他们在科雷利亚坐到了同一张桌子前。争论持续了整整一夜，天亮时，所有代表终于在同一份文件上签下名字。\n\n§H义军同盟§!正式成立。科雷利亚也在这一天公开撕下帝国旗帜，把船坞、航道和城市交给这支刚刚拥有名字的反抗军。"
 foc_reb.6.desc:0 "§L帝国的星图依旧完整，可在那些看似安静的星系里，反抗正在一点一点连成网络。§!\n\n帝国叛军成立后，蒙·卡拉马里的造船师终于把长期隐藏的军用巡洋舰方案交给了叛军舰队。此前这些船体只能以少量预先服役舰存在，无法作为标准舰型在船坞批量建造。\n\n现在，MC80的主反应堆、分布式护盾阵列、重型涡轮激光炮和舰载机甲板已经整理成完整的标准化设计。"
 foc_rebel_growth.2.desc:0 "一个新控制的殖民星系加入了帝国叛军。当地造船厂与补给仓库可以提供一支战斗群，也可以转交等值合金预算并加入舰队补给网络。\n\n§Y二选一：20艘MC80，或29800合金并叠加舰船维护费−5%。§!\n合金奖励按奖励版MC80完整设计的基础合金造价核算：每艘1490合金（舰体与配件），20艘共29800，不按各国临时折扣浮动。每个符合条件的星系仅结算一次。"
 foc_rebyard.2.desc:0 "§L反抗组织终于走到了必须回答一个现实问题的时候：没有船坞，就没有真正的舰队。§!\n\n同盟从成立那天起就有一个谁都不愿意说破的问题：我们能抢船、能改装船、能把货轮焊成炮艇，但我们没有一处能把龙骨铺下去的地方。\n\n占下来的星系只有前哨站——一根监听桅杆，一台跃迁抑制器，仅此而已。那上面装不了任何东西，因为它根本没有装东西的地方。\n\n工程队花了几个月把首都星系的前哨站扩建成一座真正的要塞：两条船台、一处锚地、一组炮台，外加乘员舱与后勤办公室。另外两个有殖民地的星系各加了一条船台，用来做前线修理和备用产能。\n\n其余星系维持原样。同盟养不起遍地要塞，也不需要。"
 foc_rebyard.4.desc:0 "§L反抗组织终于走到了必须回答一个现实问题的时候：没有船坞，就没有真正的舰队。§!\n\n两座死星都成了残骸，而§H夸特§!的环形船台完整地落在了我们手里。\n\n帝国撤退时来不及炸毁任何东西——那些船台太大了，大到工程队算过之后放弃了。留下的不只是产线：图纸柜也在原地，锁还是帝国接管前的那一批。\n\n最上面一层压着一份从来没有下水过的设计。中型主力舰，火力对得起吨位，造价只有帝国级的一小部分，本来是共和国海军为战后重建准备的下一代主力。议会当年没有批预算，帝国接管后把它锁进了柜子。\n\n蒙卡拉的工程师看了一眼图纸，说他们认得这个线条——这份设计有一半是他们画的。\n\n§H星云级歼星舰§!的蓝图现已解封。"
 foc_rem.1.desc:0 "§L帝国已经倒下，帝国人却还活着；残余势力正在废墟里重新决定自己的身份。§!\n\n银河条约签下去之后，帝国残余在纸面上是一个国家。实际上不是。\n\n外环每一个还挂着帝国旗的星区，手里都有自己的舰队、自己的船坞、以及一个自称合法继承人的总督或元帅。有人还在用皇帝的名义发号施令，有人已经开始铸自己的钱。他们之间的边境摩擦比对新共和国的还多。\n\n残余政府必须先解决这件事，否则谈不上任何对外行动。"
 foc_rem.2.desc:0 "§L帝国已经倒下，帝国人却还活着；残余势力正在废墟里重新决定自己的身份。§!\n\n一艘帝国级歼星舰从未知星域的方向跳了出来，没有报出识别码，径直穿过残余的哨戒线。\n\n舰名§H奇美拉§!。舰龄很老，维护得极好，舰体上带着一些没人见过的战损修补痕迹——那些不是新共和国的武器打出来的。\n\n它带来的不只是一艘船。它带来的是一份银河边缘的航图、一套在未知星域打了很多年才磨出来的战术，以及一个终于有人肯服从的舰桥。\n\n从今天起，残余舰队有了一个真正的旗舰。"
 foc_rem.3.desc:0 "§L旧帝国的鹰徽仍悬在舰桥上，只是如今每一面旗帜背后都代表着不同的野心。§!\n\n旧共和国时代有过一支两百艘德雷德诺特级组成的舰队，全部装了全舰联动系统，一个舰桥就能指挥两百条船。首航时全体船员染上疫病，在神志不清的状态下把整支舰队一起跳进了超空间。\n\n此后五十年，找它成了银河系最著名的一桩传说生意。没有人找到过。\n\n现在有人找到了。\n\n船体完好，反应炉冷了但没坏，武器系统还是五十年前的型号——放在今天的战场上不算先进，可它们不需要先进，它们只需要够多。"
 foc_rem.4.desc:0 "§L外环的堡垒世界彼此观望，每一个军阀都在等待别人先露出弱点。§!\n\n§H夸特§!的环形船台是银河系最大的军工设施，帝国海军六成的吨位从那里下水。条约把夸特划给了新共和国，但船台的所有权在夸特驱动器场手里，而那是一家公司。\n\n公司不谈立场，只谈订单。\n\n他们派人来了，带着一份很实际的方案：新共和国的订单排到七年后，中间那段产能空着也是空着。价钱谈妥了，交货方式不留记录。"
 foc_rem.5.desc:0 "§L停战后的星空异常安静，而旧帝国舰队的引擎从未真正熄火。§!\n\n整肃完成了，旗舰回来了，舰队补齐了，船台也接上了。残余第一次不再是残余，而是一个有能力做选择的政权。\n\n参谋部把两份方案摆上了桌。\n\n一份主张就守着外环这块地。承认条约，坐稳这几十个星区，用二十年把它变成一个真正能自己活下去的国家——代价是永远放弃那个曾经属于我们的银河。\n\n另一份主张现在就动手。新共和国的议会还在为舰队预算吵架，边境守备是空的，而我们手里有一个知道怎么打赢的人。"
 foc_republic_origin.12.desc:0 "§L科洛桑的灯火照亮整颗星球，却照不穿正在权力中心聚拢的阴影。§!\n\n贸易联盟、银行业协会与技术联合会派出了同一个代表团。他们要的东西写得很客气：承认财团\"护航部队\"的合法地位，换取一笔数额惊人的自愿捐助与航道税减免。\n\n所有人都清楚那些\"护航部队\"是什么——那是几支不受议会节制的舰队。\n\n最高议长办公室对此没有表态，只是把提案排进了本届会期。\n\n§Y本次是五个关键抉择之一。只有有利于帕尔帕廷的选项计入20点；另一项为0。每项只记一次。§!"
 foc_republic_origin.13.desc:0 "§L科洛桑的万千航道依旧闪烁，但共和国的命运已经在这一刻悄然偏转。§!\n\n议会为一份法案吵了整整一个会期：共和国是否应当拥有一支属于自己的常备军？\n\n千年以来，共和国的武力一直由成员星系自行提供。支持者说边疆已经不安全了；反对者说，一支只对科洛桑负责的军队，迟早会被科洛桑的某个人拿去用。\n\n表决权在你手里。\n\n§Y本次是五个关键抉择之一。只有有利于帕尔帕廷的选项计入20点；另一项为0。每项只记一次。§!"
 foc_republic_origin.14.desc:0 "§L共和国档案馆后来把这一日单独封存，因为许多改变银河的决定都始于看似普通的一次报告。§!\n\n一名审计员在例行核查中发现了一笔钱。数额不大，但它在预算里出现了十一次，每一次的收款方都是一家注册在外环、没有雇员的空壳公司。\n\n顺着线索往上查，第三层就撞上了一份需要最高议长办公室授权才能调阅的档案。\n\n审计员在报告末尾问：是否继续？\n\n§Y本次是五个关键抉择之一。只有有利于帕尔帕廷的选项计入20点；另一项为0。每项只记一次。§!"
 foc_republic_origin.15.desc:0 "§L银河仍相信共和国能够渡过危机，而危机本身却正在重塑共和国。§!\n\n战时紧急状态即将到期。按照法律，权力应当在期满之日交还议会。\n\n但前线还在打，舰队调度、军备征用、行省戒严，全都挂在那一纸授权上。最高议长在发言中只说了一句：他会在战争结束的那一天亲自交还这些权力。\n\n议会正在等你的态度。\n\n§Y本次是五个关键抉择之一。只有有利于帕尔帕廷的选项计入20点；另一项为0。每项只记一次。§!"
 foc_republic_origin.160.desc:0 "§L从核心世界到外环前线，同一条消息正在不同的频道里被反复确认。§!\n\n战争终于停下来了。没有胜利阅兵，也没有人愿意再数一遍死者。各方代表在长桌两侧坐了数日，最终在一份谁都不完全满意的文件上签下名字。\n\n义军同盟放下战时编制，以霍斯尼亚为新的政治中心重建共和国；仍然忠于帝国的舰队和世界则退向外环，把残存的旗帜带往堡垒星域。\n\n一个时代以条约而不是最后一发炮火结束。银河得到了一段和平，也留下了两群都没有忘记上一场战争的人。"
 foc_republic_origin.161.desc:0 "§L最高议会仍试图用程序维持秩序，然而战争正在把每一道旧规则推向极限。§!\n\n我们签下了那份文件。\n\n科洛桑不再听从帝国的命令，夸特的船坞易手，贾库的航路也被切断。继续作战只会让剩余舰队在没有补给和统一指挥的情况下逐支消失。\n\n帝国没有在今天复兴，也没有在今天彻底死去。我们带着还忠于旧旗帜的人退往堡垒，在银河边缘保存军队、档案和记忆。总有一天，和平会露出裂缝。"
 foc_republic_origin.162.desc:0 "§L这一刻没有宏大的仪式，只有一道命令、一份报告，以及后来无人能够逆转的后果。§!\n\n公开的战争结束了，交接清单也签了字。只是有几支舰队的编号，从来没有出现在任何一份清单上。\n\n它们正在向银河北缘的未知星域航行，带走了工程师、凯伯水晶勘探队，以及一整套还没来得及销毁的军工档案。下达撤退命令的是皇帝本人，签发日期比恩多还早。\n\n他从来没有打算让帝国活下去。他打算让别的东西活下去。"
 foc_republic_origin.165.desc:0 "§L这一刻没有宏大的仪式，只有一道命令、一份报告，以及后来无人能够逆转的后果。§!\n\n未知星域的航路终于绘制完成。\n\n§H伊冷§!是一颗被冰封的星球，地壳下埋着整个银河最纯净的凯伯水晶矿脉。伊冷与贾库之间的专用航道已经打通，§H弑星者基地、至尊号与复兴级§!科技正式开放。"
 foc_republic_origin.169.desc:0 "§L共和国档案馆后来把这一日单独封存，因为许多改变银河的决定都始于看似普通的一次报告。§!\n\n死星已经服役，而我们截获了一段来自§H斯卡里夫§!的加密传输。\n\n那是一颗被整片行星护盾包住的热带世界，海面上架着帝国最大的数据塔。全部超级武器项目的原始工程档案都存放在那里——包括反应炉的完整结构图。\n\n发出这段传输的人没有报姓名，只说了一句：图纸里有东西不对劲，而且是有人故意留下的。"
 foc_republic_origin.17.desc:0 "侦察报告确认了阿基瓦的机器人制造基地。这里是重要的工业与补给节点。"
 foc_republic_origin.170.desc:0 "§L科洛桑的灯火照亮整颗星球，却照不穿正在权力中心聚拢的阴影。§!\n\n那不是卫星。\n\n§H死星一号§!已经在科洛桑上空投入运行。塔金总督在启用仪式上说，从今天起帝国不再需要议会——恐惧本身就是最有效的行政手段，而恐惧现在有了一个可以停在任何一颗行星轨道上的形状。"
 foc_republic_origin.171.desc:0 "§H死星一号已经被摧毁。§!银河看见了帝国最可怕的武器也会爆炸。义军获得原有的一次性胜利奖励，对死星的旧攻击增伤立即失效。\n\n玩家帝国立即获得§H死星二号建造计划§!，完成工程时触发博桑情报事件，二号在恩多出现。AI帝国则在一号毁灭§H4年后§!暴露并部署未完工二号。\n\n原有帝国支援舰队规则保持：立即获得一支支援舰队，此后每360天再获得一支，直到死星二号被摧毁。"
 foc_republic_origin.173.desc:0 "博桑谍报网已锁定§H恩多§!。死星二号未完工的骨架出现在森林卫星上空，超级激光已经可以开火。\n\n其船体、装甲、护盾与武器输出均为死星一号的§H1.3倍§!，初始移速为§H0§!。AI帝国不会进行完工与机动改装，斯卡里夫的旧死星增伤也不会再次生效。"
 foc_republic_origin.174.desc:0 "恩多上空，§H死星二号§!已进入战斗值班。其外壳和推进系统尚未完工，移速为§H0§!；船体、装甲、护盾与武器输出均为死星一号的§H1.3倍§!。\n\n玩家帝国可以在情报日志中手动研究§H死星二号：完工与机动改装§!。完成后，外观变为放大1.3倍的死星一号完整模型，机动能力恢复。AI不会执行这项升级。"
 foc_republic_origin.175.desc:0 "§H第二座也没了。§!\n\n地面小队摧毁了恩多的护盾发生器，义军战机从未完工的外壳缺口深入反应炉，将第二死星化为燃烧的残骸。帝国统治的支柱随之崩塌。\n\n§Y帝国的360天周期支援从此停止，已到达的舰队保留。义军仍获得本次死星毁灭自身的既有胜利奖励，但此后新取得的星系不再提供舰队、资源或新的维护费减免层数；未领取的新星系奖励同时取消。§!"
 foc_republic_origin.176.name:0 "双死星覆灭：内环总起义"
 foc_republic_origin.176.desc:0 "§L第二颗死星在恩多上空解体的那一刻，帝国赖以维系统治的恐惧也一起崩塌。§!\n\n消息沿着秘密通讯网传遍银河。按照银河条约最终应归属§H新共和国§!的星系几乎同时易帜：地方守军倒戈、总督府失去控制、议会与抵抗组织公开接管政权。§H科洛桑与夸特是仅有的例外§!，这两个帝国核心必须由义军亲自攻克。\n\n§H贾库§!按战后划分属于帝国残余，因此不在本次起义名单内；它仍是银河条约军事路线必须让银河帝国失去的战略节点之一。执行者号、卢桑基亚号与惩罚者号也仍必须被摧毁。\n\n§Y机制：当前地图中最终归属新共和国的全部星系立即转入义军控制，科洛桑与夸特除外。§!"
 foc_republic_origin.177.desc:0 "斯卡里夫行动取得了死星档案，然而完整图纸还没有安全送达义军指挥部。\n\n§Y本事件只记录图纸被夺取，不立即发放死星特攻或护盾伤害加成。§!斯卡里夫战役后等待30天，奥德朗与莱雅救援事件才会进入后续剧情；莱雅获救后，义军方能完成弱点分析。"
 foc_republic_origin.180.desc:0 "三座军港收到了启航命令。\n\n§H执行者号§!率30艘帝国 II 级驻守恩多，§H卢桑基亚号§!率30艘帝国 II 级驻守科洛桑，§H惩罚者号§!率30艘帝国 II 级驻守贾库。\n\n三支编队各为§H1艘执行者级＋30艘帝国 II 级§!。三艘剧情旗舰各自只服役一次，被摧毁后不会重建。"
 foc_republic_origin.181.desc:0 "§L这一刻没有宏大的仪式，只有一道命令、一份报告，以及后来无人能够逆转的后果。§!\n\n死星终于从图纸、预算争论和无数秘密船坞中走进了现实。它不再是一项武器工程，而是一种新的统治方式。\n\n威尔赫夫·塔金将自己的方案呈到皇帝面前：帝国不必在每一颗反抗的星球上打一场战争。只要银河相信某一次反抗可能换来整个世界的毁灭，恐惧本身就会替舰队维持秩序。\n\n第一场示范已经选好了目标——杰达。\n\n§Y机制：只要银河帝国仍拥有死星一号或死星二号，帝国境内的随机地下组织升级与随机公开起义将被恐惧压制；死星被摧毁后会自动恢复。帝国叛军主动发动的间谍策反行动不受此限制。§!"
 foc_republic_origin.182.desc:0 "§L共和国档案馆后来把这一日单独封存，因为许多改变银河的决定都始于看似普通的一次报告。§!\n\n弑星者基地的聚能阵列已经指向霍斯尼亚。那颗恒星周围环绕着新共和国的议会、舰队司令部和整个战后政治秩序。\n\n最高领袖的命令只有一句：不要打击一支舰队，要打击他们相信战争已经结束的那个世界。\n\n与此同时，来自迪卡方向的加密讯号越来越密集。有人已经开始为最坏的结果做准备。"
 foc_republic_origin.190.desc:0 "§L共和国档案馆后来把这一日单独封存，因为许多改变银河的决定都始于看似普通的一次报告。§!\n\n§H弑星者基地已经建成。§!\n\n一整颗行星被掏空，装上了恒星能量收集阵列。它开火的时候，被瞄准的不是一颗星球，而是一整个星系。\n\n完成这件事的政权已经不再是帕尔帕廷那个帝国了。它有自己的旗帜、自己的军队、自己的最高领袖，以及一个从未知星域带回来的名字。\n\n§Y国家正式改组为§H第一秩序§!并化身天灾，进入与第一秩序起源完全相同的银河新秩序、最终秩序、原力化身与宇宙飞升流程。§!"
 foc_republic_origin.192.desc:0 "§L科洛桑的万千航道依旧闪烁，但共和国的命运已经在这一刻悄然偏转。§!\n\n霍斯尼亚不存在了。\n\n弑星者的光束抵达时，没有宣战广播，也没有撤离时间。议会穹顶、舰队司令部、城市与轨道设施一同消失在恒星爆发般的白光里。新共和国赖以维系的中央秩序在几秒钟内被切断。\n\n短暂的沉默之后，一段新的加密呼号从迪卡传来。那里没有议会席位，也没有正式授权，只有一群拒绝把这场战争交给历史的人。"
 foc_republic_origin.2.desc:0 "§L在共和国仍自称和平守护者的时候，战争机器已经开始转动。§!\n\n银河议会在§H科洛桑§!召开新一届会期。二十七个成员星系的代表齐聚穹顶之下：§H内环十四星系§!的工业与航道，§H外环十三星系§!的矿藏与边疆驻军，共同支撑着这个存续了千年的共同体。\n\n每一颗成员世界都由§H成员世界行政经济中枢§!统辖，供应能源、矿物、食物、消费品与合金，也维系着地方的秩序与民生。共和国的船坞正在扩产，护航舰队巡弋在主要贸易航线上。\n\n然而外环的税负争端从未平息，商业财团的私兵编制年年膨胀，而最高议长办公室手中的紧急权力，正在一份接一份地累积。"
 foc_republic_origin.20.desc:0 "独立星系邦联宣布投降。\n\n邦联将停止作战，分日移交全部剩余领土，包括§H穆斯塔法§!，随后解散，不保留议会残余国家。克隆人战争结束后，66号命令与帝国成立剧情继续推进。"
 foc_republic_origin.21.desc:0 "§L这一刻没有宏大的仪式，只有一道命令、一份报告，以及后来无人能够逆转的后果。§!\n\n情报部门递上一份没有署名的简报：紧急法令、暗账军费、议会中的代理人，正在最高议长身边收拢成一张看不见的网。\n\n没有人能证明什么。但每一次危机结束之后，科洛桑的权力都比危机之前更集中一分。"
 foc_republic_origin.22.desc:0 "§L前线与议会之间的距离从未如此遥远，所有人都在等待一个能够决定下一步的答案。§!\n\n卡米诺传来的最后一份克隆军交付报告还没在议会归档，夸特的代表已经把另一份文件放到了桌上。战争正在变得比任何成员世界单独承担的规模都更大，而共和国现有的船台仍是为和平年代的护航舰准备的。\n\n夸特动力船坞提出扩建环形军港：新的龙骨架、更深的干船坞，以及足以连续建造大型主力舰的工业区。共和国若要把克隆军送到银河每一条战线，就必须先给他们造出能够抵达那里的舰队。"
 foc_republic_origin.23.desc:0 "§L前线与议会之间的距离从未如此遥远，所有人都在等待一个能够决定下一步的答案。§!\n\n卡米诺的培育舱向共和国交付了第一批克隆人军团。议会以保卫共和国之名批准了§H克隆人军队计划§!：共和国从此不再依赖成员星系的地方部队，而拥有一支横跨银河、只听命于总参谋部的常备军。\n\n而总参谋部的战时指挥权，握在最高议长手里。\n\n第一批军团的指挥权交给了§H科迪指挥官§!——一名克隆人，忠于共和国，也忠于共和国之上的任何命令。\n\n§Y固定剧情节点：阴谋＋10，只记录一次。§!"
 foc_republic_origin.24.desc:0 "§L最高议会仍试图用程序维持秩序，然而战争正在把每一道旧规则推向极限。§!\n\n夸特轨道上的最后一组新船台点亮了导航灯。共和国海军早已拥有少量猎兵级服役舰，但它们始终依赖有限的专用船台与手工装配，无法支撑一场席卷银河的长期战争。\n\n如今，新的标准化生产线终于贯通。猎兵级不再只是中央舰队中屈指可数的重型旗舰——从这一刻起，它将成为共和国真正能够持续补充的战争主力。\n\n§Y固定剧情节点：阴谋＋10，只记录一次。§!\n\n§H先进耐钢装甲§!现已解锁。夸特将获得行星环奖励；没有既有环、施工或废墟时，直接建成配备§H4座船坞§!的§H三级行星环§!。"
 foc_republic_origin.25.desc:0 "§L议会穹顶下仍有掌声与争论，而历史真正记住的，是接下来发生的事。§!\n\n一道加密指令同时抵达每一支克隆人军团的指挥频道，编号§H66§!。\n\n执行它的士兵没有迟疑，也没有询问理由。从科洛桑到外环，忠于议会的将领与议员在同一个夜里被清除。绝地神殿的高塔燃烧了整整一夜——尤达与温杜没有走出来，武士团几乎荡然无存。\n\n带队冲进神殿的，是那个曾被称为§H天选之子§!的人。\n\n共和国的军队，已经不再属于共和国。"
 foc_republic_origin.26.desc:0 "§L科洛桑的灯火照亮整颗星球，却照不穿正在权力中心聚拢的阴影。§!\n\n一艘伤痕累累的小型飞船在基地边缘请求降落，识别码属于一个早已注销的绝地编队。\n\n舱门打开时，走出来的人身上还带着神殿的灰——§H欧比旺·克诺比§!。66 号命令那一夜，绝地几乎被屠戮殆尽，而他是少数逃出科洛桑的人之一。\n\n他带来的第一句话不是关于自己：那个执行清洗、亲手屠戮神殿的人，曾经是他的学徒。\n\n但武士团没有断绝。这个消息本身，就足以让整个反抗运动重新挺直腰杆。"
 foc_republic_origin.27.desc:0 "§L科洛桑没有停下运转，可空气里已经有了暴风雨来临前的味道。§!\n\n66 号命令并未杀死每一个绝地。总有几个人在那一夜逃了出去，藏进了银河的褶皱里。\n\n皇帝对此早有安排。一批堕落的原力使者被召集起来，授予黑色的战甲与旋转的光剑，编成一个只对他本人负责的机构：§H审判庭§!。\n\n他们的任务只有一个——找出剩下的人。"
 foc_republic_origin.28.desc:0 "§L这一刻没有宏大的仪式，只有一道命令、一份报告，以及后来无人能够逆转的后果。§!\n\n神殿的火还没有灭。\n\n执行 66 号命令的那支部队由一名绝地率领——共和国最锋利的一把剑，欧比旺·克诺比的学徒，曾被预言为终结西斯的\"天选之子\"。他走进自己长大的地方，然后再没有以那个名字走出来。\n\n皇帝为他重新命名：§H达斯·维达§!。\n\n从今往后，帝国的意志会亲自出现在战场上。"
 foc_republic_origin.30.desc:0 "§L科洛桑没有停下运转，可空气里已经有了暴风雨来临前的味道。§!\n\n议会大厅的灯光照在一张张沉默的脸上。最高议长走上讲坛，宣布旧共和国将在今天结束——不是因为战败，而是因为它已经无法保护自己。一个更强大、更安全、更有秩序的国家将取代它。\n\n掌声从穹顶下一层层响起。与此同时，蒙·莫思玛和一批拒绝宣誓效忠的军官已经离开科洛桑。雅文的丛林与霍斯的冰原正在接收第一批逃亡者。\n\n银河只剩下两个选择：接受新秩序，或者反抗它。"
 foc_republic_origin.32.desc:0 "§L从核心世界到外环前线，同一条消息正在不同的频道里被反复确认。§!\n\n科洛桑上空最后一面共和国旗帜被降下。军港、法院、情报机关和克隆军团在同一天换上新的徽记，帝国级歼星舰的首批订单从海军部送往各大船厂。\n\n在更深的档案层，一份只有极少数人见过的工程计划被重新启封。它的代号很简单：死星。皇帝相信，只要银河见过一次它的力量，就不会再需要第二次。"
 foc_republic_origin.33.desc:0 "§L从核心世界到外环前线，同一条消息正在不同的频道里被反复确认。§!\n\n帝国的公告宣称内战已经结束，可雅文的密林里仍有运输机起降，霍斯的冰层下也有人把旧共和国的设备重新接上线。逃亡的议员、拒绝改编的军官、走私者和地方抵抗组织开始共享同一批密码。\n\n他们还没有统一的旗帜，也没有足以和帝国舰队正面对抗的力量。但从这一刻起，银河中第一次出现了一张无法被帝国完全抹去的反抗网络。\n\n而在斯卡里夫，帝国仍把某些最重要的秘密锁在行星护盾之下。"
 foc_republic_origin.5.desc:0 "§L银河仍相信共和国能够渡过危机，而危机本身却正在重塑共和国。§!\n\n贸易联盟以抗议航道税为名，把整支运输舰队开到了§H纳布§!轨道上，切断了这颗中环星球与外界的一切联系。议会用了整整数周争论调查团的程序问题，救援舰队始终没有出港。\n\n纳布的当选女王§H帕德梅·纳贝里·阿米达拉§!亲自到科洛桑陈情。她今年十四岁。她在议会大厅里被告知：先成立委员会，再讨论是否派兵。\n\n于是她做了另一件事——当场提出对现任最高议长的不信任案。\n\n动议通过了。接替那个位置的，正是纳布自己派驻议会的那位议员，一个从来不引人注意、说话总是很有分寸的人：§H帕尔帕廷§!。\n\n他在就职演说里向议会保证，共和国需要的只是效率。\n\n（阿米达拉后来带着一支临时拼凑的部队打回纳布，解除了封锁。同行的还有一个从塔图因带回来的九岁男孩。）\n\n§Y固定剧情节点：阴谋＋10，只记录一次。§!"
 foc_republic_origin.50.desc:0 "§L前线与议会之间的距离从未如此遥远，所有人都在等待一个能够决定下一步的答案。§!\n\n共和国最后一颗殖民地降下了旗帜。二十七个成员星系——从内环的工业世界到外环的边疆驻军——如今全部挂着帝国的徽记。\n\n但清点名单的时候，有一批人对不上号：几十名议员、十几支拒绝接受改编的舰队，还有旧共和国情报部门的整整一个处。他们在外环一颗密林行星上重新集结，自称§H义军同盟§!。\n\n§Y共和国已亡，内战尚未结束。帝国必须完成死星计划并彻底消灭义军，才能取得完整的胜利遗产。§!"
 foc_republic_origin.6.desc:0 "§L科洛桑的灯火照亮整颗星球，却照不穿正在权力中心聚拢的阴影。§!\n\n科洛桑神殿的高塔上，绝地议会为新一届议会送来了他们的致意。大议长§H尤达§!与§H梅斯·温杜§!大师代表武士团出席。\n\n武士团不属于任何一个成员星系，也不受议会节制。上千代人以来，他们调解纠纷、护送使节、镇抚边疆，把这个庞大而松散的共同体维系在一起。作为回报，共和国从不过问他们的事务。\n\n尤达只提了一句：原力最近有些不安。\n\n§H绝地神殿§!已在科洛桑开放。只要它还矗立，共和国就能从中征召绝地编队。"
 foc_republic_origin.60.desc:0 "§L共和国档案馆后来把这一日单独封存，因为许多改变银河的决定都始于看似普通的一次报告。§!\n\n帝国叛军攻入科洛桑，帕尔帕廷的帝国已经瓦解。各方随后签署§H银河条约§!：\n\n- 内环诸世界重组为以§H霍斯尼亚§!为首都的§H新共和国§!，由你继续统率；\n- 外环残部退往堡垒，以§H帝国残余§!之名维持旧帝国的最后一块疆土；\n- 两国均保持为普通国家，不会转化为堕落帝国；\n- 双方裁撤内战舰队，各自保留两支工程船队、两座巨型战斗空间站与八支主力舰队，此后不得再扩张至对方疆域。\n\n条约签订了，但未知星域深处仍有人不承认它。"
 foc_republic_origin.7.desc:0 "§L前线与议会之间的距离从未如此遥远，所有人都在等待一个能够决定下一步的答案。§!\n\n外环开战之后，议会通过决议：绝地武士临时授予军衔，出任克隆人军团的指挥官。§H欧比旺·克诺比§!与他的前学徒§H安纳金·天行者§!同时接过将星。\n\n神殿内部对此争论激烈。有人说守护者不该成为将军，有人说共和国需要他们。最终议会还是把光剑送上了战场。\n\n这是武士团第一次成建制地参战。尤达在议会闭门会议上说了一句没人愿意记录在案的话：这场战争会改变武士团，而不是相反。"
 foc_republic_origin.70.desc:0 "§L科洛桑的万千航道依旧闪烁，但共和国的命运已经在这一刻悄然偏转。§!\n\n那不是卫星。\n\n当最后一块装甲板封闭，死星的主反应堆开始全功率运转。整座战斗空间站缓慢离开施工轨道，超级激光阵列第一次转向一颗真正的目标。\n\n帝国高层相信，一座能够让整颗行星从星图上消失的武器，会让所有反抗在开火之前就自行崩溃。银河很快就会知道他们是否正确。"
 foc_republic_origin.76.desc:0 "§L科洛桑的万千航道依旧闪烁，但共和国的命运已经在这一刻悄然偏转。§!\n\n共和国的残部并没有随议会一同消失。\n\n他们在§HD'Qar§!的密林里挖出了机库，用伪装网盖住跑道，把旧共和国的旗帜重新升了起来。第一份公开宣言是用民用频道广播的——他们连一台军用加密机都没有。\n\n§YD'Qar 是这场叛乱唯一的政治中心。只要拿下那颗星球，反抗就会失去它的头颅。§!"
 foc_republic_origin.8.desc:0 "§L这一刻没有宏大的仪式，只有一道命令、一份报告，以及后来无人能够逆转的后果。§!\n\n绝地大师私下求见。\n\n他说，武士团感知到一股黑暗面的存在，就在科洛桑，就在权力的中心附近——但原力被某种东西遮蔽了，他们看不清那是谁。武士团请求授权，对最高议长办公室展开调查。\n\n这在共和国的历史上从未有过。如果你批准，等同于公开质疑一位战时议长；如果你拒绝，武士团会服从，然后继续在黑暗中摸索。\n\n§Y本次是五个关键抉择之一。只有有利于帕尔帕廷的选项计入20点；另一项为0。每项只记一次。§!"
 foc_republic_origin.80.desc:0 "§L最高议会仍试图用程序维持秩序，然而战争正在把每一道旧规则推向极限。§!\n\n银河系没有再升起第二面旗帜。\n\n死星已经服役，共和国已经不存在，最后一批义军的基地在轨道轰炸中变成了玻璃。皇帝在科洛桑宣布：新秩序取得了完全的、不可逆的胜利。\n\n档案库最深处那些一直上着封条的工程资料，从今天起可以取用了。"
 foc_republic_origin.90.desc:0 "§L共和国档案馆后来把这一日单独封存，因为许多改变银河的决定都始于看似普通的一次报告。§!\n\n§H弑星者基地已经建成。§!\n\n一整颗行星被掏空、改造，装上了恒星能量收集阵列。充能时，天空里那颗恒星会一点一点暗下去，直到熄灭；开火时，光束穿过超空间，同时抵达好几个星系。\n\n帝国到此为止。取代它的东西从未知星域走了出来，用的是另一个名字。\n\n§Y国家正式化身天灾，普通第一秩序危机被永久跳过，进入银河新秩序、最终秩序、原力化身与宇宙飞升流程。最终秩序抉择将在二十年后到来。§!"
 foc_rogue_one.1.desc:0 "§L斯卡里夫、杰达与死星之间的秘密航线被重新标出，一场没有退路的行动已经开始。§!\n\n§H死星一号已经具备实战能力。§!\n\n奥森·克伦尼克主管要求用一次受控的低功率射击向皇帝证明‘星尘计划’已经成功。目标被选在§H杰达§!——帝国多年来从那里开采凯伯水晶，索·格雷拉的武装也在那里活动。\n\n超级激光只启用了一部分反应堆。即便如此，圣城仍在数秒内消失，冲击波把地表掀成一圈不断扩大的火海。\n\n塔金总督看完记录后没有祝贺克伦尼克。他只问了一句：这座空间站什么时候可以归帝国舰队直接指挥？"
 foc_rogue_one.10.desc:0 "§L帝国把这项工程当作终结反抗的最终答案，反抗者却正在寻找它唯一的弱点。§!\n\n杰达毁灭后的混乱中，索·格雷拉的人送来了一个意外的俘虏。§H博迪·鲁克§!原本是帝国货运飞行员，负责给秘密工程设施运送物资。\n\n他没有要求庇护，也没有开价。他反复说同一件事：自己受一个叫§H盖伦·厄索§!的人委托，必须把一段信息交给义军。\n\n厄索正是帝国那座行星杀手的主要工程师之一。"
 foc_rogue_one.11.desc:0 "§L斯卡里夫、杰达与死星之间的秘密航线被重新标出，一场没有退路的行动已经开始。§!\n\n残缺的全息影像终于被修复。盖伦·厄索承认自己参与了死星工程，但也说明了为什么。\n\n他无法阻止帝国建成这件武器，于是选择让它从内部就带着一个致命错误：一条看似普通的反应堆排热结构，能够把一次精确命中直接传导到主反应堆。\n\n但留言没有完整图纸。厄索只留下了档案代号——§H星尘§!——以及储存设计总档案的地点：§H斯卡里夫§!。"
 foc_rogue_one.12.desc:0 "§L斯卡里夫、杰达与死星之间的秘密航线被重新标出，一场没有退路的行动已经开始。§!\n\n情报把我们带到§H伊杜§!的一处帝国研究设施。盖伦·厄索就在这里，与一批被迫为死星工作的工程师关在一起。\n\n行动开始前，高层已经授权一次空袭，目标是彻底摧毁这座设施。地面小队赶到了厄索身边，却来不及让轰炸机返航。\n\n厄索死在女儿面前。临死前他只确认了一件事：真正能证明弱点存在的完整图纸仍在斯卡里夫。"
 foc_rogue_one.13.desc:0 "§L死星计划从未打算被公众知道，直到它的存在再也无法被隐藏。§!\n\n义军议会没有批准进攻斯卡里夫。情报不完整，帝国舰队占据绝对优势，而把整个同盟押在一个未经证实的工程弱点上，看起来更像赌博而不是战略。\n\n会议结束后，§H琴·厄索§!、§H卡西安·安多§!、博迪·鲁克与一批志愿者没有返回驻地。他们夺取了一艘运输机，在起飞许可里报出了一个临时呼号：§H侠盗一号§!。\n\n几分钟后，一些原本奉命留守的义军舰长开始自行离港。"
 foc_rogue_one.14.desc:0 "斯卡里夫的护盾大门已被突破。地面小队在档案塔中找到代号§H星尘§!的完整图纸，并将数据传向轨道上的义军旗舰。\n\n§H拉杜斯上将§!驾驶深奥号坚守传输窗口，最终与旗舰一同毁于帝国炮火。侠盗一号地面小队再无回音，但图纸已经离开星球。\n\n义军尚未完成情报分析。至少一个月后，若战役发生时已建成的死星一号仍然存在，它将抵达斯卡里夫；此后的追击与营救将决定这些牺牲是否换来希望。"
 foc_rogue_one.15.desc:0 "追兵逼近时，最后的守军把数据载体交上了一艘外交护卫舰。舰桥上的§H莱雅·奥加纳§!接过图纸，命令舰船尽快前往义军基地。\n\n帝国的追击尚未结束，完整图纸也还没有送到分析人员手中。莱雅与护卫舰很快落入维达的控制，营救她成为义军下一步行动的关键。"
 foc_rogue_one.2.desc:0 "§L斯卡里夫、杰达与死星之间的秘密航线被重新标出，一场没有退路的行动已经开始。§!\n\n安全局截获了一份来自杰达的残缺情报。一个名叫§H博迪·鲁克§!的帝国货运飞行员失踪了；他最后一次任务与死星首席能源工程师§H盖伦·厄索§!有关。\n\n更糟的是，克伦尼克已经确认厄索在反应堆设计中留下了未经批准的结构。它被藏在数百万页工程图里，平时看不出异常，但如果完整档案落入懂得寻找它的人手中，这座战斗空间站可能并不像宣传里那样无懈可击。\n\n真正完整的设计档案只有一个地方还有备份：§H斯卡里夫§!。"
 foc_rogue_one.3.desc:0 "§L帝国最高机密的阴影正在收拢，代号星尘的工程终于逼近它真正的用途。§!\n\n克伦尼克赶回死星要求保留项目指挥权。塔金没有与他争论技术贡献，只把一份皇帝办公室签署的命令放在桌面上。\n\n从这一刻开始，死星被正式编入帝国战略指挥体系。克伦尼克仍然负责工程问题，但空间站本身由§H威尔霍夫·塔金§!控制。\n\n克伦尼克离开舰桥时，只剩一个地方还能证明这座武器是他的作品：斯卡里夫那座装满原始设计记录的档案塔。"
 foc_rogue_one.4.desc:0 "斯卡里夫档案库遭到突破，完整的死星图纸已经越过护盾大门传出。守军未能截断最后的数据链路，地面小队与轨道上的义军旗舰却付出了生命的代价。\n\n帝国指挥部准备命令§H达斯·维达§!追击携带图纸的信使。失去的情报必须追回，叛军不能获得解析它的时间。"
 foc_rogue_one.5.desc:0 "维达率军登舰，沿着狭窄的通道逼近数据载体。守军将图纸逐手传递，终于送上撤离的护卫舰。\n\n追击随即锁定了§H莱雅·奥加纳§!。她与护卫舰落入帝国控制，但图纸的去向仍未查明；塔金准备以奥德朗迫使她交代义军的位置。"
 foc_saga_dqar.3.desc:0 "§L停火后的第一缕晨光照进船坞，战争机器终于第一次被要求学会停下来。§!\n\n银河条约签字之后的第一份文件不是庆祝声明，而是复员令。\n\n为了拆掉两座死星、为了在内环打赢一场看不到头的战争，船坞曾经昼夜不停，预备役一批批被重新召回，整个经济都围绕前线运转。\n\n现在没有仗打了。议会很快通过决议：超编舰队封存，临时征召人员回家，军工产线转向重建。\n\n有人在议场里问，如果他们回来怎么办。回答是：那就再打一次——但共和国不能靠永远准备下一场战争活着。"
 foc_sepplot.1.desc:0 "§L科洛桑仍把分离主义称作政治危机，而银河边缘已经开始为真正的战争做准备。§!\n\n纳布之战结束后，西斯武士§H达斯·魔§!被认为已经阵亡。对最高议长帕尔帕廷而言，这并不是阴谋的终结，而只是一次更换棋子的机会。\n\n离开绝地武士团的前绝地大师§H杜库伯爵§!与共和国之间的裂痕越来越深。帕尔帕廷向他揭示了另一条道路，并赐予他新的名字：§H达斯·泰拉纳斯§!。\n\n从这一刻起，议会里日益高涨的不满将有人在暗处引导。"
 foc_sepplot.2.desc:0 "§L有人在共和国察觉战争之前，就已经替战争准备好了军队、资金与理由。§!\n\n绝地大师§H西法-迪亚斯§!坚信银河系即将迎来一场共和国无法依靠现有军力应付的大灾难。他没有得到绝地议会授权，却仍秘密前往§H卡米诺§!，以共和国的名义订购了一支规模惊人的§H克隆人大军§!。\n\n订单没有进入议会预算，也没有进入绝地档案的正常程序。卡米诺人只知道客户要求他们十年后交付一支能够立即投入银河战争的军队。"
 foc_sepplot.3.desc:0 "§L共和国表面的平静之下，分离主义危机正在把一条条秘密线索连成完整的阴谋。§!\n\n西法-迪亚斯没有活着看到自己的军队。§H杜库伯爵§!奉西斯之命清除了这位知情者，并利用自己曾经身为绝地大师的权限篡改档案、切断追查线索，随后以§H泰拉纳斯§!的身份接管卡米诺计划。\n\n克隆人仍将按照原订单成长、训练、装备——但决定他们最终听命于谁的人已经换了。"
 foc_sepplot.4.desc:0 "§L有人在共和国察觉战争之前，就已经替战争准备好了军队、资金与理由。§!\n\n在§H拉格萨斯§!，杜库伯爵向银河发表公开演说，指责共和国被腐败的议员、垄断财团和无休止的程序彻底绑架。他宣称继续留在科洛桑体制内已经不可能改革共和国。\n\n演说迅速传遍外环。数千个不满的星系宣布支持杜库，退出共和国的呼声第一次从零散抗议变成了一个有领袖、有纲领的§H分离主义运动§!。\n\n他们尚未组成一个真正的战争国家，但共和国的裂缝已经公开化。"
 foc_sepplot.5.desc:0 "§L绝地情报网追到的新线索并没有带来答案，只让局势变得更加危险。§!\n\n杜库在§H吉奥诺西斯§!秘密召集贸易联盟、商业行会、企业同盟等巨头。会议不再讨论自治或税率，而是在讨论舰队吨位、机器人生产线和一场战争的物资需求。\n\n各大企业正式承诺向即将成立的§H独立星系邦联§!提供舰船、资金，以及数以百万计的§H战斗机器人§!。政治运动已经拥有了发动全面战争所需的工业基础。"
 foc_sepplot.6.desc:0 "§L有人在共和国察觉战争之前，就已经替战争准备好了军队、资金与理由。§!\n\n追查针对§H帕德梅·阿米达拉§!的刺杀行动时，绝地武士§H欧比旺·肯诺比§!找到了一条通往卡米诺的线索。那里等待他的不是刺客藏身处，而是一支共和国从未正式订购过的克隆人大军。\n\n克隆人的基因模板来自赏金猎人§H强格·费特§!。当强格离开卡米诺时，欧比旺没有终止调查，而是一路追踪他的航迹前往吉奥诺西斯。"
 foc_sepplot.7.desc:0 "§L有人在共和国察觉战争之前，就已经替战争准备好了军队、资金与理由。§!\n\n欧比旺潜入吉奥诺西斯地下设施，亲眼看见贸易联盟与企业巨头向杜库交出各自的军力，也看见机器人装配线昼夜不停地运转。\n\n他在被发现之前向绝地议会发出了加密报告：§H分离主义者正在组建一支足以与共和国开战的军队。§!\n\n情报已经传出，但欧比旺本人没能离开。"
 foc_sepplot.8.desc:0 "§L绝地情报网追到的新线索并没有带来答案，只让局势变得更加危险。§!\n\n欧比旺被俘后，§H安纳金·天行者§!与§H帕德梅·阿米达拉§!赶往吉奥诺西斯试图营救他，结果三人全部落入分离主义者手中。\n\n杜库下令在吉奥诺西斯竞技场公开处决他们。消息抵达科洛桑时，绝地武士团已经开始集结救援力量，而共和国议会面对的已经不是一次遥远的分离运动，而是一场迫在眉睫的战争。"
 foc_sepplot.9.desc:0 "§L一份本不该存在的档案被重新打开，里面的每一页都指向更深的黑暗。§!\n\n在分离主义军队即将全面动员的消息传回科洛桑后，共和国议会陷入混乱。纳布代表§H加·加·宾克斯§!提出动议：在危机期间授予最高议长§H帕尔帕廷紧急处置权§!，允许他绕过漫长的议会程序直接调动共和国资源。\n\n动议通过。帕尔帕廷立即宣布，共和国将正式启用在卡米诺发现的克隆人大军。第一批军团已经登上运输舰，目标——吉奥诺西斯。\n\n§L本事件保留原剧情与其他效果，不额外增加帕尔帕廷阴谋点数。§!"
 foc_starkiller_coords.3.desc:0 "§L恒星能量沿着行星内部的巨型导管奔涌，超级武器正在进入战斗状态。§!\n\n首轮弑星打击的能量轨迹已经揭示发射源坐标。帝国残余星门现已向全银河开放，可通往隐藏在未知星域中的目标星系。"
 foc_story.10.desc:0 "§L舰桥上的星图重新刷新，战争的意义已经和几分钟前完全不同。§!\n\n弑星者基地的光束穿过超空间，霍斯尼亚的天空在数秒内变成白色。首都、议会、舰队司令部以及环绕恒星的整个政治中心一同消失。\n\n幸存的通讯频道沉默了很久。等第一批加密信号重新出现时，它们已经不再从霍斯尼亚发出，而是从迪卡的密林深处传来。\n\n新共和国的时代结束了。抵抗仍在继续。"
 foc_story.11.desc:0 "§L这一刻很快会被写进银河史，但身处其中的人只来得及面对下一步。§!\n\n弑星者基地已经彻底崩解。突击队引爆了热力振荡器，整颗武器化行星从内部裂开，被抽干的恒星在这个星系里重新点燃。\n\n而在基地内部的最后行动中，还发生了另一件事：§H汉·索罗§!穿过正在爆炸的走廊，走上反应炉上方那道没有护栏的窄桥，去叫自己儿子的名字。\n\n他被亲手杀死了。"
 foc_story.12.desc:0 "§L所有前线同时传来消息：旧有的平衡已经被打破。§!\n\n第一秩序旗舰§H至尊号§!断成了两截。\n\n一艘轻型运输舰以超空间速度正面撞穿了它——舰体、机库、护航舰队，在同一瞬间被同一道裂口切开。舰队指挥中枢与超空间追踪系统随之瓦解。\n\n那艘旗舰是六十公里宽的移动军工厂，是第一秩序的王座、船坞与首都。现在它是一片燃烧的残骸。"
 foc_story.13.desc:0 "§L所有前线同时传来消息：旧有的平衡已经被打破。§!\n\n我们的部队已经占领弑星者基地的控制中心。超级武器、固定防御空间站和恒星能量抽取系统全部落入我们手中。现在必须决定：彻底摧毁这件威胁银河的武器，还是将其转化为属于我们的力量。"
 foc_story.20.desc:0 "§L这场战争又失去了一件所有人曾以为不可摧毁的东西。§!\n\n最终秩序已经覆灭，帕尔帕廷的最后舰队也在火焰中消失。银河的旧秩序已经被战争摧毁，而胜利者必须决定接下来的一切：继承西斯留下的绝对权力，还是让银河重新走向合作与光明。"
 foc_story.21.desc:0 "§L这场战争又失去了一件所有人曾以为不可摧毁的东西。§!\n\n最终秩序的征服者已经宣布建立新的星海帝国，并要求所有独立国家立即承认皇帝的最高权威。臣服意味着加入新秩序；拒绝则意味着全面战争。"
 foc_story.23.desc:0 "§L舰桥上的星图重新刷新，战争的意义已经和几分钟前完全不同。§!\n\n最终秩序已经覆灭。击败帕尔帕廷最后舰队的胜利者正在决定银河未来的政治秩序。"
 foc_story.31.desc:0 "§L所有前线同时传来消息：旧有的平衡已经被打破。§!\n\n克瑞特已经落入第一秩序或最终秩序之手。\n\n盐层下的最后一道闸门被攻城炮轰开时，是§H卢克·天行者§!独自走出去，站在整支地面部队面前。他挡住了他们全部的火力，直到幸存者从后山的裂缝里撤出去——然后与原力合而为一。\n\n克瑞特防线已经崩溃，但幸存的抵抗力量仍可能在未知据点重组。现在必须由我们决定：自己的国家是向第一秩序屈服，还是保持独立并继续战斗。"
 foc_story.33.desc:0 "§L舰桥上的星图重新刷新，战争的意义已经和几分钟前完全不同。§!\n\n克瑞特已经陷落。\n\n§H卢克·天行者§!独自挡在闸门外，把整支地面部队拖在原地，直到幸存者从盐层下的裂缝逃进深空；随后他与原力合而为一。\n\n矿道里的防线已经瓦解，但那批人跑掉了，而且整个银河都听说了闸门外发生的事。"
 foc_supremacy_duel.2.desc:0 "§L两艘巨舰终于出现在同一片战场，所有战术预案在这一刻都失去了意义。§!\n\n至尊号与拉杜斯号终于进入同一片战场。第一秩序旗舰的炮火把周围空间照成白昼，抵抗组织舰队已经没有足够兵力继续正面对射。\n\n拉杜斯号忽然转向。舰桥没有再发送撤退航向，而是把舰首对准至尊号，随后启动超空间引擎。\n\n一道蓝白色裂痕贯穿整支第一秩序编队。两艘巨舰在几乎同一瞬间被撕成燃烧的残骸。"
 foc_thrawn.2.desc:0 "§L未知星域的一道超空间裂口重新打开，一个帝国最危险的战略家回到了棋盘上。§!\n\n银河和约后的冷战年代，阿索卡·塔诺与萨宾·辛格终于追上失踪多年的埃兹拉·布里杰；然而，流亡在遥远星系的§H索龙元帅§!也借暗夜姐妹之力重返银河。\n\n新共和国把相关警告视为边境小题大做，帝国残余却第一次重新拥有了一个真正懂得如何整合资源与制定长期战略的统帅。\n\n奇美拉号重新出现在帝国通讯网上时，许多多年不肯听命于任何人的总督同时回复了同一句话：元帅。"
 foc_wayfinder.3.desc:0 "§L古老西斯器物投射出一条不在任何公开星图上的航路，未知星域终于有了入口。§!\n\n西斯寻路仪已经完成解析。贾库的特殊星门锁定了位于孤立未知星域中的另一座星门，通往最终秩序首都的航路现已向全银河开放。"
 fop_ambition.2.desc:0 "§L征服星系只是第一层野心，真正的目标已经伸向现实与原力本身。§!\n\n§Y第一幕——银河战争§!\n唤醒弑星者基地，接收帝国残余，并令全银河认清真正的敌人。\n\n§Y第二幕——原力锁链§!\n第一个原力奴仆将为舰队带来更庞大的编制、更猛烈的炮火与更坚定的意志。\n\n§Y第三幕——银河支配§!\n三个国家臣服后，群星间的恐惧将进一步强化我们的舰队。\n\n§Y第四幕——奴役原力§!\n统治银河并完成§Y奴役原力§!；若曾拒绝艾克西戈，必须先赢得内战。\n\n§Y第五幕——虚境升神§!\n攻入原力之海，毁灭虚境化身，在无主神座上完成宇宙升神。"
 fop_origin.10.desc:0 "§L西斯永恒的祭坛重新点亮，一项比任何超级武器都更危险的计划正在成形。§!\n\n未知区域的黑暗掩护了我们的崛起。伊冷已被改造成第一秩序的冰封堡垒，至尊号静候于首都上空，通往帝国残余疆域的秘密航路也已显现。\n\n新共和国相信战争早已结束。很快，他们就会明白：帝国的阴影从未离去。"
 fop_origin.100.desc:0 "§L舰队能够征服疆域，而现在有人试图征服赋予生命与意志的力量本身。§!\n\n物质宇宙为之震颤，虚境归于永恒的寂静。统治者的意识越过肉体、死亡与时间，进入原力、群星和现实最深处的法则。\n\n第一秩序不再统治宇宙。第一秩序就是宇宙。"
 fop_origin.11.desc:0 "§L西斯永恒的祭坛重新点亮，一项比任何超级武器都更危险的计划正在成形。§!\n\n来自巴斯提恩的密电使用着只有帝国最高统帅部才掌握的古老密码。帝国残余没有把伊冷上的新政权视为竞争者，而是把第一秩序认作延续帝国意志的下一代。老去的舰队为我们打开航路，并以先辈的身份庇护尚未成熟的新秩序。\n\n但所有人都明白：继承者终有一天会比先辈更强大。"
 fop_origin.20.desc:0 "§L舰队能够征服疆域，而现在有人试图征服赋予生命与意志的力量本身。§!\n\n弑星者基地的核心已经苏醒。与此同时，来自帝国残余的效忠讯号传遍舰队频道：他们的战舰、星域与铸造世界从此归于第一秩序。\n\n恐惧把银河诸国聚到同一面战旗下。就连沉睡万年的古老帝国也已启动战争机器，准备阻止新秩序降临。\n\n然而，在更遥远的黑暗中，艾克西戈正在呼唤。二十年后，最终秩序将现身；失去至尊号或弑星者基地，只会让预言提前应验。"
 fop_origin.50.desc:0 "§L舰队能够征服疆域，而现在有人试图征服赋予生命与意志的力量本身。§!\n\n一道来自艾克西戈的黑暗讯号穿透虚空。死者的声音再次宣称自己是银河唯一的皇帝，西斯永恒的舰队则在风暴中等待命令。\n\n帕尔帕廷要求第一秩序献上旗帜与王座，成为最终秩序的利刃。我们可以接受召唤，亲自统率艾克西戈的军团；也可以拒绝亡者的统治，让银河在两种秩序的内战中燃烧。无论选择哪一条道路，通往原力神座的征途都不会终止。"
 fop_origin.55.desc:0 "§L原力正在反抗束缚，但每一次反抗都让新秩序更清楚下一步该如何下手。§!\n\n艾克西戈的风暴为新皇帝让路，西斯永恒舰队在无尽雷鸣中宣誓效忠。第一秩序的军政机器与艾克西戈的黑暗军团融为一体，最终秩序由此加冕。\n\n征服银河只是开始。原力本身也将戴上我们的锁链。"
 fop_origin.58.desc:0 "§L征服星系只是第一层野心，真正的目标已经伸向现实与原力本身。§!\n\n拒绝艾克西戈的召唤撕裂了第一秩序。野心家、边疆总督与动摇的附庸纷纷向最终秩序宣誓，昔日同袍的舰炮已经对准首都。\n\n伊冷、弑星者基地与至尊号仍在忠诚者手中。先粉碎伪皇帝的军团，再去夺取那凌驾众生的原力。"
 fop_origin.71.desc:0 "§L艾克西戈的雷暴从未停歇，而原力深处的回声正在变得越来越清晰。§!\n\n第一个帝国已经彻底屈服。亿万生命在同一时刻感到恐惧，他们的呼喊穿过原力，最终汇入我们的意志。\n\n第一条锁链已经铸成。"
 fop_origin.73.desc:0 "§L征服星系只是第一层野心，真正的目标已经伸向现实与原力本身。§!\n\n三个国家的集体意志已经并入新秩序。原力在每一次臣服中变得更加清晰，也更加容易控制。"
 fop_origin.75.desc:0 "§L征服星系只是第一层野心，真正的目标已经伸向现实与原力本身。§!\n\n群星之下再没有能够挑战我们王座的独立政权。无数生命的恐惧与服从在原力中汇聚，像潮水一样涌向同一个意志。\n\n最高领袖不再满足于统治使用原力的人。下一步，是让原力本身学会服从。"
 fop_origin.80.desc:0 "§L舰队能够征服疆域，而现在有人试图征服赋予生命与意志的力量本身。§!\n\n原力曾环绕一切生命，如今却只回应一个意志。银河的灵能潮汐已经逆转，群星间每一次恐惧与死亡都成为我们的力量。\n\n虚境发出最后的反抗，通往原力之海的裂口随之撕开。"
 fop_origin.82.desc:0 "§L原力正在反抗束缚，但每一次反抗都让新秩序更清楚下一步该如何下手。§!\n\n裂口另一端并非梦境，而是一片从未被凡人舰队征服的灵能国度。虚境意志唤醒腐化化身，环绕无主神座列阵。\n\n最后一场战争，将在现实之外打响。"
 fop_origin.91.desc:0 "§L原力正在反抗束缚，但每一次反抗都让新秩序更清楚下一步该如何下手。§!\n\n最后一个虚境化身在沉默中消散。原力之海停止翻涌，无主神座终于暴露在舰队面前。\n\n再没有守护者能够阻止升神仪式。"
 myk_starkiller.10.desc:0 "§L伊冷地壳深处的聚能井开始震动，整颗行星都在为一次射击而苏醒。§!\n\n随着最后一道装甲带封闭，行星深处的聚能核心开始轰鸣。横贯地壳的导能网络逐级点亮，整颗星球已不再是一个世界，而是一件足以改写银河命运的武器。弑星者基地现已进入战备状态，等待最高统帅部指定第一个目标。"
 myk_starkiller.300.desc:0 "§L没有舰队能够复制这种火力；一旦确认目标，整片星空都将见证结果。§!\n\n弑星者目标信标已经建立。使用“摧毁目标宜居星球”会摧毁信标所在星系内所有宜居/可殖民星球；使用“摧毁目标星系”会摧毁整个星系。"
 myk_starkiller.310.desc:0 "§L恒星能量沿着行星内部的巨型导管奔涌，超级武器正在进入战斗状态。§!\n\n弑星者基地已经锁定目标信标。确认后，主炮阵列将直接进入蓄能程序并对目标开火。"
 myk_starkiller.315.desc:0 "§L恒星能量沿着行星内部的巨型导管奔涌，超级武器正在进入战斗状态。§!\n\n弑星者基地已经完成打击，目标信标已被移除。"
 myk_starkiller_dyson.8090.desc:0 "§L弑星者基地的火控大厅亮起红色警示，全息星图上只剩等待确认的目标。§!\n\n§H[event_target:myk_starkiller_target_system.GetName]星系§!已经锁定。请选择打击方式。“摧毁所有宜居星球”将搜索该星系内一切能够维持生命或殖民活动的世界；普通行星会在光束中崩解，环世界区段则化为破碎残骸。只有确认打击方式或具体天体后，180天蓄能程序才会开始；命中后基地还需180天重新汇聚恒星能量。"
 myk_starkiller_dyson.8102.desc:0 "§L弑星者基地的火控大厅亮起红色警示，全息星图上只剩等待确认的目标。§!\n\n请选择§H[event_target:myk_starkiller_target_system.GetName]星系§!内要单独摧毁的天体。列表包含该星系内的非恒星天体，并按页显示。确认目标后才开始180天开火流程。"
 sai_supremacy_arkship.19.desc:0 "§L移动首都的战略大厅重新开启，至尊号本身就是一整套等待部署的战争体系。§!\n\n至尊号不仅是一艘旗舰，也是一座移动首都、造船基地与战争机器。最高统帅部正在等待新的部署命令。"
