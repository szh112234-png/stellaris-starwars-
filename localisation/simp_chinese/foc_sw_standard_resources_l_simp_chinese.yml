l_simp_chinese:
 sr_tibanna_swgs:0 "提亚巴纳气体"
 sr_tibanna_swgs_desc:0 "广泛用于爆能武器与涡轮激光的高能气体。FOC标准装备体系将其作为常规星战舰炮工业的基础战略资源。"
 sr_kyber_swgs:0 "凯伯水晶"
 sr_kyber_swgs_desc:0 "能够聚焦并放大能量的稀有晶体。FOC标准装备体系将其限制在顶级舰炮、轴基武器与超级武器领域。"
 d_foc_kyber_crystal_veins:0 "凯伯晶脉"
 d_foc_kyber_crystal_veins_desc:0 "该世界拥有可开采的天然凯伯水晶矿脉。"
 d_foc_kyber_crystals_orbital_1:0 "凯伯水晶矿藏"
 d_foc_kyber_crystals_orbital_1_desc:0 "此天体检测到少量可进行轨道开采的凯伯水晶。"
 d_foc_tibanna_gas_2:0 "小型提亚巴纳气体矿藏"
 d_foc_tibanna_gas_3:0 "提亚巴纳气体矿藏"
 d_foc_tibanna_gas_6:0 "大型提亚巴纳气体矿藏"
 job_foc_kyber_miner:0 "凯伯矿工"
 job_foc_kyber_miner_plural:0 "凯伯矿工"
 job_foc_kyber_miner_desc:0 "使用专用勘探、切割与稳定设备开采天然凯伯晶脉。"
 mod_job_foc_kyber_miner_add:0 "凯伯矿工岗位"
 foc_tech_tibanna_mining:0 "提亚巴纳气体开采"
 foc_tech_tibanna_mining_desc:0 "建立稳定的提亚巴纳气体勘探、抽取与储运体系。"
 foc_tech_tibanna_mining_1:0 "提亚巴纳开采优化"
 foc_tech_tibanna_mining_1_desc:0 "优化提亚巴纳气体矿区的抽取流程与设备利用率。"
 foc_tech_tibanna_mining_2:0 "提亚巴纳开采增强"
 foc_tech_tibanna_mining_2_desc:0 "将更先进的工业技术应用于提亚巴纳气体生产。"
 foc_tech_tibanna_mining_3:0 "提亚巴纳开采放大"
 foc_tech_tibanna_mining_3_desc:0 "扩大高压气藏的安全采集规模。"
 foc_tech_tibanna_mining_4:0 "提亚巴纳气体精炼"
 foc_tech_tibanna_mining_4_desc:0 "提高原始提亚巴纳气体的纯度与军工可用率。"
 foc_tech_tibanna_mining_5:0 "优化提亚巴纳精炼"
 foc_tech_tibanna_mining_5_desc:0 "高度自动化的精炼流程进一步提高提亚巴纳产出。"
 foc_tech_kyber_mining:0 "凯伯水晶开采"
 foc_tech_kyber_mining_desc:0 "建立寻找、稳定和开采凯伯水晶所需的专业工业体系。"
 foc_tech_kyber_mining_1:0 "凯伯开采优化"
 foc_tech_kyber_mining_1_desc:0 "改进凯伯晶脉探测与无损采集流程。"
 foc_tech_kyber_mining_2:0 "凯伯开采增强"
 foc_tech_kyber_mining_2_desc:0 "利用先进材料工程提高高品质凯伯水晶回收率。"
 foc_tech_kyber_mining_3:0 "凯伯开采放大"
 foc_tech_kyber_mining_3_desc:0 "在保持晶体稳定性的前提下扩大凯伯矿业产能。"

 mod_country_sr_tibanna_swgs_produces_mult:0 "提亚巴纳气体产出"
 mod_country_sr_kyber_swgs_produces_mult:0 "凯伯水晶产出"
 d_foc_kyber_crystals_orbital_3:0 "大型凯伯水晶矿藏"
 d_foc_kyber_crystals_orbital_3_desc:0 "第二阶固定凯伯产地，轨道基础产量为3。"
 d_foc_kyber_crystals_orbital_6:0 "巨型凯伯水晶矿藏"
 d_foc_kyber_crystals_orbital_6_desc:0 "最高储量固定凯伯核心产地，轨道基础产量为6。"

 d_foc_kyber_crystal_veins_low:0 "三级凯伯晶脉"
 d_foc_kyber_crystal_veins_low_desc:0 "低储量固定凯伯产地。该行星特征基础每月产出 §Y25§! 凯伯水晶。"
 d_foc_kyber_crystal_veins_medium:0 "二级凯伯晶脉"
 d_foc_kyber_crystal_veins_medium_desc:0 "中高储量固定凯伯产地。该行星特征基础每月产出 §Y50§! 凯伯水晶。"
 d_foc_kyber_crystal_veins_high:0 "一级巨型凯伯晶脉"
 d_foc_kyber_crystal_veins_high_desc:0 "最高储量凯伯核心产地。该行星特征基础每月产出 §Y100§! 凯伯水晶。"
 d_foc_kyber_crystals_orbital_1_desc:0 "银河地图战略资源标记，仅提供 1 点轨道凯伯产出；主要产能来自行星凯伯晶脉特征。"
 d_foc_kyber_crystals_orbital_3_desc:0 "银河地图战略资源标记，仅提供 1 点轨道凯伯产出；主要产能来自行星凯伯晶脉特征。"
