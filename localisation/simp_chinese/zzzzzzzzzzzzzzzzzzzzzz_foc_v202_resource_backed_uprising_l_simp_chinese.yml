l_simp_chinese:
 foc_rebel_growth.2.name:0 "新星系的战利品"
 foc_rebel_growth.2.desc:0 "一个新控制的殖民星系加入了帝国叛军。当地造船厂与补给仓库可以提供一支战斗群，也可以转交等值合金预算并加入舰队补给网络。\n\n§Y二选一：20艘MC80，或29800合金并叠加舰船维护费−5%。§!\n合金奖励按奖励版MC80完整设计的基础合金造价核算：每艘1490合金（舰体与配件），20艘共29800，不按各国临时折扣浮动。每个符合条件的星系仅结算一次。"
 foc_rebel_growth.2.a:0 "立即编成20艘MC80舰队。"
 foc_rebel_growth.2.b:0 "获得29800合金，并扩充舰队后勤（舰船维护费−5%，可叠加）。"
 foc_gcw.32.name:0 "维持边境地下抵抗"
 foc_gcw.32.desc:0 "帝国边境的一颗星球愿意建立长期地下组织，但他们无法凭空获得安全屋、武器、身份文件与加密通讯。我们必须每年继续投入资源，反抗力量才会从秘密细胞发展为地下网络，并最终由当地居民发动公开起义。\n\n一次只会维持一个目标。只有帝国的机动军事舰队进入星系才会压制叛乱活动；恒星基地、防御平台、科研船、工程船、殖民船和运输船均不计入驻防舰队。帝国获得死星后，这条特殊支援线将永久关闭。"
 foc_gcw.32.a:0 "投入2000能量、1000合金与500凝聚力。"
 foc_gcw.32.b:0 "今年不提供支援。"
 operation_foc_gcw_instigate_system_uprising_desc:0 "§R仅能针对银河帝国发动。§!\n\n选择一个没有帝国机动军事舰队驻留、且已结束当地镇压冷却的殖民星系，建立反抗细胞、扩张地下网络并输送武器，最终由当地星球发动公开起义。行动本身不会直接赠送星系，起义仍通过帝国的正常应对事件结算。\n\n§Y行动可重复发动，不是一次性行动。§!每次仍需10点间谍网力量、180影响力，进行期间每月消耗12能量。上一场行动完成或取消后，只要仍有合格目标即可再次筹备；现有目标选择流程一次只保留一场此类行动。\n\n只有帝国机动军事舰队会阻止或中断行动；恒星基地、防御平台、科研船、工程船、殖民船和运输船不计入阻止行动的驻军。"
 foc_gcw_active.40.desc:0 "一切已经就绪。§Y[event_target:foc_gcw_active_uprising_target_system.GetName]§!星系的地下组织正在等待最后的密码指令。信号发出后，当地星球将发动公开起义；帝国仍有机会调集资源镇压，但行动本身不会直接把星系交给义军。"
 FOC_V202_DEATH_STAR_PROJECT_EMERGENCY:0 "死星一号紧急工程"
 FOC_V202_DEATH_STAR_PROJECT_EMERGENCY_DESC:0 "帝国叛军总舰队战力已经超过帝国。该一次性紧急工程只需要常规死星一号项目§H四分之一§!的工程学研究：§Y15000§!。"
 FOC_V202_DEATH_STAR_II_PROJECT_EMERGENCY:0 "死星二号紧急建造计划"
 FOC_V202_DEATH_STAR_II_PROJECT_EMERGENCY_DESC:0 "集中工程力量，在恩多加速建造死星二号。完成后触发博桑谍报事件，并生成移速为0的未完工死星二号。完工与机动改装仍是单独的玩家可选项目。"