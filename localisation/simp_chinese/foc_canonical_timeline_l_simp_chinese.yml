l_simp_chinese:
 foc_canon.ok:0 "继续。"
 foc_canon.10.name:0 "莫蒂斯：天选之子的预言"
 foc_canon.10.desc:0 "阿纳金、欧比旺与阿索卡被卷入原力圣地莫蒂斯。父亲、女儿与儿子的冲突让阿纳金第一次直面自己可能带来的毁灭，也让‘天选之子’的预言露出了最危险的一面。\n\n三位原力至尊最终陨落，但那段经历没有真正消失。它会在未来最黑暗的时刻重新回响。"
 foc_canon.11.name:0 "曼达洛：暗影集体"
 foc_canon.11.desc:0 "死而复生的达斯·摩尔联合黑道势力组成暗影集体并夺取曼达洛。萨廷女公爵在欧比旺面前被摩尔杀害，曼达洛由此滑入又一轮内战。\n\n这场私人复仇也把一颗本想置身克隆人战争之外的星球重新拖回银河风暴。"
 foc_canon.12.name:0 "芯片故障与判官计划"
 foc_canon.12.desc:0 "克隆人士兵图克的抑制芯片提前失控并枪杀绝地。共和国把事件当成医疗事故处理，但真正的命令已经藏在数百万克隆人的脑中。\n\n与此同时，一批被俘或堕落的绝地被秘密筛选。日后帝国用于猎杀幸存者的§H判官团§!，已经在黑暗中成形。"
 foc_canon.13.name:0 "绝地圣殿爆炸案"
 foc_canon.13.desc:0 "巴里斯·奥菲策划圣殿爆炸并将罪名嫁祸给阿索卡·塔诺。阿索卡被自己曾经信任的体制审判；真相揭开后，绝地委员会虽然提出让她回归，她仍拒绝了。\n\n§H阿索卡离开绝地武士团。§! 她不是投向黑暗，而是不再相信委员会能够看见自己正在变成什么。"
 foc_canon.14.name:0 "尤达：死后之道"
 foc_canon.14.desc:0 "尤达循着奎刚·金的声音完成五位原力祭司的试炼，学会在肉身消亡后保持意识。\n\n战争仍在继续，但尤达已经明白：绝地真正要准备的，可能不是下一场胜利，而是如何在一个被西斯统治的时代留下火种。"
 foc_canon.20.name:0 "坏批次：帝国成立第一年"
 foc_canon.20.desc:0 "克隆人99号突击队拒绝彻底服从66号令，带着欧米伽逃离帝国体系。卡米诺的克隆设施随后遭到帝国摧毁，持续十余年的克隆人军制开始被普通征募兵取代。\n\n共和国的军队没有退役——它只是被帝国拆掉了最后一点旧身份。"
 foc_canon.21.name:0 "科雷利亚：年轻的韩·索罗"
 foc_canon.21.desc:0 "年轻的韩·索罗逃离科雷利亚，在帝国阴影下成为走私者。他结识楚巴卡，从蓝多·卡瑞辛手中赢得§H千年隼号§!，并在科舍尔航道完成那次后来被吹嘘成“十二秒差距”的疯狂航行。\n\n此时的韩只想活下去，还不知道自己终有一天会成为反抗军最著名的英雄之一。"
 foc_canon.22.name:0 "布拉卡：陨落的绝地"
 foc_canon.22.desc:0 "隐藏在布拉卡拆船场的绝地学徒§H卡尔·凯斯蒂斯§!为了救同伴被迫暴露身份。追捕将他带向一份记录原力敏感儿童的星图，也最终把他带入帝国判官要塞。\n\n卡尔选择亲手毁掉星图。只要帝国仍在猎杀绝地，知道那些孩子的位置就不是希望，而是一张死亡名单。"
 foc_canon.23.name:0 "莱雅获救，欧比旺牺牲"
 foc_canon.23.desc:0 "斯卡里夫传出的希望终于抵达了营救队手中。卢克与同伴闯入帝国的拘押设施，救出了§H莱雅·奥加纳§!。撤离途中，§H欧比旺·克诺比§!独自迎战达斯·维达，为他们争取最后的逃生时间。\n\n欧比旺牺牲了。他离开现役指挥岗位，却以绝地英灵的身份继续在原力中引导卢克。\n\n确认行动结果后，莱雅携带的完整图纸送达义军指挥部：义军获得§H对护盾伤害 +50%§!，与死星一号同处一个星系时启用攻击解算。莱雅正式加入指挥体系仍遵循她自己的战时历程，蒙·莫斯马继续领导义军。"
 foc_canon.24.name:0 "塔纳洛尔：隐秘通道的彼岸"
 foc_canon.24.desc:0 "卡尔·凯斯蒂斯找到隐藏于危险超空间异常之后的§H塔纳洛尔§!。这颗难以抵达的世界成为“隐秘通道”难民与幸存绝地可能永远躲开帝国的避难所。"
 foc_canon.25.name:0 "阿尔达尼劫案"
 foc_canon.25.desc:0 "卡西安·安多被卢森·雷尔招募，参与袭击阿尔达尼帝国金库。帝国把这次大胆的劫案视作对统治权的公开羞辱，并以§H《银河防务法令》§!进行全面报复。\n\n镇压升级，同时也让越来越多彼此孤立的反抗组织意识到：他们面对的是同一个敌人。"
 foc_canon.26.name:0 "塔图因：最后的宿怨"
 foc_canon.26.desc:0 "达斯·摩尔追踪欧比旺来到塔图因。两人的最后一次决斗短得惊人。摩尔倒下前终于确认，欧比旺守护的并不是一片沙漠，而是某个仍可能终结西斯的人。"
 foc_canon.27.name:0 "微暗之火"
 foc_canon.27.desc:0 "赫拉·辛格诞下她与凯南·贾勒斯的儿子杰森。战争夺走了一代又一代人，但原力并没有随绝地圣殿一起消失。\n\n一个出生在义军时代的孩子，将在新共和国时代长大。"
 foc_canon.30.name:0 "曼达洛光复"
 foc_canon.30.desc:0 "丁·贾林、博-卡坦与重新集结的曼达洛氏族击溃吉迪恩总督的残部，夺回母星。格洛古选择回到丁·贾林身边；波巴·费特则在塔图因建立了自己的势力。\n\n经历帝国大清洗后，曼达洛第一次真正开始重建。"
 foc_canon.31.name:0 "伊冷工程：弑星者基地动工"
 foc_canon.31.desc:0 "第一秩序的工程部队彻底封锁伊冷。凯伯水晶矿脉被扩大成贯穿地壳的工业设施，整颗星球开始被改造成一件能够抽取恒星能量的超级武器。\n\n工程代号没有出现在任何公开档案里。如此规模的建设正在持续抽走第一秩序的合金与船坞产能，在基地完工前，常规舰队扩建将不得不为超级武器让路。后来银河会用另一个名字记住它：§H弑星者基地§!。"
 foc_canon.40.name:0 "克里斯托夫西斯战役"
 foc_canon.40.desc:0 "§H克里斯托夫西斯§!已经完全脱离邦联控制。年轻的阿索卡·塔诺在这场战役中被正式分配给阿纳金·天行者作为学徒。\n\n§Y克里斯托夫西斯战役完成，并记录独立战役时间锚点。§!"
 foc_canon.41.name:0 "曼达洛围攻战"
 foc_canon.41.desc:0 "邦联已经失去§H曼达洛§!星系的完整控制权。阿索卡与第332连结束了摩尔政权对曼达洛的统治。\n\n§Y曼达洛围攻战完成，并记录独立战役时间锚点。§!"
 foc_canon.42.name:0 "马拉科悲剧"
 foc_canon.42.desc:0 "阿索卡跟随义军抵达§H马拉科§!后，与达斯·维达正面对决。凯南在冲突中被摩尔刺瞎双眼，阿索卡为了掩护同伴留下迎战，并最终通过“世界之间的世界”从必死结局中消失。\n\n同一时期，萨宾·辛格重新寻获§H暗黑光剑§!，并把它交给博-卡坦，希望借这件曼达洛圣物重新统一各氏族。"
 foc_canon.43.name:0 "洛塔解放战"
 foc_canon.43.desc:0 "帝国已经失去§H洛塔§!星系的完整控制权。凯南·贾勒斯为伙伴撤离而牺牲，埃兹拉·布里杰随后呼唤普尔吉尔，将索龙与奇美拉号拖入未知深空。\n\n§Y洛塔解放战完成，并记录独立战役时间锚点。§!"
 foc_canon.44.name:0 "斯卡里夫战役"
 foc_canon.44.desc:0 "帝国已经失去§H斯卡里夫§!星系的完整控制权。义军突击队成功把死星蓝图送出档案设施，轨道封锁也被突破。\n\n这是一场代价惨重的胜利，但蓝图已经送出。"
 foc_canon.45.name:0 "雅文战役"
 foc_canon.45.desc:0 "§H死星一号已被摧毁。§!巨大空间站的毁灭被记录为雅文战役的胜利。\n\n§H威尔霍夫·塔金总督§!拒绝撤离，最终与战斗空间站一同死亡。帝国失去了它赖以震慑银河的武器，而义军为这场胜利付出了沉重代价。"
 foc_canon.46.name:0 "霍斯战役"
 foc_canon.46.desc:0 "抵抗帝国的力量已经§H完全失去霍斯星系控制权§!。回音基地撤离结束，幸存舰队突破封锁进入深空。\n\n帝国取得了霍斯，但没有消灭反抗。"
 foc_canon.47.name:0 "恩多战役"
 foc_canon.47.desc:0 "帝国已经失去§H恩多§!星系的完整控制权。第二颗死星与帝国最高权力结构同时在这场战役中崩溃。\n\n§Y恩多战役完成，并记录独立战役时间锚点。§!"
 foc_canon.48.name:0 "千泪之夜"
 foc_canon.48.desc:0 "帝国对§H曼达洛§!的毁灭性清洗已经完成。轰炸不是为了占领，而是为了摧毁氏族继续反抗的物质基础。\n\n幸存者将这一夜称为§H千泪之夜§!。"
 foc_canon.49.name:0 "贾库终焉战役"
 foc_canon.49.desc:0 "银河帝国及其残余已经§H完全失去贾库星系控制权§!。这场最后的大规模会战结束了帝国在这里继续组织战争的能力。\n\n§Y贾库战役完成，并记录独立战役时间锚点。§!"
 foc_canon.50.name:0 "迪卡撤退战"
 foc_canon.50.desc:0 "抵抗军曾经控制的§H迪卡星系§!已经完全失守。轨道控制权丧失后，固定基地无法继续存在，幸存者把人员与指挥系统转移到拉杜斯号。"
 foc_canon.51.name:0 "克赖特战役"
 foc_canon.51.desc:0 "抵抗军曾经控制的§H克赖特星系§!已经完全失守。卢克·天行者用跨星系的原力投影拖住追兵，为幸存者撤离争取最后的时间。"
 foc_canon.52.name:0 "厄西戈决战"
 foc_canon.52.desc:0 "§H厄西戈§!上空已经爆发终局决战。帕尔帕庭公开宣布西斯归来，拥有灭星炮的最终秩序舰队开始升空。\n\n兰多与楚巴卡带来的不是某个中央政府的正规军，而是来自全银河的平民、走私者和地方防卫舰组成的庞大§H人民舰队§!。地面西斯圣殿内，雷伊正在历代绝地英灵的呼唤中面对帕尔帕庭；班·索罗也已在莱娅最后的呼唤中重新选择光明。\n\n这一次，整个银河都来结束西斯。"
 foc_canon.28.name:0 "塔图因：沙拉克之坑逃生"
 foc_canon.28.desc:0 "卢克·天行者返回塔图因营救汉·索罗。贾巴的犯罪集团在卡孔大坑覆灭，波巴·费特坠入沙拉克后仍侥幸生还。\n\n几乎在同一时期，尤达大师在达戈巴走完了九百年的生命。卢克失去了最后一位旧绝地导师，却也终于必须独自面对维达与皇帝。"
 foc_canon.29.name:0 "灰烬行动"
 foc_canon.29.desc:0 "恩多之后仍效忠皇帝的帝国军开始执行预先留下的§H灰烬行动§!。轨道轰炸与焦土命令并不是为了夺回银河，而是为了惩罚一个“没能保护皇帝”的帝国。\n\n在混乱中，新共和国宣布成立；与此同时，一部分最精锐的帝国舰队开始向未知星域撤离。"
 foc_canon.32.name:0 "厄西戈：西斯火种未熄"
 foc_canon.32.desc:0 "《银河和约》并没有真正终结西斯。厄西戈的西斯永恒邪教徒利用克隆与基因工程拼接出帕尔帕庭残缺的新肉身，并在星球地下船坞秘密铺设一支规模惊人的舰队。\n\n帝国公开投降的同一年，§H第一秩序§!与§H最终秩序§!的种子已经在未知星域生根。"
 foc_canon.15.name:0 "红刃诞生"
 foc_canon.15.desc:0 "达斯·维达前往阿林多星追杀一名躲过66号令的绝地幸存者。维达夺走对方的凯伯水晶，并在西斯仪式中以愤怒与痛苦强迫水晶“流血”。\n\n从这一刻起，那柄刺目的§R红色光剑§!成为帝国最令人恐惧的标志之一。"
 foc_canon.33.name:0 "索龙归来"
 foc_canon.33.desc:0 "阿索卡·塔诺与萨宾·辛格跨越星海寻找失踪多年的埃兹拉·布里杰。埃兹拉被寻回，而§H索龙元帅§!也借助暗夜姐妹的力量重新返回银河，试图整合帝国残余。\n\n新共和国高层却把警告视为夸大其词。一个本应震动银河的战略威胁，被和平年代的官僚体系当成了边境杂音。"
 foc_canon.39.name:0 "吉奥诺西斯战役"
 foc_canon.39.desc:0 "§H吉奥诺西斯§!已经完全脱离邦联控制，共和国取得了整个星系的控制权。克隆军与机器人军团的第一次大战以邦联撤出这一战略支点告终。\n\n§Y吉奥诺西斯战役完成，并记录独立战役时间锚点。§!"
 foc_canon.16.name:0 "穆斯塔法清洗：分离主义的终结"
 foc_canon.16.desc:0 "66号令之后，维达抵达§H穆斯塔法§!。邦联主力虽然已经停战，但分离主义议会仍把这里当作最后避难所。\n\n维达清洗议会并关闭残余机器人指挥网络；共和国随后取得穆斯塔法的完整控制权，残存的独立星系邦联正式灭亡。"
 foc_canon.34.name:0 "奥德兰毁灭"
 foc_canon.34.desc:0 "逃离斯卡里夫的图纸仍在辗转传递，莱雅已落入帝国手中。塔金将死星一号的超级激光瞄准§H奥德朗§!，试图用她的家园换取义军基地的位置。\n\n只要这座战斗空间站仍能开火，下一道命令便会让整颗星球毁灭。义军必须救出莱雅，将完整情报带回，才能完成对死星的攻击解算。"
