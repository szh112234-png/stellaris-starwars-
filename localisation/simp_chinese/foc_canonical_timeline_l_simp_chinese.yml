 foc_canon.53.name:0 "支点：阿索卡归来"
 foc_canon.53.desc:0 "义军同盟已经从分散的抵抗组织成长为公开反抗帝国的力量。一名曾经离开绝地武士团、又从66号令中幸存下来的老朋友重新出现在秘密通讯网络中。\n\n§H阿索卡·塔诺§!以代号“支点（Fulcrum）”加入义军。她不再代表绝地委员会，而是以自己的选择投入这场战争。\n\n§Y阿索卡作为真实指挥官加入义军领袖池。§!"
