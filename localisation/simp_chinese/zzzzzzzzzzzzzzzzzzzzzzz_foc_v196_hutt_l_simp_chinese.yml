 FOC_V196_HUTT_CRIMINAL_EMPIRE:0 "赫特犯罪帝国"
 FOC_V196_HUTT_CRIMINAL_EMPIRE_ADJ:0 "赫特"
 FOC_V196_HUTT_PRESET:0 "赫特犯罪帝国"
 FOC_V196_HUTT_SPECIES_BIO:0 "古老而长寿的赫特卡吉迪克家族将贸易、贡赋与有组织犯罪编织成一张遍布外环的企业地下网络。"
 FOC_V196_HUTT_RULER_NAME:0 "贾巴·德西利吉奇·蒂尔"
 FOC_V196_HUTT_RULER_TITLE:0 "赫特大君"
 origin_foc_hutt_criminal_empire:0 "赫特犯罪帝国"
 origin_foc_hutt_criminal_empire_desc:0 "赫特卡吉迪克家族以纳尔赫塔为核心建立犯罪企业国家，并由塔图因与那沙达支撑其外环地下帝国。"
 origin_foc_hutt_criminal_empire_effects:0 "§Y开局效果：§!\n- 从§H银河共和国世代§!开始，科洛桑会建立AI银河共和国\n- 需要§H企业§!权力制度与§H罪恶世家§!国民理念\n- 玩家直接拥有§H塔图因§!、§H纳尔赫塔§!与§H那沙达§!\n- §H纳尔赫塔§!成为首都，临时引擎母星会被移除\n- 不会额外生成一个AI赫特帝国"
 START_SCREEN_FOC_HUTT_CRIMINAL_EMPIRE:0 "很久很久以前，在遥远的银河系……\n\n长久以来，赫特卡吉迪克家族始终把法律、商业和犯罪视作同一种权力工具。从纳尔赫塔的沼泽，到那沙达灯火通明的高塔，再到塔图因的荒漠港口，契约与血债织成了横跨外环的网络。\n\n银河共和国仍在科洛桑统治，而纳布危机正开始打破漫长的和平。远离议会权威的外环，各大家族已在一个犯罪企业帝国之下联合起来。每条走私航线都是贸易线，每笔保护费都是贡赋，每个遥远市场都是新的猎物。"
