 foc_republic_origin.192.name:0 "霍斯尼亚陨落：新共和国改组为抵抗组织"
 foc_republic_origin.192.desc:0 "§H霍斯尼亚不存在了。§!首都、议会和中央指挥体系被弑星者基地一击摧毁，其余共和国领土迅速落入第一秩序之手。\n\n但新共和国并未被脚本删除，也没有另建一个同名继承国。幸存政府、舰队与领袖在§H迪卡§!继续存在，同一个国家对象直接改组为§H抵抗组织§!。玩家身份、科技、传统、国库、舰队与唯一的历史领袖全部保留；重复的莱雅、卢克、蒙·莫斯马、阿克巴、拉杜斯与兰多副本已被合并。"
 foc_republic_origin.192.a:0 "共和国已逝，但我们仍是同一支抵抗力量。"
