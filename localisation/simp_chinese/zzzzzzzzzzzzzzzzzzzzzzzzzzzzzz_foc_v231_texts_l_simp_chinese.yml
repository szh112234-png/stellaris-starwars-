 trait_robot_battledroid:0 "战斗机器人"
 trait_robot_battledroid_desc:0 "为战争而生的四级机器人，除此之外别无用途。单体脆弱，几乎无法从幸存的战斗中积累经验，但装配速度与成本远低于训练任何一名有机士兵。"
 trait_robot_tacticaldroid:0 "战术机器人"
 trait_robot_tacticaldroid_desc:0 "在缺乏有机指挥官时负责统率军队的指挥型机器人。持续处理战场数据，重算胜算的速度超过任何参谋军官，代价是相当高昂的维护开销。"
