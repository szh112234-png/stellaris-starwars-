l_simp_chinese:
 foc_v232i_conquest_reward_name:0 "新星系的支援"
 foc_v232i_conquest_reward_desc:0 "一个新控制的殖民星系加入了帝国叛军。当地造船厂与补给仓库可以提供一支战斗群，也可以转交等值合金预算并加入舰队补给网络。\n\n§Y二选一：20艘MC80，或29800合金并叠加舰船维护费−5%。§!\n合金奖励按奖励版MC80完整设计的基础合金造价核算：每艘1490合金（舰体与配件），20艘共29800，不按各国临时折扣浮动。每个符合条件的星系仅结算一次。"
 foc_v232i_conquest_reward_queue_desc:0 "$foc_v232i_conquest_reward_desc$\n\n当前待领取：§Y[Root.foc_v232i_pending_conquest_rewards]§!份（含本次）。本次只结算一份；选择后继续处理下一份，不会重复计算同一星系。"
 foc_v232i_conquest_reward_fleet:0 "接收20艘MC80舰队。"
 foc_v232i_conquest_reward_resources:0 "接收29800合金，舰船维护费再降低5%。"
 foc_v232i_liberated_system_logistics:0 "解放星系舰队后勤"
 foc_v232i_liberated_system_logistics_desc:0 "每选择一次新星系的物资支援，舰船维护费修正叠加−5个百分点。1次为−5%，2次为−10%，3次为−15%。本修正保留原有义军时代的退场规则，银河条约后清除。"
 mod_commander_skill_levels:0 "指挥官最高技能等级"
