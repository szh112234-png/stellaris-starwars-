l_simp_chinese:
 FOC_SITH_WAYFINDER_GATE:0 "西斯寻路星门"
 FOC_SITH_WAYFINDER_PROJECT:0 "西斯寻路仪"
 FOC_SITH_WAYFINDER_PROJECT_DESC:0 "摧毁最终秩序飞船、获得凯洛·伦或完成贾库挖掘，任意完成一项即可取得寻路仪线索。首个成功解析线索的国家会获得实体§Y西斯寻路仪§!遗物并立即掌握前往厄西戈的安全航路；其他国家仍可继续解析自己的线索获得坐标，因此不会因为AI抢先获得遗物而被永久封锁。若最终秩序公开活动持续三年，银河各主要势力最终还会拼凑出一条应急进攻航路。"
 foc_wayfinder.3.name:0 "通往未知星域的航路"
 foc_wayfinder.3.desc:0 "我们已经完成寻路仪线索的解析。贾库的特殊星门锁定了厄西戈方向的隐藏航路。若我们是首个成功完成解析的势力，实体西斯寻路仪也已被收入遗物库；即使它已经落入别国手中，这份坐标也足以让我们的舰队安全进入未知星域。"
 foc_wayfinder.3.a:0 "记录坐标，准备进入厄西戈。"
 foc_sith_wayfinder_gate:0 "西斯寻路星门"
 foc_sith_wayfinder_gate_DESC:0 "一座通往未知星域某处星系的特殊星门。"
 NAME_FOC_SITH_WAYFINDER_JAKKU_GATE:0 "未知星域星门"
 NAME_FOC_SITH_WAYFINDER_EXEGOL_GATE:0 "厄西戈西斯寻路星门"

 foc_wayfinder.8.name:0 "厄西戈应急航路"
 foc_wayfinder.8.desc:0 "最终秩序持续公开行动留下了足够多的航迹、引力扰动和通信残片。即使我们没有掌握实体西斯寻路仪，情报部门也终于拼凑出了一条风险更高、但可供主力舰队使用的厄西戈进攻航路。"
 foc_wayfinder.8.a:0 "不会再有任何遗物把我们挡在战争之外。"
