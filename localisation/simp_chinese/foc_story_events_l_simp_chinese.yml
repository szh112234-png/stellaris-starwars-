l_simp_chinese:
 foc_story.10.name:0 "新共和国的毁灭"
 foc_story.10.desc:0 "霍斯尼亚的居民抬头看天，看见的是白天。\n\n那道光束穿过超空间抵达时，没有任何预警系统来得及响应。银河议会、共和国海军驻扎港、整个首都圈，连同数十亿人，在几秒钟之内变成了恒星爆发中的一层灰。\n\n新共和国失去了中央政府，失去了政治象征，也失去了大部分舰队——它们当时正停在港里。\n\n剩下的抵抗力量只能分散撤退。"
 foc_story.10.a:0 "共和国的时代结束了。"

 foc_story.11.name:0 "弑星者基地的毁灭与汉·索罗之死"
 foc_story.11.desc:0 "弑星者基地已经彻底崩解。突击队引爆了热力振荡器，整颗武器化行星从内部裂开，被抽干的恒星在这个星系里重新点燃。\n\n而在基地内部的最后行动中，还发生了另一件事：§H汉·索罗§!穿过正在爆炸的走廊，走上反应炉上方那道没有护栏的窄桥，去叫自己儿子的名字。\n\n他被亲手杀死了。"
 foc_story.11.a:0 "愿原力与他同在。"

 foc_story.12.name:0 "至尊号的毁灭"
 foc_story.12.desc:0 "第一秩序旗舰§H至尊号§!断成了两截。\n\n一艘轻型运输舰以超空间速度正面撞穿了它——舰体、机库、护航舰队，在同一瞬间被同一道裂口切开。舰队指挥中枢与超空间追踪系统随之瓦解。\n\n那艘旗舰是六十公里宽的移动军工厂，是第一秩序的王座、船坞与首都。现在它是一片燃烧的残骸。"
 foc_story.12.a:0 "第一秩序失去了它的王座。"

 foc_story.13.name:0 "弑星者基地的命运"
 foc_story.13.desc:0 "我们的部队已经占领弑星者基地的控制中心。超级武器、固定防御空间站和恒星能量抽取系统全部落入我们手中。现在必须决定：彻底摧毁这件威胁银河的武器，还是将其转化为属于我们的力量。"
 foc_story.13.a:0 "摧毁弑星者基地。"
 foc_story.13.a.tooltip:0 "§R摧毁武器化行星、弑星者巨构及其防御环。§!\n银河将不必再活在这件超级武器的阴影下，并获得§Y25000§!凝聚力。"
 foc_story.13.b:0 "接管弑星者基地。"
 foc_story.13.b.tooltip:0 "保留弑星者基地及其防御环、武库与开火能力。第一秩序和最终秩序将把我们视为夺走其终极武器的死敌。"

 foc_story.20.name:0 "最后的绝地武士"
 foc_story.20.desc:0 "最终秩序已经覆灭，帕尔帕廷的最后舰队也在火焰中消失。银河的旧秩序已经被战争摧毁，而胜利者必须决定接下来的一切：继承西斯留下的绝对权力，还是让银河重新走向合作与光明。"
 foc_story.20.a:0 "堕入黑暗——我将继承西斯的遗志。"
 foc_story.20.a.tooltip:0 "成为§R星海皇帝§!并获得永久的§Y黑暗王座§!修正。所有独立国家都将收到臣服最后通牒；拒绝加入者将立即面对全面战争。"
 foc_dark_order_legacy_reward_tt:0 "§R黑暗遗产：§!作为亲手摧毁最终秩序的国家，我们将获得§Y弑星者基地§!、§Y帝国级§!、§Y复兴级§!和§Y至高无上级§!的建造科技，同时解锁至高无上级指令法令及其直接建造工程。§Y长矛级§!仍只在真正进入§H最终秩序§!阶段后解锁。"
 foc_story.20.b:0 "迎接光明——银河终将迎来和平。"
 foc_story.20.b.tooltip:0 "成为§B永久星海共同体监管人§!并获得永久的§Y银河守护者§!修正。同时获得§Y星云级§!与§Y子爵级§!建造科技和完整固定蓝图；其专属武器与配件仍保持隐藏，不能单独使用。"

 foc_story.21.name:0 "新帝国的最后通牒"
 foc_story.21.desc:0 "最终秩序的征服者已经宣布建立新的星海帝国，并要求所有独立国家立即承认皇帝的最高权威。臣服意味着加入新秩序；拒绝则意味着全面战争。"
 foc_story.21.a:0 "我们将加入新帝国。"
 foc_story.21.a.tooltip:0 "成为星海皇帝的附属国，并避免银河统一战争。"
 foc_story.21.b:0 "我们绝不臣服。"
 foc_story.21.b.tooltip:0 "拒绝最后通牒。星海皇帝将使用全面战争目标立即向我们宣战。"

 foc_story.23.name:0 "最后的绝地武士"
 foc_story.23.desc:0 "最终秩序已经覆灭。击败帕尔帕廷最后舰队的胜利者正在决定银河未来的政治秩序。"
 foc_story.23.a:0 "一个时代结束了。"

 foc_story_dark_emperor:0 "黑暗王座"
 foc_story_dark_emperor_desc:0 "这个国家继承了西斯的遗志，并以最终秩序的废墟为基础建立新的星海帝国。"
 foc_story_light_custodian:0 "银河守护者"
 foc_story_light_custodian_desc:0 "这个国家拒绝黑暗面的诱惑，成为星海共同体的永久监管人。"

 foc_tech_dark_legacy_imperial:0 "帝国级歼星舰"
 foc_tech_dark_legacy_imperial_desc:0 "银河帝国成立时立即启用的主力歼星舰科技；黑暗遗产路线也可恢复这套完整建造资料。"
 foc_tech_dark_legacy_resurgent:0 "复兴级歼星舰蓝图"
 foc_tech_dark_legacy_resurgent_desc:0 "回收的第一秩序档案允许我们建造复兴级歼星舰舰体。完成全部建造科技（本蓝图、$tech_battleships$与$tech_plasma_3$）后，同时解锁S/M/L三种尺寸的先进耐钢装甲。"
 foc_tech_dark_legacy_xyston:0 "长矛级歼星舰蓝图"
 foc_tech_dark_legacy_xyston_desc:0 "只有进入§H最终秩序§!阶段后，埃克西戈档案才会开放配备轴向超级激光的长矛级歼星舰建造权限。安装其专属T槽超级激光会使本舰护盾容量降低100%。"
 foc_tech_dark_legacy_supremacy:0 "至高无上级蓝图"
 foc_tech_dark_legacy_supremacy_desc:0 "回收的第一秩序旗舰资料将解锁至高无上级指令法令及其直接建造工程。"
 foc_dark_order_legacy_required:0 "§R需要第一秩序起源，或由亲手摧毁最终秩序并选择堕入黑暗所获得的黑暗遗产。§!"
 foc_story.31.name:0 "克瑞特战役"
 foc_story.31.desc:0 "克瑞特已经落入第一秩序或最终秩序之手。\n\n盐层下的最后一道闸门被攻城炮轰开时，是§H卢克·天行者§!独自走出去，站在整支地面部队面前。他挡住了他们全部的火力，直到幸存者从后山的裂缝里撤出去——然后与原力合而为一。\n\n克瑞特防线已经崩溃，但幸存的抵抗力量仍可能在未知据点重组。现在必须由我们决定：自己的国家是向第一秩序屈服，还是保持独立并继续战斗。"
 foc_story.31.a:0 "向第一秩序投降。"
 foc_story.31.a.tooltip:0 "我国将接受第一秩序的统治，现有附属国也会被纳入其势力范围。克瑞特防线已经陷落。"
 foc_story.31.a.starkiller_blocked:0 "§R拥有弑星者基地的国家不可能向第一秩序投降。§!"
 foc_story.31.b:0 "我们会继续战斗！"
 foc_story.31.b.tooltip:0 "我国拒绝屈服，并将独自承担继续对抗第一秩序与最终秩序的代价。幸存者正从克瑞特撤离。"
 foc_story.33.name:0 "克瑞特战役"
 foc_story.33.desc:0 "克瑞特已经陷落。\n\n§H卢克·天行者§!独自挡在闸门外，把整支地面部队拖在原地，直到幸存者从盐层下的裂缝逃进深空；随后他与原力合而为一。\n\n矿道里的防线已经瓦解，但那批人跑掉了，而且整个银河都听说了闸门外发生的事。"
 foc_story.33.a:0 "克瑞特之战结束了。"
