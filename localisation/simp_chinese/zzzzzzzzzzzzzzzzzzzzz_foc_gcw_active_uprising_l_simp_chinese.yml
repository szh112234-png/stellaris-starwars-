l_simp_chinese:
 operation_foc_gcw_instigate_system_uprising:0 "策动星系起义"
 operation_foc_gcw_instigate_system_uprising_desc:0 "§R仅能针对银河帝国发动。§!\n\n选择一个没有帝国机动军事舰队驻留、且已结束当地镇压冷却的殖民星系，建立反抗细胞、扩张地下网络并输送武器，最终由当地星球发动公开起义。行动本身不会直接赠送星系，起义仍通过帝国的正常应对事件结算。\n\n§Y行动可重复发动，不是一次性行动。§!每次仍需10点间谍网力量、180影响力，进行期间每月消耗12能量。上一场行动完成或取消后，只要仍有合格目标即可再次筹备；现有目标选择流程一次只保留一场此类行动。\n\n只有帝国机动军事舰队会阻止或中断行动；恒星基地、防御平台、科研船、工程船、殖民船和运输船不计入阻止行动的驻军。"
 foc_gcw_active.1.name:0 "选择起义目标"
 foc_gcw_active.1.desc:0 "我们的情报网已经渗入银河帝国。现在必须确定一个具体星系作为重点目标。行动一旦确认，后续联络、组织、武装与起义都将围绕该星系展开。\n\n下列目标从帝国现有殖民星系中抽取；若没有看到想要的星系，可以刷新目标列表。"
 foc_gcw_active.target.more:0 "更多目标……"
 foc_gcw_active.target.cancel:0 "取消此次行动。"
 foc_gcw_active.10.name:0 "建立秘密联络"
 foc_gcw_active.10.desc:0 "我们已经锁定§Y[event_target:foc_gcw_active_uprising_target_system.GetName]§!星系。特工正在接触当地不满帝国统治的居民、工人、退伍军人与地方组织，为一支能够长期潜伏的地下反抗力量建立最初的联络网。"
 foc_gcw_active.20.name:0 "扩建地下网络"
 foc_gcw_active.20.desc:0 "§Y[event_target:foc_gcw_active_uprising_target_system.GetName]§!星系的秘密联络已经形成骨架。我们将把零散细胞整合成分层的地下游击网络，使帝国一次搜捕无法摧毁整个组织。"
 foc_gcw_active.30.name:0 "武装游击网络"
 foc_gcw_active.30.desc:0 "当地组织已具备发动行动的基础。下一步是通过走私航线送入爆能武器、炸药、通讯设备和军事顾问，让§Y[event_target:foc_gcw_active_uprising_target_system.GetName]§!的地下网络拥有与帝国驻军正面对抗的能力。"
 foc_gcw_active.40.name:0 "发动全面起义"
 foc_gcw_active.40.desc:0 "一切已经就绪。§Y[event_target:foc_gcw_active_uprising_target_system.GetName]§!星系的地下组织正在等待最后的密码指令。信号发出后，他们将公开夺取帝国设施，并宣布加入义军。"
 foc_gcw_active.continue:0 "继续行动。"
 foc_gcw_active.launch:0 "发出起义信号！"
 foc_gcw_active.abort:0 "目标已经失效，终止行动。"
 foc_gcw_active.target.1:0 "§Y[event_target:foc_gcw_active_candidate_1.GetName]§!星系"
