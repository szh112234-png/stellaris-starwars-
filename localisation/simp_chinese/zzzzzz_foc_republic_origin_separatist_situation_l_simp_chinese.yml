l_simp_chinese:
 situation_foc_republic_origin_separatist_crisis:0 "分离主义危机"
 situation_foc_republic_origin_separatist_crisis_type:0 "分离主义危机"
 situation_foc_republic_origin_separatist_crisis_desc:0 "从纳布到吉奥诺西斯，分离主义危机推进共和国的分裂与战争爆发。§H本进度条只控制战前危机，不是帕尔帕廷阴谋，也不是战争胜利分数。§!\n\n§Y分离主义投降：两条路线，满足任意一条§!\n§H剧情路线§!：科洛桑战役事件完成＋乌塔堡（乌塔帕）战役事件完成＋帕尔帕廷的阴谋达到140点。\n§H军事路线§!：由游戏实际判定共和国在对邦联的全面战争中获胜，或确认共和国在该战争中彻底消灭邦联，才进入投降收尾。殖民地数量、暂时的控制权或找不到邦联均不单独判胜；维持现状、共和国战败及第三方消灭邦联不算共和国胜利。本路线不要求阴谋140点或两场战役事件。\n全选不利或混合选择导致阴谋不足140点时，必须通过军事路线结束战争，不能靠等待补分。两条路线均接入分日投降结算；杜库与格里弗斯死亡不单独判为胜利。"
 situation_foc_republic_origin_separatist_crisis_monthly_change_tooltip:0 "§Y每月自然进度：0§!。只有剧情事件会推进局势；达到 100 点并完成吉奥诺西斯战役后才会爆发分离主义战争。"
 foc_republic_origin_sep_stage_naboo:0 "纳布危机与西斯阴影"
 foc_republic_origin_sep_stage_naboo_desc:0 "纳布危机改变了共和国的最高权力结构，而一支无人知晓的军队开始在卡米诺成形。"
 foc_republic_origin_sep_stage_naboo_tooltip:0 "纳布危机、帕尔帕廷当选、西斯更换学徒以及西法-迪亚斯的秘密订单将把局势推进至 25 点。"
 foc_republic_origin_sep_stage_shadow_army:0 "暗中备战"
 foc_republic_origin_sep_stage_shadow_army_desc:0 "克隆人计划已落入杜库手中；共和国仍不知道自己正在为一场预先设计的战争准备军队。"
 foc_republic_origin_sep_stage_shadow_army_tooltip:0 "杜库接管克隆人计划，并将不断扩大的反共和国情绪组织成公开的分离运动。阶段在 50 点结束。"
 foc_republic_origin_sep_stage_secession:0 "分离运动兴起"
 foc_republic_origin_sep_stage_secession_desc:0 "越来越多的星系响应杜库，而企业巨头正在把经济实力转化为一支机器人大军。"
 foc_republic_origin_sep_stage_secession_tooltip:0 "拉格萨斯演说、企业巨头结盟，以及欧比旺发现卡米诺秘密将把局势推进至 80 点。此时仍不会生成 CIS，也不会宣战。"
 foc_republic_origin_sep_stage_geonosis:0 "吉奥诺西斯危机"
 foc_republic_origin_sep_stage_geonosis_desc:0 "密谋已经曝光，绝地被俘，议会正在讨论是否把紧急权力交给最高议长。"
 foc_republic_origin_sep_stage_geonosis_tooltip:0 "只有密谋曝光、三人被俘、紧急处置权通过、克隆人大军正式启用并完成吉奥诺西斯战役后，局势才达到 100 点并触发分离主义战争。"
 foc_republic_origin_sep_approach_watch:0 "追踪分离危机"
 foc_republic_origin_sep_approach_watch_desc:0 "这不是一个按月自动增长的倒计时。每个关键剧情事件都会推进局势。"
 foc_republic_origin_sep_approach_watch_tooltip:0 "§Y局势只由剧情事件推进。§!选举不会再触发分离主义战争。"
 foc_sepplot.1.name:0 "西斯的新学徒"
 foc_sepplot.1.desc:0 "纳布之战结束后，西斯武士§H达斯·魔§!被认为已经阵亡。对最高议长帕尔帕廷而言，这并不是阴谋的终结，而只是一次更换棋子的机会。\n\n离开绝地武士团的前绝地大师§H杜库伯爵§!与共和国之间的裂痕越来越深。帕尔帕廷向他揭示了另一条道路，并赐予他新的名字：§H达斯·泰拉纳斯§!。\n\n从这一刻起，议会里日益高涨的不满将有人在暗处引导。"
 foc_sepplot.1.a:0 "新的学徒已经就位。"
 foc_sepplot.2.name:0 "西法-迪亚斯的预言"
 foc_sepplot.2.desc:0 "绝地大师§H西法-迪亚斯§!坚信银河系即将迎来一场共和国无法依靠现有军力应付的大灾难。他没有得到绝地议会授权，却仍秘密前往§H卡米诺§!，以共和国的名义订购了一支规模惊人的§H克隆人大军§!。\n\n订单没有进入议会预算，也没有进入绝地档案的正常程序。卡米诺人只知道客户要求他们十年后交付一支能够立即投入银河战争的军队。"
 foc_sepplot.2.a:0 "一支没有共和国知情的共和国军队。"
 foc_sepplot.3.name:0 "被劫持的克隆人计划"
 foc_sepplot.3.desc:0 "西法-迪亚斯没有活着看到自己的军队。§H杜库伯爵§!奉西斯之命清除了这位知情者，并利用自己曾经身为绝地大师的权限篡改档案、切断追查线索，随后以§H泰拉纳斯§!的身份接管卡米诺计划。\n\n克隆人仍将按照原订单成长、训练、装备——但决定他们最终听命于谁的人已经换了。"
 foc_sepplot.3.a:0 "军队的控制权悄然易手。"
 foc_sepplot.4.name:0 "分离主义运动"
 foc_sepplot.4.desc:0 "在§H拉格萨斯§!，杜库伯爵向银河发表公开演说，指责共和国被腐败的议员、垄断财团和无休止的程序彻底绑架。他宣称继续留在科洛桑体制内已经不可能改革共和国。\n\n演说迅速传遍外环。数千个不满的星系宣布支持杜库，退出共和国的呼声第一次从零散抗议变成了一个有领袖、有纲领的§H分离主义运动§!。\n\n他们尚未组成一个真正的战争国家，但共和国的裂缝已经公开化。"
 foc_sepplot.4.a:0 "银河正在分成两半。"
 foc_sepplot.5.name:0 "吉奥诺西斯密约"
 foc_sepplot.5.desc:0 "杜库在§H吉奥诺西斯§!秘密召集贸易联盟、商业行会、企业同盟等巨头。会议不再讨论自治或税率，而是在讨论舰队吨位、机器人生产线和一场战争的物资需求。\n\n各大企业正式承诺向即将成立的§H独立星系邦联§!提供舰船、资金，以及数以百万计的§H战斗机器人§!。政治运动已经拥有了发动全面战争所需的工业基础。"
 foc_sepplot.5.a:0 "这已经不是一次政治抗议。"
 foc_sepplot.6.name:0 "卡米诺的秘密"
 foc_sepplot.6.desc:0 "追查针对§H帕德梅·阿米达拉§!的刺杀行动时，绝地武士§H欧比旺·肯诺比§!找到了一条通往卡米诺的线索。那里等待他的不是刺客藏身处，而是一支共和国从未正式订购过的克隆人大军。\n\n克隆人的基因模板来自赏金猎人§H强格·费特§!。当强格离开卡米诺时，欧比旺没有终止调查，而是一路追踪他的航迹前往吉奥诺西斯。"
 foc_sepplot.6.a:0 "查清这支军队是谁订购的。"
 foc_sepplot.7.name:0 "吉奥诺西斯的密谋"
 foc_sepplot.7.desc:0 "欧比旺潜入吉奥诺西斯地下设施，亲眼看见贸易联盟与企业巨头向杜库交出各自的军力，也看见机器人装配线昼夜不停地运转。\n\n他在被发现之前向绝地议会发出了加密报告：§H分离主义者正在组建一支足以与共和国开战的军队。§!\n\n情报已经传出，但欧比旺本人没能离开。"
 foc_sepplot.7.a:0 "通知绝地议会与共和国议会。"
 foc_sepplot.8.name:0 "绝地遭囚禁"
 foc_sepplot.8.desc:0 "欧比旺被俘后，§H安纳金·天行者§!与§H帕德梅·阿米达拉§!赶往吉奥诺西斯试图营救他，结果三人全部落入分离主义者手中。\n\n杜库下令在吉奥诺西斯竞技场公开处决他们。消息抵达科洛桑时，绝地武士团已经开始集结救援力量，而共和国议会面对的已经不是一次遥远的分离运动，而是一场迫在眉睫的战争。"
 foc_sepplot.8.a:0 "救援行动必须立即开始。"
 foc_sepplot.9.name:0 "紧急处置权"
 foc_sepplot.9.desc:0 "§L一份本不该存在的档案被重新打开，里面的每一页都指向更深的黑暗。§!\n\n在分离主义军队即将全面动员的消息传回科洛桑后，共和国议会陷入混乱。纳布代表§H加·加·宾克斯§!提出动议：在危机期间授予最高议长§H帕尔帕廷紧急处置权§!，允许他绕过漫长的议会程序直接调动共和国资源。\n\n动议通过。帕尔帕廷立即宣布，共和国将正式启用在卡米诺发现的克隆人大军。第一批军团已经登上运输舰，目标——吉奥诺西斯。\n\n§L本事件保留原剧情与其他效果，不额外增加帕尔帕廷阴谋点数。§!"
 foc_sepplot.9.a:0 "授予最高议长紧急处置权。"
 foc_republic_origin.23.a:0 "执行克隆人军队计划。（保留原军队效果，阴谋＋10，仅一次）"
 foc_republic_origin_plot_stage_clone_army_tooltip:0 "§Y战前与战时计分：上限140点§!\n五次关键抉择：接受商业财团捐助、通过军队组建法案、将可疑账目结案归档、延长紧急权力、拒绝绝地调查；每项有利于帕尔帕廷的选择§G＋20§!，另一选项§Y＋0§!。\n四个固定节点：纳布危机、克隆人军队计划、夸特船坞扩建、科洛桑战役，每项仅记§G＋10§!。\n§H100＋40＝140§!。必须五次全部选择有利选项，且四个节点完成，才能达到140点。没有每月自动增长，重复事件与切换应对方式不会补分。\n\n§Y分离主义投降：两条路线，满足任意一条§!\n§H剧情路线§!：科洛桑战役事件完成＋乌塔堡（乌塔帕）战役事件完成＋帕尔帕廷的阴谋达到140点。\n§H军事路线§!：由游戏实际判定共和国在对邦联的全面战争中获胜，或确认共和国在该战争中彻底消灭邦联，才进入投降收尾。殖民地数量、暂时的控制权或找不到邦联均不单独判胜；维持现状、共和国战败及第三方消灭邦联不算共和国胜利。本路线不要求阴谋140点或两场战役事件。\n全选不利或混合选择导致阴谋不足140点时，必须通过军事路线结束战争，不能靠等待补分。两条路线均接入分日投降结算；杜库与格里弗斯死亡不单独判为胜利。"
 foc_cw.1.name:0 "吉奥诺西斯危机：战争爆发"
 foc_cw.1.desc:0 "吉奥诺西斯危机迫使共和国启用克隆人大军。关闭本事件后，独立星系邦联正式建立，克隆人战争爆发。"
 foc_cw.1.a:0 "战争开始了。"
