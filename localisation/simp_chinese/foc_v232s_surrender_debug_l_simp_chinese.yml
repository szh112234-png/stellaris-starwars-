l_simp_chinese:
 foc_v232s.debug_surrender_tooltip:0 "§R调试专用：立即提交分离主义投降收尾。§!\n不要求科洛桑或乌塔堡战役、不要求阴谋140点、不要求占领任何殖民地。停战、领土移交和国家解散仍分日执行，随后衔接原有66号命令。不会重写战时阴谋选择，也不会重复结算。"
 foc_v232s.debug_status_button:0 "查看克隆人战争判定（只读）"
 foc_v232s.status.name:0 "克隆人战争：正常胜利条件核对"
 foc_v232s.status.desc:0 "§H本面板只读，不会强制投降或增加阴谋分数。§!\n\n§Y剧情路线§!：[Root.GetFocV232sStoryVictoryStatus]\n科洛桑战役事件：[Root.GetFocV232sCoruscantStatus]\n乌塔堡战役事件：[Root.GetFocV232sUtapauStatus]\n实际阴谋进度：[Root.foc_v232s_status_plot]／140；140点要求：[Root.GetFocV232sPlotStatus]\n\n§Y全面战争军事胜利§!：[Root.GetFocV232sMilitaryVictoryStatus]\n本项只读取游戏确认的共和国胜利或共和国在该战争中消灭邦联的结果。不再用殖民地数量或地面控制权推测战争胜负。仅仅停止交战、找不到国家、维持现状、共和国战败和第三方灭国都不算胜利。\n\n两条路线任一满足即可正常进入投降收尾。阴谋不足140点时必须真正打赢军事路线，不会靠时间补分。§R调试台强制投降§!仍是单独按钮，不受正常胜利条件限制。"
 foc_v232s.status.yes:0 "§G已满足§!"
 foc_v232s.status.no:0 "§R未满足§!"
 foc_v232s.status.refresh:0 "刷新当前状态（不修改剧情）"
 foc_v232s.status.back:0 "返回剧情调试台"
 foc_v232s.surrender_military.desc:0 "共和国已经在对独立星系邦联的全面战争中取得实际胜利。军事指挥部确认战争结果，克隆人战争进入终结阶段。\n\n仍需处理的邦联领土与军事力量将按原有分日流程收尾；已经由引擎消灭的邦联不会重建。随后照常衔接66号命令与帝国成立。"
