 FOC_REPUBLIC_ORIGIN_PRESET_SPECIES_BIO:0 "银河共和国由科洛桑的议会统治。此预设使用共和国国家、旗帜与领袖头像；自建国家仍可用任意符合条件的非机器物种选择该起源。"
 FOC_REPUBLIC_ORIGIN_PRESET:0 "银河共和国"
 trait_foc_republic_origin_preset_ethics:0 "平等主义 / 亲外主义 / 军国主义"
 FOC_REPUBLIC_ORIGIN_PRESET_DESC:0 "由科洛桑银河议会和最高议长帕尔帕廷领导的民主共和国。该预设使用共和国旗帜、共和国人物头像、共和国舰船文化与“银河共和国：分裂前夜”起源，从帝国诞生前进入分离主义战争、帝国崛起及双死星剧情。"

 foc_republic_origin_command.1.name:0 "剧情调试：最高统帅部推演台"
 foc_republic_origin_command.1.desc:0 "这里提供当前路线的剧情调试命令。§R强制分离主义投降§!直接开始分日收尾，跳过战役、阴谋140点和殖民地占领条件，不会伪造选项记录或战役完成标记；已经结算或正在收尾时不会重复执行。\n\n§H查看克隆人战争判定§!仅显示正常玩法的两条胜利路线及缺失条件，不触发投降。§H重算阴谋进度§!仍只核对已记录选择，不赠送分数。"
 foc_republic_origin_command.1.start_separatists:0 "宣布外环诸星系进入叛乱状态。"
 foc_republic_origin_command.1.surrender_separatists:0 "【调试】强制分离主义投降（跳过胜利条件）"
 foc_republic_origin_command.1.plot_25:0 "重算阴谋进度（不补分）"
 foc_republic_origin_command.1.plot_complete:0 "完成战后阴谋收尾（仅限战争已结束）"
 foc_republic_origin_command.1.build_death_star_one:0 "【调试】 立即生成死星一号（跳过建造）"
 foc_republic_origin_command.1.destroy_death_star_one:0 "【调试】 摧毁死星一号（播放爆炸）"
 foc_republic_origin_command.1.build_death_star_two:0 "【调试】 立即生成死星二号（跳过建造／4年等待）"
 foc_republic_origin_command.1.destroy_death_star_two:0 "【调试】 摧毁死星二号（播放爆炸）"
 foc_republic_origin_command.1.force_treaty:0 "召集各方，立即签署银河条约。"
 foc_republic_origin_command.1.grant_mon_cala:0 "向共和国一侧全体重新签发蒙卡拉马利船坞的建造授权。"
 foc_republic_origin_command.1.close:0 "离开作战地图。"

 civic_foc_republic_origin_galactic_senate:0 "银河议会"
 civic_foc_republic_origin_galactic_senate_desc:0 "科洛桑议会代表共和国诸星系，并维持遍及银河的外交网络。"
 civic_foc_republic_origin_defense_fleet:0 "共和国防卫军"
 civic_foc_republic_origin_defense_fleet_desc:0 "共和国舰队与地面军团负责维护共同体的统一。"
 civic_foc_republic_origin_separatist_council:0 "分离主义议会"
 civic_foc_republic_origin_separatist_council_desc:0 "外环财团、总督与地方议会共同反对科洛桑的中央统治。"
 civic_foc_republic_origin_droid_army:0 "分离主义战争机器"
 civic_foc_republic_origin_droid_army_desc:0 "庞大的自动化军工体系为分离主义舰队与军团持续输送兵力。"
 civic_foc_republic_origin_galactic_emperor:0 "银河皇帝"
 civic_foc_republic_origin_galactic_emperor_desc:0 "国家的一切权力集中于银河皇帝及其指定继承人。"
 civic_foc_republic_origin_imperial_military:0 "帝国战争机器"
 civic_foc_republic_origin_imperial_military_desc:0 "帝国舰队、总督与军工世界构成新秩序的钢铁支柱。"

 gov_foc_republic_origin_republic:0 "银河共和国"
 gov_foc_republic_origin_republic_desc:0 "由科洛桑议会与民选最高议长领导的银河民主共同体。"
 gov_foc_republic_origin_separatists:0 "独立星系邦联"
 gov_foc_republic_origin_separatists_desc:0 "由外环自治政府与商业集团组成的分离主义联盟。"
 gov_foc_republic_origin_empire:0 "银河帝国"
 gov_foc_republic_origin_empire_desc:0 "由银河皇帝和帝国舰队实施绝对统治的中央集权国家。"
