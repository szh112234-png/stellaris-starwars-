 foc_republic_origin_union_economy:0 "共和国联合经济"
 foc_republic_origin_union_economy_desc:0 "内环工业与外环资源被纳入科洛桑统一调度；共和国主力舰队享受集中维护保障。"
 building_foc_republic_origin_member_world_nexus:0 "成员世界行政经济中枢"
 building_foc_republic_origin_member_world_nexus_desc:0 "共和国为每个成员世界建立的永久行星首府。中枢直接提供基础资源、住房、舒适度、稳定与治安，使全部剧情星球保持殖民状态而不会因低宜居度、人口失业或舰队维护费立即破产叛乱。"
 foc_republic_origin_civil_war_economy:0 "内战动员经济"
 foc_republic_origin_civil_war_economy_desc:0 "整个国家机器已经转入无限期战时动员，并为剧情舰队提供集中维护保障。"

 war_goal_wg_foc_republic_civil_war:0 "银河内战"
 war_goal_wg_foc_republic_civil_war_desc:0 "这场内战由相应时代的剧情条件结算。以下条件只用于共和国与分离主义邦联的克隆人战争；帝国与义军仍使用各自的后续规则。\n\n§Y分离主义投降：两条路线，满足任意一条§!\n§H剧情路线§!：科洛桑战役事件完成＋乌塔堡（乌塔帕）战役事件完成＋帕尔帕廷的阴谋达到140点。\n§H军事路线§!：由游戏实际判定共和国在对邦联的全面战争中获胜，或确认共和国在该战争中彻底消灭邦联，才进入投降收尾。殖民地数量、暂时的控制权或找不到邦联均不单独判胜；维持现状、共和国战败及第三方消灭邦联不算共和国胜利。本路线不要求阴谋140点或两场战役事件。\n全选不利或混合选择导致阴谋不足140点时，必须通过军事路线结束战争，不能靠等待补分。两条路线均接入分日投降结算；杜库与格里弗斯死亡不单独判为胜利。"

 foc_republic_origin.2.name:0 "统一的共和国"
 foc_republic_origin.2.desc:0 "银河议会在§H科洛桑§!召开新一届会期。二十七个成员星系的代表齐聚穹顶之下：§H内环十四星系§!的工业与航道，§H外环十三星系§!的矿藏与边疆驻军，共同支撑着这个存续了千年的共同体。\n\n每一颗成员世界都由§H成员世界行政经济中枢§!统辖，供应能源、矿物、食物、消费品与合金，也维系着地方的秩序与民生。共和国的船坞正在扩产，护航舰队巡弋在主要贸易航线上。\n\n然而外环的税负争端从未平息，商业财团的私兵编制年年膨胀，而最高议长办公室手中的紧急权力，正在一份接一份地累积。"
 foc_republic_origin.2.a:0 "共和国必须经得住考验。"

 foc_republic_origin.10.name:0 "分离主义内战"
 foc_republic_origin.10.desc:0 "共和国的政治危机已经演变为公开战争。独立星系邦联以穆斯塔法为首都，阿基瓦继续承担机器人生产和舰队补给。"
 foc_republic_origin.10.a:0 "共和国不容分裂。"

 foc_republic_origin.17.name:0 "阿基瓦机器人制造基地"
 foc_republic_origin.17.desc:0 "侦察报告确认了阿基瓦的机器人制造基地。这里是重要的工业与补给节点。"
 foc_republic_origin.17.a:0 "摧毁它的战争工业，但继续推进战线。"

 foc_republic_origin.20.name:0 "分离主义投降"
 foc_republic_origin.20.desc:0 "独立星系邦联宣布投降。\n\n邦联将停止作战，分日移交全部剩余领土，包括§H穆斯塔法§!，随后解散，不保留议会残余国家。克隆人战争结束后，66号命令与帝国成立剧情继续推进。"
 foc_republic_origin.20.a:0 "共和国仍未脱离险境。"

 foc_republic_origin.21.name:0 "帕尔帕廷的阴谋"
 foc_republic_origin.21.desc:0 "§L这一刻没有宏大的仪式，只有一道命令、一份报告，以及后来无人能够逆转的后果。§!\n\n情报部门递上一份没有署名的简报：紧急法令、暗账军费、议会中的代理人，正在最高议长身边收拢成一张看不见的网。\n\n没有人能证明什么。但每一次危机结束之后，科洛桑的权力都比危机之前更集中一分。"
 foc_republic_origin.21.a:0 "监视议会与军队。"

 foc_republic_origin.23.name:0 "克隆人军队计划"
 foc_republic_origin.23.desc:0 "§L前线与议会之间的距离从未如此遥远，所有人都在等待一个能够决定下一步的答案。§!\n\n卡米诺的培育舱向共和国交付了第一批克隆人军团。议会以保卫共和国之名批准了§H克隆人军队计划§!：共和国从此不再依赖成员星系的地方部队，而拥有一支横跨银河、只听命于总参谋部的常备军。\n\n而总参谋部的战时指挥权，握在最高议长手里。\n\n第一批军团的指挥权交给了§H科迪指挥官§!——一名克隆人，忠于共和国，也忠于共和国之上的任何命令。\n\n§Y固定剧情节点：阴谋＋10，只记录一次。§!"
 foc_republic_origin.23.a:0 "执行克隆人军队计划。（保留原军队效果，阴谋＋10，仅一次）"

 foc_republic_origin.25.name:0 "66 号命令"
 foc_republic_origin.25.desc:0 "一道加密指令同时抵达每一支克隆人军团的指挥频道，编号§H66§!。\n\n执行它的士兵没有迟疑，也没有询问理由。从科洛桑到外环，忠于议会的将领与议员在同一个夜里被清除。绝地神殿的高塔燃烧了整整一夜——尤达与温杜没有走出来，武士团几乎荡然无存。\n\n带队冲进神殿的，是那个曾被称为§H天选之子§!的人。\n\n共和国的军队，已经不再属于共和国。"
 foc_republic_origin.25.a:0 "共和国的时代结束了。"

 foc_republic_origin.30.name:0 "帝国内战"
 foc_republic_origin.30.desc:0 "议会大厅的灯熄灭了。最高议长站上讲坛，宣布共和国即日改组为§H银河帝国§!——为了一个安全而有序的社会。掌声雷动。\n\n但并非所有人都在鼓掌。蒙·莫思玛与一批议员已经离开科洛桑，忠于共和国的舰队正向§H雅雯、迪卡与霍斯§!集结。银河将在这两面旗帜之间做出选择。\n\n你所统率的国家机器完好无损地留在你手中：它将换上其中一面旗帜，沿用它的舰队、船坞与人民，然后与另一面开战。"
 foc_republic_origin.30.a:0 "控制银河帝国。"
 foc_republic_origin.30.a.tt:0 "§H你的国家就地改组为银河帝国§!并继承共和国疆域。完成死星二号或彻底击败帝国叛军后，执行者号、卢桑基亚号与惩罚者号三艘剧情旗舰服役，分别驻守恩多、科洛桑与贾库；每支编队为§H1艘执行者级＋30艘帝国 II 级§!。其余银河协议条件沿用原模组。"
 foc_republic_origin.30.b:0 "控制帝国叛军。"
 foc_republic_origin.30.b.tt:0 "§H你的国家就地改组为帝国叛军§!（不切换国家），退守§H雅雯、迪卡、霍斯§!，并吸收迪卡义军的基地、舰队与英雄指挥官。叛军阶段只使用义军时代舰船，不会获得星云级。帝国将自动推进两阶段死星工程；摧毁双死星、控制全部内环与贾库后，叛军将成为新共和国并解锁星云级。"

 foc_republic_origin.32.name:0 "帝国的新主人"
 foc_republic_origin.32.desc:0 "帝国的旗帜升起在科洛桑上空。旧共和国的疆域、船坞与舰队尽数转入新秩序之手，§H帝国级歼星舰§!的量产线已经开动；§H执行者级§!的图纸仍锁在工程部门的保险柜里——那是一份只有在死星失手时才会被取出的备用方案。\n\n与此同时，皇帝批准了一项代号§H死星§!的工程：一座能够摧毁行星的战斗空间站。当它建成，任何叛乱都将不再需要谈判。"
 foc_republic_origin.32.a:0 "一个银河，一个帝国。"

 foc_republic_origin.33.name:0 "帝国叛军"
 foc_republic_origin.33.desc:0 "§H雅雯、迪卡、霍斯§!——三座隐蔽的基地，几支不肯放下武器的舰队，还有一份从旧议会带出来的名单。这就是反抗帝国的全部本钱。\n\n情报显示，帝国正在建造某种前所未见的战斗空间站。若它建成，被瞄准的世界将不复存在。斯卡里夫的帝国档案库里也许藏着它的弱点。\n\n反抗从今天开始。"
 foc_republic_origin.33.a:0 "反抗从今天开始。"

 foc_republic_origin.50.name:0 "共和国覆灭：义军崛起"
 foc_republic_origin.50.desc:0 "共和国最后一颗殖民地降下了旗帜。二十七个成员星系——从内环的工业世界到外环的边疆驻军——如今全部挂着帝国的徽记。\n\n但清点名单的时候，有一批人对不上号：几十名议员、十几支拒绝接受改编的舰队，还有旧共和国情报部门的整整一个处。他们在外环一颗密林行星上重新集结，自称§H义军同盟§!。\n\n§Y共和国已亡，内战尚未结束。帝国必须完成死星计划并彻底消灭义军，才能取得完整的胜利遗产。§!"
 foc_republic_origin.50.a:0 "找到义军，把他们全部消灭。"

 FOC_REPUBLIC_ORIGIN_DEATH_STAR_PROJECT:0 "死星一号计划与建造工程"
 FOC_REPUBLIC_ORIGIN_DEATH_STAR_PROJECT_DESC:0 "帝国工程部门将在科洛桑完成死星一号的设计定型与建造，并安装能够摧毁行星的超级激光。常规项目需要§Y60000§!工程学研究；若帝国叛军总舰队战力超过帝国并触发紧急工程，研究总需求降为§Y15000§!，不取消正在进行的项目。AI帝国常规工期为20年，触发紧急工程后改为从原计划启动日计满§Y2.5年§!投入运行；触发时已超过该期限则直接进入完工流程。"
 FOC_REPUBLIC_ORIGIN_DEATH_STAR_II_PROJECT:0 "死星二号建造计划"
 FOC_REPUBLIC_ORIGIN_DEATH_STAR_II_PROJECT_DESC:0 "在恩多建造第二座死星。玩家帝国在死星一号被毁后立即获得此工程项目；研究完成后触发博桑谍报事件，并在恩多生成未完工死星二号。\n\n初始移速为0，船体、装甲、护盾与武器输出均为死星一号的1.3倍。之后可手动研究独立的完工与机动改装项目。"
 foc_republic_origin.70.name:0 "死星计划完成"
 foc_republic_origin.70.desc:0 "那不是卫星。\n\n直径一百六十公里的球体已经在科洛桑上空合拢。它自带超空间引擎，自带一支完整的驻防舰队，也自带一门能够把行星打成碎石带的超级激光。\n\n§Y死星计划完成。共和国已在帝国成立时灭亡；黑暗遗产仍要求帝国彻底消灭控制雅雯、迪卡与霍斯的帝国叛军。§!"
 foc_republic_origin.70.a:0 "现在见证这座战斗空间站的全部威力。"
 foc_republic_origin.76.name:0 "义军同盟"
 foc_republic_origin.76.desc:0 "共和国的残部并没有随议会一同消失。\n\n他们在§HD'Qar§!的密林里挖出了机库，用伪装网盖住跑道，把旧共和国的旗帜重新升了起来。第一份公开宣言是用民用频道广播的——他们连一台军用加密机都没有。\n\n§YD'Qar 是这场叛乱唯一的政治中心。只要拿下那颗星球，反抗就会失去它的头颅。§!"
 foc_republic_origin.76.a:0 "帝国会把叛乱扼杀在摇篮里。"
 foc_republic_origin.80.name:0 "帝国凯旋：黑暗遗产"
 foc_republic_origin.80.desc:0 "银河系没有再升起第二面旗帜。\n\n死星已经服役，共和国已经不存在，最后一批义军的基地在轨道轰炸中变成了玻璃。皇帝在科洛桑宣布：新秩序取得了完全的、不可逆的胜利。\n\n档案库最深处那些一直上着封条的工程资料，从今天起可以取用了。\n\n§Y解锁：弑星者基地、复兴级与至高无上级的科技、法令与建造工程。长矛级仍保持封锁，只有真正进入最终秩序阶段后才会开放。帝国§R尚未化身天灾§!——只有真正建成弑星者基地，才会进入银河新秩序、最终秩序、原力化身与宇宙飞升流程。§!"
 foc_republic_origin.80.a:0 "开始建造弑星者基地。"

 foc_republic_origin.90.name:0 "弑星者基地：银河新秩序"
 foc_republic_origin.90.desc:0 "§H弑星者基地已经建成。§!\n\n一整颗行星被掏空、改造，装上了恒星能量收集阵列。充能时，天空里那颗恒星会一点一点暗下去，直到熄灭；开火时，光束穿过超空间，同时抵达好几个星系。\n\n帝国到此为止。取代它的东西从未知星域走了出来，用的是另一个名字。\n\n§Y国家正式化身天灾，普通第一秩序危机被永久跳过，进入银河新秩序、最终秩序、原力化身与宇宙飞升流程。最终秩序抉择将在二十年后到来。§!"
 foc_republic_origin.90.a:0 "让整个银河屈服。"

 foc_republic_origin.60.name:0 "银河条约"
 foc_republic_origin.60.desc:0 "帝国叛军攻入科洛桑，帕尔帕廷的帝国已经瓦解。各方随后签署§H银河条约§!：\n\n- 内环诸世界重组为以§H霍斯尼亚§!为首都的§H新共和国§!，由你继续统率；\n- 外环残部退往堡垒，以§H帝国残余§!之名维持旧帝国的最后一块疆土；\n- 双方裁撤内战舰队，各自保留两支工程船队、两座巨型战斗空间站与八支主力舰队，此后不得再扩张至对方疆域。\n\n条约签订了，但未知星域深处仍有人不承认它。"
 foc_republic_origin.60.a:0 "愿这份条约带来真正的和平。"

 foc_republic_origin.160.name:0 "银河条约：新共和国"
 foc_republic_origin.160.desc:0 "§H死星一号与死星二号均已被摧毁，叛军控制全部内环并占领贾库。§!各方正式签署银河条约：\n\n- 义军同盟改组为以§H霍斯尼亚§!为首都的§H新共和国§!，由你继续统率；\n- 帝国残部退往堡垒，以§H帝国残余§!之名保有外环；\n- 双方裁撤内战舰队，各自保留两支工程船队、两座巨型战斗空间站与八支主力舰队。\n\n银河终于安静下来。只是未知星域的方向，始终没有传回消息。"
 foc_republic_origin.160.a:0 "让新共和国从胜利中诞生。"

 foc_republic_origin.161.name:0 "银河条约：帝国残余"
 foc_republic_origin.161.desc:0 "§H两座死星均被摧毁，叛军已经控制全部内环与贾库。§!银河帝国无法继续维持旧疆域，只得接受银河条约：\n\n- 叛军在§H霍斯尼亚§!建立§H新共和国§!，接管内环；\n- 我方退守外环，以堡垒为都，改组为§H帝国残余§!；\n- 双方裁撤内战舰队，各自保留两支工程船队、两座巨型战斗空间站与八支主力舰队。\n\n条约上的签名是真的。撤往未知星域的舰队编号，却不在任何一份交接清单上。"
 foc_republic_origin.161.a:0 "帝国尚未终结。"

 foc_republic_origin.192.name:0 "霍斯尼亚陨落：共和国改组为义军"
 foc_republic_origin.192.desc:0 "§H霍斯尼亚不存在了。§!首都、议会、舰队司令部，连同数十亿人，在一道横贯星海的光柱中化为尘埃。新共和国的政府就此停止运转，内环的其余疆域在数日之内落入第一秩序之手。\n\n幸存的舰长、议员与情报人员在§H迪卡§!重新集结，把旧共和国的旗帜换成了一枚更小的徽记。子爵级的船坞、远古的经济网络、巨型战斗空间站，全都随首都一同失去了。\n\n剩下的只有§H义军同盟§!这个名字，和不肯投降的人。"
 foc_republic_origin.192.a:0 "共和国已逝，抵抗仍将继续。"

 foc_republic_origin.162.name:0 "第一秩序计划：项目解锁"
 foc_republic_origin.162.desc:0 "公开的战争结束了，交接清单也签了字。只是有几支舰队的编号，从来没有出现在任何一份清单上。\n\n它们正在向银河北缘的未知星域航行，带走了工程师、凯伯水晶勘探队，以及一整套还没来得及销毁的军工档案。下达撤退命令的是皇帝本人，签发日期比恩多还早。\n\n他从来没有打算让帝国活下去。他打算让别的东西活下去。\n\n§Y特殊项目§H第一秩序计划§!已加入情报日志。完成后开放伊冷星系，并解锁弑星者基地、至尊号与复兴级科技；此时不会立刻化身天灾。§!"
 foc_republic_origin.162.a:0 "批准秘密筹备。"

 foc_republic_origin.165.name:0 "第一秩序计划完成"
 foc_republic_origin.165.desc:0 "未知星域的航路终于绘制完成。\n\n§H伊冷§!是一颗被冰封的星球，地壳下埋着整个银河最纯净的凯伯水晶矿脉。绝地当年在这里为学徒采集晶体，用来做他们自己的第一把光剑；现在这里将供养一件足以让恒星熄灭的武器。\n\n伊冷与贾库之间的专用航道已经打通。对于银河条约而言，我们仍然是一支被解除武装的残余政权；但真正的新船坞已经转入未知星域和秘密军工网络。§H若玩家控制帝国残余，完成本计划后将解除“银河条约：解除武装”，重新允许秘密建造军用舰队。§!\n\n§Y解锁：弑星者基地、至尊号与复兴级科技。只有真正建成弑星者基地，现存政权才会改组为第一秩序并进入完整天灾流程。§!"
 foc_republic_origin.165.a:0 "第一秩序将从未知星域归来。"

 FOC_REPUBLIC_ORIGIN_FIRST_ORDER_PLAN_PROJECT:0 "第一秩序计划"
 FOC_REPUBLIC_ORIGIN_FIRST_ORDER_PLAN_PROJECT_DESC:0 "整合撤往未知星域的帝国舰队，勘探伊冷的凯伯水晶，并完成第一秩序的秘密军备体系。玩家帝国残余完成后将绕过银河条约的解除武装限制，恢复秘密军用舰队建造，并开放伊冷、弑星者基地、至尊号与复兴级科技。"

 foc_republic_origin.169.name:0 "斯卡里夫的帝国秘密科研基地"
 foc_republic_origin.169.desc:0 "死星已经服役，而我们截获了一段来自§H斯卡里夫§!的加密传输。\n\n那是一颗被整片行星护盾包住的热带世界，海面上架着帝国最大的数据塔。全部超级武器项目的原始工程档案都存放在那里——包括反应炉的完整结构图。\n\n发出这段传输的人没有报姓名，只说了一句：图纸里有东西不对劲，而且是有人故意留下的。\n\n§Y先夺取斯卡里夫，再攻击死星。取得档案后，进入死星所在星系的义军舰队将获得针对死星所属帝国的巨额定向增伤；死星本身的属性不受影响。§!"
 foc_republic_origin.169.a:0 "进攻斯卡里夫，夺取死星结构图。"

 foc_republic_origin.170.name:0 "死星一号完成"
 foc_republic_origin.170.desc:0 "那不是卫星。\n\n§H死星一号§!已经在科洛桑上空投入运行。塔金总督在启用仪式上说，从今天起帝国不再需要议会——恐惧本身就是最有效的行政手段，而恐惧现在有了一个可以停在任何一颗行星轨道上的形状。\n\n§Y第一秩序科技仍保持封锁；只有死星一号被摧毁后，帝国才会开放二阶段改进计划。§!"
 foc_republic_origin.170.a:0 "见证这座战斗空间站的全部威力。"

 foc_republic_origin.171.name:0 "死星一号被摧毁"
 foc_republic_origin.171.desc:0 "§H死星一号已经被摧毁。§!银河看见了帝国最可怕的武器也会爆炸。义军获得原有的一次性胜利奖励，对死星的旧攻击增伤立即失效。\n\n玩家帝国立即获得§H死星二号建造计划§!，完成工程时触发博桑情报事件，二号在恩多出现。AI帝国则在一号毁灭§H4年后§!暴露并部署未完工二号。\n\n原有帝国支援舰队规则保持：立即获得一支支援舰队，此后每360天再获得一支，直到死星二号被摧毁。"
 foc_republic_origin.171.a:0 "一个巨大的胜利，但战争尚未结束。"

 foc_republic_origin.173.name:0 "死星二号投入运行"
 foc_republic_origin.173.desc:0 "博桑谍报网已锁定§H恩多§!。死星二号未完工的骨架出现在森林卫星上空，超级激光已经可以开火。\n\n其船体、装甲、护盾与武器输出均为死星一号的§H1.3倍§!，初始移速为§H0§!。AI帝国不会进行完工与机动改装，斯卡里夫的旧死星增伤也不会再次生效。"
 foc_republic_origin.173.a:0 "那就再摧毁一次。"

 foc_republic_origin.174.name:0 "死星二号完成"
 foc_republic_origin.174.desc:0 "恩多上空，§H死星二号§!已进入战斗值班。其外壳和推进系统尚未完工，移速为§H0§!；船体、装甲、护盾与武器输出均为死星一号的§H1.3倍§!。\n\n玩家帝国可以在情报日志中手动研究§H死星二号：完工与机动改装§!。完成后，外观变为放大1.3倍的死星一号完整模型，机动能力恢复。AI不会执行这项升级。"
 foc_republic_origin.174.a:0 "这一次不会留下任何弱点。"

 foc_republic_origin.175.name:0 "死星二号被摧毁"
 foc_republic_origin.175.desc:0 "§H第二座也没了。§!\n\n地面小队摧毁了恩多的护盾发生器，义军战机从未完工的外壳缺口深入反应炉，将第二死星化为燃烧的残骸。帝国统治的支柱随之崩塌。\n\n§Y帝国的360天周期支援从此停止，已到达的舰队保留。义军仍获得本次死星毁灭自身的既有胜利奖励，但此后新取得的星系不再提供舰队、资源或新的维护费减免层数；未领取的新星系奖励同时取消。§!"
 foc_republic_origin.175.a:0 "帝国的恐惧武器已经化为尘埃。"

 foc_republic_origin.176.name:0 "双死星覆灭：内环起义"
 foc_republic_origin.176.desc:0 "两座死星都没有了。而帝国用来维持统治的从来不是舰队，是那两座空间站带来的恐惧。\n\n消息传开之后，内环诸星系在同一周之内易帜。总督被自己的驻军扣押，帝国税吏的办公室被砸开，几十年没有开过的地方议会重新召集起来。§H除了两个地方。§!\n\n§H科洛桑§!的驻军没有动摇，那里有整个帝国的政治机器和皇帝本人的卫队；§H夸特§!的环形船台被戒严接管，工人被赶出了船坞。这两颗世界不会自己倒下，必须打下来。\n\n外环也还没有表态，而外环的重心在§H贾库§!——帝国把最后一批预备舰队和一整套军械储备都放在了那里。\n\n§Y内环诸星系已转入叛军控制，科洛桑与夸特除外。银河条约仍要求叛军攻克科洛桑、夸特与贾库。§!"
 foc_republic_origin.176.a:0 "向贾库推进。"

 foc_republic_origin.177.name:0 "斯卡里夫：死星攻击解算"
 foc_republic_origin.177.desc:0 "斯卡里夫行动取得了死星档案，然而完整图纸还没有安全送达义军指挥部。\n\n§Y本事件只记录图纸被夺取，不立即发放死星特攻或护盾伤害加成。§!斯卡里夫战役后等待30天，奥德朗与莱雅救援事件才会进入后续剧情；莱雅获救后，义军方能完成弱点分析。"
 foc_republic_origin.177.a:0 "把结构图送往所有叛军舰队。"

 foc_republic_origin.178.name:0 "帝国直胜：弑星者计划"
 foc_republic_origin.178.desc:0 "最后一处义军基地的坐标是从一名被俘的通讯官身上拿到的。三天之后，那颗星球的地表被烧成了平地。\n\n银河内战结束了，而且没有留下第二面旗帜。\n\n皇帝随即批准了一份工程部门递过很多次的方案：死星只能摧毁一颗行星，而且需要开到目标附近。如果把武器直接建在一颗行星上，用整颗恒星供能，射程就不再是问题。\n\n§Y解锁弑星者基地。复兴级、至高无上级及其余第一秩序科技仍保持封锁，只有弑星者基地真正完工后才会开放；长矛级则继续封锁到最终秩序阶段。§!"
 foc_republic_origin.178.a:0 "开始弑星者基地工程。"

 foc_republic_origin.190.name:0 "弑星者基地：第一秩序崛起"
 foc_republic_origin.190.desc:0 "§H弑星者基地已经建成。§!\n\n一整颗行星被掏空，装上了恒星能量收集阵列。它开火的时候，被瞄准的不是一颗星球，而是一整个星系。\n\n完成这件事的政权已经不再是帕尔帕廷那个帝国了。它有自己的旗帜、自己的军队、自己的最高领袖，以及一个从未知星域带回来的名字。\n\n§Y国家正式改组为§H第一秩序§!并化身天灾，进入与第一秩序起源完全相同的银河新秩序、最终秩序、原力化身与宇宙飞升流程。§!"
 foc_republic_origin.190.a:0 "第一秩序将统治银河。"

 foc_republic_origin.182.name:0 "我们必须摧毁新共和国的首都"
 foc_republic_origin.182.desc:0 "§H弑星者基地已经完成充能。§!那颗恒星已经彻底熄灭，整个星系陷入黑暗。\n\n§Y[event_target:foc_story_new_republic_strike_country.GetName]§!的议会、舰队统帅部与主要通讯枢纽全部集中在§H[event_target:foc_story_new_republic_strike_target.GetName]§!。他们至今仍然相信这件武器只是宣传部门的传闻。\n\n§Y打开弑星者基地的射击界面，把这个世界设为首要目标。摧毁新共和国首都将粉碎其中央政府，并迫使幸存者退往迪卡组建义军。§!"
 foc_republic_origin.182.a:0 "把新共和国首都标为第一目标。"

 foc_republic_origin_death_star_two_reinforced:0 "死星二号强化结构"
 foc_republic_origin_death_star_two_reinforced_desc:0 "二阶段工程显著强化了战斗空间站的舰体、装甲、护盾、火力、射速、命中、追踪与再生能力。"
 foc_republic_origin_death_star_weakness:0 "斯卡里夫结构图"
 foc_republic_origin_death_star_weakness_desc:0 "旧存档兼容标记；结构图不再削弱死星本体，实际效果由义军的死星攻击解算提供。"
 foc_republic_origin_scarif_death_star_attack_solution:0 "斯卡里夫死星攻击解算"
 foc_republic_origin_scarif_death_star_attack_solution_desc:0 "义军舰队进入存活死星所在星系时，对死星所属帝国造成+2500%伤害；离开后自动关闭。死星自身属性不变。"
 foc_republic_origin_rebel_death_star_one_victory:0 "雅雯式胜利"
 foc_republic_origin_rebel_death_star_one_victory_desc:0 "摧毁第一座死星带来的士气、志愿兵与工业支援。"
 foc_republic_origin_rebel_death_star_two_victory:0 "第二座死星的覆灭"
 foc_republic_origin_rebel_death_star_two_victory_desc:0 "第二次摧毁帝国超级武器使更多星系公开加入起义。"
 foc_republic_origin_rebel_double_death_star_victory:0 "银河总起义"
 foc_republic_origin_rebel_double_death_star_victory_desc:0 "两座死星均被摧毁后，内环全面倒向叛军。"
 foc_republic_origin_scarif_intelligence:0 "斯卡里夫死星情报"
 foc_republic_origin_scarif_intelligence_desc:0 "莱雅获救并带回完整图纸后，义军才完成死星结构与帝国偏导护盾频率分析。武器对护盾伤害+50%；死星一号特攻另受存活、同星系等条件限制。"
 FOC_REPUBLIC_ORIGIN_PALPATINE_CHANCELLOR_NAME:0 "帕尔帕廷"

 foc_republic_origin.5.name:0 "纳布危机"
 foc_republic_origin.5.desc:0 "§L银河仍相信共和国能够渡过危机，而危机本身却正在重塑共和国。§!\n\n贸易联盟以抗议航道税为名，把整支运输舰队开到了§H纳布§!轨道上，切断了这颗中环星球与外界的一切联系。议会用了整整数周争论调查团的程序问题，救援舰队始终没有出港。\n\n纳布的当选女王§H帕德梅·纳贝里·阿米达拉§!亲自到科洛桑陈情。她今年十四岁。她在议会大厅里被告知：先成立委员会，再讨论是否派兵。\n\n于是她做了另一件事——当场提出对现任最高议长的不信任案。\n\n动议通过了。接替那个位置的，正是纳布自己派驻议会的那位议员，一个从来不引人注意、说话总是很有分寸的人：§H帕尔帕廷§!。\n\n他在就职演说里向议会保证，共和国需要的只是效率。\n\n（阿米达拉后来带着一支临时拼凑的部队打回纳布，解除了封锁。同行的还有一个从塔图因带回来的九岁男孩。）\n\n§Y固定剧情节点：阴谋＋10，只记录一次。§!"
 foc_republic_origin.5.a:0 "封锁解除了，而议长换了人。"

 foc_republic_origin.24.name:0 "夸特船坞扩建"
 foc_republic_origin.24.desc:0 "§L最高议会仍试图用程序维持秩序，然而战争正在把每一道旧规则推向极限。§!\n\n夸特轨道上的最后一组新船台点亮了导航灯。共和国海军早已拥有少量猎兵级服役舰，但它们始终依赖有限的专用船台与手工装配，无法支撑一场席卷银河的长期战争。\n\n如今，新的标准化生产线终于贯通。猎兵级不再只是中央舰队中屈指可数的重型旗舰——从这一刻起，它将成为共和国真正能够持续补充的战争主力。\n\n§Y固定剧情节点：阴谋＋10，只记录一次。§!\n\n§H先进耐钢装甲§!现已解锁。夸特将获得行星环奖励；没有既有环、施工或废墟时，直接建成配备§H4座船坞§!的§H三级行星环§!。"
 foc_republic_origin.24.a:0 "让新舰下水。"

 FOC_REPUBLIC_ORIGIN_KUAT_INVESTMENT_PROJECT:0 "夸特船坞扩建工程"
 FOC_REPUBLIC_ORIGIN_KUAT_INVESTMENT_PROJECT_DESC:0 "共和国工程部门将向夸特动力船坞注资，铺设能够容纳新一代主力舰的大型船台。工程完成后解锁§H猎兵级歼星舰§!，并推进§H帕尔帕廷的阴谋§!。\n\n完成扩建后解锁§H先进耐钢装甲§!，并在夸特行星落实行星环奖励：没有既有环、施工或废墟时，直接建成配备§H4座船坞§!的§H三级行星环§!。"

 foc_republic_origin_clone_army_program:0 "克隆人战争动员"
 foc_republic_origin_clone_army_program_desc:0 "卡米诺的培育舱与共和国的训练体系全速运转，源源不断地向前线输送人口与军团。"

 foc_republic_origin_plot_progress_separatist_war:0 "自动计分已停用"
 foc_republic_origin_plot_progress_postwar_powers:0 "自动计分已停用"
 foc_republic_origin_plot_progress_clone_army:0 "自动计分已停用"
 foc_republic_origin_rebellion_war_effort:0 "义军战时体制"
 foc_republic_origin_rebellion_war_effort_desc:0 "隐蔽船坞、缴获的帝国装甲板与不计代价的改装，让蒙卡拉马利巡洋舰得以在正面交战中顶住帝国级歼星舰的火力。这套体制只属于反抗帝国的战争年代。"
 foc_republic_origin.180.name:0 "执行者级正式服役"
 foc_republic_origin.180.desc:0 "三座军港收到了启航命令。\n\n§H执行者号§!率30艘帝国 II 级驻守恩多，§H卢桑基亚号§!率30艘帝国 II 级驻守科洛桑，§H惩罚者号§!率30艘帝国 II 级驻守贾库。\n\n三支编队各为§H1艘执行者级＋30艘帝国 II 级§!。三艘剧情旗舰各自只服役一次，被摧毁后不会重建。"
 foc_republic_origin.180.a:0 "让它出现在叛军的天空上。"

 FOC_REPUBLIC_ORIGIN_YODA_NAME:0 "尤达"
 FOC_REPUBLIC_ORIGIN_WINDU_NAME:0 "梅斯·温杜"
 FOC_REPUBLIC_ORIGIN_KENOBI_NAME:0 "欧比旺·克诺比"
 FOC_REPUBLIC_ORIGIN_ANAKIN_NAME:0 "安纳金·天行者"
 FOC_REPUBLIC_ORIGIN_VADER_NAME:0 "达斯·维达"
 FOC_REPUBLIC_ORIGIN_CODY_NAME:0 "科迪指挥官"
 FOC_REPUBLIC_ORIGIN_TARKIN_NAME:0 "威尔霍夫·塔金"

 foc_republic_origin_jedi_order:0 "绝地武士团"
 foc_republic_origin_jedi_order_desc:0 "武士团不隶属于任何一个成员星系，却为共和国维持了上千代人的和平。他们调解纠纷、护送使节、镇抚边疆，也在必要时拔出光剑。"
 foc_republic_origin_jedi_generals:0 "绝地将军"
 foc_republic_origin_jedi_generals_desc:0 "绝地被临时授予军衔，带着克隆人军团出现在每一条战线上。这是武士团第一次成建制地参战，也将是最后一次。"
 foc_republic_origin_jedi_survivor:0 "幸存的绝地"
 foc_republic_origin_jedi_survivor_desc:0 "一个人活了下来。对舰队实力而言微不足道，但对那些知道武士团尚未断绝的人来说，这就是全部的意义。"
 foc_republic_origin_inquisitorius:0 "审判庭"
 foc_republic_origin_inquisitorius_desc:0 "帝国的审判官在银河各地追猎残余的绝地。高效，而且令人憎恶。"
 foc_republic_origin_senate_backlash:0 "议会反弹"
 foc_republic_origin_senate_backlash_desc:0 "武士团把矛头指向了最高议长办公室。议会迅速围拢到他身边，而绝地被描绘成越权的一方。"

 foc_republic_origin.6.name:0 "绝地议会"
 foc_republic_origin.6.desc:0 "科洛桑神殿的高塔上，绝地议会为新一届议会送来了他们的致意。大议长§H尤达§!与§H梅斯·温杜§!大师代表武士团出席。\n\n武士团不属于任何一个成员星系，也不受议会节制。上千代人以来，他们调解纠纷、护送使节、镇抚边疆，把这个庞大而松散的共同体维系在一起。作为回报，共和国从不过问他们的事务。\n\n尤达只提了一句：原力最近有些不安。\n\n§H绝地神殿§!已在科洛桑开放。只要它还矗立，共和国就能从中征召绝地编队。"
 foc_republic_origin.6.a:0 "愿原力与共和国同在。"

 foc_republic_origin.7.name:0 "绝地将军"
 foc_republic_origin.7.desc:0 "外环开战之后，议会通过决议：绝地武士临时授予军衔，出任克隆人军团的指挥官。§H欧比旺·克诺比§!与他的前学徒§H安纳金·天行者§!同时接过将星。\n\n神殿内部对此争论激烈。有人说守护者不该成为将军，有人说共和国需要他们。最终议会还是把光剑送上了战场。\n\n这是武士团第一次成建制地参战。尤达在议会闭门会议上说了一句没人愿意记录在案的话：这场战争会改变武士团，而不是相反。"
 foc_republic_origin.7.a:0 "他们会在每一条战线上。"

 foc_republic_origin.8.name:0 "议会的疑虑"
 foc_republic_origin.8.desc:0 "§L这一刻没有宏大的仪式，只有一道命令、一份报告，以及后来无人能够逆转的后果。§!\n\n绝地大师私下求见。\n\n他说，武士团感知到一股黑暗面的存在，就在科洛桑，就在权力的中心附近——但原力被某种东西遮蔽了，他们看不清那是谁。武士团请求授权，对最高议长办公室展开调查。\n\n这在共和国的历史上从未有过。如果你批准，等同于公开质疑一位战时议长；如果你拒绝，武士团会服从，然后继续在黑暗中摸索。\n\n§Y本次是五个关键抉择之一。只有有利于帕尔帕廷的选项计入20点；另一项为0。每项只记一次。§!"
 foc_republic_origin.8.a:0 "授权调查。（原议会反弹修正，阴谋＋0）"
 foc_republic_origin.8.b:0 "压下此事。（原资源奖励，阴谋＋20）"

 foc_republic_origin.26.name:0 "还有人活着"
 foc_republic_origin.26.desc:0 "一艘伤痕累累的小型飞船在基地边缘请求降落，识别码属于一个早已注销的绝地编队。\n\n舱门打开时，走出来的人身上还带着神殿的灰——§H欧比旺·克诺比§!。66 号命令那一夜，绝地几乎被屠戮殆尽，而他是少数逃出科洛桑的人之一。\n\n他带来的第一句话不是关于自己：那个执行清洗、亲手屠戮神殿的人，曾经是他的学徒。\n\n但武士团没有断绝。这个消息本身，就足以让整个反抗运动重新挺直腰杆。"
 foc_republic_origin.26.a:0 "把这个消息传出去。"

 foc_republic_origin.27.name:0 "审判官"
 foc_republic_origin.27.desc:0 "66 号命令并未杀死每一个绝地。总有几个人在那一夜逃了出去，藏进了银河的褶皱里。\n\n皇帝对此早有安排。一批堕落的原力使者被召集起来，授予黑色的战甲与旋转的光剑，编成一个只对他本人负责的机构：§H审判庭§!。\n\n他们的任务只有一个——找出剩下的人。"
 foc_republic_origin.27.a:0 "一个也不许留下。"
 foc_republic_origin_darth_vader:0 "达斯·维达"
 foc_republic_origin_darth_vader_desc:0 "他不是一种舰队学说，而是一个人。他登舰的那一刻，帝国的军队与军官会以完全不同的方式行事——出于忠诚，也出于恐惧。"

 foc_republic_origin.28.name:0 "天选之子"
 foc_republic_origin.28.desc:0 "神殿的火还没有灭。\n\n执行 66 号命令的那支部队由一名绝地率领——共和国最锋利的一把剑，欧比旺·克诺比的学徒，曾被预言为终结西斯的\"天选之子\"。他走进自己长大的地方，然后再没有以那个名字走出来。\n\n皇帝为他重新命名：§H达斯·维达§!。\n\n从今往后，帝国的意志会亲自出现在战场上。"
 foc_republic_origin.28.a:0 "起来吧，我的徒弟。"
 foc_republic_origin.28.b:0 "我们失去的不只是一座神殿。"
 building_foc_republic_origin_jedi_temple:0 "绝地神殿"
 building_foc_republic_origin_jedi_temple_desc:0 "科洛桑的五座尖塔矗立了上千年。这里是绝地议会的所在，是全银河绝地学徒受训的地方，也是整个武士团档案与传承的中枢。\n\n只要神殿还在，共和国就能从中征召绝地编队。"
 foc_republic_origin_jedi_padawans:0 "绝地学徒团"
 foc_republic_origin_jedi_padawans_desc:0 "尚未通过试炼的学徒，在战争的压力下提前被送上前线。他们的光剑还不够稳，但已经足以让分离主义的机器人军团付出代价。"
 foc_republic_origin_jedi_knights:0 "绝地武士团"
 foc_republic_origin_jedi_knights_desc:0 "完成试炼的绝地武士。一名武士足以顶住一整个连队的机器人，而他们从不需要考虑士气问题。"
 foc_republic_origin_jedi_masters:0 "绝地大师团"
 foc_republic_origin_jedi_masters_desc:0 "议会亲自派出的绝地大师。他们通常不参与地面战斗——一旦参与，战线就不再是战线。"

 foc_republic_origin.12.name:0 "商业财团的提案"
 foc_republic_origin.12.desc:0 "§L科洛桑的灯火照亮整颗星球，却照不穿正在权力中心聚拢的阴影。§!\n\n贸易联盟、银行业协会与技术联合会派出了同一个代表团。他们要的东西写得很客气：承认财团\"护航部队\"的合法地位，换取一笔数额惊人的自愿捐助与航道税减免。\n\n所有人都清楚那些\"护航部队\"是什么——那是几支不受议会节制的舰队。\n\n最高议长办公室对此没有表态，只是把提案排进了本届会期。\n\n§Y本次是五个关键抉择之一。只有有利于帕尔帕廷的选项计入20点；另一项为0。每项只记一次。§!"
 foc_republic_origin.12.a:0 "接受捐助。（原资源奖励，阴谋＋20）"
 foc_republic_origin.12.b:0 "驳回提案。（原政治代价，阴谋＋0）"

 foc_republic_origin.13.name:0 "军队组建法案"
 foc_republic_origin.13.desc:0 "§L科洛桑的万千航道依旧闪烁，但共和国的命运已经在这一刻悄然偏转。§!\n\n议会为一份法案吵了整整一个会期：共和国是否应当拥有一支属于自己的常备军？\n\n千年以来，共和国的武力一直由成员星系自行提供。支持者说边疆已经不安全了；反对者说，一支只对科洛桑负责的军队，迟早会被科洛桑的某个人拿去用。\n\n表决权在你手里。\n\n§Y本次是五个关键抉择之一。只有有利于帕尔帕廷的选项计入20点；另一项为0。每项只记一次。§!"
 foc_republic_origin.13.a:0 "通过法案。（原军队加成，阴谋＋20）"
 foc_republic_origin.13.b:0 "维持成员星系供军。（原资源奖励，阴谋＋0）"

 foc_republic_origin.14.name:0 "无法解释的账目"
 foc_republic_origin.14.desc:0 "§L共和国档案馆后来把这一日单独封存，因为许多改变银河的决定都始于看似普通的一次报告。§!\n\n一名审计员在例行核查中发现了一笔钱。数额不大，但它在预算里出现了十一次，每一次的收款方都是一家注册在外环、没有雇员的空壳公司。\n\n顺着线索往上查，第三层就撞上了一份需要最高议长办公室授权才能调阅的档案。\n\n审计员在报告末尾问：是否继续？\n\n§Y本次是五个关键抉择之一。只有有利于帕尔帕廷的选项计入20点；另一项为0。每项只记一次。§!"
 foc_republic_origin.14.a:0 "查到底。（原调查代价，阴谋＋0）"
 foc_republic_origin.14.b:0 "结案归档。（原资源奖励，阴谋＋20）"

 foc_republic_origin.15.name:0 "紧急权力续期"
 foc_republic_origin.15.desc:0 "§L银河仍相信共和国能够渡过危机，而危机本身却正在重塑共和国。§!\n\n战时紧急状态即将到期。按照法律，权力应当在期满之日交还议会。\n\n但前线还在打，舰队调度、军备征用、行省戒严，全都挂在那一纸授权上。最高议长在发言中只说了一句：他会在战争结束的那一天亲自交还这些权力。\n\n议会正在等你的态度。\n\n§Y本次是五个关键抉择之一。只有有利于帕尔帕廷的选项计入20点；另一项为0。每项只记一次。§!"
 foc_republic_origin.15.a:0 "延长紧急状态。（原战时加成，阴谋＋20）"
 foc_republic_origin.15.b:0 "按期交还权力。（原监督修正，阴谋＋0）"

 foc_republic_origin.22.name:0 "克隆人计划后的夸特扩建"
 foc_republic_origin.22.desc:0 "§H克隆人计划§!完成决策后，共和国必须为即将到来的大规模战争准备真正的主力舰生产能力。§H夸特动力船坞§!随即向议会提交全面扩建方案。\n\n只要共和国仍控制夸特，就可以在当地开展扩建工程；若工程期间失去夸特，项目将中止，夺回后必须重新开始。工程科研量按早期共和国工程学水平设计为约§H8年§!。"
 foc_republic_origin.22.a:0 "开工吧。"

 foc_republic_origin.23.b:0 "依靠成员星系民兵。（保留原效果，阴谋＋0）"

 foc_republic_origin.181.name:0 "塔金主义"
 foc_republic_origin.181.desc:0 "死星已经服役，问题随之而来：它究竟是用来做什么的？\n\n塔金总督的主张写在一份呈递皇帝的备忘录里——§H通过对武力的恐惧统治，而不是通过武力本身§!。一座能摧毁行星的空间站，只要存在，就能让一千个星系放弃反抗的念头。不需要真的开火。\n\n另一派的意见更朴素：帝国终究还是要收税、修路、发放配给。恐惧管得住一时，管不住一百年。"
 foc_republic_origin.181.a:0 "以恐惧统治。（政府吸引力与稳定度大增，犯罪与不满上升）"
 foc_republic_origin.181.b:0 "以治理统治。（产出、治安与民生改善）"

 foc_republic_origin_asset_mon_cala:0 "蒙卡拉马利船坞"
 foc_republic_origin_asset_mon_cala_desc:0 "蒙卡拉的水下船坞能造出银河系最坚固的巡洋舰。谁控制它，谁的舰队就补得更快。"
 foc_republic_origin_asset_kamino:0 "卡米诺培育设施"
 foc_republic_origin_asset_kamino_desc:0 "卡米诺人的克隆流水线仍在运转。控制这颗星球的一方，能以任何人都不该有的速度补充兵员。"
 foc_republic_origin_asset_kuat:0 "夸特动力船坞"
 foc_republic_origin_asset_kuat_desc:0 "银河系最大的军用造船工业。控制夸特，军舰就更便宜、更快。"
 foc_republic_origin_tarkin_doctrine:0 "塔金主义"
 foc_republic_origin_tarkin_doctrine_desc:0 "通过对武力的恐惧统治，而不是通过武力本身。采纳后会立即移除帝国殖民地的§R未驻防稳定度惩罚§!，且该惩罚不会再次施加；同时全帝国星球获得§G+8稳定度§!。顺从来得很快，而失去一切的人也在变多。"
 foc_republic_origin_new_order_administration:0 "新秩序行政体系"
 foc_republic_origin_new_order_administration_desc:0 "帝国终究还是要收税、修路、发放配给。恐惧管得住一时，治理才管得住一百年。"
 foc_republic_origin_combine_resentment:0 "财团离心"
 foc_republic_origin_combine_resentment_desc:0 "商业财团被驳回之后，把资本和航线一起挪去了别处。"
 foc_republic_origin_military_creation_act:0 "军队组建法案"
 foc_republic_origin_military_creation_act_desc:0 "共和国第一次拥有了属于自己的常备武装。"
 foc_republic_origin_emergency_powers:0 "战时紧急权力"
 foc_republic_origin_emergency_powers_desc:0 "调度、征用与戒严不再需要经过议会表决。效率高得惊人。"
 foc_republic_origin_senate_oversight:0 "议会监督"
 foc_republic_origin_senate_oversight_desc:0 "每一道军令都要经过表决。战争因此打得很慢，但共和国还是共和国。"
 foc_republic_origin_militia_levies:0 "成员星系征召"
 foc_republic_origin_militia_levies_desc:0 "没有克隆人军团，前线由各成员星系自行派兵填补。装备参差，指挥混乱，但这支军队不属于任何一个人。"
 foc_republic_origin_command.1.release_timeline:0 "强制放行当前剧情时间轴。"
 foc_republic_origin_command.1.fo_origin_repair:0 "修复并继续第一秩序弑星者后续剧情。"
 foc_republic_origin_command.1.trigger_first_order:0 "立即触发普通起源的第一秩序危机。"
