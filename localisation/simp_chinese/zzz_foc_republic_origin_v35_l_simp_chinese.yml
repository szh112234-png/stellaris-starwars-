l_simp_chinese:
 foc_republic_origin.60.desc:0 "帝国叛军攻入科洛桑，帕尔帕廷的帝国已经瓦解。各方随后签署§H银河条约§!：\n\n- 内环诸世界重组为以§H霍斯尼亚§!为首都的§H新共和国§!，由你继续统率；\n- 外环残部退往堡垒，以§H帝国残余§!之名维持旧帝国的最后一块疆土；\n- 两国均保持为普通国家，不会转化为堕落帝国；\n- 双方裁撤内战舰队，各自保留两支工程船队、两座巨型战斗空间站与八支主力舰队，此后不得再扩张至对方疆域。\n\n条约签订了，但未知星域深处仍有人不承认它。"
 foc_republic_origin.160.desc:0 "§H死星一号与死星二号均已被摧毁，叛军控制全部内环并占领贾库。§!各方正式签署银河条约：\n\n- 义军同盟改组为以§H霍斯尼亚§!为首都的§H新共和国§!，由你继续统率，并获得§H子爵级§!的封装设计；\n- 帝国残部退往堡垒，以§H帝国残余§!之名保有外环；\n- 两国均保持为普通国家，不会转化为堕落帝国；\n- 双方裁撤内战舰队，各自保留两支工程船队、两座巨型战斗空间站与八支主力舰队。\n\n银河终于安静下来。只是未知星域的方向，始终没有传回消息。"
 foc_republic_origin.161.desc:0 "§H两座死星均被摧毁，叛军已经控制全部内环与贾库。§!银河帝国无法继续维持旧疆域，只得接受银河条约：\n\n- 叛军在§H霍斯尼亚§!建立§H新共和国§!，接管内环并获得§H子爵级§!的封装设计；\n- 我方退守外环，以堡垒为都，改组为§H帝国残余§!；\n- 两国均保持为普通国家，不会转化为堕落帝国；\n- 双方裁撤内战舰队，各自保留两支工程船队、两座巨型战斗空间站与八支主力舰队。\n\n条约上的签名是真的。撤往未知星域的舰队编号，却不在任何一份交接清单上。"
