l_simp_chinese:
 foc_ds2_integration.bothan.name:0 "博桑谍报网情报行动"
 foc_ds2_integration.bothan.desc:0 "义军在得知死星存在后，博桑间谍网（Bothan Spynet）倾巢出动。虽然遭到了帝国的残酷反击，但他们最终成功锁定了死星二号在§H恩多§!的具体建造位置，并拿到了关键的技术结构数据（蓝图）。\n\n许多博桑人为这份情报付出了生命。恩多森林卫星上空，尚未合拢的死星二号已经具备作战能力，但推进系统仍未完工。斯卡里夫的旧攻击方案已随死星一号的毁灭而失效，这份新蓝图不会恢复旧有的死星增伤。"
 foc_ds2_integration.bothan.a:0 "他们的牺牲不会被遗忘。"
 foc_ds2_integration.bothan.empire.desc:0 "死星二号的主体工程已经完成。恩多森林卫星上空，尚未合拢的战斗空间站已进入战斗值班，推进系统仍待最后改装。\n\n帝国情报局报告：博桑间谍网（Bothan Spynet）在义军得知死星存在后倾巢出动。尽管反情报部队进行了残酷反击，他们仍窃取了关键技术结构数据，向义军暴露了§H恩多§!的建造位置。\n\n新站的船体、装甲、护盾与武器输出均为死星一号的§H1.3倍§!。你可以在情报日志中研究§H死星二号：完工与机动改装§!，使外壳合拢并恢复机动能力。"
 foc_ds2_integration.bothan.empire.a:0 "保卫恩多，准备下一阶段改装。"
 FOC_DS2_MOBILE_REFIT_PROJECT:0 "死星二号：完工与机动改装"
 FOC_DS2_MOBILE_REFIT_PROJECT_DESC:0 "完成恩多上空死星二号的外壳与推进系统工程。研究完成后，原空间站换装为§H放大至死星一号1.3倍尺寸的完整模型§!，并恢复死星一号的机动能力。\n\n船体、装甲、护盾和武器输出仍保持一号的1.3倍。此项目仅供玩家帝国手动研究，AI不会执行。若空间站正在战斗，换装将在脱离战斗后进行。"
 foc_ds2_integration.refit.name:0 "死星二号：全面完工"
 foc_ds2_integration.refit.desc:0 "最后一段装甲外壳完成封闭，推进系统也已通过测试。\n\n死星二号现以死星一号§H1.3倍尺寸§!的完整外观投入服役，机动能力恢复至死星一号水平。船体、装甲、护盾及武器输出仍为一号的1.3倍。帝国最强大的战斗空间站，现在可以驶向下一个目标。"
 foc_ds2_integration.refit.a:0 "启动推进系统。"
