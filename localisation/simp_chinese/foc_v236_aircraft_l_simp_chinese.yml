 SSP_TRI_HANGAR_01:0 "分离主义 TRI 三联点防战斗机中队（24架｜旧平衡｜1×） #1"
 SSP_TRI_HANGAR_01_DESC:0 "每中队 24 架。中队基础单轮总伤害 2000，平均分到单机约 83.3333；不是每架造成 2000 伤害，也不是每秒伤害。\n中队总船体 2400、装甲 480、护盾 0，均按架数分配。\n点防战斗机：可拦截敌方舰载机和导弹；使用绿色激光弹。\n显示倍率只改变外观，不改变架数、伤害或血量。实际战斗数值还受国家、舰船、科技和射速修正影响。\n同一舰船的多个本机型机库请用不同编号，以便战略打击逐个识别。"
