 FOC_TRADE_LUCREHULK_ARC170_FOC_LOWEST_DESC:0 "每中队 24 架。中队基础单轮总伤害 80，平均分到单机约 3.3333；不是每架造成 80 伤害，也不是每秒伤害。\n中队总船体 320、装甲 320、护盾 0，均按架数分配。\n点防战斗机：可拦截敌方舰载机和导弹；使用绿色激光弹。\n显示倍率只改变外观，不改变架数、伤害或血量。实际战斗数值还受国家、舰船、科技和射速修正影响。"
