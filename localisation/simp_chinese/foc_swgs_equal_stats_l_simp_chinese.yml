 FOC_KHAN_ADAPTIVE_DEFENSE_ARMOR_DESC:0 "先进耐钢装甲将高强度合金、反应装甲与场效应缓冲层结合，构成主力舰的最后防线。"
 FOC_KHAN_DEFENCE_TURBO_G_EC_DESC:0 "高速跟踪阵列引导绿色涡轮激光束，在来袭战机与导弹接近舰体前将其击碎。"
 FOC_REBEL_DEFENCE_TURBO_R_EC_DESC:0 "高速跟踪阵列引导红色涡轮激光束，以密集火网封锁主力舰周围的近距空域。"
