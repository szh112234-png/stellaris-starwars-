l_simp_chinese:
 foc_v232e_palpatine_return.2.name:0 "皇帝归来：死者再度发声"
 foc_v232e_palpatine_return.2.desc:0 "§L最先传来的，是那个声音。军用频道、截获的通讯以及厄西戈永不停息的风暴中，一个本应在恩多彻底消失的存在再次开口。§!\n\n帕尔帕廷皇帝确实死在了第二死星。达斯·维达将他投入反应堆炉心，随后战斗空间站的毁灭吞没了他的肉体。但西斯永恒保存了他残存的意识，并在漫长岁月里不断培育能够承载这股黑暗意志的克隆躯体。如今，在厄西戈，其中一具躯体终于成功承受了他的回归。\n\n一具伤痕累累的克隆体睁开双眼，王座再次有了主人。第一秩序残部与西斯永恒共同跪伏，萨斯顿级舰队重新听候皇帝号令。§H帕尔帕廷已经归来，最终秩序终于迎回了它真正的皇帝。§!"
 foc_v232e_palpatine_return.2.a:0 "死去的皇帝再次统治银河。"
