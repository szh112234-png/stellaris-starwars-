 foc_v17_tech_imperialsd2:0 "帝国II型改装"
 foc_v17_tech_imperialsd2_desc:0 "死星的损失迫使帝国重新依赖主力舰队。帝国II型改装加厚了装甲带，偏导护盾发生器成倍增设，涡轮激光群也为战列交战重新配平——而船坞造价与I型持平。"
 foc_imperialsd2_foc_lowest:0 "帝国II型歼星舰"
 foc_imperialsd2_foc_lowest_plural:0 "帝国II型歼星舰"
 foc_v17_isd2.1.name:0 "歼星舰的弱点"
 foc_v17_isd2.1.desc:0 "战斗空间站没了,连同“一件武器就能镇住整个银河“这套说法一起没了。雅汶之后的这几周,海军委员会把帝国I型全部的战斗报告拆了个遍。\n\n结论并不好看。偏导护盾在背部沟槽一带覆盖明显偏薄。装甲带是按“射程永远压过对手“的舰队设计的。涡轮激光群的配平面向轨道轰炸,而不是面向会还击的主力舰之间的战列交战。\n\n夸特的船坞三项都能改。而且这次改装,不会比帝国现在已经在花的多花一分。"
 foc_v17_isd2.1.a:0 "升级我们的舰船。"
