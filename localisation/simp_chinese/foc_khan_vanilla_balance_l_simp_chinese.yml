l_simp_chinese:
 foc_khan_vanilla_balance_country_combat:0 "受限战备"
 foc_khan_vanilla_balance_country_combat_desc:0 "舰队按照常规银河战争的能源、弹药与后勤标准作战。"
 foc_khan_vanilla_balance_standard_ship:0 "常规战备配置"
 foc_khan_vanilla_balance_standard_ship_desc:0 "这艘舰船的反应堆输出与防御储备受到严格配给，以适应长期银河战争。"
 foc_khan_vanilla_balance_heavy_ship:0 "重型舰战备限制"
 foc_khan_vanilla_balance_heavy_ship_desc:0 "超大型舰体的能源被分配给维生、推进与远征补给，其正面战力被控制在常规主力舰范围内。"
 foc_khan_vanilla_balance_xyston:0 "长矛级受限战备"
 foc_khan_vanilla_balance_xyston_desc:0 "长矛级的轴基超级激光、装甲储备与护盾输出受到厄西戈有限补给的约束。"
 foc_khan_vanilla_balance_supercapital:0 "超级主力舰战备限制"
 foc_khan_vanilla_balance_supercapital_desc:0 "这艘超级主力舰尚未完成全面战争动员，武库与防御系统以受限功率运转。"
 foc_khan_vanilla_balance_ultracapital:0 "旗舰战备限制"
 foc_khan_vanilla_balance_ultracapital_desc:0 "庞大舰体的能源必须维持指挥、造船和后勤设施，无法全部投入武器与护盾。"
 foc_khan_vanilla_balance_player_supremacy:0 "至尊号受限战备"
 foc_khan_vanilla_balance_player_supremacy_desc:0 "至尊号以移动首都与方舟舰身份运行，大量能源被用于人口、船坞和指挥设施。"
 foc_khan_vanilla_balance_supremacy_speed:0 "至尊号战略航速"
 foc_khan_vanilla_balance_supremacy_speed_desc:0 "巨型移动首都仍保持较低航速。"
 foc_khan_vanilla_balance_starkiller_world:0 "弑星者基地受限战备"
 foc_khan_vanilla_balance_starkiller_world_desc:0 "基地尚未进入末日战备状态，驻军、护盾与地表火力维持在大型要塞世界的水平。"
 foc_khan_vanilla_balance_arkship:0 "方舟舰远征配置"
 foc_khan_vanilla_balance_arkship_desc:0 "方舟舰将主要能源留给殖民地、科研设施与造船体系，因此无法发挥纯粹战舰的全部火力。"
