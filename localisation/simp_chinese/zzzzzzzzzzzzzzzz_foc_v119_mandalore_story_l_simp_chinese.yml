 foc_canon.11.name:0 "摩尔夺权（20 BBY）"
 foc_canon.11.desc:0 "曼达洛坚持多年的中立终于从内部崩塌。前西斯§H摩尔§!把死神卫、黑日、派克辛迪加与其他犯罪势力捏合成影子集团，再让曼达洛人自己的政治裂痕替他打开首都的大门。\n\n摩尔没有满足于幕后操纵。他依照曼达洛最古老也最残酷的传统发起决斗，并在众目睽睽之下取胜。§H暗剑§!落入他的手中，部分死神卫随即向新的统治者宣誓效忠。\n\n莎廷女公爵被俘。摩尔在欧比旺·克诺比面前处决了她，以一场私人复仇宣告新政权的诞生。\n\n然而曼达洛没有真正屈服。莎廷的妹妹§H博-卡坦·克里兹§!拒绝承认一个外来者凭暗剑取得的统治权，率领忠于曼达洛的氏族脱离死神卫。首都属于摩尔，但星球各地已经燃起抵抗。"

 foc_canon.41.name:0 "曼达洛围攻战（19 BBY）"
 foc_canon.41.desc:0 "共和国已经走到覆灭前的最后几步，曼达洛的内战却仍未结束。博-卡坦向共和国求援，而绝地委员会无法公开干涉这个中立世界。最终接受请求的人，是已经离开绝地武士团的§H阿索卡·塔诺§!。\n\n阿纳金将第501军团的一部分交给她指挥。以橙色头盔标记的§H第332连§!随阿索卡和雷克斯进入曼达洛，博-卡坦的抵抗组织则从城市内部同时发动进攻。共和国炮艇穿过首都上空时，死神卫与摩尔的超级突击队在街巷和穹顶之间展开最后抵抗。\n\n摩尔已经预感到银河即将发生灾难。他试图说服阿索卡与自己联手对付达斯·西迪厄斯，但没有成功。两人在王座大厅和城市钢架之间展开决斗。最终，阿索卡击败并§H逮捕摩尔§!。\n\n摩尔政权崩溃。博-卡坦重新集结曼达洛氏族并接管政权，而共和国军队没有将曼达洛并入共和国。曼达洛仍是一个§H独立国家§!。但就在押送摩尔的舰队离开母星时，另一道命令正在从科洛桑发往全银河的克隆人军团……"

 foc_mandalore.20.name:0 "帝国吞并曼达洛"
 foc_mandalore.20.desc:0 "共和国已经不复存在。新生的银河帝国不准备继续容忍一个拥有贝斯卡矿藏、武装氏族和独立军事传统的曼达洛。帝国舰队进入星系，博-卡坦的战后政府被解除权力，驻军接管了首都与轨道设施。\n\n曼达洛的主权被正式废除，星系被纳入帝国统治。许多氏族转入地下，另一些则在占领与合作之间寻找生存空间。摩尔在共和国崩溃的混乱中逃脱，但曼达洛没有因此获得自由。"

 foc_canon.48.name:0 "千泪之夜"
 foc_canon.48.desc:0 "第二颗死星的毁灭没有给曼达洛带来自由。帝国残余决定彻底解决这个反复反抗的世界。轰炸机、巡洋舰与地面部队同时发动清洗，攻击目标不再只是军事设施，而是城市、铸甲工坊、氏族堡垒和能够支撑曼达洛社会继续存在的一切基础。\n\n火焰覆盖大地。幸存者后来把这一夜称为§H“千泪之夜”§!。帝国不是来重新占领曼达洛，而是要让曼达洛人相信母星已经永远无法居住。\n\n废墟深处，帝国军官§H吉迪恩§!却留下了一项没有出现在公开战报中的工程：一座隐蔽的克隆与实验基地。曼达洛被宣告死亡，而帝国仍在它的尸骸下面进行自己的计划。"

 foc_canon.30.name:0 "光复曼达洛"
 foc_canon.30.desc:0 "银河条约已经签署六年，而曼达洛仍被帝国残余死死攥在手中。曾经覆盖母星的火海没有消灭曼达洛人，只把幸存氏族驱散到了银河各处。如今，长期潜伏的氏族终于等到了帝国控制最虚弱的一刻。\n\n§H博-卡坦·克里兹§!重新集结流亡战士，§H丁·贾林§!与各氏族突击队一同返回母星。曼达洛联军突破轨道封锁，深入被毁城市下方的帝国设施，并攻入§H吉迪恩总督§!秘密建立的克隆基地。基地在战斗中被彻底摧毁。\n\n最后的交锋中，吉迪恩以装甲手甲捏碎了§H暗剑§!。这个曾经决定曼达洛统治合法性的古老象征就此毁灭。\n\n这一次没有共和国军队替曼达洛决定未来。氏族在废墟之上重新宣告主权，§H曼达洛以独立国家的身份重生§!。"

 foc_mandalore_neutral_state:0 "曼达洛中立国"
 foc_mandalore_neutral_state_desc:0 "莎廷政府维持曼达洛的主权与中立，拒绝加入共和国和分离主义之间的战争。"
 foc_mandalore_shadow_collective_state:0 "影子集团统治"
 foc_mandalore_shadow_collective_state_desc:0 "摩尔通过死神卫与犯罪辛迪加控制曼达洛，暴力与恐惧取代了中立主义秩序。"
 foc_mandalore_clan_coalition:0 "曼达洛氏族联军"
 foc_mandalore_clan_coalition_desc:0 "博-卡坦重新团结拒绝外来统治的氏族。"
 foc_mandalore_332nd_deployment:0 "第332连部署"
 foc_mandalore_332nd_deployment_desc:0 "阿索卡·塔诺与雷克斯率领第332连投入曼达洛围攻战。"
 foc_mandalore_imperial_occupation:0 "帝国占领曼达洛"
 foc_mandalore_imperial_occupation_desc:0 "帝国驻军控制着曼达洛的城市、轨道设施与贝斯卡生产体系。"
 foc_mandalore_gideon_secret_clone_base:0 "吉迪恩秘密克隆基地"
 foc_mandalore_gideon_secret_clone_base_desc:0 "隐藏在曼达洛废墟深处的帝国实验设施正在秘密进行克隆与强化计划。"
 foc_mandalore_restored_sovereignty:0 "曼达洛主权光复"
 foc_mandalore_restored_sovereignty_desc:0 "氏族已经重返母星并恢复独立国家。暗剑已毁，新的曼达洛不再以它决定统治权。"
 FOC_DIN_DJARIN:0 "丁·贾林"
 leader_trait_foc_bo_katan_legendary:0 "传奇指挥官：博-卡坦"
 leader_trait_foc_bo_katan_legendary_desc:0 "曼达洛氏族政治与战争传统的代表人物。她善于在分裂的氏族之间建立共同目标，并能把少量精锐力量投入决定性的突破点。"
 leader_trait_foc_din_djarin_legendary:0 "传奇指挥官：丁·贾林"
 leader_trait_foc_din_djarin_legendary_desc:0 "久经赏金猎人生涯与曼达洛战争洗礼的战士。丁·贾林擅长小规模突击、追踪和从不利战局中保存核心力量。"
 foc_mandalore_new_republic_accession:0 "曼达洛加入新共和国"
 foc_mandalore_new_republic_accession_desc:0 "银河条约签署时，帝国叛军已经控制曼达洛星系。随着义军重组为新共和国，曼达洛星系正式纳入新共和国版图。博-卡坦·克里兹与丁·贾林进入新共和国指挥体系；当莱雅日后重新组织抵抗力量时，他们也将随剧情加入她的义军。"
