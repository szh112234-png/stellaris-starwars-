l_simp_chinese:
 NAME_FOC_REPUBLIC_ORIGIN_EXECUTOR_THREE:0 "惩罚者号"
 FOC_REPUBLIC_ORIGIN_EXECUTOR_ENDOR_GUARD_FLEET:0 "执行者号恩多守备舰队"
 FOC_REPUBLIC_ORIGIN_LUSANKYA_CORUSCANT_GUARD_FLEET:0 "卢桑基亚号科洛桑守备舰队"
 FOC_REPUBLIC_ORIGIN_PUNISHER_JAKKU_GUARD_FLEET:0 "惩罚者号贾库守备舰队"
 foc_republic_origin.30.a.tt:0 "§H你的国家就地改组为银河帝国§!并继承共和国疆域。完成死星二号或彻底击败帝国叛军后，执行者号、卢桑基亚号与惩罚者号三艘剧情旗舰服役，分别驻守恩多、科洛桑与贾库；每支编队为§H1艘执行者级＋30艘帝国 II 级§!。其余银河协议条件沿用原模组。"
 foc_republic_origin.30.b.tt:0 "§H你的国家就地改组为帝国叛军§!。此时不会获得拉杜斯号；银河协议后的第一秩序时代形成真正的§H义军/抵抗组织§!时，才会一次性获得满级方舟舰§H拉杜斯号§!。摧毁两座死星和§H执行者号、卢桑基亚号、惩罚者号§!三艘执行者级旗舰并控制§H科洛桑、贾库、夸特§!，或直接消灭帝国，即可成立新共和国。"
 foc_republic_origin.160.desc:0 "§H死星一号、死星二号、执行者号、卢桑基亚号与惩罚者号均已被摧毁，义军同时控制科洛桑、贾库与夸特恒星系。§!银河帝国被迫签署银河协议：\n\n- 义军同盟改组为以§H霍斯尼亚§!为首都的普通国家§H新共和国§!，并获得§H子爵级§!封装设计；\n- 帝国残部退往堡垒，成为普通国家§H帝国残余§!；\n- 两国均不会变成堕落帝国。\n\n若银河帝国已被直接消灭，同一协议也会立即生效。"
 foc_republic_origin.161.desc:0 "§H两座死星和执行者号、卢桑基亚号、惩罚者号三艘执行者级旗舰均已被摧毁，义军已经控制科洛桑、贾库与夸特恒星系。§!银河帝国已无力继续战争，只能接受银河协议：\n\n- 义军建立普通国家§H新共和国§!并获得§H子爵级§!封装设计；\n- 我方退守堡垒，改组为普通国家§H帝国残余§!；\n- 两国均不会变成堕落帝国。"
 foc_republic_origin.171.desc:0 "§H死星一号已经被摧毁。§!银河看见了帝国最可怕的武器也会爆炸。义军获得原有的一次性胜利奖励，对死星的旧攻击增伤立即失效。\n\n玩家帝国立即获得§H死星二号建造计划§!，完成工程时触发博桑情报事件，二号在恩多出现。AI帝国则在一号毁灭§H4年后§!暴露并部署未完工二号。\n\n原有帝国支援舰队规则保持：立即获得一支支援舰队，此后每360天再获得一支，直到死星二号被摧毁。"
 foc_republic_origin.176.desc:0 "死星一号与死星二号均已被摧毁，义军获得大幅永久强化。帝国疆域不会自动转交：若要迫使帝国签署§H银河协议§!，义军还必须摧毁§H执行者号、卢桑基亚号与惩罚者号§!，并实际控制§H科洛桑、贾库、夸特§!三个恒星系。\n\n直接消灭银河帝国也会立即触发协议。"
 foc_republic_origin.180.name:0 "三艘执行者级正式服役"
 foc_republic_origin.180.desc:0 "三座军港收到了启航命令。\n\n§H执行者号§!率30艘帝国 II 级驻守恩多，§H卢桑基亚号§!率30艘帝国 II 级驻守科洛桑，§H惩罚者号§!率30艘帝国 II 级驻守贾库。\n\n三支编队各为§H1艘执行者级＋30艘帝国 II 级§!。三艘剧情旗舰各自只服役一次，被摧毁后不会重建。"
 foc_republic_origin_scarif_intelligence_desc:0 "莱雅获救并带回完整图纸后，义军才完成死星结构与帝国偏导护盾频率分析。武器对护盾伤害+50%；死星一号特攻另受存活、同星系等条件限制。"
 foc_republic_origin.165.desc:0 "未知星域的航路终于绘制完成。\n\n§H伊冷§!是一颗被冰封的星球，地壳下埋着整个银河最纯净的凯伯水晶矿脉。伊冷与贾库之间的专用航道已经打通，§H弑星者基地、至尊号与复兴级§!科技正式开放。\n\n§Y若当前政权是银河协议后的帝国残余，它会在项目完成的这一刻正式采用§H第一秩序§!之名，并由§H最高领袖斯诺克§!接掌；但真正的第一秩序危机、舰船文化转换与银河战争仍要等弑星者基地建成后才启动。§!"
 origin_foc_republic_unification_effects:0 "§Y主要剧情（当前版本）：§!\n- 剧情时间轴默认§H2200年§!开始，也可选择2250/2300/2400；共和国起源从纳布危机开始，后续节点按既有间隔顺延\n- §H克隆人计划完成后§!才会提出夸特扩建；特殊项目需要§H3200工程学§!，按早期科研水平约§H8年§!完成并解锁猎兵级\n- 分离主义战争结束并完成帕尔帕廷阴谋后才会诞生银河帝国；§H所有帝国时期战役事件都要求帝国已经正式建立§!\n- 帝国内战时帝国叛军以§H雅雯与霍斯§!为早期基地；§H迪卡不会在帝国时代提前出现§!，它留到新共和国/第一秩序时代\n- 帝国路线拥有两阶段死星工程；执行者号、卢桑基亚号、惩罚者号在§H死星二号完成或帝国叛军被彻底击败§!后投入服役\n- 银河条约军事路线要求摧毁两座死星与三艘执行者级剧情旗舰，并使银河帝国§H失去科洛桑、夸特与贾库§!；三处不必由义军亲自占领，直接消灭帝国同样立即触发条约\n- 第一秩序正式降临时会§H强制建立迪卡抵抗组织§!；霍斯尼亚被弑星者摧毁后，AI新共和国必定覆灭，玩家新共和国则由抵抗组织继承，避免直接失败\n- 第一秩序起源建成弑星者基地后的原有后续剧情保持不变，不再受剧情起始年份继续延迟\n\n§Y分离主义投降：两条路线，满足任意一条§!\n§H剧情路线§!：科洛桑战役事件完成＋乌塔堡（乌塔帕）战役事件完成＋帕尔帕廷的阴谋达到140点。\n§H军事路线§!：由游戏实际判定共和国在对邦联的全面战争中获胜，或确认共和国在该战争中彻底消灭邦联，才进入投降收尾。殖民地数量、暂时的控制权或找不到邦联均不单独判胜；维持现状、共和国战败及第三方消灭邦联不算共和国胜利。本路线不要求阴谋140点或两场战役事件。\n全选不利或混合选择导致阴谋不足140点时，必须通过军事路线结束战争，不能靠等待补分。两条路线均接入分日投降结算；杜库与格里弗斯死亡不单独判为胜利。"
 foc_republic_origin.177.desc:0 "斯卡里夫行动取得了死星档案，然而完整图纸还没有安全送达义军指挥部。\n\n§Y本事件只记录图纸被夺取，不立即发放死星特攻或护盾伤害加成。§!斯卡里夫战役后等待30天，奥德朗与莱雅救援事件才会进入后续剧情；莱雅获救后，义军方能完成弱点分析。"