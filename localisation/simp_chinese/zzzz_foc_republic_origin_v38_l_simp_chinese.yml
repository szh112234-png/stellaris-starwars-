 foc_rebel_home_arkship_tier_3_level_tooltip:0 "§H满级义军移动家园§!\n拉杜斯号携带一座方舟殖民地，并装有固定轴基模块。它可以在战斗或恒星系毁灭中被彻底摧毁，损失后不会重新生成。"
