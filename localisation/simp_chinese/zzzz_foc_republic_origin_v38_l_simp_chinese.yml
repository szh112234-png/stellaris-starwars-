 foc_republic_origin.30.a.tt:0 "§H你的国家就地改组为银河帝国§!并继承共和国疆域。完成死星二号或彻底击败帝国叛军后，执行者号、卢桑基亚号与惩罚者号三艘剧情旗舰服役，分别驻守恩多、科洛桑与贾库；每支编队为§H1艘执行者级＋30艘帝国 II 级§!。其余银河协议条件沿用原模组。"
 foc_republic_origin.30.b.tt:0 "§H你的国家就地改组为帝国义军§!。此时不会获得拉杜斯号；银河协议后的第一秩序时代形成真正的§H义军/抵抗组织§!时，才会一次性获得满级方舟舰§H拉杜斯号§!。摧毁两座死星和两艘执行者级旗舰并控制§H科洛桑、贾库、夸特§!，或直接消灭帝国，即可成立新共和国。"
 foc_republic_origin.160.name:0 "银河协议：新共和国"
 foc_republic_origin.160.desc:0 "§H死星一号、死星二号、执行者号与卢桑基亚号均已被摧毁，义军同时控制科洛桑、贾库与夸特恒星系。§!银河帝国被迫签署银河协议：\n\n- 义军同盟改组为以§H霍斯尼亚§!为首都的普通国家§H新共和国§!，并获得§H子爵级§!封装设计；\n- 帝国残部退往堡垒，成为普通国家§H帝国残余§!；\n- 帝国残余接受§H解除武装条款§!，现有舰队可以保留，但不得再建造新的军用舰船；\n- 两国均不会变成堕落帝国。\n\n若银河帝国已被直接消灭，同一协议也会立即生效。"
 foc_republic_origin.161.name:0 "银河协议：帝国残余"
 foc_republic_origin.161.desc:0 "§H两座死星和两艘执行者级旗舰均已被摧毁，义军已经控制科洛桑、贾库与夸特恒星系。§!银河帝国已无力继续战争，只能接受银河协议：\n\n- 义军建立普通国家§H新共和国§!并获得§H子爵级§!封装设计；\n- 我方退守堡垒，改组为普通国家§H帝国残余§!；\n- 我方被迫接受§H解除武装条款§!：现有舰队可以保留，但公开船坞不得再建造新的军用舰船；\n- 玩家可通过完成§H第一秩序计划§!把军工体系转移到未知星域，以秘密方式恢复舰队建设；\n- 两国均不会变成堕落帝国。"
 foc_republic_origin.171.desc:0 "§H死星一号已经被摧毁。§!银河看见了帝国最可怕的武器也会爆炸。义军获得原有的一次性胜利奖励，对死星的旧攻击增伤立即失效。\n\n玩家帝国立即获得§H死星二号建造计划§!，完成工程时触发博桑情报事件，二号在恩多出现。AI帝国则在一号毁灭§H4年后§!暴露并部署未完工二号。\n\n原有帝国支援舰队规则保持：立即获得一支支援舰队，此后每360天再获得一支，直到死星二号被摧毁。"
 foc_republic_origin.176.name:0 "双死星覆灭：全面反攻"
 foc_republic_origin.176.desc:0 "死星一号与死星二号均已被摧毁，义军获得大幅永久强化。帝国疆域不会自动转交：若要迫使帝国签署§H银河协议§!，义军还必须摧毁§H执行者号与卢桑基亚号§!，并实际控制§H科洛桑、贾库与夸特§!三个恒星系。\n\n直接消灭银河帝国也会立即触发协议。"
 foc_republic_origin.176.a:0 "消灭帝国最后的战略支柱。"
 foc_republic_origin.180.name:0 "两艘执行者级正式服役"
 foc_republic_origin.180.desc:0 "三座军港收到了启航命令。\n\n§H执行者号§!率30艘帝国 II 级驻守恩多，§H卢桑基亚号§!率30艘帝国 II 级驻守科洛桑，§H惩罚者号§!率30艘帝国 II 级驻守贾库。\n\n三支编队各为§H1艘执行者级＋30艘帝国 II 级§!。三艘剧情旗舰各自只服役一次，被摧毁后不会重建。"