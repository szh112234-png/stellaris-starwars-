 foc_kyber_source_tier_3:0 "三级凯伯水晶矿脉"
 foc_kyber_source_tier_3_desc:0 "稳定但规模较小的凯伯水晶产地。控制该行星所在星系后，每月获得 §Y5§! £sr_kyber_swgs£ 凯伯水晶。"
