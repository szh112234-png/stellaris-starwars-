l_simp_chinese:
 foc_sw_clone_legion:0 "共和国克隆人军团"
 foc_sw_clone_legion_desc:0 "来自卡米诺的克隆人士兵以高度统一的训练、纪律和战术网络组成共和国大军的骨干。"
 foc_sw_clone_arc_troopers:0 "ARC精锐突击队"
 foc_sw_clone_arc_troopers_desc:0 "高级侦察突击兵被赋予更大的战场自主权，专门执行突破、斩首与纵深渗透任务。"
 foc_sw_clone_commandos:0 "共和国克隆突击队"
 foc_sw_clone_commandos_desc:0 "四人小组接受独立作战训练，能在主力军团抵达前破坏敌方指挥、护盾与后勤体系。"
 foc_sw_cis_b1_droids:0 "B1战斗机器人军团"
 foc_sw_cis_b1_droids_desc:0 "单体性能并不出众，但廉价、服从且可以成千上万地投入战场。"
 foc_sw_cis_b2_droids:0 "B2超级战斗机器人"
 foc_sw_cis_b2_droids_desc:0 "更厚重的装甲与内置火力让B2成为分离主义正面推进的重装步兵。"
 foc_sw_cis_droidekas:0 "毁灭者机器人部队"
 foc_sw_cis_droidekas_desc:0 "高速滚行、双联爆能炮与个人偏导护盾让毁灭者机器人能够撕开步兵防线。"
 foc_sw_cis_commando_droids:0 "BX突击机器人"
 foc_sw_cis_commando_droids_desc:0 "为潜入与猎杀而制造的精锐机器人，速度、反应和战术能力远胜普通B1。"
 foc_sw_imperial_stormtroopers:0 "帝国冲锋队"
 foc_sw_imperial_stormtroopers_desc:0 "白色装甲下是银河帝国最常见的武力象征，从核心世界到外环都能看到他们的驻军。"
 foc_sw_imperial_storm_commandos:0 "帝国风暴突击队"
 foc_sw_imperial_storm_commandos_desc:0 "接受侦察、破坏与反叛乱训练的帝国精锐，专门追猎那些拒绝服从皇帝意志的人。"
 foc_sw_imperial_dark_troopers:0 "黑暗士兵"
 foc_sw_imperial_dark_troopers_desc:0 "以重型装甲和自动化作战系统打造的机械化精锐，是帝国工厂能够制造出的最可怕地面兵器之一。"
 foc_sw_rebel_infantry:0 "义军步兵"
 foc_sw_rebel_infantry_desc:0 "来自无数世界的志愿者、逃亡者与前帝国军人共同组成了这支装备混杂却意志坚定的军队。"
 foc_sw_rebel_pathfinders:0 "义军探路者"
 foc_sw_rebel_pathfinders_desc:0 "他们往往是第一批登陆敌占世界的人，在主力到来之前侦察、渗透并夺取关键设施。"
 foc_sw_new_republic_marines:0 "新共和国陆战队"
 foc_sw_new_republic_marines_desc:0 "银河内战的老兵与新共和国正规军共同构成的快速反应部队，承担舰队登陆和要地防卫任务。"
 foc_sw_first_order_stormtroopers:0 "第一秩序冲锋队"
 foc_sw_first_order_stormtroopers_desc:0 "从幼年开始接受军事化塑造的士兵，他们被训练去服从、前进，并将旧帝国未完成的战争继续下去。"
 foc_sw_first_order_heavy_troopers:0 "第一秩序重装冲锋队"
 foc_sw_first_order_heavy_troopers_desc:0 "携带重型爆能武器和强化护甲的火力核心，负责压制坚固阵地与装甲目标。"
 foc_sw_first_order_elite_troopers:0 "第一秩序精锐军团"
 foc_sw_first_order_elite_troopers_desc:0 "从最优秀的冲锋队员中筛选出的突击力量，纪律、火力与战场协同都达到第一秩序的最高标准。"
 foc_sw_first_order_at_m6:0 "AT-M6攻城步行机群"
 foc_sw_first_order_at_m6_desc:0 "巨大的前部火炮和重装甲使这种步行机成为摧毁行星堡垒与固定防线的移动攻城平台。"
 foc_sw_sith_eternal_troopers:0 "西斯永恒军团"
 foc_sw_sith_eternal_troopers_desc:0 "隐藏在埃克西戈黑暗中的赤红军团，只向最终秩序和西斯的归来效忠。"
 foc_sw_mandalorian_warriors:0 "曼达洛战士"
 foc_sw_mandalorian_warriors_desc:0 "氏族传统、贝斯卡装甲与世代相传的战斗技艺，使曼达洛人即使人数不多也足以改变一场地面战争。"
 foc_sw_mandalorian_elite:0 "曼达洛精锐突击队"
 foc_sw_mandalorian_elite_desc:0 "配备更完整贝斯卡护甲、喷射背包和重型武器的氏族精锐。只有控制曼达洛的人才能征召他们。"

 building_foc_sw_republic_barracks:0 "共和国军营"
 building_foc_sw_republic_barracks_desc:0 "共和国大军的兵员、装备和基层军官在这里完成整编，再被送往不断扩大的克隆人战争前线。"
 building_foc_sw_republic_factory:0 "共和国军工厂"
 building_foc_sw_republic_factory_desc:0 "从装甲车辆到舰用零件，大规模战争迫使共和国把原本分散的工业体系转入全面军需生产。"
 building_foc_sw_separatist_parliament:0 "分离主义议会"
 building_foc_sw_separatist_parliament_desc:0 "企业利益、外环怨恨与杜库伯爵的政治承诺在这里汇聚成一个与科洛桑公开决裂的新政权。"
 building_foc_sw_geonosian_arena:0 "吉奥诺西斯竞技场"
 building_foc_sw_geonosian_arena_desc:0 "巨大的石质竞技场既是吉奥诺西斯文化的象征，也曾见证共和国与分离主义战争真正开始的那一刻。"
 building_foc_sw_imperial_barracks:0 "帝国兵营"
 building_foc_sw_imperial_barracks_desc:0 "冲锋队、驻防军和帝国军官从这里被派往整个银河，把皇帝的秩序带到每一颗拒绝服从的星球。"
 building_foc_sw_imperial_factory:0 "帝国军工复合体"
 building_foc_sw_imperial_factory_desc:0 "帝国把征服转化成工业产能，庞大的工厂昼夜不停地为舰队和地面军团生产武器。"
 building_foc_sw_imperial_palace:0 "帝国皇宫"
 building_foc_sw_imperial_palace_desc:0 "昔日共和国权力中心被重新塑造成皇帝统治银河的象征。科洛桑仍是银河之心，只是这里再也没有共和国了。"
 building_foc_sw_fortress_vader:0 "维达堡垒"
 building_foc_sw_fortress_vader_desc:0 "黑色尖塔从穆斯塔法的熔岩海上升起。这里既是达斯·维达的私人堡垒，也是帝国最令人不安的权力象征之一。"
 building_foc_sw_rebel_command_center:0 "义军指挥中心"
 building_foc_sw_rebel_command_center_desc:0 "隐藏机库、临时作战室和加密通信站共同构成了反抗帝国的神经中枢。"
 building_foc_sw_hoth_ion_cannon:0 "霍斯重型离子炮"
 building_foc_sw_hoth_ion_cannon_desc:0 "巨型离子炮能够在帝国封锁舰队上短暂撕开缺口，为撤离舰船争取珍贵的跃迁窗口。"
 building_foc_sw_new_republic_senate:0 "新共和国议会"
 building_foc_sw_new_republic_senate_desc:0 "银河内战结束后，各成员世界再次派出代表决定共和国的方向。霍斯尼亚成为了这个新政治时代的中心。"
 building_foc_sw_first_order_training_center:0 "第一秩序训练中心"
 building_foc_sw_first_order_training_center_desc:0 "这里没有共和国式的公民军传统。士兵从进入体系的第一天起就被塑造成第一秩序战争机器的一部分。"

 tech_foc_sw_star_forge:0 "星际锻炉遗产"
 tech_foc_sw_star_forge_desc:0 "马拉科遗迹中的古老记录指向一种比现代巨型船坞更可怕的工业理念：直接从恒星汲取能量与物质，把战争机器像流水一样铸造出来。"
 foc_sw_star_forge_site:0 "星际锻炉"
 foc_sw_star_forge_site_DESC:0 "围绕恒星建立的第一阶段锻造核心。"
 foc_sw_star_forge_2:0 "星际锻炉：工业核心"
 foc_sw_star_forge_2_DESC:0 "不断扩张的铸造阵列开始把恒星能量转化为舰队所需的合金与工业产能。"
 foc_sw_star_forge_3:0 "星际锻炉：完全体"
 foc_sw_star_forge_3_DESC:0 "一座能够持续吞噬恒星能量、生产战争物资并支撑庞大舰队的古代超级工业设施。"
 foc_sw_star_forge_one_only:0 "一个国家只能维持一座星际锻炉。"

 foc_lore_alderaan_jewel_of_the_core:0 "核心世界的明珠"
 foc_lore_alderaan_jewel_of_the_core_desc:0 "奥德朗以古老城市、自然景观和政治传统闻名，是共和国理想主义最鲜明的象征之一。"
 foc_lore_bracca_shipbreaking_yards:0 "布拉卡拆船场"
 foc_lore_bracca_shipbreaking_yards_desc:0 "战争遗留下来的舰船在这里被切割、分类并重新送回工业体系。"
 foc_lore_tanalorr_hidden_refuge:0 "塔纳洛尔隐秘避难所"
 foc_lore_tanalorr_hidden_refuge_desc:0 "被危险航路包围的世外之地，长期与银河主要战争隔绝。"
 foc_lore_ossus_jedi_ruins:0 "奥苏斯绝地遗迹"
 foc_lore_ossus_jedi_ruins_desc:0 "古老的绝地知识曾在这里保存，即使废墟也仍吸引着研究原力历史的人。"
 foc_lore_ahchto_first_temple:0 "第一座绝地神殿"
 foc_lore_ahchto_first_temple_desc:0 "遥远海岛上的石质遗迹记录着绝地武士团最早期的传统。"
 foc_lore_aldhani_highlands:0 "阿尔达尼高地"
 foc_lore_aldhani_highlands_desc:0 "辽阔高地和恶劣气候使这里人口稀少，也让隐藏基地和秘密行动更难被发现。"
 foc_lore_utapau_sinkhole_cities:0 "乌塔堡天坑城市"
 foc_lore_utapau_sinkhole_cities_desc:0 "文明沿巨型天坑峭壁向地下延伸，自然地形本身就是城市最坚固的防线。"
 foc_lore_christophsis_crystal_world:0 "克里斯托弗西斯晶体矿脉"
 foc_lore_christophsis_crystal_world_desc:0 "巨型晶体结构遍布地表，使这里同时拥有独特的工业价值与战略价值。"
 foc_lore_jedha_holy_city:0 "杰达圣城"
 foc_lore_jedha_holy_city_desc:0 "朝圣者、原力信仰和凯伯晶体贸易让杰达在银河宗教史中拥有不可替代的位置。"
 foc_lore_malachor_sith_battlefield:0 "马拉科古战场"
 foc_lore_malachor_sith_battlefield_desc:0 "被大规模战争和黑暗原力撕裂的世界仍保存着危险的遗迹，以及不该被重新唤醒的知识。"
 foc_lore_aldoleem_industrial_mines:0 "阿尔多利姆工业矿区"
 foc_lore_aldoleem_industrial_mines_desc:0 "偏远矿区依靠重型机械和严密安保维持生产，是帝国工业网络中不起眼却重要的一环。"
 foc_sw_resistance_fighters:0 "抵抗组织战士"
 foc_sw_resistance_fighters_desc:0 "当新共和国仍在争论威胁是否真实存在时，这些志愿者已经追随莱娅来到迪卡。他们人数不多，却清楚自己正在面对什么。"
 foc_sw_resistance_commandos:0 "抵抗组织突击队"
 foc_sw_resistance_commandos_desc:0 "由老义军、共和国军人和边境志愿者组成的小型精锐队伍，擅长渗透、破坏与在敌后制造混乱。"
 building_foc_sw_resistance_command_post:0 "抵抗组织秘密指挥站"
 building_foc_sw_resistance_command_post_desc:0 "隐藏在偏远世界上的通讯阵列、机库和简陋作战室。这里没有共和国舰队的排场，只有一群拒绝等待灾难降临的人。"

