l_simp_chinese:
 FOC_KHAN_RESISTANCE:0 "抵抗组织"
 foc_v185_flow.2.name:0 "弑星者基地竣工"
 foc_v185_flow.2.desc:0 "§L伊冷深处最后一组聚能阵列已经锁定。没有庆典，只有舰队频道上不断增加的效忠讯号。§!\n\n§H弑星者基地§!正式投入战备。随着这件武器完成，仍然独立存在的§H帝国残余§!舰队、星域与军工体系立即被第一秩序接收。\n\n但银河全面战争尚未开始。第一秩序仍可以把自己的真正实力隐藏在未知星域。§Y第一次弑星者实战开火时，秘密阶段将立即结束：我国将化身天灾，并与全银河进入总力战争。§!"
 foc_v185_flow.2.a:0 "让他们继续以为和平仍然存在。"

 fop_origin.20.name:0 "第一炮：银河新秩序"
 fop_origin.20.desc:0 "§L一道跨越星海的光束已经完成了它的第一次实战射击。到这一刻，隐瞒已经没有意义。§!\n\n弑星者的真实能力被整个银河确认。第一秩序结束秘密扩军阶段，正式以§H银河新秩序§!的名义公开战争目标。§Y我国立即进入玩家天灾路线；所有独立银河强权、失落帝国与觉醒帝国将被纳入针对第一秩序的总力战争。§!\n\n这一规则与目标无关——只要完成一次真实开火，战争就会开始。若被摧毁的目标是§H霍斯尼亚星系§!，则会额外触发新共和国中央政府崩溃与领土清算。"
 fop_origin.20.a:0 "向整个银河宣战。"


 foc_khan_rebel.3.name:0 "迪卡：抵抗组织正式成立"
 foc_khan_rebel.3.desc:0 "§L迪卡密林中的跑道逐一亮起引导灯。这里没有共和国舰队的阅兵，也没有议会授权书。§!\n\n莱雅·奥加纳已经把分散的旧义军老兵、新共和国军官、地方防卫队、情报人员和年轻飞行员重新编成一支独立力量。§H迪卡殖民地与当地恒星基地现已正式归属抵抗组织。§!\n\n这不是新共和国的第二支正规舰队，而是一支专门为第一秩序威胁而存在的政治与军事组织。它会沿着迪卡—克雷特—阿简·克洛斯的剧情链继续生存和转移。"
 foc_khan_rebel.3.a:0 "战争还没有结束。"

 foc_republic_origin.165.desc:0 "§L未知星域的航路已经完成，隐藏多年的计划第一次具备了现实形态。§!\n\n§H伊冷§!与贾库之间的专用通道已经建立，§H弑星者基地、至尊号与复兴级§!相关技术正式开放。若当前政权是银河条约后的帝国残余，它将在这一阶段采用第一秩序的政治身份并恢复秘密军备建设。\n\n与此同时，莱雅·奥加纳不会再等待第一秩序公开入侵：§H若抵抗组织尚未成立，完成第一秩序计划会立即触发莱雅前往迪卡的事件。§!原有银河条约后时间触发仍然保留，作为没有走本计划路线时的历史兜底。\n\n§Y弑星者基地建成并不直接开启银河总力战；第一次真实开火时，玩家第一秩序才会化身天灾并与全银河开战。§!"
 foc_republic_origin.165.a:0 "计划已经无法逆转。"


 foc_luke.21.desc:0 "银河条约签订§H23年§!后，长期笼罩在§H本·索罗§!周围的黑暗终于爆发。烈火吞没§H奥苏斯§!的新绝地圣殿，卢克重建的绝地武士团几乎在一夜之间毁灭。本·索罗消失在斯诺克的阴影中，并将在第一秩序公开战争时彻底成为凯洛·伦。\n\n同一年，针对莱雅·奥加纳的政治攻击达到顶点。若§H迪卡抵抗网络§!尚未准备完成，这一历史节点会触发莱雅离开新共和国政治核心并在迪卡建立秘密抵抗网络；§Y不会因此创建第二个国家§!。新共和国仍由玩家控制，直到霍斯尼亚毁灭或共和国真正败亡后由同一国家本体改组为抵抗组织。"
 foc_luke.21.a:0 "绝地遭受了毁灭性的打击。"
