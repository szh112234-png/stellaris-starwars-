l_simp_chinese:
 foc_balance.10.desc:0 "内政部送来的报告越来越厚。外环的运输队失踪，工厂在夜里停摆，帝国徽记被人从行政大楼上拆下来。地方总督都在说同一件事：那些看得见歼星舰的世界最安静。\n\n舰队一旦离开，谣言、罢工与破坏行动就会重新出现；而当某颗星球公开倒向反抗军时，旧有的恐惧也随帝国旗帜一起消失。\n\n新秩序发现，统治银河不仅需要命令，还需要让人每天抬头都能看见执行命令的舰船。"
 foc_canon.40.desc:0 "§H克里斯托夫西斯§!已经完全脱离邦联控制。年轻的阿索卡·塔诺在这场战役中被正式分配给阿纳金·天行者作为学徒。"
 foc_cis.11.desc:0 "邦联换了最高统帅。\n\n新上任的这一位不是政客，也不是财团代表，而是一台被改造过的战争机器：有机部件只剩下极少一部分，其余全是合金骨架与伺服机构。他咳嗽，因为那对肺是从原来的身体里保留下来的；他收藏光剑，因为那些光剑的原主人都是被他亲手杀掉的绝地。\n\n他上任之后，邦联的舰队第一次表现出真正的战术指挥：突击群开始有配合，主力舰队开始预判共和国的机动，而不是被动等待。"
 foc_cis.12.desc:0 "贸易联盟、银行业协会、技术联合会与采矿业公会在阿基瓦签署了联合声明：所有成员企业的“护航部队”即日起全部并入邦联舰队序列。\n\n这批船本来是用来护送货物、威慑地方政府、必要时封锁一两条航道的。它们数量惊人，因为过去二十年里议会一次也没有真正清点过。\n\n共和国当年在议会大厅里拒绝过一份提案，要求承认这些“护航部队”的合法地位。现在它们不再需要议会承认了。"
 foc_cw.1.desc:0 "吉奥诺西斯危机迫使共和国启用克隆人大军。关闭本事件后，独立星系邦联正式建立，克隆人战争爆发。"
 foc_cw.2.desc:0 "§L军团频道里只剩简短的坐标、伤亡数字和命令，真正的代价要等战斗结束后才看得见。§!\n\n战线拉到了外环，而外环没有战线可言——只有一串互不相连的星系，每一个都要单独打。\n\n邦联把工厂修在地下，把舰队藏在小行星带里，把守军换成不需要补给的机器人。共和国这边则把绝地一个个派出去当将军：一个人带一个军团，一次派往一颗星球，从此音讯全无地打上几个月。\n\n参谋部现在必须选一种打法。"
 foc_cw.4.desc:0 "§L绝地曾经调停战争，如今他们站在战舰舰桥上，亲自命令军团投入战争。§!\n\n邦联已经完全失去§H乌塔帕§!星系控制权。最高统帅部的位置最终被锁定在这颗一颗满是竖井的干旱星球，机器人军团就藏在井壁的城市里。\n\n共和国单派了一名绝地先行侦察。他骑着一头本地驮兽从竖井边缘一路冲下去，在停机坪上截住了正要登舰逃跑的§H格里弗斯将军§!。\n\n四把光剑对一把。最后结束这件事的不是光剑，是一把从死掉的卫兵身上捡来的爆能枪，两枪打进那对有机肺叶。\n\n将军倒下的时候，全银河的战斗机器人还在正常运转。但发出命令的那颗脑袋没有了。\n\n§Y乌塔堡战役已完成，格里弗斯死亡。本战役不额外增加阴谋分数。§!"
 foc_cw.6.desc:0 "邦联的一支§H25艘卢克里胡克级战列舰§!突袭舰队已抵达科洛桑，最高议长遭到劫持。"
 foc_ethics.2.desc:0 "帝国的政体、国策和旗帜都换过了，但有一样东西一直没有跟上：这个国家在纸面上仍然按共和国的价值观运转。\n\n议会时代的对外开放条款、非军事化承诺、种族平等法案，全部还挂在法典里，只是没有人再执行。总督们照着旧条文办事，军方照着新命令办事，两边每天都在打架。\n\n最高议长办公室今天一次性废除了它们。\n\n§H新秩序的三条支柱正式写进宪章：人类至上、军事优先、绝对权威。§!"
 foc_fallen_war.22.desc:0 "新共和国最后一处仍能升起旗帜的殖民地也沉默了。边境哨站在等待命令，帝国残余则把越来越多的舰队调往未知区域的航线。\n\n没有人知道黑暗里究竟在集结什么，只知道那些失踪多年的帝国军用频段重新开始交换加密信号。银河没有因为一个政权的消失而得到和平，反而像是替某个更危险的继承者腾出了位置。"
 foc_khan.46.desc:0 "伊冷外侧的超空间连续闪烁了数小时。新造的歼星舰从未知区域一批批抵达，舰体上还带着船坞的焊接痕迹。\n\n最高统帅部没有举行阅舰式。新舰队完成编组后立即收到航路和目标，随后散入银河。第一秩序正在把隐藏多年的工业储备一点点变成前线兵力。"
 foc_khan.5.desc:0 "未知区域沉寂多年的航路同时亮起。第一批复兴级歼星舰穿过贾库之外的黑暗，随后是更多舰队，以及一艘宽得像移动城市的旗舰。旧帝国的徽记被重新锻造成更冷、更锋利的形状。\n\n他们自称§H第一秩序§!。对他们而言，银河条约只是一场叛乱者强加给帝国的停战，而现在，停战结束了。\n\n新共和国议会仍在争论该把这支军队称作边境危机还是全面战争。莱娅·奥加纳已经不再等待答案。"
 foc_khan.81.desc:0 "埃克西戈地下最后一座船台熄灭了施工灯。长矛级舰队已经塞满行星上空的阴影，更多舰体已没有必要继续开工。\n\n西斯永恒把剩余资源转向补给、武器与人员。造舰阶段结束了；接下来要做的，只是把这些舰船送向银河。"
 foc_khan_rebel.10.desc:0 "一段经过多次中继的加密讯号穿过第一秩序的封锁线，最终抵达我们的通讯阵列。发信地点被故意抹去，只留下一个签名：莱娅·奥加纳。\n\n她没有要求我们宣誓效忠某个政府。她只问了一件事——当第一秩序命令我们向自己的邻居开火时，我们是否愿意说不。\n\n迪卡还有位置，也还有一场尚未打完的战争。"
 foc_khan_rebel.3.a:0 "战争还没有结束。"
 foc_khan_rebel.3.desc:0 "迪卡的密林把机库、跑道和通讯阵列全部藏在树冠之下。第一批飞行员降落时没有仪仗，也没有共和国舰队护航；他们只带着旧战争留下的徽章和一份不再等待议会批准的决心。\n\n来自新共和国、旧义军、地方防卫队和情报网络的人在这里重新编成一支军队。指挥室墙上挂起了一枚熟悉的星鸟徽记。\n\n§H抵抗组织成立了。§!"
 foc_khan_rebel.3.name:0 "义军诞生：抵抗组织成立"
 foc_luke.15.desc:0 "死星二号在恩多上空解体了，而帝国真正失去的不是那座战斗空间站。\n\n皇帝把天行者带上了王座厅，本意是让那个年轻人在父亲和自己之间选一个，然后杀掉另一个。计划的每一步都按预想推进——直到天行者赢下决斗、扔掉光剑，说自己是绝地。\n\n皇帝随即动用原力闪电。而站在旁边一动不动看了很久的那个人，最后抱起自己的主人，把他扔进了反应炉井。\n\n§H达斯·维达已经阵亡。§!舰队指挥序列里那个所有人都害怕的名字消失了，帝国失去了他带来的一切。"
 foc_luke.17.desc:0 "死星二号的王座厅在解体前几分钟发生过一件事，帝国的官方通报里一个字也没提。\n\n§H帕尔帕廷死了。§!把他从御座边抱起来、扔进反应炉井的，是他自己二十三年来最信任的那个人。\n\n没有遗体，没有遗嘱，也没有继承人——他从来没有安排过继承人，因为他压根不打算死。整个新秩序的合法性都系在一个人身上，而那个人现在连一具尸首都没留下。\n\n科洛桑的军部在十二小时内成立了§H帝国摄政§!，对外宣称皇帝仍在处理事务。没有人相信这句话，包括发布它的人。\n\n从今天起，帝国由一个没有名字的军人政府维持——各战区的总督和元帅正在互相试探，看谁先动手。"
 foc_nr_fix.2.desc:0 "银河条约生效之后，蒙卡拉的水下船坞终于重新点火。\n\n战争年代那批临时改装的巡洋舰不会再造了。取而代之的是两份一直压在图纸柜最底层的设计：中型主力舰§H星云级§!，以及那艘从来没有人真正批准过预算的§H子爵级§!——十七公里长，蒙卡拉马利人为它准备了整整一代人的时间。\n\n和平才刚开始，新共和国却已经在为下一次可能到来的战争设计舰队。"
 foc_raddus.2.desc:0 "旗舰的检修报告送上来时，值班军官以为是记录出错了。\n\n§H拉杜斯号§!的三处专属舱段——工程舱、停泊舱、以及贯穿舰体的轴向打击指挥模块——在编制表上全部显示为空。船体完好，反应炉正常，机库里一百二十架战机也都在位，但那三样让它不只是一艘大船的东西，不知道从哪一天起就不在了。\n\n追查下去，原因很荒唐：那些舱段的授权名录里写的是「义军同盟」。而我们在银河条约之后已经不叫这个名字了。舰还是那艘舰，人还是那批人，只是登记簿上的抬头换了，于是系统判定这些舱段不属于我们。\n\n名录已经改过来了，舱段正在重新接入。"
 foc_reb.1.desc:0 "罗萨的工厂停工了。帝国广播仍在重复宵禁令，但街道上的扩音器已经被当地人拆下，行政建筑上的帝国徽记一块接一块落地。\n\n在轨道上，驻防部队第一次发现补给航道被本地飞行员切断。地面反抗细胞同时打开隐藏多年的通讯频道，向义军发送同一句短讯：§H罗萨已经起义。§!\n\n这不再是一场地下行动。一颗星球正在公开选择自己的旗帜。"
 foc_reb.3.desc:0 "§H蒙卡拉马利§!的船坞在水下，从太空看不见。帝国占领这颗星球之后一直想把它们征用，但蒙卡拉人给出的产能报表年年不达标——他们把最好的工人和最好的图纸都藏了起来。\n\n现在他们决定不装了。\n\n随同加入的还有一批设计图。那不是巡洋舰改装方案，是完整的主力舰设计：中型的§H星云级§!，以及一份从来没有人批准过预算的十七公里长的东西——§H子爵级§!。\n\n蒙卡拉人说，他们为这一天准备了整整一代人。"
 foc_reb.4.desc:0 "曼达洛的统治权不靠选举，也不完全靠血统。它靠一把剑——§H暗黑剑§!，一千年前由第一位曼达洛绝地锻造的黑色光剑。谁在决斗中赢下它，谁就有资格号令各氏族。\n\n帝国扶植的傀儡总督手里现在拿着那把剑，而他不是靠决斗拿到的。\n\n各氏族分成了两半。一半要打回去，一半要先看看谁给的价码高。\n\n我们的态度会决定这颗星球倒向哪边。"
 foc_reb.5.desc:0 "在此之前，反抗帝国的从来不是一个组织，而是几十个互不认识、互相提防的小团体：罗萨的工人、杰达的游击队、蒙卡拉的船厂、曼达洛的氏族，还有议会里那些没有被抓走的人。\n\n他们在科雷利亚坐到了同一张桌子前。争论持续了整整一夜，天亮时，所有代表终于在同一份文件上签下名字。\n\n§H义军同盟§!正式成立。科雷利亚也在这一天公开撕下帝国旗帜，把船坞、航道和城市交给这支刚刚拥有名字的反抗军。"
 foc_reb.6.desc:0 "帝国叛军成立后，蒙·卡拉马里的造船师终于把长期隐藏的军用巡洋舰方案交给了叛军舰队。此前这些船体只能以少量预先服役舰存在，无法作为标准舰型在船坞批量建造。\n\n现在，MC80的主反应堆、分布式护盾阵列、重型涡轮激光炮和舰载机甲板已经整理成完整的标准化设计。"
 foc_rebel_growth.2.desc:0 "一个新控制的殖民星系加入了帝国叛军。当地造船厂与补给仓库可以提供一支战斗群，也可以转交等值合金预算并加入舰队补给网络。\n\n§Y二选一：20艘MC80，或29800合金并叠加舰船维护费−5%。§!\n合金奖励按奖励版MC80完整设计的基础合金造价核算：每艘1490合金（舰体与配件），20艘共29800，不按各国临时折扣浮动。每个符合条件的星系仅结算一次。"
 foc_rebyard.2.desc:0 "同盟从成立那天起就有一个谁都不愿意说破的问题：我们能抢船、能改装船、能把货轮焊成炮艇，但我们没有一处能把龙骨铺下去的地方。\n\n占下来的星系只有前哨站——一根监听桅杆，一台跃迁抑制器，仅此而已。那上面装不了任何东西，因为它根本没有装东西的地方。\n\n工程队花了几个月把首都星系的前哨站扩建成一座真正的要塞：两条船台、一处锚地、一组炮台，外加乘员舱与后勤办公室。另外两个有殖民地的星系各加了一条船台，用来做前线修理和备用产能。\n\n其余星系维持原样。同盟养不起遍地要塞，也不需要。"
 foc_rebyard.4.desc:0 "两座死星都成了残骸，而§H夸特§!的环形船台完整地落在了我们手里。\n\n帝国撤退时来不及炸毁任何东西——那些船台太大了，大到工程队算过之后放弃了。留下的不只是产线：图纸柜也在原地，锁还是帝国接管前的那一批。\n\n最上面一层压着一份从来没有下水过的设计。中型主力舰，火力对得起吨位，造价只有帝国级的一小部分，本来是共和国海军为战后重建准备的下一代主力。议会当年没有批预算，帝国接管后把它锁进了柜子。\n\n蒙卡拉的工程师看了一眼图纸，说他们认得这个线条——这份设计有一半是他们画的。\n\n§H星云级歼星舰§!的蓝图现已解封。"
 foc_rem.1.desc:0 "银河条约签下去之后，帝国残余在纸面上是一个国家。实际上不是。\n\n外环每一个还挂着帝国旗的星区，手里都有自己的舰队、自己的船坞、以及一个自称合法继承人的总督或元帅。有人还在用皇帝的名义发号施令，有人已经开始铸自己的钱。他们之间的边境摩擦比对新共和国的还多。\n\n残余政府必须先解决这件事，否则谈不上任何对外行动。"
 foc_rem.2.desc:0 "一艘帝国级歼星舰从未知星域的方向跳了出来，没有报出识别码，径直穿过残余的哨戒线。\n\n舰名§H奇美拉§!。舰龄很老，维护得极好，舰体上带着一些没人见过的战损修补痕迹——那些不是新共和国的武器打出来的。\n\n它带来的不只是一艘船。它带来的是一份银河边缘的航图、一套在未知星域打了很多年才磨出来的战术，以及一个终于有人肯服从的舰桥。\n\n从今天起，残余舰队有了一个真正的旗舰。"
 foc_rem.3.desc:0 "旧共和国时代有过一支两百艘德雷德诺特级组成的舰队，全部装了全舰联动系统，一个舰桥就能指挥两百条船。首航时全体船员染上疫病，在神志不清的状态下把整支舰队一起跳进了超空间。\n\n此后五十年，找它成了银河系最著名的一桩传说生意。没有人找到过。\n\n现在有人找到了。\n\n船体完好，反应炉冷了但没坏，武器系统还是五十年前的型号——放在今天的战场上不算先进，可它们不需要先进，它们只需要够多。"
 foc_rem.4.desc:0 "§H夸特§!的环形船台是银河系最大的军工设施，帝国海军六成的吨位从那里下水。条约把夸特划给了新共和国，但船台的所有权在夸特驱动器场手里，而那是一家公司。\n\n公司不谈立场，只谈订单。\n\n他们派人来了，带着一份很实际的方案：新共和国的订单排到七年后，中间那段产能空着也是空着。价钱谈妥了，交货方式不留记录。"
 foc_rem.5.desc:0 "整肃完成了，旗舰回来了，舰队补齐了，船台也接上了。残余第一次不再是残余，而是一个有能力做选择的政权。\n\n参谋部把两份方案摆上了桌。\n\n一份主张就守着外环这块地。承认条约，坐稳这几十个星区，用二十年把它变成一个真正能自己活下去的国家——代价是永远放弃那个曾经属于我们的银河。\n\n另一份主张现在就动手。新共和国的议会还在为舰队预算吵架，边境守备是空的，而我们手里有一个知道怎么打赢的人。"
 foc_republic_origin.160.desc:0 "战争终于停下来了。没有胜利阅兵，也没有人愿意再数一遍死者。各方代表在长桌两侧坐了数日，最终在一份谁都不完全满意的文件上签下名字。\n\n义军同盟放下战时编制，以霍斯尼亚为新的政治中心重建共和国；仍然忠于帝国的舰队和世界则退向外环，把残存的旗帜带往堡垒星域。\n\n一个时代以条约而不是最后一发炮火结束。银河得到了一段和平，也留下了两群都没有忘记上一场战争的人。"
 foc_republic_origin.161.desc:0 "我们签下了那份文件。\n\n科洛桑不再听从帝国的命令，夸特的船坞易手，贾库的航路也被切断。继续作战只会让剩余舰队在没有补给和统一指挥的情况下逐支消失。\n\n帝国没有在今天复兴，也没有在今天彻底死去。我们带着还忠于旧旗帜的人退往堡垒，在银河边缘保存军队、档案和记忆。总有一天，和平会露出裂缝。"
 foc_republic_origin.162.desc:0 "公开的战争结束了，交接清单也签了字。只是有几支舰队的编号，从来没有出现在任何一份清单上。\n\n它们正在向银河北缘的未知星域航行，带走了工程师、凯伯水晶勘探队，以及一整套还没来得及销毁的军工档案。下达撤退命令的是皇帝本人，签发日期比恩多还早。\n\n他从来没有打算让帝国活下去。他打算让别的东西活下去。"
 foc_republic_origin.165.desc:0 "未知星域的航路终于绘制完成。\n\n§H伊冷§!是一颗被冰封的星球，地壳下埋着整个银河最纯净的凯伯水晶矿脉。伊冷与贾库之间的专用航道已经打通，§H弑星者基地、至尊号与复兴级§!科技正式开放。"
 foc_republic_origin.169.desc:0 "死星已经服役，而我们截获了一段来自§H斯卡里夫§!的加密传输。\n\n那是一颗被整片行星护盾包住的热带世界，海面上架着帝国最大的数据塔。全部超级武器项目的原始工程档案都存放在那里——包括反应炉的完整结构图。\n\n发出这段传输的人没有报姓名，只说了一句：图纸里有东西不对劲，而且是有人故意留下的。"
 foc_republic_origin.170.desc:0 "那不是卫星。\n\n§H死星一号§!已经在科洛桑上空投入运行。塔金总督在启用仪式上说，从今天起帝国不再需要议会——恐惧本身就是最有效的行政手段，而恐惧现在有了一个可以停在任何一颗行星轨道上的形状。"
 foc_republic_origin.171.desc:0 "§H死星一号已经被摧毁。§!银河看见了帝国最可怕的武器也会爆炸。义军获得原有的一次性胜利奖励，对死星的旧攻击增伤立即失效。\n\n玩家帝国立即获得§H死星二号建造计划§!，完成工程时触发博桑情报事件，二号在恩多出现。AI帝国则在一号毁灭§H4年后§!暴露并部署未完工二号。\n\n原有帝国支援舰队规则保持：立即获得一支支援舰队，此后每360天再获得一支，直到死星二号被摧毁。"
 foc_republic_origin.173.desc:0 "博桑谍报网已锁定§H恩多§!。死星二号未完工的骨架出现在森林卫星上空，超级激光已经可以开火。\n\n其船体、装甲、护盾与武器输出均为死星一号的§H1.3倍§!，初始移速为§H0§!。AI帝国不会进行完工与机动改装，斯卡里夫的旧死星增伤也不会再次生效。"
 foc_republic_origin.174.desc:0 "恩多上空，§H死星二号§!已进入战斗值班。其外壳和推进系统尚未完工，移速为§H0§!；船体、装甲、护盾与武器输出均为死星一号的§H1.3倍§!。\n\n玩家帝国可以在情报日志中手动研究§H死星二号：完工与机动改装§!。完成后，外观变为放大1.3倍的死星一号完整模型，机动能力恢复。AI不会执行这项升级。"
 foc_republic_origin.175.desc:0 "§H第二座也没了。§!\n\n地面小队摧毁了恩多的护盾发生器，义军战机从未完工的外壳缺口深入反应炉，将第二死星化为燃烧的残骸。帝国统治的支柱随之崩塌。\n\n§Y帝国的360天周期支援从此停止，已到达的舰队保留。义军仍获得本次死星毁灭自身的既有胜利奖励，但此后新取得的星系不再提供舰队、资源或新的维护费减免层数；未领取的新星系奖励同时取消。§!"
 foc_republic_origin.176.desc:0 "第二颗死星也消失在恩多上空。皇帝的声音不再从科洛桑传来，帝国舰队的命令开始互相矛盾，各地总督第一次公开拒绝中央调动。\n\n然而战争还没有真正结束。执行者号、卢桑基亚号和惩罚者号仍在维系帝国最后的舰队骨架，科洛桑、夸特与贾库仍是旧秩序赖以呼吸的三处节点。\n\n只要这些支柱还在，银河就还没有迎来和平。"
 foc_republic_origin.177.desc:0 "斯卡里夫行动取得了死星档案，然而完整图纸还没有安全送达义军指挥部。\n\n§Y本事件只记录图纸被夺取，不立即发放死星特攻或护盾伤害加成。§!斯卡里夫战役后等待30天，奥德朗与莱雅救援事件才会进入后续剧情；莱雅获救后，义军方能完成弱点分析。"
 foc_republic_origin.178.desc:0 "最后一处义军基地的坐标是从一名被俘的通讯官身上拿到的。三天之后，那颗星球的地表被烧成了平地。\n\n银河内战结束了，而且没有留下第二面旗帜。\n\n皇帝随即批准了一份工程部门递过很多次的方案：死星只能摧毁一颗行星，而且需要开到目标附近。如果把武器直接建在一颗行星上，用整颗恒星供能，射程就不再是问题。"
 foc_republic_origin.180.desc:0 "三座军港收到了启航命令。\n\n§H执行者号§!率30艘帝国 II 级驻守恩多，§H卢桑基亚号§!率30艘帝国 II 级驻守科洛桑，§H惩罚者号§!率30艘帝国 II 级驻守贾库。\n\n三支编队各为§H1艘执行者级＋30艘帝国 II 级§!。三艘剧情旗舰各自只服役一次，被摧毁后不会重建。"
 foc_republic_origin.182.desc:0 "弑星者基地的聚能阵列已经指向霍斯尼亚。那颗恒星周围环绕着新共和国的议会、舰队司令部和整个战后政治秩序。\n\n最高领袖的命令只有一句：不要打击一支舰队，要打击他们相信战争已经结束的那个世界。\n\n与此同时，来自迪卡方向的加密讯号越来越密集。有人已经开始为最坏的结果做准备。"
 foc_republic_origin.192.desc:0 "霍斯尼亚不存在了。\n\n弑星者的光束抵达时，没有宣战广播，也没有撤离时间。议会穹顶、舰队司令部、城市与轨道设施一同消失在恒星爆发般的白光里。新共和国赖以维系的中央秩序在几秒钟内被切断。\n\n短暂的沉默之后，一段新的加密呼号从迪卡传来。那里没有议会席位，也没有正式授权，只有一群拒绝把这场战争交给历史的人。"
 foc_republic_origin.22.desc:0 "卡米诺传来的最后一份克隆军交付报告还没在议会归档，夸特的代表已经把另一份文件放到了桌上。战争正在变得比任何成员世界单独承担的规模都更大，而共和国现有的船台仍是为和平年代的护航舰准备的。\n\n夸特动力船坞提出扩建环形军港：新的龙骨架、更深的干船坞，以及足以连续建造大型主力舰的工业区。共和国若要把克隆军送到银河每一条战线，就必须先给他们造出能够抵达那里的舰队。"
 foc_republic_origin.24.desc:0 "§L最高议会仍试图用程序维持秩序，然而战争正在把每一道旧规则推向极限。§!\n\n夸特轨道上的最后一组新船台点亮了导航灯。共和国海军早已拥有少量猎兵级服役舰，但它们始终依赖有限的专用船台与手工装配，无法支撑一场席卷银河的长期战争。\n\n如今，新的标准化生产线终于贯通。猎兵级不再只是中央舰队中屈指可数的重型旗舰——从这一刻起，它将成为共和国真正能够持续补充的战争主力。\n\n§Y固定剧情节点：阴谋＋10，只记录一次。§!\n\n§H先进耐钢装甲§!现已解锁。夸特将获得行星环奖励；没有既有环、施工或废墟时，直接建成配备§H4座船坞§!的§H三级行星环§!。"
 foc_republic_origin.30.desc:0 "议会大厅的灯光照在一张张沉默的脸上。最高议长走上讲坛，宣布旧共和国将在今天结束——不是因为战败，而是因为它已经无法保护自己。一个更强大、更安全、更有秩序的国家将取代它。\n\n掌声从穹顶下一层层响起。与此同时，蒙·莫思玛和一批拒绝宣誓效忠的军官已经离开科洛桑。雅文的丛林与霍斯的冰原正在接收第一批逃亡者。\n\n银河只剩下两个选择：接受新秩序，或者反抗它。"
 foc_republic_origin.32.desc:0 "科洛桑上空最后一面共和国旗帜被降下。军港、法院、情报机关和克隆军团在同一天换上新的徽记，帝国级歼星舰的首批订单从海军部送往各大船厂。\n\n在更深的档案层，一份只有极少数人见过的工程计划被重新启封。它的代号很简单：死星。皇帝相信，只要银河见过一次它的力量，就不会再需要第二次。"
 foc_republic_origin.33.desc:0 "帝国的公告宣称内战已经结束，可雅文的密林里仍有运输机起降，霍斯的冰层下也有人把旧共和国的设备重新接上线。逃亡的议员、拒绝改编的军官、走私者和地方抵抗组织开始共享同一批密码。\n\n他们还没有统一的旗帜，也没有足以和帝国舰队正面对抗的力量。但从这一刻起，银河中第一次出现了一张无法被帝国完全抹去的反抗网络。\n\n而在斯卡里夫，帝国仍把某些最重要的秘密锁在行星护盾之下。"
 foc_republic_origin.70.desc:0 "那不是卫星。\n\n当最后一块装甲板封闭，死星的主反应堆开始全功率运转。整座战斗空间站缓慢离开施工轨道，超级激光阵列第一次转向一颗真正的目标。\n\n帝国高层相信，一座能够让整颗行星从星图上消失的武器，会让所有反抗在开火之前就自行崩溃。银河很快就会知道他们是否正确。"
 foc_republic_origin.80.desc:0 "银河系没有再升起第二面旗帜。\n\n死星已经服役，共和国已经不存在，最后一批义军的基地在轨道轰炸中变成了玻璃。皇帝在科洛桑宣布：新秩序取得了完全的、不可逆的胜利。\n\n档案库最深处那些一直上着封条的工程资料，从今天起可以取用了。"
 foc_rogue_one.14.desc:0 "斯卡里夫的护盾大门已被突破。地面小队在档案塔中找到代号§H星尘§!的完整图纸，并将数据传向轨道上的义军旗舰。\n\n§H拉杜斯上将§!驾驶深奥号坚守传输窗口，最终与旗舰一同毁于帝国炮火。侠盗一号地面小队再无回音，但图纸已经离开星球。\n\n义军尚未完成情报分析。至少一个月后，若战役发生时已建成的死星一号仍然存在，它将抵达斯卡里夫；此后的追击与营救将决定这些牺牲是否换来希望。"
 foc_saga_dqar.3.desc:0 "银河条约签字之后的第一份文件不是庆祝声明，而是复员令。\n\n为了拆掉两座死星、为了在内环打赢一场看不到头的战争，船坞曾经昼夜不停，预备役一批批被重新召回，整个经济都围绕前线运转。\n\n现在没有仗打了。议会很快通过决议：超编舰队封存，临时征召人员回家，军工产线转向重建。\n\n有人在议场里问，如果他们回来怎么办。回答是：那就再打一次——但共和国不能靠永远准备下一场战争活着。"
 foc_story.10.desc:0 "弑星者基地的光束穿过超空间，霍斯尼亚的天空在数秒内变成白色。首都、议会、舰队司令部以及环绕恒星的整个政治中心一同消失。\n\n幸存的通讯频道沉默了很久。等第一批加密信号重新出现时，它们已经不再从霍斯尼亚发出，而是从迪卡的密林深处传来。\n\n新共和国的时代结束了。抵抗仍在继续。"
 foc_supremacy_duel.2.desc:0 "至尊号与拉杜斯号终于进入同一片战场。第一秩序旗舰的炮火把周围空间照成白昼，抵抗组织舰队已经没有足够兵力继续正面对射。\n\n拉杜斯号忽然转向。舰桥没有再发送撤退航向，而是把舰首对准至尊号，随后启动超空间引擎。\n\n一道蓝白色裂痕贯穿整支第一秩序编队。两艘巨舰在几乎同一瞬间被撕成燃烧的残骸。"
 foc_thrawn.2.desc:0 "银河和约后的冷战年代，阿索卡·塔诺与萨宾·辛格终于追上失踪多年的埃兹拉·布里杰；然而，流亡在遥远星系的§H索龙元帅§!也借暗夜姐妹之力重返银河。\n\n新共和国把相关警告视为边境小题大做，帝国残余却第一次重新拥有了一个真正懂得如何整合资源与制定长期战略的统帅。\n\n奇美拉号重新出现在帝国通讯网上时，许多多年不肯听命于任何人的总督同时回复了同一句话：元帅。"
 fop_origin.75.desc:0 "群星之下再没有能够挑战我们王座的独立政权。无数生命的恐惧与服从在原力中汇聚，像潮水一样涌向同一个意志。\n\n最高领袖不再满足于统治使用原力的人。下一步，是让原力本身学会服从。"
 foc_hero_rewards.2.desc:0 "卢克·天行者逝去后，莱娅·奥加纳用最后的生命在原力中呼唤自己的儿子。那声呼唤穿过了凯洛·伦多年来筑起的黑暗，也唤回了一个几乎被他亲手埋葬的名字。\n\n他抛下交叉护手光剑，重新以§H本·索罗§!的身份站了起来。没有赦免，也没有欢迎仪式；只有一条通往厄西戈的航路，以及一件他必须亲自完成的事。"
