 foc_immobilizer418:0 "418型阻绝者巡洋舰"
 foc_immobilizer418_cap:0 "418型阻绝者巡洋舰"
 foc_immobilizer418_plural:0 "418型阻绝者巡洋舰"
 NAME_FOC_IMMOBILIZER_418:0 "418型阻绝者"
 FOC_IMMOBILIZER418_HULL:0 "418型阻绝者舰体"
 SHIP_GRAPHICS_FOC_IMMOBILIZER418_DESC:0 "以四台重力井发生器为核心建造的帝国阻绝巡洋舰。它能把敌舰队钉死在实空间，让主力舰队将其彻底消灭。"

 FOC_IMMOBILIZER418_CORE:0 "太阳电离控制核心"
 FOC_IMMOBILIZER418_CORE_DESC:0 "418型阻绝者的舰船控制与火力协调核心。"
 FOC_IMMOBILIZER418_JUMPDRIVE:0 "二级超空间引擎"
 FOC_IMMOBILIZER418_JUMPDRIVE_DESC:0 "供阻绝巡洋舰使用的军用超空间引擎。"
 FOC_IMMOBILIZER418_THRUSTER:0 "阻绝者离子推进器"
 FOC_IMMOBILIZER418_THRUSTER_DESC:0 "为帝国重巡洋舰提供动力的大功率离子推进器。"
 FOC_IMMOBILIZER418_REACTOR:0 "太阳电离反应堆"
 FOC_IMMOBILIZER418_REACTOR_DESC:0 "能够同时为舰体和重力井发生器供能的大型反应堆。"
 FOC_IMMOBILIZER418_CREW:0 "帝国阻绝舰船员"
 FOC_IMMOBILIZER418_CREW_DESC:0 "受过专门训练、能让阻绝力场与帝国战列线协同行动的船员。"
 FOC_IMMOBILIZER418_TURBOCANNON:0 "阻绝者四联涡轮激光炮"
 FOC_IMMOBILIZER418_TURBOCANNON_DESC:0 "用于近距离舰队交战的四联装涡轮激光炮。"
 FOC_IMMOBILIZER418_POINT_DEFENCE:0 "阻绝者点防御阵列"
 FOC_IMMOBILIZER418_POINT_DEFENCE_DESC:0 "负责拦截导弹与舰载机、保护阻绝巡洋舰的专用激光阵列。"
 FOC_IMMOBILIZER418_INTERCEPTOR:0 "阻绝者拦截机联队"
 FOC_IMMOBILIZER418_INTERCEPTOR_HANGAR:0 "阻绝者拦截机联队"
 FOC_IMMOBILIZER418_INTERCEPTOR_HANGAR_DESC:0 "专门用于保卫重力井投射器载舰的常驻拦截机联队。"
 FOC_IMMOBILIZER418_SNARE:0 "西纳舰队系统 G7-X 重力井投射器"
 FOC_IMMOBILIZER418_SNARE_DESC:0 "750范围内的敌对舰队无法让单舰脱离战斗，也无法启动紧急超光速撤退。子爵级与执行者级旗舰同样强制安装该系统。"
 foc_immobilizer418_interdiction_aura:0 "G7-X 阻绝力场"
 foc_immobilizer418_interdiction_aura_desc:0 "人造质量阴影会阻止敌舰紧急跃迁或脱离战斗。"

 foc_immobilizer418_ftl:0 "阻绝者超空间引擎"
 foc_immobilizer418_crew:0 "阻绝舰船员"
 foc_interdiction_gravity_well:0 "重力井阻绝系统"
 FOC_IMMOBILIZER418_SNARE_AUX:0 "SFS G7-X 重力井投射器"
 FOC_IMMOBILIZER418_SNARE_AUX_DESC:0 "418型阻绝者四组重力井投射器之一，可制造质量阴影并阻止敌舰紧急超光速撤离。"

 foc_immobilizer418_aux_systems:0 "阻绝者辅助系统"
