l_simp_chinese:
 foc_phase1_rebel_operations_edict:0 "义军特别行动局"
 foc_phase1_rebel_operations_edict_desc:0 "召集情报员、飞行员和突击队，发动只属于这条历史线的高风险特种行动。行动依赖现有指挥官素质，并拥有长期冷却。"
 foc_phase1_fleet_archive_edict:0 "舰队档案与封存令"
 foc_phase1_fleet_archive_edict_desc:0 "管理跨时代舰船。退役不会摧毁现役舰艇，只会停止继续建造；必要时可付出重新启封生产线的代价。"

 foc_phase1.20.name:0 "义军特别行动局"
 foc_phase1.20.desc:0 "全面战争之外，还有另一条战线。我们的舰队不可能在每个正面战场压倒帝国，但可以把极少数精锐投入敌人最不愿失去的节点。这里的每一次行动都来自FOC自己的剧情状态：夸特的造舰体系、斯卡里夫的档案防线，以及丰多的工业心脏。\n\n高等级指挥官会显著提高行动成功率；失败则意味着资源、人员和时间全部损失。"
 foc_phase1.20.a:0 "§Y尖矛行动§!——渗透夸特并夺取一艘帝国主力舰"
 foc_phase1.20.b:0 "§Y玻璃影行动§!——刺探斯卡里夫档案网络"
 foc_phase1.20.c:0 "§Y断潮行动§!——破坏丰多造船体系"
 foc_phase1.close:0 "返回战略部署。"

 foc_phase1.21.name:0 "尖矛行动：成功"
 foc_phase1.21.desc:0 "突击队没有试图占领夸特，也没有把自己变成一场毫无胜算的舰队决战。他们制造了数起互相矛盾的事故警报，切断局部船坞通信，并在帝国反应过来以前夺取了一艘正在调试的帝国级歼星舰。\n\n我们获得的不只是这艘舰本身，还有一整套生产记录、维护协议与船坞工艺数据。"
 foc_phase1.21.a:0 "让它换上义军识别码。"
 foc_phase1.22.name:0 "尖矛行动：暴露"
 foc_phase1.22.desc:0 "夸特的防御比预想更加严密。潜入队伍没能接近目标泊位，备用撤离路线也在帝国封锁前被切断。幸存者已经撤回，但本次行动投入的资源全部损失。"

 foc_phase1.23.name:0 "玻璃影行动：档案裂隙"
 foc_phase1.23.desc:0 "我们没有拿到死星完整蓝图——那仍需要真正攻破斯卡里夫——但行动小组带回了一枚从档案网关截获的加密核心。它记录了帝国项目编号、认证链和部分舰队调令。\n\n这份材料不足以直接暴露死星弱点，却足以让此后的情报工作绕过许多帝国安全层。"
 foc_phase1.23.a:0 "把它交给情报部门。"
 foc_phase1.24.name:0 "玻璃影行动：静默失败"
 foc_phase1.24.desc:0 "斯卡里夫的档案系统没有给我们第二次机会。伪造的认证链在最后一层被识别，小组只能烧毁设备并撤离。至少帝国还不知道我们真正寻找的是什么。"

 foc_phase1.25.name:0 "断潮行动：丰多停摆"
 foc_phase1.25.desc:0 "行动组没有试图炸毁整个丰多——那只会让帝国把造舰线转移到别处。他们针对同步调度、主反应堆检修和船坞校准程序发动了一次精确破坏。大批在建舰艇被迫停工，而我们则截走了仓库中的合金和工程资料。"
 foc_phase1.25.a:0 "让帝国为每一天停工付出代价。"
 foc_phase1.26.name:0 "断潮行动：封锁收紧"
 foc_phase1.26.desc:0 "丰多防务部门提前察觉了异常流量。行动小组不得不在炸药尚未布置完成时撤离。我们保住了核心人员，却没能让造船厂停摆。"

 foc_phase1.40.name:0 "舰队档案与封存令"
 foc_phase1.40.desc:0 "一个横跨数十年剧情的银河不该让每一种旧舰永远占据造船菜单。档案局不会删除科技，也不会让现役舰艇消失；它只决定某条历史生产线是否继续接受新订单。\n\n当前第一批纳入体系的是共和国§Y猎兵级歼星舰§!。"
 foc_phase1.40.a:0 "封存猎兵级生产线。"
 foc_phase1.40.b:0 "重新启封猎兵级生产线。"
 foc_phase1.41.name:0 "共和国舰队的遗产"
 foc_phase1.41.desc:0 "时代已经变化。曾经作为共和国海军象征的猎兵级仍然拥有战斗价值，但继续维持完整生产体系会让新的舰队建设被旧标准牵制。档案局建议把它转为历史储备型号：现役舰艇继续服役，新的订单则停止。"
 foc_phase1.41.a:0 "打开舰队档案。"
 foc_phase1.41.b:0 "暂时维持现状。"

 foc_phase1.60.name:0 "银河战略航路"
 foc_phase1.60.desc:0 "当前星战地图的六条主要航道——§Y帕勒米安贸易航道、科雷利亚航路、科雷利亚贸易主脊、里马贸易航道、海地安大道、费达勒—夸特航道§!——现在统一用于战略航路控制核算。\n\n全网共有§Y39个唯一主要航道星系§!；控制至少10/20/30个节点分别对应区域级、跨区级和银河级航路控制。原有星球地方经济特色仍保留，但不再参与国家级航线控制判定。"

 foc_phase1_corellian_commercial_spine:0 "科雷利亚商业脊线"
 foc_phase1_corellian_commercial_spine_desc:0 "该世界位于FOC核心商业弧线上，人员、货物与金融流动远高于普通星系。"
 foc_phase1_coreward_industrial_corridor:0 "核心区工业走廊"
 foc_phase1_coreward_industrial_corridor_desc:0 "科洛桑行政体系、夸特重型船坞和丰多工业群之间形成的战略工业轴。"
 foc_phase1_outer_rim_supply_lane:0 "外环补给航线"
 foc_phase1_outer_rim_supply_lane_desc:0 "这条军用补给链维系着外环大型舰队、驻军与远程运输。"
 foc_phase1_scarif_cipher_network:0 "斯卡里夫密码链"
 foc_phase1_scarif_cipher_network_desc:0 "从帝国档案认证系统中截获的密码核心显著提升了情报部门的解密效率。"
 foc_phase1_fondor_shipyard_disruption:0 "丰多调度瘫痪"
 foc_phase1_fondor_shipyard_disruption_desc:0 "关键调度和检修系统遭到定点破坏，舰船生产速度暂时大幅下降。"
 foc_phase1_fleet_archive_savings:0 "历史舰型封存体系"
 foc_phase1_fleet_archive_savings_desc:0 "旧舰生产线转入档案储备，释放了一部分维护人员与工业容量。"

 foc_phase1_malachor_memory_site:0 "马拉科：静默记忆库"
 foc_phase1_malachor_memory_site_intro:0 "阿索卡在马拉科失踪后，古老神殿深处出现了一段此前无法识别的原力回响。它不像西斯墓穴，更像有人刻意把一组记忆封存在战场之外。"
 foc_phase1_arch.1.name:0 "灰烬下的回声"
 foc_phase1_arch.1.desc:0 "探险队穿过被战争熔毁的石层，找到一组与西斯神殿结构不一致的人工隔离墙。墙后没有武器，只有重复播放的损坏导航记录。"
 foc_phase1_arch.2.name:0 "被切断的传承"
 foc_phase1_arch.2.desc:0 "记录来自多个时代：绝地、叛逃者、无名的原力敏感者。它们没有组成一部教典，反而像某种刻意避免建立教条的教学档案。"
 foc_phase1_arch.3.name:0 "记忆晶体"
 foc_phase1_arch.3.desc:0 "核心是一枚被多层屏蔽包围的记忆晶体。它保存的不是某位大师的命令，而是失败者留下的警告：每一个试图把原力完全变成制度工具的政权，最终都把自身的恐惧写进了下一代。"
 foc_phase1_arch.4.name:0 "马拉科遗存"
 foc_phase1_arch.4.desc:0 "晶体已经被完整取出。它既不是传统绝地全息仪，也不是西斯神器，而是一份跨越阵营的经验档案。对愿意倾听的人，它能训练更成熟的领袖；对研究原力的人，它则提供了一条避开古老教条的路径。"
 foc_phase1_arch.ok:0 "继续发掘。"
 foc_phase1_arch.4.a:0 "将记忆晶体列入国家遗物库。"

 r_foc_malachor_memory_crystal:0 "马拉科记忆晶体"
 r_foc_malachor_memory_crystal_desc:0 "从马拉科静默记忆库取出的多层记忆晶体。它记录了绝地、西斯之外的失败、怀疑与幸存经验。"
 r_foc_scarif_cipher_core:0 "斯卡里夫密码核心"
 r_foc_scarif_cipher_core_desc:0 "义军特别行动局从斯卡里夫档案网络截获的认证核心。它不是死星蓝图，却能揭开帝国情报体系的结构。"
 foc_phase1_malachor_relic_triumph:0 "记忆晶体共鸣"
 foc_phase1_malachor_relic_triumph_desc:0 "领袖训练和原力研究暂时吸收了马拉科记忆库中的经验。"
 foc_phase1_scarif_relic_triumph:0 "斯卡里夫认证突破"
 foc_phase1_scarif_relic_triumph_desc:0 "帝国认证链被短期破解，舰队情报和火控识别得到提升。"

 NAME_FOC_PHASE1_CAPTURED_KUAT_FLEET:0 "夸特缴获编队"
 NAME_FOC_PHASE1_CAPTURED_ISD:0 "自由之矛"

 fop_phase1_crisis_rank_2:0 "第一秩序野望：战区统合"
 fop_phase1_crisis_rank_2_desc:0 "第一条臣服链已经建立，高级指挥部开始把战争与占领体系整合成一部机器。"
 fop_phase1_crisis_rank_3:0 "第一秩序野望：支配网络"
 fop_phase1_crisis_rank_3_desc:0 "多个附庸、关键造舰世界和战略节点被纳入统一支配体系。"
 fop_phase1_crisis_rank_4:0 "第一秩序野望：银河统治权"
 fop_phase1_crisis_rank_4_desc:0 "第一秩序已经从一支复仇舰队变成银河政治本身。"
 fop_phase1_crisis_rank_5:0 "第一秩序野望：原力霸权"
 fop_phase1_crisis_rank_5_desc:0 "物质银河的支配开始向原力本身延伸。"
 fop_phase1_force_project_requires_ambition:0 "需要至少§Y5000§!点第一秩序野望，才能把银河征服积累的权力转化为奴役原力的工程。"

 # Highest-priority Phase-I rewrite of the existing ambition UI texts.
 fop_ambition_points_tooltip:0 "§Y第一秩序野望§!来自具体战争成果：摧毁敌舰§Y+1§!、摧毁恒星基地§Y+10§!、攻占殖民地§Y+25§!、摧毁国家§Y+100§!、建立新的臣服国§Y+150§!。首次控制贾库§Y+100§!、夸特§Y+150§!、科洛桑§Y+250§!、艾克西戈§Y+300§!。\n\n晋升不是单纯刷点数：每一级仍必须完成FOC自己的剧情目标。"
 fop_origin.65.desc.1:0 "§Y阶段 I——弑星之火§!\n弑星者基地已经把第一秩序从帝国继承者变成公开的银河天灾。\n\n§E下一目标：§!积累至少§Y400§!点野望，并迫使第一个国家成为臣服者。"
 fop_origin.65.desc.2:0 "§Y阶段 II——战区统合§!\n第一个臣服国已经成为第一秩序战争机器的一部分。\n\n§E下一目标：§!积累至少§Y1200§!点野望，并控制至少三个附庸；若银河已彻底臣服则直接满足政治条件。"
 fop_origin.65.desc.3:0 "§Y阶段 III——支配网络§!\n关键星系、附庸与舰队正在组成一套真正的银河统治网络。\n\n§E下一目标：§!积累至少§Y3000§!点野望，令所有普通帝国与堕落帝国臣服或灭亡；若反抗最终秩序，还必须先赢得内战。"
 fop_origin.65.desc.4:0 "§Y阶段 IV——银河统治权§!\n没有独立强权还能否认第一秩序。\n\n§E下一目标：§!将野望提高到§Y5000§!点，然后完成§Y奴役原力§!特殊项目。"
 fop_origin.65.desc.5:0 "§Y阶段 V——原力霸权§!\n战争、附庸和恐惧积累出的权力已经被转化为对原力的锁链。\n\n§E下一目标：§!进入原力之海，消灭全部虚境化身并夺取无主神座。"
 # ---- FOC 银河内战实力与游击队 ----
 foc_gcw_empire_high_control:0 "银河内战：帝国控制稳固"
 foc_gcw_empire_high_control_desc:0 "核心航路、行政节点和占领体系仍在帝国掌握之中。"
 foc_gcw_empire_low_control:0 "银河内战：统治裂隙"
 foc_gcw_empire_low_control_desc:0 "越来越多世界开始把帝国命令视为可以拒绝的命令。"
 foc_gcw_empire_high_morale:0 "银河内战：帝国军心高涨"
 foc_gcw_empire_high_morale_desc:0 "帝国军队仍然相信战争能够用秩序与火力解决。"
 foc_gcw_empire_low_morale:0 "银河内战：军心动摇"
 foc_gcw_empire_low_morale_desc:0 "长期战争、失地和不断扩散的叛乱正在侵蚀帝国军队的信心。"

 foc_gcw_partisan_cell:0 "地下反抗细胞"
 foc_gcw_partisan_cell_desc:0 "零散的反帝人员已经建立秘密联系，破坏和情报泄漏开始出现。"
 foc_gcw_partisan_network:0 "地下游击网络"
 foc_gcw_partisan_network_desc:0 "地方反抗已经跨过零散抗议阶段，拥有稳定联络、藏匿点和地下补给线。"
 foc_gcw_partisan_uprising:0 "公开起义"
 foc_gcw_partisan_uprising_desc:0 "地下网络已经转为公开武装反抗。若帝国不能迅速恢复控制，这个星系可能倒向帝国叛军。"
 foc_gcw_partisan_armed:0 "义军秘密军援"
 foc_gcw_partisan_armed_desc:0 "来自帝国叛军的装备、顾问和加密通讯已经抵达地下网络。"
 foc_gcw_local_concessions:0 "地方政治让步"
 foc_gcw_local_concessions_desc:0 "帝国暂时以自治、赦免与经济让步换取了当地秩序。"

 foc_gcw_rebel_mobilization_1:0 "义军动员：零散星火"
 foc_gcw_rebel_mobilization_1_desc:0 "银河各地仍存在反抗，但联盟成立时能够调动的力量有限。"
 foc_gcw_rebel_mobilization_2:0 "义军动员：地下网络"
 foc_gcw_rebel_mobilization_2_desc:0 "多个世界的地下组织已经形成可共享情报和补给的反抗网络。"
 foc_gcw_rebel_mobilization_3:0 "义军动员：银河同盟"
 foc_gcw_rebel_mobilization_3_desc:0 "民意、后勤、情报和舰队准备度已经足以支撑真正的银河级战争。"
 foc_gcw_rebel_mobilization_4:0 "义军动员：燎原之势"
 foc_gcw_rebel_mobilization_4_desc:0 "帝国时代积累的每一次反抗都在此刻汇合。义军联盟拥有遍布银河的补给、情报和战斗网络。"

 foc_gcw.6.name:0 "星火汇流"
 foc_gcw.6.desc.1:0 "帝国叛军已经打出了共同旗号，但长期地下战争积累有限。联盟拥有坚定的核心，却仍必须依靠现有剧情舰队逐步扩大力量。"
 foc_gcw.6.desc.2:0 "多个地下组织在联盟成立前已经完成联络。除现有舰队外，一支由地方抵抗力量拼成的战斗群正式加入高层指挥体系。"
 foc_gcw.6.desc.3:0 "帝国的统治裂隙已经成为一条横跨银河的地下战线。两支额外战斗群、成熟的情报链和战争物资在联盟宣言发出后迅速集结。"
 foc_gcw.6.desc.4:0 "这不是一支突然出现的义军。多年以来的罢工、藏匿点、偷运路线、地方起义和秘密舰队在同一时刻公开身份。三支额外战斗群加入现有主力，银河内战进入真正的全面战争。"
 foc_gcw.ok:0 "让每一点星火都成为战线。"

 foc_gcw.11.name:0 "地下反抗细胞"
 foc_gcw.11.desc:0 "安全部门在[Root.GetName]发现了一组彼此独立却使用相同加密规则的地下联系人。目前他们还没有形成真正的游击组织，但放任不管可能让这颗星球进入帝国叛军的情报网络。"
 foc_gcw.11.a:0 "让ISB秘密清剿。"
 foc_gcw.11.b:0 "调驻军直接扫荡。"
 foc_gcw.11.c:0 "监视他们，暂不收网。"

 foc_gcw.12.name:0 "地下网络成形"
 foc_gcw.12.desc:0 "[Root.GetName]的反抗活动已经不是几个人的秘密聚会。藏匿点、运输节点和地下通讯正在形成一张真正的游击网络，帝国叛军甚至可能已经与他们取得联系。"
 foc_gcw.12.a:0 "发动联合安全行动。"
 foc_gcw.12.b:0 "实施军事管制，把他们压回地下。"
 foc_gcw.12.c:0 "以赦免和地方自治拆散网络。"

 foc_gcw.13.name:0 "公开起义"
 foc_gcw.13.desc:0 "[Root.GetName]的地下组织已经公开武装。行政机构遭到攻击，帝国驻军被迫退入要塞区。如果这场起义成功，整个星系都可能宣布加入帝国叛军。"
 foc_gcw.13.a:0 "不惜代价恢复帝国秩序。"
 foc_gcw.13.b:0 "撤出这个星系，保存舰队。"

 foc_gcw.30.name:0 "一条来自帝国腹地的线路"
 foc_gcw.30.desc:0 "一个新的地下网络通过数层中间人联系到我们。他们不要求我们替他们战斗，只希望得到足以让自己活到起义那一天的装备、识别码和通讯支持。"
 foc_gcw.30.a:0 "秘密输送武器和顾问。"
 foc_gcw.30.b:0 "只建立情报链，暂不武装他们。"
 foc_gcw.30.c:0 "保持距离，避免帝国顺藤摸瓜。"
