 foc_native_species_kashyyyk_desc:0 "卡希克的主要人口为伍基人。他们是共和国体系内具有完整社会、技术和军事传统的成员文明，而不是前FTL土著。"
 foc_native_species_mon_cala_desc:0 "达克同时生活着蒙卡拉马里人与夸润人。两者都是高度发达的本土文明，并以共和国公民身份参与银河政治。"
 foc_native_species_geonosis_desc:0 "吉奥诺西斯人拥有成熟的工业、武器生产和星际技术。共和国时期以高度自治的本土文明处理；加入分离主义后成为邦联的完整成员人口。"
