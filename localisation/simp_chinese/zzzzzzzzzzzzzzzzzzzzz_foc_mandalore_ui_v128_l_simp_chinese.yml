l_simp_chinese:
 origin_foc_mandalore_state:0 "曼达洛：中立公国"
 origin_foc_mandalore_state_desc:0 "曼达洛在共和国末期保持政治独立。萨廷·克里兹领导的新曼达洛派试图结束氏族内战与军事扩张，但古老的武士传统、死亡守望与外部势力仍在争夺这个世界的未来。"
 origin_foc_mandalore_state_effects:0 "§Y剧情国家：§!\n- 曼达洛以独立中立国家身份存在\n- 主物种固定为§H曼达洛人§!\n- 政府会随§H萨廷时期 → 摩尔夺权 → 博-卡坦/重建§!自动变化\n- 曼达洛围攻、帝国吞并、千泪之夜与银河条约后的命运由 FOC 正史事件控制"

 gov_foc_mandalore_new_mandalorians:0 "新曼达洛公国"
 gov_foc_mandalore_new_mandalorians_desc:0 "萨廷·克里兹领导的新曼达洛政府试图以中立、外交和重建取代长期的氏族战争。它仍然建立在曼达洛社会之上，而不是一个普通的银河共和国成员国。"
 gov_foc_mandalore_shadow_collective:0 "暗影集团统治"
 gov_foc_mandalore_shadow_collective_desc:0 "摩尔通过死亡守望和暗影集团夺取曼达洛，以武力、恐惧和犯罪联盟支撑自己的统治。"
 gov_foc_mandalore_clan_council:0 "曼达洛氏族议会"
 gov_foc_mandalore_clan_council_desc:0 "博-卡坦与幸存氏族重新建立共同政府。它不再依赖一把武器或单一王朝，而以氏族盟约与共同防卫维系曼达洛。"

