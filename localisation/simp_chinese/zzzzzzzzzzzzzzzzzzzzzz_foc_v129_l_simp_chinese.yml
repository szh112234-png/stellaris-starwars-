 # 独立遗物图标/光剑
 r_foc_ancient_jedi_lightsaber:0 "古代绝地光剑"
 r_foc_ancient_jedi_lightsaber_desc:0 "一柄从奥苏斯地下档案区幸存下来的绝地光剑。它没有留下足以确认原主人的铭文，因此它代表的不是某一位传奇人物，而是共和国末期无数普通绝地留下的武术、责任与传承。"
 foc_phase1_lightsaber_relic_triumph:0 "光剑传承训练"
 foc_phase1_lightsaber_relic_triumph_desc:0 "对古代光剑构造、剑式记录与绝地训练资料的联合研究正在影响我们的军官教育与原力研究。"

 foc_phase1_arch.12.name:0 "最后的训练室"
 foc_phase1_arch.12.desc:0 "在奥苏斯档案核心旁的一间封闭训练室中，考古队发现了一柄没有身份铭文的绝地光剑。能量电池早已失效，但凯伯晶体、发射矩阵与握柄结构保存完好。\n\n它并不是某位著名大师的圣物。正因如此，这件武器更像是旧绝地教团本身留下的一段无名证词。"
 foc_phase1_arch.12.a:0 "保存这柄无名的绝地光剑。"

