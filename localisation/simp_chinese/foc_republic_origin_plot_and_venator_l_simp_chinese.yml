 situation_foc_republic_origin_palpatine_plot:0 "帕尔帕廷的阴谋"
 situation_foc_republic_origin_palpatine_plot_type:0 "帕尔帕廷的阴谋"
 situation_foc_republic_origin_palpatine_plot_desc:0 "§Y战前与战时计分：上限140点§!\n五次关键抉择：接受商业财团捐助、通过军队组建法案、将可疑账目结案归档、延长紧急权力、拒绝绝地调查；每项有利于帕尔帕廷的选择§G＋20§!，另一选项§Y＋0§!。\n四个固定节点：纳布危机、克隆人军队计划、夸特船坞扩建、科洛桑战役，每项仅记§G＋10§!。\n§H100＋40＝140§!。必须五次全部选择有利选项，且四个节点完成，才能达到140点。没有每月自动增长，重复事件与切换应对方式不会补分。\n\n§Y分离主义投降：两条路线，满足任意一条§!\n§H剧情路线§!：科洛桑战役事件完成＋乌塔堡（乌塔帕）战役事件完成＋帕尔帕廷的阴谋达到140点。\n§H军事路线§!：由游戏实际判定共和国在对邦联的全面战争中获胜，或确认共和国在该战争中彻底消灭邦联，才进入投降收尾。殖民地数量、暂时的控制权或找不到邦联均不单独判胜；维持现状、共和国战败及第三方消灭邦联不算共和国胜利。本路线不要求阴谋140点或两场战役事件。\n全选不利或混合选择导致阴谋不足140点时，必须通过军事路线结束战争，不能靠等待补分。两条路线均接入分日投降结算；杜库与格里弗斯死亡不单独判为胜利。\n\n140点之后为战后收尾阶段：投降结算与66号命令推动剩余进度，不能通过拖延战争进入。"
 situation_foc_republic_origin_palpatine_plot_monthly_change_tooltip:0 "§H每月自动增长：0点。§!\n\n§Y战前与战时计分：上限140点§!\n五次关键抉择：接受商业财团捐助、通过军队组建法案、将可疑账目结案归档、延长紧急权力、拒绝绝地调查；每项有利于帕尔帕廷的选择§G＋20§!，另一选项§Y＋0§!。\n四个固定节点：纳布危机、克隆人军队计划、夸特船坞扩建、科洛桑战役，每项仅记§G＋10§!。\n§H100＋40＝140§!。必须五次全部选择有利选项，且四个节点完成，才能达到140点。没有每月自动增长，重复事件与切换应对方式不会补分。\n\n全选不利或混合选择导致分数不足140时，改走全面占领邦联殖民地的军事路线，不会随时间补分。"
 foc_republic_origin_plot_stage_whispers:0 "议会暗流"
 foc_republic_origin_plot_stage_whispers_desc:0 "紧急权力正在被悄然集中到最高议长手中。"
 foc_republic_origin_plot_stage_whispers_tooltip:0 "0–50点：政治选择与已完成节点计分；不会自动触发克隆人军队计划。\n§Y战前与战时计分：上限140点§!\n五次关键抉择：接受商业财团捐助、通过军队组建法案、将可疑账目结案归档、延长紧急权力、拒绝绝地调查；每项有利于帕尔帕廷的选择§G＋20§!，另一选项§Y＋0§!。\n四个固定节点：纳布危机、克隆人军队计划、夸特船坞扩建、科洛桑战役，每项仅记§G＋10§!。\n§H100＋40＝140§!。必须五次全部选择有利选项，且四个节点完成，才能达到140点。没有每月自动增长，重复事件与切换应对方式不会补分。\n\n全选不利或混合选择导致分数不足140时，改走全面占领邦联殖民地的军事路线，不会随时间补分。"
 foc_republic_origin_plot_stage_clone_army:0 "战时集权"
 foc_republic_origin_plot_stage_clone_army_desc:0 "阴谋由已作出的选择与已完成的剧情节点推进，而非随战争年数增长。"
 foc_republic_origin_plot_stage_clone_army_tooltip:0 "§Y战前与战时计分：上限140点§!\n五次关键抉择：接受商业财团捐助、通过军队组建法案、将可疑账目结案归档、延长紧急权力、拒绝绝地调查；每项有利于帕尔帕廷的选择§G＋20§!，另一选项§Y＋0§!。\n四个固定节点：纳布危机、克隆人军队计划、夸特船坞扩建、科洛桑战役，每项仅记§G＋10§!。\n§H100＋40＝140§!。必须五次全部选择有利选项，且四个节点完成，才能达到140点。没有每月自动增长，重复事件与切换应对方式不会补分。\n\n§Y分离主义投降：两条路线，满足任意一条§!\n§H剧情路线§!：科洛桑战役事件完成＋乌塔堡（乌塔帕）战役事件完成＋帕尔帕廷的阴谋达到140点。\n§H军事路线§!：由游戏实际判定共和国在对邦联的全面战争中获胜，或确认共和国在该战争中彻底消灭邦联，才进入投降收尾。殖民地数量、暂时的控制权或找不到邦联均不单独判胜；维持现状、共和国战败及第三方消灭邦联不算共和国胜利。本路线不要求阴谋140点或两场战役事件。\n全选不利或混合选择导致阴谋不足140点时，必须通过军事路线结束战争，不能靠等待补分。两条路线均接入分日投降结算；杜库与格里弗斯死亡不单独判为胜利。"
 foc_republic_origin_plot_stage_order_66:0 "阴谋就绪"
 foc_republic_origin_plot_stage_order_66_desc:0 "阴谋已达到140点，可配合科洛桑、乌塔堡战役走剧情投降；全面军事征服也可独立结束战争。"
 foc_republic_origin_plot_stage_order_66_tooltip:0 "达到140点后，分离主义普通增援停止，科洛桑剧情突袭不受影响。两场战役事件完成即可走剧情投降；全面占领邦联殖民地的军事路线不要求分数或战役。战争结束后仍按原有分日流程与66号命令完成局势收尾，不回改战时选择。"
