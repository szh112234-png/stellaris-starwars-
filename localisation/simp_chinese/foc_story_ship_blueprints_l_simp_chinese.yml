l_simp_chinese:
 tech_foc_rebel_nebula_blueprint:0 "星云级建造蓝图"
 tech_foc_rebel_nebula_blueprint_desc:0 "在最终秩序覆灭后，新共和国的星云级歼星舰完整设计被移交给银河的光明面守护者。该舰以固定整舰蓝图建造，专属武器和配件不会在舰船设计器中单独开放。"

 tech_foc_rebel_viscount_blueprint:0 "子爵级建造蓝图"
 tech_foc_rebel_viscount_blueprint_desc:0 "新共和国保存的子爵级星际防御舰完整设计。该舰以固定整舰蓝图建造，专属武器和配件不会在舰船设计器中单独开放。"

 tech_foc_jakku_executor_blueprint:0 "执行者级超级歼星舰"
 tech_foc_jakku_executor_blueprint_desc:0 "银河帝国在帝国级歼星舰的工业基础上开发执行者级超级歼星舰。完成这项稀有工程科技后，执行者级完整固定设计将加入船坞；通过贾库残骸考古也可直接取得该蓝图。舰上专属武器和配件仍为隐藏内容，不可单独使用。"

 foc_jakku_executor_wreckage_site:0 "贾库执行者级残骸"
 foc_jakku_executor_wreckage_site_intro:0 "贾库沙海下方散布着超越普通帝国级歼星舰尺寸的巨型金属回波。其中可能埋藏着执行者级超级歼星舰的舰体残段和未损坏的帝国数据库。"

 foc_jakku_executor_site.1.name:0 "沙海下的回波"
 foc_jakku_executor_site.1.desc:0 "科研队用地层扫描仪绘制了坟场的立体图。大量歼星舰残骸在贾库的沙层下彼此堆叠，而最深处一组异常庞大的龙骨结构值得进一步开掘。"
 foc_jakku_executor_site.1.a:0 "锁定深层残骸。"

 foc_jakku_executor_site.2.name:0 "巨舰龙骨"
 foc_jakku_executor_site.2.desc:0 "沙层下的主龙骨和装甲隔舱远超帝国级的规格。舰体编码证实，这些是贾库战役中损毁的执行者级支援结构。一处被多层耐钢包覆的舰桥区段仍保持密封。"
 foc_jakku_executor_site.2.a:0 "打开舰桥区段。"

 foc_jakku_executor_site.3.name:0 "帝国指挥档案"
 foc_jakku_executor_site.3.desc:0 "密封舱内的指挥数据核心大部分已经损坏，但舰体应力模型、能量网格图和船坞生产档案仍可读取。技术人员开始将这些碎片与现场残骸的测绘数据拼合。"
 foc_jakku_executor_site.3.a:0 "重建完整设计。"

 foc_jakku_executor_site.4.name:0 "执行者级重现"
 foc_jakku_executor_site.4.desc:0 "贾库残骸和帝国档案的数据已完成整合。我们现在拥有帝国残余所使用的执行者级超级歼星舰固定建造方案。为避免机密系统流入普通舰船设计，该方案以不可编辑的完整蓝图形式封存。"
 foc_jakku_executor_site.4.a:0 "将执行者级纳入船坞建造序列。"
 foc_jakku_executor_site.4.a.tooltip:0 "获得§Y执行者级重建技术§!，并将帝国残余执行者级的固定蓝图加入舰船列表。专属武器与配件仍保持隐藏，不能单独使用或替换。"
