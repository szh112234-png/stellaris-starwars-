l_simp_chinese:
 SSP_YWING_HANGAR_01_SG_FOC_FIXED_LOWEST:0 "$SSP_YWING_HANGAR_01$"
 SSP_YWING_HANGAR_01_SG_FOC_FIXED_LOWEST_DESC:0 "Y翼专门压制敌舰护盾：对护盾伤害提高50%，不穿透护盾或装甲，对装甲和舰体不再有额外伤害加成。使用轰炸机攻击逻辑优先打击大型舰船。战略打击飞机的补充速度显著降低；战斗中补充会按原生系数进一步减慢。"
