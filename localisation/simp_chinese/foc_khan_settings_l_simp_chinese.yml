 foc_khan_settings.15.name:0 "剧情时间轴起点"
 foc_khan_settings.15.desc:0 "选择§H当前起源路线的星战剧情§!何时开始。共和国起源会在所选年份触发纳布危机，并让后续共和国→帝国→叛军→新共和国→第一秩序/最终秩序按原间隔整体顺延；普通起源会在所选年份放行新共和国/帝国残余的主线与其后的第一秩序危机；第一秩序起源保留开局迁移与基础科技，但血统、抵抗组织、弑星者与凯洛等尚未发生的剧情会从所选年份开始推进。\n\n§Y2200为默认；2250、2300、2400分别延后50、100、200年。§!"
 foc_khan_settings.15.y2200:0 "§G2200年触发（默认）§!"
 foc_khan_settings.15.y2250:0 "§H2250年触发§!"
 foc_khan_settings.15.y2300:0 "§H2300年触发§!"
