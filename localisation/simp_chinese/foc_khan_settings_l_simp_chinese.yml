l_simp_chinese:
 edict_foc_khan_settings_menu_edict: "星球大战MOD设置"
 edict_foc_khan_settings_menu_edict_desc:0 "统一设置星球大战MOD的战斗强度、战略战机、危机舰队数量、天灾触发方式与共和国起源测试功能。"

 foc_khan_settings.10.name: "星球大战MOD设置"
 foc_khan_settings.10.desc:0 "统一的星球大战MOD设置入口。战斗强度与舰队数量保持独立；战略战机强度自动跟随主战斗强度。星战剧情国家的战机阵营与科技由国家身份自动决定；普通起源仍可在战机菜单选择阵营。"
 foc_khan_settings.10.strength: "设置MOD战斗强度"
 foc_khan_settings.10.fighter_settings:0 "星球大战战机设置"
 foc_khan_settings.10.fleet_scale: "设置危机舰队数量"
 foc_khan_settings.10.trigger_settings: "设置天灾触发方式"
 foc_khan_settings.10.republic_origin_test:0 "剧情调试：最高统帅部推演台"
 foc_khan_settings.10.close: "关闭设置"

 foc_khan_settings.11.name:0 "选择战斗强度"
 foc_khan_settings.11.desc:0 "该选项只决定舰船、武器、超级主力舰与危机国家的战斗数值，§Y不再决定舰队数量§!。§G原版档§!会启用此前完成的完整原版化组件与武器平衡，并同步使用原版战机强度；§Y中级档§!使用原有SG/FOC舰船与武器数值，并同步使用SG战机强度；§RACOT级§!在中级装备基础上追加原疯狂档的远古文明级战斗强化，并同步使用BUFF强化战机版本。"
 foc_khan_settings.11.lowest:0 "§G原版档：原版强度§!"
 foc_khan_settings.11.intermediate:0 "§Y中级档：SG / FOC强度§!"
 foc_khan_settings.11.madness:0 "§RACOT级：远古文明级强度§!"

 foc_khan_settings.12.name: "天灾触发设置"
 foc_khan_settings.12.desc:0 "我们可以切断未知区域中的自动触发信号，等待更合适的时机；也可以主动追踪第一秩序，让战争立即开始。已经降临的危机无法被重新封回黑暗。"
 foc_khan_settings.12.disable: "禁止天灾自动触发"
 foc_khan_settings.12.enable: "允许天灾自动触发"
 foc_khan_settings.12.trigger_now: "立即触发天灾（不可撤销）"
 foc_khan_settings.12.already_started: "天灾已经触发，无法再修改触发开关"
 foc_khan_settings.back: "返回上一级"

 foc_khan_settings.13.name:0 "危机初始设置"
 foc_khan_settings.13.desc:0 "这是统一的星球大战MOD初始设置菜单。你可以逐项修改战斗强度、舰队规模和§H完整剧情时间轴起点§!。直接关闭则采用默认配置：§Y中级档战斗强度 + 大型规模增援 + 开放全部战机 + 战机原版模型大小 + 剧情于2200年开始§!。"

 foc_khan_settings.14.name:0 "选择危机舰队规模"
 foc_khan_settings.14.desc:0 "这里不使用百分比重新计算，而是直接沿用当前MOD实际存在的四组舰队数量。旧高级档与疯狂档本来就使用相同数量，因此合并为同一项。主力舰每支规模为§Y7 / 14 / 20 / 27艘§!；现有支援编成、§Y864艘/阵营§!累计上限和§Y360天§!支援周期均保持不变。"
 foc_khan_settings.14.low:0 "§G小型规模§!：FO初始2支×7；支援1×(4帝国级+3复兴级+1曼达托IV级)=8；最终秩序支援1×7"
 foc_khan_settings.14.standard:0 "§Y标准规模§!：FO初始4支×14；支援2×(8帝国级+5复兴级+1曼达托IV级)=28；最终秩序支援2×14=28"
 foc_khan_settings.14.large:0 "§H大型规模§!：FO初始6支×20；支援3×(12帝国级+8复兴级+1曼达托IV级)=63；最终秩序支援3×20=60"
 foc_khan_settings.14.max:0 "§R全面动员§!：FO初始8支×27；支援4×(16帝国级+10复兴级+1曼达托IV级)=108；最终秩序支援4×27=108"

 foc_khan_strength_lowest_first: "原版档：第一秩序"
 foc_khan_strength_lowest_first_desc:0 "第一秩序使用完整原版化的舰船、武器与防御组件数值。"
 foc_khan_strength_lowest_final: "原版档：最终秩序"
 foc_khan_strength_lowest_final_desc:0 "最终秩序使用完整原版化的舰船、武器与防御组件数值。"
 foc_khan_strength_intermediate_first: "中级档：第一秩序"
 foc_khan_strength_intermediate_first_desc:0 "第一秩序使用原有SG/FOC装备强度，但没有ACOT级额外全局强化。"
 foc_khan_strength_intermediate_final: "中级档：最终秩序"
 foc_khan_strength_intermediate_final_desc:0 "最终秩序使用原有SG/FOC装备强度，但没有ACOT级额外全局强化。"
 foc_khan_strength_madness_first: "ACOT级：第一秩序"
 foc_khan_strength_madness_first_desc:0 "第一秩序在SG/FOC装备基础上获得原疯狂档的远古文明级全局战斗强化。"
 foc_khan_strength_madness_final: "ACOT级：最终秩序"
 foc_khan_strength_madness_final_desc:0 "最终秩序在SG/FOC装备基础上获得原疯狂档的远古文明级全局战斗强化。"

