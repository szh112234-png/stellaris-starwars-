 foc_republic_origin.24.desc:0 "§L最高议会仍试图用程序维持秩序，然而战争正在把每一道旧规则推向极限。§!\n\n夸特轨道上的最后一组新船台点亮了导航灯。共和国海军早已拥有少量猎兵级服役舰，但它们始终依赖有限的专用船台与手工装配，无法支撑一场席卷银河的长期战争。\n\n如今，新的标准化生产线终于贯通。猎兵级不再只是中央舰队中屈指可数的重型旗舰——从这一刻起，它将成为共和国真正能够持续补充的战争主力。\n\n§Y固定剧情节点：阴谋＋10，只记录一次。§!\n\n§H先进耐钢装甲§!现已解锁。夸特将获得行星环奖励；没有既有环、施工或废墟时，直接建成配备§H4座船坞§!的§H三级行星环§!。\n\n§H共和国战略打击航空§!现已解锁：获得Delta-7、战略ARC-170及共和国远程航空指挥核心。猎兵固定配置的三座机库改为战略ARC-170，并配备战略航空指挥组。"
 foc_v185_flow.2.desc:0 "§L伊冷深处最后一组聚能阵列已经锁定。没有庆典，只有舰队频道上不断增加的效忠讯号。§!\n\n§H弑星者基地§!正式投入战备。随着这件武器完成，仍然独立存在的§H帝国残余§!舰队、星域与军工体系立即被第一秩序接收。\n\n但银河全面战争尚未开始。第一秩序仍可以把自己的真正实力隐藏在未知星域。§Y第一次弑星者实战开火时，秘密阶段将立即结束：我国将化身天灾，并与全银河进入总力战争。§!\n\n§Y帝国武器研究：§!第一秩序起源须真正完成弑星者基地后，才开放帝国分支武器科技。完成基地不直接授予高级武器，仍需逐项研究；支援战舰保留随舰配装。共用基础武器沿用原有解锁条件。\n\n§H帝国战略打击航空§!现已解锁：第一秩序起源获得帝国战略战机与远程航空指挥核心。此项完工奖励不授予其他高级武器科技。"
 tech_ssp_imperial_hyperspace_desc:0 "建立帝国/第一秩序远程战机投送体系，同时解锁24架编制的标准TIE/LN战机、4架编制的TIE/vn“沉默者”以及帝国远程航空指挥核心。\n\n第一秩序起源在弑星者基地实际建成后获得本科技，工地与在建阶段不算完成。其他高级武器仍须正常研究。"
 tech_ssp_republic_hyperspace_desc:0 "重建旧共和国远程战机投送体系，同时解锁2架编制的Delta-7绝地战机、8架编制的ARC-170重型战机以及共和国远程航空指挥核心。\n\n共和国起源在真正完成夸特扩建计划后获得本科技。帝国与帝国叛军等后续阶段将隐藏共和国战略战机，已研究记录保留。"
