l_simp_chinese:
 sai_supremacy_arkship_construction_site:0 "建造至尊号方舟舰"
 sai_supremacy_arkship_construction_site_DESC:0 "第一秩序的工程舰将在轨道上直接铺设至尊号主骨架，随后扩展船坞、城市与指挥设施，最终唤醒这座横跨六十公里的移动首都。"
 sai_supremacy_arkship_construction_site_MEGASTRUCTURE_DETAILS:0 "§Y工程船直接建造§!：消耗£alloys£ §Y10000§!与£influence£ §Y250§!，耗时§Y1800天§!。完工后，一艘初始战备状态的至尊号将直接加入舰队；帝国可以继续建造更多同型方舟舰。"
 edict_sai_supremacy_arkship_command:0 "至尊号方舟舰指令"
 edict_sai_supremacy_arkship_command_desc:0 "召集最高统帅部，部署一艘新的至尊号、完成其全面战备，或命令现役军事方舟接受至尊号舰体改装。"
 edict_sai_supremacy_arkship_command_effect:0 "开启至尊号最高统帅部指令。"
 sai_supremacy_arkship.19.name:0 "至尊号方舟舰指令"
 sai_supremacy_arkship.19.desc:0 "至尊号不仅是一艘旗舰，也是一座移动首都、造船基地与战争机器。最高统帅部正在等待新的部署命令。"
 sai_supremacy_arkship.19.a:0 "部署初始战备至尊号"
 sai_supremacy_arkship.19.a.tt:0 "在首都星系部署一艘刚刚完成船体与基础设施的至尊号军事方舟。"
 sai_supremacy_arkship.19.b:0 "部署完全战备至尊号"
 sai_supremacy_arkship.19.b.tt:0 "在首都星系部署一艘已经完成武库、护盾、机库与指挥设施的至尊号。"
 sai_supremacy_arkship.19.c:0 "改装现役军事方舟"
 sai_supremacy_arkship.19.c.tt:0 "命令现役及未来的军事方舟采用对应阶段的至尊号舰体。原有殖民地、人口、模块与建筑将继续运转。"
 NAME_SAI_SUPREMACY_ARKSHIP: "至尊号方舟舰"
 NAME_SAI_SUPREMACY_ARKSHIP_TIER_3_FULL: "至尊号军事方舟 III（满装重制型）"
 sai_supremacy_arkship_stats: "至尊号超级舰体"
 sai_supremacy_arkship_stats_desc: "至尊号的超大型舰体、装甲、护盾和方舟设施。"
 SAI_SUPREMACY_ARKSHIP_TIER_1_SECTION: "至尊号主舰体"
 SAI_SUPREMACY_ARKSHIP_TIER_2_SECTION: "至尊号主舰体"
 SAI_SUPREMACY_ARKSHIP_TIER_3_SECTION: "至尊号主舰体"
 SAI_SUPREMACY_LARGE_TURBOLASER: "至尊号重型涡轮激光炮"
 SAI_SUPREMACY_LARGE_TURBOLASER_DESC: "按照第一秩序/最终秩序配件参数整合的远程重型涡轮激光炮。"
 SAI_SUPREMACY_MEDIUM_TURBOLASER: "至尊号中型涡轮激光炮"
 SAI_SUPREMACY_MEDIUM_TURBOLASER_DESC: "用于持续压制主力舰的中口径涡轮激光炮。"
 SAI_SUPREMACY_SMALL_TURBOLASER: "至尊号XX-9涡轮激光炮"
 SAI_SUPREMACY_SMALL_TURBOLASER_DESC: "适合中近距离交战的小型XX-9型涡轮激光炮。"
 SAI_SUPREMACY_POINT_DEFENCE_TURBOLASER: "至尊号点防御涡轮激光炮"
 SAI_SUPREMACY_POINT_DEFENCE_TURBOLASER_DESC: "用于拦截导弹和舰载机的高速跟踪激光炮。"
 SAI_SUPREMACY_TIE_FIGHTER: "至尊号TIE战斗机联队"
 SAI_SUPREMACY_TIE_FIGHTER_DESC:0 "六架TIE战机组成至尊号的标准舰载联队。它们以高速机动和集中火力攻击装甲与舰体，但缺乏应对重型护盾和密集近防火力的能力。"
 SAI_SUPREMACY_LARGE_DURASTEEL_ARMOR: "先进耐钢装甲"
 SAI_SUPREMACY_LARGE_DURASTEEL_ARMOR_DESC: "与护盾和结构再生系统结合的多层耐钢装甲。"
 SAI_SUPREMACY_DEFLECTOR_ARRAY: "偏导防御强化阵列"
 SAI_SUPREMACY_DEFLECTOR_ARRAY_DESC: "强化火控并持续修复舰体、装甲和护盾的辅助阵列。"
 sai_supremacy_arkship_tier_1: "至尊号军事方舟 I"
 sai_supremacy_arkship_tier_2: "至尊号军事方舟 II"
 sai_supremacy_arkship_tier_3: "至尊号军事方舟 III"
 sai_supremacy_arkship_tier_1_plural: "至尊号军事方舟 I"
 sai_supremacy_arkship_tier_2_plural: "至尊号军事方舟 II"
 sai_supremacy_arkship_tier_3_plural: "至尊号军事方舟 III"
 sm_sai_supremacy_hyperspace_tracker_module: "超空间追踪器"
 sm_sai_supremacy_hyperspace_tracker_module_desc: "至尊号舰体深处的主动超空间追踪阵列。它读取舰船跃迁后残留的超空间尾迹，使敌方舰队即使完成跃迁，也会在战略地图上被重新捕获。"
 sai_supremacy_hyperspace_tracker_module: "超空间追踪器"
 sai_supremacy_hyperspace_tracker_module_desc: "至尊号舰体深处的主动超空间追踪阵列。"
 sai_supremacy_hyperspace_tracker_module_tt: "§Y电影式超空间追踪§!：大幅扩展战略传感器与航道探测范围，并提供完整基础情报，使已知帝国的舰队在跃迁后仍能被追踪。\n\n§Y固定轴基系统§!：仅在至尊号升级至§Y军事方舟 III§!后自动安装，不能拆除或替换；普通方舟不受影响。"
 SAI_SUPREMACY_HYPERSPACE_TRACKER_SECTION: "超空间追踪器"

