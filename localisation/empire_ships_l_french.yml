empire_01:0 "SW: Empire"
empire_01_shipset_desc:0 "Built from the ashes of the Republic and reinforced by new generation terrifying ships. The Imperial Navy represents a new era of order and tyranny for the denizens galaxy."

edict_sws_empire_01_addon:0 "Star Wars Empire Ships - Optional Addon Models and Sections"
edict_sws_empire_01_addon_desc:0 "Due to this shipset consisting of more models than there are appropriate roles on the roster, an option has been provided that adds additional player only (the ai cannot and will not use such sections) and relatively balanced ship sections that make use of these extra models. This edict will provide your empire's ship designer with 12 additional ship models making up 2 corvette sections, 4 destroyer sections, 2 cruiser sections, 3 battleship sections and 2 flagship sections (see the mod's Steam page description for what these models are)."

tech_sws_empire_01_addon_sections:0 "Additional Empire Ship Designs"
tech_sws_empire_01_addon_sections_desc:0 "New ship sections and designs intended to help complement our existing roster of vessels."

